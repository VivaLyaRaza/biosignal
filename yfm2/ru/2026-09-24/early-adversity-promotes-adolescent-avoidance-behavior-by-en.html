            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"271\" cy=\"93\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"549\" cy=\"223\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как детские стрессы&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;перестраивают мозг и&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;усиливают страх&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f1.jpg\" alt=\"Рисунок 1. ELA усиливает поведение избегания угрозы у подростков и лежащую в его основе активность BLA. (a) Протокол LBN\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 1. ELA усиливает поведение избегания угрозы у подростков и лежащую в его основе активность BLA. (a) Протокол LBN. (b) Распределение материнского поведения при LBN по сравнению со стандартным выращиванием (SR) (SR, n=4; LBN, n=6 матерей) (критерий хи-квадрат ꭓ2(4,27), p&amp;lt;0.0001). (c) Процент времени, проводимого матерями в гнезде (двухвыборочный t-критерий Стьюдента F3,5=6.51, p=0.028). (d) Вес детенышей в постнатальный день (P)12, P21, P35 (SR, n=16 детенышей/4 помёта, LBN, n=15 детенышей/6 помётов; двухфакторный дисперсионный анализ с повторными измерениями и апостериорным критерием Бонферрони: эффект возраста F1.51,43.92 = 736.4, P&amp;lt;0.0001; эффект выращивания F1,29 = 3.53, P=0.071; взаимодействие F1.51,43.92 = 0.1949, P = 0.762, скрипичные диаграммы отображают медиану и квартили). (e) Протокол избегания, опосредованного платформой (PMA). (f) Доля успешных попыток в среднем по группам из 3 тонов (SR, n=18; LBN, n=19 мышей; двухфакторный дисперсионный анализ с повторными измерениями и апостериорным критерием Сидака: эффект попытки F2.29,80.10 = 40.84, P&amp;lt;0.0001; эффект выращивания F1,35 = 0.22, P=0.645; взаимодействие F2.29,80.10 = 0.55, P = 0.605). (g) Представительные примеры местоположения мышей в виде тепловых карт во время извлечения PMA. (h) Средняя доля времени на платформе во время звукового сигнала при извлечении (двухвыборочный t-критерий F17,18=1.71, P=0.006). (i) Средняя доля времени, проведенного в состоянии замирания во время звукового сигнала при извлечении (двухвыборочный t-критерий F17,18=2.32, p=0.888). (j-t) Волоконная фотометрия в BLA во время обучения и извлечения PMA (SR, n=8; LBN, n=5 мышей). (j) Схематичное изображение и примеры снимков экспрессии GCaMP6s и имплантата оптоволокна в BLA. (k) Доля успешных попыток во время обучения PMA у животных для фотометрии (SR, n=8; LBN, n=5 мышей) (двухфакторный ANOVA: эффект попытки F1,11=30.09, P=0.0002; эффект выращивания F1,12=0.09, P=0.77; эффект взаимодействия F1,11=1.45, P=0.254). (l) Доля времени на платформе во время извлечения PMA у животных для фотометрии (двухвыборочный t-критерий F7,4=8.10, P=0.016). (m) Среднее изменение флуоресценции (z-оценка) активности BLA в периоды звуковых сигналов, когда мышь получала удар током во время обучения PMA. (n) Количественная оценка площади под кривой (AUC) во время удара током и в течение 13 секунд после него (двухвыборочный t-критерий F4,7=1.07, P=0.024). (o) Количественная оценка пиковой флуоресценции во время удара током (двухвыборочный t-критерий F7,4=5.10, P=0.829). (p) Количественная оценка скорости затухания (в секундах) экспоненциальной кривой, подогнанной к возврату к исходному уровню после удара током (двухвыборочный t-критерий F4,7=33.56, P=0.0026). (q) Среднее изменение флуоресценции (z-оценка) активности BLA в ответ на начало звукового сигнала, когда мышь находилась вне платформы. (r) Количественная оценка AUC в течение 3 секунд после начала звукового сигнала (двухвыборочный t-критерий F4,7=4.36, P=0.037). (s) Количественная оценка пикового ответа в течение 3 секунд после начала звукового сигнала (двухвыборочный t-критерий F4,7=5.06, P=0.092). (t) Корреляция между AUC и долей времени на платформе во время звукового сигнала (линейная регрессия SR: F1,6=1.44, P=0.276, LBN: F1,3=66.41, P=0.004). Все точки данных представляют биологические повторности. Данные представлены как среднее ± стандартная ошибка среднего, а затенение отражает стандартную ошибку между субъектами; *P&amp;lt;0.05, *&lt;em&gt;P&amp;lt;0.01. Треугольники обозначают самцов, а круги — самок.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Неблагоприятные условия в раннем возрасте часто приводят к тому, что в подростковом периоде человек начинает острее реагировать на опасности. Исследователи на мышиной модели выяснили, какие именно нейронные пути отвечают за это изменение. Оказалось, что дело в повышенной активности возбуждающих клеток, связывающих префронтальную кору и миндалину. Интересно, что во взрослом возрасте эти же нейронные контуры уже не вызывают такого поведения.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ранний стресс усиливает избегание угроз у подростков без общего роста тревожности&lt;/li&gt;\n&lt;li&gt;Утрата контроля над возбуждающим путем от коры к миндалине меняет поведение&lt;/li&gt;\n&lt;li&gt;Оптогенетическое подавление этих нейронов устраняет последствия стресса&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Ранний жизненный стресс (Early life adversity, ELA), включая отсутствие заботы или нестабильную обстановку в семье, затрагивает почти шестьдесят процентов людей по всему миру и повышает риск тревожных расстройств. Чтобы понять механизмы этого процесса, ученые использовали модель ограниченного количества подстилочного материала и гнезд (limited bedding and nesting, LBN), которая имитирует дефицитные ресурсы для мышей в период с четвертого по одиннадцатый дни жизни. В подростковом возрасте животные проходили тест на избегание угроз с помощью платформы (Platform Mediated Avoidance, PMA), где звук предсказывал удар током. С помощью волоконной фотометрии исследователи регистрировали кальциевую активность в базолатеральной миндалине (basolateral amygdala, BLA).&lt;/p&gt;\n&lt;p&gt;Выяснилось, что мыши, перенесшие ELA в детстве, демонстрировали значительно более высокий уровень избегания угрозы при звуковом сигнале, хотя сама способность к обучению у них не нарушалась. Сигналы из динамика вызывали у таких животных более мощный ответ в миндалине. Картирование мозга и метод гибридизации in situ (RNAscope) показали, что за это отвечает специфический путь: глутаматергические нейроны, экспрессирующие кортикотропин-рилизинг-гормон (CRH) в вентромедиальной префронтальной коре (vmPFC), проецируются на BLA. У стрессированных мышей этот путь усиливался, а оптогенетическое подавление данных нейронов возвращало поведение к норме.&lt;/p&gt;\n&lt;p&gt;Ученые подчеркивают, что обнаруженный эффект носит строго возрастной характер. Те же самые манипуляции с нейронными путями не приводили к изменениям в поведении взрослых мышей. Это указывает на то, что CRH-позитивные нейроны в префронтальной коре играют роль ключевого эффектора в раннем онтогенезе, определяя уязвимость к психическим расстройствам именно в период перестройки эмоциональных схем мозга в подростковом возрасте.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа выполнена на лабораторных мышах, поэтому прямая экстраполяция на человеческий мозг требует дополнительных клинических подтверждений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Ранние неблагоприятные воздействия (РНВ) оказывают долгосрочное влияние на функционирование цепей регуляции эмоций. Воздействие жестокого обращения, пренебрежения или нестабильности в семье в раннем возрасте связано со стойкими изменениями в оценке угроз и реагировании на них, которые являются характерными признаками расстройств настроения и тревожных расстройств. Эти изменения часто проявляются в подростковом возрасте и характеризуются чрезмерным избеганием, которое ограничивает участие в приносящей вовлеченности в поощряющий опыт.&lt;/p&gt;\n&lt;p&gt;Тем не менее, нейроразвивающие механизмы, связывающие РНВ с усилением реакций на угрозу, остаются неясными. Мы выделили чувствительный к стрессу путь от медиальной префронтальной коры (mPFC) к базолатеральной миндалине, который совместно экспрессирует кортикотропин-рилизинг-гормон (CRH) и глутамат. Мы установили, что РНВ укрепляет этот путь и усиливает поведение избегания угрозы в подростковом возрасте.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ранние неблагоприятные воздействия укрепляют путь mPFC-базолатеральная миндалина, экспрессирующий CRH и глутамат, что приводит к избыточному избеганию угроз у подростков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оптогенетическое торможение и возрастное подавление экспрессии CRH в этом пути устраняют вызванное РНВ повышение показателей избегания у подростков, тогда как общее снижение экспрессии CRH в mPFC у мышей при стандартном уходе воспроизводит фенотипы РНВ. Те же манипуляции не вызывали никаких поведенческих эффектов у взрослых особей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптогенетика — это метод управления нейронами с помощью света, позволяющий включать или выключать определенные клетки в мозге.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В совокупности наши результаты показывают, что специфичная для типов клеток сигнализация CRH регулирует пластичность развивающихся нейронных цепей, смещая функцию эмоциональных цепей и потенциально способствуя предрасположенности к психическим расстройствам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выводы получены на моделях грызунов; результаты требуют осторожности при экстраполяции на человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Ранние неблагоприятные факторы (ELA), включающие пренебрежение, жестокое обращение, насилие или нестабильную домашнюю обстановку, затрагивают почти 60% людей во всем мире. Хотя ELA может быть кратковременным, он вызывает стойкие изменения в развитии и функционировании систем эмоциональной сферы мозга, в том числе в том, как индивиды оценивают экологические угрозы и реагируют на них. В связи с этим ELA является основным фактором риска развития психических расстройств, включая тревогу и депрессию. Эти расстройства часто возникают в подростковом возрасте — критический период развития мозга, когда исследование среды и опыт формируют поздно развивающиеся когнитивные и эмоциональные системы посредством пластичности, зависящей от активности. Расстройства настроения и тревожные расстройства характеризуются повышенным избеганием угроз, что может нарушать созревание нейронных сетей и препятствовать целенаправленному поведению. Несмотря на это, большинство механистических исследований ELA сосредоточено на последствиях у взрослых, а процессы развития, связывающие ELA с последующими поведенческими изменениями, остаются плохо изученными. Эта информация в конечном итоге может помочь нам выявлять, предотвращать и лечить симптоматику психических расстройств у групп населения из групп риска.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Неблагоприятные факторы в раннем возрасте (ELA) затрагивают до 60% людей и служат ключевым фактором риска тревожных и депрессивных расстройств, возникающих в подростковом возрасте из-за нарушения созревания нейронных сетей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Лимбическая система, которая обрабатывает эмоциональные стимулы и регулирует обучение и принятие решений, особенно чувствительна к неблагоприятным факторам из-за высокой экспрессии рецепторов гормонов стресса. Она также дисрегулирована при психических расстройствах. Исследования нейровизуализации человека показывают, что ELA изменяет активность лимбической системы и функциональную связность, особенно между медиальной префронтальной корой (mPFC) и базолатеральной миндалиной (BLA). Хотя некоторые из этих изменений коррелируют с дезадаптивными реакциями на угрозу, отсутствие причинно-следственных доказательств оставляет ключевые пробелы в понимании того, как ELA нарушает развитие соответствующих мозговых цепей, приводя к преувеличенному избеганию угроз. Поскольку поведение возникает в результате скоординированной активности специфических нейронных сетей в мозге, выявление изменений на уровне клеточных типов и нейросетей, лежащих ниже по течению от ELA, в конечном итоге раскроет механизмы, посредством которых ELA влияет на когнитивное и эмоциональное поведение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Базолатеральная миндалина (BLA) и медиальная префронтальная кора (mPFC) — ключевые структуры мозга, отвечающие за обработку эмоций, оценку страха и контроль поведения, чья связность нарушается при стрессе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Молекулы, чувствительные к стрессу, такие как кортиколиберин (CRH), обогащены в специфических популяциях лимбических клеток и могут связывать ELA со стойкими поведенческими изменениями. Большинство исследований были сосредоточены на CRH в гипоталамусе, где он регулирует стрессовую реакцию организма. Однако CRH также высоко экспрессируется в ключевых центрах регуляции эмоций, включая mPFC, гиппокамп, центральное ядро миндалевидного тела (CeA) и ядро ложа полосатого тела (BNST). ELA изменяет как экспрессию CRH в этих регионах, так и функцию нейронов, экспрессирующих CRH. CRH в основном экспрессируется в гамма-аминомасляничноверных (ГАМКэргических) клетках и передает сигналы через свои родственные рецепторы — рецепторы кортиколиберина 1 и 2 — для стимуляции пластичности в целевых нейронах. Снижение активности CRH посредством нокдауна гена или фармакологического ингибирования рецепторов в CeA, BNST и гиппокампе соответственно устраняет вызванные ELA ангедонию, тревожно-подобное поведение и дефицит памяти. Кроме того, ингибирование CRH-экспрессирующих клеток CeA предотвращает вызванное ELA увеличение реакций испуга и дезадаптивное поведение вознаграждения во взрослом возрасте.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные получены преимущественно на животных моделях; прямое проецирование результатов на человека требует осторожности из-за сложности человеческой психики.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В совокупности эти данные подчеркивают CRH как эффектор, запускающий нейропластичность, индуцированную стрессом, и как маркер стресс-чувствительных путей, способствующих долгосрочным последствиям ELA. Тем не менее, наше понимание того, как вызванные ELA изменения в системе CRH влияют на развитие мозга, остается ограниченным — особенно в пределах цепей, поддерживающих сложные реакции на угрозу, включая поведение избегания, которое является центральным для тревожных расстройств. Большинство исследований эффектов ELA на систему CRH были сосредоточены исключительно на взрослых. Кроме того, многие из этих исследований, в которых проводилось широкое манипулирование CRH или экспрессией рецепторов, давали противоречивые результаты, подчеркивая необходимость исследований функции цепей CRH с разрешением на уровне регионов и типов клеток. Выявление того, как ELA уникально влияет на специфические цепи CRH в развивающемся мозге, может стать основой для разработки более эффективных вмешательств при психических заболеваниях, учитывающих биологию конкретного возраста.&lt;/p&gt;\n&lt;p&gt;Используя мышиную модель ELA, мы наблюдали повышенное поведение избегания угроз в подростковом возрасте, которое коррелировало с повышенной активностью BLA. Картирование CRH по всему мозгу показало, что ELA индуцирует селективное снижение числа CRH+ нейронов в вентромедиальной (vm) PFC у подростков. В соответствии с этим, нокдаун CRH во всей vmPFC на более ранних этапах развития воспроизводит фенотипы ELA у подростков мышей с обычным воспитанием. Используя картирование вирусных цепей и метод пэтч-кламп (patch clamp), мы выделили глутаматергическую популяцию нейронов, экспрессирующих CRH, которая проецируется из vmPFC в BLA и потенцируется после ELA. Метод RNAscope показал, что, хотя ELA уменьшает количество неглутаматергических CRH+ клеток vmPFC, он стимулирует более высокую экспрессию CRH в глутаматергической популяции CRH+. В соответствии с этим оптогенетическое ингибирование пути глутаматергических нейронов vmPFCCRH+→BLA устраняет вызванное ELA повышение избегания угроз у подростков. Аналогичным образом, нокдаун CRH избирательно в возбуждающих клетках vmPFC приводит к уменьшению избегания и активности BLA у подростковых мышей с ELA. Во взрослом возрасте эти манипуляции не оказывали никакого эффекта, подчеркивая ограниченную возрастом роль этого пути в стимуляции повышенного избегания после неблагоприятных воздействий. В совокупности эти данные предполагают, что CRH в vmPFC функционирует как ранний постнатальный эффектор после ELA, действуя специфичным для клеточного типа образом и индуцируя пластичность в возбуждающем, CRH-экспрессирующем пути vmPFC–BLA. Выясняя, как ELA преобразует активность в ранее неописанном глутаматергическом пути, экспрессирующем CRH, эта работа дает механистическое понимание того, как ELA изменяет поведение подростков, и может способствовать разработке стратегий по снижению риска психических заболеваний.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование на мышах показало, что ELA вызывает специфическую потерю и перестройку CRH-нейронов в вентромедиальной префронтальной коре, а оптогенетическое подавление пути vmPFC–BLA обращает вспять подростковое поведение избегания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"rannij-zhiznennyj-stress-usilivaet-povedenie-izbeganiya-ugrozy-v-podrostkovom-vozraste-i-soputstvuyushuyu-aktivnost-bazolateralnogo-yadra-mindaliny-bla\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#rannij-zhiznennyj-stress-usilivaet-povedenie-izbeganiya-ugrozy-v-podrostkovom-vozraste-i-soputstvuyushuyu-aktivnost-bazolateralnogo-yadra-mindaliny-bla\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ранний жизненный стресс усиливает поведение избегания угрозы в подростковом возрасте и сопутствующую активность базолатерального ядра миндалины (BLA)&lt;/span&gt;&lt;/a&gt;Ранний жизненный стресс усиливает поведение избегания угрозы в подростковом возрасте и сопутствующую активность базолатерального ядра миндалины (BLA)&lt;/h4&gt;\n&lt;p&gt;Лимбические области, включая медиальную префронтальную кору (mPFC) и BLA, регулируют поведение избегания угрозы у взрослых. Эти цепи претерпевают выраженную перестройку в подростковом возрасте, что вносит вклад в возрастные изменения поведения избегания угрозы. По сравнению со взрослыми, подростки мышей обычно демонстрируют более низкие уровни избегания угрозы, отдавая предпочтение исследованию. Ранний жизненный стресс (ELA) усиливает реакции на угрозу как у грызунов, так и у людей — эффект, который коррелирует с повышением активности BLA. Однако оставалось неизвестным, как ELA изменяет заученные реакции на избегаемые угрозы и какие клеточные и молекулярные механизмы лежат в основе этих изменений. Мы предположили, что вызванные ELA изменения в лимбических цепях будут наиболее выражены в подростковом возрасте, стимулируя поведенческие изменения в это окно развития, когда обычно возникают психические симптомы тревоги и депрессии, включая повышенные реакции на угрозу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ELA избирательно усиливает реакции избегания угрозы и активность BLA в подростковом возрасте, создавая основу для понимания раннего возникновения тревожных расстройств.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки этой гипотезы мы использовали модель ограничения подстилки и материалов для гнездования (LBN) для индукции ELA. Модель LBN имитирует среду с дефицитом ресурсов за счет уменьшения количества материалов для гнездования матери и отделения мышей от подстилки с помощью сетчатого пола из проволоки (Рис. 1a). Это провоцирует фрагментарный и непредсказуемый материнский уход в критический период развития (с постнатального дня (P)4 по P11). В этот период матери из группы LBN тратили меньше времени на кормление и больше времени проводили в одиночестве (Рис. Б), что приводило к общему снижению времени пребывания в гнезде (Рис. 1c). Детеныши LBN также весили меньше контрольных мышей стандартного выращивания (SR) в день P12, однако к моменту отъема от матери эти различия уже не наблюдались (Рис. 1d).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f1.jpg\" alt=\"Рисунок 1. ELA усиливает поведение избегания угрозы у подростков и лежащую в его основе активность BLA. (a) Протокол LBN\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 1. ELA усиливает поведение избегания угрозы у подростков и лежащую в его основе активность BLA. (a) Протокол LBN. (b) Распределение материнского поведения при LBN по сравнению со стандартным выращиванием (SR) (SR, n=4; LBN, n=6 матерей) (критерий хи-квадрат ꭓ2(4,27), p&amp;lt;0.0001). (c) Процент времени, проводимого матерями в гнезде (двухвыборочный t-критерий Стьюдента F3,5=6.51, p=0.028). (d) Вес детенышей в постнатальный день (P)12, P21, P35 (SR, n=16 детенышей/4 помёта, LBN, n=15 детенышей/6 помётов; двухфакторный дисперсионный анализ с повторными измерениями и апостериорным критерием Бонферрони: эффект возраста F1.51,43.92 = 736.4, P&amp;lt;0.0001; эффект выращивания F1,29 = 3.53, P=0.071; взаимодействие F1.51,43.92 = 0.1949, P = 0.762, скрипичные диаграммы отображают медиану и квартили). (e) Протокол избегания, опосредованного платформой (PMA). (f) Доля успешных попыток в среднем по группам из 3 тонов (SR, n=18; LBN, n=19 мышей; двухфакторный дисперсионный анализ с повторными измерениями и апостериорным критерием Сидака: эффект попытки F2.29,80.10 = 40.84, P&amp;lt;0.0001; эффект выращивания F1,35 = 0.22, P=0.645; взаимодействие F2.29,80.10 = 0.55, P = 0.605). (g) Представительные примеры местоположения мышей в виде тепловых карт во время извлечения PMA. (h) Средняя доля времени на платформе во время звукового сигнала при извлечении (двухвыборочный t-критерий F17,18=1.71, P=0.006). (i) Средняя доля времени, проведенного в состоянии замирания во время звукового сигнала при извлечении (двухвыборочный t-критерий F17,18=2.32, p=0.888). (j-t) Волоконная фотометрия в BLA во время обучения и извлечения PMA (SR, n=8; LBN, n=5 мышей). (j) Схематичное изображение и примеры снимков экспрессии GCaMP6s и имплантата оптоволокна в BLA. (k) Доля успешных попыток во время обучения PMA у животных для фотометрии (SR, n=8; LBN, n=5 мышей) (двухфакторный ANOVA: эффект попытки F1,11=30.09, P=0.0002; эффект выращивания F1,12=0.09, P=0.77; эффект взаимодействия F1,11=1.45, P=0.254). (l) Доля времени на платформе во время извлечения PMA у животных для фотометрии (двухвыборочный t-критерий F7,4=8.10, P=0.016). (m) Среднее изменение флуоресценции (z-оценка) активности BLA в периоды звуковых сигналов, когда мышь получала удар током во время обучения PMA. (n) Количественная оценка площади под кривой (AUC) во время удара током и в течение 13 секунд после него (двухвыборочный t-критерий F4,7=1.07, P=0.024). (o) Количественная оценка пиковой флуоресценции во время удара током (двухвыборочный t-критерий F7,4=5.10, P=0.829). (p) Количественная оценка скорости затухания (в секундах) экспоненциальной кривой, подогнанной к возврату к исходному уровню после удара током (двухвыборочный t-критерий F4,7=33.56, P=0.0026). (q) Среднее изменение флуоресценции (z-оценка) активности BLA в ответ на начало звукового сигнала, когда мышь находилась вне платформы. (r) Количественная оценка AUC в течение 3 секунд после начала звукового сигнала (двухвыборочный t-критерий F4,7=4.36, P=0.037). (s) Количественная оценка пикового ответа в течение 3 секунд после начала звукового сигнала (двухвыборочный t-критерий F4,7=5.06, P=0.092). (t) Корреляция между AUC и долей времени на платформе во время звукового сигнала (линейная регрессия SR: F1,6=1.44, P=0.276, LBN: F1,3=66.41, P=0.004). Все точки данных представляют биологические повторности. Данные представлены как среднее ± стандартная ошибка среднего, а затенение отражает стандартную ошибку между субъектами; *P&amp;lt;0.05, *&lt;em&gt;P&amp;lt;0.01. Треугольники обозначают самцов, а круги — самок.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Для оценки изменений поведения избегания угрозы в подростковом возрасте (P33–37) мы использовали тест избегания на платформе (PMA), в котором мыши учатся перемещаться на платформу во избежание удара током, сигнализируемого звуковым сигналом (Рис. 1e). Емкости с запахом, помещенные вне досягаемости под решеткой с током, стимулировали исследование камеры. Хотя мыши LBN демонстрировали немного сниженную чувствительность к удару током (Рис. SN 1a), это не повлияло на их способность обучаться в тесте PMA. Обе группы достигли схожих уровней результативности к концу обучения, что оценивалось по доле успешных попыток и времени нахождения на платформе во время звукового сигнала (Рис. 1f, Рис. SN 1b). Напротив, во время сеанса извлечения памяти об угрозе на следующий день мыши LBN проводили значительно больше времени на платформе во время звукового сигнала (Рис. 1g,h), склоняясь к тому, чтобы затрачивать меньше времени на вход на платформу после начала звукового сигнала (Рис. SN 1c). Важно отметить, что уровни замирания (freezing) между группами не различались (Рис. 1i), что указывает на то, что увеличение времени нахождения на платформе было обусловлено не усилением замирания в этом месте или более сильной ассоциацией «звук-шок», а различиями в поведении избегания, управляемом угрозой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тест PMA (Platform Mediated Avoidance) — поведенческий метод, где грызуны учатся спасаться от звукового сигнала, предваряющего удар током, убегая на специальную платформу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы определить, было ли усиление PMA вызвано повышенным тревожным поведением у мышей LBN, мы использовали тесты «открытое поле» и «приподнятый крестообразный лабиринт» (Рис. SN 1d,e). Эти тесты измеряют, сколько времени мыши проводят на открытых участках установки, имитируя места, где они более уязвимы для хищников. Мы не обнаружили связанных с условиями выращивания поведенческих изменений в этих тестах, что предполагает: ELA индуцирует специфичные для обучения изменения в реагировании на угрозу, а не более общие проявления тревожного поведения. Различий в тесте с новым запахом также не наблюдалось, что свидетельствует о том, что ELA не влияет на исследовательскую мотивацию, а усиливает избегание конкретно тогда, когда исследование несет потенциальную угрозу или издержки (Рис. SN 1f).&lt;/p&gt;\n&lt;p&gt;Чтобы оценить, как ELA может изменять активность BLA, лежащую в основе избегания угрозы у подростков мышей, мы использовали волоконную фотометрию для измерения общей кальциевой флуоресценции как суррогата нейронной активности во время обучения и извлечения памяти в PMA (Рис. 1j). После регистрации PMA у всех животных была подтверждена корректная экспрессия вируса и правильное расположение оптоволокна (Рис. SN 2a). В обеих группах наблюдались схожие уровни обучения, в то время как мыши LBN демонстрировали значительно повышенное избегание во время извлечения памяти (Рис. 1k,l). Во время ударов током группы SR и LBN демонстрировали болевые ответы сопоставимой амплитуды (Рис. 1m). Однако у мышей LBN эти ответы возвращались к исходному уровню медленнее, что приводило к общему увеличению вызванной шоком Ca2+ активности по сравнению с контролем SR (Рис. 1n-p). Во время извлечения памяти ответ на начало звукового сигнала в группе LBN был значительно выше, чем в контроле, особенно когда животные находились вне платформы и угроза была неминуема (Рис. 1q-s). У мышей LBN (но не в контроле) уровни избегания надежно коррелировали с этим ответом на начало звукового сигнала (Рис. 1t), что предполагает: связанная со звуком активность BLA прочно кодирует избегание сигнальной угрозы у мышей LBN, но не у контрольных животных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые клеточные и поведенческие изменения получены на мышиных моделях ELA, поэтому прямая экстраполяция на человеческую патологию требует осторожности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В дополнительных группах мышей мы далее исследовали клеточные и синаптические изменения, которые могут лежать в основе повышенной активности BLA у мышей LBN. Сначала мы измерили уровни экспрессии фосфорилированного белка, связывающего элемент ответа на цАМФ (pCREB), — фактора транскрипции, связанного с возбудимостью нейронов. У мышей LBN уровни экспрессии pCREB были существенно повышены, несмотря на отсутствие изменений в количестве клеток BLA и отсутствие различий в обучении PMA (Рис. SN 2b-e). Затем мы зарегистрировали спонтанные возбуждающие и тормозные постсинаптические токи (sEPSC и sIPSCs соответственно) нейронов BLA на острых срезах мозга (Рис. SN 2f-h). У мышей LBN наблюдалась общая тенденция к более высокой частоте sEPSC и значительно более высокая доля sEPSC с большой амплитудой (Рис. SN 2i), что указывает на то, что LBN приводит к усилению возбуждающего синаптического входа на нейроны BLA. Напротив, мы не обнаружили изменений в IPSC (Рис. SN 2j), что свидетельствует о специфичности эффектов LBN именно для возбуждающих синапсов. В совокупности эти результаты показывают, что ELA может усиливать активность BLA во время избегания угрозы в подростковом возрасте за счет повышения возбудимости нейронов и возбуждающего синаптического входа.&lt;/p&gt;\n&lt;h4 id=\"snizhenie-urovnya-crh-v-vmpfc-svyazano-s-usilennym-izbeganiem-ugrozy-v-podrostkovom-vozraste\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#snizhenie-urovnya-crh-v-vmpfc-svyazano-s-usilennym-izbeganiem-ugrozy-v-podrostkovom-vozraste\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Снижение уровня CRH в vmPFC связано с усиленным избеганием угрозы в подростковом возрасте&lt;/span&gt;&lt;/a&gt;Снижение уровня CRH в vmPFC связано с усиленным избеганием угрозы в подростковом возрасте&lt;/h4&gt;\n&lt;p&gt;CRH выступает центральным медиатором стресса и обработки информации об угрозе. Инфузия CRH в BLA усиливает активацию возбудительных популяций и улучшает формирование следов страха, а стресс влияет на активность рецепторов CRH в BLA. Тем не менее, сам BLA экспрессирует лишь небольшое количество CRH, что указывает на внешнее происхождение измененного высвобождения CRH, хотя остается неясным, как ранний жизненный опыт (ELA) влияет на экспрессию CRH в областях, проецирующихся в BLA, в подростковом возрасте.&lt;/p&gt;\n&lt;p&gt;Чтобы систематически изучить влияние ELA на популяции CRH в головном мозге подростков, мы скрестили мышей линий CRH-Cre и Ai14 (репортерная линия), благодаря чему все нейроны CRH оказались помечены красным флуорофором (tdTomato). После воздействия LBN или SR мы использовали просветление тканей целого мозга, иммуномечение и светолистовую микроскопию для количественной оценки числа клеток, экспрессирующих CRH (CRH+), во всех областях мозга для каждой группы выращивания (Рис. 2a). Согласуясь с предыдущей литературой, мы обнаружили плотные скопления CRH+ клеток в CeA, пириформной коре (PIR), BNST и гипоталамусе (Рис. 2b). Мы оценили изменения плотности CRH+ клеток в областях, известных своими наиболее мощными проекциями в BLA, и наблюдали избирательное снижение плотности CRH+ клеток в vmPFC (Рис. 2c, Таблица SN 1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f2.jpg\" alt=\"Рисунок 2. Снижение уровня CRH в vmPFC связано с повышенным избеганием угрозы в подростковом возрасте (a-c), Анализ изме\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 2. Снижение уровня CRH в vmPFC связано с повышенным избеганием угрозы в подростковом возрасте (a-c), Анализ изменений популяций CRH+ клеток у подростков из групп SR и LBN. (a) Конвейер анализа DeepCOUNT для количественной оценки плотности CRH+ клеток во всем головном мозге (SR, n=6; LBN, n=7 мышей). (b) Точечные диаграммы, отражающие плотность CRH+ нейронов по вокселям у подростков из групп SR (серый) и LBN (красный). (c) Сравнение плотности CRH+ клеток в 6 областях проекций на BLA, где присутствовали ретроградно меченные CRH+ клетки, включая dmPFC, vmPFC, PIR, группу ядер средней линии дорсального таламуса (MTN), TEa и ECT (двухфакторный дисперсионный анализ с повторными измерениями и апостериорным тестом Сидака: эффект области F2.18,23.93 = 41.53, P&amp;lt;0.0001; эффект выращивания F1,11 = 2.15, P=0.171; взаимодействие F2.18,23.93 = 2.00, P=0.1544). (d) Экспериментальный график и изображение AAV-shRNA нокдауна экспрессии Crh в vmPFC (SR: скрембл, n=10; shRNA, n=14; LBN: скрембл, n=10, shRNA, n=12 мышей). (e) Доля успешных попыток во время обучения PMA в среднем для исходного уровня до шока и последних четырех тонов сеанса (трехфакторный дисперсионный анализ: эффект попытки F1,42=20.58, P&amp;lt;0.0001; эффект выращивания F1,42=10.16, P=0.0027; эффект нокдауна F1,42=0.098, P=0.756; эффект попытка × выращивание F1,42=0.013, P=0.909; эффект попытка × нокдаун F1,42=0.47, P=0.50; эффект выращивание × нокдаун F1,42=0.803, P=0.375; эффект попытка × выращивание × нокдаун F1,42=0.417, P=0.522). (f-h), Поведенческие показатели во время воспроизведения PMA. (f) Доля времени на платформе в среднем за сеанс (двухфакторный дисперсионный анализ с апостериорным тестом Тьюки: эффект нокдауна F1,42=3.37, P=0.074; эффект выращивания F1,42=22.81, P&amp;lt;0.0001; эффект взаимодействия F1,42=7.88, P=0.0075). (g) Латентность входа на платформу после начала звукового сигнала (двухфакторный дисперсионный анализ с апостериорным тестом Тьюки: эффект нокдауна F1,42=9.03, P=0.0045; эффект выращивания F1,42=4.98, P=0.031; эффект взаимодействия F1,42=6.46, P=0.015). (h) Доля времени замирания в среднем за сеанс (двухфакторный дисперсионный анализ с апостериорным тестом Тьюки: эффект нокдауна F1,42=0.029, P=0.867; эффект выращивания F1,42=3.60, P=0.0646; эффект взаимодействия F1,42=6.06, P=0.018). Все точки данных представляют биологические повторности. Данные представлены как среднее ± стандартная ошибка среднего (s.e.m.), а затенение отражает стандартную ошибку среднего между субъектами; *P&amp;lt;0.05, **P&amp;lt;0.01, ***P&amp;lt;0.001, ***&lt;em&gt;P&amp;lt;0.0001. Треугольники обозначают самок, а круги обозначают самцов.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ранний жизненный опыт (ELA) вызывает избирательное снижение плотности клеток, экспрессирующих CRH, в вентромедиальной префронтальной коре (vmPFC).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы определить, вовлечена ли сигнализация CRH в vmPFC в поведение избегания угрозы, мы использовали короткую шпилечную РНК (shRNA) для локального нокдауна экспрессии Crh (Рис. 2d). Плотность CRH+ нейронов в vmPFC драматически возрастает в период между P7 и P21, особенно в слоях 2/3, которые служат основным источником нейронов, проецирующихся в BLA. Поэтому мы провели инфузию нашей shRNA примерно в P19, чтобы совпасть с этим пиком развития. Мы подтвердили нокдаун с помощью гибридизации in situ для количественной оценки экспрессии мРНК Crh. Клетки vmPFC CRH+, коэкспрессирующие анти-Crh shRNA и mCherry, продемонстрировали значительное снижение интенсивности метки Crh по сравнению с mCherry+ клетками, экспрессирующими скремблированный контроль (Рис. SN 3a). Мы подтвердили вирусное таргетирование областей с помощью гистологии у каждой мыши (Рис. SN 3b).&lt;/p&gt;\n&lt;p&gt;Снижение экспрессии Crh в vmPFC, начиная с ювенильного возраста, не повлияло на способность подростковых мышей к обучению в тесте PMA (Рис. 2e). Тем не менее, специфичный для vmPFC нокдаун Crh у контрольных животных из группы SR привел к значительному увеличению времени на платформе и уменьшению латентного периода входа на платформу во время звукового сигнала без влияния на замирание (Рис. 2f-h). Эти результаты показывают, что возрастное снижение уровня CRH в vmPFC фенокопирует поведение, подобное ELA, в подростковом возрасте. Мы не наблюдали изменений избегания во время воспроизведения в группе LBN (Рис. 2f-h), что предполагает способность LBN нивелировать эффекты нокдауна Crh путем задействования того же механизма. Мыши из группы LBN имели тенденцию к усилению замирания по сравнению с контролем, однако это не претерпевало значимых изменений при нокдауне Crh (Рис. 1h). Важно отметить, что возрастные изменения при нокдауне Crh не влияли на тревожно-подобное поведение в приподнятом крестообразном лабиринте или в тестах открытого поля (Рис. SN 3c-j), подчеркивая роль CRH в регуляции именно приобретенного, а не врожденного избегания угрозы. В совокупности с нашим общемозговым анализом популяций CRH (Рис. 2), эти результаты предполагают, что индуцированное ELA возрастное снижение экспрессии CRH в vmPFC вносит вклад в усиление избегания угрозы в подростковом возрасте.&lt;/p&gt;\n&lt;h4 id=\"ela-usilivaet-aktivaciyu-protyazhennogo-puti-vmpfc-crh-bla-vo-vremya-izbeganiya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ela-usilivaet-aktivaciyu-protyazhennogo-puti-vmpfc-crh-bla-vo-vremya-izbeganiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ELA усиливает активацию протяженного пути vmPFC CRH+ → BLA во время избегания&lt;/span&gt;&lt;/a&gt;ELA усиливает активацию протяженного пути vmPFC CRH+ → BLA во время избегания&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун — метод снижения экспрессии конкретного гена (в данном случае Crh) при помощи интерферирующих РНК.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Многие клетки, экспрессирующие CRH в vmPFC, представляют собой локальные интернейроны, которые, вероятно, не модулируют напрямую активность в отдаленных мишенях проекций. Таким образом, чтобы определить наличие проецирующихся на большие расстояния CRH+ нейронов, связанных с BLA, мы ввели ретроградный AAV, экспрессирующий GFP, зависимый от Cre, в BLA мышей CRH-Cre, что привело к флуоресцентной метке CRH+ клеток, иннервирующих BLA (Рис. 3a-c, Рис. SN 4a). Мы обнаружили CRH+ клетки, проецирующие в BLA, в дорсомедиальной PFC (dmPFC), пириформной коре (PIR), экторинальной коре (ECT) и областях височной ассоциации (TEa), а также особенно в паравентрикулярном ядре таламуса (PVT) и vmPFC (Рис. 3d).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f3.jpg\" alt=\"Рисунок 3. ELA усиливает путь vmPFCCRH+→BLA. (a) Экспериментальный график для определения числа активированных CRH+-клет\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 3. ELA усиливает путь vmPFCCRH+→BLA. (a) Экспериментальный график для определения числа активированных CRH+-клеток, проецирующихся в BLA во время обучения PMA у подростковых мышей. (b) Схема вирусной стратегии для метки CRH+-клеток, проецирующихся в BLA, и оценки экспрессии cFos. (c) Доля успешных попыток во время обучения PMA (SR, n = 6, LBN, n = 7 мышей) (двухфакторный ANOVA: эффект попытки F1,11 = 30.09, P = 0.0002; эффект содержания F1,12 = 0.09, P = 0.77; эффект взаимодействия F1,11 = 1.45, P = 0.254). (d) Примеры изображений и количественная оценка ретроградно меченных CRH+, проецирующихся в BLA в дорсомедиальной префронтальной коре (dmPFC), vmPFC, пириформной коре (PIR), паравентрикулярном ядре таламуса (PVT), экторинальной коре (ECT) и зоне височной ассоциации (TEa) (двухфакторный ANOVA: эффект региона F2.46,22.2 = 48.19, p &amp;lt; 0.0001; эффект содержания F1,9 = 0.092, p = 0.769; эффект взаимодействия F2.46,22.2 = 2.18, p = 0.128). (e) Ретроградно меченные CRH+-клетки (зеленые), Fos+-клетки (пурпурные) и совмещенные изображения в vmPFC и количественная оценка числа GFP+-клеток (непарный t-критерий F6,5 = 1.47, P = 0.175), Fos+-клеток (непарный t-критерий F6,5 = 1.91, P = 0.177) и процента GFP+/Fos+-клеток (непарный t-критерий F6,5 = 2.39, P = 0.016). (f) Примеры Vgat+ (желтые), Vglut+ (пурпурные), vmPFCCRH+→BLA клеток (зеленые) и совмещенное изображение у мышей SR и LBN, а также количественная оценка процента vmPFCCRH+→BLA клеток, являющихся только Vglut+ (пурпурные), объединенных по мышам SR и LBN (SR, n = 34 клетки / 5 мышей; LBN, n = 62 клетки / 7 мышей). (g, h) Физиологическое исследование синаптической связи пути vmPFCCRH+→BLA (SR, n = 6 клеток / 4 мыши; LBN, n = 8 клеток / 5 мышей). (g) Схема заражения AAV-DIO-ChR2 CRH+-клеток vmPFC и конфигурация пэтч-кламмп регистрации в BLA. (h) Репрезентативные vmPFCCRH+-вызванные EPSC (Vm = -70 мВ) и IPSC (Vm = 0 мВ), зарегистрированные в главных клетках BLA мышей SR и LBN, и количественная оценка амплитуды оптогенетически вызванного возбуждающего постсинаптического тока (oEPSC) (t-критерий Уэлча F7,5 = 5.38, P = 0.0220). (i) Примеры изображений экспрессии Crh (зеленый) и Vglut1 (пурпурный) в vmPFC мышей SR и LBN (SR, n = 5, LBN, n = 7 мышей) и количественная оценка числа CRH+-клеток, которые также экспрессируют Vglut1+ (непарный t-критерий F5,7 = 2.41, P = 0.800), и интенсивности экспрессии Crh в Vglut1+-клетках (непарный t-критерий F6,4 = 1.77, P = 0.049). (j) Примеры изображений экспрессии Crh (зеленый) и Vglut1 (пурпурный) в vmPFC мышей SR и LBN и количественная оценка числа CRH+-клеток, не экспрессирующих Vglut1 (непарный t-критерий F5,7 = 2.14, P = 0.029), и интенсивности экспрессии Crh в Vglut1-клетках (непарный t-критерий F5,7 = 3.67, P = 0.836). Все точки данных представляют биологические повторности. Данные представлены как среднее ± стандартная ошибка среднего; &lt;em&gt;P &amp;lt; 0.05. Треугольники обозначают саммок, а круги — самцов.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Затем мы исследовали, изменяет ли ELA активацию проецирующих в BLA CRH+ нейронов vmPFC во время PMA. Мы измерили экспрессию гена немедленного раннего ответа Fos, маркера недавно активированных нейронов, в ретроградно меченных нейронах vmPFC CRH+ → BLA после обучения PMA (Рис. 3e). Большинство ретроградно меченных CRH+ клеток vmPFC располагались в слоях 2/3 (Рис. SN 4b,c), что согласуется с распределением по слоям общей популяции клеток vmPFC, проецирующих в BLA. Мы не обнаружили различий в числе ретроградно меченных GFP+ клеток или в общей экспрессии Fos внутри vmPFC (Рис. 3e). Тем не менее, у мышей LBN значительно большая доля GFP+ нейронов vmPFC CRH+ → BLA экспрессировала Fos, что указывает на их более высокую активацию во время обучения PMA по сравнению с контролем SR (Рис. 3e). Мы не выявили индуцированных стрессом различий в экспрессии Fos, вызванной PMA, в других выявленных нами популяциях CRH, проецирующих в BLA (Рис. SN 5a-d). В совокупности эти данные предполагают, что повышенная активность в цепи vmPFC CRH+ → BLA может способствовать усилению избегания угрозы у подростковых мышей, перенесших ELA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты выполнены на моделях грызунов (мышах), поэтому прямая экстраполяция на человека требует осторожности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ela-usilivaet-glutamatergicheskij-put-vmpfc-crhbla\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ela-usilivaet-glutamatergicheskij-put-vmpfc-crhbla\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ELA усиливает глутаматергический путь vmPFC CRH+→BLA&lt;/span&gt;&lt;/a&gt;ELA усиливает глутаматергический путь vmPFC CRH+→BLA&lt;/h4&gt;\n&lt;p&gt;Сведения о популяризации дальнепроекционных CRH+ клеток ограничены: практически во всех работах сообщается об их коэкспрессии с тормозным нейромедиатором гамма-аминомасляной кислотой (ГАМК). Чтобы определить, являются ли клетки vmPFC CRH+→BLA преимущественно глутаматергическими или ГАМК-эргическими, мы объединили ретроградный вирусный трекинг с гибридизацией in situ для оценки экспрессии мРНК везикулярного глутаматного транспортера 1 (Vglut1) и везикулярного ГАМК-транспортера (Vgat) (Рис. 3f). Во всех группах вирус-меченные нейроны экспрессировали Vglut1, что указывает на глутаматергическую природу проекционных нейронов vmPFC CRH+→BLA (Рис. 3f).&lt;/p&gt;\n&lt;p&gt;Затем мы использовали картирование нейронных цепей с помощью каналоропсидина (ChR2), чтобы подтвердить глутаматергическую природу пути vmPFC CRH+→BLA и выяснить, влияет ли ранняя жизнь в условиях неблагоприятных условий на силу синаптической передачи. Мы ввели AAV-ChR2, зависящий от кре-рекомбиназы, в префронтальную корку (vmPFC) мышей линий LBN или SR CRH-Cre. Выдержав две недели для экспрессии вируса, мы приготовили острые срезы головного мозга от обеих групп в подростковом возрасте (P33–36). Используйте метод пэтч-кламп в конфигурации «целая клетка» на главных нейронах базолатеральной миндалины (BLA) (Рис. 3g), мы измерили возбуждающие и тормозные постсинаптические токи (ЭПСТ и ТПСТ), вызванные оптогенетической стимуляцией аксонных терминалей vmPFC CRH+ в BLA при фиксировании мембранного потенциала нейронов на уровне -70 мВ или 0 мВ соответственно (Рис. 3h). Ни в одной из групп ТПСТ не наблюдались, однако амплитуда оптогенетически вызванных ЭПСТ была достоверно выше у мышей группы LBN по сравнению с контролем SR (Рис. 3h). Гистологический анализ подтвердил точность вирусного нацеливания (Рис. SN 6a). Эти данные демонстрируют, что ранний жизненный стресс усиливает возбуждающий сигнал от CRH+-афферентов vmPFC к главным нейронам BLA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ранний жизненный стресс (LBN) избирательно усиливает глутаматергическую передачу в проекциях vmPFC CRH+→BLA и повышает экспрессию Crh в глутаматергических нейронах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы более широко оценить влияние ELA на экспрессию Crh в vmPFC в подростковом возрасте, мы также количественно оценили число CRH+ Vglut1+ и Vglut1- клеток, а также уровни экспрессии Crh в этих клетках. Воздействие LBN не повлияло на количество экспрессирующих Crh нейронов Vglut1⁺, но привело к увеличению экспрессии Crh по сравнению с контролем SR (Рис. 3i). Напротив, Vglut1⁻-нейроны, которые, вероятно, преимущественно представляют собой ГАМК-эргические интернейроны, продемонстрировали значительное снижение числа клеток, экспрессирующих Crh, но без изменений уровней его экспрессии (Рис. 3j). В совокупности со снижением общего числа CRH+-клеток в vmPFC, выявленным при анализе всего мозга (Рис. 2), эти результаты предполагают, что сокращение числа CRH+-нейронов под действием LBN может быть специфичным для ГАМК-эргических клеток. С другой стороны, усиление экспрессии Crh в глутаматергических нейронах после ELA может способствовать повышению активности нисходящих путей в BLA, что в конечном итоге приводит к усилению избегания в подростковом возрасте.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемые электрофизиологические и молекулярные изменения получены на мышиных моделях и отражают подростковый возраст, что требует осторожности при экстраполяции на человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;vmPFCCRH+ →BLA активирует повышенное избегание угроз у подростков с LBN&lt;/p&gt;\n&lt;p&gt;Предыдущие исследования показали, что после раннего жизненного стресса (ELA) повышенная активность CRH-клеток центральной амигдалы способствует усиленной реактивности на угрозы и ангедонии у мышей с анамнезом ELA, что предполагает участие CRH в ключевых стресс-чувствительных путях, обусловливающих стойкие изменения эмоционального поведения. Учитывая, что клетки vmPFCCRH+→BLA демонстрируют повышенную экспрессию Fos во время обучения PMA у мышей с LBN, усиление глутаматергической нейротрансмиссии и повышенную экспрессию Crh, мы исследовались, необходим ли этот путь для повышенного избегания угроз у подростков мышей с LBN, и если да, распространяется ли его роль на взрослый возраст. Для этого мы ввели кре-зависимый ингибирующий опсин pAAV-EF1a-DIO-eNpHR3.0-EYFP (в тексте — PdCO62) или контрольный флуорофор в vmPFC мышей CRH-cre и имплантировали двусторонние оптоволокна над BLA (Рис. 4a). Две недели спустя мы применяли синий лазер (473 нм, непрерывный) у подростков или взрослых для оптогенетического ингибирования пути vmPFCCRH+→BLA во время обучения PMA, в частности в период удара током и в течение 13 секунд после его окончания (Рис. 4b). Этот временной интервал был выбран на основе наших данных о том, что активность BLA повышена в этот период (Рис. 1m,n). Корректная экспрессия вируса и расположение волокон были подтверждены у всех животных (Рис. 4c; Рис. SN 6b,c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f4.jpg\" alt=\"Рисунок 4. Ингибирование пути vmPFC-CRH+ → BLA уменьшает индуцированное ранним жизненным опытом (ELA) поведение избегани\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 4. Ингибирование пути vmPFC-CRH+ → BLA уменьшает индуцированное ранним жизненным опытом (ELA) поведение избегания у подростков, но не у взрослых. (a) График эксперимента для групп подростков и взрослых. (b) Схематическое изображение PMA с постоянной лазерной стимуляцией во время периода удара током и в течение 13 секунд после удара во время обучения (Adol. SR cont., n=12; SR PdCO n=12; LBN cont., n=15, LBN PdCO, n=17; Adult SR cont., n=5; SR PdCO n=7; LBN cont., n=8, LBN PdCO, n=7 мышей). (c) Схема и примеры изображений экспрессии AAV-DIO-PdCO и двусторонних волоконно-оптических имплантатов в BLA мышей CRH-Cre. (d) Доля успешных попыток у подростков во время обучения PMA, усредненная для базового уровня до удара током и последних четырех тонов сеанса (трехфакторный дисперсионный анализ: эффект попытки F1,52=91,51, P&amp;lt;0,0001; эффект выращивания F1,52=1,74, P=0,193; эффект опсина F1,52=0,86, P=0,360; эффект взаимодействия попытка x выращивание F1,52=0,062, P=0,804; эффект взаимодействия попытка x опсин F1,52=0,028, P=0,869; эффект взаимодействия выращивание x опсин F1,52=0,0031, P=0,956; попытка x выращивание x опсин F1,52=0,25, P=0,620). (e-g) Поведенческие показатели во время извлечения PMA. (e) Доля времени на платформе, усредненная по сеансу (двухфакторный дисперсионный анализ с поправкой Тьюки: эффект выращивания F1,52=2,88, P=0,10; эффект опсина F1,52=4,98, P=0,03; эффект взаимодействия F1,52=8,95, P=0,004). (f) Латентность входа на платформу после начала тона (двухфакторный дисперсионный анализ с поправкой Тьюки: эффект выращивания F1,52=0,029, P=0,867; эффект опсина F1,52=3,56, P=0,065; эффект взаимодействия F1,52=10,20, p=0,0024). (g) Доля времени замирания во время тона (двухфакторный дисперсионный анализ с поправкой Тьюки: эффект выращивания F1,52=9,47, P=0,0033; эффект опсина F1,52=2,33, P=0,133; эффект взаимодействия F1,52=0,0026, P=0,960). (h) Доля успешных попыток у взрослых во время обучения PMA, усредненная для базового уровня до удара током и последних четырех тонов сеанса (трехфакторный дисперсионный анализ: эффект попытки F1,46=52,40, P&amp;lt;0,0001; эффект выращивания F1,46=0,21, P=0,652; эффект опсина F1,46=0,49, P=0,489; эффект взаимодействия попытка x выращивание F1,46=0,09, P=0,765; эффект взаимодействия попытка x опсин F1,46=1,93, P=0,171; эффект взаимодействия выращивание x опсин F1,46=1,28, P=0,264; попытка x выращивание x опсин F1,46=0,14, P=0,709). (i-k) Поведенческие показатели во время извлечения PMA. (i) Доля времени на платформе, усредненная по сеансу (двухфакторный дисперсионный анализ: эффект выращивания F1,23=0,56, P=0,460; эффект опсина F1,23=0,07, P=0,788; эффект взаимодействия F1,23=0,01, P=0,921). (j) Латентность входа на платформу после начала тона (двухфакторный дисперсионный анализ: эффект выращивания F1,23=0,052, P=0,822; эффект опсина F1,23=1,16, P=0,293; эффект взаимодействия F1,23=0,125, P=0,27). (k) Доля времени замирания во время тона (двухфакторный дисперсионный анализ: эффект выращивания F1,23=2,72, P=0,113; эффект опсина F1,23=0,356, P=0,557; эффект взаимодействия F1,23=2,16, P=0,156). Все точки данных представляют биологические повторности. Данные представлены как среднее ± стандартная ошибка среднего; *P&amp;lt;0,05, **P&amp;lt;0,01, **&lt;em&gt;P&amp;lt;0,001. Треугольники обозначают самцов, а круги — самок.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ингибирование пути vmPFCCRH+→BLA у подростков с LBN снижает избегание угроз при воспроизведении PMA без влияния на процесс обучения или замирание.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ингибирование vmPFCCRH+→BLA не влияло на способность подростков-мышей к обучению PMA (Рис. 4d). Однако при воспроизведении PMA в отсутствие оптогенетического воздействия мыши, перенесшие LBN, демонстрировали значительное снижение избегания угроз во время сигнала, предсказывающего удар (Рис. 4e). Это различие было обусловлено увеличением латентного периода входа на защитную платформу при предъявлении сигнала (Рис. 4f), при этом не наблюдалось никакого влияния на поведение замирания (Рис. 4g). Та же манипуляция у взрослых не оказывала влияния ни на обучение PMA (Рис. 4h), ни на его воспроизведение на следующий день (Рис. 4i-k). Таким образом, повышенная активность пути vmPFCCRH+→BLA стимулирует усиленное избегание угроз в подростковом возрасте, но не в более поздние периоды жизни. Широкое ингибирование пути vmPFC→BLA также приводило к значительному снижению поведения избегания у подростков-мышей с LBN (Рис. SN 7a-g). Это указывает на то, что, хотя широкий путь vmPFC→BLA вносит вклад в повышенное избегание угроз у подростков с LBN, целенаправленное воздействие только на подмножество CRH+ достаточна для реализации этого эффекта.&lt;/p&gt;\n&lt;p&gt;Затем мы исследовали, может ли стимуляция пути vmPFCCRH+→BLA у контрольных животных SR вызывать эффекты, подобные LBN, в отношении поведения избегания угроз в подростковом возрасте. Мы ввели кре-зависимый возбуждающий опсин в vmPFC и имплантировали двусторонние волокна над BLA (Рис. SN 8a,b). Мы подавали импульсы синего лазера (473 нм, 50 мс, 15 Гц) для оптогенетической стимуляции этого пути во время обучения PMA, снова в период и после периода удара током (Рис. SN 8c). Мы не обнаружили групповых различий в способности к обучению PMA (Рис. SN 8d) или в уровнях избегания при воспроизведении на следующий день (Рис. SN 8e-g). В сочетании с нашим наблюдением о том, что этот путь вызывает небольшие EPSC в BLA у мышей SR (Рис. 3k), это предполагает, что путь vmPFCCRH+→BLA минимально влияет на нисходящую активность BLA и избегание угроз у мышей SR. Более того, эти данные показывают, что раннее развитие пластичности цепей, в отличие от острого повышения активности путей в подростковом возрасте, может способствовать повышенному избеганию угроз после LBN.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптогенетика — это метод регуляции активности нейронов с помощью света, использующий светочувствительные белки (опсины), внедренные в определенные нейронные сети.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы определить, является ли стимуляция или ингибирование пути vmPFCCRH+→BLA врожденно вознаграждающим или аверсивным соответственно, мы провели тест на предпочтение места в реальном времени (RTPP), в котором одна сторона камеры сочеталась с оптогенетической манипуляцией этим путем. Активация пути vmPFCCRH+→BLA не вызывала значимого избегания камеры, сопряженной с лазером (Рис. SN 8h,i). Та же манипуляция также не оказывала влияния на тревожное поведение в 10-минутном тесте «открытое поле» при чередовании 30 секунд лазерной стимуляции (Рис. SN 8j-l). Аналогичным образом, ингибирование пути vmPFCCRH+→BLA не оказывало влияния во время тестов RTPP или «открытое поле» у подростков (Рис. SN 9a-e). Мы наблюдали в целом схожие результаты у взрослых (Рис. SN 9f-i), за исключением того, что двигательная активность снижалась после ингибирования в тесте «открытое поле» (Рис. SN 9j). В совокупности эти данные указывают на то, что путь vmPFCCRH+→BLA играет специфическую роль в обученном поведении избегания угроз и не вызывает врожденного отвращения.&lt;/p&gt;\n&lt;h4 id=\"ekspressiya-crh-v-nejronah-vmpfcvglut1-neobhodima-dlya-povyshennogo-izbeganiya,-vyzvannogo-rannim-zhiznennym-stressom-lbn\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ekspressiya-crh-v-nejronah-vmpfcvglut1-neobhodima-dlya-povyshennogo-izbeganiya,-vyzvannogo-rannim-zhiznennym-stressom-lbn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспрессия Crh в нейронах vmPFCVGLUT1 необходима для повышенного избегания, вызванного ранним жизненным стрессом (LBN)&lt;/span&gt;&lt;/a&gt;Экспрессия Crh в нейронах vmPFCVGLUT1 необходима для повышенного избегания, вызванного ранним жизненным стрессом (LBN)&lt;/h4&gt;\n&lt;p&gt;Наши оптогенетические эксперименты показывают, что активность в пути vmPFC^CRH→BLA необходима для повышенного избегания у мышей-подростков, подвергшихся LBN. Однако эта манипуляция может влиять как на высвобождение глутамата, так и на высвобождение CRH. Чтобы определить, требуется ли сигнализация CRH для вызванного LBN увеличения избегания в подростковом возрасте и связанных с ним изменений активности BLA, а также когда именно она необходима, мы ввели кре-зависимую shRNA, направленную против CRH, в vmPFC мышей линии VGLUT1-Cre. Эта стратегия избирательно снижает уровень CRH в возбуждающих нейронах vmPFC, которые составляют путь vmPFC^CRH→BLA. Подросткам хирургическое вмешательство проводили в возрасте P19–P21, а взрослым — в возрасте P45–47. Две недели спустя мыши проходили обучение и воспроизведение в тесте PMA, после чего следовала перфузия для оценки экспрессии Fos в BLA (Рис. 5a). Корректная экспрессия вируса была подтверждена у всех животных (Рис. SN 10a,b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f5.jpg\" alt=\"Рисунок 5. Снижение экспрессии Crh в пути vmPFC→BLA ослабляет вызванное ранним жизненным опытом (ELA) повышенное избеган\" /&gt;&lt;/p&gt;\n&lt;p&gt;*Рисунок 5. Снижение экспрессии Crh в пути vmPFC→BLA ослабляет вызванное ранним жизненным опытом (ELA) повышенное избегание и активность BLA у подростков, но не у взрослых. (a) Экспериментальная шкала времени и изображение нокдауна экспрессии Crh с помощью AAV-shRNA в клетках vmPFCVGLUT1+ у подростков (SR: scramble, n=4; shRNA, n=6; LBN: scramble, n=8, shRNA, n=7 мышей). (b) Доля успешных попыток во время обучения PMA, усредненная для базового уровня до шока и последних четырех тонов сеанса (трехфакторный ANOVA: эффект попытки F1,23=21,25, P=0,0001; эффект выращивания F1,23=0,093, P=0,764; эффект нокдауна F1,23=2,99, P=0,097; эффект взаимодействия попытка x выращивание F1,23=1,41, P=0,247; эффект взаимодействия попытка x нокдаун F1,23=0,067, P=0,800; эффект взаимодействия выращивание x нокдаун F1,23=0,68, P=0,417; эффект взаимодействия попытка x выращивание x нокдаун F1,23=0,32, p=0,576). (c-e) Поведенческие показатели во время извлечения PMA. (c) Доля времени на платформе, усредненная за сеанс (двухфакторный ANOVA с апостериорным тестом Тьюки: эффект нокдауна F1,23=1,42, P=0,246; эффект выращивания F1,23=7,16, P=0,014; эффект взаимодействия F1,23=4,68, P=0,041). (d) Латентность входа на платформу после начала тона (двухфакторный ANOVA с апостериорным тестом Тьюки: эффект нокдауна F1,23=0,02, P=0,889; эффект выращивания F1,23=6,53, P=0,018; эффект взаимодействия F1,23=2,06, P=0,164). (e) Доля времени замирания, усредненная за сеанс (двухфакторный ANOVA: эффект нокдауна F1,23=1,48, P=0,237; эффект выращивания F1,23=1,31, P=0,264; эффект взаимодействия F1,23=4,95, P=0,036). (f) Примеры изображений экспрессии Fos в BLA после нокдауна Crh в клетках vmPFCVGLUT1+. (g) Количественная оценка клеток Fos+ на мм2 (двухфакторный ANOVA с апостериорным тестом Тьюки: эффект нокдауна F1,23=2,69, P=0,115; эффект выращивания F1,23=16,33, P=0,0005; эффект взаимодействия F1,23=4,31, P=0,049). (h) Экспериментальная шкала времени и изображение нокдауна экспрессии Crh с помощью AAV-shRNA в клетках vmPFCVGLUT1+ у взрослых (SR: scramble, n=4; shRNA, n=5; LBN: scramble, n=7, shRNA, n=10 мышей). (i) Доля успешных попыток во время обучения PMA, усредненная для базового уровня до шока и последних четырех тонов сеанса (трехфакторный ANOVA: эффект попытки F1,40=30,87, P&amp;lt;0,0001; эффект выращивания F1,40=3,22, P=0,0803; эффект нокдауна F1,40=0,033, P=0,856; эффект взаимодействия попытка x выращивание F1,40=3,50, P=0,067; эффект взаимодействия попытка x нокдаун F1,40=0,615, P=0,437; эффект взаимодействия выращивание x нокдаун F1,40=0,40, P=0,530; эффект взаимодействия попытка x выращивание x нокдаун F1,40=0,097, P=0,757). (j-l) Поведенческие показатели во время извлечения PMA. (j) Доля времени на платформе, усредненная за сеанс (двухфакторный ANOVA: эффект нокдауна F1,22=1,61, P=0,293; эффект выращивания F1,22=0,059, P=0,810; эффект взаимодействия F1,22=0,82, P=0,376). (k) Латентность входа на платформу после начала тона (двухфакторный ANOVA: эффект нокдауна F1,22=3,55, P=0,073; эффект выращивания F1,22=0,092, P=0,765; эффект взаимодействия F1,22=0,099, P=0,330). (l) Доля времени замирания, усредненная за сеанс (двухфакторный ANOVA: эффект нокдауна F1,22=0,15, P=0,707; эффект выращивания F1,22=1,31, P=0,264; эффект взаимодействия F1,22=1,13, P=0,300). (m) Примеры изображений экспрессии Fos в BLA после нокдауна Crh в клетках vmPFCVGLUT1+. (n) Количественная оценка клеток Fos+ на мм2 (двухфакторный ANOVA: эффект нокдауна F1,22=0,312, P=0,582; эффект выращивания F1,22=0,056, P=0,815; эффект взаимодействия F1,22=0,186, P=0,670). Все точки данных представляют биологические повторности. Данные представлены как среднее ± стандартная ошибка среднего; *P&amp;lt;0,05, **P&amp;lt;0,01, **&lt;em&gt;P&amp;lt;0,001. Треугольники обозначают самкок, а круги — самцов.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун Crh в пубертатном периоде избирательно снижает повышенное избегание угроз и активность BLA у мышей из группы LBN, не влияя на взрослых особей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Постнатальный нокдаун Crh не нарушал приобретение условного избегания ни у контрольных (SR), ни у LBN мышей-подростков (Рис. 5b). Во время воспроизведения нокдаун Crh не оказал влияния на SR-контроль, но значимо снижал избегание у LBN-мышей, что измерялось по уменьшению времени пребывания на платформе (Рис. 5c), без изменения латентного периода входа или замирания (Рис. 5d,e). Согласуясь с этими поведенческими эффектами, нокдаун Crh снижал экспрессию Fos в BLA (Рис. 5f,g). Чтобы определить, важны ли вызванные ранним неблагоприятным опытом (ELA) изменения экспрессии Crh именно в период развития, группа сравнения взрослых животных прошла те же процедуры (Рис. 5h). Мы не обнаружили поведенческих различий между взрослыми мышами SR и LBN, а нокдаун Crh не влиял на поведение в тесте PMA (Рис. 5i–l) или на экспрессию Fos в BLA ни в одной из групп выращивания (Рис. 5m,n).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун — это метод генетической инженерии, при котором экспрессия определенного гена искусственно снижается с помощью интерферирующих РНК (shRNA), чтобы изучить функцию этого гена.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы подтвердить специфичность этих изменений именно для условного избегания, мы также измерили поведение тревожного типа и локомоцию с помощью тестов «открытое поле» и «приподнятый крестообразный лабиринт» (в оригинале — приподнятый ноль-лабиринт). Их оценивали до обучения PMA, и мы не выявили никакого эффекта нокдауна Crh ни в одной из групп выращивания (Рис. SN 10c–h). В совокупности эти данные показывают, что ювенильный и подростковый периоды представляют собой ключевое «окно развития», когда изменения сигнализации CRH в vmPFC могут влиять на функционирование нейронной цепи избегания угроз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты проводились на мышах с использованием вирусных векторов для подавления экспрессии в конкретной зоне мозга, поэтому прямая экстраполяция на механизмы человека требует осторожности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Ранний жизненный стресс является основным фактором риска развития психических заболеваний, включая тревогу и депрессию, которые характеризуются высоким уровнем избегания и часто проявляются в подростковом возрасте. Несмотря на это, мало что известно о том, как ранний жизненный стресс формирует созревание цепей избегания угроз в течение этого критического окна развития. Ранний жизненный стресс может принимать множество форм, и как характер, так и время возникновения неблагоприятных факторов влияют на поведенческие результаты. В моделях на грызунах общепризнано, что хронический стресс в течение первых десяти дней жизни имеет долгосрочные последствия, хотя разные модели предлагают уникальные преимущества. Здесь мы выбрали модель ограниченного доступа к подстилочному материалу и гнездовым ресурсам, поскольку она требует минимального вмешательства экспериментатора и отражает распространенный человеческий опыт, при котором мать присутствует, но обеспечивает фрагментированный и непредсказуемый уход. Используя эту модель, мы выделили дальнодействующий глутаматергический путь vmPFC^CRH+→BLA, который после раннего жизненного стресса демонстрирует повышенную активацию во время избегания угроз, синаптическое усиление и повышенную экспрессию Crh в подростковом возрасте. Ингибирование пути vmPFC^CRH+→BLA во время поведения или снижение экспрессии Crh в vmPFC исключительно в возбуждающих клетках на более ранних этапах развития устраняет индуцированные ранним жизненным стрессом повышения активности BLA и избегания угроз в подростковом возрасте, но те же манипуляции не повлияли на избегание угроз во взрослом возрасте. Интересно, что ранний жизненный стресс также снижает общую плотность CRH⁺-клеток в vmPFC. В соответствии с этим мы обнаруживаем, что нокдаун Crh во всей vmPFC в ходе развития у мышей контрольной группы воспроизводит фенотип повышенного избегания, индуцированного ранним жизненным стрессом. В совокупности эти данные предполагают, что у животных, перенесших ранний жизненный стресс, CRH действует специфичным для типа клеток образом, индуцируя пластичность развития в цепях vmPFC, критических для реагирования на угрозы. Выявляя ранее не признанную, молекулярно определенную префронтальную цепь, чувствительную к раннему жизненному стрессу и способную вызывать повышенное избегание угроз в подростковом возрасте, наши результаты раскрывают потенциальный механизм цепей, посредством которого ранний жизненный стресс может способствовать уязвимости к психическим заболеваниям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ранний жизненный стресс активирует путь vmPFC^CRH+→BLA, усиливая избегание угроз у подростков, а подавление Crh воспроизводит этот эффект.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Предыдущие работы показали, что индивидуумы, подвергшиеся раннему жизненному стрессу, демонстрируют повышенную активацию BLA после воздействия пугающих стимулов, как это измеряется с помощью функциональной магнитно-резонансной томографии у людей и мечения Fos у грызунов. Согласуясь с этим, мы обнаруживаем, что у подростков-мышей, подвергшихся раннему жизненному стрессу, повышена активность в BLA (Рис. 1). Во время тренировки ассоциативного страха активность BLA повышена во время предъявления шока и условного тона у животных в условиях ограниченного доступа к подстилочному материалу и гнездовым ресурсам по сравнению с контрольной группой. Тренировка ассоциативного страха использует более низкую интенсивность шока по сравнению с классической выработкой страха, что может объяснять, почему контрольные мыши имеют относительно низкие уровни активности, вызванной тоном. В совокупности эти данные предполагают, что ранний жизненный стресс сенсибилизирует BLA даже к слабо аверсивным стимулам во время обучения, стимулируя повышенные ответы на сигналы, предсказывающие угрозу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун — это генетический метод искусственного снижения экспрессии конкретного гена (в данном случае Crh) с целью изучения функций образующегося белка.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кортиколиберин представляет собой реагирующий на стресс нейропептид, который способствует обучению страху и повышает возбудимость нейронов, что предполагает его возможное участие в опосредовании вызванных ранним жизненным стрессом изменений в цепях mPFC-BLA. Хотя измененная экспрессия кортиколиберина очевидна в гипоталамусе, миндалевидном теле и гиппокампе, предыдущие работы были сосредоточены на взрослых особах. Мы наблюдали снижение числа клеток Vglut⁻CRH⁺ в vmPFC в ходе развития, без каких-либо изменений в числе клеток Vglut⁺CRH, включая проекционные нейроны vmPFC^CRH+→BLA (Рис. 3). Большинство нейронов CRH⁺ в vmPFC являются гамкергическими интернейронами, которые коэкспрессируют вазоактивный интестинальный пептид, хотя в исследованиях отмечались редкие дальнодействующие гамкергические проекции CRH⁺ в такие области, как прилежащее ядро и латеральная перегородка. Таким образом, снижение числа клеток CRH⁺, наблюдаемое в нашем общемозговом анализе и данных in situ, вероятнее всего, отражает потерю экспрессии Crh в гамкергических нейронах vmPFC. Более того, наш эксперимент по нокдауну CRH во всей vmPFC, который воспроизвел эффекты раннего жизненного стресса у контрольных мышей (Рис. 2), вероятно, сильнее всего затронул именно эти клетки. Интернейроны, экспрессирующие вазоактивный интестинальный пептид, преимущественно нацелены на соматостатиновые интернейроны, тем самым ослабляя опосредованное соматостатином дендритное торможение пирамидных нейронов и увеличивая возбуждающий выход. В дополнение к этому синаптическому взаимодействию подмножество соматостатиновых интернейронов экспрессирует рецептор кортиколиберина 2. Эти данные поднимают вопрос о возможности того, что высвобождение кортиколиберина из интернейронов, экспрессирующих вазоактивный интестинальный пептид, может модулировать созревание префронтальных микроцепей. Хотя функциональные последствия этого снижения остаются неясными, такие изменения могут в конечном итоге повлиять на префронтальный выход в нижележащие области, включая базолатеральное миндалевидное тело.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выводы сделаны на моделях грызунов, а корреляция изменений в мозге с поведением требует осторожности при экстраполяции на человека.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы также обнаружили, что вызванная ранним неблагоприятным жизненным опытом пластичность в цепи vmPFCCRH+→BLA способствовала усилению избегания угроз в подростковом возрасте, но не оказывала никакого эффекта во взрослом возрасте. В ходе нормального развития сниженная реакция на угрозу в этот период может способствовать рискованному исследованию среды, которое важно для ориентации в пространстве и выработки адаптивных поведенческих стратегий. Вызванное ранним опытом усиление активности vmPFCCRH+→BLA может поэтому навязывать устойчивое смещение в сторону избегания, потенциально сужая поведенческий репертуар и ограничивая приобретение гибких стратегий реагирования на окружающую среду. Наше предыдущее исследование показало, что у мышей, выращенных в стандартных условиях, более высокие уровни избегания угроз, наблюдаемые во взрослом возрасте, обусловлены повышенной активностью, синаптической силой и связностью внутри пути из дорсомедиальной префронтальной коры в базолатеральную миндалину [40]. Здесь мы аналогичным образом наблюдали высокий уровень избегания у взрослых особей независимо от условий выращивания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пластичность в цепи vmPFCCRH+→BLA усиливает избегание угроз в подростковом возрасте, но во взрослом возрасте этот путь теряет доминирующее значение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Более того, ингибирование цепи vmPFCCRH+→BLA или нокдаун экспрессии Crh в возбуждающих нейронах vmPFC существенно не изменяли избегание в этом возрасте, что предполагает более мощную роль данного пути именно в подростковый период. Вполне возможно, что к зрелому возрасту другие нейронные цепи берут на себя основную роль в модуляции поведения при PMA, уменьшая или маскируя вклад пути vmPFCCRH+→BLA. В целом, избирательные эффекты ингибирования vmPFC-BLA и специфичного для пути нокдауна CRH в подростковом возрасте выдвигают эту цепь в качестве потенциальной мишени для раннего вмешательства. В совокупности, связывая развитие цепей mPFC с долгосрочными эффектами раннего опыта, мы предоставляем механистическую основу для понимания того, как ранний жизненный опыт формирует траектории нейроразвития и в конечном итоге влияет на уязвимость к психическим расстройствам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выводы получены в экспериментах на мышах, поэтому прямая экстраполяция на механизмы психических расстройств у человека требует осторожности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"subuekty\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#subuekty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Субъекты&lt;/span&gt;&lt;/a&gt;Субъекты&lt;/h4&gt;\n&lt;p&gt;Самки и самцы трансгенных мышей линий C57Bl6/J (JAX Stock No. 000664), CRH-Cre (JAX Stock No. 012704), VGLUT1-Cre (JAX Stock No. 023527) и Ai14 tdTomato Cre-reporter (JAX Stock No. 007914) разводились в виварии лаборатории. После отъема от матери мыши содержались группами (по 2–4 особи на клетку). Экспериментальные конечные точки достигались в период среднего подросткового возраста — на постнатальные дни (P) 33–37. Мыши содержались при 12-часовом световом цикле (свет включался с 7:00 до 19:00) в комнате с контролируемой температурой и влажностью. Корм и вода были доступны ad libitum. Все процедуры соответствовали рекомендациям по уходу за животными, утвержденным Комитетом по исследованию животных Канцелярии Калифорнийского университета в Лос-Анджелесе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экспериментальные конечные точки наступают в подростковом возрасте (P33–37), а содержание животных организовано в стандартных контролируемых условиях с беспрепятственным доступом к пище и воде.&lt;
