6-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f1.jpg\" alt=\"1-сурет. dCas13-dsRBD синтездері нысана мРНК-мен жақсартылған байланысу арқылы мРНК-ның жасуша өсінділеріне локализацияс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. dCas13-dsRBD синтездері нысана мРНК-мен жақсартылған байланысу арқылы мРНК-ның жасуша өсінділеріне локализациясын өзгертеді. (A) Тексерілетін индукцияланатын dCas13-dsRBD конструктөрлерін көрсететін схема. MDA-MB-231 жасушаларындағы dCas13-dsRBD экспрессиясы доксициклинмен бірге нысана немесе нысанасыз бақылау (NTC) синтетикалық gРНК трансфекциясы арқылы индукцияланды. (B) GA-ға бай мРНК элементтерінде жиналған CNBP, KIF1C және болжамды қосымша факторлардан тұратын РНК тасымалдау кешенін бейнелейтін схема. dCas13-dsRBD/gРНК кешенінің GA-ға бай аймақтарға байланысуы RBP байланысуына кедергі келтіреді және тасымалдау кешенінің ыдырауына әкеледі деп болжанады. BioRender бағдарламасында жасалған. Mason, D. (2026) https://BioRender.com/kdmxt2k (C) Көрсетілген gРНК-лармен трансфекцияланған dCas13-B2 экспрессиялайтын (+dox) және экспрессияламайтын (-dox) жасушалардағы NET1 және GFP мРНК-ларының өкілдік FISH суреттері. Қосымша жағдайлардың суреттері S1B қосымша суретінде келтірілген. Үшбұрышты көрсеткілер NET1 мРНК жиналған аймақтарды көрсетеді. (D) Нормализацияланған PDI мәндерінің диапазонын (нысана/NTC gРНК) және GA қамтитын мРНК-лар үшін сәйкес мРНК таралуын бейнелейтін схема. (E) dCas13-dsRBD экспрессиялайтын жасушалардағы нормализацияланған NET1 мРНК PDI мәндері. 4-6 тәуелсіз эксперименттен әрбір жағдай үшін n = 128-181 жасуша. ** P &amp;lt; 0.002, **** P &amp;lt; 0.0001, ns: Даннеттің көптік салыстыру тесті бар Краскел-Уоллис ANOVA бойынша маңызды емес. Өңделмеген PDI мәндері S1D қосымша суретінде келтірілген. (F) Anti-FLAG моншақтарын қолдана отырып, dCas13-dsRBD иммунопреципитациясының (IP) өкілдік вестерн-блот суреттері. (G) dCas13-dsRBD IP-дегі нысана (NET1) және нысанасыз (GUSB және RAB13) мРНК-лардың байытылуы. РНК-лар ddPCR арқылы анықталды және NET11067 gРНК болған кездегі мөлшері сәйкес NTC gРНК-ға нормализацияланды. Әрбір жағдай үшін n = 4 тәуелсіз эксперимент. Даннеттің көптік салыстыру тесті бар екі факторлы ANOVA бойынша *** P &amp;lt; 0.001 және **** P &amp;lt; 0.0001. (E) және (G) панельдеріндегі бағанды диаграммалар орташа мәнді ± стандартты қатені (SEM) жеке деректер нүктелерінің үстіне қойып көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f4.jpg\" alt=\"4-сурет. Мультимерлі массивтерден өңделген gРНК-лардың цитозольдік байытылуы үшін dCas13-B2 ұзақ мерзімді экспрессиясы қ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. Мультимерлі массивтерден өңделген gРНК-лардың цитозольдік байытылуы үшін dCas13-B2 ұзақ мерзімді экспрессиясы қажет. (A) dCas13-B2 арқылы gРНК массивін өңдеу схемасы. (B) U6-NET11067 gРНК массиві мен көрсетілген ақуыздарды экспрессиялайтын HEK293 жасушаларының жалпы РНК-сынан NET11067 gРНК-ны өкілдік Northern blot арқылы анықтау. Синтетикалық gРНК-ға өлшемі бойынша ұқсас фрагмент dCas13-B2 конструктөрлерін экспрессиялайтын жасушаларда анықталды, бұл массивтің өңделгенін көрсетеді. U6 snRNA жүктеу бақылауы ретінде қызмет етті. (C) Цитозольде gРНК жиналуы үшін dCas13-B2 экспрессиясы уақытының әсерін сынауға арналған эксперименталдық қондырғының схемасы. Қолданылған MDA-MB-231 жасушалары Dox-индукцияланатын dCas13-B2-мен тұрақты түрде біріктірілген. (D) (C) бөлімінде сипатталған жағдайларда RNAscope көмегімен анықталған NET11067 gРНК және GFP мРНК-ның өкілдік FISH суреттері. GFP мРНК пен gРНК екеуін де экспрессиялайтын жасушалардың аймағы көк түспен көрсетілген. Ядро контурлары қызыл түспен көрсетілген. (E) Ядроға қатысты (сол жақта) немесе бүкіл жасуша мөлшеріне қатысты (оң жақта) цитоплазмалық NET11067 gРНК мөлшері. (C) бөлімінде сипатталғандай, әрбір жағдай үшін n = 16-31 жасуша; Холм-Сидактың көптік салыстыру тесті бар бір факторлы ANOVA бойынша * P &amp;lt; 0.05. (F)-(G) dCas13-B2 экспрессиясы индукциядан кейін 24 сағат өткен соң шыңына жететінін көрсететін өкілдік вестерн-блот және сандық бағалау. n = 3 тәуелсіз эксперимент. (H) NCS1 синтездері негізінен ядролық екенін көрсететін dCas13-B2 және dCas13-B2-NCS1 экспрессиялайтын жасушалардың өкілдік GFP флуоресценциясы мен фазалық суреттері. (I) MDA-MB жасушалары көрсетілген dCas13-B2 конструктөрлерімен және U6-NET11067 gРНК массивімен уақытша трансфекцияланды. Өкілдік FISH суреттері цитоплазмалық және ядролық gРНК мөлшерін сандық бағалаумен NET11067 gРНК және GFP мРНК көрсетеді. Әрбір жағдай үшін n = 30-32 жасуша; Краскел-Уоллистің көптік салыстыру тесті бар бір факторлы ANOVA бойынша маңызды емес (ns). (G), (E) және (I) панельдеріндегі бағанды диаграммалар орташа ± SEM-ді жеке деректер нүктелерінің үстіне қойып көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f5.jpg\" alt=\"5-сурет. Тұрақты біріктірілген dCas13-B2/gРНК массиві жүйесі эндогендік NET1 мРНК таралуын өзгертеді. (A) Housekeeping г\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. Тұрақты біріктірілген dCas13-B2/gРНК массиві жүйесі эндогендік NET1 мРНК таралуын өзгертеді. (A) Housekeeping гені GusB-ге нормализацияланған NET11067 gРНК-ның ddPCR арқылы сандық бағалауы. U6-gRNA массиві бар жасушалық желілер жалпы gРНК молшылығын жоғарырақ көрсетеді. n = 3-4 тәуелсіз эксперимент; Холм-Сидактың көптік салыстыру тесті бар бір факторлы ANOVA бойынша ** P &amp;lt; 0.01. (B) Индукцияланатын (pIND20) немесе конститутивті (CMV) dCas13-B2 экспрессиясы бар тұрақты жасушалық желілердегі цитоплазмалық NET11067 gРНК табиғи логарифм (ln) қарқындылықтары ((C) бөліміндегідей FISH суреттерінен). Dox индукциясының күндері көрсетілген. 2 тәуелсіз эксперименттен әрбір жағдай үшін n =
