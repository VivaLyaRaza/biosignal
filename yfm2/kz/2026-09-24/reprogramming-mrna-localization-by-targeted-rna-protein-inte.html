            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"220\" cy=\"125\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"680\" cy=\"287\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · CELL BIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;CRISPR көмегімен мРНК&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;тасымалдауды бағыттау әдісі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte-f1.jpg\" alt=\"1-сурет. dCas13-dsRBD синтездері нысана мРНК-мен жақсартылған байланысу арқылы мРНК-ның жасуша өсінділеріне локализацияс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. dCas13-dsRBD синтездері нысана мРНК-мен жақсартылған байланысу арқылы мРНК-ның жасуша өсінділеріне локализациясын өзгертеді. (A) Тексерілетін индукцияланатын dCas13-dsRBD конструктөрлерін көрсететін схема. MDA-MB-231 жасушаларындағы dCas13-dsRBD экспрессиясы доксициклинмен бірге нысана немесе нысанасыз бақылау (NTC) синтетикалық gРНК трансфекциясы арқылы индукцияланды. (B) GA-ға бай мРНК элементтерінде жиналған CNBP, KIF1C және болжамды қосымша факторлардан тұратын РНК тасымалдау кешенін бейнелейтін схема. dCas13-dsRBD/gРНК кешенінің GA-ға бай аймақтарға байланысуы RBP байланысуына кедергі келтіреді және тасымалдау кешенінің ыдырауына әкеледі деп болжанады. BioRender бағдарламасында жасалған. Mason, D. (2026) https://BioRender.com/kdmxt2k (C) Көрсетілген gРНК-лармен трансфекцияланған dCas13-B2 экспрессиялайтын (+dox) және экспрессияламайтын (-dox) жасушалардағы NET1 және GFP мРНК-ларының өкілдік FISH суреттері. Қосымша жағдайлардың суреттері S1B қосымша суретінде келтірілген. Үшбұрышты көрсеткілер NET1 мРНК жиналған аймақтарды көрсетеді. (D) Нормализацияланған PDI мәндерінің диапазонын (нысана/NTC gРНК) және GA қамтитын мРНК-лар үшін сәйкес мРНК таралуын бейнелейтін схема. (E) dCas13-dsRBD экспрессиялайтын жасушалардағы нормализацияланған NET1 мРНК PDI мәндері. 4-6 тәуелсіз эксперименттен әрбір жағдай үшін n = 128-181 жасуша. ** P &amp;lt; 0.002, **** P &amp;lt; 0.0001, ns: Даннеттің көптік салыстыру тесті бар Краскел-Уоллис ANOVA бойынша маңызды емес. Өңделмеген PDI мәндері S1D қосымша суретінде келтірілген. (F) Anti-FLAG моншақтарын қолдана отырып, dCas13-dsRBD иммунопреципитациясының (IP) өкілдік вестерн-блот суреттері. (G) dCas13-dsRBD IP-дегі нысана (NET1) және нысанасыз (GUSB және RAB13) мРНК-лардың байытылуы. РНК-лар ddPCR арқылы анықталды және NET11067 gРНК болған кездегі мөлшері сәйкес NTC gРНК-ға нормализацияланды. Әрбір жағдай үшін n = 4 тәуелсіз эксперимент. Даннеттің көптік салыстыру тесті бар екі факторлы ANOVA бойынша *** P &amp;lt; 0.001 және **** P &amp;lt; 0.0001. (E) және (G) панельдеріндегі бағанды диаграммалар орташа мәнді ± стандартты қатені (SEM) жеке деректер нүктелерінің үстіне қойып көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Жасушалар өз ішіндегі ақуыздар мен макромолекулаларды белгілі бір бағыттар бойынша тасымалдайды, ал қатерлі ісіктер бұл жүйені өз мүддесіне пайдаланады. Осы үдеріске ДНК-ны зақымдамай дәл және ұзақ мерзімді түрде әсер ету бұрын мүмкін емес еді. Зерттеушілер цитоплазмадағы қажетті байланыстарды бұғаттау үшін бейімделген CRISPR жүйесін қолданды. Бұл жасушалардың қозғалысын сырттан басқаруға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;dCas13 жүйесі цитоплазмада мРНК мен CNBP байланысын бұғаттайды&lt;/li&gt;\n&lt;li&gt;NET1 мРНК тасымалының бұзылуы жасушалардың қозғалғыштығын азайтады&lt;/li&gt;\n&lt;li&gt;Әдіс тышқандардағы өкпе метастаздарының көлемін едәуір қысқартты&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жасушаішілік тасымалдау негізінен матриcaлық РНК мен арнайы ақуыздардың өзара әрекеттесуі арқылы жүзеге асады. CNBP ақуызы бұл процесте маңызды рөл атқарады. Бұрын бұл байланыстарды антисенсорлық олигонуклеотидтер арқылы тежеуге тырысқанымен, олардың әсері қысқа мерзімді болды. Авторлар бұл мәселені шешу үшін белсенді емес dCas13 жүйесін арнайы бағыттаушы РНК-лармен біріктіріп қолданды.&lt;/p&gt;\n&lt;p&gt;Sut безі обырының MDA-MB-231 жасушалық желілері мен HEK293T жасушаларында жүргізілген тәжірибелер dCas13 кешенінің тиімділігін көрсетті. NET1 генінің мРНК тасымалдау бағытын өзгерту арқылы CNBP ақуызының қосылуына кедергі жасалды. Нәтижесінде жасушалардың миграциялық жылдамдығы мен инвазиялық қабілеті айтарлықтай төмендеді.&lt;/p&gt;\n&lt;p&gt;Зерттеудің келесі кезеңінде бұл әдіс тышқандарда тексерілді. NET1 мРНК локализациясын бұзу in vivo жағдайында өкпедегі метастаздық колониялардың түзілуін айтарлықтай азайтты. Бұл тәсіл РНК-ақуыз байланыстарын ұзақ мерзімді бақылауға және ісік процестерін зерттеуге жаңа мүмкіндіктер ашады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер тек жасуша культуралары мен жануарлар модельдерінде алынғандықтан, клиникалық сынақтарды қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;РНҚ-байланыстырушы ақуыздар (РБП) РНҚ-мен күрделі рибонуклеопротеиндік кешендер құрамында өзара әрекеттесіп, РНҚ тіршілік циклінің әртүрлі аспектілерін және соның нәтижесінде жасуша функцияларын реттейді. Олардың маңыздылығына қарамастан, нақты РНҚ-РБП байланысу оқиғаларының функционалдық үлесін, әсіресе ұзақ мерзімді фенотиптік талдауларда анықтау қиын күйінде қалып отыр. Бұл жұмыста біз нақты РНҚ-РБП өзара әрекеттесуін бұзу үшін CRISPR/dCas13 спецификалығын қолданамыз.&lt;/p&gt;\n&lt;p&gt;Біз бұл әдістемені CNBP РНҚ-байланыстырушы ақуызын тарқататын және мРНК тасымалдау кешендерін құрастыру үшін платформа қызметін атқаратын ГА-ға бай мРНК локализация элементтеріне қолданамыз. Біз dCas13/gRNA нысана транскрипттермен жоғары спецификалық түрде байланысып, CNBP тартылуына кедергі келтіретінін көрсетеміз, бұл нысана мРНК локализациясының және жасуша қозғалысының өзгеруіне әкеледі, бұл нысана мРНК-лардың функциясына сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR/dCas13 жүйесі РНҚ-ны кеспейтін, керісінше гид-РНҚ көмегімен оған бағытталатын өзгертілген Cas13 ақуызын пайдаланады, бұл РНҚ-ны бұзмай оның функцияларын зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз бұл жүйені тұрақты енгізу үшін оңтайландырулар мен маңызды аспектілерді сипаттаймыз. Сонымен қатар, біз оны құрамында ГА элементтері бар NET1 мРНК локализациясын бұзу қатерлі ісік жасушаларының инвазивтілігін және өкпенің метастатикалық колонизациясын төмендететінін көрсету үшін қолданамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR/dCas13 көмегімен NET1 мРНК локализациясын бұзу in vivo эксперименттерінде қатерлі ісік жасушаларының инвазиясы мен өкпе метастаздарын азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл деректер онкогенездегі мРНК локализациясының ықтимал рөлін ашып көрсетеді және осы CRISPR негізіндегі жүйені in vivo жағдайында РНҚ-РБП өзара әрекеттесуін ұзақ мерзімді функционалдық зерттеулер үшін қалай пайдалануға болатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу in vivo модельдерінде ісікке қарсы әсерді көрсетеді, алайда бұл нәтижелерді клиникалық тәжірибеге көшіру қосымша ауқымды тексерулерді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Ген экспрессиясын транскрипциядан кейінгі реттеу бірінші кезекте нысана мННҚ ішіндегі арнайы тізбектермен немесе құрылымдық мотивтермен динамикалық түрде әрекеттесетін РНҚ-байланыстырушы ақуыздар (RBP) арқылы жүзеге асырылады. РНҚ-RBP байланысу оқиғалары мННҚ метаболизмінің барлық аспектілеріне, соның ішінде өңдеуге, тұрақтылыққа, трансляцияға және локализацияға әсер етеді. мННҚ-ның 3'-UTR аймақтары көбінесе жасушалық протеомды қалыптастыру үшін күрделі кеңістіктік-уақыттық реттеуді үйлестіретін арнайы RBP тартатын көптеген тізбек элементтерін қамтиды. Бұл өзара әрекеттесулердің маңыздылығын ата көрсете отырып, олардың дисрегуляциясы әртүрлі аурулармен, соның ішінде қатерлі ісікпен байланысты. RBP байланысу сайттарын транскриптом көлемінде картаға түсірудегі соңғы жетістіктер рибонуклеопротеидтердің құрылуы мен ұйымдасуы туралы көзқарастарымызды айтарлықтай жақсартты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RBP (РНҚ-байланыстырушы ақуыздар) — бұл мННҚ молекулаларына қосылып, олардың жасушадағы синтезінен бастап ыдырауына дейінгі тағдырын басқаратын молекулалық реттеушілер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дегенмен, арнайы РНҚ-RBP өзара әрекеттесулерін зерттеу және олардың жеке функционалдық үлестерін түсіну негізінен қиын болып қала береді. RBP сарқылуын қамтитын әдеттегі тәсілдер жанама әсерлерге ие болуы мүмкін, өйткені бір RBP бірнеше РНҚ-мен байланыса алады және демек, күрделі реттеуші желіге ие. Екінші жағынан, цис-реттеуші РНҚ тізбегі элементтерінің нақты генетикалық жойылуы немесе мутациясы күрделі болуы мүмкін, уақытша басқару қиын және геномдық ДНҚ тізбегінің өзгеруін қамтитындықтан қайтымсыз болып табылады. Антисмысловый олигонуклеотидтерді (ASO) қолданатын балама тәсіл арнайы РНҚ-RBP өзара әрекеттесуін блоктайтын икемді әдістемені ұсынады.&lt;/p&gt;\n&lt;p&gt;Алайда, бөлінетін жасушалардағы ASO әсерлері қысқа мерзімді және тізбекке тән РНҚ-RBP бұзылуы кезінде ұзақ мерзімді фенотиптік салдарды зерттеуге мүмкіндік бермейді. Жоғарыда аталған себептер ауруға қатысты модельдер мен уақыт ауқымдарында функционалдық түсініктерді алу үшін тізбекке тән РНҚ-RBP өзара әрекеттесуін таңдамалы түрде бұза алатын құралды әзірлеу қажеттілігін көрсетеді. Эффекторлық ақуыздың ең аз табиғаты мен ықшам ұйымдасуы арқасында 2-ші сыныпты CRISPR-Cas жүйелері нуклеин қышқылдарын басқарудың маңызды құралдары ретінде пайда болды. VI типті CRISPR-Cas жүйелері, атап айтқанда РНҚ-ны нысанаға алатын CRISPR-Cas13 негізіндегі жүйелер РНҚ-ны өңдеуді, өңдеуді, локализациялауды, сондай-ақ транскриптке тән протеомдық өзара әрекеттесулерді картаға түсіруді қоса алғанда, әртүрлі транскриптке тән әсерлерді бағыттау үшін бағдарламаланатын қосқыш ретінде кеңінен қолданылуда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тышқандар мен жасуша желілерінде жүргізілген тәжірибелер негізгі механизмдерді анықтауға көмектеседі, бірақ реттеуші желілердегі айырмашылықтарға байланысты нәтижелерді адам патологияларына экстраполяциялауда сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл тәсілдер Cas ақуызымен біріктірілген эффекторлық фермент/фактор нысана РНҚ-ға өз әсерін тигізетін арнайы РНҚ аймақтарына каталитикалық белсенді емес dCas13/gRNA кешендерін тарту үшін бағыттаушы РНҚ (gRNA) тізбегінің ерекшелігін пайдаланады. Мұнда біз арнайы РНҚ-RBP өзара әрекеттесулерімен стерикалық түрде бәсекелесе алатын және бұза алатын генетикалық кодталған ASO аналогын әзірлеу үшін dCas13-тің РНҚ-ны нысанаға алу қабілетін пайдалануға тырыстық. Бұл жүйені сынақтан өткізу үшін біз оны мННҚ-ның шеткі жасушалық өсінділеріне тасымалдануын қамтамасыз ететін GA-ға бай 3'UTR элементтеріне қолдандық. GA-ға бай элементтер CNBP РНҚ-байланыстырушы ақуызын және KIF1C микротүтікшелі моторын тарту арқылы РНҚ көлік кешенінің қалыптасуын бағыттайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dCas13/gRNA жүйесі CNBP-тің GA элементтерімен байланысуын бәсекелі түрде тежейді, бұл ASO әсерлерін сәтті еліктеуге және қатерлі ісік жасушаларының инвазивтілігін төмендетуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;GA-ға бай элементтерге бағытталған ASO мННҚ-CNBP-KIF1C кешенінің түзілуін бұзады және нәтижесінде мННҚ тасымалдануын азайтады, бұл миграция жылдамдығы мен инвазивтілігі төмендеген жасушалық фенотиптерге әкеледі. Сондықтан, GA-ға бай элементтерге негізделген мННҚ реттелуі CRISPR-dCas13/gRNA тиімділігін функционалдық араласу құралы ретінде бағалау және стандарттау үшін биологиялық маңызды ортаны ұсынады. Мұнда біз нысана РНҚ-мен байланысу күші, сондай-ақ цитоплазмалық gRNA мөлшері dCas13/gRNA кешенінің РНҚ элементінің функциясымен бәсекелесу қабілетін шектейтінін анықтадық.&lt;/p&gt;\n&lt;p&gt;Біз GA-ға тәуелді мННҚ локализациясын бұзатын толығымен генетикалық кодталған, тұрақты экспрессияланатын CRISPR-dCas13/gRNA жүйесін енгізуге мүмкіндік беретін оңтайландыруларды сипаттаймыз. Бұл әсер CNBP байланысуының бәсекелестігімен арқылы жүзеге асырылады және жасуша мінез-құлқының айтарлықтай өзгеруіне әкелетін ASO негізіндегі араласулармен ауқымы бойынша салыстырмалы болып табылады. Біз бұл құралды ұзақ мерзімді функционалдық зерттеулермен біріктіріп, құрамында GA бар NET1 мННҚ-ның дұрыс емес бағытталуы in vitro жағдайында қатерлі ісік сфероидтарының инвазивтілігінің төмендеуіне және тышқандардағы өкпенің метастатикалық колонизациясының азаюына әкелетінін көрсеттік. Бұл жұмыс ұзақ мерзімді функционалдық үлестерін түсінуге қажетті қадамды қамтамасыз ете отырып, нақты РНҚ-RBP өзара әрекеттесулеріне таңдамалы және бақыланатын араласу үшін CRISPR-Cas құралдарының ерекшелігін пайдаланудың жаңа стратегиясын сипаттайды.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;dCas13-dsRBD қосындылары dCas13-мРНҚ байланысуын күшейтеді және GA-ға бай РНҚ элементінің функциясына кедергі жасайды&lt;/p&gt;\n&lt;p&gt;CRISPR-dCas13 жүйесінің RBP-РНҚ арақатынасына кедергі жасау қабілетін бағалау үшін біз доксициклинмен индукцияланатын промотордың басқаруымен каталитикалық белсенді емес RfxCas13d акуымын (dRfxCas13d; бұдан әрі dCas13 деп аталады) тұрақты түрде экспрессия жасадық. dCas13 биохимиялық тазарту және сипаттау үшін C-ұшындағы eGFP және FLAG тегтерімен біріктірілді (1A-сурет). Сонымен қатар, dCas13/gРНҚ-ның нысана мРНҚ-ға байланысуын күшейту үшін қос тізбекті РНҚ-байланыстырушы домен (dsRBD) қосылды [21]. Біз қос тізбекті РНҚ-ға әртүрлі аффиндігі бар әртүрлі ақуыздардың (PKR, PRKRA, DIP1, B2) dsRBD домендерін қолдандық (1A-сурет) [33-36]. Доксициклинмен индукцияланатын dCas13-dsRBD экспрессия кассеталары MDA-MB-231 жасушаларына тұрақты түрде біріктірілді. Трансгенді индукциялау сызықтар арасында ұқсас экспрессия деңгейлеріне әкелді, тек dCas13-DIP1 бұдан тыс қалды, ол тұрақты түрде төменірек жалпы экспрессияны көрсетті (S1A-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dCas13-dsRBD — бұл нысана РНҚ молекуласына берігірек бекіну үшін «мүжілмеген» dCas13 ферментіне dsRBD ақуыз домені қосылған өзгертілген CRISPR жүйесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;dCas13-ті арнайы мРНҚ-ларға бағыттау үшін біз доксициклинмен индукцияланған жасушаларға синтетикалық бағыттаушы РНҚ-ларды (gРНҚ) трансфекция жасадық. gРНҚ мРНҚ реттелуіне қатысатын 3'UTR тізбектерін нысанаға алу үшін немесе адам транскриптомында жоқ тізбектерге қарсы (Нысанаға алмайтын бақылау gРНҚ-лары — NTC1, NTC2) жобаланды. dCas13-dsRBD қосындылары RBP-РНҚ арақатынасына функционалды түрде кедергі жасай алатынын анықтау үшін біз CNBP РНҚ-байланыстырушы ақуызын және KIF1C микротүтікшелі моторын тарты арқылы РНҚ-ның жасуша перифериясына тасымалдануын ынталандыратын GA-ға бай элементтерге назар аудардық (1B-сурет) [25, 26]. NET1 немесе RAB13 мРНҚ-ларындағы GA-ға бай аймақтарға қарсы антисмыстық олигонуклеотидтер (ASO) CNBP байланысуына жол бермейді, бұл нысана мРНҚ-лардың ядро маңында көбірек таралуына және жасуша миграциясының функционалды бұзылуына әкеледі [12, 13, 26, 28].&lt;/p&gt;\n&lt;p&gt;CRISPR-dCas13 осындай түрде CNBP-ке тәуелді тасымалдануға кедергі жасай алатынын бағалау үшін біз NET1 мРНҚ-ның GA-ға бай аймағына gРНҚ жобаладық (NET11067 gРНҚ). Эндогендік NET1 мРНҚ таралуы in situ флуоресцентті гибридизация (FISH) көмегімен транскрипттерді визуализациялау арқылы талданды (1C-сурет және S1B-сурет). dCas13-dsRBD экспрессиясының өзгергіштігін бақылау үшін біз GFP РНҚ мөлшері салыстырмалы жасушаларды таңдадық (1C-сурет және S1B, C-сурет). NET1 мРНҚ таралуы бұрын сипатталған перифериялық таралу индексін (PDI) өлшеу арқылы сандық түрде анықталды [31]. PDI мәндері гипотетикалық толығымен диффузияланған РНҚ-ға қатысты нормаланады (PDI=1), сондықтан жоғары PDI мәндері РНҚ-ның перифериялық таралуын көрсетсе, төменгі мәндер ядро маңындағы ығысуды білдіреді. S1D-суретте шикі NET1 мРНҚ PDI мәндері көрсетілген. NET1 мРНҚ базальды PDI мәніндегі кейбір өзгергіштік тіпті бақылау жағдайларында да байқалады (S1D-сурет, NTC1 gРНҚ үлгілерін қараңыз), бұл әртүрлі dCas13-dsRBD қосындыларының тұрақты экспрессиясы кезінде жасуша сызығына тән ауытқуларға байланысты болуы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әртүрлі жасуша сызықтарында базальды PDI мәндерінің ауытқуы конструкциялардың тұрақты экспрессиясының фондық әсерін көрсетеді, бұл бақылау үлгілеріне қатаң нормалауды талап етті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әрбір dCas13-dsRBD сызығында NET11067 gРНҚ-ның өзіндік әсерін атап көрсету үшін NET1 PDI мәндері NTC1 gРНҚ жеткізілген кездегі мәндерге нормаланды (1D және 1E-сурет). Бір қызығы, dsRBD болмаған жағдайда, dCas13/NET11067 gРНҚ NET1 таралуын елеулі түрде өзгертпеді (1E-сурет және S1D-сурет, dCas13 жолақтары). Керісінше, dCas13-dsRBD қосындылары, dCas13-DIP1 қоспағанда, NET1 локализациясын айтарлықтай бұзды (S1D-сурет). B2 dsRBD локализацияға ең айқын әсер етті және өзгертілмеген dCas13-пен салыстырғанда локализацияны айтарлықтай нашарлатқан жалғыз dsRBD болды (1E-сурет). Бұл әсер тек gРНҚ трансфекциясына ғана байланысты екенін жоққа шығару үшін біз NET11067 gРНҚ-мен трансфекцияланған, бірақ доксициклинмен индукцияланбаған dCas13-B2 және dCas13-PKR жасуша сызықтарында NET1 PDI өлшедік. Бұл жағдайларда NET1 PDI өзгеріссіз қалды, бұл бұл әсердің dCas13 экспрессиясына тәуелді екенін көрсетеді (1E-сурет және S1D-сурет, -dox жолақтары). Демек, dCas13-тің dsRBD-мен бірігуі оның GA-ға бай РНҚ элементінің функциясына кедергі жасау қабілетін күшейтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dCas13-тің B2 dsRBD ақуыз доменімен бірігуі NET1 мРНҚ перифериялық локализациясын айтарлықтай бұзады (доксициклин индукциясына тәуелді түрде), ал dsRBD жоқ таза dCas13 мұндай әсер көрсетпейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз dCas13-dsRBD қосындыларының NET1 локализациясына кедергі жасау қабілетінің артуы олардың нысана мРНҚ-мен тұрақтырақ байланысуынан туындайды деп болжадық. Мұны тексеру үшін біз dCas13-ті тұрақты байланысқан РНҚ-лармен бірге иммунопреципитация жасадық. NTC немесе NET11067 gРНҚ қатысуында dCas13 қосындыларын иммунопреципитациялау үшін anti-FLAG тег антиденелері қолданылды, содан кейін ddPCR арқылы эндогендік мРНҚ-лар анықталды (1F және 1G-сурет). Шын мәнінде, dsRBD қосындылары таза dCas13-пен салыстырғанда нысана NET1 мРНҚ-ның жоғарырақ байытылуын көрсетті. B2 dsRBD ең жоғары байытуды көрсетті, бұл оның жоғарыда көрсетілген NET1 мРНҚ локализациясына күштірек әсеріне сәйкес келеді. Сонымен қатар, басқа нысанаға алынбаған мРНҚ-лар (GUSB, RAB13) елеулі түрде байытылмады (1G-сурет), бұл dCas13 қосындыларының тек gРНҚ нысанаға алған транскриптпен ғана байланысатынын көрсетеді. Біз сынақтан өткен dsRBD арасында B2 dsRBD dCas13/gРНҚ-ның нысана мРНҚ-мен ассоциациясын тұрақтандыру және нысанаға алынған тізбекке функционалды түрде кедергі жасау үшін оңтайлы әдісті ұсынады деген қорытындыға келеміз. Осылайша, біз әрі қарай сипаттау үшін dCas13-B2 таңдадық.&lt;/p&gt;\n&lt;p&gt;dCas13-B2 нысанадан тыс байлануды барынша азайта отырып, РНК элементінің функциясына тізбекке тән түрде кедергі жасайды&lt;/p&gt;\n&lt;p&gt;dCas13-B2 функционалдық РНК элементтерімен кеңінен байланыса алатынын және олардың жұмысына кедергі жасай алатынын бағалау үшін біз NET1 және RAB13 3'UTR құрамындағы әртүрлі аймақтарға бағытталған gRNA-ларды жобаладық (2A және B-сур.). NET1921 және NET1975 gRNA-лары NET1 3'UTR шегіндегі GA-ға бай аймаққа бағытталған, бұл аймақ NET11067 gRNA бағытталған аймақ сияқты NET1 перифериялық локализациясы үшін функционалды түрде маңызды екені көрсетілген. Екінші жағынан, NET11351 gRNA NET1 трафигіне қатыспайтын аймаққа бағытталған [12]. Сол сияқты, RAB13191 және RAB13230 gRNA-лары RAB13 локализациясы үшін маңызды GA-ға бай аймаққа бағытталған, ал RAB13360 және RAB13391 gRNA-лары функционалды емес UTR аймағына бағытталған [13]. Бұл gRNA-лардың dCas13-B2-ні белгілі мРНК-ларға бағыттау қабілеті ко-иммунопреципитация эксперименттерінде, содан кейін ddPCR көмегімен анықтау әдісімен бағаланды (SN S2-сур.). Шынында да, барлық NET1 gRNA-лары dCas13-B2 IP-лерінде NET1 мРНК-сының айтарлықтай байыуына әкелді, ал нысанаға алынбаған транскрипттер (GUSB, RAB13) айтарлықтай байымады (2A-сур.). Керісінше, RAB13 gRNA-лары RAB13-тің айтарлықтай байыуына әкелді, бірақ NET1 немесе GUSB мРНК-ларын байытқан жоқ (2B-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dCas13-B2 бен gRNA кешендері мақсатты NET1 және RAB13 мРНК-ларын өзіне тән түрде байланыстырып, бөгде транскрипттерді ұстамай иммунопреципитация кезінде оларды байытады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ddPCR (тамшылы сандық ПТР) — үлгіні мыңдаған тамшыларға бөлу арқылы нуклеин қышқылдарын абсолютті сандық анықтаудың жоғары дәлдіктегі әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;dCas13 пен нысана емес мРНК арасындағы арнайы емес өзара әрекеттесулер бұрын сипатталған және көбінесе, бірақ тек қана емес, gRNA тізбегіне байланысты [37]. dCas13-B2 бағыттау спецификалығын одан әрі бағалау үшін біз мыналарды қамтитын nanoString nCounter панельдерін әзірледік: а) ішінара комплементарлыққа негізделген әрбір gRNA-ның әлеуетті нысанадан тыс транскрипттері; б) бұрын сипатталған Cas13d нысанадан тыс нысандары [37]; және в) NET1 және RAB13 сияқты KIF1C көмегімен жасуша өсінділеріне тасымалданатын GA-ға бай аймақтары бар қосымша мРНК-лар (толық тізім үшін SN S3-кестені қараңыз). Маңыздысы, dCas13-B2 ко-иммунопреципитация үлгілерінде айтарлықтай байытылған жалғыз мРНК-лар әрбір gRNA-ның нысандары болды (2C-E-сур.; маңыздылық табалдырығы &amp;gt; 2 есе артық байыту және p ≤ 0,01; Бастапқы деректер SN S3-кестеде келтірілген), ал қалған барлық РНК-лар тек фондық деңгейлерде анықталды, бұл dCas13-B2 индукциясы болмаған кезде байқалатын деңгейлерге ұқсас (2F-сур.). Сондықтан dCas13-B2 минималды нысанадан тыс байлануды көрсетеді.&lt;/p&gt;\n&lt;p&gt;dCas13-B2-нің NET1 және RAB13 UTR-леріне байланысуы осы мРНК трафигіне әсер ететінін анықтау үшін біз тиісті мРНК таралуын визуализациялау және сандық бағалау үшін FISH қолдандық (2G-I-сур.). Жоғарыда көрсетілгендей, барлық dCas13-B2/gRNA NET1 немесе RAB13 мРНК-сын байланыстыра алатынына қарамастан, тек функционалды маңызды GA-ға бай аймақтарға (NET1921/975, NET11067 және RAB13191/230) бағытталған gRNA-лар мРНК трафигінің бұзылуын көрсететін перифериялық локализация индексінің (PDI) айтарлықтай төмендеуіне әкелді (2H және I-сур.). NET1 және RAB13 перифериялық локализациясының төмендеуінің салдары жасуша миграциясының бұзылуы және жасуша қозғалысы жылдамдығының төмендеуі болып табылады [12,13,27]. Осыған сәйкес, dCas13-B2 NET1 және RAB13 GA-ға бай аймақтарына байланысқан кездегі РНК трафигінің төмендеуі кездейсоқ жасуша миграциясы жылдамдығының төмендеуімен бірге жүрді (2J-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тәжірибелер in vitro жасуша линияларында жүргізілген, сондықтан тірі ағзадағы тіндік немесе ағзалық деңгейдегі мРНК трафигіне әсер ету дәрежесі қосымша растауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Байқалған төмендеу тиісті мРНК трафигін бұзу үшін ASO қолдану арқылы бұрын хабарланған нәтижелермен салыстырмалы болды (SN S3-сур.). Сондықтан dCas13-B2 тізбекке өте тән түрде байланысады және жасушалық әрекеттерді өзгерту үшін жеткілікті дәрежеде РНК элементтерінің функциясына әсер етеді.&lt;/p&gt;\n&lt;p&gt;dCas13-B2-ні GA-ға бай элементке бағыттау CNBP рекрутингіне кедергі жасайды&lt;/p&gt;\n&lt;p&gt;dCas13-B2 тұрақты түрде байланыса алатынын және мРНК трафигін функционалды түрде өзгерте алатынын ескере отырып, біз dCas13-B2/gRNA кешендері GA-ға бай элементтерге RBP байланысуымен бәсекелесу арқылы жұмыс істейді деп болжадық (1B-сур.). Бұл болжамды тікелей сынау үшін біз dCas13-B2-нің RAB13 нысаналы транскрипттеріне CNBP байланысуымен бәсекелесетінін бағалау үшін тазартылған компоненттерді пайдаланатын in vitro жүйесіне жүгіндік (1B-сур.). Бұл жүйеде RAB13 3'UTR-ге сәйкес келетін in vitro транскрипцияланған РНК фрагменті өзінің 3' ұшында λ бактериофагының BoxB шпилькасын қамтитындай етіп жобаланған. BoxB тізбегі λN ақуызының пептидімен танылады, ол GST-пен біріктірілген кезде глутатион моншақтарында РНК және кез келген ассоциацияланған факторларды тұндыруға (pulldown) мүмкіндік береді (3A-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dCas13-B2/gRNA кешендері in vitro жағдайында нысаналы РНК-мен CNBP ассоциациясын төмендете отырып, RAB13 3'UTR-дегі GA-ға бай аймаққа CNBP ақуызының байланысуымен бәсекелеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GST-pulldown — ерітіндідегі ақуыздарды және олардың өзара әрекеттесу серіктерін бөліп алу үшін глутатион-трансферазаны пайдаланатын аффинді тұндыру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алдымен біз бактерияларда экспрессияланған және тазартылған CNBP 0,9 µM apparent K_d мәнімен RAB13 3' UTR-ге байланысқанын растадық (SN S4A және B-сур.). РНК-дағы GA-ға бай аймақтың жойылуы CNBP байланысуын төмендетті (SN S4A-сур.). Бұл нәтижелер CNBP-нің in vivo жағдайында RAB13 РНК-сымен тікелей өзара әрекеттесуі туралы бұрын хабарланған мәліметтерге және GA-ға бай аймақтың CNBP байланысуын ынталандырудағы рөліне сәйкес келеді [26]. Сонымен қатар, байқалған K_d басқа тәсілдер мен РНК субстраттарын қолдану арқылы CNBP үшін бұрын хабарланған мәндер диапазонында жатыр [32,38]. dCas13-B2/gRNA кешендерін бөліп алу үшін ақуыз HEK293 жасушаларында транзиенттік трансфекция арқылы өндіріліп, anti-FLAG антиденелері бар моншақтарда иммунопреципитацияланды және синтетикалық gRNA-мен жүктелді. Бос gRNA жойылды және dCas13-B2/gRNA кешендері артық FLAG пептидінің көмегімен элюцияланды, бұл олардың айтарлықтай байыуына әкелді (3B және C-сур.; SN S4C-сур.).&lt;/p&gt;\n&lt;p&gt;Содан кейін біз dCas13-B2-нің CNBP-нің RAB13 3'UTR-ге байланысуына қалай әсер ететінін бағаладық. Біз реакцияға қоса алатын dCas13-тің максималды мөлшері CNBP-ге қатысты субстехиометриялық болғанын атап өтеміз (SN S4C-сур.). Соған қарамастан, шектеулі мөлшерге қарамастан, dCas13/RAB13191/230 кешендері CNBP-нің нысаналы РНК-мен ассоциациясын айтарлықтай төмендетті (3D және E-сур.), сонымен бірге РНК пен dCas13-B2 арасындағы ассоциацияны арттырды (3D, F-сур. және SN S4D-сур.). Бұл нәтижелер dCas13-B2/gRNA кешендері РНК нысанында RBP рекрутингімен бәсекелесе алатыны туралы тұжырымды қолдайды. Біз dCas13-B2 арнайы РНК-RBP өзара әрекеттесулерін манипуляциялау және РНК элементтерінің функционалдық үлестерін зерттеу үшін тиімді, спецификалық және әмбебап құрал ретінде пайдаланылуы мүмкін екенін ұсынамыз.&lt;/p&gt;\n&lt;p&gt;Ядролық ұсталып қалу және экспрессия деңгейлері U6 басқаратын gRNA тиімділігін шектейді&lt;/p&gt;\n&lt;p&gt;Біздің осы уақытқа дейінгі зерттеулеріміз химиялық синтезделген gRNA-ны жасушаларға трансфекциялауға негізделген еді. Алайда бұл тәсіл ASO жеткізумен бірдей шектеулерге ие (яғни бөлінетін жасушаларда немесе тіндерде ұзақ мерзімді әсерлерді бағалай алмау және ретсіз сіңу; Кіріспе бөлімін қараңыз). CRISPR-dCas13 жақсартылған ASO баламасын қамтамасыз етуі үшін барлық қажетті компоненттер (яғни dCas13, сондай-ақ gRNA) генетикалық түрде кодталған және тұрақты түрде экспрессиялана алатын болуы тиіс. Сондықтан біз dox-индукцияланатын dCas13-B2 экспрессиялайтын жасушаларда gRNA экспрессия кассетасын (адамның U6 промоторының басқаруымен; U6-gRNA) тұрақты біріктіру үшін лентивирустық трансдукцияны қолдандық. Dox индукциясы талдауға 48 сағат қалғанда басталды.&lt;/p&gt;\n&lt;p&gt;Дегенмен, трансфекцияланған gRNA-дан айырмашылығы, біз U6 басқаратын NET11067 gRNA NET1 мРНК локализациясына байқаларлық әсер етпейтінін байқадық (S5A-сур.), бұл бақылау жасушаларыныкіне (U6-NTC1 gRNA экспрессиялайтын) ұқсас болып қала берді. Инфекцияның көп еселігін (MOI) 10 есе арттырғанның өзінде ешқандай әсер анықталған жоқ (S5A-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;U6 промоторы басқаратын gRNA өте төмен экспрессия деңгейін көрсетеді және ядро да ұсталып қалады, бұл CRISPR-dCas13 көмегімен цитоплазмалық RBP-мРНК өзара әрекеттесуін тиімді тежеуге кедергі жасайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз gRNA-ның dCas13-B2-нің нысана РНК-ға байланысуын бағыттау және RBP жұмылдыруымен бәсекелесу қабілеті негізінен gRNA мөлшеріне байланысты деп болжадық. Сонымен қатар, біз зерттейтін РНК локализациясын реттеу цитоплазмада жүретінін ескерсек, gRNA-ның цитоплазмада болуы да шектеуші фактор болуы мүмкін. Осылайша, біз gRNA мөлшерін бағалау үшін ddPCR және gRNA таралуын визуализациялау үшін RNAscope Plus smRNA талдауын қолдандық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ddPCR (тамшылы сандық ПЦР) — стандартты қисықтарды қолданмай ДНК немесе РНК молекулаларының абсолютті мөлшерін жоғары дәлдікпен анықтайтын әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;U6 басқаратын gRNA-ларды (NTC1 немесе NET11067) экспрессиялайтын жасушалық линиялар синтетикалық gRNA трансфекциясы кезінде анықталған мөлшермен салыстырғанда бірнеше есе төмен gRNA мөлшерін көрсетті (S5B және C-сур.). Жоғары MOI тек шамалы өсуге әкелді, ол тез арада платоға шықты (S5B және C-сур.).&lt;/p&gt;\n&lt;p&gt;gRNA-ны in situ визуализациялау үшін біз U6-NET11067 gRNA-ға қарсы smRNA зондтарын жасадық. Арнайы сигнал тұрақты экспрессиялайтын жасушаларда оңай анықталды, бірақ ата-аналық жасуша популяциясында болмады (S5D-сур.). Дегенмен, қызығы, сигнал негізінен ядродан анықталды, бұл экспрессияланған gRNA цитоплазмаға тиімді түрде экспортталмағанын көрсетті (S5D-сур.).&lt;/p&gt;\n&lt;p&gt;Жалпы алғанда, U6 басқаратын gRNA-лардың жеткіліксіз цитоплазмалық жиналуы да, төмен экспрессия деңгейлері де CRISPR-dCas13-тің цитоплазмалық RBP-РНК өзара әрекеттесуіне функционалды түрде араласу қабілетін шектейтіні көрінді. gRNA деңгейлерін арттыру үшін біз U6 промоторы тікелей қайталанулармен бөлінген 8-10 gRNA тізбегін қамтитын ізбасардың транскрипциясын басқаратын gRNA массивірін экспрессияладық. Жеке gRNA-лар Cas13 каталитикалық белсенділігі арқылы мұндай массивтерден бөлініп шыға алады (4A-сур.).&lt;/p&gt;\n&lt;p&gt;Маңыздысы, HEPN доменіндегі мутацияларға байланысты мРНК-ны бөлшектемейтін dCas13 варианты gRNA массиві мен өңдеу белсенділігін сақтайды [29]. Осыған сәйкес, Northern блоттинг талдауы dCas13-B2 U6-gRNA массивтерін жетілген gRNA-ларға өңдей алатынын көрсетті (4B-сур.). Соған қарамастан, gRNA-ны in situ анықтау gRNA-ның айтарлықтай мөлшері әлі де ядро да ұсталып қалатынын көрсетті.&lt;/p&gt;\n&lt;p&gt;Атап айтқанда, U6-gRNA массив кассетасы жасушаларға жеткізіліп, содан кейін dCas13-B2 экспрессиясы индукцияланған кезде (4C-сур., «Кейін»), gRNA сигналының жартысына жуығы ядро да болды (4D және E-сур.). Қызығы, бұл gRNA таралуы dCas13-B2 мүлдем индукцияланбаған жағдайдағыдай болды (4D және E-сур.). Біз gRNA таралуын өзгерту үшін gRNA массивінің экспрессиясына дейін dCas13-B2 экспрессиясы қажет болады деп болжадық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сипатталған тәжірибелер in vitro жасушалық линияларында жүргізілген; gRNA-ның векторлық жеткізілуі және жасушішілік көлігі тірі ағза тіндерінде айтарлықтай өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мұны тексеру үшін dCas13 экспрессиясы U6-gRNA массив кассетасының трансфекциясына дейін индукцияланды (4C-сур., «Бұрын»). Қызығы, бұл ядролық gRNA төмендеуімен қатар цитоплазмалық gRNA-ның айтарлықтай өсуіне әкелді (4D және E-сур.). Бұл әсер dCas13-B2 жоғары экспрессиясына байланысты емес еді, өйткені dCas13-B2 экспрессиясы 48 сағатта шыңына жетеді (4F және G-сур.).&lt;/p&gt;\n&lt;p&gt;Біз gRNA-ның цитоплазмалық болуының нақты механикалық негізі туралы нақты қорытынды жасай алмасақ та, бұл деректер dCas13-B2 экспрессиясының уақыты немесе ұзақтығы маңызды екенін көрсетті. dCas13-тің қысқа мерзімді экспрессиясы цитоплазмада орын алатын RBP-РНК өзара әрекеттесуіне кедергі жасау үшін қажетті элемент болып табылатын жоғары мөлшердегі цитоплазмалық gRNA-ға қол жеткізу үшін оңтайлы емес.&lt;/p&gt;\n&lt;p&gt;Біз сондай-ақ ядролық компартментте dCas13-B2 болуын арттыру gRNA таралуына әсер ететінін зерттедік [39]. Ол үшін ақуыз қосымша екі SV40 ядролық локализация сигналынан және лейцинге бай ядролық экспорт сигналынан тұратын ядролық-цитоплазмалық тасымалдау (NCS1) модулімен біріктірілді [39]. Күтілгендей, dCas13-B2-NCS1 ақуызы айқынырақ ядролық жиналуды көрсетті (4H-сур.) және gRNA массивтерін өңдеуге де қабілетті болды (4B-сур.). Соған қарамастан, ол ядролық-цитоплазмалық gRNA таралуын әрі қарай жақсартпады (4I-сур.). Осылайша, біз қосымша трафиктік сигналдарды қоспастан dCas13-B2 фьюзингімен жұмысты жалғастырдық.&lt;/p&gt;\n&lt;h4 id=\"genetikalykh-kodtalghan-crispr-dcas13-zhuejesining-turakhty-ekspressiyasy-ga-elementine-taeueldi-mrnkh-tasymaldanuyn-baesengdetedi\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#genetikalykh-kodtalghan-crispr-dcas13-zhuejesining-turakhty-ekspressiyasy-ga-elementine-taeueldi-mrnkh-tasymaldanuyn-baesengdetedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генетикалық кодталған CRISPR-dCas13 жүйесінің тұрақты экспрессиясы GA-элементіне тәуелді мРНҚ тасымалдануын бәсеңдетеді&lt;/span&gt;&lt;/a&gt;Генетикалық кодталған CRISPR-dCas13 жүйесінің тұрақты экспрессиясы GA-элементіне тәуелді мРНҚ тасымалдануын бәсеңдетеді&lt;/h4&gt;\n&lt;p&gt;Жоғарыда келтірілген ақпаратқа сүйене отырып, біз gРНҚ массивтерін (құрамында NTC1 немесе NET11067 gРНҚ бар) dCas13-B2-ні конститутивті экспрессиялайтын жасушаларға (CMV_dCas13-B2) немесе dCas13-B2-нің индукцияланатын экспрессиясы бар жасушаларға (pIND20_dCas13-B2) тұрақты түрде енгіздік. Соңғы жағдайда dCas13-B2 экспрессиясы талдау алдында 2 немесе 7 күн бойы индукцияланды. Экспрессияланған gРНҚ мөлшері барлық жағдайларда ұқсас болды және бір U6-gRNA кассетасы арқылы қол жеткізілген деңгейден асып түсті (5A-сур.), бұл U6-gRNA массивтерінің gРНҚ өндірісін күшейтетінін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;gРНҚ (бағыттаушы РНҚ) — бұл CRISPR кешенін геномның немесе транскрипттің қажетті бөлігіне бағыттайтын РНҚ молекуласы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Индукцияланатын dCas13-B2 экспрессиясы тек 2 күннен кейін платоға жетті (S6A-сур.) және CMV_dCas13-B2 экспрессиялайтын жасушалардан айырмашылығы, жасушалардың тек бір бөлігінде байқалды (S6B-сур.). Соған қарамастан, жеке GFP-оң жасушалар dCas13-B2-GFP экспрессиясының ұқсас мөлшерін көрсетті (S6C-сур.). Бір қызығы, CMV_dCas13-B2 жасушаларында цитоплазмадағы gРНҚ мөлшері Dox көмегімен индукцияланған dCas13-B2 жасушаларымен салыстырғанда айтарлықтай жоғары болды (5B және C-сур.). Бұл айырмашылық тек gРНҚ жалпы мөлшеріндеги жалпы айырмашылықтарға байланысты емес еді, өйткені жалпы gРНҚ бойынша нормалау ұқсас үрдістерді көрсетті (S6D-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байқалатын әсерлер in vitro жасуша желілерінде алынған; тірі ағзадағы маңыздылығын растау үшін қосымша модельдер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл нәтижелер dCas13-тің қысқа мерзімді экспрессиясы цитоплазмалық gРНҚ-ның жоғары мөлшеріне қол жеткізу үшін оңтайлы емес деген тұжырымға сәйкес келеді. Шын мәнінде, dCas13-B2-ні 7 күн бойы ұзақ мерзімді индукциялау цитоплазмалық gРНҚ деңгейін жоғарылатты, дегенмен конститутивті экспрессиялайтын жасушалардағыдай дәрежеде болмаса да (5B-сур. және S6D-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;dCas13-B2 конститутивті экспрессиясы мен ұзақ мерзімді индукциясы (7 күн) нысандарды тиімді басу үшін цитоплазмада gРНҚ-ның жеткілікті жиналуын қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Цитоплазмалық gРНҚ мөлшеріндеги бұл айырмашылықтар dCas13-B2-нің GA-элементіне тәуелді мРНҚ нысанаға алуымен бәсекелесу қабілетіне әсер етпегенін бағалау үшін біз NET1 мРНҚ локализациясын өлшедік. Цитоплазмалық gРНҚ мөлшеріне сәйкес, dCas13-B2-ні 2 күн бойы қысқа мерзімді индукциялау NET1 мРНҚ локализациясына айтарлықтай әсер етпеді (5E-сур.), ал конститутивті экспрессия перифериялық NET1 мРНҚ локализациясының айтарлықтай төмендеуіне әкелді (5D және E-сур.).&lt;/p&gt;\n&lt;p&gt;NET11067 gРНҚ экспрессиялайтын және dCas13-B2 тұрақты экспрессиялайтын жасушалардағы NET1 мРНҚ қате локализациялану дәрежесі синтетикалық gРНҚ жеткізілген кезде байқалатын деңгейге ұқсас болды (5E-сур. мен S5A-сур. салыстырыңыз) және бұрын хабарланған ASO арқылы жүзеге асатын әсерлерге сәйкес келді (5F-сур.). Ұзартылған, 7 күндік индукция байқаларлық, бірақ онша күшті емес әсерге әкелді (S6E-G-сур.).&lt;/p&gt;\n&lt;p&gt;NET1 мРНК тасымалдануының алдын алу қатерлі ісік жасушаларының инвазиясын және өкпенің метастатикалық колонизациясын төмендетеді&lt;/p&gt;\n&lt;p&gt;Бұл жүйенің жасушалық стресс жолдарын белсендірмейтініне көз жеткізу үшін біз ата-аналық және dCas13-B2 сызықтарын салыстырдық. Айта κету κεрек, базальды жағдайларда да, натрий арсенитімен өңдеуден кейін де eIF2a фосфорлануымен көрсетілгендей, стресске жауапта байқаларлық айырмашылық анықталды (S7A-сур.). Бұл қорытындыны одан әрі растай отырып, RNA-seq талдауы жасушалық стресспен және цитоуыттылықпен байланысты гендердің экспрессиясы барлық модификацияланған жасуша популяцияларында елеулі түрде өзгермегенін көрсетті (S7B-сур. және S4-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NET1 мРНК локализациясының бұзылуы моноқабаттағы жасушалардың өсуіне әсер етпейді, бірақ 3D-мәдениеттегі сфероидтардың мөлшерін, олардың инвазивтілігін және in vivo өкпенің метастатикалық колонизациясын азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық жүйе компоненттерін генетикалық түрде кодтау мүмкіндігі ұзақ мерзімді фенотиптік талдауларда NET1 мРНК локализациясын өзгертудің салдарын зерттеу мүмкіндігін ашты. Конститутивті түрде экспрессияланатын CMV_dCas13-B2 жасушаларын пайдалана отырып, біз NET1 мРНК локализациясының бұзылуы 2D-мәдениет жағдайында жасушалардың өсу жылдамдығына әсер етпейтінін анықтадық (6A-сур.). Алайда, жеке жасушаларды үш өлшемді матрикске (matrigel) енгізу және олардың ~9 күн ішінде көп жасушалы сфероидтарды түзуіне мүмкіндік беру (6B-сур.) NET11067-gRNA массивін экспрессиялайтын жасушалардың кішірек сфероидтар түзгенін көрсетті (6C-сур.), бұл осы 3D-өсу жағдайында өсу немесе тіршілік қабілетінің төмендегенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Инвазивті әлеуетті бағалау үшін айналадағы матрикске ұжымдық инвазияны туындату үшін сарысуды алып тастау қолданылды (6B-сур.). ASO қолданылған алдыңғы есепке сәйкес, dCas13-gRNA экспрессиясы арқылы NET1 мРНК локализациясын өзгерту сфероидтардың инвазивтілігінің айтарлықтай төмендеуіне әкелді (6D-сур.). Бұл бақылауларды одан әрі кеңейту және ісік метастазындағы NET1 мРНК локализациясының әлеуетті рөлін in vivo бағалау үшін CMV_dCas13-B2-GFP жасушалары иммун тапшылығы бар тышқандардың құйыршық венасына венаішілік енгізілды. Өкпедегі метастатикалық колонизация 5 аптадан кейін GFP иммунофлуоресцентті анықтау арқылы бағаланды (6E-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ASO (антисмыстық олигонуклеотидтер) — бұл мРНК-мен байланысып, оның функцияларын блоктай алатын немесе оның ыдырауын бастайтын қысқа синтетикалық нуклеотидтік тізбектер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ісік аймақтарындағы dCas13-B2-GFP ақуыз деңгейлері ұқсас болып қала бергенімен, NET11067-gRNA массивінің экспрессиясы ісік жүктемесінің айтарлықтай төмендеуіне әкелді (6F, G-сур.). Жалпы алғанда, мұнда сипатталған деректер dCas13 арнайы РНҚ-ақуыз өзара әрекеттесулерін тиімді бұзу және функционалдық үлестерді бағалау үшін қолданылуы мүмкін екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In vivo тәжірибелері иммун тапшылығы бар тышқандарда жүргізілді, бұл нәтижелерді ісіктің микроорртасын ескерместен иммундық жүйесі толық жұмыс істейтін пациенттерге тікелей экстраполяциялауды шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз қосымша бұл CRISPR-dCas13 құралының тұрақты экспрессияланатын, толық генетикалық кодталған түрде тиімді жүзеге асырылуы белгілі бір факторларға байланысты екенін көрсетеміз. Кейбір CRISPR-Cas13 қолданбалары нысаналы мРНК-лармен уақытша байланысу арқылы қол жеткізілуі мүмкін болса да, эндогендік РНҚ-байланыстырушы ақуыздармен (РДБ) тұрақты араласу тұрақты өзара әрекеттесуді талап етеді, ол екі тізбекті РНҚ-байланыстырушы домендермен (dsRBD) біріктіру арқылы күшейтілуі мүмкін [21]. Біз B2 ақуызы dsRBD бұл контекстте максималды әсер беретінін анықтадық.&lt;/p&gt;\n&lt;p&gt;Цитоплазмалық мРНК-ларды нысанаға алу үшін қосымша мәселе gRNA ядродан экспортталуын және цитоплазмада жеткілікті деңгейге дейін жиналуын қамтиды. Уақытша экспрессиядан айырмашылығы, U6 басқаратын gRNA конструкттарының тұрақты геномдық интеграциясы цитоплазмада шектеуші болуы мүмкін gRNA деңгейлеріне әкеледі. Біз олардың деңгейіне dCas13 экспрессиясының конститутивті немесе индуцибельді табиғаты мен ұзақтығы арқылы қосымша әсер етуге болатынын көрсетеміз. U1 кіші ядролық РНҚ промоторынан gRNA экспрессиясын қоса алғандағы қосымша модификациялар нәтижелерді одан әрі жақсарта алады. Біз бұл dCas13 негізіндегі құрал арнайы РНҚ-ақуыз байланысу оқиғаларын кеңінен зерттеу үшін қолданылуы мүмкін және осылайша геномдық ДНҚ-ны өзгертпестен РДБ реттеуші үлестерін анықтау және РНҚ-ақуыз кешенінің ұйымдасуын талдау үшін икемді және қайтымды тәсілді қамтамасыз етеді деп болжаймыз. Дегенмен, зерттеліп жатқан нақты байланысу оқиғасына байланысты арнайы оңтайландырулар мен факторларды ескеру қажет болуы мүмкін.&lt;/p&gt;\n&lt;p&gt;Біз бұл тәсілді GA-ға бай элементтер басқаратын мРНК локализациясын зерттеуге қолдандық. Бұл нысанаға алу механизмі in vitro культураларында немесе in vivo тіндерінде әртүрлі жасуша түрлерінде жұмыс істейді және қатерлі ісік жасушаларының инвазиясынан бастап қан тамырларының өрнектелуіне және эпителий тінінің ұйымдасуына дейінгі әртүрлі процестер үшін маңызды. Мұнда біз бұл нәтижелерді кеңейте отырып, GA қамтитын NET1 мРНК-ның қате орналасуы тышқан модельдерінде өкпенің метастатикалық колонизациясының төмендеуіне әкелетінін көрсетеміз. Арнайы мРНК-лардың таралуын қайта бағдарламалау үшін CRISPR-dCas13 қолданылуы, сондай-ақ мРНК-ларды цитоплазмалық орындарға қате бағдарламалаудың балама әдістері осы кең таралған мРНК локализация жолының ұзақ мерзімді фенотиптік салдарын әрі қарай зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Анықталған РНҚ реттеуші элементтерінің тұрақты бұзылуын қамтамасыз ете отырып, мұнда сипатталған платформа физиологиялық тұрғыдан маңызды және аурумен байланысты контексттерде транскрипциядан кейінгі реттеудің механикалық зерттеулері үшін жолдар ашады.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"zhasushalykh-kultivaciyalau\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#zhasushalykh-kultivaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасушалық культивациялау&lt;/span&gt;&lt;/a&gt;Жасушалық культивациялау&lt;/h4&gt;\n&lt;p&gt;MDA-MB-231 жасушалары (ATCC; HTB-26) ылғалдандырылған инкубаторда 37°C температурада және сыртқы CO2 ортасында 10% фетальды бұзау сарысуы (FBS; Thermo Fisher A31604-02) немесе тетрациклинсіз FBS (Thermo Fisher A47362-01) және 1% пенициллин-стрептомицин (Gibco; 15140122) қосылған Leibovitz’s L-15 ортасында (Gibco; 11415064) өсірілді. HEK293T жасушалары (ATCC; CRL-3216) ылғалдандырылған инкубаторда 37°C температурада және 5% CO2 ортасында 10% FBS және 1% пенициллин-стрептомицин қосылған Дульбекконың модификацияланған Игл ортасында (DMEM; Gibco; 11995-065) өсірілді. Жасушалар 0.05% трипсин көмегімен (Gibco; 25300054) пассаждалды және тұрақты ПТР тестілеуі арқылы микоплазманың жоқтығы расталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;ПТР (полимеразды тізбекті реакция) әдісі бұл жерде жасуша культураларының тазалығы мен микоплазмамен ластанбағанын жылдам әрі сезімтал түрде тексеру үшін сапа бақылауы ретінде қолданылады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тұрақты жасуша линияларын алу үшін қолданылған лентивирусты бөлшектер HEK293T жасушаларында өндірілді. Қысқаша айтқанда, лентивикторлар мен қаптаушы плазмидалар pMD2.VSVG (Addgene плазмидасы № 12259) және psPAX2 (Addgene плазмидасы № 12260) PolyJet ДНҚ трансфекция реагентімен (SignaGen; SL100688) ко-трансфекцияланды. Лентивирусты бөлшектері бар орта 48 сағаттан кейін жиналып, центрифугалау арқылы шоғырландыру алдында 4°C температурада Polyethylene Glycol-мен бір түн бойы инкубацияланды. Шоғырландырылған бөлшектер жасушаларды инфекциялау үшін пайдаланылды, ал тұрақты түрде трансдукцияланған линиялар құрылымға тән антибиотиктермен 10 күндік селекциядан кейін алынды (пуромицин [Gibco; A11138-03], 6 мкг/мл бластицидин [Gibco; A11139-03] немесе 0.35 мг/мл генетицин [Gibco; 10131-035]). dCas13-EGFP немесе Cherry-NLS экспрессиялайтын жасушалар флуоресценция көмегімен сұрыптайтын жасуша сорғышы (FACS) арқылы қосымша іріктелді.&lt;/p&gt;\n&lt;h4 id=\"transfekciya\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#transfekciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трансфекция&lt;/span&gt;&lt;/a&gt;Трансфекция&lt;/h4&gt;\n&lt;p&gt;Транзиентті трансфекция тәжірибелері үшін жасушалар өндірушінің нұсқауларына сәйкес Lipofectamine RNAimax (Invitrogen; 13778150) көмегімен синтетикалық gРНК трансфекциясынан немесе Lipofectamine LTX (Invitrogen; A12621) көмегімен синтетикалық gРНК мен ДНҚ плазмидаларының трансфекциясынан 24 сағат бұрын қайта егілді. Жасушалар трансфекция кезінде ~70-80% конфлюенттікке жетуі үшін егілді және талдаулар трансфекциядан 48-72 сағат өткен соң жүргізілді. Визуализация тәжірибелері үшін жасушалар 12 лункалы планшетте 0.1 нмоль синтетикалық gРНК және/немесе 500 нг плазмидалық ДНҚ-мен трансфекцияланды. РНК иммунопреципитация тәжірибелері үшін трансфекция реакциялары 6 см ыдыстарға арсшталып, бір ыдысқа 0.35 нмоль синтетикалық gРНК пайдаланылды.&lt;/p&gt;\n&lt;p&gt;Синтетикалық gРНК-лар RfxCas13 тікелей қайталануының өңделген формасын (30 н.н.; S1 кестесі; [29]) қамтитындай етіп жобаланды. Спейсер тізбектері нысаналы емес әсерлерді азайту және мРНК мөлшеріне немесе оның трансляциясына әсер етпеу үшін таңдалған нақты нысаналы мРНК аймақтарымен гибридтелуге арналды [12,13]. Спейсер тізбегінің Cas13-пен байланысу үйлесімділігі in silico режимінде «Cas13 design tool» веб-инструменті арқылы тексерілді [30]. Синтетикалық gРНК-лар in vivo жағдайында gРНК тұрақтылығын арттыру үшін 5' және 3' ұштарында фосфоротиоатты 2'-O-метил негіздерін қамтуы үшін IDT компаниясымен синтезделді. Осы зерттеуде қолданылған gРНК тізбектері үшін S1 кестесін қараңыз.&lt;/p&gt;\n&lt;h4 id=\"plazmidalykh-klondau\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#plazmidalykh-klondau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Плазмидалық клондау&lt;/span&gt;&lt;/a&gt;Плазмидалық клондау&lt;/h4&gt;\n&lt;p&gt;dCas13 варианттары доксициклинмен индуцияланатын немесе конститутивті промоторлардың бақылауымен лентивирусты векторларға клондалды. Қысқаша айтқанда, dCas13 фрагменттері бұрын сипатталған құрылымнан ПТР көмегімен амплификацияланды (Addgene плазмидасы № 154938). dCas13 және EGFP-3xFLAG gblock фрагменттері кейіннен BamHI және NotI сайттары бойынша pcDNA3.1 векторына лигирленді. Көрсетілген dsRBD (S2 кестесі) содан кейін EGFP-тің 5' жағына енгізілді. Осы құрылымдардың барлығы pENTR1A негізіне клондалып, Gateway LR Clonase II (Thermofisher; 11791020) көмегімен pInducer 20 лентивикторына (Addgene плазмидасы № 44012) рекомбинацияланды.&lt;/p&gt;\n&lt;p&gt;CMV промоторының басқаруымен dCas13-B2 вариантын клондау үшін dCas1-B2dsRBD-EGFP-FLAG фрагменті рестрикциялық түрде кесіліп, сүтқоректілердің pCDH-CMV-MCS-EF1-Puro лентивирусты векторына (System Biosciences; CD510B-1) BamHI және NotI сайттары арқылы лигирленді. RfxCas13 gРНК-лары бұрын сипатталғандай [29] бірдей спейсерлері бар жалғыз өңделген (30 н.н.) немесе өңделмеген тікелей қайталануларды (36 н.н.) қамтитындай етіп жобаланды. Осы зерттеуде қолданылған gРНК тізбектері үшін S1 кестесін қараңыз. Лентивирусты экспрессиялық кассетаны жасау үшін pLenti-CMV-TetR (Addgene плазмидасы № 17492) ClaI және XbaI сайттарымен өңделді, содан кейін транскрипцияны тоқтату үшін полиуридиндік тракт ретінде транскрипцияланатын тимидиндер тізбегі мен екі BsmBI сайтының жоғарғы жағына адамның U6 (hU6) промотор фрагменті лигирленді.&lt;/p&gt;\n&lt;p&gt;Жеке gРНК-ларға сәйкес келетін ДНҚ фрагменттері BsmBI сайттарына клондалды. gРНК массивтері бірегей қабаттасатын ұштары бар ПТР арқылы жасалған gРНК фрагменттерін пайдалана отырып, NEBridge Golden Gate Assembly kit (NEB; E1602S) жиынтығы арқылы жасалды (S1 кестесі). Рекомбинантты CNBP экспрессиясы мен тазарту үшін E. coli кодондарына оңтайландырылған адамның CNBP тізбегі pET-32a(+) бактериялық экспрессиялық векторына (Novagen; 69015-3) клондалды. Атап айтқанда, темекі эхивирусының (TEV) протеазасының кесілу орнын кодтайтын тізбегі бар gBlock гендік фрагменттері, соңында адамның CNBP кодтайтын тізбегі, сондай-ақ TEV-CNBP тізбегінің екі ұшындағы BamHI және NotI рестрикциялық тізбектері Integrated DNA Technologies компаниясынан алынды. gBlock фрагменті рестрикциялық өңдеу және кейінгі лигирлеу арқылы pET-32a(+) векторына енгізілді. Лентивирусты Cherry-NLS құрылымдары бұрын сипатталғандай [13] жасалды.&lt;/p&gt;\n&lt;h4 id=\"fluorescentti-in-situ-gibridizaciya\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#fluorescentti-in-situ-gibridizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Флуоресцентті in situ гибридизация&lt;/span&gt;&lt;/a&gt;Флуоресцентті in situ гибридизация&lt;/h4&gt;\n&lt;p&gt;Fluorescent in situ hybridization (FISH) бейнелеу үшін MDA-MB-231 жасушалары 0.1% сарысуы бар базалық ортада коллаген IV (10 мкг/мл; Sigma; C5533) жабылған шыныларға егілді. Жасушаларға 2-3 сағат бойы жабысуға мүмкіндік берілді, содан кейін PBS-те жуылып, бөлме температурасында 20 минут бойы PBS-тегі 4% параформальдегидте фиксирленді. мРНК бейнелеу үшін FISH өндіруші хаттамасына сәйкес ViewRNA ISH Cell Assay kit (ThermoFisher; QVC0001) көмегімен орындалды. Келесі зондтар қолданылды: human NET1 (VA6-3169338), human RAB13 (VA6-3168453), GFP (VF1-14510). мРНК таңбаланғаннан кейін жасушалар жасуша және ядро контурларын белгілеу үшін HCS green cell mask (ThermoFisher; H32714) және DAPI көмегімен боялды. Үлгілер бейнелеу алдында бір түнде Prolong Gold antifade (ThermoFisher; P36930) көмегімен бекітілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FISH — арнайы таңбаланған зондтардың көмегімен жасуша ішіндегі нақты ДНҚ немесе РНҚ молекулаларының орналасқан жерін көруге мүмкіндік беретін әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;gRNA бейнелеу үшін RNAscope plus smRNA-RNA HD assay kit қолданылды (Advanced Cell Diagnostics (ACD); 322780) өндірушінің нұсқауларына сәйкес. Қысқаша айтқанда, жасушалар 30 минут бойы фиксирленді, содан кейін PBS-те жуылды. Эндогендік пероксидаза белсенділігі шыныларды сутегі асқын тотығында 10 минут бойы инкубациялау, содан кейін бөлме температурасында 10 минут бойы PBS-те 1:15 қатынасында сұйылтылған протеаза III көмегімен протеазалық ас қорыту арқылы жойылды. Келесі зондтар қолданылды: NET11067 gRNA (ACD; 1258891-S1), GFP mRNA (ACD; 400281-C2). Анықтау үшін Opal 570 (Akoya Biosciences; OP-001003) немесе Opal 690 (OP-001006) бояғыштары қолданылды. Содан кейін үлгілер бейнелеу үшін жоғарыда сипатталғандай өңделді.&lt;/p&gt;\n&lt;h4 id=\"vizualizaciya\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#vizualizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализация&lt;/span&gt;&lt;/a&gt;Визуализация&lt;/h4&gt;\n&lt;p&gt;Фиксирленген үлгілер Nikon Eclipse Ti2-E кері немесе Leica SP8 кері конфокалды микроскопында бейнеленді. Nikon Ti2-E микроскопы Yokogawa CSU-X1 айналмалы дискілі конфокалды сканерлеу блогымен, 40× объективімен (Plan Fluor 40; Майлы; NA=1.30; WD=240 мкм), NIS-Elements бағдарламалық жасақтамасымен (5.21.03, Build 1489) және Hamamatsu ORCA-Fusion BT Gen III артқы жарықтандырылған sCMOS камерасымен жабдықталған. Leica SP8 HC PL APO 63x oil CS2 майлы объективімен жабдықталған. Миграция жылдамдығын бағалау үшін Cherry-NLS экспрессиялайтын жасуша желілері эксперимент ұзақтығы бойы үстел мен объективті 37°C температурада ұстайтын инкубациялық жүйемен (Okolab) жабдықталған Olympus IX81 кері микроскопын қолданып тірі бейнелеу арқылы бақыланды. Жасушалар 10x объективін қолданып бейнелеуден 6 сағат бұрын fluorobrite ортасына (ThermoFisher; A18967-01) егілді. Жасушалар 8 сағат бойы әр 5 минут сайын бейнеленді.&lt;/p&gt;\n&lt;h4 id=\"keskindi-taldau\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#keskindi-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескінді талдау&lt;/span&gt;&lt;/a&gt;Кескінді талдау&lt;/h4&gt;\n&lt;p&gt;FISH кескіндеріндегі мРНК таралуын талдау үшін бұрын жарияланған арнайы Matlab скрипті [31] көмегімен PDI индексі есептелді. Қысқаша айтқанда, PDI индексы максималды қарқындылық прожекциясы кескіндерін қолдана отырып, әр жасуша үшін ядро орталығына қатысты мРНК популяциясының таралуының қарқындылықпен салмақталған өлшемі болып табылады. Сондай-ақ ол 2D жазықтықтағы әр жасушаның өлшемі мен морфологиясы үшін қалыпқа келтірілген, осылайша 1 мәні диффузиялық таралуды көрсетеді, &amp;gt; 1 мәндері перифериялық, ал &amp;lt; 1 мәндері перинуклеарлық болып табылады. gRNA таралуын талдау үшін FISH кескіндерінің сома-қарқындылық прожекциялары FIJI көмегімен ядролық және цитоплазмалық аймақтарға қолмен сегментацияланды. Цитозольдік gRNA және бүкіл жасушалық GFP қарқындылығы (Өңделмеген интеграцияланған тығыздық) әр жасуша үшін өлшенді. Бұл деректер логнормальды таралуға ие болды және статистикалық талдау үшін натурал логарифм арқылы түрлендірілді.&lt;/p&gt;\n&lt;p&gt;Кездейсоқ жасуша миграциясы үшін Cherry-NLS экспрессиялайтын жасуша желілері қолданылды. Сонымен қатар, GFP флуоресценциясы dCas13 экспрессиялайтын жасушаларды анықтау үшін қолданылды. Ядролық Cherry флуоресценция сигналы FIJI плагині TrackMate көмегімен уақыт өте келе жасушаларды бақылау үшін қолданылды. Бөлініп жатқан немесе эксперимент ұзақтығы бойы бақылау мүмкін емес жасушалар соңғы талдаудан шығарылды.&lt;/p&gt;\n&lt;h4 id=\"rnkh-immunoprecipitaciya\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#rnkh-immunoprecipitaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНҚ-иммунопреципитация&lt;/span&gt;&lt;/a&gt;РНҚ-иммунопреципитация&lt;/h4&gt;\n&lt;p&gt;dCas13-пен ко-иммунопреципитацияға ұшырайтын РНҚ-ларды анықтау үшін біз dCas13-dsRBD-EGFP-3xFLAG қосындыларын тұндыру үшін магниттік FLAG моншақтарын (ThermoFisher; A36798) қолдандық. Қысқаша айтқанда, 50 мкл FLAG моншақтары BSA, гликоген, лосось спермасының ДНҚ-сы және E. Coli tRNA көмегімен алдын ала блокталды. Жасушалар PBS-те жуылды, содан кейін 50 мМ Tris (pH 7.4), 150 мМ NaCl, 10 мМ MgCl2, 10% глицерин, 1x HALT протеаза тежегіші (ThermoFisher; 1861281) және RNase тежегіші (Promega; N2618) бар мұздай 1% NP-40 қамтитын буферде лизистенді. Тоталды лизат алдымен 10,000xg жылдамдықта центрифугалау арқылы тазартылды, содан кейін FLAG моншақтарымен 4°C температурада 1 сағат бойы айналдыра отырып инкубацияланды. Моншақтар лизис буферінде 5 рет жуылды, содан кейін ақуыз бөлме температурасында 15 минут бойы шайқау арқылы 50 мкг FLAG пептидімен (ThermoFisher; A36806) элюцияланды. Тоталды және элюцияланған ақуыз бен РНҚ вестерн-блоттинг, ddPCR немесе nanoString nCounter көмегімен қосымша талданды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;РНҚ-иммунопреципитация — белгілі бір ақуызбен байланысқан РНҚ молекулаларын осы ақуызға қарсы антиденелердің көмегімен бөліп алу және зерттеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rnk-boelip-alu-zhaene-taldau\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#rnk-boelip-alu-zhaene-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНК бөліп алу және талдау&lt;/span&gt;&lt;/a&gt;РНК бөліп алу және талдау&lt;/h4&gt;\n&lt;p&gt;gRNA талдауы үшін РНК Trizol LS (Thermo Fisher Scientific; 10296010) көмегімен бөлініп алынды. Сулы фаза өндірушінің нұсқауларына сәйкес бөлініп, баған ішіндегі ДНКазамен өңдеуді қамтитын Zymo total RNA clean and concentrator kit (Zymo research; R1014) жинағына салынды. Тек мРНК бөліп алуды талап ететін тәжірибелер үшін RNeasy Plus Mini Kit (Qiagen; 74134) пайдаланылды. РНК iScript cDNA Synthesis Kit (Bio-Rad; 1768891) көмегімен кері транскрипцияланды және тамшылы сандық полимеразды тізбекті реакция (ddPCR) үшін қолданылды. ПТР реакциялары кДНК, ген-спецификалық праймерлер және ddPCR EvaGreen Supermix (Bio-Rad; 186-4034) қоспасы арқылы дайындалды. Тамшылар осы реакциядан Automated Droplet Generator (Bio-Rad; 186-4101) көмегімен жасалды, содан кейін ПТР C1000 Touch Thermal Cycler (Bio-Rad; 185-1197) құрылғысында орындалды, ал тамшыларды оқу QX-200 Droplet Reader (Bio-Rad; 186-4003) көмегімен жүзеге асырылды. Нәтижелер QuantaSoft бағдарламалық жасақтамасы (Bio-Rad) арқылы сандық тұрғыдан бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тамшылы сандық ПТР (ddPCR) реакция қоспасын мыңдаған микротамшыларға бөлу арқылы калибрлеу қисықтарынсыз үлгідегі ДНК немесе РНК молекулаларының нақты абсолютті санын анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;NanoString талдауы үшін иммунопреципитацияланған РНК өндірушінің нұсқауларына сәйкес пайдаланушы кодтар жиынтығы (S3 кестесі) мен nCounter талдау жүйесі көмегімен талданды. RNA-seq талдауы үшін жалпы РНК үлгілері РНК секвенирлеуі үшін Plasmidsaurus, Inc. компаниясына тапсырылды. Әрбір үлгі үшін үш биологиялық қайталау талданды. Кітапханалар 3'-ұшын санау тәсілін қолдана отырып, поли(A) таңдауынан кейін дайындалды және ұзындығы шамамен ~90 п.н. болатын бір ұшты оқылымдарды (reads) жасау үшін Illumina құрылғысында секвенирленді. Секвенирлеу деректері Plasmidsaurus тарапынан оқылым сапасын сүзуді, референс геномға туралауды, UMI негізіндегі дубликаттарды жоюды және ген деңгейіндегі сандық бағалауды қамтитын стандартты конвейер арқылы өңделді.&lt;/p&gt;\n&lt;h4 id=\"soltuestik-blottau-northern-blot\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#soltuestik-blottau-northern-blot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Солтүстік блоттау (Northern blot)&lt;/span&gt;&lt;/a&gt;Солтүстік блоттау (Northern blot)&lt;/h4&gt;\n&lt;p&gt;Жылумен денатурацияланған жалпы жасушалық РНК 10% нәжіс-полиакриламидті гельде электрофорезден өткізіліп, соңынан 400 мА токта 45 мин ішінде оң зарядталған нейлон мембранасына (Cytiva; RPN119B) жартылай құрғақ әдіспен тасымалданды. Содан кейін мембрана кептіріліп, УФ-сәулемен айқас байланыстырылды және 30^°C температурада 60 мин бойы Oligo Hybridization Buffer (ThermoFisher; AM8663) буферімен прегибридизацияланды. U6 snRNA пен NET1 gRNA-ға қарсы 5’ IRDye белгіленген зондтары (IDT) 30^°C температурада бір түн бойы гибридизацияланды. Спейсер аймағына немесе тікелей қайталану аймағына қарсы жасақталған NET1 gRNA екі түрлі зондының жиынтығы пайдаланылды. 2xSSC/0.1% SDS буферінде және 1xSSC/0.1% SDS буферінде кезекті жуулардан кейін блоттар Odyssey флуоресцентті сканері (Li-Cor) көмегімен дамытылды.&lt;/p&gt;\n&lt;h4 id=\"akhuyzdy-oendiru-zhaene-tazartu\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#akhuyzdy-oendiru-zhaene-tazartu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ақуызды өндіру және тазарту&lt;/span&gt;&lt;/a&gt;Ақуызды өндіру және тазарту&lt;/h4&gt;\n&lt;p&gt;Escherichia coli BL-21 (DE3) жасушалары pET-32-TEV-HsCNBP плазмидасымен трансформацияланды және жеке колониялар 100 мкг/мл ампициллин мен 0.3 мМ мырыш хлориді қосылған Луриа-Бертани (LB) ортасында 37^°C температурада өсірілді. OD600 нм ~ 0.5 кезіндегі культуралар 18^°C температурада бір түн бойы 0.5 мМ ИПТГ (IPTG) көмегімен индукцияланды. Жасушалар центрифугалау арқылы жиналып, тұнба лизистік буферде (50 мМ Трис-HCl pH 7.5; 300 мМ NaCl; 10 мМ имидазол; 10 мМ β-меркаптоэтанол; 10% глицерин және 1% протеаз тежегіштерінің коктейлі) қайта суспензияланды. Жасушалар микрофлюидизатор көмегімен лизиске ұшырады және лизат 4^°C температурада 30 мин бойы 19 000 айн/мин жылдамдықта центрифугалау арқылы тазартылып, супернатантта еритін ақуыздар алынды.&lt;/p&gt;\n&lt;p&gt;Рекомбинантты адам CNBP ақуызы [32] еңбегінде сипатталғандай, кішігірім өзгерістермен тазартылды. Қысқаша айтқанда, Trx-His6-TEV-CNBP экспрессиялайтын супернатант алдымен 0.5 мкм сүзгі арқылы өткізіліп, рекомбинантты ақуызы бар сүзгі А буферімен (50 мМ Трис-HCl pH 7.5; 300 мМ NaCl; 30 мМ имидазол; 10% глицерин және 10 мМ β-меркаптоэтанол) алдын ала теңгерілген Ni-NTA хроматографиялық бағанына баяу байлануға мүмкіндік берілді. Баған А буферіндегі 6% Б буферінің (50 мМ Трис-HCl pH 7.5; 300 мМ NaCl; 500 мМ имидазол; 10% глицерин және 10 мМ β-меркаптоэтанол) 5 баған көлемімен, содан кейін А буферіндегі 8% Б буферімен шайылды. Ақырында ақуыз 100% Б буферімен элюцияланды. Ақуызға бай фракциялар хроматограмма шыңынан анықталды және SDS-PAGE гельдерін Кумассимен бояу арқылы расталды. Бұл фракциялар біріктіріліп, TEV протеазасымен кесілді және А диализ буферінде (50 мМ Трис-HCl pH 7.5; 300 мМ NaCl; 1 мМ ДТТ және 0.1 мМ ZnCl₂) бір түн бойы диализденді.&lt;/p&gt;\n&lt;p&gt;Кесілген, диализденген өнім айналу арқылы 4^°C температурада 3 сағ бойы Ni-NTA агароза шайырымен топтамалық түрде байланысуға рұқсат етілді. Кесілген, белгісіз CNBP бар ағын жиналды. Нуклеин қышқылынан таза CNBP алу үшін жоғарыда жиналған CNBP II диализ буферінде (50 мМ Трис-HCl pH 6.5; 10% глицерин және 5 мкМ ZnCl₂) қосымша диализденді, 0.5 мкм мембрана арқылы сүзіліп, С буферімен (50 мМ Трис-HCl pH 6.5; 10% глицерин және 5 мкМ ZnCl₂) теңгерілген Q-Sepharose хроматографиялық бағанына баяу байлануға рұқсат етілді. Ақуызды сатылы элюциялау С буферіндегі 100 мМ, 200 мМ және 500 мМ NaCl көмегімен жүзеге асырылды. Тазартудың барлық кезеңдері 4^°C температурада атқарылды.&lt;/p&gt;\n&lt;h4 id=\"in-vitro-transkripciya-zhaene-rnk-boelip-alu\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#in-vitro-transkripciya-zhaene-rnk-boelip-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In vitro транскрипция және РНК бөліп алу&lt;/span&gt;&lt;/a&gt;In vitro транскрипция және РНК бөліп алу&lt;/h4&gt;\n&lt;p&gt;In vitro транскрипция [26] еңбегінде сипатталғандай орындалды. Қысқаша айтқанда, RAB13-3’UTR-BoxB тізбегі бар линеарланған плазмидалық матрицалар 20 мМ ДТТ, 10 мМ MgCl₂, 4 мМ NTP, 40 Ед/мкл RNasin Plus (Promega; N2615) және 1% Triton X-100 қосылған транскрипция үшін оңтайландырылған буфердегі (Promega) T7 Polymerase HC (Promega; P2075) көмегімен in vitro транскрипцияланды (әрбір 50 мкл реакция қоспасына 4 мкг). Реакция 37^°C температурада 3.5 сағ бойы инкубацияланды. Реакциядан кейін in vitro транскрипцияланған РНК Zymo total RNA clean and concentrator kit (R1014) жинағы арқылы бөлініп алынды. In vitro транскрипцияланған РНК-дан плазмидалық матрицаны жою үшін баған ішіндегі ДНКазамен өңдеу жүзеге асырылды.&lt;/p&gt;\n&lt;h4 id=\"in-vitro-rnk-men-rbp-bajlanysuy\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#in-vitro-rnk-men-rbp-bajlanysuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In vitro РНК мен РБП байланысуы&lt;/span&gt;&lt;/a&gt;In vitro РНК мен РБП байланысуы&lt;/h4&gt;\n&lt;p&gt;dCas13-B2-EGFP-3xFLAG/sgRNA кешенін тазарту үшін бастапқыда dCas13-B2-EGFP-3xFLAG ақуызды уақытша экспрессиялайтын HEK 293LT жасушаларының лизаттарынан бұрын сипатталғандай anti-FLAG магнитті агарозды моншақтарының (ThermoFisher; A36798) көмегімен иммунопреципитацияланды. Содан кейін байланысқан ақуыз нысана емес бақылау (NTC2) немесе RAB13191/230 синтетикалық gRNA молярлық артық мөлшерімен бөлме температурасында 15 минут бойы шайқау арқылы инкубцияланды. Кейіннен байланыспаған gRNA-ны кетіру үшін моншақтар лизистік буфермен 5 рет жуылды, ал elutsiya dCas13-B2-EGFP-3xFLAG/sgRNA кешенін алу үшін бөлме температурасында 15 минут бойы шайқау арқылы 50 мкг FLAG пептидімен (ThermoFisher; A36806) жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Бұл әдіс in vitro жағдайында РНК мен ақуыздар арасындағы нақты байланыстарды зерттеу мақсатында арнайы кешендерді бөліп алуға және тазартуға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;РНК мен РБП байланысуы үшін in vitro транскрипцияланған РНК-ның 850 нг тазартылган λN-GST ақуызының 10 мкг мөлшерімен бөлме температурасында 15 минут бойы инкубцияланды. Кешен содан кейін 15 мкл глутатион магнитті моншақтарымен (Invitrogen; 78602) бөлме температурасында 20 минут бойы шайқау арқылы инкубцияланды. Байланысқан РНК — λN-GST ақуыз кешені лизистік буфермен (50 mM Tris-Cl pH 7.5, 0.5% Triton X-100, 100 mM NaCl, 2.5 mM MgCl₂) жуылды және E. coli tРНК, BSA (Sigma; 10711454001), лосось ұрығының ДНҚ-сы (Invitrogen; 15632011) және гликоген (Invitrogen; AM9510) бар лизистік буфермен 4 °C-та 30–60 минут бойы блокталды. Содан кейін кешен рекомбинантты CNBP және dCas13-B2-EGFP-3xFLAG/sgRNA кешенімен 4 °C-та 1 сағат бойы шайқау арқылы инкубцияланды. Моншақтар лизистік буфермен, содан кейін PBS (pH 8.0) буферімен жуылды және PBS (pH 8.0) ішіндегі 40 mM қалпына келтірілген L-Glutathione-ның 50 мкл көлемімен элюцияланды. Элюат RAB13-3'UTR-BoxB РНК-мен байланысқан CNBP және dCas13-B2-EGFP-3xFLAG мөлшерін бағалау үшін вестерн-блоттинг арқылы талданды.&lt;/p&gt;\n&lt;h4 id=\"vestern-blotting\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#vestern-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вестерн-блоттинг&lt;/span&gt;&lt;/a&gt;Вестерн-блоттинг&lt;/h4&gt;\n&lt;p&gt;Вестерн-блоттинг үшін келесі бастапқы антителалар қолданылды: қоян анти-FLAG (1:2000; Cell Signaling Technology; A303-138A), қоян анти-GFP (1:3000; Abcam; ab11122), тышқан анти-α-тубулин (1:3000; Sigma; T6199), тышқан анти-CNBP (1:3000; Proteintech; 67109), Фосфо-eIF2α (1:1000; Cell Signaling Technology; #9721S), eIF2α (1:1000; Cell Signaling Technology; #9722S). Li-Cor компаниясының есек анти-қоян (800CW; 926-32213) және есек анти-тышқан (680RD; 926-68072) екінші реттік антителалары 1:10 000 қатынасында пайдаланылды. Мембраналар Odyssey флуоресцентті сканерінің (Li-Cor) көмегімен сканерленді, ал жолақтар ImageStudioLite (Li-Cor) көмегімен сандық түрде бағаланды.&lt;/p&gt;\n&lt;h4 id=\"zhasusha-oesuin-taldau\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#zhasusha-oesuin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасуша өсуін талдау&lt;/span&gt;&lt;/a&gt;Жасуша өсуін талдау&lt;/h4&gt;\n&lt;p&gt;Жасушалардың пролиферациясы Incucyte тірі жасушаларды талдау жүйесі (Sartorius) арқылы бақыланды. Жасушалар бірдей тығыздықта егілді және стандартты жасуша культурасы жағдайында тұрақты аралықтармен суретке түсірілді. Жасуша өсуі Incucyte талдау бағдарламалық құралын пайдалана отырып, уақыт өте келе жасуша қосылуын өлшеу арқылы фазалық-контрастты суреттерден сандық түрде анықталды.&lt;/p&gt;\n&lt;h4 id=\"sferoidtardyng-tuezilui-zhaene-oesip-shyghuy-taldauy\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#sferoidtardyng-tuezilui-zhaene-oesip-shyghuy-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сфероидтардың түзілуі және өсіп шығуы талдауы&lt;/span&gt;&lt;/a&gt;Сфероидтардың түзілуі және өсіп шығуы талдауы&lt;/h4&gt;\n&lt;p&gt;Сфероидтардың түзілуі үшін 0.2 × 10⁴ бірыңғай жасуша суспензиясы Matrigel-мен (Corning, cat# 354234) араластырылып, алдын ала Matrigel-мен қапталған камералық жабын шынысына 30 мкл тамшы түрінде орналастырылды. 37 °C-та 30 минуттық инкубациядан кейін 10% FBS және 1% пенициллин-стрептомицин қосылған L15 ортасы қосылды. Жеке ендірілген жасушаларға сфероидтарды қалыптастыру үшін 8–9 күн бойы өсуге мүмкіндік берілді. Инвазияны тудыру үшін Matrigel-ге ендірілген сфероидылар PBS-пен абайлап жуылды, содан кейін төмен сарысулы орта (0.1% FBS) қосылып, бір түнге инкубцияланды. Визуализация үшін сфероидтар 37 °C-та 20 минут бойы PBS ішінде 5 мкМ кальцеин бояуымен (Thermo Fischer Scientific, cat# C3100MP) және 5 мкМ DRAQ5-пен (Novus Biologicals, cat# NBP2-81125) боялды. Сфероидтар кейіннен PBS-тегі 4% PFA-мен 15 минут бойы фиксирленді және 10x құрғақ объективті қолдана отырып, Leica SP8 инвертирленген конфокалды микроскопында суретке түсірілді. Z-стек суреттері сфероид көлемі арқылы алынды. DRAQ5 бояуына негізделген әрбір сфероид үшін жалпы ядро көлемі Imaris (Oxford Instruments) көмегімен өлшенді. Сфероидтардың инвазиялық қабілетін бағалау үшін Z-стектердің максималды қарқындылық проекциялары пайдаланылды және Күрделілік = Периметр² / (4π × Ауданы) ретінде анықталған күрделілік мәні есептелді.&lt;/p&gt;\n&lt;h4 id=\"oekpening-kolonizaciya-modeli\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#oekpening-kolonizaciya-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өкпенің колонизация моделі&lt;/span&gt;&lt;/a&gt;Өкпенің колонизация моделі&lt;/h4&gt;\n&lt;p&gt;Тышқандардағы зерттеулер Ұлттық рак институтының NIH жануарларды күту және пайдалану жөніндегі интрамуралдық комитетінің бекітілген хаттамаларына сәйкес орындалды. NOD scid gamma тышқандары Jackson Laboratory (Штамм №:005557) дүкенінен сатып алынды. Пайдаланылған MDA-MB-231 сүт безі қатерлі ісігі жасушаларының жынысына сәйкес келу үшін тек ұрғашы тышқандар қолданылды. 12.7 апталық тышқандардың құйыршық венасына әрбір тышқанға 100 мкл PBS ішіндегі 5 × 10⁵ жасуша болатын тиісті жасушалық желі венаішілік түрде егілді. Инъекциядан кейін 5 апта өткен соң өкпелер алынды, перфузия жасалды және Z-Fix-пен фиксирленді. Гистологиялық талдау үшін тіндер парафинге құйылды, содан кейін иммунофлуоресценция немесе H&amp;amp;E арқылы бояу үшін кесілді (3 мкм). Қысқаша айтқанда, парафинді кесінділер 60 °C-та 30 минут бойы қыздырылды, содан кейін SafeClear II (Fisher Scientific) және этанолды қолдана отырып депарафинизацияланды. Қайта гидратталған кесінділер RNAscope Target Retrieval буфері (ACD; 322001) көмегімен 60 °C-та бір түн бойы антигендерді қалпына келтіру үшін пайдаланылды. PBST-те 3 рет 2 минуттан жуылғаннан кейін кесінділер PBS ішіндегі 3% BSA-да сұйылтылған қоян анти-GFP (1:400; Invitrogen; A-11122) көмегімен 4 °C-та бір түн бойы инкубцияланды. PBST-те 3 рет 2 минуттан жуылғаннан кейін үлгілер есек анти-қоян Alexa fluor (1:500; Invitrogen; A-31573), Бидай ұрығы агглютинині Alexa fluor 488 (Invitrogen; W11261; 10 мкг/мл) және DAPI-мен бөлме температурасында 2 сағат бойы инкубцияланды. Үлгілер жуылғаннан кейін визуализация алдында Prolong gold-қа орнатылды. GFP-оң аймақтардың ісік тініне сәйкестігі көршілес кесінділердің H&amp;amp;E бояуымен расталды.&lt;/p&gt;\n&lt;p&gt;Гистологиялық кесінділер NanoZoomer Digital Slide Scanner (Hamamatsu) немесе Axioscan.Z1 (Carl Zeiss) сандық слайд сканері көмегімен суретке түсірілді. Көршілес кесінділер Plan-Apochromat 20x (NA = 0.8; Carl Zeiss) объективін қолдана отырып толығымен сканерленді және HALO (Indica Labs) сандық патология платформасына импортталды. MiniNet классификаторы бірнеше слайдтардағы GFP+ ошақтарын қалыпты тіндерден ажырату үшін қолмен белгіленген аймақтарда оқытылды. Ісік жүктемесі әрбір жануар үшін GFP+ аймағының қалыпты тін аумағына қатынасы ретінде есептелді. Кесінді жасау немесе бояу кезіндегі ауытқушылықтарды өтеу үшін ісік жүктемесі мен GFP қарқындылығы әр жануар үшін көршілес тіндік кесінділер арасында орташаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MiniNet классификаторы — бұл флуоресцентті белгісі бойынша ісік ошақтарын автоматты түрде іздеуге және сегменттеуге арналған конволюциялық нейрондық желіге негізделген компьютерлік көру алгоритмі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"statistika-zhaene-khajtalanatyndykh\"&gt;&lt;a href=\"2026-09-24/reprogramming-mrna-localization-by-targeted-rna-protein-inte.html#statistika-zhaene-khajtalanatyndykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистика және қайталанатындық&lt;/span&gt;&lt;/a&gt;Статистика және қайталанатындық&lt;/h4&gt;\n&lt;p&gt;Деректер орташа мәннің стандартты қатесі (± SEM) түрінде көрсетілген. 4E және 5B суреттерде натурал логарифмделген деректер көрсетілген. Статистикалық салыстырулар үшін қалыпты бөлінген гомоскедастикалық деректер жиынтығындағы айтарлықтай айырмашылықтарды бағалау үшін параметрлік тесттер қолданылды. Егер осы болжамдардың кез келгені орындалмаса, оның орнына деректердің бөлінісіне сәйкес келетін параметикалық емес тесттер орындалды. Әрбір эксперимент үшін арнайы статистикалық тесттер сурет астындағы жазуларда сипатталған және p-мәндері Prism бағдарламалық пакетінің көмегімен есептелген (GraphPad; 10.6.1 нұсқасы).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"202
