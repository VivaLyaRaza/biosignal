        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"105\" cy=\"63\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"495\" cy=\"292\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · GENETICS   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Әйел ағзасы миды аутизмнен&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай қорғайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f1.jpg\" alt=\"1-сурет./ Аутизм гендерінің сарқылуы кең таралған транскриптомдық конвергенцияны көрсетеді. a, Экспериментальды дизайн с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет./ Аутизм гендерінің сарқылуы кең таралған транскриптомдық конвергенцияны көрсетеді. a, Экспериментальды дизайн схемасы. iPSC: индуцияланған плюрипотентті діңгекті жасушалар. b, Осыған ұқсас нәтижелері бар үш тәуелсіз талдауды көрсететін iPSC-тен алынган жүйке жасушаларының предшественниктері (NPC) культураларының иммуноцитохимиясы. c, Мақсатты геннің өзін қоспағанда, әрбір нокдаун (KD) шартының дифференциалды экспрессияланған гендерінің (DEG) ішінде SFARI гендерінің немесе тек ақыл-ой кемістігі (ID-only) гендерінің байытылуын көрсететін бағанды диаграмма. Бағандар бір жақты Фишердің дәл тесті бойынша ықтималдықтар қатынасын (OR) көрсетеді; қателік сызықтары OR үшін 95% сенім интервалының төменгі шекарасын көрсетеді (бір жақты тест үшін жоғарғы шекара анықталмаған). p-мәндері бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуін қолдана отырып түзетілді. d, Әртүрлі KD шарттары арасында ортақ жоғары сенімді SFARI DEG бейнелейтін циррос диаграммасы (сондай-ақ Кеңейтілген деректердің 3a-суретін қараңыз). e, Кем дегенде 10 KD шартында DEG болып табылатын жоғары сенімді SFARI гендерінің салыстырмалы экспрессиясын көрсететін жылу картасы (сондай-ақ Кеңейтілген деректердің 3b-c суреттерін қараңыз). Статистикалық тұрғыдан маңызды DEG'лар бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі бар DESeq2 (Вальд тесті) көмегімен анықталды және жұлдызшамен (&lt;/em&gt;) белгіленді. 1-суреттегі үздік аутизм қаупі бар гендер қою қаріппен жазылған. f, Уақыт өте келе CytoTrack бояуының салыстырмалы қарқындылығы (-log2). Уақыт бойынша тұрақты статистикалық маңызды әсерлерді көрсеткен тек KD шарттары көрсетілген. График орташа мән +/- орташаның стандартты қателігін (SEM) көрсетеді. Статистикалық маңыздылық Даннеттің көптік салыстыру тесті бар стандартты екі жақты ANOVA көмегімен анықталды. Әрбір уақыт нүктесі үшін әр шарт бойынша кемінде үш биологиялық тәуелсіз үлгі талданды. Толық статистикалық нәтижелер үшін 10-қосымша кестені қараңыз.*&lt;/p&gt;\n&lt;p&gt;Аутизм спектрінің бұзылуы ұлдарда қыздарга қарағанда үш-төрт есе жиі кездеседі, бірақ бұл жағдайдың гендік себептері толық түсініксіз еді. Жаңа жұмыс авторлары жыныстық хромосомалар мен арнайы ақуыздар генетикалық ақауларды өтей алатынын көрсетті. Бұл зерттеу әйелдердің қорғаныш әсерінің табиғатын молекулалық деңгейде түсіндіреді. Нәтижелер нейродаму процестерін жаңа қырынан тануға жол ашады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;18 аутизм генін тежеу жасушаларда ортақ ақау туындатады.&lt;/li&gt;\n&lt;li&gt;ZFX факторы әйелдерде екі X хромосомадан да белсенді бөлінеді.&lt;/li&gt;\n&lt;li&gt;ZFX ақуызының жоғары деңгейі миды гендік мутациялардан қорғайды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Аутизм жүздеген гендердің мутациясымен байланысты, алайда ДНҚ-ның әр түрлі учаскелерінің зақымдануы неліктен ұқсас белгілерге әкелетіні жұмбақ болып келді. Осыны анықтау үшін зерттеушілер адамның жүйке арғы тектік жасушаларында аутизмге қатысты 18 негізгі геннің белсенділігін төмендетті. Кез келген осындай генді ажырату басқа аутизм гендерінің жұмысының жаппай төмендеуіне әкелетіні анықталды. Бұл әртүрлі бастапқы бұзылулардың бірыңғай реттеуші желіде ортақ істен шығуға әкелетінін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Гендік желілерді талдау X хромосомасында орналасқан және әйелдерде екі хромосомада да белсенді ZFX транскрипция факторын көрсетті. Әйелдер бұл фактордың екі еселік мөлшерін алатындықтан, ол зақымдалған гендердің жұмысын тиімдірек қолдайды. Авторлар әйел миындағы ZFX ақуызының жоғары деңгейі генетикалық мутацияларды буферлеуде маңызды рөл атқаратынын болжайды. Бұл қыздарда аутизмнің көрінуі үшін ұлдарға қарағанда көбірек генетикалық қатер жиналуы керектігін түсіндіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу адам жасушаларының культурасында in vitro жүргізілгендіктен, тірі организмдерде тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Аутизм спектрінің бұзылуы (АСБ) жоғары дәрежеде тұқым қуалайды және жүздеген гендердің мутациялары АСБ-ның жеке сирек себептері ретінде анықталған. Бұл функционалды түрлі гендердің бұзылуы АСБ-ның негізгі белгілеріне қалай әкелетінін түсіну күрделі міндет болып қала береді. Сонымен қатар, АСБ ер адамдарда әйелдерге қарағанда үш-төрт есе жиі кездеседі, ал аутизмі бар қыздар ұлдармен салыстырғанда АСБ-ның аутосомды қауіп аллельдерін көбірек тасымалдайды, бірақ бұл «әйелдерді қорғайтын әсердің» (female protective effect, FPE) биологиялық негізі белгісіз. Бұл зерттеуде біз адамның нейрондық ізашар жасушаларындағы 18 АСБ генінің жеке бұзылулары ген экспрессиясына ортақ әсерлерге, соның ішінде басқа АСБ гендерінің кең көлемде төмендеуіне (downregulation) әкелетінін көрсетеміз. Гендік реттеуші желінің (GRN) de novo реконструкциясы орталық транскрипция реттеушілерін, соның ішінде көрнекті АСБ гені CHD8, сондай-ақ бұл транскрипциялық конвергенцияға түрткі болатын REST сияқты жаңа кандидаттарды анықтауға мүмкіндік берді. Сонымен қатар, әйелдерде белсенді де, инактивті де X-хромосомалардан экспрессияланатын X-байланысқан транскрипция факторы ZFX көптеген АСБ гендерінің негізгі активаторы ретінде пайда болды: біз әйелдер миында байқалатын жоғары ZFX экспрессия деңгейі әртүрлі АСБ гендеріндегі зақымдаушы мутацияларды буферлей алады деп болжаймыз, бұл FPE-ге ықпал етеді. Біріктіріп қарағанда, бұл нәтижелер негізгі GRN-дердің жеке АСБ гендері бұзылған кезде қалай кең және ұқсас түрде дисрегуляцияға ұшырайтынын ашады және АСБ-дағы әйелдерді қорғайтын әсер туралы молекулалық түсінік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нейрондық жасушаларда 18 АСБ генінің бұзылуы ортақ транскрипциялық жауапқа әкеледі, ал екі X-хромосомадан экспрессияланатын ZFX факторы негізгі қорғаныш активаторы ретінде әрекет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Көлемді генетикалық зерттеулер жүздеген гендерді аутизм спектрінің бұзылуымен (АСБ) байланыстырды, олардың көбі бір аллель функциясының жоғалуына әкелетін сирек мутациялар арқылы анықталған. Бұл ген дозасының АСБ-да маңызды рөл атқаратынын көрсетеді, сондықтан АСБ гендерінің тиісті экспрессия деңгейлерінің қалай сақталатынын анықтау өте маңызды. Гендік реттеуші желілерді (GRN) сипаттау осы АСБ гендерінің дұрыс транскрипциялық дозасын қамтамасыз ететін механизмдер туралы маңызды мәліметтер бере алады. Сонымен қатар, АСБ таралуында ер адамдардың үлесі айтарлықтай жоғары, және кейбір АСБ гендері X-хромосомада анықталғанымен, тек X-байланысқан мутациялардың өзі бұл жыныстық теңгерімсіздікті толық түсіндіре алмайды. Бұдан басқа, ер адамдармен салыстырғанда әйелдерге АСБ көрінуі үшін көбірек аутосомды генетикалық қауіп қажет екендігі дәйекті түрде көрсетілді, бірақ бұл әйелдерді қорғайтын әсердің (FPE) генетикалық механизмдері белгісіз. Мұнда GRN реконструкциясы CHD8 пен REST қоса алғанда, АСБ гендері экспрессиясының негізгі қозғаушы күштерін анықтайды. Бұл талдаулар сонымен қатар әйелдерде белсенді және инертті X-хромосомадан экспрессияланатын, әйелдер жынысына қарай ауытқуы бар ZFX транскрипция факторын АСБ гендерінің негізгі реттеушісі ретінде ашады, бұл FPE-ге ықпал ете алатын тікелей транскрипциялық механизмді болжайды. Бұл зерттеу әртүрлі гендердегі нұсқалардың ақырында АСБ-ға әкелетін конвергентті молекулалық әсерлерді қалай тудыратынын анықтау үшін маңызды негіз береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гендік реттеуші желі (GRN) — бұл жасушада гендердің қосылуы мен өшуін басқаратын ДНҚ, РНҚ және ақуыздар арасындағы өзара әрекеттесудің күрделі жүйесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"asd-genderining-sarkhyluy-keng-taralghan-transkriptomdykh-konvergenciyany-koersetedi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#asd-genderining-sarkhyluy-keng-taralghan-transkriptomdykh-konvergenciyany-koersetedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ASD гендерінің сарқылуы кең таралған транскриптомдық конвергенцияны көрсетеді&lt;/span&gt;&lt;/a&gt;ASD гендерінің сарқылуы кең таралған транскриптомдық конвергенцияны көрсетеді&lt;/h4&gt;\n&lt;p&gt;Аутизм спектрінің бұзылулары (АСБ) гендерін функционалдық зерттеу адамның нейрондық предшественник клеткаларында (NPC) төменгі мишеньдерге күшті қабаттасатын әсерлерін анықтады. Нокдаун (KD) зерттеулері Simons Foundation Autism Research Initiative (SFARI) Gene деректер базасынан 18 генді және бұрын АСБ-мен байланыстырылған екі ұзын кодталмайтын РНҚ-ны (lncRNA) (NR2F1-AS1 және SOX2-OT) қоса алғанда, 20 АСБ гені үшін жүргізілді. Салауатты ер адамның (XY) индукцияланған плюрипотентті дің жасушалары (iPSC) сызығынан алынған NPC культураларында нысанасыз бақылауларға (NTC) қатысты әрбір мақсатты геннің жеке нокдаунын индукциялау үшін РНҚ-ны ыдырататын CRISPR ферменті CasRx және әрбір нысанаға үш гидті РНҚ (gRNA) жиынтығы (S1-кесте) пайдаланылды (1a-b-сурет және S1-сурет). KD-дан кейін 24 сағат өткен соң жүргізілген РНҚ секвенирлеу (RNA-seq) талдауы барлық дерлік әсерлер айтарлықтай дифференциалды экспрессияланатын гендердің (DEG; түзетілген p &amp;lt; 0,05) едәуір санына әкелгенін көрсетті, әрбір әсер үшін медиана 920 DEG құрады (25-перцентиль: 644, 75-перцентиль: 1485) (S2-сурет және S2-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;20 АСБ генінің нейрондық предшественниктердегі нокдауны экспрессияның ауқымды өзгерістерін тудырды (ген үшін медиана 920 DEG).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы DEG-терді кейінгі талдау үшін жеткілікті статистикалық қуатты қамтамасыз ету үшін біз 20-дан 18 әсерге (18/20, 90%) назар аудардық, олар 20-дан астам DEG-тің пайда болуына әкелді, ал ARHGAP5 және ARID2 нокдаун үлгілерін кейінгі талдаудан шығардық. Қалған әсерлер әрқайсысы кем дегенде 287 DEG пайда болуына әкелді, бұл бұл үлгілерді сенімді түрде сипаттауға мүмкіндік берді. Транскриптомдық масштабтағы талдаулар АСБ гендерінің KD басқа АСБ гендерінің таңқаларлық ауқымды бұзылуын тудыратынын көрс жинады. DEG жиынтықтарының көпшілігі SFARI гендер базасындағы белгілі АСБ гендерінің айтарлықтай байытылуын көрсетті (15/18, 83.3%) (1c-сурет және S3-кесте). Керісінше, зияткерлік кемтарлықпен (ID), бірақ АСБ-мен байланысты емес гендер үшін айтарлықтай байытылу байқалмады (тек ID гендері) (1c-сурет және S3-кесте) (Әдістер), олардың NPC-тегі салыстырмалы экспрессиясына қарамастан (тек ID гендері: 1062/1242, 85.5% экспрессияланған; SFARI гендері: 797/1230, 64.8% экспрессияланған). Бұл АСБ гендерінің бұзылуы нейрорефлекторлық гендерге қарағанда, әсіресе басқа АСБ гендеріне әсер ететінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун (KD) — бұл генамин функцияларын бағалау үшін РНҚ-интерференция немесе CRISPR жүйелері арқылы нақты ген экспрессиясын төмендету әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Атап айтқанда, біз түрлі әсерлер арасындағы транскриптомдық конвергенцияның таңқаларлық заңдылығын байқадық, мұны біз бірдей DEG-тердің статистикалық маңызды қабаттасуы ретінде анықтаймыз (S3-сурет). Бұл әсіресе жоғары сенімді SFARI (HC-SFARI) гендері үшін, яғни АСБ-мен байланысты ең жоғары дәлелдемелік санаттағы SFARI гендері үшін айқын болды (1d-сурет). Сонымен қатар, HC-SFARI гендері белгілі бір KD үлгісінде маңызды DEG болмаса да, әр түрлі әсерлердің нәтижесінде үйлесімді бағытта ауысуға бейім болды (S3c-сурет). Бұған көптеген (11/18, 61.1%) KD арқылы айтарлықтай төмендетілген маңызды АСБ қауіп гені CHD8 кірді. Айта кету керек, барлығы 27 HC-SFARI гені кем дегенде 10 KD-да DEG болды (27/183, 14.8%, p = 4.1e-9) және олардың барлығы дәйекті түрде төмендетілді (1e-сурет), бұл АСБ-ның ең күшті қауіп гендерінің көпшілігінің конвергентті дисрегуляциясын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл зерттеу in vitro жағдайында өсірілген адам жасушаларында орындалды, сондықтан себеп-салдарлық байланыстарды растау үшін тірі организм модельдері қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CasRx-тің жоғары деңгейлері KD мишенінің экспрессия деңгейіне сәйкес келетін көлемдегі арнайы емес РНҚ деградациясын тудыратыны хабарланды, ал төменгі CasRx деңгейлері бұл мәселені болдырмайды. Біздің NPC транскриптомдық зерттеулерімізде CasRx тек бір қауіпсіз локустан (AAVS1) экспрессияланды, бұл оның экспрессиясын шектеді. Сондай-ақ біз арнайы емес РНҚ деградациясы біздің нәтижелерімізге әсер етпегенін растау үшін бірнеше қосымша эксперименттер жүргіздік. Біріншіден, біз бүкіл транскриптомды (p = 0.990, R2 = 8e-6, сызықтық регрессия) немесе нақты SFARI гендерін (p = 0.784, R2 = 0.0043, сызықтық регрессия) қарастырған кезде KD мишеньдерінің экспрессия деңгейлері мен нәтижелі DEG саны арасында ешқандай байланыс таппадық (S4a-сурет). Содан кейін біз mKO2, mScarlet және iRFP670 флуорофорларын экспрессиялайтын NPC жасадық және олардың әрқайсысын CasRx-пен жеке нысанаға бағыттадық (S4-кесте); ағынды цитометрия нысанасыз флуорофорлардың флуоресценция қарқындылығына қосымша әсерлерін көрсетпеді (S4b-сурет және S5-кесте). Соңында, біз NPC-те қысқа шаш тәрізді РНҚ-ларды (shRNAs) пайдаланып нысаналы гендеріміздің ішкі жиынтығына қосымша KD зерттеулерін жүргізгеннен кейін ортақ төмендетілген DEG-тердегі күшті транскриптомдық конвергенцияны растадық (S4c-d-сурет, S5-сурет және S6-кесте).&lt;/p&gt;\n&lt;p&gt;Сондай-ақ iPSC-терде және iPSC-тен алынған қоздырғыш нейрондарда (ExNs) АСБ гендерін нокаут жасау үшін Cas9 қолданған зерттеу деректерін қайта талдау жасуша түрі ішінде де, жасуша түрлері арасында да ортақ төмендетілген DEG-терде күшті транскриптомдық конвергенцияны көрсетті (S5-сурет және S6-кесте). Біздің жұмысымыз ұсынылғаннан кейін пайда болған соңғы зерттеулер әр түрлі АСБ модельдерінде де конвергенцияны атап өтті. Біріктірілген бұл деректер АСБ гендерінің бұзылуы әр түрлі жасуша түрлері мен эксперименталды контексттерде транскриптомдық конвергенцияға әкелетінін растайды.&lt;/p&gt;\n&lt;h4 id=\"transkriptomdykh-konvergenciya-ras-khaterli-kandidat-genderin-anykhtajdy\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#transkriptomdykh-konvergenciya-ras-khaterli-kandidat-genderin-anykhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транскриптомдық конвергенция РАС қатерлі кандидат гендерін анықтайды.&lt;/span&gt;&lt;/a&gt;Транскриптомдық конвергенция РАС қатерлі кандидат гендерін анықтайды.&lt;/h4&gt;\n&lt;p&gt;Біздің KD зерттеулерімізде байқалған айқын транскриптомдық конвергенция РАС қатерлі кандидат гендерін мына белгілер бойынша бөліп көрсетуге болатынын көрсетті: 1) РАС гендерінің KD-дан кейінгі тұрақты төмендеуі және 2) жоғары гендік шектеу ұпайлары көрсеткендей, дозаға сезімталдық (SN қосымша кестесі, Әдістер). Бұл тәсіл 397 генді (SN қосымша кестесі), соның ішінде 113 SFARI генін (OR = 5,87, түзетілген p = 1,85e-39) және 49 HC-SFARI генін (OR = 11,17, түзетілген p = 1,11e-29) анықтауға мүмкіндік берді, бұл осы критерийлердің белгілі РАС гендеріне басымдық беруде тиімді екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Транскриптомдық конвергенция мен гендік шектеулерді біріктіру тек ақыл-ой кемістігі гендерімен байытылмаған түрде 397 РАС кандидат генін, соның ішінде 162 SFARI генін бөліп көрсетті.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Айта кету керек, бұл гендер жиынтығы тек ақыл-ой кемістігімен байланысты гендердің байытылуын көрсетпеді (OR = 1,01, түзетілген p = 0,509). Қалған 284 SFARI емес гендердің РАС үшін маңыздылығын растай отырып, олардың барлығы SFARI гендерімен айтарлықтай бірлескен экспрессияны көрсетеді (барлық түзетілген p &amp;lt; 0,05), бұл бұрын жаңа РАС қатерлі гендерін анықтауға көмектесетіні көрсетілген. Сонымен қатар, бұл гендердің кем дегенде қырығы бір немесе бірнеше ірі секвенирлеу зерттеулерінде РАС-пен белгілі бір байланысты көрсетеді (SN қосымша кестесі). Мысалы, AKT3 мутациялары классикалық түрде мегаленцефалия сияқты мидың шамадан тыс өсу бұзылыстарымен байланысты болғанымен, жуырда РАС-пен байланыстырылды; KIF11, KIF2A және SOS1 сияқты басқа гендер де бірнеше зерттеулерде РАС-пен байланыстырылған (SN қосымша кестесіндегі сілтемелерді қараңыз). Демек, қалған гендер РАС қатерлі кандидат гендері ретінде қарастырылуға лайық.&lt;/p&gt;\n&lt;h4 id=\"ras-genderi-npc-proliferaciyasyn-rettejdi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#ras-genderi-npc-proliferaciyasyn-rettejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РАС гендері NPC пролиферациясын реттейді.&lt;/span&gt;&lt;/a&gt;РАС гендері NPC пролиферациясын реттейді.&lt;/h4&gt;\n&lt;p&gt;Көптеген РАС гендерінің бұзылулары NPC-терде де ұқсас фенотиптік әсерлер тудырды. Тұқым қуалайтын бояғыш (CytoTrack) көмегімен пролиферацияны талдау KD-лардың 9/18 (50%) пролиферацияның статистикалық маңызды төмендеуіне әкелгенін көрсетті (1f суреті, Extended Data 6 суреті және SN қосымша кестесі), соның ішінде микроцефалияға қатысы бар бірнеше гендер (SETD1B, SETD2, SETD5, KMT2E және WAC). Керісінше, KD-лардың тек 1/18 (5,6%) NPC пролиферация жылдамдығының айтарлықтай өсуіне әкелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Пролиферация — бұл жасушалардың белсенді бөліну және көбею процесі, бұл жағдайда нерв ізашарларының денсаулығы мен өсуін бағалау үшін арнайы таңбалау көмегімен өлшенді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл төмендеген NPC пролиферациясы әртүрлі РАС гендерінің бұзылуы нәтижесінде пайда болатын жалпы фенотип екенін болжайды, бұл бұрынғы нәтижелермен үйлеседі. Осы молекулярлық фенотиптер мен РАС кезіндегі бастың қалыптан тыс өлшемі арасындағы нақты байланыстарды шешу күрделі, өйткені есептер аутизмі бар адамдарда микроцефалия да, макроцефалия да жиілігінің жоғарылайтынын көрсетеді. Шынында да, біз NPC-терде пролиферацияны төмендететінін анықтаған екі KD нысаны — SETD2 және KMT2E — осы гендерде зерттелген нақты варианттарға байланысты микроцефалиямен де, макроцефалиямен де байланысты болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Бақыланған пролиферация өзгерістері in vitro жасушалық модельдерінен алынды және олардың адам басының өлшеміне ауысу механизмі әлі де түпкілікті анықталуы тиіс.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осылайша, NPC пролиферациясының бұзылуы біздің көптеген бұзылуларымызда байқалатын конвергентті фенотип болғанымен, бұл бас өлшемінің кейінгі өзгерістерімен қалай байланысты екені әлі де анықталуы керек.&lt;/p&gt;\n&lt;h4 id=\"autizm-genderining-buzyluy-mi-organoidtarynyng-damuyn-oezgertedi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#autizm-genderining-buzyluy-mi-organoidtarynyng-damuyn-oezgertedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аутизм гендерінің бұзылуы ми органоидтарының дамуын өзгертеді&lt;/span&gt;&lt;/a&gt;Аутизм гендерінің бұзылуы ми органоидтарының дамуын өзгертеді&lt;/h4&gt;\n&lt;p&gt;Ми органоидтарындағы индуцибелді нокаут (KD) ортақ нейроонтогенетикалық фенотиптерді ашты. Осы органоидтық зерттеулерді жүзеге асыру үшін біз FLEx негізіндегі индуцибелді CRISPR нокаут (FLICK) құрылымын жасадық. FLICK жүйесі CasRx және EGFP репортерінің конститутивті экспрессиясына әкелетін доксициклинмен индуцибелді генетикалық рекомбинация арқылы KD уақытын басқаруға мүмкіндік береді (2a-сурет) және сенімді KD қамтамасыз етеді (7a-Қосымша мәлімет суреті). FLICK құрылымдары, сонымен қатар, бір жасушалы РНК секвенирлеуі (scRNA-seq) кезінде ұсталып алынатын және белгілі бір жасушадағы KD нысанын анықтау үшін қолданылатын маркерлік тізбектерді қамтиды, бұл мозаикалық ми органоидтарын талдауға мүмкіндік береді. Ұзақ мерзімді зерттеулер үшін біз CytoTrack тәжірибелерімізде NPC пролиферациясын бұзмағаны анықталған ASD гендерін таңдадық (10-Қосымша кесте). Осы гендерге бағытталған немесе NTC gRNA экспрессиялайтын FLICK құрылымдары жеке-жеке идуцирленген плюрипотентті дің жасушаларына (iPSC) тасымалданды. Содан кейін біз флуоресцентті репортер TagBFP экспрессиясына негізделген FLICK құрылымдарын біріктірген жасушаларды бөліп алу үшін флуоресценциямен белсендірілетін жасушаларды сұрыптауды (FACS) қолдандық. FACS кейін біз мозаикалық органоидтарды жасауға дейін қалпына келуі үшін бұл аралас iPSC популяциясын төрт күн бойы өсірдік (0-күн), әрбір KD нысаны үшін тең мөлшердегі FLICK+ iPSC мен бірдей мөлшердегі NTC iPSC біріктірдік. CasRx және EGFP репортерінің конститутивті экспрессиясына әкелетін FLICK құрылымының рекомбинациясы органоидтар негізінен PAX6+ NPC тұрған 14-15-күндерден бастап доксициклинмен өңдеу арқылы жасушалардың бір бөлігінде (~10%) индуцияланды (7b-Қосымша мәлімет суреті). Кейіннен бұл органоидтар бір немесе екі айлық даму кезеңіне дейін өсіріліп (2b-сурет), радиалды глиальды прогениторларды (RGs), аралық прогениторлық жасушаларды (IPCs), тежеуші нейрондарды (INs) және қоздырғыш нейрондарды (ExNs) қоса алғанда, барлық күтілетін жасуша түрлерін анықтаған scRNA-seq көмегімен талданды (2c-d-суреттер және 7c-d-Қосымша мәлімет суреті). Қосымша scRNA-seq талдауы FLICK құрылымы тиімді KD өндіре алатынын тағы да растады (7e-Қосымша мәлімет суреті).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BAZ2B, CLASP1 және EHMT1 аутизм гендерінің нокауты органоидтардағы жасушалардың азаюына және радиалды глия есебінен қоздырғыш нейрондар бағытында дифференцировканың өзгеруіне әкелді (p = 0.021, 0.018 және 0.012).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұзақ мерзімді органоидтық KD бірнеше өзгерістер бойынша ортақ фенотиптерді көрсетті. Бірнеше KD, әсіресе BAZ2B, CLASP1 және EHMT1 бағытталғандары, NTC-мен салыстырғанда органоидтарда азайды (2e-сурет), алайда бұл KD NPC культураларында пролиферацияны бұзған жоқ (6a-Қосымша мәлімет суреті және 10-Қосымша кесте). Біздің NPC культуралары мен органоидтар арасындағы бұл сәйкессіздік прогениторлардың пролиферациясын да, дифференцировкасын да қолдайтын ұзақ мерзімді органоидтар қыզқаммерзімді NPC культураларында байқалмайтын нейроонтогенетикалық фенотиптерді көрсете алатынын болжайды. Бір қызығы, микроцефалия бұл гендердегі патогендік варианттармен байланысты, бұл органоидтық фенотиптерге сәйкес келеді. Сонымен қатар, бұл KD органоидтардағы жасуша түрлерінің арақатынасын өзгертіп, салыстырмалы түрде көбірек ExN және азырақ RG түзді (BAZ2B үшін adj. p = 0.021, CLASP1 үшін 0.018 және EHMT1 үшін 0.012, Даннеттің көптік салыстыру тесті бар бір факторлы дисперсиялық анализ ANOVA) (2f-сурет және 7f-Қосымша мәлімет суреті). Бұл бірлесіп осы гендердің бұзылуы RG өзін-өзі қалпына келтіруі есебінен ExN дифференцировкасының артуына әкелуі мүмкін екенін болжайды. Басқа KD көпшілігі де 2 айлық мерзімге қарай ExN үлесінің артуына бейім болды, бұл бұрынғы бақылауларға сәйкес келетін конвергентті нейроонтогенетикалық фенотип екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq (бір жасушалы РНК секвенирлеуі) мыңдаған жеке жасушалардың экспрессия профилін егжей-тегжейлі зерттеуге мүмкіндік береді, ал органоидтар зертханада өсірілген үш өлшемді ми үлгілері болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ASD гендерінің азаюы, сонымен қатар, ми органоидтарында айқын транскрипциялық конвергенцияға әкелді (3a-сурет және 7g-Қосымша мәлімет суреті). Әр түрлі KD бар RG өте ұқсас дифференциалды экспрессияланатын гендерді (DEG) көрсетті, бұл NPC культураларынан алған нәтижелерімізді тағы да растайды. Шын мәнінде, органоидтық RG анықталған DEG NPC культураларындағы сол нысанның KD анықталған DEG-мен күшті түрде сәйкес келді (7h-Қосымша мәлімет суреті), бұл ген экспрессиясына әсер ететін бұл әсерлердің белгілі бір эксперименталдық контекстке тән емес екенін болжайды. Транскрипциялық конвергенция сонымен қатар IPC пен ExN қоса алғанда, қосымша жасуша түрлерінде байқалды (3a-сурет және 7g-Қосымша мәлімет суреті), бұл ASD гендерінің ортақ төменгі ағынды әсерлер бойынша конвергенциясы тек нейрондық прогениторларға ғана тән емес екенін дәлелдейді. Бұл ASD әр түрлі себептері бар адамдардың қайтыс болғаннан кейінгі ми тінінде ортақ ASD DEG анықтаған зерттеулермен, сондай-ақ әр түрлі ASD гендері бұзылған кезде синапстық құрылым немесе белсенділік сияқты ExN конвергентті фенотиптерінің кең тараған бақылауларымен сәйкес келеді, бұл конвергенция жасуша түрінің немесе прогениторлық жасушалар тағдырының жай ғана ортақ өзгеруін көрсетпейтінін білдіреді. Сонымен қатар, біз scRNA-seq көмегімен сәйкес келетін DEG анықтау әрбір өзгеріс үшін секвенирленген жасушалар санына қатты тәуелді екенін анықтадық, мұны іріктемелік талдау көрсетеді (3b-сурет). Іріктеме көлеміне бұл тәуелділік кішірек іріктеме көлемдері бар кейбір бұрынғы зерттеулерде жеке ген деңгейінде байқалған сенімді транскрипциялық конвергенцияның болмауын ішінара түсіндіруі мүмкін. Біздің изогендік фонды пайдалануымыз транскрипциялық конвергенцияны анықтауымызға ықпал еткен болуы мүмкін, өйткені әр түрлі генетикалық фонда органоидтардағы ASD гентерінің бұзылуынан туындайтын нейроонтогенетикалық фенотиптерге айтарлықтай әсер ететіні анықталған. Соңында, кейбір конвергентті түрде бұзылған гендер жасуша түріне тән болғанымен, көптеген гендер SFARI DEG қоса алғанда, бірнеше жасуша түрлерінде тұрақты түрде бұзылды (3c-сурет). Бұл жасуша түріне тән ерекшеліктер ASD гендерінің бұзылуының транскрипциялық салдарына әсер етсе де, белгілі бір әсерлер әр түрлі жасуша түрлерімен кеңінен бөлісуі мүмкін екенін болжайды.&lt;/p&gt;\n&lt;h4 id=\"mi-organoidterindegi-oetken-zhiti-buzylulardan-kejingi-transkriptomdykh-konvergenciya\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#mi-organoidterindegi-oetken-zhiti-buzylulardan-kejingi-transkriptomdykh-konvergenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ми органоидтеріндегі өткен жіті бұзылулардан кейінгі транскриптомдық конвергенция&lt;/span&gt;&lt;/a&gt;Ми органоидтеріндегі өткен жіті бұзылулардан кейінгі транскриптомдық конвергенция&lt;/h4&gt;\n&lt;p&gt;2 айлық органоидтердегі аутизм (ASD) гендерінің өткен жіті бұзылуы ортақ дифференциалды экспрессияланатын гендер (DEG) бойынша тіпті үлкен конвергенцияны анықтады. Қалыпты дамыған органоидтер ішінде осы гендердің бұзылуының жедел әсерлерін анықтауға мүмкіндік беру үшін, 61-62-ші күндерден бастап доксициклинмен өңдеу арқылы KD (нокдаун) индукцияланғанға дейін екі ай бойы қосымша мозаикалық FLICK органоидтері өсіріліп, екі күннен кейін scRNA-seq орындалды. Бұл тәсіл әрбір KD үшін ұқсас жасуша санын қамтамасыз етті (3d сурет және SN 7i суреті), бұл ұзақ мерзімді KD кезінде органоидтерден сарқылған KD-лерді тереңірек талдауға мүмкіндік берді (2e сурет). Күтілгендей, бұл органоидтер жасуша түрлерінің қоспасын қамтыды (3e сурет және SN 7j суреті), мұнда қоздырушы нейрондар (ExN) осы даму кезеңінде ең көп таралған жасуша түрі болды (SN 7k суреті). Бір қызығы, көптеген KD-лер NPC (жүйке жасушаларының арғытектері) культураларынан анықталған DEG-термен байытылған ExN DEG-теріне әкелді (SN 7l суреті), бұл ASD гендерінің KD кезінде әртүрлі жасуша түрлері бойынша ген экспрессиясының ортақ өзгерістерін тағы да көрсетеді. Сонымен қатар, ұзақ мерзімді KD барысында органоидтерден сарқылған нысана гендердің жіті KD жасалуы (2e сурет) бұл әсерлер үшін әлдеқайда көп жасуша санын алуға мүмкіндік берді, бұл KD-лердің де күшті транскриптомдық конвергенцияға әкелетінін көрсетті (3f сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Органоидтердегі ASD гендерінің жедел нокдауны айқын транскриптомдық конвергенцияны растайды және қоздырушы нейрондар сияқты негізгі жасуша түрлеріне әсер етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rest-ti-khosa-alghanda,-negizgi-transkripciya-faktorlary-khajtadan-disregulyaciyalanghan-genderge-baghyttalghan-transkripciyalykh\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#rest-ti-khosa-alghanda,-negizgi-transkripciya-faktorlary-khajtadan-disregulyaciyalanghan-genderge-baghyttalghan-transkripciyalykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;REST-ті қоса алғанда, негізгі транскрипция факторлары қайтадан дисрегуляцияланған гендерге бағытталған. Транскрипциялық&lt;/span&gt;&lt;/a&gt;REST-ті қоса алғанда, негізгі транскрипция факторлары қайтадан дисрегуляцияланған гендерге бағытталған. Транскрипциялық&lt;/h4&gt;\n&lt;p&gt;реттеушілер, ASD-де транскрипциялық конвергенцияны қамтамасыз ете алатындар, ENCODE деректер базасынан хроматин иммунопреципитациясын секвенирлеу (ChIP-seq) деректерін пайдаланатын MAGIC талдауы (Әдістер) арқылы анықталды, ол қызығушылық тудыратын гендер жиынтығында байланысу нысаналары байытылған транскрипция факторлары мен кофакторларды анықтайды. Бұл NPC-тердегі ASD гендерінің көптеген KD-лері бойынша нысана гендері қайталанатын дифференциалды түрде экспрессияланған транскрипциялық реттеушілерді анықтады (SN 8a суреті және SN 11 кестесі), соның ішінде CHD2 және SIN3A сияқты жоғары сенімді SFARI (HC-SFARI) гендері. Бұрын ASD-мен байланысты емес қайталанатын MAGIC реттеушілерінің арасында бірнешеуі жоғары консервативті (SN 7 кестесі) және белгілі ASD гендерімен бірге экспрессияланатын (SN 8a суреті) болды — бұл қасиеттер жаңа ASD қауіп гендерін болжауға болатынын көрсетті4. MAGIC талдауы органоидтердегі конвергенцияның тұрақты драйверлерін де анықтады (SN 8a суреті және SN 11 кестесі). NPC-терде анықталған ең жақсы қайталанатын транскрипциялық реттеушілердің жартысы (13/26, 50%) органоидтік RG-лерде де анықталды (SN 8b суреті). MAGIC сондай-ақ даму кезеңдері бойынша және ұзақ мерзімді және жіті KD уақыт шкалалары бойынша ортақ ExN реттеушілерін, соның ішінде көптеген SFARI гендерін анықтады. Бір қызығы, бұл гендердің тоғызы нейрондық арғытектерде де ең жоғары транскрипциялық реттеушілер ретінде анықталды, бұл олардың бірнеше жасушалық контексттердегі конвергенцияның негізгі драйверлері екенін көрсетеді. Атап айтқанда, RE1 тыныштандырушы транскрипция факторы (REST) NPC зерттеулерінің 17/18 (94.4%) жағдайында MAGIC бойынша елеулі болды (SN 8a суреті) және барлық сыналған жағдайларда ең жақсы MAGIC реттеушісі ретінде тұрақты түрде пайда болды (SN 8b суреті). REST-тің тікелей мутациялары бұрын ASD-мен байланысты болмағанымен, REST нейрогенезде маңызды рөл атқарады және нейрогенездің басты негативті реттеушісі ретінде жұмыс істейді40,41. REST дисрегуляциясы ASD гендерінің бұзылуынан кейін де хабарланған, мысалы, CHD842 және Ретт синдромының гені MECP243,44. Адам және тышқан REST ChIP-seq байланысу сайттарын қайта талдау (Әдістер) REST нысаналары арасында SFARI гендерінің күшті байытылуын анықтады (сәйкесінше adj. p = 3.6e-67 және 7.7e-50), соның ішінде HC-SFARI гендері (сәйкесінше adj. p = 2.2e-13 және 3.7e-8), бұл ASD-ге қатысты гендер экспрессиясын реттеудегі REST-тің маңызды рөлін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ChIP-seq әдісі геном бойынша ақуыздардың ДНҚ-мен байланысу орындарын картаға түсіруге мүмкіндік береді, ал MAGIC талдауы гендер жиынтығы үшін ортақ реттеуші желілерді анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gendik-retteushi-zhelining-rekonstrukciyasy-zhoghary-oezara-bajlanyskhan-asd-genderin-koersetedi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#gendik-retteushi-zhelining-rekonstrukciyasy-zhoghary-oezara-bajlanyskhan-asd-genderin-koersetedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гендік реттеуші желінің реконструкциясы жоғары өзара байланысқан ASD гендерін көрсетеді&lt;/span&gt;&lt;/a&gt;Гендік реттеуші желінің реконструкциясы жоғары өзара байланысқан ASD гендерін көрсетеді&lt;/h4&gt;\n&lt;p&gt;ARACNe көмегімен NPC RNA-seq деректерімізден de novo GRN реконструкциясы қосымша транскрипция факторлары мен хроматин модификаторларын — бірге «реттеушілер» деп аталады — олардың төменгі ағындағы нысаналарымен (регулондармен) байланыстыруға мүмкіндік берді (Әдістер). Біз бұл тәсілді регулондарды болжауда айналмалы қателіктерді болдырмау үшін KD нысанының өзі әлеуетті реттеуші болып табылатын үлгілердегі деректерді алып тастайтын «ұстап қалынған» (held-out) GRN-дерді бөлек құру арқылы растадық. Осы сақталған GRN-дерден болжанған регулондар NPC-тегі сәйкес нысана гендердің KD жасалуынан кейін байқалған DEG-термен күшті түрде қиылысты (әрқайсысы үшін adj. p &amp;lt; 3.98e-116, біріктірілген p = 4.08e-937) (4a суреті және SN 9a суреті). Осылайша, ARACNe шынайы реттеуші қатынастарды тиімді түрде қамтиды. Толық NPC GRN ASD гендері мен олардың жоғарғы ағындағы реттеушілері арасындағы жоғары өзара байланыс дәрежесін көрсетті (4b суреті). Шын мәнінде, ASD гендері NPC GRN орталық гендері арасында күшті байытылған болатын (SFARI гендері үшін adj. p = 9.81e-6, HC-SFARI гендері үшін 1.99e-4, орталықтылық PageRank алгоритмі арқылы бағаланды, Әдістер) (4c суреті). Керісінше, тек ақыл-ой кемістігіне ғана қатысты гендер (ID-only) GRN орталық гендері арасында байытылуды көрсетпеді (adj. p = 0.19), бұл ASD гендерінің KD-лері нәтижесінде пайда болған DEG-тер арасында байқалмаған байытылуға сәйкес келеді (1c суреті). Сонымен қатар, орталық GRN гендері G2M бақылау нүктесімен (adj. p = 6.0e-4) және митоздық ұршықпен (adj. p = 3.6e-5) байланысты жолдар үшін байытылған, бұл біз байқаған NPC пролиферация фенотиптеріне сәйкес келеді (1f суреті және SN 10 кестесі).&lt;/p&gt;\n&lt;h4 id=\"grn-taldauy-chd8-genin-asb-daghy-konvergenciyanyng-negizgi-drajveri-retinde-anykhtajdy\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#grn-taldauy-chd8-genin-asb-daghy-konvergenciyanyng-negizgi-drajveri-retinde-anykhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GRN талдауы CHD8 генін АСБ-дағы конвергенцияның негізгі драйвері ретінде анықтайды&lt;/span&gt;&lt;/a&gt;GRN талдауы CHD8 генін АСБ-дағы конвергенцияның негізгі драйвері ретінде анықтайды&lt;/h4&gt;\n&lt;p&gt;Біз содан кейін АСБ-мен байланысты транскриптомдық конвергенцияның негізгі драйверлері ретінде әрекет ететін GRN реттеушілерін анықтадық. Бұл талдау АСБ генінің KD әсерінен белсенділігі тұрақты түрде өзгерген және нысандары SFARI гендерімен байытылған, сондай-ақ GRN орталығында орналасқан конвергенцияның 70 негізгі драйверін ашты (S12-кесте). Осы негізгі конвергенция драйверлерінің жартысына жуығы SFARI гендері болып табылады (31/70, ОШ = 6,35, түз. p = 3,9e-11), ал үштен біріне жуығы жоғары сенімді HC-SFARI гендері (22/70, ОШ = 10,61, түз. p = 6,7e-12). Керісінше, бұл конвергенция драйверлерінің тек жетеуі ғана ақыл-ой кемістігіне ғана тән гендер болып табылады (7/70, ОШ = 2,06, түз. p = 0,078). Сонымен қатар, бұл негізгі конвергенция драйверлері АСБ гендерінің барлық дерлік KD кезінде тұрақты төмен реттелген (S9b-сурет). Олар сондай-ақ GRN ішінде (p &amp;lt; 1e-6) (4d-сурет), сондай-ақ STRING ақуыз-ақуыз өзара әрекеттесу деректер базасында (p = 2,0e-9) жоғары деңгейде өзара байланысқан (Әдістер).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GRN талдауы АСБ-дағы транскриптомдық конвергенцияның 70 негізгі драйверін анықтады, олардың арасында SFARI гендері басым болып, тығыз өзара байланыс пен ген KD кезінде үйлесімді төмендеуді көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жиынтықтай келгенде, бұл бұл гендер АСБ көптеген гендерінің орталық реттеушілері ретінде әрекет етіп қана қоймай, сонымен бірге бір-бірін өзара реттейтінін, бұл АСБ-да транскриптомдық конвергенцияны тудыратынын көрсетеді. Итеративті walktrap кластерлеуі конвергенцияның 70 негізгі драйвері арасында төрт гендік модульді анықтады (4e-сурет), олардың біреуі (көк) әсіресе күшті өзара байланысқа ие болды. Бұл модуль STRING талдауы арқылы өте жоғары өзара әрекеттесуді көрсетті (p &amp;lt; 1e-16) және REST (S8-сурет) пен АСБ-ның белгілі ең күшті қауіп гендерінің бірі CHD8 қамтыды. Маңыздысы, GRN-нан болжанған CHD8 регулоны ChIP-seq арқылы бұрын анықталған тікелей CHD8 нысана гендері үшін күшті байытылған еді (1-дәрежелі регулон түз. p = 4,6e-7, 2-дәрежелі регулон түз. p = 3,9e-20) (4f-сурет), бұл ARACNe болжаған реттеуші байланыстардың дұрыстығын қосымша растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ChIP-seq (хроматин иммунопреципитациясы және секвенирлеу) әдісі транскрипциялық факторлар сияқты ақуыздардың геномның қай бөліктерімен байланысатынын анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, бұрынғы есептерге сәйкес, CHD8 ChIP-seq нысаналары да NPC-те экспрессияланатын SFARI гендерімен (түз. p = 2,6e-8) және HC-SFARI гендерімен (түз. p = 8,5e-8) жоғары деңгейде байытылған. CHD8 бар модуль сонымен қатар біз тікелей өзгерткен үш транскрипциялық реттеушіні (SETD2, SETD5 және KMT2E) қамтыды, ал осы KD-дан шыққан дифференциалды экспрессияланатын гендер (DEG) CHD8 ChIP-seq нысаналары үшін елеулі байытуды көрсетті (сәйкесінше түз. p = 1,2e-5, 7,8e-8 және 2,6e-4) (4f-сурет), бұл маңызды АСБ гендерінің ортақ нысаналарды конвергентті реттеуін қосымша көрсетеді. Бұл талдау жоғары сенімді АСБ қауіп гені болып табылатын CHD8-ді АСБ-дағы транскриптомдық конвергенцияның негізгі драйвері ретінде көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"h-tirkelgen-transkripciyalykh-faktor-zfx-aejel-zhynysyna-kharaj-auytkhityn-asb-genderining-retteushisi\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#h-tirkelgen-transkripciyalykh-faktor-zfx-aejel-zhynysyna-kharaj-auytkhityn-asb-genderining-retteushisi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Х-тіркелген транскрипциялық фактор ZFX — әйел жынысына қарай ауытқитын АСБ гендерінің реттеушісі&lt;/span&gt;&lt;/a&gt;Х-тіркелген транскрипциялық фактор ZFX — әйел жынысына қарай ауытқитын АСБ гендерінің реттеушісі&lt;/h4&gt;\n&lt;p&gt;Бұрынғы зерттеулер АСБ кезінде төмен реттелген гендер нейротиптік әйелдердің миында еркектерге қарағанда жоғарырақ деңгейде экспрессиялануға бейім екенін көрсетті, бұл базалық әйел жынысына қарай ауытқитын экспрессия осы қорғаныш әсерге ықпал етуі мүмкін деген болжамды тудырады. Біз АСБ генінің KD әсерінен тұрақты түрде төмен реттелген және мида әйел жынысына ауытқитын экспрессияны көрсеткен 82 генді анықтадық (Әдістер), олардың 28-і жоғары дәрежеде консервативті болды (S10a-сурет), оның ішінде 12 жоғары консервативті SFARI гендері бар (ОШ = 2,79, p = 8,65e-3) (5a-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;АСБ гені KD кезінде экспрессиясы төмендейтін және мида әйелге тән экспрессиясы бар 82 геннің анықталуы олардың аутизмдегі жыныстық айырмашылықтарға қосатын үлесін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нейротиптік еркек бақылау топтары мен аутизмі бар еркектердің маңдай қыртысынан алынған бір ядролы РНK секвенирлеу деректерін қайта талдау (Әдістер) — оның ішінде 15q дупликация синдромы және генетикалық идиопатиялық АСБ бар адамдар — бұл жоғары консервативті гендердің көпшілігі аутизмі бар еркектердің қоздырғыш нейрондарында айтарлықтай төмен реттелгенін анықтады, бұл олардың АСБ-мен байланысын қосымша растайды (5a-сурет және S10a-сурет).&lt;/p&gt;\n&lt;p&gt;Олардың арасында ZFX ерекше қызығушылық тудырады, өйткені ол әйелдердегі белсенді және белсенді емес Х-хромосомалардың екеуінен де экспрессияланады, бұл оны дамып келе жатқан ми қабығын қоса алғанда (S10b-c-сурет), әртүрлі тіндердегі ең жоғары және ең тұрақты әйел жынысына бейім гендердің біріне айналдырады. Сонымен қатар, соңғы есеп патогенді ZFX варианттарын АСБ-мен байланыстырды, ал ZFX геніндегі қосымша кодтаушы варианттар да АСБ пробандтарында анықталды. ZFX жалпыгеномдық нысаналардың қуатты транскрипциялық активаторын кодтайды, және біз GRN-да ZFX пен АСБ-ға қатысты гендер жиынтықтары арасында көптеген реттеуші байланыстарды анықтадық (5b-сурет), оның ішінде біз бұрын анықтаған АСБ-дағы транскриптомдық конвергенцияның негізгі драйверлері бар (ОШ = 9,8, түз. p = 2,2e-6).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алынған реттеуші байланыстар in vitro/ex vivo үлгілерінен алынған, сондықтан қатаң септік-салдарлық механизмдерді растау үшін қосымша in vivo функционалдық зерттеулері қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз сондай-ақ ZFX осы негізгі драйверлердің көпшілігінің төменгі ағындағы нысанасы екенін, бірнеше өзара реттеуші байланыстары бар екенін анықтадық (5c-сурет). ZFX нысаналарының АСБ-ға қатысты гендермен күшті байытылуы ZFX ChIP-seq деректерін қайта талдау арқылы қосымша расталды (5d-сурет). ZFX АСБ гендері бұзылған кезде қайталанатын түрде төмен реттелгендіктен, оның әйел жынысына ауытқитын экспрессиясы АСБ-ға қатысты гендердің реттеушісі ретіндегі рөлімен бірігіп, АСБ гендерінің экспрессиясына каскадты және кең ауқымды жыныстық-дифференциалды әсерлерге әкелуі мүмкін, бұл АСБ-дағы қорғаныш әсерге әлеуетті түрде ықпал етеді (5e-сурет).&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"casrx-koemegimen-nokdaun\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#casrx-koemegimen-nokdaun\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CasRx көмегімен нокдаун&lt;/span&gt;&lt;/a&gt;CasRx көмегімен нокдаун&lt;/h4&gt;\n&lt;p&gt;CasRx17, атап айтқанда NLS-RfxCas13d-NLS (Addgene #109049), нысаналы транскрипттерге нокдаун (KD) жасау үшін нысанаға тән бағыттаушы РНК-лармен (gRNA) бірге қолданылды. Қызығушылық тудыратын гендерге бағытталған gRNA спейсерлік тізбектерін жобалау үшін терең оқытуға негізделген құрал пайдаланылды. Бұл спейсерлік тізбектер гомополимерлерді (4-тен артық A, 3-тен артық C, G немесе T) жою үшін сүзгіден өткізілді. Әлеуетті нысанадан тыс (off-target) әсерлесуі бар спейсерлік тізбектер BLAST көмегімен анықталып, алынып тасталды. Әрбір нысаналы ген үшін 3 жеке спейсерлік тізбек таңдалып, әрбір спейсерлік тізбектің алдында CasRx тікелей қайталану (DR36) тізбегі орналасқан тандемдік пре-gRNA матриціне біріктірілді: CAAGTAAACCCCTACCAACTGGTCGGGGTTTGAAAC. Тандемдік пре-gRNA матрицтері KD үшін CasRx арқылы жеке gRNA-ларға өңделеді. Толық тізбектер Қосымша кестеде келтірілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун (KD) және gRNA — бұл ферменттерді ыдырауға тиіс матрицалық РНК-ға бағыттайтын арнайы РНК-гидтердің (gRNA) көмегімен нақты гендердің экспрессиясын төмендету әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"molekulyarlykh-klondau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#molekulyarlykh-klondau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Молекулярлық клондау&lt;/span&gt;&lt;/a&gt;Молекулярлық клондау&lt;/h4&gt;\n&lt;p&gt;Бастапқы NPC KD эксперименттеріне арналған құрылымдарды жасау үшін pSicoR лентивирустық плазмидасы (Addgene #11579) негіз (backbone) ретінде пайдаланылды. Тышқанның U6 промоторы CasRx gRNA матрицтерінің экспрессиясын басқару үшін қолданылған адамның U6 промоторымен алмастырылды. Бұл құрылымдар CasRx енгізілген (knock-in) жасушалық линиясымен бірге қолданылды (төменде сипатталған). Авто-вестерн-блот арқылы CasRx KD растау үшін жеткілікті мөлшердегі NPC алу мақсатында (төменде сипатталған), CAG промоторлық элементінен CasRx пен EGFP-ті және адамның U6 промоторынан gRNA матрицтерін экспрессиялайтын барлығы бір жерде (all-in-one) құрылымы жасалды. Сондай-ақ қаңқаның құрамында piggyBac транспозасы арқылы құрылымның геномға бірігуіне мүмкіндік беретін кері терминалдық қайталанулар (ITR) болды. Бұл құрылымдар LiOn дизайнына негізделген (Addgene #154019), сондықтан CasRx және EGFP экспрессиясы piggyBac транспозасы арқылы құрылымның рекомбинациясына тәуелді болып, эписомалық плазмидадан экспрессияны болдырмады. Бұл барлығы бір жерде құрылымы флуорофор KD анализдері және NPC пролиферация анализдері үшін де қолданылды. NPC-те флуорофорларды экспрессиялау үшін CAG промоторлық элементі басқаратын mKO2, mScarlet немесе iRFP670 бар iOn негізіндегі құрылымдар жасалды. shRNA негізіндегі KD үшін shRNA дизайны Horizon siDesign Center құралы (https://horizondiscovery.com/en/ordering-and-calculation-tools/sidesign-center) көмегімен орындалды. G әрпінен басталатын болжанған shRNA-лар таңдалды, ал әлеуетті нысанадан тыс әсерлесулері барлары BLAST көмегімен анықталып, алынып тасталды. Таңдалған shRNA-лар (Қосымша кесте 13) pSicoR плазмидасына (Addgene #11579) клондалды. Органоидтық эксперименттер үшін біз FLEx дизайнын қамтитын қаңқаға бірнеше ерекшеліктерді енгізу арқылы FLEx негізіндегі индукцияланатын CRISPR нокдаун (FLICK) құрылымын жасадық. Атап айтқанда, біз клондау кезінде плазмиданың рекомбинациясын болдырмайтын интроны бар модификацияланған Cre рекомбиназасын қостық. Сондай-ақ доксициклинмен индуцияланатын рекомбинацияны қамтамасыз ету үшін CasRx17, сондай-ақ Tet-On 3G жүйесінің барлық қажетті компоненттерін енгіздік. Сонымен қатар, флуоресцентті репортерлер үшін polyA сайттарынан сәл жоғарырақ идентификациялайтын штрих-код тізбектерін қостық, бұл бір жасушалы РНК секвенирлеу (scRNA-seq) арқылы әрбір жасушаға қандай KD құрылымы енгізілгенін анықтауға мүмкіндік берді. Соңында, piggyBac транспозасы арқылы құрылымның геномға бірігуіне мүмкіндік беретін ITR-лерді қостық. Барлық құрылымдардың тізбектері толық плазмидалық секвенирлеу (Plasmidsaurus) арқылы тексерілді.&lt;/p&gt;\n&lt;h4 id=\"zhasusha-kulturasy\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#zhasusha-kulturasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасуша культурасы&lt;/span&gt;&lt;/a&gt;Жасуша культурасы&lt;/h4&gt;\n&lt;p&gt;Адам жасушалары культурасымен атқарылған барлық жұмыстар Бостон балалар ауруханасынын IRB #S07-02-0087 мақұлданған хаттамаларына сәйкес орындалды. Бақылау ер адамның индуцияланған плюрипотентті дің жасушаларының (иПДЖ) «280» линиясы бұрын алынып, толық сипатталған. Адам иПДЖ және иПДЖ-дан алынған NPC Matrigel (Corning #354277) немесе Geltrex (ThermoFisher #A1413302) алдын ала қапталған тін культурасы планшеттерінде өсірілді. Жасушалар Accutase (Millipore Sigma #SCR005) немесе ReleSR (StemCell Technologies #100-0483) көмегімен қажетінше пассаждалды. Адам иПДЖ mTeSR™ Plus ортасында (StemCell Technologies #100-0276) өсірілді. Адам NPC-тері иПДЖ-дан STEMdiff™ SMADi Neural Induction Kit (StemCell Technologies #08582) көмегімен Моноқабатты культура хаттамасын (Monolayer Culture Protocol) сақтай отырып, кемінде үш апта бойы алынды. NPC-тер Neural Induction Medium + SMADi ортасында үздіксіз өсірілді және нейральді ілгерілеушілер ортасына (Neural Progenitor Medium) ауыстырылмады. Ортаға иПДЖ немесе NPC пассаждалғаннан кейін шамамен 1 күн бойы 10 мкM Y-27632 (StemCell Technologies #72304) қосылды. Ми органоидтары Giandomenico және т.б. (2021) ұсыныстарымен, сондай-ақ қосымша модификациялармен 280-иПДЖ-дан STEMdiff™ Cerebral Organoid Kit (StemCell Technologies #08570) көмегімен алынды. Атап айтқанда, органоидтар 7-күні Matrigel-ге (Corning #354277) салынды және 14-күнге дейін Expansion Medium-да өсірілді, содан кейін олар Matrigel-ден шығарылып, орбиталық шайқауышта Maturation Medium-ға ауыстырылды. Хаттамалар бойынша толық мәліметтерді мына сілтемеден көре аласыз: https://dx.doi.org/10.17504/protocols.io.x54v95p5ql3e/v1. Жасуша линияларының ешқайсысы аутентификациядан өтпеген. Барлық жасуша линиялары микоплазмамен ластанудың жоқтығына жүйелі түрде тексеріліп тұрды.&lt;/p&gt;\n&lt;h4 id=\"casrx-knock-in-ipdsk-alu\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#casrx-knock-in-ipdsk-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CasRx Knock-in іПДСК алу&lt;/span&gt;&lt;/a&gt;CasRx Knock-in іПДСК алу&lt;/h4&gt;\n&lt;p&gt;CasRx17 бұрын сипатталған нысанаға алу құрылымдарын пайдалана отырып, 280-иПДЖ-ның AAVS1 қауіпсіз локусына (safe harbor locus) енгізілді. Жеке иПДЖ колониялары таңдалып алынды және көбейтілді. AAVS1 локусының дұрыс нысанаға алынғанын растау үшін Celplor компаниясы арқылы Саузерн-блоттинг талдауы жасалды. Кариотипті талдау KaryoStat (ThermoFisher) көмегімен жүргізілді, ол 1-хромосомада микроматрица номенклатурасында arr[GRCh37] 1q32.1(204108163_206539638)x3 ретінде сипатталған 2,4 Мб өсімді анықтады. Бұл аймақта нысаналы гендердің ешқайсысы болған жоқ.&lt;/p&gt;\n&lt;h4 id=\"lentivirus\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#lentivirus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лентивирус&lt;/span&gt;&lt;/a&gt;Лентивирус&lt;/h4&gt;\n&lt;p&gt;Лентивирус бұрын сипатталған стандартты хаттамалар арқылы алынды. Лентивирустар 4,0 инфекция көптігімен (MOI) қолданылды, өйткені мұндай MOI &amp;gt;98% трансдукцияланған жасушаларды береді. РНК 24 сағаттан кейін экстракцияланды.&lt;/p&gt;\n&lt;h4 id=\"rnkh-sekvenirleuge-rna-seq-arnalghan-kitaphanany-dajyndau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#rnkh-sekvenirleuge-rna-seq-arnalghan-kitaphanany-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНҚ секвенирлеуге (RNA-Seq) арналған кітапхананы дайындау&lt;/span&gt;&lt;/a&gt;РНҚ секвенирлеуге (RNA-Seq) арналған кітапхананы дайындау&lt;/h4&gt;\n&lt;p&gt;Жалпы РНҚ Direct-zol RNA Microprep Kit (Zymo Research, #R2062) көмегімен бөлініп алынды, ал 3’-RNA-seq кітапханалары CheapSeq хаттамасынан ұсыныстар мен біріктіру стратегияларын біріктіре отырып, TagSeq хаттамасының өзгертілген нұсқасына сәйкес дайындалды. Қысқаша айтқанда, әр үлгіден 200 нг жалпы РНҚ CheapSeq үшін сипатталғандай индексацияланған oligo(dT) праймерімен және буфермен (NEB, #M0466L) біріктірілді. РНҚ қақпақсыз, алдын ала қыздырылған термоциклерде 94 °C температурада 2,5 минут ішінде фрагменттерге бөлінді, содан кейін үлгілер дереу мұзға көшірілді. Содан кейін әр үлгі CheapSeq үшін сипатталғандай кері транскрипция үшін қажетті қосымша реагенттермен бірге индексті және бірегей молекулалық идентификаторды (UMI) қамтитын матрицаны ауыстыратын олигомен (TSO) араластырылды. Кері транскрипция реакциясы жылумен инактивациялаусыз 42 °C температурада 90 минут бойы жүргізілді. Қалған бір тізбекті РНҚ мен олиголар содан кейін 0,5 мкл EB буферін (Qiagen, #19086), 0,5 мкл термолабильді ExoI (NEB, #M0568S) және 0,25 мкл RNase A (ThermoFisher, #EN0531) қосу арқылы және үлгілерді 37 °C температурада 30 мин бойы инкубациялау, одан кейін 85 °C температурада 5 мин бойы жылумен инактивациялау және 4 °C температурада ұстау қадамы арқылы ыдыратылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SPRI-селекция — бұл қажетті өлшемдегі фрагменттерді іріктеп алуға мүмкіндік беретін магнитті бөлшектер арқылы ДНҚ-ны тазарту әдісі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әртүрлі индекс тізбектері бар 8 үлгіге дейін біріктірілді, ал кДНҚ 1,4x сол жақты SPRI-селекцияны (Beckman Coulter, #B23317) орындау арқылы тазартылды. Содан кейін C1000 Touch Thermal Cycler (Bio-Rad, #1851197) көмегімен төменде сипатталған «CheapSeq PCR» параметрлерін сақтай отырып, кДНҚ-ны 7 цикл бойы амплификациялау үшін ішінара Read1 және ішінара Read2 праймерлерімен бірге Q5 UltraII Mastermix (NEB, #M0544L) пайдаланылды. Амплификацияланған кДНҚ 0,7x сол жақты SPRI-селекция (Beckman Coulter, #B23317) арқылы тазартылды. Түпкілікті кітапхана құрылысы Q5 UltraII Mastermix (NEB, #M0544L) сондай-ақ стандартты TruSeq индексациялау праймерлерін (NEB, #E6440S) пайдалана отырып және төменде сипатталған «CheapSeq PCR» параметрлерін сақтай отырып, 8 цикл бойы амплификациялау арқылы орындалды. Кітапханалар 0,4x-0.65x екі жақты SPRI-селекцияны (Beckman Coulter, #B23317) орындау арқылы тазартылды. Тазартылған кітапханалар Tapestation HSD1000 (Agilent, #5067-5584 және #5067-5585) көмегімен бағаланды. Олиго тізбектері үшін 14-қосымша кестеге қараңыз. CheapSeq ПЦР: 1. 98 °C температурада 30 с; 2. 98 °C температурада 10 с, 65 °C температурада 75 с болатын X цикл; 3. 65 °C температурада 5 мин; 4. 4 °C мәңгілікке.&lt;/p&gt;\n&lt;h4 id=\"casrx-kd-npc-larynyng-koelemdik-rna-seq-taldauynan-differencialdy-tuerde-ekspressiyalanghan-gen-deg-taldauy\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#casrx-kd-npc-larynyng-koelemdik-rna-seq-taldauynan-differencialdy-tuerde-ekspressiyalanghan-gen-deg-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CasRx-KD NPC-ларының көлемдік RNA-seq талдауынан дифференциалды түрде экспрессияланған ген (DEG) талдауы&lt;/span&gt;&lt;/a&gt;CasRx-KD NPC-ларының көлемдік RNA-seq талдауынан дифференциалды түрде экспрессияланған ген (DEG) талдауы&lt;/h4&gt;\n&lt;p&gt;Әрбір жағдай үшін үш бөлек NPC үлгісі талданды. Жеке KD жағдайлары бірге 9 бақылау үлгілері жиынтығы ретінде қарастырылған үш нысаналы емес бақылау (NTC) жағдайларымен салыстырылды. Ген экспрессиясы UMI дедупликациясы бар alevin-fry көмегімен сандық түрде бағаланды (salmon-v1.9). Salmon индексі және транскрипттен генге картасы Gencode v45 көмегімен құрылды. Бір генге карталанған әртүрлі транскрипттердің санақтары қосылды. Кеیشен талдаулар үшін тек NTC үлгілерінде baseMean экспрессиясы &amp;gt;10 болатын гендер қарастырылды. Дифференциалды экспрессия талдауы ~Batch + sgRNA моделін қолдана отырып, DESeq2 (v1.42.0) көмегімен орындалды. KD растау үшін p-мәндері тікелей нысанаға алынған 20 ген жиынтығы үшін көптік гипотезаларды тексеруге арналған Бенджамини — Хохберг түзетуін қолдана отырып түзетілді. SRCAP үшін шикі p-мәні тамшылы цифрлық ПЦР-ден алынды (төменде қараңыз), өйткені SRCAP төмен экспрессияға байланысты RNA-seq талдауынан сүзіліп тасталған болатын. Қараңыз&lt;/p&gt;\n&lt;h4 id=\"tamshyly-cifrlykh-pcr-ddpcr\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#tamshyly-cifrlykh-pcr-ddpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тамшылы цифрлық ПЦР (ddPCR)&lt;/span&gt;&lt;/a&gt;Тамшылы цифрлық ПЦР (ddPCR)&lt;/h4&gt;\n&lt;p&gt;Төмен экспрессияға байланысты RNA-seq талдауынан сүзіліп тасталған SRCAP KD растау үшін, RNA-seq үшін пайдаланылған сол РНҚ үлгілері (жоғарыда) ddPCR көмегімен бағаланды. РНҚ бірінші кезекте SuperScript™ IV VILO™ Master Mix (ThermoFisher Scientific, #11756050) көмегімен кДНҚ-ға айналдырылды. Әрі қарай, ddPCR 0,25 нг/мкл РНҚ-эквиваленттік концентрациясындағы кДНҚ-ны (20 мкл реакцияға 5 нг), соңғы концентрациясы 0,1 мкМ праймерлерді және QX200™ ddPCR™ EvaGreen Supermix (Bio-Rad, #1864033) біріктіру арқылы орындалды. ddPCR реакциялары QX200 AutoDG Droplet Digital PCR System (Bio-Rad) көмегімен орындалды. Экспрессия деңгейлері HPRT1 «үй шаруашылығы» генінің экспрессиясы арқылы нормализацияланды. Нәтижелер Expr ~ Batch + type моделі көмегімен талданды, мұнда type NTC немесе нысаналы ген (SRCAP) болды. Алынған шикі p-мәні тікелей нысанаға алынған 20 ген жиынтығы үшін көптік гипотезаларды тексеруге арналған Бенджамини — Хохберг түзетуін қолдана отырып, басқа KD нысаналары үшін мәндермен бірге (жоғарыдағы RNA-seq) түзетілді. Қараңыз&lt;/p&gt;\n&lt;h4 id=\"prajmer-dizajny\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#prajmer-dizajny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Праймер дизайны&lt;/span&gt;&lt;/a&gt;Праймер дизайны&lt;/h4&gt;\n&lt;p&gt;Праймерлер (15-қосымша кесте) BLAST71 көмегімен ықтимал нысанадан тыс өзара әрекеттесулерді бағалайтын Primer-BLAST84 көмегімен жобаланды. Олиголар Azenta немесе IDT арқылы тапсырыс берілді. Праймерлердің спецификалығы ПЦР өнімдерін Сэнгер секвенирлеу арқылы расталды (Azenta).&lt;/p&gt;\n&lt;h4 id=\"avtomatty-vestern-blotting\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#avtomatty-vestern-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автоматты вестерн-блоттинг&lt;/span&gt;&lt;/a&gt;Автоматты вестерн-блоттинг&lt;/h4&gt;\n&lt;p&gt;CasRx KD кейінгі ақуыз экспрессиясының деңгейлерін талдау үшін LiOn негізіндегі KD құрылымдары («Молекулалық клондау» бөлімін қараңыз) piggyBac-транспозазаны экспрессиялайтын плазмидпен бірге 280-NPC клеткаларына нуклеофекция жасалды (мәліметтер үшін «Нуклеофекция» бөлімін қараңыз). Төрт күн өткен соң, KD құрылымдарын экспрессиялайтын EGFP+ клеткалар FACS (BD FACSymphony™ S6) көмегімен жиналды. Клеткалар тұнбаға түсіріліп, сұйық азотта жылдам мұздатылды. Ақуызды экстракциялау және автоматты вестерн-блоттинг RayBiotech компаниясымен келесі антителолар көмегімен орындалды: Vinculin (R&amp;amp;D systems, MAB6896, клон 728526) 1:25 сұйылтылған, және WAC (Abcam, AB109486) 1:50 сұйылтылған.&lt;/p&gt;\n&lt;h4 id=\"gender-zhiyntykhtary\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#gender-zhiyntykhtary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гендер жиынтықтары&lt;/span&gt;&lt;/a&gt;Гендер жиынтықтары&lt;/h4&gt;\n&lt;ol&gt;\n&lt;li&gt;SFARI гендері: SFARI гендер деректер базасына енгізілген барлық гендер14 (2025 жылғы 3 сәуірдегі шығарылым).&lt;/li&gt;\n&lt;li&gt;Жоғары сенімділіктегі SFARI (HC-SFARI) гендері: 1 балы бар SFARI гендері.&lt;/li&gt;\n&lt;li&gt;Зияткерлік жетіспеушілік (ID) гендері: SysNDD деректер базасынан85 (кірген күні: 23.08.2025) келесі гендер:&lt;br /&gt;\na. ID терминімен байланыстырылған (HP:0001249, HP:0001256, HP:0002342, HP:0010864, HP:0002187);&lt;br /&gt;\nb. «анықталған» (definitive) категориясындағы;&lt;br /&gt;\nc. SFARI гендері болып табылмайтын.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"bajytu-taldaulary\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#bajytu-taldaulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байыту талдаулары&lt;/span&gt;&lt;/a&gt;Байыту талдаулары&lt;/h4&gt;\n&lt;p&gt;Байыту талдаулары бір жақты Фишердің нақты тесттері (fisher.test, base R v4.3.1) көмегімен орындалды, ал p-мәндер бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі арқылы түзетілді (p.adjust, method = “BH”, base R v4.3.1). Бағанды диаграммалар ретінде көрсетілген кезде, негізгі бағандар бір жақты Фишердің нақты тестінен алынған мүмкіндіктер қатынасын (OR) білдіреді; қателік сызықтары OR үшін 95% сенім интервалының төменгі шекарасын көрсетеді (бір жақты тест үшін жоғарғы шекара анықталмаған).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фишердің нақты тесті мен Бенджамини — Хохберг түзетуі бірнеше салыстыру кезінде жалған оң нәтижелерден қорғай отырып, біздің деректерімізде қандай биологиялық функциялар немесе жолдар шамадан тыс ұсынылғанын статистикалық бағалау үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"flyuoroforlardy-nokdaun-zhasau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#flyuoroforlardy-nokdaun-zhasau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Флюорофорларды нокдаун жасау&lt;/span&gt;&lt;/a&gt;Флюорофорларды нокдаун жасау&lt;/h4&gt;\n&lt;p&gt;Флюорофорларды экспрессиялайтын құрылымдар («Молекулалық клондау» бөлімін қараңыз) piggyBac-транспозазаны экспрессиялайтын плазмидпен бірге 280-iPSC жасушаларына нуклеофекция жасалды (мәліметтер үшін «Нуклеофекция» бөлімін қараңыз). iPSC жасушалары өсірілді, содан кейін барлық үш флюорофорды экспрессиялайтын жасушалар Cytek Aurora CS спектрлік жасуша сорғышын пайдалана отырып, FACS арқылы бөлініп алынды. Сұрыпталған iPSC жасушалары әрі қарай өсіріліп, содан кейін NPC-ке индукцияланды («Жасуша культурасы» бөлімін қараңыз). Содан кейін LiOn негізіндегі CasRx KD құрылымдары piggyBac-транспозазаны экспрессиялайтын плазмидпен бірге осы NPC-терге нуклеофекция жасалды. Төрт күн өткен соң, барлық төрт флюорофорды экспрессиялайтын жасушалар (EGFP KD құрылымдарының экспрессиясын көрсете отырып) Cytek Aurora CS спектрлік жасуша сорғышы көмегімен репортерлардың флуоресценция қарқындылығына талданды. Үлгілер мен репортерлар бойынша геометриялық орташа флуоресценция қарқындылығындағы (log2) айтарлықтай айырмашылықтарды тексеру үшін Бонферронидің бірнеше салыстыру тесті бар кәдімгі екі факторлы дисперсиялық талдау (ANOVA) қолданылды.&lt;/p&gt;\n&lt;p&gt;shRNA көмегімен нокдаун жасау&lt;/p&gt;\n&lt;p&gt;Әрбір нысана үшін үш түрлі shRNA бар pSicoR негізіндегі құрылымдар пуүлге біріктіріліп, содан кейін 280-NPC-ке нуклеофекция жасалды (мәліметтер үшін «Нуклеофекция» бөлімін қараңыз, мұнда сипатталған өзгерістермен). Бұл құрылымдар транспозицияға қабілетсіз болғандықтан, piggyBac transposase73 экспрессиялайтын плазмид алынып тасталды, ал оның орнына pSicoR негізіндегі плазмидтің мөлшері жалпы 15 мкг дейін арттырылды. Нуклеофекциядан кейінгі күні құрылымдарды экспрессиялайтын EGFP+ жасушалар FACS (BD FACSymphony™ S6) арқылы бөлініп алынды және түні бойы қалпына келуі үшін қайта егілді. Келесі күні Zymo DNA/RNA Shield көмегімен РНҚ жиналды. 3’ RNA-seq Plasmidsaurus арқылы орындалды (DGE RNA-Seq қызметі).&lt;/p&gt;\n&lt;p&gt;shRNA-KD NPC-терінен алынған bulk RNA-seq деректерінің DEG талдауы&lt;/p&gt;\n&lt;p&gt;Дифференциалды экспрессияны талдау біздің CasRx-KD эксперименттерімізбен бірдей аналитикалық конвейерді қолдана отырып орындалды: дифференциалды экспрессия талдауын жүргізу үшін DESeq2 (v1.42.0) ~targetGene моделімен пайдаланылды, бұл ретте дифференциалды экспрессия NTC shRNA-ларына (экспрессияланбайтын транскрипттер люцифераза мен lacZ-ке бағытталған) қатысты есептелді. Транскриптомдық ауқымдағы талдаулар үшін p-мәндер NTC жасушаларында baseMean &amp;gt; 10 болатын 14 601 ген жиынтығы үшін бірнеше гипотезаны тексеруге арналған Бенджамини — Хохберг түзетуі арқылы түзетілді. Дифференциалды экспрессияланған гендер (DEG) түзетілген p-мәні &amp;lt; 0.05 болатын дифференциалды экспрессияланған гендер ретінде анықталды.&lt;/p&gt;\n&lt;h4 id=\"deneault-et-al-2018-zhumysynan-gen-ekspressiyasy-derekterin-taldau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#deneault-et-al-2018-zhumysynan-gen-ekspressiyasy-derekterin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deneault et al. (2018) жұмысынан ген экспрессиясы деректерін талдау&lt;/span&gt;&lt;/a&gt;Deneault et al. (2018) жұмысынан ген экспрессиясы деректерін талдау&lt;/h4&gt;\n&lt;p&gt;Deneault et al. (2018)20 жұмысынан алынған ген экспрессиясының есептегіштері GEO базасынан жүктелді (GSE107878). Дифференциалды экспрессияны талдау біздің CasRx-KD эксперименттерімізбен бірдей аналитикалық конвейерді пайдалана отырып орындалды: дифференциалды экспрессия талдауын орындау үшін DESeq2 (v1.42.0) expression ~ targeted gene моделімен пайдаланылды. Дифференциалды экспрессияланған гендер (DEG) нейрондар үшін де, индукцияланған плюрипотентті дің жасушалары үшін де бақылау жасушаларына қатысты анықталды. Бақылау үлгілерінде орташа ген экспрессиясы 10-нан жоғары гендер ғана ықтимал DEG ретінде қарастырылды, ал p-мәндер Бенджамини — Хохберг түзетуін қолдана отырып тиісінше түзетілді. DEG түзетілген p-мәні &amp;lt; 0.05 болатын дифференциалды экспрессияланған гендер ретінде анықталды.&lt;/p&gt;\n&lt;h4 id=\"oezara-bajytu-taldauy\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#oezara-bajytu-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өзара байыту талдауы&lt;/span&gt;&lt;/a&gt;Өзара байыту талдауы&lt;/h4&gt;\n&lt;p&gt;Біз мыналардың арасындағы DEG қиылысуын сан жағынан бағаладық: (1) NPC-тегі біздің CasRx-KD эксперименттеріміз, (2) NPC-тегі біздің shRNA-KD эксперименттеріміз, (3) Deneault et al. (2018)20 жұмысынан алынған KO iPSC және (4) Deneault et al. (2018)20 жұмысынан алынған KO ExN. DEG-тердің әрбір жұптық салыстыруы үшін байыту талдаулары қарастырылып отырған үлгі түрлерінің екеуі де экспрессиялаған гендер ғарышымен бір жақты Фишердің нақты тесттерін қолдана отырып орындалды. P-мәндер бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі арқылы түзетілді.&lt;/p&gt;\n&lt;h4 id=\"sfari-genderimen-ekspressiya-korrelyaciyasyn-taldau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#sfari-genderimen-ekspressiya-korrelyaciyasyn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SFARI гендерімен экспрессия корреляциясын талдау&lt;/span&gt;&lt;/a&gt;SFARI гендерімен экспрессия корреляциясын талдау&lt;/h4&gt;\n&lt;p&gt;Қызығушылық тудыратын геннің біздің NPC RNA-seq деректерімізде SFARI гендерімен айтарлықтай бірлесіп экспрессияланғанын анықтау үшін біз қызығушылық тудыратын ген мен әрбір SFARI гені арасындағы медиандық Пирсон корреляциясын есептедік. Бұл корреляция дәрежесінің маңызды екенін бағалау үшін біз NPC-те экспрессияланатын гендер ғарышын пайдалана отырып (NTC-те baseMean &amp;gt; 10), қызығушылық тудыратын ген мен SFARI гендер жиынтығымен бірдей мөлшердегі 1000 кездейсоқ таңдалған гендер жиынтығы арасындағы медиандық корреляцияны есептеу арқылы эмпирикалық нөлдік бөліністі жасадық. Содан кейін бір жақты эмпирикалық p-мәні байқалған медиандық корреляциядан үлкен немесе оған тең нөлдік мәндердің үлесі ретінде есептелді. P-мәндері &amp;lt; 0.05 болатын реттеушілер SFARI гендерімен айтарлықтай корреляцияланған деп саналды.&lt;/p&gt;\n&lt;h4 id=\"turakhty-tuerde-toemendegen-deg-terdi-anykhtau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#turakhty-tuerde-toemendegen-deg-terdi-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тұрақты түрде төмендеген DEG-терді анықтау&lt;/span&gt;&lt;/a&gt;Тұрақты түрде төмендеген DEG-терді анықтау&lt;/h4&gt;\n&lt;p&gt;Тұрақты түрде төмендеген DEG-тер (downregulated DEGs) мыналарды көрсеткен гендер ретінде анықталды: 1) кем дегенде үш нокдаунмен (KD) статистикалық тұрғыдан маңызды төмендеу және 2) барлық KD бойынша маңызды дифференциалды экспрессия бағытындағы кем дегенде 80% келісім.&lt;/p&gt;\n&lt;h4 id=\"shekteu-taldauy\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#shekteu-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеу талдауы&lt;/span&gt;&lt;/a&gt;Шектеу талдауы&lt;/h4&gt;\n&lt;p&gt;Гендік шектеуді бағалау үшін gnomad v286-дан LOEUF ұпайлары (oe_lof_upper) алынды. Әрбір ген үшін біз әрбір генмен байланысты транскрипттердің LOEUF мәндерінің медианын есептеу арқылы әр генге шаққандағы LOEUF ұпайын есептедік. LOEUF үздіксіз метрика болғанымен, жоғары шектелген гендерді анықтау үшін ұсынылғандай, LOEUF &amp;lt; 0.35 қолдандық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LOEUF метрикасы адамдардағы инактивациялайтын мутациялардың орындылығын бағалайды: төменгі мәндер мутацияларға қарсы күшті эволюциялық қысымды (геннің жоғары консервативтілігін) көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ras-khauipterining-kandidattykh-genderine-khosymsha-kholdau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#ras-khauipterining-kandidattykh-genderine-khosymsha-kholdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РАС қауіптерінің кандидаттық гендеріне қосымша қолдау&lt;/span&gt;&lt;/a&gt;РАС қауіптерінің кандидаттық гендеріне қосымша қолдау&lt;/h4&gt;\n&lt;p&gt;Келесі ірі секвенирлеу зерттеулерінің кез келгенінде анықталған РАС қауіптерінің кандидаттық гендері (8-қосымша кесте) 9-қосымша кестеге енгізілді: 1. Trost et al. (2022); 2. Zhou et al. (2022); 3. Wang et al. (2022); 4. Doan et al. (2019); 5. Rodin et al. (2021); 6. Wilfert et al. (2021). Қосымша сілтемелер: 1. Alcantara et al. (2017); 2. Marcelis et al. (2024); 3. Ruiz-Reig et al. (2024); 4. McGhee et al. (2025).&lt;/p&gt;\n&lt;h4 id=\"nukleofekciya\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#nukleofekciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нуклеофекция&lt;/span&gt;&lt;/a&gt;Нуклеофекция&lt;/h4&gt;\n&lt;p&gt;Нуклеофекциялар Neon Transfection System (ThermoFisher Scientific) көмегімен жүргізілді. NPC үшін 2 миллион жасуша 100 мкл ұштықтарды (tips) пайдалана отырып, 10 мкг транспозицияланатын плазмидамен және piggyBac транспозасын экспрессиялайтын 2 мкг плазмидамен нуклеофекция жасалды. iPSC үшін 1 миллион жасуша 100 мкл ұштықтарды пайдалана отырып, 5 мкг транспозицияланатын плазмидамен және piggyBac транспозасын экспрессиялайтын 1 мкг плазмидамен нуклеофекция жасалды. Шағын ауқымды нуклеофекциялар үшін 10 мкл ұштықтар қолданылды, ал жасушалар саны мен плазмида мөлшері пропорционалды түрде азайтылды. NPC нуклеофекциясы келесі параметрлер көмегімен орындалды: кернеу = 1600 В, ені = 10, импульстер = 3. iPSC нуклеофекциясы келесі параметрлер көмегімен орындалды: кернеу = 950 В, ені = 30, импульстер = 2.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нуклеофекция — бұл жасуша ядросына ДНҚ-ны электр импульстері арқылы тікелей жеткізу тәсілі, ол трансфекцияға көнбейтін жасуша түрлерінде жоғары тиімділік көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"npc-proliferaciyasyn-taldau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#npc-proliferaciyasyn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;NPC пролиферациясын талдау&lt;/span&gt;&lt;/a&gt;NPC пролиферациясын талдау&lt;/h4&gt;\n&lt;p&gt;LiOn негізіндегі KD конструкт («Молекулярлық клондау» бөлімін қараңыз) piggyBac транспозасын экспрессиялайтын плазмидамен бірге 280-NPC жасушаларына нуклеофекция арқылы енгізілді (егжей-тегжейлі «Нуклеофекция» бөлімін қараңыз). Төрт күн өткен соң жасушалар ортада 1:500 қатынасында сұйылтылған CYTOTRACK™ Red 628/643 Cell Proliferation Assay Kit (Bio-Rad #1351205) жиынтығының бояуымен 20 минут бойы өңделді. Содан кейін жасушалар PBS (ThermoFisher Scientific #10010031) ерітіндісімен шайылып, пассаждалды, әр үлгінің 1/5 бөлігі кейінгі 4 уақыт нүктесі үшін пайдаланылатын 4 жеке планшеттің бір құдығына егілді. Қалған жасушалар 0-күні (d0) бастапқы CytoTrack қарқындылығын бағалау үшін ағынды цитометрия көмегімен (BD FACSDiva бағдарламалық құралы v8.0.3) талданды. Келесі 4 күн ішінде әр үлгінің 1 құдығы күн сайын диссоциацияланып, ағынды цитометриямен талданды. KD конструктын экспрессиялайтын EGFP+ жасушаларынан алынған CytoTrack қарқындылығы мәндері (теріс log2) құдықтар арасындағы пролиферация жылдамдығының ауытқуын бақылау үшін сол құдықтағы EGFP- жасушаларына қатысты қалыпқа келтірілді. Сонымен қатар олар бояудың сіңірілуіндегі өзгерістерді бақылау үшін d0 кезіндегі бастапқы CytoTrack қарқындылығына қатысты да қалыпқа келтірілді. Әрбір KD нәтижелері NTC үлгілерінің орташа мәніне қатысты көрсетіліп, орташа мән +/- орташа мәннің стандартты қатесі (SEM) түрінде график түрінде салынды. Статистикалық талдау Dunnett көптік салыстыру тестімен бірге (GraphPad Prism) кәдімгі екі факторлы дисперсиялық талдау (ordinary two-way ANOVA) көмегімен орындалды. Үлгілер сандары мен статистикалық нәтижелер туралы толық мәліметтер 10-қосымша кестеде келтірілген.&lt;/p&gt;\n&lt;h4 id=\"flick-rekombinaciyasyn-indukciyalau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#flick-rekombinaciyasyn-indukciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FLICK рекомбинациясын индукциялау&lt;/span&gt;&lt;/a&gt;FLICK рекомбинациясын индукциялау&lt;/h4&gt;\n&lt;p&gt;Cre экспрессиясын индукциялау және FLICK конструктінің рекомбинациясын бастау үшін жасушалар/органоидтар 24 сағат бойы 2 мкг/мл доксициклинмен (Sigma D9891-1G) өңделді.&lt;/p&gt;\n&lt;h4 id=\"flick-kd-tiim
