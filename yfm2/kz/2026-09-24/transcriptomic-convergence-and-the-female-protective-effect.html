diligin-baghalau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#flick-kd-tiimdiligin-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FLICK KD тиімділігін бағалау&lt;/span&gt;&lt;/a&gt;FLICK KD тиімділігін бағалау&lt;/h4&gt;\n&lt;p&gt;FLICK конструктілері арқылы KD тиімділігін анықтау үшін әрбір жағдай бойынша үш бөлек үлгі талданды. Бақылау ретіндегі 280 iPSC жасушалары NTC1 бақылау gRNA массивін немесе ENSG00000261840 геніне бағытталған gRNA массивін кодтайтын конструктілермен, сондай-ақ FLICK конструктілерін геномға біріктіру үшін piggyBac транспозасын экспрессиялайтын плазмидамен нуклеофекция жасалды. KD индукциялау үшін жасушалар 24 сағат бойы 2 мкг/мл доксициклинмен (Sigma D9891-1G) өңделді. FLICK конструктісі рекомбинацияланған жасушалар флуоресценция арқылы сұрыпталған жасушалар ағыны (FACS) (BD FACSymphony™ S6) көмегімен EGFP+ жасушалары ретінде бөлініп алынды, олар үш қайталаумен қайта егіліп, қосымша екі күн бойы өсірілді. Содан кейін Direct-zol RNA Microprep Kit (Zymo Research #R2062) көмегімен РНК бөлініп алынды. КДНК түзу үшін 500 нг РНК SuperScript™ IV VILO™ Master Mix (ThermoFisher Scientific #11756050) көмегімен кері транскрипцияланды. Сандық ПЦР (qPCR) реакциясы КДНК-ны РНК-эквиваленттік 1 нг/мкл концентрацияда (10 мкл реакцияға 10 нг), праймерлерді 0,5 мкМ соңғы концентрацияда және qPCR үшін PowerUp™ SYBR™ Green Master Mix (ThermoFisher Scientific #A25742) қоспасымен біріктіру арқылы орындалды. qPCR реакциялары Master Mix хаттамасында сипатталған «fast cycling mode» шарттарын пайдалана отырып, CFX384 Touch Real-Time PCR Detection System (Bio-Rad #1855484) құрылғысында әр үлгі үшін техникалық үш қайталаумен жүргізілді. KD нысана генінің (ENSG00000261840) экспрессиясы дельта-дельта Ct әдісі көмегімен бағаланды, мұнда экспрессия алдымен әр үлгі үшін үй шаруашылығы гені HPRT1 көрсеткішіне қатысты қалыпқа келтірілді, содан кейін орташа +/- SEM ретінде график түрінде көрсетілген NTC бақылау үлгілерінің орташа мәніне қатысты көрсетілді. Статистикалық маңыздылық екі жақты t-тест (GraphPad Prism) көмегімен бағаланды.&lt;/p&gt;\n&lt;h4 id=\"gistologiyalykh-taldau-ueshin-mi-organoidtaryn-oengdeu\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#gistologiyalykh-taldau-ueshin-mi-organoidtaryn-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гистологиялық талдау үшін ми органоидтарын өңдеу&lt;/span&gt;&lt;/a&gt;Гистологиялық талдау үшін ми органоидтарын өңдеу&lt;/h4&gt;\n&lt;p&gt;Ми органоидтары 16% PFA-дан PBS-те сұйылтылған 4% параформальдегидте (PFA) (Electron Microscopy Sciences # 15710) 4°C температурада түн бойы фиксирленді. Фиксациядан кейін ми органоидтары PBS-пен жуылды, содан кейін 4°C-та кемінде түн бойы 30% сахароза ерітіндісінде (PBS-те м/к) теңгерілді. Үлкен органоидтар үшін толық криопротекцияны қамтамасыз ету мақсатында 30% сахароза ерітіндісі түн бойы инкубациядан кейін кемінде бір рет ауыстырылды.&lt;/p&gt;\n&lt;p&gt;Криосекциялау үшін ми органоидтары құрғақ мұзда Tissue-Tek® O.C.T. Compound (Sakura #4583) ортасында қатырылды. Қалыңдығы 30 мкм кесінділерді алу үшін Leica CM3050 S криостаты пайдаланылды, кесінділер Fisherbrand™ Superfrost™ Plus Microscope Slides (Fisher Scientific #12-550-15) зат шыныларына жиналды және -80°C температурада сақталды. Иммуногистохимиялық талдау үшін блоктайтын буфер 0.3 М глицинді (Sigma G7403-1KG), 1% сиыр сарысуының альбуминін (Sigma A4503-50G), 0.3% Triton X-100 (Sigma T8787-50ML), 10% қалыпты ешкі сарысуын (Fisher Scientific # NC9660079) және PBS біріктіру арқылы дайындалды.&lt;/p&gt;\n&lt;p&gt;Зат шынылары O.C.T.-ны кетіру үшін PBS-те жуылды, содан кейін бөлме температурасында (RT) 1 сағат бойы блоктайтын буферде инкубацияланды. Блоктайтын буфер алынып тасталды және оның орнына қызығушылық тудыратын бастапқы антиденелері бар таза блоктайтын буфер (төменді қараңыз) қосылды, содан кейін зат шынылары ылғалды камера ыдысында (Avantor # 76278-848) 4°C-та түн бойы инкубацияланды. Содан кейін шынылар PBS-пен үш рет әрқайсысы бес минуттан жуылды.&lt;/p&gt;\n&lt;p&gt;Қосымша антиденелер (төменді қараңыз) және ядро бояғышы DAPI (ThermoFisher Scientific #62248) блоктайтын буферде сәйкесінше 1:500 және 1:1000 қатынасында сұйылтылып, бөлме температурасында 30 минут бойы шыныларға қосылды, осы сәттен бастап шынылар жарықтан қорғалды. Содан кейін шынылар PBS-те үш рет әрқайсысы бес минуттан жуылды. Жабын шынылар (Epredia #152455) бөлме температурасында кемінде түн бойы кептірілген Fluoromount-G® (Fisher Scientific #OB100-01) көмегімен орнатылды. Кептірілгеннен кейін шынылар 4°C температурада сақталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Иммуногистохимия үш өлшемді тіндердегі ақуыздардың орналасуын флуоресцентті антиденелер көмегімен визуализациялауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"immunogistohimiya-zhaene-immunocitohimiyagha-arnalghan-antideneler\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#immunogistohimiya-zhaene-immunocitohimiyagha-arnalghan-antideneler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуногистохимия және иммуноцитохимияға арналған антиденелер&lt;/span&gt;&lt;/a&gt;Иммуногистохимия және иммуноцитохимияға арналған антиденелер&lt;/h4&gt;\n&lt;p&gt;• PAX6 (BD Pharmingen 561462, клон O18-1330): 1:300 сұйылтылған • Nestin (Millipore Sigma HPA026111-25UL): 1:500 сұйылтылған • TBR2 (Millipore Sigma HPA028896-100UL): 1:300 сұйылтылған • CTIP2 (Abcam ab18465, клон 25B6): 1:300 сұйылтылған • EGFP (Aves GFP-1010): 1:1000 сұйылтылған • Ешкінің тауық IgY-ге қарсы антиденелері, Alexa Fluor 488 (ThermoFisher A-11039): 1:500 сұйылтылған • Ешкінің қоян IgG-ге қарсы антиденелері, Alexa Fluor 488 (ThermoFisher A-11008): 1:500 сұйылтылған • Ешкінің егеуқұйрық IgG-ге қарсы антиденелері, Alexa Fluor 488 (ThermoFisher A-11006): 1:500 сұйылтылған • Ешкінің тышқан IgG-ге қарсы антиденелері, Alexa Fluor 555 (ThermoFisher A-21424): 1:500 сұйылтылған • Ешкінің егеуқұйрық IgG-ге қарсы антиденелері, Alexa Fluor 647 (ThermoFisher A-21247): 1:500 сұйылтылған • Ешкінің қоян IgG-ге қарсы антиденелері, Alexa Fluor 647 (ThermoFisher A-21245): 1:500 сұйылтылған • Ешкінің қоян IgG-ге қарсы антиденелері, Alexa Fluor 750 (ThermoFisher A-21039): 1:500 сұйылтылған&lt;/p&gt;\n&lt;h4 id=\"konfokaldy-vizualizaciya-zhaene-oengdeu\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#konfokaldy-vizualizaciya-zhaene-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конфокальды визуализация және өңдеу&lt;/span&gt;&lt;/a&gt;Конфокальды визуализация және өңдеу&lt;/h4&gt;\n&lt;p&gt;Ми органоидтарының кесінділері Zeiss LSM 980 конфокальды микроскопының көмегімен суретке түсірілді. Стандартты кескінді өңдеу Adobe Photoshop көмегімен орындалды.&lt;/p&gt;\n&lt;h4 id=\"mi-organoidtarynyng-scrna-seq\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#mi-organoidtarynyng-scrna-seq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ми органоидтарының scRNA-seq&lt;/span&gt;&lt;/a&gt;Ми органоидтарының scRNA-seq&lt;/h4&gt;\n&lt;p&gt;scRNA-seq үшін жасушалар мыналардан жиналды: • ай: 10 органоид, бірге біріктіріліп, бір партия ретінде жиналды • айлар: екі партияға жиналған 14 органоид, мұнда 7 органоид 60-күні бірге және қосымша 7 органоид 61-күні бірге жиналды • өткір нокаут (KD): 8 органоид, бірге біріктіріліп, бір партия ретінде жиналды. Жасушаларды жинау үшін мозаикалық ми органоидтары қайшы көмегімен кесінділерге кесіліп, қоқыстарды кетіру үшін PBS-пен екі рет жуылды, содан кейін ми тініне сипатталған ферменттік қоспаларды қолдана отырып, Neural Tissue Dissociation Kit – Postnatal Neurons (Miltenyi Biotec # 130-094-802) көмегімен диссоциацияланды.&lt;/p&gt;\n&lt;p&gt;Жұмсақ диссоциация кең тесікті ұштары бар пипеткалардан (Rainin # 30389218) бастап стандартты ұштарға дейін кішірейетін диаметрі бар пипеткалармен пипеткалау арқылы жүзеге асырылды. Рекомбинацияланған FLICK конструкциялары бар жасушалар EGFP+ жасушалары үшін FACS (BD FACSymphony™ S6) арқылы бөлініп алынды. Бүкіл транскриптомалық scRNA-seq кітапханалары 10X Genomics компаниясының Chromium Next GEM Single Cell 3ʹ Reagent Kits v3.1 (Dual Index) жиынтықтары көмегімен CG000316 Rev A пайдаланушы нұсқаулығына сәйкес дайындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq (бір жасушалы РНК секвенирлеуі) әрбір жеке жасушадағы мыңдаған гендердің экспрессиясын өлшейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"flick-shtrih-kodty-sekvenirleu-kitaphanalaryn-khuru\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#flick-shtrih-kodty-sekvenirleu-kitaphanalaryn-khuru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FLICK штрих-кодты секвенирлеу кітапханаларын құру&lt;/span&gt;&lt;/a&gt;FLICK штрих-кодты секвенирлеу кітапханаларын құру&lt;/h4&gt;\n&lt;p&gt;Толық протоколдарды protocols.io сайтынан қараңыз: https://dx.doi.org/10.17504/protocols.io.5qpvoj5pzg4o/v1. Қысқаша: мозаикалық органоидтарды генерациялау үшін пайдаланылған бастапқы iPSC жиынтығынан FLICK конструкцияларын мөлшерлік бағалау үшін (d0) Direct-zol RNA Microprep Kit (Zymo Research #R2062) көмегімен 42 мың жасушадан тұратын үш қайталанатын үлгіден РНК экстракцияланды.&lt;/p&gt;\n&lt;p&gt;кДНК генерациялау үшін 50–250 нг РНК UMI қамтитын oligo(ts)VN праймерімен бірге SuperScript™ IV First-Strand Synthesis System (Invitrogen 18091050) көмегімен кері транскрипцияланды. Содан кейін секвенирлеу кітапханалары Q5® Hot Start High-Fidelity 2X Master Mix (NEB #M0494L) және пайдаланушы праймерлері көмегімен жасалды. scRNA-seq кітапханаларынан FLICK штрих-код кітапханаларын жасау үшін 5 мкл амплификацияланған және тазартылған кДНК (10X User Guide CG000316 Rev A нұсқауларын 2-қадамның соңына дейін орындау арқылы өндірілген) пайдаланылды.&lt;/p&gt;\n&lt;p&gt;Штрих-коды бар кДНК Q5® Hot Start High-Fidelity 2X Master Mix (NEB #M0494L) және пайдаланушы праймерлері көмегімен секвенирлеу үшін амплификацияланды. Кітапханалар SPRIselect DNA Size Selection Reagent (Beckman Coulter # B23317) көмегімен тазартылды және TapeStation High Sensitivity D1000 реагенттері (Agilent #5067-5603 және #5067-5584) көмегімен бағаланды.&lt;/p&gt;\n&lt;h4 id=\"organoidterding-scrna-seq-derekterin-saejkestendiru-zhaene-sandykh-baghalau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#organoidterding-scrna-seq-derekterin-saejkestendiru-zhaene-sandykh-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоидтердің scRNA-seq деректерін сәйкестендіру және сандық бағалау&lt;/span&gt;&lt;/a&gt;Органоидтердің scRNA-seq деректерін сәйкестендіру және сандық бағалау&lt;/h4&gt;\n&lt;p&gt;scRNA-seq деректері CRISPR-CasRx нысанаға алған ішінара деградацияға ұшыраған транскрипттерді сандық бағалаудан аулақ болу үшін ген экспрессиясын есептеуге интрондарды қоспай (--include-introns=false) feature-barcode режимінде cellranger-count көмегімен алдын ала құрылған CellRanger (v.9.0.0) hg38 референсімен сәйкестендірілді. CRISPR гидтерін секвенирлеу кітапханасының FASTQ файлдары бір айлық үлгілер үшін CRISPR кітапханасының секвенирлеу тереңдігіне сәйкестендіру және cellranger-CRISPR гидтерін сандық бағалау конвейері арқылы гидті тағайындау үшін фонды азайту мақсатында seqtk (v1.4) көмегімен 2 айлық үлгілер үшін оқылымдардың 1.25%-ына дейін төмендетілді. Барлық басқа әдепкі параметрлер пайдаланылды. CellRanger гид тағайындаулары дәл бір тағайындалған гиді бар жасушаларды ғана сүзу үшін пайдаланылды.&lt;/p&gt;\n&lt;h4 id=\"organoidterding-scrna-seq-derekterin-aldyn-ala-oengdeu-zhaene-sapany-bakhylau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#organoidterding-scrna-seq-derekterin-aldyn-ala-oengdeu-zhaene-sapany-bakhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоидтердің scRNA-seq деректерін алдын ала өңдеу және сапаны бақылау&lt;/span&gt;&lt;/a&gt;Органоидтердің scRNA-seq деректерін алдын ала өңдеу және сапаны бақылау&lt;/h4&gt;\n&lt;p&gt;Ұзақ мерзімді және жедел KD үлгілері бөлек, бірақ бірдей түрде өңделді. CellBender (v0.3.2) ортадағы РНК ластануын анықтау және сүзу үшін пайдаланылды, ал scrublet (v0.2.3) автоматты түрде дуплеттерді анықтау және сүзу үшін қолданылды. Барлық басқа төменгі ағынды талдау Seurat (v5.0.0) көмегімен орындалды. Жоғары сапалы жасушалар келесі сапаны бақылау метрикаларына сәйкес сақталды: 1) митохондриялық (percent.mt) ген экспрессиясының пайызы &amp;lt; 20% және 2) 500 &amp;lt; экспрессияланған гендер саны (nFeature_RNA) &amp;lt; 6000.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Бір жасушалы РНК секвенирлеу деректерінің сапасын бақылау митохондриялық транскрипттер деңгейі бойынша зақымдалған жасушаларды іріктеп алып тастауды және нәтижелердің бұрмалануын болдырмау үшін қосарланған жасушаларды (дуплеттерді) жоюды қамтиды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"organoidterding-scrna-seq-derekterin-zhasusha-tuerin-annotaciyalau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#organoidterding-scrna-seq-derekterin-zhasusha-tuerin-annotaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоидтердің scRNA-seq деректерін жасуша түрін аннотациялау&lt;/span&gt;&lt;/a&gt;Органоидтердің scRNA-seq деректерін жасуша түрін аннотациялау&lt;/h4&gt;\n&lt;p&gt;Жасуша түрін аннотациялау алдымен тек нысанаға алынбаған бақылау (NTC) жасушаларында орындалды. NTC жасушалары тек бақылаудан тұратын Seurat объектісін жасау үшін бөлініп алынды. Бұл объект кейіннен қалыпқа келтірілді (NormalizeData), айнымалы белгілер анықталды (FindVariableFeatures), масштабталды (ScaleData; percent.mt, percent_ribo, nCount_RNA және nFeature_RNA регрессияланған ковариаталары) және өлшемділігі төмендетілді (RunPCA және RunUMAP). Интеграция organoid партиялары бойынша harmony (v1.2.0) көмегімен орындалды және бұл интеграцияланған объект бақыланбайтын кластерлеу үшін пайдаланылды (FindNeighbors және FindClusters, ажыратымдылық = 0.6 және 1.2). Шағын мөлшердегі бақыланбайтын кластерлер (&amp;lt;1000 жасуша) кластер деңгейіндегі төмен сапаны бақылау метрикалары (яғни, тым жоғары немесе төмен nCount_RNA, жоғары percent.mt) салдарынан сүзілді. Осы тек бақылаудан тұратын Seurat объектісінің барлық кейінгі 2 өлшемді визуализациясы интеграцияланған деректердің UMAP көрінісі көмегімен орындалды. Жасуша түрін аннотациялау канондік ми маркерлік гендері көмегімен орындалды. Содан кейін жоғарыда сипатталғандай бірдей өңдеу конвейеріне (мысалы, қалыпқа келтіру, масштабтау, өлшемділікті төмендету және интеграция) сәйкес барлық жасушалар үшін Seurat объектісі құрылды. Жасуша түрін аннотациялауды орындау үшін белгілерді тасымалдау тек бақылаудан тұратын Seurat объектісінен (TransferData) толық Seurat объектіе орындалды. Канондік ми маркерлік гендерінің экспрессия өрнектері кейіннен осы жасуша түрінің аннотацияларын нақтылау және аяқтау үшін пайдаланылды.&lt;/p&gt;\n&lt;h4 id=\"cerebraldy-organoidterdegi-aerbir-kd-ueshin-salystyrmaly-molshylykhty-taldau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#cerebraldy-organoidterdegi-aerbir-kd-ueshin-salystyrmaly-molshylykhty-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Церебральды органоидтердегі әрбір KD үшін салыстырмалы молшылықты талдау&lt;/span&gt;&lt;/a&gt;Церебральды органоидтердегі әрбір KD үшін салыстырмалы молшылықты талдау&lt;/h4&gt;\n&lt;p&gt;Әрбір KD нысанасы үшін жасушалардың салыстырмалы молшылығы әрбір уақыт нүктесі үшін (d0, d30, d60 немесе d61) анықталды. d0 үшін салыстырмалы молшылық арнайы конвейер арқылы (қ. «Кодтың қолжетімділігі») bulk RNA-seq кітапханаларынан (қ. «FLICK штрих-кодты секвенирлеу кітапханаларын құру») анықталды. d30, d60 және d61 үшін салыстырмалы молшылық CellRanger генерациялаған CRISPR гид тағайындаулары көмегімен scRNA-seq арқылы анықталды (қ. «Органоидтердің scRNA-seq деректерін сәйкестендіру және сандық бағалау»). Әрбір үлгі үшін нәтижелер d0-дегі бастапқы пропорцияға қалыпқа келтірілді және сол уақыт нүктесіндегі NTC-лерге қатысты көрсетілді. Нәтижелер орташа +/- стандартты қателік (SEM) ретінде салынды. Статистикалық талдау барлық ұзақ мерзімді үлгілерді (d30, d60 және d61) ескере отырып, Даннеттің көптік салыстыру тестімен (GraphPad Prism) қайталанатын өлшемдері бар бір факторлы дисперсиялық талдау (repeated measures one-way ANOVA) көмегімен жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"cerebraldy-organoidterdegi-salystyrmaly-zhasusha-tueri-proporciyalaryn-taldau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#cerebraldy-organoidterdegi-salystyrmaly-zhasusha-tueri-proporciyalaryn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Церебральды органоидтердегі салыстырмалы жасуша түрі пропорцияларын талдау&lt;/span&gt;&lt;/a&gt;Церебральды органоидтердегі салыстырмалы жасуша түрі пропорцияларын талдау&lt;/h4&gt;\n&lt;p&gt;Салыстырмалы ExN/RG пропорциясы d30, d60 және d61-де әрбір KD нысанасы үшін анықталды. Нәтижелер сол уақыт нүктесіндегі NTC үлгісіне қалыпқа келтірілді. Статистикалық талдау барлық ұзақ мерзімді үлгілерді (d30, d60 және d61) ескере отырып, Даннеттің көптік салыстыру тестімен (GraphPad Prism) кәдімгі бір факторлы дисперсиялық талдау (ordinary one-way ANOVA) көмегімен жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"cerebraldy-organoidting-scrna-seq-derekterining-differencialdy-ekspressiyasyn-taldau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#cerebraldy-organoidting-scrna-seq-derekterining-differencialdy-ekspressiyasyn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Церебральды органоидтің scRNA-seq деректерінің дифференциалды экспрессиясын талдау&lt;/span&gt;&lt;/a&gt;Церебральды органоидтің scRNA-seq деректерінің дифференциалды экспрессиясын талдау&lt;/h4&gt;\n&lt;p&gt;Дифференциалды экспрессияны талдау негізгі жасуша түрлері (радиальды глия, аралық ілгерілеуші жасушалар, қоздырғыш нейрондар немесе тежеуші нейрондар) бойынша жіктелген, әрбір гид бойынша өзгертілген жасушалар мен NTC алған жасушалар арасында жүргізілді. Seurat FindMarkers logfc.threshold = 0, min.pct = 0.10, min.cells.group = 3 және қалған барлық әдепкі параметрлерімен дифференциалды экспрессияны орындау үшін пайдаланылды. Дифференциалды экспрессияланған гендердің (DEG) байыту талдаулары бір жақты Фишердің дәл тесттері көмегімен орындалды, ал p-мәндері бірнеше гипотезаларды сынау үшін Бенджамини-Хохберг түзетуі көмегімен түзетілді. Жиынқы қызығушылық тудыратын екі салыстыруда да экспрессияланған барлық гендер ретінде анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Дифференциалды экспрессияны талдау бақылаумен салыстырғанда белгілі бір нысана нокдаун жасалғанда белсенділігі статистикалық тұрғыдан айтарлықтай өзгеретін гендерді анықтауға көмектеседі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"organoid-zhasusha-tuerleri-arasyndaghy-ortakh-deg-terdi-vizualizaciyalau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#organoid-zhasusha-tuerleri-arasyndaghy-ortakh-deg-terdi-vizualizaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Органоид жасуша түрлері арасындағы ортақ DEG-терді визуализациялау&lt;/span&gt;&lt;/a&gt;Органоид жасуша түрлері арасындағы ортақ DEG-терді визуализациялау&lt;/h4&gt;\n&lt;p&gt;Ортақ DEG-тер органоид жасуша түрлері арасында R пакеті igraph (v2.1.4) көмегімен визуализацияланды (3c-сур.). Түйіндердің түпкілікті орналасуын анықтау үшін Фрухтерман-Рейнгольд орналасу алгоритмі (layout_with_fr) пайдаланылды.&lt;/p&gt;\n&lt;h4 id=\"magic-taldaulary\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#magic-taldaulary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MAGIC талдаулары&lt;/span&gt;&lt;/a&gt;MAGIC талдаулары&lt;/h4&gt;\n&lt;p&gt;MAGIC95 (v1.1) жеке өзгерістердегі DEG-терде нысаналары байытылған транскрипция факторлары мен кофакторларды анықтау үшін пайдаланылды. «Ген денесі (промотордан соңғы экзонның соңына дейін) плюс ген денесінің екі жағындағы 1 т.п.н. фланкирлеуші тізбек» стратегиясы пайдаланылды. NPC талдаулары үшін жиынқы NTC үлгілерінде baseMean &amp;gt; 10 болатын барлық гендер ретінде белгіленді. Органоид талдаулары үшін жиынқы осы жасуша түріндегі жасушалардың кем дегенде 10%-ында экспрессияланған барлық гендер ретінде белгіленді (Seurat min.pct = 0.10; log2 fold-change шегі жоқ), өйткені бұлар дифференциалды экспрессия үшін бағаланған гендер болды.&lt;/p&gt;\n&lt;h4 id=\"aejel-zhynysyna-khatysty-basym-ekspressiyalanatyn-genderdi-anykhtau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#aejel-zhynysyna-khatysty-basym-ekspressiyalanatyn-genderdi-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әйел жынысына қатысты басым экспрессияланатын гендерді анықтау&lt;/span&gt;&lt;/a&gt;Әйел жынысына қатысты басым экспрессияланатын гендерді анықтау&lt;/h4&gt;\n&lt;p&gt;Нейротиптік мида әйел жынысына қатысты басым экспрессияны көрсететін гендерді анықтау үшін біз келесі жұмыстардағы дифференциалды экспрессияланатын гендердің (DEG) жиынтықтарын біріктірдік: (1) Kissel et al. (2024) жұмысындағы S4 кестесі: UCLA когортасында, BrainVar когортасында немесе мета-талдау арқылы әйел жынысына қатысты айтарлықтай басым ретінде анықталған. (2) Oliva et al. (2020) (https://storage.cloud.google.com/adult-gtex/bulk-qtl/v8/sbeqtl/GTEx_Analysis_v8_sbgenes.tar.gz): BRNCTXA немесе BRNCTXB ішінде әйел жынысына қатысты айтарлықтай басым ретінде анықталған. (3) Naqvi et al. (2019) жұмысындағы S4 кестесі: бағаланған барлық түрлердің (адам, тышқандар, егеуқұйрықтар, иттер және макакалар) миында әйел жынысына қатысты айтарлықтай басым ретінде анықталған. (4) DeCasien et al. (2026) жұмысындағы S13 кестесі: барлық жерде әйел жынысына қатысты басым деп анықталған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мета-талдау жыныстық айырмашылықтары бар гендерді сенімдірек табу үшін әртүрлі тәуелсіз зерттеулердің нәтижелерін біріктіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"autizmi-bar-er-adamdardyng-yadroishilik-rnk-sekvenirleu-snrna-seq-derekterin-taldau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#autizmi-bar-er-adamdardyng-yadroishilik-rnk-sekvenirleu-snrna-seq-derekterin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аутизмі бар ер адамдардың ядроішілік РНК секвенирлеу (snRNA-seq) деректерін талдау&lt;/span&gt;&lt;/a&gt;Аутизмі бар ер адамдардың ядроішілік РНК секвенирлеу (snRNA-seq) деректерін талдау&lt;/h4&gt;\n&lt;p&gt;Адамның маңдай қыртысының өңделген snRNA-seq деректері Dias et al. (2024) жұмысынан алынды. Жеке үлгілердің жынысы XIST және Y-байланысқан гендердің экспрессиясы негізінде тексерілді. Аутизмнің ер адамдарда жиі кездесетіні белгілі болғандықтан, бұл когортаға тек аз ғана әйел үлгілері (бір әйел бақылау үлгісі, идиопатиялық аутизмі бар әйелден бір үлгі және 15q-дупликациясымен байланысты аутизмі бар әйелден бір үлгі) енгізілді. Осылайша, біз барлық кейінгі талдауды осы когортаға кірген 17 ер үлгіге шоғырландырдық. Дифференциалды экспрессияны талдау әр жасуша түрі үшін Seurat бағдарламасының FindMarkers функциясын қолдана отырып, төмендегілер арасында жүргізілді: (a) ер бақылау үлгілері және тек идиопатиялық аутизмі бар ер адамдардың үлгілері; (b) ер бақылау үлгілері және тек 15q-дупликациясымен байланысты аутизмі бар ер адамдардың үлгілері; және (c) ер бақылау үлгілері және идиопатиялық немесе 15q-дупликациясымен байланысты аутизмі бар ер адамдардың барлық үлгілері. Донор әсерін бақылау үшін FindMarkers функциясы MAST106 көмегімен іске қосылды. Маңызды гендер ретінде абсолютті логарифмдік еселік өзгерісі (log-2 fold-change) &amp;gt; 0.1 және транскриптом бойынша түзетілген p-мәні &amp;lt; 0.05 болатын гендер анықталды.&lt;/p&gt;\n&lt;h4 id=\"zfx-zhynystykh-differencialdy-ekspressiyasynyng-grafikteri\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#zfx-zhynystykh-differencialdy-ekspressiyasynyng-grafikteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ZFX жыныстық-дифференциалды экспрессиясының графиктерi&lt;/span&gt;&lt;/a&gt;ZFX жыныстық-дифференциалды экспрессиясының графиктерi&lt;/h4&gt;\n&lt;p&gt;Келесі көздерден алынған деректер пайдаланылды: (1) Benoit-Pilven et al. (2025) (2) Kissel et al. (2024) (3) Fass et al. (2024) (4) DeCasien et al. (2026).&lt;/p&gt;\n&lt;h4 id=\"rhie-et-al-2018-zhaene-san-roman-et-al-2024-zhumystarynan-zfx-nysandaryn-khajta-taldau\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#rhie-et-al-2018-zhaene-san-roman-et-al-2024-zhumystarynan-zfx-nysandaryn-khajta-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rhie et al. (2018) және San Roman et al. (2024) жұмыстарынан ZFX нысандарын қайта талдау&lt;/span&gt;&lt;/a&gt;Rhie et al. (2018) және San Roman et al. (2024) жұмыстарынан ZFX нысандарын қайта талдау&lt;/h4&gt;\n&lt;p&gt;ZFX ChIP-seq нысандары Rhie et al. (2018) жұмысының S3E кестесінен алынды. Сондай-ақ ZFX нысандары San Roman et al. (2024) жұмысының S10 кестесінен алынды, онда бұрын ZFX ChIP-seq деректерінің (ENCODE) және Rhie et al. (2018) жұмысындағы ZFX KD RNA-seq деректерінің интегративті талдауы жүргізілген болатын. Байыту бір жақты Фишердің нақты тесті арқылы талданды, ал p-мәндері гипотезаларды көптеп тексеру үшін Бенджамини — Хохберг түзетуі көмегімен түзетілді. Rhie et al. (2018) жұмысынан алынған ортақ ZFX нысандарын талдау үшін жалпы жиынтық ChIP-seq үшін пайдаланылған және RNA-seq деректері де қолжетімді болған екі жасуша желісінде (C4-2B және MCF-7) экспрессияланатын гендер ретінде анықталды. San Roman et al. (2024) жұмысынан ZFX нысандарын талдау үшін жалпы жиынтық Rhie et al. (2018) жұмысындағы сәйкес жасуша түрінде экспрессияланатын гендер ретінде анықталды. Нәтижелер бағандық диаграмма түрінде көрсетілді, мұнда негізгі бағандар бір жақты Фишердің нақты тестінен алынған мүмкіндіктер қатынасын (OR), ал қателік сызықтары OR үшін 95% сенім интервалының төменгі шекарасын көрсетеді (бір жақты тест үшін жоғарғы шекара анықталмаған).&lt;/p&gt;\n&lt;h4 id=\"baghdarlamalykh-zhasakhtamanyng-zhiyntyghy\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#baghdarlamalykh-zhasakhtamanyng-zhiyntyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағдарламалық жасақтаманың жиынтығы&lt;/span&gt;&lt;/a&gt;Бағдарламалық жасақтаманың жиынтығы&lt;/h4&gt;\n&lt;p&gt;Бұл қолжазбада пайдаланылған бағдарламалық жасақтамаға R (v4.3.1) және R пакеттері DESeq2 (v1.42.0), Seurat (v5.0.0), igraph (v2.1.4), scrublet (v0.2.3), harmony (v1.2.0), Orthology.eg.db (v3.20.0), org.Mm.eg.db (v3.20.0), org.Hs.eg.db (v3.20.0), VIPER (v1.36.0) және fgsea (v1.32.4), сондай-ақ CellRanger (v9.0.0), CellBender (v0.3.2), MAGIC (v1.1), salmon (v1.9), seqtk (v1.4) және BD FACSDiva v8.0.3 бағдарламалық жасақтамасы кірді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f1.jpg\" alt=\"1-сурет./ Аутизм гендерінің сарқылуы кең таралған транскриптомдық конвергенцияны көрсетеді. a, Экспериментальды дизайн с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет./ Аутизм гендерінің сарқылуы кең таралған транскриптомдық конвергенцияны көрсетеді. a, Экспериментальды дизайн схемасы. iPSC: индуцияланған плюрипотентті діңгекті жасушалар. b, Осыған ұқсас нәтижелері бар үш тәуелсіз талдауды көрсететін iPSC-тен алынган жүйке жасушаларының предшественниктері (NPC) культураларының иммуноцитохимиясы. c, Мақсатты геннің өзін қоспағанда, әрбір нокдаун (KD) шартының дифференциалды экспрессияланған гендерінің (DEG) ішінде SFARI гендерінің немесе тек ақыл-ой кемістігі (ID-only) гендерінің байытылуын көрсететін бағанды диаграмма. Бағандар бір жақты Фишердің дәл тесті бойынша ықтималдықтар қатынасын (OR) көрсетеді; қателік сызықтары OR үшін 95% сенім интервалының төменгі шекарасын көрсетеді (бір жақты тест үшін жоғарғы шекара анықталмаған). p-мәндері бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуін қолдана отырып түзетілді. d, Әртүрлі KD шарттары арасында ортақ жоғары сенімді SFARI DEG бейнелейтін циррос диаграммасы (сондай-ақ Кеңейтілген деректердің 3a-суретін қараңыз). e, Кем дегенде 10 KD шартында DEG болып табылатын жоғары сенімді SFARI гендерінің салыстырмалы экспрессиясын көрсететін жылу картасы (сондай-ақ Кеңейтілген деректердің 3b-c суреттерін қараңыз). Статистикалық тұрғыдан маңызды DEG'лар бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі бар DESeq2 (Вальд тесті) көмегімен анықталды және жұлдызшамен (&lt;/em&gt;) белгіленді. 1-суреттегі үздік аутизм қаупі бар гендер қою қаріппен жазылған. f, Уақыт өте келе CytoTrack бояуының салыстырмалы қарқындылығы (-log2). Уақыт бойынша тұрақты статистикалық маңызды әсерлерді көрсеткен тек KD шарттары көрсетілген. График орташа мән +/- орташаның стандартты қателігін (SEM) көрсетеді. Статистикалық маңыздылық Даннеттің көптік салыстыру тесті бар стандартты екі жақты ANOVA көмегімен анықталды. Әрбір уақыт нүктесі үшін әр шарт бойынша кемінде үш биологиялық тәуелсіз үлгі талданды. Толық статистикалық нәтижелер үшін 10-қосымша кестені қараңыз.*&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f2.jpg\" alt=\"2-сурет./ Аутизм гендерінің бұзылуы ми органоидтарының дамуын өзгертеді. a, Доксициклинмен индуцияланатын CasRx KD үшін \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет./ Аутизм гендерінің бұзылуы ми органоидтарының дамуын өзгертеді. a, Доксициклинмен индуцияланатын CasRx KD үшін FLICK құрылымдарының дизайны. FLICK құрылымдары сонымен қатар gRNA экспрессиялайды (көрсетілмеген). b, Осыған ұқсас нәтижелері бар үш тәуелсіз талдауды көрсететін 2 айлық дамудан кейінгі FLICK органоидты. Келесі маркерлердің экспрессиясын визуализациялау үшін иммуногистохимия жүргізілді: EGFP = FLICK құрылымы; DAPI = ядролар, PAX6 = NPC; TBR2 = аралық предшественник жасушалар; CTIP2 = қоздырғыш нейрондар. c, scRNA-seq көмегімен жасуша түрлерін анықтау үшін қолданылатын канондық ми маркері гендерінің экспрессиясы. d, Бір ай және екі айда жиналған ұзақ мерзімді органоидты scRNA-seq біріктірілген деректерінің UMAP'і. e, Бір немесе екі айдағы мозаикалық органоидтардан әрбір KD нысаны үшін жасушалардың салыстырмалы мөлшері. Нәтижелер 0 күні әрбір үлгі үшін бастапқы пропорцияға нормаланған және сол уақыт нүктесіндегі NTC-терге қатысты көрсетілген. График орташа +/- SEM көрсетеді. FLICK құрылымдары d14-d15 күндерінде доксициклинмен өңдеу арқылы индуцияланған болатын. Статистикалық маңыздылық қайталанатын өлшемдер бір жақты ANOVA және Даннеттің көптік салыстыру тесті көмегімен бағаланды. n = әр шарт үшін үш биологиялық тәуелсіз үлгі. f, Бір айлық органоидтарда әрбір KD нысаны бойынша жасуша түрінің құрамы. Нүктелі сызықтар негізгі жасуша түрлерінің (радиальды глия, аралық предшественниктер және нейрондар) NTC пропорцияларын көрсетеді. ExN/RG пропорциясы NTC-тен айтарлықтай ерекшеленетін үлгілер * белгісімен көрсетілген (түзетілген p &amp;lt; 0.05). Статистикалық талдау бір айлық (мұнда көрсетілген) және екі айлық (Кеңейтілген деректердің 7f-суретін қараңыз) барлық ұзақ мерзімді үлгілерді ескере отырып, Даннеттің көптік салыстыру тесті бар стандартты бір жақты ANOVA көмегімен жүргізілді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f3.jpg\" alt=\"3-сурет./ Ми органоидтарындағы аутизм гендерінің өзгерістері кезіндегі транскриптомдық конвергенция. a, Ұзақ мерзімді ор\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет./ Ми органоидтарындағы аутизм гендерінің өзгерістері кезіндегі транскриптомдық конвергенция. a, Ұзақ мерзімді органоидтардағы радиальды глия және қоздырғыш нейрондар үшін DEG өзара байытылуының жылу картасы. b, Айтарлықтай өзара байытылуды (транскриптомдық конвергенция) көрсететін жұптық DEG жиынтықтарының пропорцияларын көрсететін дөңгелек диаграммалар. Әрбір дөңгелек диаграмманың үстінде көрсетілген санға дейін әр шарт үшін жасушалар санын азайту байқалатын транскриптомдық конвергенцияны азайтады. c, Әртүрлі KD шарттары мен жасуша түрлері арасында ортақ DEG желілік визуализациясы. Қырлардың қалыңдығы ортақ DEG санын білдіреді. Түйіндер Фрухтерман — Рейнгольд алгоритмі (igraph) арқылы кластерлеу негізінде салынған. Бір-біріне жақынырақ орналасқан түйіндер орта есеппен көбірек ортақ DEG-ге ие. d, Өткір KD бар мозаикалық органоидтардың scRNA-seq деректерінен әрбір KD нысаны бар жасушалардың үлесі. e, scRNA-seq деректерінен өткір KD мозаикалық органоидтарының UMAP'і. f, Өткір KD органоидтарындағы әртүрлі KD үлгілері арасындағы өзара байыту жылу картасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-f4.jpg\" alt=\"4-сурет./ Гендік-реттеуші желіні талдау CHD8 генін аутизмдегі конвергенцияның негізгі драйвері ретінде анықтайды. a, KMT\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет./ Гендік-реттеуші желіні талдау CHD8 генін аутизмдегі конвергенцияның негізгі драйвері ретінде анықтайды. a, KMT2E KD кезіндегі дифференциалды экспрессияны көрсететін жанартау диаграммасы. GRN талдауы бойынша KMT2E оң реттейді деп болжанған гендер бөліп көрсетілген, мұнда статистикалық тұрғыдан айтарлықтай төмендеген DEG'лар көк түспен, өскен DEG'лар қызыл түспен (жоқ) және айтарлықтай өзгеріссіз нысандар сары түспен көрсетілген. Статистикалық тұрғыдан маңызды DEG'лар бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі бар DESeq2 (Вальд тесті) көмегімен анықталды. Төмен реттелген DEG'лар ішіндегі 2-ші дәрежелі регулон гендерінің статистикалық маңызды байытылуы түзетілген p-мәнімен көрсетілген (бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі бар бір жақты Фишердің дәл тестілері). b, ARACNE көмегімен жасалған NPC GRN ішкі жиынтығының бейнесі. Барлық реттеушілер SFARI гендері болып табылатын бірінші дәрежелі нысана гендермен бірге көрсетілген. c, Көрсетілген гендер жиынтықтары ішінде жоғары PageRank ұпайлары бар гендердің байытылуын көрсететін гендер жиынтығын байыту талдауы (GSEA) (Салмақты Колмогоров — Смирнов жұмыс істейтін сома статистикасы, ауыстыру тесті, бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуімен). d, Әртүрлі гендер жиынтықтарындағы реттеушілер арасындағы өзара байланыстылық өлшемі болып табылатын орташа нормаланған дәрежені көрсететін бағанды диаграмма. e, Итеративті walktrap кластерлеу арқылы анықталған үздік реттеушілер модульдерінің бейнесі. Штрихталған сызықтар бұл сызықтардың масштабта емес екенін көрсетеді. Ерекше қызығушылық тудыратын гендер үлкен көрсеткілермен белгіленген. E панелінде әрі қарай талданатын KD нысандары қызыл қаріппен ерекшеленген. f, Бірнеше гендер жиынтығындағы CHD8 нысандарының байытылуын көрсететін бағанды диаграмма. Sugathan et al. (2014)45 жұмысынан NPC-тердегі CHD8 ChIP-seq деректері. Бағандар бір жақты Фишердің дәл тесті бойынша ықтималдықтар қатынасын (OR) көрсетеді; қателік сызықтары OR үшін 95% сенім интервалының төменгі шекарасын көрсетеді (бір жақты тест үшін жоғарғы шекара анықталмаған). p-мәндері бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуін қолдана отырып түзетілді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS1.jpg\" alt=\"Кеңейтілген деректер, 1-сурет./ NPC-тердегі аутизм гендерінің CasRx негізіндегі нокдауны. a, NTC үлгілерімен салыстырған\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Кеңейтілген деректер, 1-сурет./ NPC-тердегі аутизм гендерінің CasRx негізіндегі нокдауны. a, NTC үлгілерімен салыстырғанда әрбір KD үлгісіндегі мақсатты геннің салыстырмалы экспрессиясы. Қателік сызықтары: орташа мән +/- 95% сенім интервалы. n = әр шарт үшін үш биологиялық тәуелсіз үлгі. Статистикалық тұрғыдан маңызды DEG'лар бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі бар DESeq2 (Вальд тесті) көмегімен анықталды. b, Әрбір шарт үшін үш биологиялық тәуелсіз үлгіден алынған NTC және WAC-KD NPC-терінен автоматты вестерн-блот көмегімен ақуыз деңгейін талдау.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS2.jpg\" alt=\"Қосымша деректер, 2-сурет./ NPC ішіндегі ASD гендерінің CasRx негізіндегі KD кезіндегі гендер экспрессиясының дифференци\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша деректер, 2-сурет./ NPC ішіндегі ASD гендерінің CasRx негізіндегі KD кезіндегі гендер экспрессиясының дифференциалды өзгеруі. CasRx негізіндегі ASD гендерінің KD кейінгі транскриптом деңгейіндегі әсерлерін көрсететін жанартау графикалары (volcano plots). Статистикалық тұрғыдан маңызды DEG Бенджамини — Хохберг түзетуі бар DESeq2 (Уольд тесті) көмегімен анықталды. Статистикалық тұрғыдан айтарлықтай төмендеген (downregulated) DEG көк түспен, ал айтарлықтай жоғарылаған (upregulated) DEG қызыл түспен көрсетілген. KD нысаны болып табылатын ген (әр график үстінде көрсетілген) жасыл түспен ерекшеленген. SFARI DEG қалың жиекпен белгіленген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS3.jpg\" alt=\"Қосымша деректер, 3-сурет./ Ортақ дифференциалды экспрессияланған гендер бойынша транскриптомдық конвергенция. a, Әртүрл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша деректер, 3-сурет./ Ортақ дифференциалды экспрессияланған гендер бойынша транскриптомдық конвергенция. a, Әртүрлі KD жағдайлары арасындағы ортақ DEG көрсететін Circos диаграммалары (Circos plots). Тікелей салыстыру үшін жоғары сенімді SFARI гентеріне арналған Circos диаграммасы (1d-суретте көрсетілген) мұнда да келтірілген. b, Kem дегенде 5 KD жағдайында DEG болып табылатын non-SFARI гентерінің салыстырмалы экспрессиясын көрсететін жылу картасы (heatmap). c, Кем дегенде 5 KD жағдайында DEG болып табылатын жоғары сенімді SFARI гентерінің салыстырмалы экспрессиясын көрсететін жылу картасы. Статистикалық маңызды DEG Бенджамини — Хохберг түзетуі бар DESeq2 (Уольд тесті) арқылы анықталды және * белгісімен көрсетілген. Satterstrom et al. (2020)1 жұмысындағы ең күшті 26 ASD қауіп генінің қатарына кірген гендер қалың шрифтпен жазылған.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS4.jpg\" alt=\"Қосымша деректер, 4-сурет./ Ортақ DEG CasRx негізіндегі KD-ға тәуелді емес. a, y осінде жалпы DEG саны (сол жақ график) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша деректер, 4-сурет./ Ортақ DEG CasRx негізіндегі KD-ға тәуелді емес. a, y осінде жалпы DEG саны (сол жақ график) немесе SFARI DEG (оң жақ график) және x осінде KD мақсатты генінің экспрессиясын көрсететін нүктелік графиктер (scatter plots). Сызықтық регрессия қызыл түспен көрсетілген. b, mKO2, mScarlet және iRFP670 флуорофорларын экспрессиялайтын NPC ішіндегі флуоресценция қарқындылығын ағынды цитометриялық талдау. CasRx флуорофорлардың әрқайсысын жеке KD жасау үшін қолданылды. Нәтижелер NTC бақылауының орташа мәніне қатысты көрсетілген. mKO2 үшін **** түзетілген p = 1.44e-25, mScarlet үшін 5.74e-24 және iRFP670 үшін 1.45e-24 (Бонферронидің бірнеше рет салыстыру тесті бар кәдімгі екі жақты ANOVA). Шарт бойынша n = әр жағдай үшін үш биологиялық тәуелсіз үлгі. c, shRNA негізіндегі ASD гендері KD кейінгі гендер экспрессиясына транскриптом деңгейіндегі әсерлерді көрсететін жанартау графикалары. Статистикалық маңызды DEG Бенджамини — Хохберг түзетуі бар DESeq2 (Уольд тесті) көмегімен анықталды. Статистикалық тұрғыдан төмендеген DEG көк түспен, ал жоғарылаған DEG қызыл түспен көрсетілген. KD нысаны болып табылатын ген жасыл түспен ерекшеленген. SFARI DEG қалың жиекпен белгіленген. d, CasRx пен shRNA арқылы бірдей мақсатты ген KD жасалғаннан кейін бірдей төмендеген DEG байытылуын көрсететін бағанды график. Бағандар бір жақты Фишердің нақты тестінен алынған мүмкіндіктер қатынасын (OR) көрсетеді; қателік сызықтары OR үшін 95% сенім интервалының төменгі шегін көрсетеді (бір жақты тест үшін жоғарғы шек анықталмаған). p мәндері Бенджамини — Хохберг түзетуі арқылы түзетілді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS5.jpg\" alt=\"Қосымша деректер, 5-сурет./ Транскриптомдық конвергенция жасуша түрлері мен эксперименталды контексттер бойынша жүреді. \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша деректер, 5-сурет./ Транскриптомдық конвергенция жасуша түрлері мен эксперименталды контексттер бойынша жүреді. Бірнеше жасуша түрлері мен эксперименталды контексттер бойынша транскриптомдық конвергенцияны талдау. Төмендеген DEG статистикалық маңызды қиылысу байытылуы жасыл түспен көрсетілген (Бенджамини — Хохберг түзетуі бар бір жақты Фишердің нақты тесттері). iPSC және ExN деректері Deneault et al. (2018)20 жұмысынан қайта талданды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS6.jpg\" alt=\"Қосымша деректер, 6-сурет./ ASD генінің KD кейінгі пролиферация мен жасуша санына әсері. a, Уақыт өте келе салыстырмалы \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша деректер, 6-сурет./ ASD генінің KD кейінгі пролиферация мен жасуша санына әсері. a, Уақыт өте келе салыстырмалы CytoTrack бояуының қарқындылығы (-log2). Тек маңызды емес немесе қарама-қайшы әсерлер көрсеткен KD жағдайлары ғана көрсетілген. Графикте орташа мән +/- орташа мәннің стандартты қатесі (SEM) бейнеленген. Статистикалық маңыздылық Даннетттің бірнеше рет салыстыру тесті бар кәдімгі екі жақты ANOVA көмегімен анықталды. Әрбір уақыт нүктесі үшін әр жағдай бойынша кемінде төрт биологиялық тәуелсіз үлгі талданды. Сондай-ақ 1f-суретті қараңыз және толық статистикалық нәтижелер үшін Supplementary Table 10 қараңыз. b, y осінде KD жасушаларының салыстырмалы санын және x осінде KD мақсатты генінің экспрессиясын көрсететін нүктелік график. Сызықтық регрессия қызыл түспен көрсетілген. Микроцефалиямен байланысты болған және KD жасалуы пролиферацияның төмендеуіне әкелген гендер атап көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS7.jpg\" alt=\"Қосымша деректер, 7-сурет. / Мозаикалық ми органоидтарындағы ASD гендерінің KD-сы транскриптомдық конвергенцияны көрсете\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша деректер, 7-сурет. / Мозаикалық ми органоидтарындағы ASD гендерінің KD-сы транскриптомдық конвергенцияны көрсетеді. a, iPSC-тердегі FLICK конструктінің KD тиімділігі. KD нысаналы гені ENSG00000261840-тің қалыптасқан экспрессиясы NTC үлгілеріне қатысты орташа +/- стандартты қателік (SEM) ретінде көрсетілген. **** p = 3,87e-5, екі жақты t-критерийі. n = әрбір жағдай үшін биологиялық тәуелсіз үш үлгі. b, 15-ші күнгі FLICK органоидының иммуногистохимиясы, ұқсас нәтижелері бар үш тәуелсіз талдаудың сипаттамасы. c, Уақыт нүктесі бойынша боялған органоидтардың scRNA-seq UMAP картасы. d, Нысаналы ген бойынша боялған органоидтардың scRNA-seq деректерінің UMAP картасы. e, Бір айлық органоидтардың scRNA-seq көмегімен анықталған радиальды глия жасушаларындағы (RG) FLICK тиімділігі. Статистикалық тұрғыдан маңызды DEG-тер Seurat (параметрикалық емес Уилкоксон рангтік тесті) арқылы бірнеше гипотезаны тексеру үшін Бонферрони түзетуімен анықталды. BAZ2B сандық бағалауына аз жасуша саны әсер етуі мүмкін екенін және scRNA-seq-те WDFY3 ұсталуы транскрипттің ұзындығына (&amp;gt;14 т. ж.) байланысты болуы мүмкін екенін атап өтеміз. f, Екі айлық органоидтардағы әрбір KD нысанасы бойынша жасуша түрінің құрамы. Нүктелі сызықтар негізгі жасуша түрлерінің NTC пропорцияларын көрсетеді. ExN/RG пропорциясы NTC-ден айтарлықтай ерекшеленетін үлгілер * белгісімен көрсетілген (BAZ2B үшін adj. p = 0,021, CLASP1 үшін 0,018 және EHMT1 үшін 0,012), бір айлық (2f-суретті қараңыз) және екі айлық (мұнда көрсетілген) барлық ұзақ мерзімді үлгілерді ескере отырып, Даннеттің бірнеше салыстыру тесті бар кәдімгі бір бағытты ANOVA. g, IPC-терден алынған DEG-тердің өзара байытылуы (бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі бар бір жақты Фишердің дәл тесттері). h, Бір айлық органоидтардың RG-лерінен алынған DEG-терді сол нысаналы геннің KD-сы кезіндегі бұрынғы NPC культураларының DEG-терімен салыстырғандағы өзара байытылуын көрсететін бағанды диаграмма. Өзара байытылу үшін кемінде 20 DEG бар ауытқулар ғана сыннан өткізілді. Бағандар бір жақты Фишердің дәл тестінен алынған мүмкіндіктер қатынасын (OR) көрсетеді; қателік сызықтары OR бойынша 95% сенім интервалының төменгі шекарасын көрсетеді (бір жақты тест үшін жоғарғы шекара анықталмаған). p мәндері бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі арқылы түзетілді. i, d панеліндегідей KD нысаналы гені бойынша боялған жедел KD органоидтарынан алынған scRNA-seq деректерінің UMAP картасы. j, Жасуша түрлерін анықтау үшін қолданылатын маркерлік гендердің экспрессиясы. k, Жедел KD органоидтарындағы әртүрлі ауытқулар кезіндегі жасуша түрінің құрамы. l, Жедел KD мозаикалық органоидтарынан алынған қоздырғыш нейрондардан (ExN) алынған DEG-терді сол нысаналы геннің KD-сы кезіндегі бұрынғы NPC культураларының DEG-терімен салыстырғандағы өзара байытылуын көрсететін бағанды диаграмма. Бағандар бір жақты Фишердің дәл тестінен алынған мүмкіндіктер қатынасын (OR) көрсетеді; қателік сызықтары OR бойынша 95% сенім интервалының төменгі шекарасын көрсетеді (бір жақты тест үшін жоғарғы шекара анықталмаған). p мәндері бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі арқылы түзетілді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS8.jpg\" alt=\"Қосымша деректер, 8-сурет. / REST-ті қоса алғандағы негізгі транскрипция факторлары қайталанатын дисрегуляцияланған генд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша деректер, 8-сурет. / REST-ті қоса алғандағы негізгі транскрипция факторлары қайталанатын дисрегуляцияланған гендерге бағытталған. a, ASD гендерінің KD-сынан кейін әртүрлі жасуша түрлерінен алынған DEG арасында нысаналары байытылған транскрипциялық реттеушілерді анықтайтын MAGIC талдауы (бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі бар Колмогоров — Смирнов тесті). Әрбір популяция үшін MAGIC реттеушілері реттеушіні қамтитын ASD гендерінің KD саны бойынша бағаланды. Ең жоғары балл алған реттеушілер бұл жерге тең балл алған кез келген қосымша реттеушілермен бірге енгізілген. b, Әртүрлі жағдайларда анықталған бір-біріне қабаттасатын MAGIC транскрипциялық реттеушілерін көрсететін сандық Эйлер диаграммалары. c, Адам мен тышқанның эмбриональды бағанды жасушаларынан алынған REST нысаналары ішіндегі SFARI, HC-SFARI немесе тек ID гендерінің байытылуын көрсететін бағанды диаграмма. Rockowitz &amp;amp; Zheng (2015)66 жұмысынан алынған REST нысаналы деректері. Бағандар бір жақты Фишердің дәл тестінен алынған мүмкіндіктер қатынасын (OR) көрсетеді; қателік сызықтары OR бойынша 95% сенім интервалының төменгі шекарасын көрсетеді (бір жақты тест үшін жоғарғы шекара анықталмаған). p мәндері бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі арқылы түзетілді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS9.jpg\" alt=\"Қосымша деректер, 9-сурет. / NPC гендік реттеуші желісін реконструкциялау арқылы анықталған конвергенцияның негізгі драй\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша деректер, 9-сурет. / NPC гендік реттеуші желісін реконструкциялау арқылы анықталған конвергенцияның негізгі драйверлері. a, Диаграмманың үстінде көрсетілген реттеушінің KD-сы кезіндегі дифференциалды экспрессияны көрсететін жанартау диаграммалары. GRN талдауы арқылы көрсетілген реттеуші оң реттейді деп болжанған гендер бөліп көрсетілген, мұнда статистикалық тұрғыдан маңызды түрде төмендеген DEG-тер көк түспен, ұлғайған DEG-тер қызыл түспен, ал елеулі өзгерісі жоқ нысаналар сары түспен көрсетілген. Статистикалық тұрғыдан маңызды DEG-тер бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуімен DESeq2 (Уолд тесті) арқылы анықталды. Төмен реттелген DEG-тер арасында 2-ші дәрежелі регулон гендерінің статистикалық тұрғыдан маңызды байытылуы түзетілген p мәнімен көрсетілген (бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуі бар бір жақты Фишердің дәл тесттері). b, Әртүрлі ASD гені KD үлгілеріндегі GRN конвергенциясының үздік драйверлерінің салыстырмалы экспрессиясын көрсететін жылу картасы. Статистикалық тұрғыдан маңызды DEG-тер бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуімен DESeq2 (Уолд тесті) арқылы анықталған және * белгісімен көрсетілген. Satterstrom et al. (2020)1 жұмысындағы 26 ең күшті ASD қауіп гендерінің арасынан анықталған гендер қалың қаріппен жазылған.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS10.jpg\" alt=\"Қосымша деректер, 10-сурет. / ZFX мида әйел жынысына қарай бейімделген экспрессияны көрсетеді және ASD гені KD кезінде қ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша деректер, 10-сурет. / ZFX мида әйел жынысына қарай бейімделген экспрессияны көрсетеді және ASD гені KD кезінде қайталанатын төмендейді. a, ASD-дегі FPE кандидат қатысушыларының салыстырмалы экспрессиясын көрсететін жылу карталары. Сол жақта: бірнеше гипотезаны тексеру үшін Бенджамини — Хохберг түзетуімен DESeq2 (Уолд тесті) арқылы анықталған статистикалық тұрғыдан маңызды DEG-термен (&lt;/em&gt; белгіленген) NTC-ге қатысты KD жағдайларындағы NPC экспрессиясы. Оң жақта: бірнеше гипотезаны тексеру үшін Бонферрони түзетуімен MAST (ықтималдық қатынасы тесті) арқылы анықталған статистикалық тұрғыдан маңызды DEG-термен (* белгіленген) Dias et al. (2024)47 жұмысынан қайта талданған ер идиопатиялық бақылауларға қатысты ASD бар ер адамдардың ExN экспрессиясы. Анықталмағаны X әрпімен көрсетілген. b, Пренатальды және ересек қыртысты қоса алғанда, адамның орталық жүйке жүйесінің (ОЖЖ) бірнеше тіндерінде ZFX экспрессиясының әйелдерге қарай айтарлықтай бейімделгенін көрсететін бағанды диаграмма. Әртүрлі түстермен көрсетілген жеке аймақтар. Көрсетілген экспрессия деңгейлері мен статистикалық нәтижелер тікелей келесі дереккөздерден алынды: (1) Benoit-Pilven et al. (2025)67, (2) Kissel et al. (2024)68 және (3) Fass et al. (2024)69. Статистикалық талдауларға қатысты егжей-тегжейлі ақпаратты тиісті дереккөзден қараңыз. c, Ер адамдардағы экспрессияға қатысты қыртыс аймақтары мен жасуша түрлері бойынша ZFX экспрессиясын көрсететін жылу картасы. Жасуша түрлері мен аймақтар дереккөздегідей қысқартылған: DeCasien et al. (2026)62.*&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect-fS10-2.jpg\" alt=\"Сурет S10 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S10 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-24/transcriptomic-convergence-and-the-female-protective-effect.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Генетикалық&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутация және&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жыныс&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fil
