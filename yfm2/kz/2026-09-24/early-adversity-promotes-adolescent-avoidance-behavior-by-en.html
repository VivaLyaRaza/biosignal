            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#CC8400\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#F2A93B\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"271\" cy=\"93\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"549\" cy=\"223\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Бала кездегі стресс миды&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай өзгертеді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f1.jpg\" alt=\"1-сурет. ELA жасөспірімдердің қауіптен қашу мінез-құлқын және оның негізінде жатқан BLA белсенділігін күшейтеді. (a) LBN\" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-сурет. ELA жасөспірімдердің қауіптен қашу мінез-құлқын және оның негізінде жатқан BLA белсенділігін күшейтеді. (a) LBN хаттамасы. (b) LBN мен стандартты өсіру (SR) кезіндегі аналық мінез-құлықтардың бөлінісі (SR, n=4; LBN, n=6 аналық) (Хи-квадрат тесті ꭓ2(4,27), p&amp;lt;0.0001). (c) Аналықтардың ұяда болатын уақытының пайызы (жұптастырылмаған t-тест F3,5=6.51, p=0.028). (d) Туылғаннан кейінгі (P)12, P21, P35 күндеріндегі марқаулардың салмағы (SR, n=16 марқау/4 іш, LBN, n=15 марқау/6 іш; Бонферронидің пост-хок тесті бар қайталанатын өлшемдері бар екі факторлы дисперсиялық талдау: жас әсері F1.51,43.92 = 736.4, P&amp;lt;0.0001; өсіру әсері F1,29 = 3.53, P=0.071; өзара әсерлесу F1.51,43.92 = 0.1949, P = 0.762, скрипка диаграммалары медиана мен квартильдерді көрсетеді). (e) Платформа көмегімен қашу (PMA) хаттамасы. (f) 3 дыбыс бинттері бойынша орташа есептелген сәтті әрекеттердің үлесі (SR, n=18; LBN, n=19 тышқан; Сидактын пост-хок тесті бар қайталанатын өлшемдері бар екі факторлы дисперсиялық талдау: әрекет әсері F2.29,80.10 = 40.84, P&amp;lt;0.0001; өсіру әсері F1,35 = 0.22, P=0.645; өзара әсерлесу F2.29,80.10 = 0.55, P = 0.605). (g) PMA қайтару кезінде жылу карталары ретінде көрсетілген тышқандардың орналасқан жерінің өкілдік мысалдары. (h) Қайтару кезінде дыбыс уақытында платформадағы орташа уақыт үлесі (жұптастырылмаған t-тест F17,18=1.71, P=0.006). (i) Қайтару кезінде дыбыс уақытында қатып қалған орташа уақыт үлесі (жұптастырылмаған t-тест F17,18=2.32, p=0.888). (j-t) PMA жаттықтыру және қайтару кезіндегі BLA ішіндегі талшықты фотометрия жазбалары (SR, n=8; LBN, n=5 тышқан). (j) GCaMP6s экспрессиясының және BLA ішіндегі талшықты оптикалық имплантаттың сызбасы мен мысал суреттері. (k) Фотометрия жануарларының PMA жаттығу кезіндегі сәтті әрекеттердің үлесі (SR, n=8; LBN, n=5 тышқан) (2 факторлы ANOVA: әрекет әсері F1,11=30.09, P=0.0002; өсіру әсері F1,12=0.09, P=0.77; өзара әсерлесу әсері F1,11=1.45, P=0.254). (l) Фотометрия жануарларының PMA қайтару кезінде платформадағы уақыт үлесі (жұптастырылмаған t-тест F7,4=8.10, P=0.016). (m) Тышқан PMA жаттығуы кезінде ток соққысын алған дыбыс кезеңдеріндегі BLA белсенділігіндегі флуоресценцияның орташа өзгерісі (z-балл). (n) Ток соққысы кезінде және одан кейінгі 13 секунд ішінде қисық астындағы аумақты (AUC) сандық бағалау (жұптастырылмаған t-тест F4,7=1.07, P=0.024). (o) Ток соққысы кезіндегі шыңды флуоресценцияны сандық бағалау (жұптастырылмаған t-тест F7,4=5.10, P=0.829). (p) Ток соққысынан кейін бастапқы деңгейге оралуға келтірілген экспоненциалды қисықтың өшу жылдамдығын (секундпен) сандық бағалау (жұптастырылмаған t-тест F4,7=33.56, P=0.0026). (q) Тышқан платформадан тыс жерде болған кезде дыбыстың басталуына жауап ретінде BLA белсенділігіндегі флуоресценцияның орташа өзгерісі (z-балл). (r) Дыбыс басталғаннан кейінгі 3 секунд ішіндегі AUC-ті сандық бағалау (жұптастырылмаған t-тест F4,7=4.36, P=0.037). (s) Дыбыс басталғаннан кейінгі 3 секунд ішіндегі шыңды жауапты сандық бағалау (жұптастырылмаған t-тест F4,7=5.06, P=0.092). (t) AUC пен дыбыс кезіндегі платформадағы уақыт үлесі арасындағы корреляция (сызықтық регрессия SR: F1,6=1.44, P=0.276, LBN: F1,3=66.41, P=0.004). Барлық деректер нүктелері биологиялық қайталануларды білдіреді. Деректер орташа ± стандартты қате ретінде көрсетілген, ал көлеңкелеу субъектілер арасындағы стандартты қатені көрсетеді; *P&amp;lt;0.05, *&lt;em&gt;P&amp;lt;0.01. Үшбұрыштар ұрғашыларды, ал шеңберлер еркектерді білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ерте жастағы қолайсыз жағдайлар жасөспірім шақта қауіп-қатерге тым өткір реакция жасауға әкеледі. Зерттеушілер тышқандар моделі арқылы бұл өзгерістерге жауап беретіn нейрондық жолдарды анықтады. Белгілі болғандай, мәселе префронтальды қыртыс пен бадамша денені байланыстыратын қозу жасушаларының белсенділігінде. Қызығы, ересек жаста бұл контурлар мұндай мінез-құлықты тудырмайды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ерте стресс жасөспірімдердің қауіптен қашу мінезін күшейтеді&lt;/li&gt;\n&lt;li&gt;Қыртыс пен бадамша дене арасындағы байланыс күшейеді&lt;/li&gt;\n&lt;li&gt;Нейрондарды оптогенетикалық тежеу стресс зардабын жояды&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Ерте өмірлік стресс (Early life adversity, ELA) бүкіл әлем бойынша адамдардың жартысынан көбіне әсер етіп, мазасыздық бұзылыстарының қаупін арттырады. Осы үдерісті түсіну үшін ғалымдар төсеніш пен ұя материалын шектеу моделін (limited bedding and nesting, LBN) қолданды. Жасөспірім шақта жануарлар платформа арқылы қауіптен қашу (Platform Mediated Avoidance, PMA) тестінен өтті. Талшықты фотометрия көмегімен базалатеральды бадамша денедегі (BLA) кальций белсенділігі тіркелді.&lt;/p&gt;\n&lt;p&gt;Ерте жаста ELA бастан кешірген тышқандар дыбыс сигналы кезінде қауіптен қашу деңгейін айтарлықтай арттырғаны анықталды. Миды картаға түсіру әдісі бұл процеске вентромедиальды префронтальды қыртыстағы (vmPFC) кортикотропин-рилизинг-гормонды (CRH) бөлетін глутаматергиялық нейрондар жауап беретінін көрсетті. Стреске ұшыраған тышқандарда бұл жол күшейген, ал оптогенетикалық тежеу арқылы мінез-құлықты қалыпқа келтіру мүмкін болды.&lt;/p&gt;\n&lt;p&gt;Ғалымдар бұл әсердің тек жас ерекшелігіне қатысты екенін атап өтеді. Дәл осындай манипуляциялар ересек тышқандардың мінез-құлқына әсер етпеді. Бұл префронтальды қыртыстағы CRH нейрондары жасөспірім шақта психикалық бұзылыстарға бейімділікті анықтайтын негізгі фактор екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу зертханалық тышқандарда жүргізілгендіктен, нәтижелерді адамдарға тікелей қолдану қосымша клиникалық дәлелдерді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Өмірдің ерте кезеңіндегі қолайсыз жағдайлар (ELA) эмоцияларды басқару тізбектерінің қызметіне ұзақ мерзімді әсер етеді. Ерте жастағы қатыгездік, немқұрайлылық немесе отбасындағы тұрақсыздық көңіл-күй мен үрейлі бұзылулардың белгілері болып табылатын қатерді бағалау мен оған жауап қайтарудағы тұрақты өзгерістермен байланысты. Бұл өзгерістер көбінесе жасөспірім шақта пайда болады және марапаттау тәжірибелеріне қатысуды шектейтін шамадан тыс қашу мінез-құлқымен сипатталады.&lt;/p&gt;\n&lt;p&gt;Дегенмен, ELA мен күшейтілген қатер реакцияларын байланыстыратын нейродаму механизмдері әлі де түсініксіз. Біз стреске сезімтал медиальды префронтальды қыртыс (mPFC)-базолатеральды бадамша без жолын анықтадық, ол кортикотропин-рилизинг-гормон (CRH) мен глутаматты бірлесіп экспрессиялайды. Біз ELA бұл жолды күшейтетінін және жасөспірім шақта қатерден қашу мінез-құлқын арттыратынын анықтадық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ерте қолайсыз жағдайлар CRH мен глутаматты экспрессиялайтын mPFC-базолатеральды бадамша без жолын күшейтіп, жасөспірімдерде қатерден қашуды арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оптогенетикалық тежеу ​​және осы жолдағы даму кезеңіндегі CRH деңгейін төмендету ELA туындатқан жасөспірімдердегі қашудың жоғарылауын жояды, ал әдеттегідей бағылған тышқандарда mPFC CRH экспрессиясын жалпы төмендету ELA фенотиптерін қайталайды. Дәл осындай манипуляциялар ересек дарақтарда ешқандай мінез-құлық әсерін тудырмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптогенетика — бұл мидағы белгілі бір жасушаларды жарықтың көмегімен қосуға немесе өшіруге мүмкіндік беретін әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біздің нәтижелеріміз жасуша түріне тән CRH сигналдары дамып келе жатқан нейрондық тізбектердің пластикасын реттейтінін, эмоциялық тізбек функциясын өзгертетінін және психикалық ауытқуларға бейімділік тудыруы мүмкін екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу нәтижелері кеміргіштер моделінде алынды, сондықтан оларды адамға қатысты қолданғанда сақ болу қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Ерте жастағы жағымсыз факторлар (ELA), соның ішінде немқұрайлылық, қатыгездік, зорлық-зомбылық немесе тұрақсыз отбасылық орта дүние жүзіндегі адамдардың шамамен 60%-ына әсер етеді. ELA өтпелі болуы мүмкін болса да, ол мидың эмоция жүйелерінің дамуы мен жұмыс істеуінде, соның ішінде адамдардың экологиялық қауіптерді қалай бағалайтынында және оларға қалай жауап беретінінде тұрақты өзгерістер тудырады. Осыған байланысты ELA мазасыздық пен депрессияны қоса алғанда, психикалық бұзылулардың негізгі қауіп факторы болып табылады. Бұл бұзылулар жиі жасөспірімдік кезеңде пайда болады — бұл мидың дамуының сыни кезеңі, бұл кезде ортаны зерттеу мен тәжірибе белсенділікке тәуелді пластичность арқылы кеш дамитын когнитивті және эмоционалдық жүйелерді қалыптастырады. Көңіл-күй мен мазасыздық бұзылулары нейрондық тізбектердің жетілуін бұзуы және мақсатқа бағытталған мінез-құлыққа кедергі келтіре алатын қауіптен күшейтілген қашумен сипатталады. Соған қарамастан, ELA-ның көптеген механикалық зерттеулері ересектердегі нәтижелерге бағытталған, ал ELA-ны кейінгі мінез-құлық өзгерістерімен байланыстыратын даму процестері нашар зерттелген күйінде қалып отыр. Бұл ақпарат сайып келгенде, қауіп тобындағы популяцияларда психикалық симптомдарды анықтауға, алдын алуға және емдеуге көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ерте жастағы жағымсыз факторлар (ELA) адамдардың 60%-ына әсер етіп, нейрондық тізбектердің жетілуінің бұзылуына байланысты жасөспірімдік кезеңде пайда болатын мазасыздық және депрессиялық бұзылулардың негізгі қауіп факторы болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эмоционалдық стимулдарды өңдейтін және оқыту мен шешім қабылдауды реттейтін лимбиялық жүйе стресс гормондары рецепторларының жоғары экспрессиясына байланысты жағымсыз факторларға ерекше сезімтал келеді. Сондай-ақ ол психикалық бұзылуларда дисрегуляцияға ұшырайды. Адамдарды нейровизуализациялау зерттеулері ELA лимбиялық жүйе белсенділігі мен функционалдық байланысын, әсіресе медиальды префронтальды қыртыс (mPFC) пен базолатеральды бадамша дене (BLA) арасында өзгертетінін көрсетеді. Бұл өзгерістердің кейбіреулері қауіпке адаптивті емес жауаптармен корреляцияланғанымен, себеп-салдарлық дәлелдердің болмауы ELA тиісті ми тізбектерінің дамуын қалай бұзып, қауіптен асыра қашуға әкелетінін түсінуде негізгі олқылықтар қалдырады. Мінез-құлық мидағы арнайы нейрондық тізбектердің үйлестірілген белсенділігінен туындайтындықтан, ELA-дан кейінгі жасуша түрі мен тізбекке тән өзгерістерді ашу сайып келгенде ELA когнитивтік және эмоционалдық мінез-құлыққа әсер ететін механизмдерді көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Базолатеральды бадамша дене (BLA) және медиальды префронтальды қыртыс (mPFC) — эмоцияларды өңдеуге, қорқынышты бағалауға және мінез-құлықты бақылауға жауап беретін негізгі ми құрылымдары, олардың байланысы стресс кезінде бұзылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кортикотропин-рилизинг гормоны (CRH) сияқты стреске сезімтал молекулалар арнайы лимбиялық жасуша популяцияларында жинақталған және ELA-ны тұрақты мінез-құлық өзгерістерімен байланыстыруы мүмкін. Зерттеулердің көпшілігі гипоталамустағы CRH-ке бағытталған, мұнда ол ағзаның стресске жауабын реттейді. Алайда CRH сонымен қатар mPFC, гиппокамп, бадамша дененің орталық ядросы (CeA) және жолақты дене төсегі ядросы (BNST) қоса алғанда, маңызды эмоцияны реттейтін орталықтарда жоғары деңгээде экспрессияланады. ELA бұл аймақтардағы CRH экспрессиясын да, CRH экспрессиялайтын нейрондардың функциясын да өзгертеді. CRH негізінен гамма-аминомасляничноверлік (ГАМКэргиялық) жасушаларда экспрессияланады және мақсатты нейрондарда пластиканы ынталандыру үшін өзінің сәйкес рецепторлары — кортикотропин-рилизинг фактор рецепторлары 1 және 2 арқылы сигналдар береді. Ген нокдауны немесе фармакологиялық рецепторларды тежеу арқылы CeA, BNST және гиппокамптағы CRH белсенділігін төмендету сәйкесінше ELA туындататын ангедонияны, мазасыздық тәрізді мінез-құлықты және жад тапшылығын қалпына келтіреді. Сонымен қатар, CRH экспрессиялайтын CeA жасушаларын тежеу ересек жаста ELA туындататын шошыну реакцияларының артуын және адаптивті емес марапаттау мінез-құлқын болдырмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алынған мәліметтер негізінен жануарлар модельдеріне негізделген; нәтижелерді адамға тікелей көшіру адам психикасының күрделілігіне байланысты сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жиынтықта бұл нәтижелер CRH-ті стресс тудыратын нейропластиканы қозғайтын эффектор және ELA-ның ұзақ мерзімді салдарына ықпал ететін стреске сезімтал жолдардың маркері ретінде көрсетеді. Дегенмен, бізде ELA туындататын CRH жүйесіндегі өзгерістердің мидың дамуына қалай әсер ететіні туралы шектеулі түсінік бар — әсіресе мазасыздық бұзылулары үшін орталық болып табылатын қашу мінез-құлқын қолдайтын тізбектер шегінде. ELA-ның CRH жүйесіне әсері туралы зерттеулердің көпшілігі тек ересектерге бағытталған болатын. Сонымен қатар, CRH немесе рецептор экспрессиясын кеңінен басқарған көптеген осындай зерттеулер қайшы нәтижелер берді, бұл аймақ пен жасуша түрі деңгейінде CRH тізбектерінің функциясын зерттеу қажеттілігін көрсетеді. ELA дамушы мидағы арнайы CRH тізбектеріне қалай бірегей әсер ететінін анықтау жас ерекшелігіне сай биологияға негізделген психикалық ауруларға қарсы тиімдірек араласуларды әзірлеу үшін негіз бола алады.&lt;/p&gt;\n&lt;p&gt;ELA тышқан моделін қолдана отырып, біз жасөспірімдік жаста BLA жоғары белсенділігімен корреляцияланған қауіптен қашу мінез-құлқының жоғарылағанын байқадық. CRH-ті ми бойымен картаға түсіру ELA жасөспірімдердегі вентромедиальды (vm) PFC-тегі CRH+ нейрондары санының таңдамалы түрде азаюын туындайтынын көрсетті. Оған сәйкес, дамудың ертерек кезеңдерінде vmPFC бойынша CRH нокдауны әдеттегідей тәрбиеленген жасөспірім тышқандарда ELA фенотиптерін қайталайды. Вирустық тізбекті картаға түсіру мен patch-clamp жазбаларын қолдана отырып, біз vmPFC-тен BLA-ға проэкцияланатын және ELA-дан кейін күшейтілетін глутаматергиялық, CRH экспрессиялайтын нейрондық популяцияны анықтадық. RNAscope ELA глутаматергиялық емес vmPFC CRH+ жасушаларының санын азайтқанымен, глутаматергиялық CRH+ популяциясында жоғары CRH экспрессиясын қозғайтынын көрсетті. Оған сәйкес, глутаматергиялық vmPFCCRH+→BLA жолының оптогенетикалық тежелуі жасөспірімдердегі ELA туындататын қауіптен қашудың жоғарылауын қалпына келтіреді. Сол сияқты, CRH нокдауны vmPFC қоздырғыш жасушаларында таңдамалы түрде ELA бар жасөспірім тышқандарда қашу мен BLA белсенділігінің төмендеуіне әкеледі. Ересек жаста бұл манипуляциялар ешқандай әсер етпеді, бұл жағымсыз жағдайлардан кейін жоғарылаған қашуды қоздыруда бұл жолдың даму тұрғысынан шектелген рөлін көрсетеді. Жиынтықта бұл нәтижелер vmPFC CRH ELA-дан кейін ерте постнатальды эффектор ретінде жұмыс істейтінін, жасуша түріне тән түрде әрекет ететінін және қоздырғыш, CRH экспрессиялайтын vmPFC–BLA жолында пластиканы туындайтынын болжайды. ELA бұрын сипатталмаған CRH экспрессиялайтын қоздырғыш жолдағы белсенділікті қалай өзгертетінін анықтау арқылы бұл жұмыс ELA жасөспірімдердің мінез-құлқын қалай өзгертетіні туралы механикалық түсінік береді және психикалық аурулар қаупін азайту стратегияларына негіз бола алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тышқандардағы зерттеу ELA вентромедиальды префронтальды қыртыста CRH-нейрондардың таңдамалы жоғалуы мен қайта құрылуын туындайтынын, ал vmPFC–BLA жолын оптогенетикалық басу жасөспірімдік қашу мінез-құлқын қалпына келтіретінін көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"erte-zhastaghy-stress-ela-zhasoespirimdik-kezengde-khauipten-khashu-minez-khulkhyn-zhaene-onyng-negizindegi-bla-belsendiligin-kueshejtedi\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#erte-zhastaghy-stress-ela-zhasoespirimdik-kezengde-khauipten-khashu-minez-khulkhyn-zhaene-onyng-negizindegi-bla-belsendiligin-kueshejtedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ерте жастағы стресс (ELA) жасөспірімдік кезеңде қауіптен қашу мінез-құлқын және оның негізіндегі BLA белсенділігін күшейтеді&lt;/span&gt;&lt;/a&gt;Ерте жастағы стресс (ELA) жасөспірімдік кезеңде қауіптен қашу мінез-құлқын және оның негізіндегі BLA белсенділігін күшейтеді&lt;/h4&gt;\n&lt;p&gt;mPFC және BLA қоса алғанда, лимбикалық аймақтар ересектерде қауіптен қашу мінез-құлқын реттейді. Бұл тізбектер жасөспірімдік кезеңде айтарлықтай қайта құрудан өтеді, бұл қауіптен қашу мінез-құлқының жасқа байланысты өзгерістеріне ықпал етеді. Ересектермен салыстырғанда, жасөспірім тышқандар әдетте қауіптен қашудың төмен деңгейін көрсетеді, оның орнына зерттеуге басымдық береді. ELA кеміргіштерде де, адамдарда да қауіпке реакцияларды күшейтеді, бұл әсер BLA белсенділігінің жоғарылауымен корреляцияланады. Алайда, ELA болдырмауға болатын қауіптерге үйретілген жауаптарды қалай өзгертетіні және бұл өзгерістердің қандай жасушалық және молекулярлық механизмдерге негізделгені белгісіз күйінде қалып отыр. Біз лимбикалық тізбектердегі ELA тудырған өзгерістер жасөспірімдік кезеңде айқын көрініп, мазасыздық пен депрессияның психикалық симптомдары, соның ішінде күшейтілген қауіп реакциялары әдетте пайда болатын осы даму терезесінде мінез-құлық өзгерістерін тудырады деп болжадық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ELA жасөспірімдік кезеңде қауіптен қашу реакциялары мен BLA белсенділіğini таңдамалы түрде күшейтіп, мазасыздық бұзылыстарының ерте пайда болуын түсінуге негіз жасайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл гипотезаны тексеру үшін біз ELA үшін шектеулі төсеніш және ұя салу (LBN) моделін қолдандық. LBN моделі ананың ұя салу материалын азайту және сым тор едені арқылы тышқандарды төсеніш материалынан бөлу арқылы ресурстары аз ортаға еліктейді (1a-сурет). Бұл дамудың маңызды кезеңінде (туғаннан кейінгі (P)4 пен P11 аралығында) аналық күтімнің фрагментарлы және болжауға болмайтын болуын тудырады. Бұл кезеңде LBN тобының аналары бала емізуге аз уақыт жұмсап, жалғыз өзі көбірек уақыт өткізді (1b-сурет), бұл ұядағы жалпы уақыттың азаюына әкелді (1c-сурет). LBN балалары стандартты өсірілген (SR) бақылау тобына қарағанда P12 күні жеңіл болды, алайда бұл айырмашылық балапанды сүттен айыру кезінде байқалмады (1d-сурет).&lt;/p&gt;\n&lt;p&gt;Жасөспірімдік кезеңде (P33–37) қауіптен қашу мінез-құлқының өзгерістерін бағалау үшін біз платформа арқылы қашу (PMA) тестін қолдандық, мұнда тышқандар дыбыстық сигналмен ескертілетін электр тогының соғуынан қашу үшін платформаға өтуді үйренеді (1e-сурет). Тоқ торларының астында қол жетпейтін жерге қойылған иіс ыдыстары камераны зерттеуге итермеледі. LBN тышқандары токтың соғуына сезімталдықтың аздап төмендегенін көрсетсе де (SN 1a-сурет), бұл олардың PMA үйрену қабілетіне әсер етпеді. Табысты әрекеттердің үлесі және дыбыстық сигнал кезінде платформадағы уақыт бойынша өлшенгендей, екі топ та жаттығу соңына қарай ұқсас нәтиже деңгейлеріне жетті (1f-сурет, SN 1b-сурет). Керісінше, келесі күні қауіп жадын қалпына келтіру сеансы кезінде LBN тышқандары дыбыстық сигнал кезінде платформада айтарлықтай көбірек уақыт өткізді (1g,h-сурет) және дыбыс басталғаннан кейін платформаға кіруге аз уақыт жұмсауға бейім болды (SN 1c-сурет). Маңыздысы, қату (freezing) деңгейлері топтар арасында ерекшеленбеді (1i-сурет), бұл платформадағы уақыттың ұлғаюы осы жерде қатудың күшеюімен немесе күштірек дыбыс-ток ассоциациясымен емес, қауіппен басқарылатын қашу мінез-құлқындағы айырмашылықтармен байланысты екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PMA тесті (Platform Mediated Avoidance) — кеміргіштер токтың соғуынан бұрын болатын дыбыстық сигналдан арнайы платформаға қашып құтылуды үйренетін мінез-құлық әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;PA жоғарылауы LBN тышқандарында мазасыздық тәрізді мінез-құлықтың күшеюінен туындағанын анықтау үшін біз ашық алаң мен көтерілген крест тәрізді лабиринтті қолдандық (SN 1d,e-сурет). Бұл тестілер тышқандар жыртқыштарға көбірек осал болатын жерлерге еліктей отырып, қондырғының ашық бөліктерінде қанша уақыт өткізетінін өлшейді. Біз бұл тесттерде тәрбиеге байланысты мінез-құлық өзгерістерін байқамадық, бұл ELA мазасыздық тәрізді мінез-құлықтың жалпы өсуіне емес, қауіпке реакция жасауда оқытуға тән өзгерістерді тудыратынын көрсетеді. Жаңа иіс тестінде де ешқандай айырмашылықтар байқалмады, бұл ELA зерттеу мотивациясына әсер етпейтінін, бірақ зерттеу әлеуетті қауіп немесе шығын әкелген кезде қашуды нақты күшейтетінін білдіреді (SN 1f-сурет).&lt;/p&gt;\n&lt;p&gt;ELA жасөспірім тышқандарда қауіптен қашудың негізінде жатқан BLA белсенділігін қалай өзгерте алатынын бағалау үшін біз PMA жаттығулары мен жадыны қалпына келтіру кезінде нейрондық белсенділіктің көрсеткіші болып табылатын жалпы кальций флуоресценциясын өлшеу үшін талшықты фотометрияны қолдандық (1j-сурет). PMA жазбаларынан кейін барлық жануарларда дұрыс вирустық экспрессия және талшықтың орналасуы расталды (SN 2a-сурет). Екі топта да ұқсас оқыту деңгейлері байқалды, ал LBN тышқандары жадыны қалпына келтіру кезінде айтарлықтай күшейген қашуды көрсетті (1k,l-сурет). Ток соққан кезде SR және LBN топтары ұқсас амплитудадағы ток реакцияларын көрсетті (1m-сурет). Алайда, LBN тышқандарында бұл реакциялар бастапқы деңгейге баяуырақ оралды, бұл SR бақылауымен салыстырғанда шок тудырған Ca2+ белсенділігінің жалпы өсуіне әкелді (1n-p-сурет). Жадыны қалпына келтіру кезінде LBN топтарында дыбыстың басталуына жауап бақылау тобына қарағанда айтарлықтай үлкен болды, әсіресе жануарлар платформадан тыс жерде болғанда және қауіп сөзсіз болған кезде (1q-s-сурет). LBN тышқандарында, бірақ бақылау тобында емес, қашу деңгейлері осы дыбыстың басталу реакциясымен тығыз корреляцияланды (1t-сурет), бұл дыбысқа қатысты BLA белсенділігі LBN тышқандарында белгіленген қауіптен қашуды күшті кодтайтынын, ал бақылау тобында олай емес екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байқалған жасушалық және мінез-құлық өзгерістері тышқан модельдері негізінде алынған, сондықтан оларды тікелей адам патологиясына экстраполяциялау сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тышқандардың жеке топтарында біз LBN тышқандарында күшейген BLA белсенділігінің негізі болуы мүмкін жасушалық және синаптикалық өзгерістерді әрі қарай зерттедіük. Алдымен біз нейрондық қоздырғыштықпен байланысты транскрипция факторы болып табылатын фосфорланған cAMP жауап элементін байланыстыратын ақуыздың (pCREB) экспрессия деңгейін өлшедік (48). LBN тышқандарында BLA жасушалары санының өзгермегеніне және PMA оқытуында айырмашылықтардың жоқтығына қарамастан, pCREB экспрессия деңгейлері айтарлықтай жоғары болды (SN 2b-e-сурет). Содан кейін біз өткір ми кесінділерінде BLA нейрондарынан өздігінен қоздыратын және тежеуші постсинаптическая тоқтарды (сәйкесінше sEPSCs және sIPSCs) жазып алдық (SN 2f-h-сурет). LBN тышқандары sEPSC жиілігінің жоғары болуына қарай жалпы үрдісті көрсетті және жоғары амплитудалы sEPSC-тердің айтарлықтай жоғары үлесін көрсетті (SN 2i-сурет), бұл LBN BLA нейрондарына қоздыратын синаптикалық кірістің күшеюіне әкелетінін көрсетеді. Керісінше, біз IPSC-терде ешқандай өзгерістер байқамадық (SN 2j-сурет), бұл LBN әсері әсіресе қоздыратын синапстарға тән екенін білдіреді. Жиынтықта бұл нәтижелер ELA жасөспірімдік кезеңде қауіптен қашу кезінде нейрондық қоздырғыштық пен қоздыратын синаптикалық кірісті арттыру арқылы BLA белсенділігін күшейте алатынын көрсетеді.&lt;/p&gt;\n&lt;p&gt;vmPFC-дегі CRH деңгейінің төмендеуі жасөспірімдік шақта қауіптен жоғарылаған қашу әрекетімен байланысты&lt;/p&gt;\n&lt;p&gt;CRH стресс пен қауіпті өңдеудің орталық медиаторы болып табылады. CRH-ті BLA-ға құю қоздырғыш популяциялардың белсенділігін арттырады және қорқыныш естеліктерін күшейтеді, ал стресс BLA-дағы CRH рецепторларының белсенділігіне әсер етеді. Дегенмен, BLA өзі аз мөлшерде CRH экспрессиялайды, бұл CRH бөлінуінің сыртқы көзден бастау алатынын көрсетеді, алайда ELA жасөспірімдік кезеңде BLA-ға прожекцияланатын аймақтардағы CRH экспрессиясына қалай әсер ететіні белгісіз.&lt;/p&gt;\n&lt;p&gt;ELA-ның жасөспірім миындағы CRH популяцияларына қалай әсер ететінін жүйелі түрде зерттеу үшін біз CRH-Cre тышқандарын Ai14 репортерлық линиясымен айқастырдық, соның арқасында барлық CRH нейрондары қызыл флуороформен (tdTomato) белгіленді. LBN немесе SR әсерінен кейін біз барлық өсіру топтары үшін мидың барлық аймақтарында CRH экспрессиялайтын (CRH+) жасушалар санын сандық бағалау үшін тұтас ми тіндерін мөлдірлеуді, иммунобелгілеуді және жарық парақтық микроскопиясын қолдандық (Сурет 2a). Алдыңғы әдебиеттерге сәйкес, біз CeA, пириформды қыртыста (PIR), BNST және гипоталамуста тығыз CRH+ жасуша кластерлерін байқадық (Сурет 2b). Біз BLA-ға ең күшті прожекциялар жіберетіні белгілі аймақтардағы CRH+ жасуша тығыздығының өзгерістерін бағаладық және vmPFC-де CRH+ жасуша тығыздығының таңдамалы түрде төмендегенін байқадық (Сурет 2c, Таблица SN 1).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f2.jpg\" alt=\"2-сурет. Жасөспірімдік шақта vmPFC ішіндегі CRH деңгейінің төмендеуі қауіптен қашудың күшеюімен байланысты (a-c), SR жән\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-сурет. Жасөспірімдік шақта vmPFC ішіндегі CRH деңгейінің төмендеуі қауіптен қашудың күшеюімен байланысты (a-c), SR және LBN жасөспірім тышқандарындағы CRH+ жасуша популяцияларының өзгерістерін талдау. (a) Мидың барлық бөлігіндегі CRH+ жасушаларының тығыздығын сандық бағалауға арналған DeepCOUNT талдау конвейері (SR, n=6; LBN, n=7 тышқан). (b) SR (сұр) және LBN (қызыл) жасөспірім тышқандарындағы CRH+ нейрондарының воксельдік тығыздығын көрсететін нүктелік диаграммалар. (c) Ретроградты түрде белгіленген CRH+ жасушалары бар BLA кіріс аймақтарының 6-сында, соның ішінде dmPFC, vmPFC, PIR, дорсальды таламустың ортаңғы сызық тобы (MTN), TEa және ECT-те CRH+ жасушаларының тығыздығын салыстыру (Сидак апостериорлық тесті бар екі факторлы қайталанма өлшемдер ANOVA: аймақ әсері F2.18,23.93 = 41.53, P&amp;lt;0.0001; өсіру әсері F1,11 = 2.15, P=0.171; өзара әсерлесу F2.18,23.93 = 2.00, P=0.1544). (d) vmPFC ішіндегі Crh экспрессиясының AAV-shRNA нокдаунының эксперименталды уақыт шкаласы мен суреті (SR: скрембл, n=10; shRNA, n=14; LBN: скрембл, n=10, shRNA, n=12 тышқан). (e) Шокка дейінгі базалық деңгей мен сеанстың соңғы төрт тоны үшін орташа есептелген PMA жаттығуы кезіндегі сәтті әрекеттердің үлесі (үш факторлы ANOVA: әрекет әсері F1,42=20.58, P&amp;lt;0.0001; өсіру әсері F1,42=10.16, P=0.0027; нокдаун әсері F1,42=0.098, P=0.756; әрекет × өсіру әсері F1,42=0.013, P=0.909; әрекет × нокдаун әсері F1,42=0.47, P=0.50; өсіру × нокдаун әсері F1,42=0.803, P=0.375; әрекет × өсіру × нокдаун әсері F1,42=0.417, P=0.522). (f-h), PMA қалпына келтіру кезіндегі мінез-құлық көрсеткіштері. (f) Сеанс бойы орташа платформада болған уақыт үлесі (Тьюки апостериорлық тесті бар екі факторлы ANOVA: нокдаун әсері F1,42=3.37, P=0.074; өсіру әсері F1,42=22.81, P&amp;lt;0.0001; өзара әсерлесу әсері F1,42=7.88, P=0.0075). (g) Дыбыс сигналы башталғаннан кейін платформаға кіру латенттілігі (Тьюки апостериорлық тесті бар екі факторлы ANOVA: нокдаун әсері F1,42=9.03, P=0.0045; өсіру әсері F1,42=4.98, P=0.031; өзара әсерлесу әсері F1,42=6.46, P=0.015). (h) Сеанс бойы орташа қатып қалу уақытының үлесі (Тьюки апостериорлық тесті бар екі факторлы ANOVA: нокдаун әсері F1,42=0.029, P=0.867; өсіру әсері F1,42=3.60, P=0.0646; өзара әсерлесу әсері F1,42=6.06, P=0.018). Барлық деректер нүктелері биологиялық қайталауларды білдіреді. Деректер орташа ± стандартты қателік (s.e.m.) түрінде көрсетілген, ал боялу субъектілер арасындағы s.e.m. мәнін көрсетеді; *P&amp;lt;0.05, **P&amp;lt;0.01, ***P&amp;lt;0.001, ***&lt;em&gt;P&amp;lt;0.0001. Үшбұрыштар ұрғашыларын, ал шеңберлер еркектерін білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ерте өмір тәжірибесі (ELA) вентромедиальды префронтальды қыртыста (vmPFC) CRH экспрессиялайтын жасушалар тығыздығының таңдамалы түрде төмендеуіне әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;vmPFC-дегі CRH сигналдарының қауіптен қашу мінез-құлқына қатысы бар-жоғын анықтау үшін біз Crh экспрессиясын жергілікті түрде төмендету (нокдаун жасау) үшін қысқа шашқыш тәрізді РНҚ-ны (shRNA) қолдандық (Сурет 2d). vmPFC-дегі CRH+ нейрондарының тығыздығы P7 мен P21 аралығында, әсіресе BLA-ға прожекцияланатын нейрондардың негізгі көзі болып табылатын 2/3 қабаттарда күрт өседі. Сондықтан біз бұл даму шыңына сәйкес келу үшін shRNA-ны шамамен P19 кезінде құйдық. Біз Crh мРНҚ экспрессиясын сандық бағалау үшін in situ гибридизациясын қолдана отырып, нокдаунды растадық. Анти-Crh shRNA және mCherry коэкспрессиялайтын vmPFC CRH+ жасушалары скремблирленген бақылауды экспрессиялайтын mCherry+ жасушалармен салыстырғанда Crh белгісі қарқындылығының айтарлықтай төмендегенін көрсетті (Сурет SN 3a). Біз әр тышқанда гистология көмегімен вирустық аймақтық нысанаға алуды растадық (Сурет SN 3b).&lt;/p&gt;\n&lt;p&gt;Жасөспірімдік кезеңнен бастап vmPFC-дегі Crh экспрессиясын төмендету жасөспірім тышқандардың PMA үйрену қабілетіне әсер етпеді (Сурет 2e). Алайда, SR бақылауларындағы vmPFC-ге тән Crh нокдауны қатуға әсер етпестен, платформадағы уақыттың айтарлықтай ұзаюына және дыбыс кезінде платформаға кіру латентті кезеңінің азаюына әкелді (Сурет 2f-h). Бұл нәтижелер vmPFC-дегі CRH деңгейінің онтогенетикалық төмендеуі жасөспірімдік шақта ELA-ұқсас мінез-құлықты фенокопиялайтынын көрсетеді. Біз LBN тобында еске түсіру кезінде қашудың өзгерістерін байқамадық (Сурет 2f-h), бұл LBN бірдей механизмді іске қосу арқылы Crh нокдаунының әсерлерін тежеуі мүмкін екенін болжайды. LBN тышқандары бақылауға қарағанда көбірек қатуға бейім болды, бірақ бұл Crh нокдаунынан айтарлықтай әсер етпеді (Сурет 1h). Маңыздысы, даму барысындағы Crh нокдауны жоғарылаған крест тәрізді лабиринтте немесе ашық алаң тесттерінде мазасыздық тәрізді мінез-құлыққа әсер етпеді (Сурет SN 3c-j), бұл CRH-тің туа біткен емес, жүре пайда болған қауіптен қашуды реттеудегі рөлін атап көрсетеді. CRH популяцияларын ми көлемінде талдау нәтижелерімен бірге (Сурет 2), бұл нәтижелер ELA туындатқан vmPFC-дегі CRH экспрессиясының даму барысындағы төмендеуі жасөспірімдік шақта қауіптен жоғарылаған қашуға ықпал ететінін болжайды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f1.jpg\" alt=\"1-сурет. ELA жасөспірімдердің қауіптен қашу мінез-құлқын және оның негізінде жатқан BLA белсенділігін күшейтеді. (a) LBN\" /&gt;&lt;/p&gt;\n&lt;p&gt;*1-сурет. ELA жасөспірімдердің қауіптен қашу мінез-құлқын және оның негізінде жатқан BLA белсенділігін күшейтеді. (a) LBN хаттамасы. (b) LBN мен стандартты өсіру (SR) кезіндегі аналық мінез-құлықтардың бөлінісі (SR, n=4; LBN, n=6 аналық) (Хи-квадрат тесті ꭓ2(4,27), p&amp;lt;0.0001). (c) Аналықтардың ұяда болатын уақытының пайызы (жұптастырылмаған t-тест F3,5=6.51, p=0.028). (d) Туылғаннан кейінгі (P)12, P21, P35 күндеріндегі марқаулардың салмағы (SR, n=16 марқау/4 іш, LBN, n=15 марқау/6 іш; Бонферронидің пост-хок тесті бар қайталанатын өлшемдері бар екі факторлы дисперсиялық талдау: жас әсері F1.51,43.92 = 736.4, P&amp;lt;0.0001; өсіру әсері F1,29 = 3.53, P=0.071; өзара әсерлесу F1.51,43.92 = 0.1949, P = 0.762, скрипка диаграммалары медиана мен квартильдерді көрсетеді). (e) Платформа көмегімен қашу (PMA) хаттамасы. (f) 3 дыбыс бинттері бойынша орташа есептелген сәтті әрекеттердің үлесі (SR, n=18; LBN, n=19 тышқан; Сидактын пост-хок тесті бар қайталанатын өлшемдері бар екі факторлы дисперсиялық талдау: әрекет әсері F2.29,80.10 = 40.84, P&amp;lt;0.0001; өсіру әсері F1,35 = 0.22, P=0.645; өзара әсерлесу F2.29,80.10 = 0.55, P = 0.605). (g) PMA қайтару кезінде жылу карталары ретінде көрсетілген тышқандардың орналасқан жерінің өкілдік мысалдары. (h) Қайтару кезінде дыбыс уақытында платформадағы орташа уақыт үлесі (жұптастырылмаған t-тест F17,18=1.71, P=0.006). (i) Қайтару кезінде дыбыс уақытында қатып қалған орташа уақыт үлесі (жұптастырылмаған t-тест F17,18=2.32, p=0.888). (j-t) PMA жаттықтыру және қайтару кезіндегі BLA ішіндегі талшықты фотометрия жазбалары (SR, n=8; LBN, n=5 тышқан). (j) GCaMP6s экспрессиясының және BLA ішіндегі талшықты оптикалық имплантаттың сызбасы мен мысал суреттері. (k) Фотометрия жануарларының PMA жаттығу кезіндегі сәтті әрекеттердің үлесі (SR, n=8; LBN, n=5 тышқан) (2 факторлы ANOVA: әрекет әсері F1,11=30.09, P=0.0002; өсіру әсері F1,12=0.09, P=0.77; өзара әсерлесу әсері F1,11=1.45, P=0.254). (l) Фотометрия жануарларының PMA қайтару кезінде платформадағы уақыт үлесі (жұптастырылмаған t-тест F7,4=8.10, P=0.016). (m) Тышқан PMA жаттығуы кезінде ток соққысын алған дыбыс кезеңдеріндегі BLA белсенділігіндегі флуоресценцияның орташа өзгерісі (z-балл). (n) Ток соққысы кезінде және одан кейінгі 13 секунд ішінде қисық астындағы аумақты (AUC) сандық бағалау (жұптастырылмаған t-тест F4,7=1.07, P=0.024). (o) Ток соққысы кезіндегі шыңды флуоресценцияны сандық бағалау (жұптастырылмаған t-тест F7,4=5.10, P=0.829). (p) Ток соққысынан кейін бастапқы деңгейге оралуға келтірілген экспоненциалды қисықтың өшу жылдамдығын (секундпен) сандық бағалау (жұптастырылмаған t-тест F4,7=33.56, P=0.0026). (q) Тышқан платформадан тыс жерде болған кезде дыбыстың басталуына жауап ретінде BLA белсенділігіндегі флуоресценцияның орташа өзгерісі (z-балл). (r) Дыбыс басталғаннан кейінгі 3 секунд ішіндегі AUC-ті сандық бағалау (жұптастырылмаған t-тест F4,7=4.36, P=0.037). (s) Дыбыс басталғаннан кейінгі 3 секунд ішіндегі шыңды жауапты сандық бағалау (жұптастырылмаған t-тест F4,7=5.06, P=0.092). (t) AUC пен дыбыс кезіндегі платформадағы уақыт үлесі арасындағы корреляция (сызықтық регрессия SR: F1,6=1.44, P=0.276, LBN: F1,3=66.41, P=0.004). Барлық деректер нүктелері биологиялық қайталануларды білдіреді. Деректер орташа ± стандартты қате ретінде көрсетілген, ал көлеңкелеу субъектілер арасындағы стандартты қатені көрсетеді; *P&amp;lt;0.05, *&lt;em&gt;P&amp;lt;0.01. Үшбұрыштар ұрғашыларды, ал шеңберлер еркектерді білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"ela-khashu-kezinde-uzakh-khashykhtykhtaghy-vmpfc-crh-bla-zholynyng-belsendiligin-kueshejtedi\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ela-khashu-kezinde-uzakh-khashykhtykhtaghy-vmpfc-crh-bla-zholynyng-belsendiligin-kueshejtedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ELA қашу кезінде ұзақ қашықтықтағы vmPFC CRH+ → BLA жолының белсенділігін күшейтеді&lt;/span&gt;&lt;/a&gt;ELA қашу кезінде ұзақ қашықтықтағы vmPFC CRH+ → BLA жолының белсенділігін күшейтеді&lt;/h4&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун — бұл интерференциялаушы РНҚ-лардың көмегімен белгілі бір геннің (бұл жағдайда Crh) экспрессиясын төмендету әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;vmPFC-дегі CRH экспрессиялайтын көптеген жасушалар ұзақ қашықтықтағы прожекция нысандарындағы белсенділікті тікелей модляцияламайтын жергілікті интернейрондар болып табылады. Осылайша, BLA-ға прожекцияланатын ұзақ қашықтықтағы CRH+ нейрондарының бар-жоғын анықтау үшін біз CRH-Cre тышқандарының BLA-сына Cre-тәуелді GFP экспрессиялайтын ретроградтық AAV енгіздік, бұл BLA-ны иннервациялайтын CRH+ жасушалардың флуоресцентті белгіленуіне әкелді (Сурет 3a-c, Сурет SN 4a). Біз CRH+ BLA-ға прожекцияланатын жасушаларды дорсомедиальды PFC (dmPFC), пириформды қыртыста (PIR), экторинальды қыртыста (ECT) және самайлық ассоциация аймақтарында (TEa), әсіресе таламустың паравентрикулярлық ядросында (PVT) және vmPFC-де байқадық (Сурет 3d).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f3.jpg\" alt=\"3-сурет. ELA vmPFCCRH+→BLA жолын күшейтеді. (a) Жас өспірім тышқандарда PMA жаттығуы кезінде BLA-ға прояксия жасайтын бе\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-сурет. ELA vmPFCCRH+→BLA жолын күшейтеді. (a) Жас өспірім тышқандарда PMA жаттығуы кезінде BLA-ға прояксия жасайтын белсендірілген CRH+ жасушаларының санын анықтауға арналған эксперименталды уақыт шкаласы. (b) BLA-ға прояксия жасайтын CRH+ жасушаларын белгілеуге және cFos экспрессиясын бағалауға арналған вирустық стратегияның схемасы. (c) PMA жаттығуы кезіндегі сәтті әрекеттердің үлесі (SR, n= 6, LBN, n=7 тышқан) (екі факторлы ANOVA: әрекет әсері F1,11=30.09, P=0.0002; өсіру әсері F1,12=0.09, P=0.77; өзара әсер ету F1,11=1.45, P=0.254). (d) Дорсомедиальды префронтальды қыртыста (dmPFC), vmPFC, пириформды қыртыста (PIR), таламустың паравентрикулярлы ядросында (PVT), экторинальды қыртыста (ECT) және самай ассоциативті аймағында (TEa) BLA-ға прояксия жасайтын ретроградты түрде белгіленген CRH+ мысал суреттері мен сандық бағасы (екі факторлы ANOVA: аймақ әсері F2.46,22.2=48.19, p&amp;lt;0.0001; өсіру әсері F1,9=0.092, p=0.769; өзара әсер ету F2.46,22.2=2.18, p=0.128). (e) vmPFC-дегі ретроградты түрде белгіленген CRH+ жасушалары (жасыл), Fos+ жасушалары (күлгін) және біріктірілген суреттер, сондай-ақ GFP+ жасушаларының санын (жұптаспаған t-тест F6,5=1.47, P=0.175), Fos+ жасушаларының санын (жұптаспаған t-тест F6,5=1.91, P=0.177) және GFP+/Fos+ жасушаларының пайызын сандық бағалау (жұптаспаған t-тест F6,5=2.39, P=0.016). (f) SR және LBN тышқандарындағы Vgat+ (сары), Vglut+ (күлгін), vmPFCCRH+→BLA жасушалары (жасыл) және біріктірілген сурет, сондай-ақ SR және LBN тышқандары бойынша біріктірілген тек Vglut+ болып табылатын vmPFCCRH+→BLA жасушаларының пайызын сандық бағалау (SR, n=34 жасуша/5 тышқан; LBN, n=62 жасуша/7 тышқан). (g,h) vmPFCCRH+→BLA жолының синаптикалық байланысын физиологиялық зерттеу (SR, n=6 жасуша/4 тышқан; LBN, n=8 жасуша/5 тышқан). (g) CRH+ vmPFC жасушаларына AAV-DIO-ChR2 инфекциясын жұқтыру схемасы және BLA-дағы патч-кламп тіркеу конфигурациясы. (h) SR және LBN тышқандарының BLA негізгі жасушаларында тіркелген репрезентативті vmPFCCRH+ туындатқан EPSC (Vm = -70 мВ) және IPSC (Vm = 0 мВ) және оптогенетикалық жолмен туындатылған қоздырушы постсинаптикалық токтың (oEPSC) амплитудасын сандық бағалау (Уэлч t-тест F7,5=5.38, P=0.0220). (i) SR және LBN тышқандарының vmPFC-дегі Crh (жасыл) және Vglut1 (күлгін) экспрессиясының мысал суреттері (SR, n= 5, LBN, n=7 тышқан) және сонымен қатар Vglut1+ экспрессиялайтын CRH+ жасушаларының санын сандық бағалау (жұптаспаған t-тест F5,7=2.41, P=0.800) және Vglut1+ жасушаларындағы Crh экспрессиясының қарқындылығы (жұптаспаған t-тест F6,4=1.77, P=0.049). (j) SR және LBN тышқандарының vmPFC-дегі Crh (жасыл) және Vglut1 (күлгін) экспрессиясының мысал суреттері және Vglut1 экспрессияламайтын CRH+ жасушаларының санын сандық бағалау (жұптаспаған t-тест F5,7=2.14, P=0.029) және Vglut1 жасушаларындағы Crh экспрессиясының қарқындылығы (жұптаспаған t-тест F5,7=3.67, P=0.836). Барлық деректер нүктелері биологиялық қайталауларды білдіреді. Деректер орташа ± стандартты қате түрінде көрсетілген; &lt;em&gt;P&amp;lt;0.05. Үшбұрыштар ұрғашыларды, ал шеңберлер еркектерді білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Содан кейін біз ELA-ның PMA кезінде BLA-ға прожекцияланатын vmPFC CRH+ нейрондарының белсенділігіне әсер ететінін зерттедік. Біз PMA жаттығуынан кейін ретроградты белгіленген vmPFC CRH+ → BLA нейрондарында жақында белсенділенген нейрондардың маркері болып табылатын бірден ерте Fos генінің экспрессиясын өлшедик (Сурет 3e). Ретроградты белгіленген vmPFC CRH+ жасушаларының көпшілігі 2/3 қабаттарда орналасты (Сурет SN 4b,c), бұл BLA-ға прожекцияланатын vmPFC жасушаларының жалпы популяциясының қабаттар бойынша таралуына сәйкес келеді. Біз ретроградты белгіленген GFP+ жасушаларының санында немесе vmPFC ішіндегі жалпы Fos экспрессиясында айырмашылық байқамадық (Сурет 3e). Алайда, LBN тышқандарында GFP+ vmPFC CRH+ → BLA нейрондарының айтарлықтай үлкен бөлігі Fos экспрессиясын көрсетті, бұл олардың SR бақылауларымен салыстырғанда PMA жаттығуы кезінде көбірек белсенділенгенін көрсетеді (Сурет 3e). Біз анықтаған BLA-ға прожекцияланатын басқа CRH+ популяцияларында стресс туындатқан PMA-ға тәуелді Fos экспрессиясының айырмашылықтарын байқамадық (Сурет SN 5a-d). Жалпы алғанда, бұл нәтижелер vmPFC CRH+ → BLA тізбегіндегі жоғарылаған белсенділік ELA-ны бастан өткерген жасөспірім тышқандарда қауіптен қашудың күшеюіне ықпал етуі мүмкін екенін болжайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименттер кеміргіштер (тышқандар) модельдерінде жүргізілді, сондықтан адамдарға тікелей экстраполяция жасау сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ela-glutamatergiyalykh-vmpfc-crhbla-zholyn-kueshejtedi\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ela-glutamatergiyalykh-vmpfc-crhbla-zholyn-kueshejtedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ELA глутаматергиялық vmPFC CRH+→BLA жолын күшейтеді&lt;/span&gt;&lt;/a&gt;ELA глутаматергиялық vmPFC CRH+→BLA жолын күшейтеді&lt;/h4&gt;\n&lt;p&gt;Ұзақ қашықтыққа жобаланатын CRH+ жасуша популяциялары туралы мәліметтер шектеулі, дерлік барлық жұмыстарда олардың тежеуші нейромедиатор гамма-аминома май қышқылымен (ГАМК) бірге экспрессияланатыны хабарланады. vmPFC CRH+→BLA жасушалары негізінен глутаматергиялық немесе ГАМК-эргиялық екенін анықтау үшін біз везикулярлы глутамат транспортері 1 (Vglut1) мен везикулярлы ГАМК транспортерінің (Vgat) мРНҚ экспрессиясын зерттеу мақсатында ретроградты вирустық таңбалауды in situ гибридизациясымен біріктірдік (Сурет 3f). Барлық топтарда вирустық белгі қойылған нейрондар Vglut1 экспрессиялады, бұл vmPFC CRH+→BLA проекциялық нейрондарының глутаматергиялық екенін көрсетеді (Сурет 3f).&lt;/p&gt;\n&lt;p&gt;Содан кейін біз vmPFC CRH+→BLA жолының глутаматергиялық екенін растау және ерте өмірдегі жағымсыз жағдайлардың (LBN) синаптикалық беріліс күшіне әсер ететінін анықтау үшін каналоропсиннің (ChR2) көмегімен тізбектерді картаға түсіруді қолдандық. Біз LBN немесе SR CRH-Cre тышқандарының vmPFC аймағына кре-тәуелді AAV-ChR2 енгіздік. Вирустың экспрессиясы үшін екі апта күтіп, жасөспірімдік кезеңде (P33–36) екі топтан мидың өткір кесінділерін дайындадық. Базолатеральды бадамша дененің (BLA) негізгі нейрондарында бүтін жасуша патч-кламп жазбаларын пайдалана отырып (Сурет 3g), нейрондардың мембраналық потенциалын сәйкесінше -70 мВ немесе 0 мВ деңгейінде ұстай отырып, BLA ішіндегі vmPFC CRH+ аксон терминалдарын оптогенетикалық түрде стимуляциялау арқылы қоздырушы және тежеуші постсинаптикалық тоқтарды (EPSC және IPSC) өлшедік (Сурет 3h). Ешбір топта IPSC байқалмады, бірақ оптогенетикалық түрде туындаған EPSC амплитудасы SR бақылау топтарымен салыстырғанда LBN тышқандарында айтарлықтай жоғары болды (Сурет 3h). Гистология вирустың дәл бағытталғанын растады (Сурет SN 6a). Бұл нәтижелер ELA vmPFC CRH+ афференттерінен BLA негізгі нейрондарына келетін қоздырушы сигналды күшейтетінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ерте өмірдегі стресс (LBN) vmPFC CRH+→BLA жолындағы глутаматергиялық берілісті таңдамалы түрде күшейтеді және Crh экспрессиясын арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ELA-ның жасөспірімдік кезеңде vmPFC Crh экспрессиясына қалай әсер ететінін кеңірек бағалау үшін біз сондай-ақ CRH+ Vglut1+ және Vglut1- жасушаларының санын, сондай-ақ осы жасушалардағы Crh экспрессия деңгейлерін анықтадық. LBN әсері Crh экспрессиялайтын Vglut1⁺ нейрондар санына әсер етпеді, бірақ SR бақылауымен салыстырғанда Crh экспрессиясының артуына әкелді (Сурет 3i). Керісінше, негізінен ГАМК-эргиялық интернейрондарды қамтитын Vglut1⁻ нейрондар Crh экспрессиялайтын жасушалар санының айтарлықтай төмендегенін көрсетті, бірақ Crh экспрессия деңгейінде өзгерістер болған жоқ (Сурет 3j). Миды тұтастай талдауда байқалған vmPFC CRH⁺ жасушаларының жалпы санының азаюымен бірге бұл нәтижелер LBN туындататын CRH+ жасушаларының азаюы тек ГАМК-эргиялық нейрондарға тән болуы мүмкін екенін болжайды. Екінші жағынан, ELA-дан кейін глутаматергиялық нейрондардағы Crh экспрессиясының артуы BLA-дағы төменгі ағынды белсенділіктің күшеюіне ықпал етіп, сайып келгенде, жасөспірімдік кезеңде жалтару мінез-құлқының күшеюіне әкелуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алынған деректер жануарлар моделіне негізделген және жасөспірімдік кезеңді сипаттайтындықтан, оларды адамдарға экстраполяциялау кезінде сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;vmPFCCRH+ →BLA LBN жасөспірімдерінде қауіптен қашудың артуын қамтамасыз етеді&lt;/p&gt;\n&lt;p&gt;Алдыңғы зерттеулер өмірдің ерте кезеңіндегі стресске (ELA) ұшырағаннан кейін орталық амигдаланың CRH жасушаларының жоғары белсенділігі ELA тарихы бар тышқандарда қауіпке реактивтіліктің күшеюіне және ангедонияға ықпал ететінін көрсетті, бұл CRH эмоционалды мінез-құлықтағы тұрақты өзгерістерді тудыратын негізгі стресске сезімтал жолдарды белгілейтінін көрсетеді. vmPFCCRH+→BLA жасушалары LBN тышқандарында PMA жаттығулары кезінде Fos экспрессиясының жоғарылауын, глутаматергиялық нейротрансмиссияның күшеюін және Crh экспрессиясының артуын көрсететінін ескере отырып, біз бұл жолдың жасөспірім LBN тышқандарында қауіптен қашудың артуы үшін қажет екенін және егер солай болса, оның рөлі ересек жасқа да таралатынын зерттедік. Ол үшін біз CRH-cre тышқандарының vmPFC аймағына кре-тәуелді тежеуші опсинді немесе бақылау флуорофорын енгіздік және BLA үстіне екі жақты талшықтарды орнаттық (4а-сурет). Екі аптадан кейін біз жасөспірімдерде немесе ересектерде PMA жаттығулары кезінде, атап айтқанда ток соғу кезеңінде және ол аяқталғаннан кейін 13 секунд ішінде vmPFCCRH+→BLA жолын оптогенетикалық түрде тежеу үшін көк лазерді (473 нм, үздіксіз) қолдандық (4b-сурет). Бұл уақыт аралығы BLA белсенділігі осы кезеңде жоғары болатыны туралы біздің деректеріміз негізінде таңдалды (1m,n-суреттер). Барлық жануарларда вирустың дұрыс экспрессиясы және талшықтың орналасуы расталды (4c-сурет; SN 6b,c-суреттері).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LBN жасөспірімдерінде vmPFCCRH+→BLA жолын тежеу оқытуға немесе қатып қалуға әсер етпестен PMA еске түсіру кезінде қауіптен қашуды азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;pmPFCCRH+→BLA тежелуі жасөспірім тышқандардың PMA үйрену қабілетіне әсер етпеді (4d-сурет). Алайда, PMA еске түсіру кезінде, оптогенетикалық манипуляция болмаған кезде, LBN басынан өткергендер токты болжайтын дыбыс кезінде қауіптен қашудың айтарлықтай төмендеуін көрсетті (4e-сурет). Бұл айырмашылық дыбыс басталған кезде қауіпсіздік платформасына кіру үшін латентті кезеңнің ұзаруына байланысты болды (4f-сурет), бұл ретте қатып қалу мінез-құлқына ешқандай әсер етпеді (4g-сурет). Ересектердегі осы манипуляция PMA үйренуге де (4h-сурет), келесі күні оны еске түсіруге де әсер етпеді (4i-k-суреттер). Осылайша, vmPFCCRH+→BLA жолының жоғарылаған белсенділігі жасөспірім шақта, бірақ кейінгі өмірде емес, күшейтілген қауіптен қашуды тудырады. vmPFC→BLA жолының кең тежелуі де жасөспірім LBN тышқандарында қашу мінез-құлқының айтарлықтай төмендеуіне әкелді (SN 7a-g-суреттері). Бұл кең vmPFC→BLA жолы жасөспірім LBN тышқандарында қауіптен қашудың артуына ықпал етсе де, тек CRH+ ішкі жиынтығын нысанаға алудың өзі бұл әсерді тудыру үшін жеткілікті екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Содан кейін біз SR бақылау топтарында vmPFCCRH+→BLA жолын стимуляциялау жасөспірім шақта қауіптен қашу мінез-құлқына LBN сияқты әсерлерді тудыруы мүмкін екенін зерттедік. Біз vmPFC-ге кре-тәуелді қоздырушы опсинді енгіздік және BLA үстіне екі жақты талшықтарды орнаттық (SN 8a,b-суреттері). PMA жаттығулары кезінде, ток соғу кезеңінде және одан кейін осы жолды оптогенетикалық түрде стимуляциялау үшін көк лазер импульстерін (473 нм, 50 мс, 15 Гц) бердік (SN 8c-суреті). Біз PMA үйрену қабілетінде (SN 8d-суреті) немесе келесі күні еске түсіру кезінде қашу деңгейінде (SN 8e-g-суреттері) топтар арасында ешқандай айырмашылықтарды байқамадық. Бұл жол SR тышқандарында BLA-да кішігірім EPSC тудыратыны туралы біздің нәтижемізбен бірге, vmPFCCRH+→BLA жолы SR тышқандарында төменгі ағындағы BLA белсенділігіне және қауіптен қашуға минималды түрде әсер ететінін болжайды. Сонымен қатар, бұл нәтижелер жасөспірім шақта жол белсенділігінің жедел өсуіне қарағанда, ертерек пайда болатын даму тізбегінің пластикасы LBN кейін қауіптен қашудың артуына ықпал етуі мүмкін екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жануарлар модельдерінде алынған нәтижелер әрқашан адамдарға тура мағынада қолданыла бермейді және қосымша зерттеулерді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;pmPFCCRH+→BLA жолын стимуляциялау немесе тежеу тума марапаттаушы немесе аверсивті екенін анықтау үшін біз нақты уақыттағы орын артықшылығы (RTPP) сынағын өткіздік, онда камераның бір жағы осы жолды оптогенетикалық манипуляциялаумен жұптастырылды. vmPFCCRH+→BLA жолын белсендіру лазермен жұптастырылған камерадан айтарлықтай қашуды тудырмады (SN 8h,i-суреттері). Сол манипуляция 30 секундтық лазерлік стимуляцияны кезектестірген кезде 10 минуттық ашық алаң сынағы кезінде мазасыздық тәрізді мінез-құлыққа да әсер етпеді (SN 8j-l-суреттері). Сол сияқты, vmPFCCRH+→BLA жолын тежеу жасөспірімдерде RTPP немесе ашық алаң сынақтары кезінде де әсер етпеді (SN 9a-e-суреттері). Біз ересектерде де негізінен ұқсас нәтижелерді байқадық (SN 9f-i-суреттері), тек ашық алаң сынағында тежелуден кейін локомоция төмендегенін қоспағанда (SN 9j-суреті). Жиынтықтай алғанда, бұл нәтижелер vmPFCCRH+→BLA жолы үйренілген қауіптен қашу мінез-құлқында ерекше рөл атқаратынын және тума жиренішті тудырмайтынын көрсетеді.&lt;/p&gt;\n&lt;p&gt;vmPFCVGLUT1 нейрондарындағы Crh экспрессиясы LBN туындататын қашудың артуы үшін қажет&lt;/p&gt;\n&lt;p&gt;Біздің оптогенетикалық эксперименттеріміз vmPFC^CRH→BLA жолындағы белсенділік LBN әсер еткен жасөспірім тышқандардағы қашудың артуы үшін қажет екенін көрсетеді. Дегенмен, бұл манипуляция глутаматтың да, CRH бөлінуінің де шығуына әсер етуі мүмкін. LBN туындататын жасөспірімдік жастағы қашудың арсуына және BLA белсенділігінің сәйкес өзгерістеріне CRH сигналының қажет екендігін және қашан қажет екенін анықтау үшін біз VGLUT1-Cre тышқандарының vmPFC аймағына CRH-ке бағытталған Cre-тәуелді shRNA енгіздік. Бұл стратегия vmPFC^CRH→BLA жолын құрайтын қоздырушы vmPFC нейрондарындағы CRH мөлшерін таңдамалы түрде азайтады. Жасөспірім тышқандарға хирургиялық ота P19–P21 жасында, ал ересектеріне P45–47 жасында жасалды. Екі аптадан кейін тышқандар PMA оқыту және еске түсіру үдерісінен өтті, содан кейін BLA-дағы Fos экспрессиясын бағалау үшін перфузия жасалды (Сурет 5a). Вирустың дұрыс экспрессиясы барлық жануарларда расталды (Сурет SN 10a,b).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f5.jpg\" alt=\"5-сурет. vmPFC→BLA жолындағы Crh экспрессиясының төмендеуі жасөспірімдерде ELA туындатқан жоғарылаған қашуды және BLA бе\" /&gt;&lt;/p&gt;\n&lt;p&gt;*5-сурет. vmPFC→BLA жолындағы Crh экспрессиясының төмендеуі жасөспірімдерде ELA туындатқан жоғарылаған қашуды және BLA белсенділігін әлсіретеді, бірақ ересектерде емес. (a) Жасөспірімдердегі vmPFCVGLUT1+ жасушаларындағы Crh экспрессиясының AAV-shRNA нокдаунының эксперименталды уақыт шкаласы мен суреті (SR: scramble, n=4; shRNA, n=6; LBN: scramble, n=8, shRNA, n=7 тышқан). (b) Шокка дейінгі базалық деңгей мен сеанстың соңғы төрт тоны үшін орташаланған PMA жаттығуы кезіндегі сәтті әрекеттердің үлесі (үш факторлы ANOVA: әрекет эффектісі F1,23=21,25, P=0,0001; өсіру эффектісі F1,23=0,093, P=0,764; нокдаун эффектісі F1,23=2,99, P=0,097; әрекет x өсіру эффектісі F1,23=1,41, P=0,247; әрекет x нокдаун эффектісі F1,23=0,067, P=0,800; өсіру x нокдаун эффектісі F1,23=0,68, P=0,417; әрекет x өсіру x нокдаун эффектісі F1,23=0,32, p=0,576). (c-e) PMA қалпына келтіру кезіндегі мінез-құлық көрсеткіштері. (c) Сеанс бойы орташаланған платформадағы уақыт үлесі (Tukey апостериорлық тесті бар екі факторлы ANOVA: нокдаун эффектісі F1,23=1,42, P=0,246; өсіру эффектісі F1,23=7,16, P=0,014; өзара әсер ету эффектісі F1,23=4,68, P=0,041). (d) Тон басталғаннан кейін платформаға кіру латенттілігі (Tukey апостериорлық тесті бар екі факторлы ANOVA: нокдаун эффектісі F1,23=0,02, P=0,889; өсіру эффектісі F1,23=6,53, P=0,018; өзара әсер ету эффектісі F1,23=2,06, P=0,164). (e) Сеанс бойы орташаланған қату уақытының үлесі (екі факторлы ANOVA: нокдаун эффектісі F1,23=1,48, P=0,237; өсіру эффектісі F1,23=1,31, P=0,264; өзара әсер ету эффектісі F1,23=4,95, P=0,036). (f) vmPFCVGLUT1+ жасушаларындағы Crh нокдаунынан кейінгі BLA ішіндегі Fos экспрессиясының мысал суреттері. (g) mm2 шаққандағы Fos+ жасушаларын сандық бағалау (Tukey апостериорлық тесті бар екі факторлы ANOVA: нокдаун эффектісі F1,23=2,69, P=0,115; өсіру эффектісі F1,23=16,33, P=0,0005; өзара әсер ету эффектісі F1,23=4,31, P=0,049). (h) Ересектердегі vmPFCVGLUT1+ жасушаларындағы Crh экспрессиясының AAV-shRNA нокдаунының эксперименталды уақыт шкаласы мен суреті (SR: scramble, n=4; shRNA, n=5; LBN: scramble, n=7, shRNA, n=10 тышқан). (i) Шокка дейінгі базалық деңгей мен сеанстың соңғы төрт тоны үшін орташаланған PMA жаттығуы кезіндегі сәтті әрекеттердің үлесі (үш факторлы ANOVA: әрекет эффектісі F1,40=30,87, P&amp;lt;0,0001; өсіру эффектісі F1,40=3,22, P=0,0803; нокдаун эффектісі F1,40=0,033, P=0,856; әрекет x өсіру эффектісі F1,40=3,50, P=0,067; әрекет x нокдаун эффектісі F1,40=0,615, P=0,437; өсіру x нокдаун эффектісі F1,40=0,40, P=0,530; әрекет x өсіру x нокдаун эффектісі F1,40=0,097, P=0,757). (j-l) PMA қалпына келтіру кезіндегі мінез-құлық көрсеткіштері. (j) Сеанс бойы орташаланған платформадағы уақыт үлесі (екі факторлы ANOVA: нокдаун эффектісі F1,22=1,61, P=0,293; өсіру эффектісі F1,22=0,059, P=0,810; өзара әсер ету эффектісі F1,22=0,82, P=0,376). (k) Тон басталғаннан кейін платформаға кіру латенттілігі (екі факторлы ANOVA: нокдаун эффектісі F1,22=3,55, P=0,073; өсіру эффектісі F1,22=0,092, P=0,765; өзара әсер ету эффектісі F1,22=0,099, P=0,330). (l) Сеанс бойы орташаланған қату уақытының үлесі (екі факторлы ANOVA: нокдаун эффектісі F1,22=0,15, P=0,707; өсіру эффектісі F1,22=1,31, P=0,264; өзара әсер ету эффектісі F1,22=1,13, P=0,300). (m) vmPFCVGLUT1+ жасушаларындағы Crh нокдаунынан кейінгі BLA ішіндегі Fos экспрессиясының мысал суреттері. (n) mm2 шаққандағы Fos+ жасушаларын сандық бағалау (екі факторлы ANOVA: нокдаун эффектісі F1,22=0,312, P=0,582; өсіру эффектісі F1,22=0,056, P=0,815; өзара әсер ету эффектісі F1,22=0,186, P=0,670). Барлық деректер нүктелері биологиялық қайталауларды білдіреді. Деректер орташа ± стандартты қате түрінде көрсетілген; *P&amp;lt;0,05, **P&amp;lt;0,01, **&lt;em&gt;P&amp;lt;0,001. Үшбұрыштар ұрғашыларын, ал шеңберлер еркектерін білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Онтогенездегі Crh нокдауны LBN тобындағы тышқандарда қауіптен қашу мен BLA белсенділігінің жоғарылауын таңдамалы түрде төмендетеді, бұл ересек дарақтарға әсер етпейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Даму кезеңіндегі Crh нокдауны SR немесе LBN жасөспірім тышқандарында шартты қашудың қалыптасуын бұзған жоқ (Сурет 5b). Еске түсіру кезінде Crh нокдауны SR бақылау тобына әсер етпеді, бірақ платформада өткізген уақыттың қысқаруы арқылы өлшенген LBN тышқандарындағы қашуды айтарлықтай төмендетті (Сурет 5c), бұл ретте кірудің латентті кезеңі немесе қозғалыссыз қалу (freezing) өзгерген жоқ (Сурет 5d,e). Осы мінез-құлық әсерлеріне сәйкес, Crh нокдауны BLA-дағы Fos экспрессиясын төмендетті (Сурет 5f,g). Ерте өмірлік стресс (ELA) туындататын Crh экспрессиясының өзгерістері дәл даму кезеңінде маңызды екенін анықтау үшін ересектердің салыстыру тобы да осындай процедуралардан өтті (Сурет 5h). Біз SR және LBN ересек тышқандары арасында мінез-құлық айырмашылықтарын байқамадық және Crh нокдауны PMA мінез-құлқына (Сурет 5i–l) немесе екі өсіру тобындағы BLA Fos экспрессиясына да әсер етпеді (Сурет 5m,n).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун — бұл белгілі бір геннің функциясын зерттеу үшін интерференциялаушы РНК (shRNA) көмегімен арнайы ген экспрессиясын жасанды түрде төмендету әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл өзгерістердің тек шартты қашуға тән екенін растау үшін біз ашық алаң мен көтерілген нөлдік лабиринт көмегімен мазасыздық тәрізді мінез-құлық пен локомоцияны да өлшедик. Олар PMA оқытылуына дейін бағаланды және біз ешқандай өсіру тобында Crh нокдаунының әсерін байқамадық (Сурет SN 10c–h). Жиынтық түрде бұл деректер ювенильді және жасөспірімдік кезеңдер vmPFC-дегі CRH сигналдарының өзгеруі қауіптен қашу тізбегінің жұмысына әсер ете алатын маңызды даму «терезесі» екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименттер мидың нақты аймағындағы экспрессияны басу үшін вирустық векторларды қолдану арқылы тышқандарда жүргізілді, сондықтан адам механизміне тікелей экстраполяциялау сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Ерте өмірдегі стресс мазасыздык пен депрессияны қоса алғанда, жоғары деңгейдегі қашу әрекетімен сипатталатын және көбінесе жасөспірім шақта көрінетін психикалық аурулардың дамуының негізгі қауіп факторы болып табылады. Осыған қарамастан, ерте өмірдегі стресс дамудың осы маңызды терезесі кезінде қауіптен қашу тізбектерінің жетілуін қалай қалыптастыратыны туралы тым аз нәрсе белгілі. Ерте өмірдегі стресс көптеген формаларда болуы мүмкін және қолайсыз факторлардың табиғаты да, пайда болу уақыты да мінез-құлық нәтижелеріне әсер етеді. Кеміргіштер модельдерінде өмірдің алғашқы он күніндегі созылмалы стресс ұзақ мерзімді салдарға әкелетіні кеңінен мойындалған, бірақ әртүрлі модельдер бірегей артықшылықтар ұсынады. Мұнда біз төсеніш материалдары мен ұя салу ресурстарына қол жетімділігі шектеулі модельді таңдадық, өйткені ол эксперимент жасаушының минималды араласуын талап етеді және анасы бар, бірақ фрагменттелген және болжауға болмайтын күтімді қамтамасыз ететін жиі кездесетін адам тәжірибесін көрсетеді. Осы модельді қолдана отырып, біз қауіптен қашу кезінде жоғарылаған белсенділікті, синаптикалық күшейтуді және жасөспірім шақта Crh экспрессиясының жоғарылауын көрсететін ұзақ қашықтықтағы, глутаматергиялық vmPFC^CRH+→BLA жолын анықтадық. Мінез-құлық кезінде vmPFC^CRH+→BLA жолын тежеу немесе дамудың ертерек кезеңдерінде тек қоздырушы жасушаларда vmPFC-дегі Crh экспрессиясын төмендету ерте өмірдегі стресс тудырған BLA белсенділігінің жоғарылауын және жасөспірім шақтағы қауіптен қашуды жояды, бірақ сол манипуляциялар ересек жастағы қауіптен қашуға әсер еткен жоқ. Бір қызығы, ерте өмірдегі стресс сонымен қатар vmPFC-дегі CRH⁺ жасушаларының жалпы тығыздығын төмендетеді. Осыған сәйкес, біз бақылау тобындағы тышқандарда даму барысында бүкіл vmPFC бойынша Crh нокдауны ерте өмірдегі стресс тудырған жоғарылаған қашу фенотипін қайталайтынын анықтадық. Жиынтығында бұл деректер ерте өмірдегі стреэсті бастан кешірген жануарларда CRH жасуша түріне тән түрде әрекет етіп, қауіпке жауап беру үшін маңызды vmPFC тізбектерінде даму пластикасын тудыратынын болжайды. Ерте өмірдегі стресске сезімтал және жасөспірім шақта жоғарылаған қауіптен қашуды тудыруға қабілетті, бұрын мойындалмаған, молекулалық тұрғыдан анықталған префронтальды тізбекті ашу арқылы біздің нәтижелеріміз ерте өмірдегі стресс психикалық ауруларға осалдыққа қалай ықпал етуі мүмкін екендігінің ықтимал тізбек механизмін ашады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ерте өмірдегі стресс vmPFC^CRH+→BLA жолын белсендіріп, жасөспірімдерде қауіптен қашуды күшейтеді, ал Crh басу бұл әсерді қайталайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Атқарған алдыңғы жұмыстар ерте өмірдегі стресске ұшыраған индивидтердің адамдарда функционалдық магниттік-резонанстық томография көмегімен және кеміргіштерде Fos таңбалау арқылы өлшенгендей, қорқынышты стимулдардың әсерінен кейін BLA белсенділігінің жоғарылауын көрсететінін көрсетті. Бұған сәйкес, біз ерте өмірдегі стресске ұшыраған жасөспірім тышқандарда BLA белсенділігі жоғарылағанын анықтадық (1-сур.). Ассоциативті қорқынышты жаттықтыру кезінде BLA белсенділігі төсеніш материалдары мен ұя салу ресурстарына қол жетімділігі шектеулі жағдайдағы жануарларда бақылау тобымен салыстырғанда ток пен шартты дыбыс әсер еткен кезде жоғары болады. Ассоциативті қорқынышты жаттықтыру классикалық қорқынышты қалыптастырумен салыстырғанда төменірек ток қарқындылығын пайдаланады, бұл неге бақылау тышқандарында дыбыс тудырған белсенділік деңгейі салыстырмалы түрде төмен екенін түсіндіруі мүмкін. Жиынтығында бұл деректер ерте өмірдегі стресс оқыту кезінде әлсіз аверсивті стимулдардың өзіне BLA сенсибилизациялап, қауіпті болжайтын сигналдарға жоғары жауаптарды ынталандыратынын болжайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун — бұл түзілетін ақуыздың функцияларын зерттеу мақсатында белгілі бір геннің (бұл жағдайда Crh) экспрессиясын жасанды түрде төмендетудің генетикалық әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кортиколиберин стресске жауап беретін нейропептид болып табылады, ол қорқынышты үйренуге ықпал етеді және нейрондық қоздырғыштықты жоғарылатады, бұл оның mPFC-BLA тізбектеріндегі ерте өмірдегі стресс тудырған өзгерістерді посредник етуі мүмкін екенін көрсетеді. Өзгерген кортиколиберин экспрессиясы гипоталамуста, миндалинада және гиппокампта айқын болғанымен, бұрынғы жұмыстар ересектерге бағытталған еді. Біз vmPFC-дегі Vglut⁻CRH⁺ жасушалары санының дамуға тән төмендеуін байқадық, ал Vglut⁺CRH жасушаларының санында, соның ішінде vmPFC^CRH+→BLA проекциялық нейрондарында ешқандай өзгеріс болған жоқ (3-сур.). vmPFC-дегі көптеген CRH⁺ нейрондары вазоактивті ішек пептидін бірге экспрессиялайтын гамкергиялық интернейрондар болып табылады, дегенмен зерттеулер прилежащее ядро және латеральды қалқа сияқты аймақтарға сирек ұзақ қашықтықтағы гамкергиялық CRH⁺ проекцияларын атап өткен. Осылайша, біздің жалпы милық талдауымызда және in situ деректерінде байқалған CRH⁺ жасушаларының азаюы vmPFC гамкергиялық нейрондарындағы Crh экспрессиясының жоғалуын көрсетеді. Сонымен қатар, біздің бүкіл vmPFC бойынша CRH нокдауны бойынша экспериментіміз, бұл бақылау тышқандарындағы ерте өмірдегі стресс әсерлерін қайталады (2-сур.), ең көбі дәл осы жасушаларға әсер еткен болуы мүмкін. Вазоактивті ішек пептидін экспрессиялайтын интернейрондар соматостатин интернейрондарына басым түрде бағытталады, осылайша пирамидалық нейрондардың соматостатин арқылы жүзеге асатын дендритті тежелуін әлсіретіп, қоздырушы шығысты арттырады. Осы синаптикалық өзара әрекеттесуге қосымша, соматостатин интернейрондарының кіші жиынтығы кортиколиберин 2 рецепторын экспрессиялайды. Бұл деректер вазоактивті ішек пептиді інтернейрондарынан кортиколибериннің бөлінуі префронтальды микротізбектердің жетілуін модуляциялай алатыны туралы болжамды тудырады. Бұл төмендеудің функционалдық салдары түсініксіз болып қала берсе де, мұндай өзгерістер сайып келгенде базолатеральды миндалинаны қоса алғанда, төменгі аймақтарға префронтальды шығысқа әсер етуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қорытындылар кеміргіштер модельдерінде жасалған, ал мидағы өзгерістердің мінез-құлықпен корреляциясы адамға экстраполяция жасауда сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз сондай-ақ ерте өмірлік қолайсыз жағдайлардан туындаған vmPFCCRH+→BLA тізбегіндегі пластикалық жасөспірім шақта қауіптен қашудың күшеюіне ықпал ететінін, бірақ ересек жаста ешқандай әсер етпейтінін анықтадық. Қалыпты даму барысында бұл кезеңде қауіпке деген жауап реакциясының төмендеуі ортаны бағдарлау және бейімделушілік мінез-құлық стратегияларын қалыптастыру үшін маңызды болып табылатын тәуекелді зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;vmPFCCRH+→BLA тізбегіндегі пластикалық жасөспірім кезеңде қауіптен қашуды күшейтеді, ал ересек жаста бұл жолдың рөлі әлсірейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біздің бұрынғы зерттеулеріміз көрсеткендей, стандартты жағдайда өсірілген тышқандарда ересек жаста байқалатын қауіптен қашудың жоғары деңгейі дорсомедиальды префронтальды қыртыстан базолатеральды бадамша денеге дейінгі жол ішіндегі жоғары белсенділік пен синапстық күшке байланысты [40]. Мұнда біз өсіру жағдайларына қарамастан, ересек дарақтарда да қашудың жоғары деңгейін байқадық. Сонымен қатар, vmPFCCRH+→BLA тежелуі немесе vmPFC қоздырушы нейрондарындағы Crh экспрессиясының нокдауны бұл жаста қашу мінез-құлқын айтарлықтай өзгертпеді, бұл бұл жолдың жасөспірім кезеңінде маңыздырақ рөл атқаратынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Деректер тышқандарға жүргізілген тәжірибелерге негізделген, сондықтан адамдардың психикалық бұзылыстарына тікелей қатысты қорытынды жасауда сақтық қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ересек жасқа қарай басқа жүйке тізбектері PMA мінез-құлқын реттеуде маңыздырақ рөл атқарып, vmPFCCRH+→BLA үлесін азайтуы немесе жасыруы мүмкін. Жалпы алғанда, vmPFC-BLA тежелуінің және жолға тән CRH нокдаунының жасөспірім шақтағы таңдамалы әсерлері бұл тізбекті ерте араласу үшін әлеуетті нысана ретінде көрсетеді. Біріктіре айтқанда, mPFC тізбектерінің дамуын ерте өмірлік тәжірибенің ұзақ мерзімді әсерлерімен байланыстыра отырып, біз ерте тәжірибенің нейродаму траекторияларын қалай қалыптастыратынын және сайып келгенде психикалық бұзылыстарға бейімділікке қалай әсер ететінін түсіну үшін механикалық негіз ұсынамыз.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"subuektter\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#subuektter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Субъекттер&lt;/span&gt;&lt;/a&gt;Субъекттер&lt;/h4&gt;\n&lt;p&gt;C57Bl6/J (JAX Stock No. 000664), CRH-Cre (JAX Stock No. 012704), VGLUT1-Cre (JAX Stock No. 023527) және Ai14 tdTomato Cre-reporter (JAX Stock No. 007914) трансгенді тышқандардың ұрғашы және еркек дарақтары лаборатория виварийінде өсірілді. Кейіннен ажыратылған тышқандар топтармен (торға 2–4 дарақтан) ұсталды. Экспериментальды соңғы нүктелер жасөспірімдік кезеңнің ортасында — постнатальды күндері (P) 33–37 аралығында орындалды. Тышқандар 12 сағаттық жарық циклінде (жарық таңғы 7:00-ден кешкі 7:00-ге дейін қосулы) температурасы мен ылғалдылығы бақыланатын бөлмеде ұсталды. Азық пен су шектеусіз (ad libitum) берілді. Барлық процедуралар Лос-Анджелес қаласындағы Калифорния университетінің Жануарларды зерттеу жөніндегі комитеті бекіткен жануарларды күту ережелеріне сәйкес жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименттің соңғы нүктелері жасөспірімдік жаста (P33–37) орындалып, жануарлар азық пен суға еркін қол жеткізе отырып, стандартты бақыланатын жағдайда ұсталды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shektelgen-toesenish-zhaene-uya-salu-hattamasy\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#shektelgen-toesenish-zhaene-uya-salu-hattamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектелген төсеніш және ұя салу хаттамасы&lt;/span&gt;&lt;/a&gt;Шектелген төсеніш және ұя салу хаттамасы&lt;/h4&gt;\n&lt;p&gt;Аналықтар ресурстар тапшылығы моделі болып табылатын шектелген төсеніш және ұя салу хаттамасын (LBN) қолдану арқылы ерте өмірлік стреске (ELA) ұшырады, бұл модельде аналық пен күшіктер 7 күн бойы (P4-P11) ұя салу материалы шектелген және төсеніші аз жағдайда ұсталды. Бұл модель аналық күтімді бұзатыны бұрын дәлелденген. P4 күні аналық пен күшіктер екі 1x1 дюймдік мақта ұя материалы және бір ағаш массасынан жасалған бір реттік панасы бар стандартты үй торынан сым торлы едені және бір 1x1 дюймдік мақта материалы бар LBN торына ауыстырылды. Стандартты түрде өсірілген бақылау тобындағы аналық пен күшіктер жаңа стандартты үй торына көшірілді. Барлық тышқандардың азық пен суға тұрақты қолжетімділігі сақталды. Бір аптадан кейін (P11) күшіктер мен аналықтар толық төсеніші мен ұя материалы бар стандартты ұстау жағдайына қайтарылды. Аналықтың мінез-құлқы бір апта бойы күн сайын таңғы 8:00-ден 9:00-ге дейін және кешкі 4:00-ден 5:00-ге дейін 1 сағат бойы жазып алынды. Аналықтың мінез-құлқы P6 күні таңғы жазу кезінде аналықтың ұяда болған уақытының үлесін қолмен өлшеу арқылы бағаланды. Барлық күшіктер P21 күні анасынан ажыратылды.&lt;/p&gt;\n&lt;h4 id=\"hirurgiyalykh-aralasu\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#hirurgiyalykh-aralasu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хирургиялық араласу&lt;/span&gt;&lt;/a&gt;Хирургиялық араласу&lt;/h4&gt;\n&lt;p&gt;P19-21 күндері тышқандар оңға ұстау рефлексі жоғалғанға дейін оттегідегі 3% изофлюранмен наркозға түсіріліп, стереотаксикалық аппаратқа орналастырылды. Стереотаксис өсіп келе жатқан тышқандарға арналған шағын тіс тіреуіші және даму үстіндегі құлақ тіреуіштері сияқты қосымшалармен жабдықталды. Ауырсыну мен жайсыздықты азайту үшін операцияға дейін және одан кейін қабынуға қарсы стероидты емес препарат енгізілді. Тышқанның басы қырылып, бетадинмен және 70% этанолмен кезектесіп үш рет тазартылды. Бас терісі астына жергілікті жансыздандырғыш ретінде 2% лидокаин егілді. Бас терісінде шағын тілік жасалды. Вирустық инъекциялар үшін нысаналы аймақтың үстінен шағын тесік бұрғыланып, вирусы бар Гамильтон шприці дұрыс стереотаксикалық координатаға түсірілді. Вирус қысыммен минутына 100 нл жылдамдықпен енгізілді, ал инъекция аяқталғаннан кейін шприц орнында 5 минут қалдырылып, содан кейін бас сүйегінен баяу шығарылды. Барлық эксперименттер үшін жануарларға қалпына келуге мүмкіндік беріліп, содан кейін P21 күні ажыратылғанға дейін анасы мен бірге туған бауырларымен бірге таза үй торына қайтарылды. Вирус экспрессиясы немесе талшықтың орналасуы қате болған жағдайда жануарлар талдаудан шығарылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стереотаксикалық хирургия мидың нақты аймақтарына вирустық векторларды дәл жеткізу үшін қолданылады және ол анестезиямен мен операциядан кейінгі күтіммен бірге жүзеге асырылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Fiber photometry, optogenetics and CRH knockdown Фотометрия эксперименттері үшін тышқандарға базолатеральды амигдалаға (BLA) (алдыңғы-артқы (AP): -1.6, медиальды-дорсальды (ML): -3.20, дорсальды-вентральды (DV): -4.8) генетикалық кодталған кальций индикаторы GCaMP6s-ті экспрессиялайтын AAV (AAV9-CAG-GCaMP6s-WPRE-SV40, Addgene № 100844, 300 нл) бір жақты енгізілді. Оптогенетикалық эксперименттер үшін тышқандарға vmPFC-ге (AP 1.8, ML ±0.25, DV -2.9) екі жақты түрде AAV (тежеуші: AAV5-Ef1a-DIO-PdCO-mScarlet, Addgene № 198516, немесе қоздырушы: AAV8-nEF-Con/Foff 1.0-ChR2-EYFP, Addgene № 137163, 200 нл) немесе бақылау AAV-лары (тежеуші: AAV5-Ef1a-DIO-EYFP, Addgene 27056, қоздырушы: AAV8-Ef1a-DIO-mCherry, Addgene № 114471, 200 нл) енгізілді. vmPFC→BLA проекцияларын кеңінен тежеу үшін AAV5-hysn-PdCO-EGFP (Addgene № 198513, 200 нл) және AAV5-hysn-mCherry (Addgene № 114472, 200 нл) қолданылды. Бас сүйегінің өсуін өтеу үшін бір жақты (фотометрия, 400 µm, 0.50 NA; Thor Labs) немесе екі жақты (оптогенетика, 200 µm, Newdoon) оптикалық талшықтар PMA жаттығуына дейін 5 күн бұрын бөлек операцияда имплантацияланып, Metabond (Parkell) көмегімен бекітілді. Нокдаун эксперименттері үшін тышқандарға anti-CRH shRNA экспрессиялайтын cre-тәуелді AAV (AAV2/9-CMV-DIO-(mCherry-U6)-shRNA(CRH)-WPRE-hGHpA, BrainVTA, PT-12461, 200 нл) немесе скрэмбл-бақылау (AAV2/9-CMV-DIO-(mCherry-U6)-shRNA(scramble)-WPRE-hGHpA, BrainVTA, PT-2788, 200 нл) екі жақты енгізілді.&lt;/p&gt;\n&lt;p&gt;Viral tracing Тышқандарға BLA-ға (AP -1.6, ML -3.20, DV -4.8) 3:1 қатынасындағы cre-тәуелді AAV (AAVrg-CAG-FLEX-GFP, Addgene № 51502) пен cre-ге тәуелді емес AAV (AAV5-CAG-tdTomato, Addgene № 58462) қоспасынан 150 нл бір жақты енгізілді. Соңғысы ретроградты вирустың нысанаға сәтті жеткенін тексеру үшін қолданылды; егер экспрессия BLA-да болмаса, жануарлар деректерден шығарылды.&lt;/p&gt;\n&lt;h4 id=\"minez-khulykh-synakhtary\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#minez-khulykh-synakhtary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлық сынақтары&lt;/span&gt;&lt;/a&gt;Мінез-құлық сынақтары&lt;/h4&gt;\n&lt;p&gt;Платформа арқылы қашу Мінез-құлықты тексеру рәсімінің алдында тышқандар 3 күн бойы қолға үйретілді. Шартты рефлексті тудыру камерасы кездейсоқ тоқ соғу генераторына (Lafayette Instruments) қосылған торлы едені бар 18 x 30 см тордан тұрды. Камера арнайы жасалған акустикалық камерамен қоршалған және 50% Windex ерітіндісімен жұпар иістендірілген. Жұқа акрил платформа (қалыңдығы 1,3 см) еденнің 25% аумағын жапты. Тышқандардың камераны зерттеуін ынталандыру үшін еденнің астына ваниль немесе бадам сығындысы толтырылған екі кішкентай өлшеу ыдысы орналастырылды. Жасөспірімдік кезеңнің ортасында (P33-36) жаттығу өткізіліп, тышқандарға үш бастапқы 30 секундтық 4 кГц дыбыс (шартты сигнал, ШС) ұсынылды, содан кейін 2 секундтық табанға ток соғуымен (0,13 мА) бір уақытта аяқталатын тоғыз ШС ұсынылды. Тышқандар жаттығудан кейін 10 минут (pCREB экспрессиясы) немесе 1 сағат (Fos экспрессиясы) өткен соң перфузия жасалды және олардың миы жиналып, Fos иммунобояуы үшін өңделді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Платформа арқылы қашу
