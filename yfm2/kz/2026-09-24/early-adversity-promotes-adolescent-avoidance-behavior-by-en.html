 — бұл жануар жағымсыз ток соғудан қашу үшін дыбыстық сигналға жауап ретінде қауіпсіз платформаға өтуді үйренетін мінез-құлық сынағы.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық басқа тәжірибелер үшін тышқандарға қашу жадысын еске түсіру және көрсету қабілетін тексеру мақсатында келесі күні ток соғусыз алты ШС ұсынылды. Дыбыстар 80-нен 150 секундқа дейінгі кездейсоқ интервал ұзындықтарымен бөлінді. vmPFCVGLUT1+ жасушаларындағы CRH нокдауны үшін тышқандар Fos экспрессиясы үшін жаттығудан 1 сағат өткен соң перфузия жасалды.&lt;/p&gt;\n&lt;p&gt;Токқа сезгіштік Мінез-құлық реакциясын (вокализация, қашу немесе секіру) тудыру үшін қажетті минималды табанға ток соғу қарқындылығын бағалау үшін, наивті жасөспірім тышқандар PMA сияқты, бірақ платформасыз операнттық шартты камераға орналастырылды. Тышқандар 0,02 мА-дан басталып, 0,20 мА-ға дейін 0,02 қадаммен арттырылатын бір қатар табанға ток соғу әсеріне ұшырады. Белгілі бір тышқан бірінші рет вокализация жасаған, қашқан немесе секірген ток соғу амплитудасы тіркелді. Вокализация естілетін дыбыс шығару ретінде анықталды. Қашу секірусіз жылдам қадам жасау ретінде анықталды. Секіру жоғары жылдамдықтағы, көлденең секіру ретінде анықталды.&lt;/p&gt;\n&lt;p&gt;Ашық алаң сынағы Тышқандар сынақ бөлмесіне 10 минут бойы бейімделді, содан кейін пластикалық аренаға (50 x 50 x 40 см) орналастырылды. Локомоторлық белсенділік пен арена ортасында өткізілген уақыт веб-камера көмегімен 5 (наивті тышқандар) немесе 10 (оптогенетикалық және нокдаун манипуляциялары) минуттық тест кезінде тіркелді. Деректерді талдау үшін BioViewer бейне бақылау жүйесі қолданылса (наивтілер үшін), ал қалған деректер жиынтығын талдау үшін EZTrack75 пайдаланылды. Арена екі аймаққа бөлінді: ортасы (жалпы ауданның 25%) және шеті (жалпы ауданның 75%), бұл ретте әр аймақтағы уақыт пен кірулер саны, сондай-ақ жүріп өткен жалпы қашықтық тіркелді. Оптогенетикалық тәжірибелер үшін жазбалар 60 секундтық базалық кезеңмен басталды, одан кейін 30 секунд лазер қосу және 30 секунд лазер өшіру төрт циклі орындалды. Осы кезеңдерде әр аймақта өткізілген уақыт, аймаққа кіру саны және жүріп өткен жалпы қашықтық сандық түрде бағаланды және лазер қосу және өшіру кезеңдері арасында салыстырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ашық алаң сынағы бос ашық арена ортасында өткізілген уақыт бойынша кеміргіштердің жалпы қозғалыс белсенділігі мен үрей деңгейін өлшейді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Көтеріңкі крест тәрізді лабиринт Тышқандар сынақ бөлмесіне 10 минут бойы бейімделді. Тышқандар крест тәрізді лабиринттің ортасына мұрны ашық жеңге қаратылып орналастырылды. Локомоторлық белсенділік пен ашық және жабық жеңдерде, сондай-ақ арена ортасында өткізілген уақыт веб-камера көмегімен 5 минут бойы тіркелді. Аренаны екі ашық жеңдер жиынтығына, екі жабық және орталыққа бөлу арқылы деректерді талдау үшін Bioviewer қолданылды. Әр аймақтағы уақыт пен кірулер саны, сондай-ақ жүріп өткен жалпы қашықтық тіркелді.&lt;/p&gt;\n&lt;p&gt;Көтеріңкі дөңгелек лабиринт Тышқандар сынақ бөлмесіне 10 минут бойы бейімделді. Тышқандар нөл тәрізді көтеріңкі лабиринттің ашық жеңіне мұрны қаратылып жабық жеңге орналастырылды. Локомоторлық белсенділік пен ашық және жабық жеңдерде, сондай-ақ арена ортасында өткізілген уақыт веб-камера көмегімен 10 минут бойы тіркелді. Деректерді талдау үшін EZTrack пайдаланылды. Әр аймақтағы уақыт пен кірулер саны, сондай-ақ жүріп өткен жалпы қашықтық тіркелді.&lt;/p&gt;\n&lt;p&gt;Жаңа иіс сынағы 1-күні тышқандар бейімделу үшін 10 минут бойы бос пластикалық аренаға (50 x 50 x 40 см) орналастырылды. 2-күні тышқандар екі бірдей жұпар иістендірілген пластикалық сферамен (әрқайсысы үшін бірдей иіс: бадам немесе ваниль, тышқандар арасында теңдестірілген) аренаға қайта орналастырылды. Тышқандар сфералармен жалпы 20 с бойы өзара әрекеттескенше камерада қалдырылды. Егер тышқандар 10 минут ішінде осы критерийге жетпесе, олар шығарып тасталды. Өзара әрекеттесу сферадан мұрын бағытталған күйде 2 см қашықтықта болуы ретінде анықталды. 3-күні тышқандар аренаға 10 минутқа орналастырылды және бір сфера бастапқы иіспен, ал екіншісі жаңа иіспен жұпар иістендірілді (жануарлар арасында жақтары теңдестірілді). Өзара әрекеттесу уақыты бейнежазбалардан сандық түрде бағаланды. Топтар бірнеше, тәуелсіз жүргізілген мінез-құлық когорталарының біріктірілген нәтижелерін білдіреді.&lt;/p&gt;\n&lt;h4 id=\"midy-moeldirlendiru-zhaene-barlykh-midy-bejneleu\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#midy-moeldirlendiru-zhaene-barlykh-midy-bejneleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Миды мөлдірлендіру және барлық миды бейнелеу&lt;/span&gt;&lt;/a&gt;Миды мөлдірлендіру және барлық миды бейнелеу&lt;/h4&gt;\n&lt;p&gt;Тышқан миының тіні Adipo-Clear хаттамасының өзгертілген нұсқасына сәйкес дайындалды. Қысқаша айтқанда, тышқандарға мұз үстінде 20 мл фосфатты-тузды буфермен (PBS, Invitrogen), одан кейін 4% параформальдегидпен (PFA; Electron Microscopy Sciences) жүрекішілік перфузия жасалды. Содан кейін ми сыңарлары орта сызықтан шамамен 1 мм латеральді кесіліп, түні бойы 4℃ температурада 4% PFA ішінде кейінгі бекітуге қойылды. Келесі күні үлгілер B1n буферімен (1:1000 Triton X-100, 2% масс./об. глицин, 1:10 000 NaOH 10N, 0.02% натрий азиді) араластырылған метанол (MeOH, Fisher Scientific) көмегімен дәйекті түрде сусыздандырылды. Әрбір метанол градиенті (20%, 40%, 60% және 80%) шайқауыш (VWR) көмегімен 1 сағат бойы қолданылды. Содан кейін үлгілер 100% MeOH көмегімен әрқайсысы 1 сағаттан екі рет жуылды және кейін түні бойы 2:1 қатынасындағы дихлорметан (DCM) ерітіндісінде инкубацияланды. Келесі күні үлгілер 100% DCM ішінде әрқайсысы 1 сағаттан екі рет, содан кейін 100% MeOH ішінде біртіндеп ұзағырақ уақыт аралығында (30 минут, 45 минут, 1 сағат) үш рет жуылды. Содан кейін тін үлгілері 5:1 қатынасындағы H₂O₂ ерітіндісінде 4 сағат бойы ағартудан өткізілді. Регидратация метанол концентрациясы азаятын MeOH/B1n буферлік сериялық жуулар арқылы (80%, 60%, 40% және 20%) әрқайсысы 30 минуттан, соңында B1n буферінде 1 сағаттық соңғы жуу арқылы жүзеге асырылды. Пермеабилизация PTxWH буферіндегі 5% DMSO / 0.3 M глицин көмегімен 1 сағат бойы орындалды, содан кейін таза пермеабилизация ерітіндісінде қосымша 2 сағаттық инкубация жасалды. Содан кейін үлгілер PTxWH ішінде 30 минут шайылып, таза PTxWH буферінде түні бойы қалдырылды. Келесі күні тағы екі PTxWH жууы (1 сағат және сағаттар бойы) орындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тіндерді мөлдірлендіру әдісі (tissue clearing) жасушалық құрылымдар мен флуоресцентті маркерлерді сақтай отырып, мөлдір емес биологиялық органдарды үш өлшемді микроскопия үшін химиялық ерітінділердің көмегімен жарық өткізетін етуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Үлгілер PTxWH ішінде 1:300 сұйылтудағы бастапқы anti-RFP антиденесімен (Rockland Immunochemicals) 37℃ температурада үздіксіз шайқау арқылы 11 күн бойы инкубацияланды. Одан кейін PTxWH ішінде дәйекті жуулар орындалды: әрқайсысы 1 сағаттан екі рет және әрқайсысы 2 сағаттан екі рет, 37℃ температурада 2 күн бойы қосымша PTxWH алмасуларымен. Бастапқы антиденемен инкубациядан кейін үлгілер екінші ретті антиденемен 1:300 қатынасында (AlexaFluor 647, ThermoFisher Scientific) 37℃ температурада 8 күн бойы, екі күн ішінде тұрақты PTxWH жууларымен инкубацияланды. Антиденемен бояғаннан кейін үлгілер PBS ішінде екі рет (әрқайсысы 1 сағаттан), содан кейін екі рет 2 сағаттан шайылып, түні бойы қалдырылды. Сусыздандыру MeOH жууларының біртіндеп өсетін сериясын (20%, 40%, 60% және 80%) әрқайсысы 30 минуттан, содан кейін үш рет 100% MeOH жууын (30 минут, 1 сағат және 1.5 сағат) қамтыды. Үлгілер шайқауышта 2:1 қатынасындағы DCM ерітіндісінде түні бойы инкубацияланды. Келесі күні үлгілер 100% DCM ішінде әрқайсысы 1 сағаттан екі рет жуылды, содан кейін 100% дибензилэфирде (DBE) мөлдірлендірілді, мұнда DBE 4 сағаттан кейін жаңартылды. Мөлдірлендірілген үлгілер DBE ішінде бөлме температурасында қараңғыда сақталды, ал бейнелеу кемінде 24 сағат өткен соң орындалды.&lt;/p&gt;\n&lt;p&gt;Барлық миды бейнелеу. Ми үлгілері sCMOS камерасымен (Andor Neo) және 6 мм жұмыс қашықтығы бар суға батырылатын қалпақшасы бар 2x/0.5 NA объективімен (MVAPLAPO 2x) жабдықталған жарық-парақтық микроскоптың (Ultramicroscope II, LaVision Biotec) көмегімен бейнеленді. Кескін стектері 0.8x оптикалық масштабта түсіріліп, Imspector Microscope v28 бағдарламалық жасақтамасы арқылы басқарылды. Жасушаларды бейнелеу үшін 488 нм және 640 нм лазерлер (20% лазер қуаты) пайдаланылды. Сканерлеу 3 µm қадам өлшемімен орындалды, 640 нм арнасы үшін араластыру алгоритмі бар үздіксіз жарық-парақты сканерлеу әдісі (жазықтыққа 20 сатып алу) және 488-нм арнасы үшін көлденең сканерсіз қолданылды.&lt;/p&gt;\n&lt;h4 id=\"ex-vivo-elektrofiziologiyasy\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ex-vivo-elektrofiziologiyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ex vivo электрофизиологиясы&lt;/span&gt;&lt;/a&gt;Ex vivo электрофизиологиясы&lt;/h4&gt;\n&lt;p&gt;Хирургиялық араласу BLA аймағындағы vmPFCCRH+ аксондарын оптогенетикалық түрде стимуляциялау үшін біз жоғарыда сипатталған әдістерді қолдана отырып, сол жақ vmPFC ішіне 300 нл AAV8-Ef1a-double floxed-hChR2(H134R)-mCherry)WPRE-HGHpA (Addgene, 20297) енгіздік. Операциялар тіркеу жүргізуден 16–18 күн бұрын орындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптогенетика вирустық векторлар арқылы жарыққа сезімтал ақуыздарды мидың белгілі аймақтарына жеткізу арқылы нейрондардың белсенділігін жарық көмегімен басқаруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мидың өткір кесінділерін дайындау Мидың өткір кесінділерін дайындау үшін тышқандарды изофлуранмен анестезиялап, құрамында 2,5 мМ KCl, 1 мМ NaH2PO4, 26,2 мМ NaHCO3, 4 мМ MgCl2, 11 мМ глюкоза, 210,3 мМ сахароза, 0,5 мМ CaCl2 және 0,5 мМ натрий аскорбаты бар мұздай суық кесетін жасанды ми-жұлын сұйықтығы (ACSF) ерітіндісімен транскардиальды перфузия жасадық (95% O2/5% CO2 көпіршіктерімен).&lt;br /&gt;\nМи жылдам алынып, инъекция жасалған жарты шарға ипсилатеральды болатын жарты шардан Leica VT1200S вибротомын пайдаланып 300 мкм BLA кесінділері алынды.&lt;/p&gt;\n&lt;p&gt;Кесінділер құрамында 125 мМ NaCl, 2,5 мМ KCl, 26,2 мМ NaHCO3, 2 мМ MgCl2, 11 мМ глюкоза және 2 мМ CaCl2 бар қалыпты ACSF ерітіндісіне ауыстырылды (95% O2/5% CO2 көпіршіктерімен) және 34 ℃ температурада 34–40 минут ұсталды. Содан кейін кесінділердің бөлме температурасына дейін суыуына жағдай жасалды. Инъекция орнын тексеру үшін vmPFC қамтитын кесінділер де жиналды.&lt;/p&gt;\n&lt;p&gt;Кесінділер электрофизиологиясы Тіркеу жұмыстары бөлме температурасында қалыпты ACSF ортасында жүргізілді. BLA аймағы ақ зат жолдары мен vmPFCCRH+ аксондарының флуоресценциясы арқылы анықталды. Жасушалар инфрақызыл-дифференциалды интерференциялық контраст астында ×40 объектив көмегімен визуализацияланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Патч-кламп әдісі жасуша мембранасына жабысатын микроэлектродтың көмегімен жеке нейрондардың электрлік белсенділігін өлшеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әлеуетті фиксациялау режиміндегі эксперименттер құрамында 117 мМ цезий метансульфонаты, 20 мМ HEPES, 0,4 мМ ЭГТА, 2,8 мМ NaCl, 5 мМ TEA-Cl, 4 мМ Na2-АТФ және 0,4 мМ Na-ГТФ бар ішкі ерітіндімен толтырылған боросиликатты пипеткалар (5–7 МОм) көмегімен орындалды, pH цезий гидроксиді көмегімен 7,3 деңгейіне келтірілді (280–290 мосм).&lt;/p&gt;\n&lt;p&gt;Спонтанды қоздырушы және тежеуші тоқтар үздіксіз 3 минуттық жазбалар арқылы тіркелді, бұл ретте нейрондар сәйкесінше -70 мВ немесе 0 мВ әлеуетінде ұсталды. vmPFCCRH+ терминалдарын стимуляциялаудан туындаған қоздырушы тоқтар нейрондарды –70 мВ деңгейінде ұстап тұру және CoolLED pE-300Ultra жарық көзін пайдалана отырып, ×40 объектив арқылы 0,5 мс болатын 50-мВт көк (~470-нм) жарық импульсін беру арқылы алынды.&lt;/p&gt;\n&lt;p&gt;Жұптық импульстік жазбалар 100 мс аралықпен орналасқан бірдей жарық стимулдарын беру арқылы орындалды. Оптикалық стимуляцияға тұрақты синаптикалық жауап беретін нейрондар ғана туындаған тоқтардың деректер жинағына енгізілді. Тежеуші тоқтар осыған ұқсас түрде, бірақ нейрондарды 0 мВ деңгейінде ұстап тұрып тіркелді.&lt;/p&gt;\n&lt;p&gt;Деректер Multiclamp 700B күшейткіші және Digidata 1440A цифрлау құрылғысы (Axon Instruments) арқылы pClamp 10 (Molecular Devices) көмегімен жиналды. Жазбалар 10 кГц жиілікте таңдалып, туындаған жазбалар үшін 3 кГц және спонтанды жазбалар үшін 1 кГц жиілікте сүзгіден өткізілді.&lt;/p&gt;\n&lt;p&gt;Тізбектің қатарлас кедергісі және кіріс кедергісі эксперимент барысында 5 мВ тесттік импульске жауап ретінде сыйымдылықты өтпелі процесті және стационарлық ауытқуды өлшеу арқылы бақыланды. Тізбектің қатарлас кедергісі &amp;lt;25 МОм құрады, сеанс барысында 20%-дан артық өзгермеді және өтемделмеді.&lt;/p&gt;\n&lt;p&gt;Деректер Python v3.7 көмегімен талданды. Талдау он сыпырудың орташа мәніне негізделді. Тоқтар базалық ұстап тұру тоғына қатысты талданды. EPSC және IPSC жасушалар –70 мВ және 0 мВ деңгейінде әлеуеті фиксацияланған кездегі шыңды жауапты өлшеу арқылы сандық түрде бағаланды.&lt;/p&gt;\n&lt;h4 id=\"in-situ-gibridizaciya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#in-situ-gibridizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In situ гибридизация&lt;/span&gt;&lt;/a&gt;In situ гибридизация&lt;/h4&gt;\n&lt;p&gt;Тышқандардың жүрекшесіне 20 мл фосфатты-буферлік тұзды ерітінді (PBS, Invitrogen), содан кейін 4% параформальдегид (PFA; Electron Microscopy Sciences) арқылы перфузия жасалды. Содан кейін ми алынып, PFA ішіне 24 сағатқа салынды, ал оптималды кесу температурасындағы қоспаға (OCT) көміп, -80℃ температурада сақтамас бұрын 3 күн бойы 30% сахароза ерітіндісінде ұсталды. Қалыңдығы 20 мкм кесінділер криостат (Leica Microsystems) көмегімен дайындалып, Superfrost Plus предметтік шыныларына (Fisher Scientific) орнатылды. Vglut1 және Vgat таңбалау үшін біз кесінділерді RNAscope Multiplex Fluorescent Detection kit v2 (ACD Bio #323110) жиынтығы көмегімен, C3-тегі Vglut1 зондымен (ACD Bio #501101-C3) және C2-дегі Vgat зондымен (ACD Bio # 319191-C2) және сәйкесінше TSA Vivid Dye 570 және 620 бояғыштарымен өңдедік. Ретроградты түрде таңбаланған vmPFCCRH+→BLA жасушалары RNAscope хаттамасына сәйкес иммуногистохимия көмегімен боялды. PBS-те 3 рет 10 минуттан жуу алдында ми кесінділерінің айналасында кедергі жасау үшін гидрофобты қалам қолданылды, 0.5% Triton-X100 қосылған PBS-те 2 сағат бойы өткізгіштендіріліп, тауықтың GFP-ге қарсы біріншілік антиденелерін (1:2000; Aves Lab) қолдана отырып 4℃ температурада бір түнге инкубацияланды. Келесі күні кесінділер PBS-те жуылып, бөлме температурасында 2 сағат бойы есектің тауыққа қарсы Alexafluor 488 (1:1000; JacksonImmunoResearch) антиденелерінде инкубацияланды. DAPI-де 30 секундтық инкубациядан кейін шынылар жабын шынымен жабылып, Leica STELLARIS конфокальды микроскопында (Leica Microsystems) 20x ұлкейтумен суретке түсірілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Бұл әдіс мата үлгілеріндегі нақты РНК молекулаларын жоғары сезімталдықпен көруге мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Crh-shRNA және скрэмблдік бақылау арасындағы сәтті нокдаунды тексеру үшін біз кесінділерді RNAscope Multiplex Fluorescent Detection kit v2 (ACD Bio #323110) жиынтығы арқылы, C2-дегі Crh зондымен (ACD Bio #316091-C2) және TSA Vivid Dye 620 бояғышымен өңдедік. mCherry таңбалауы RNAscope хаттамасына сәйкес иммуногистохимия көмегімен орындалды. PBS-те үш рет жуылғаннан кейін кесінділер 0.5% Triton-X100 қосылған PBS-те (PBST) 2 сағат бойы өткізгіштендіріліп, PBST-те сұйылтылған қоянның RFP-ге қарсы біріншілік антиденелерімен (1:2000; Rockland Immunochemicals) 4℃ температурада бір түнге инкубацияланды. Келесі күні кесінділер PBS-те 10 минуттан 3 рет жуылып, бөлме температурасында 2 сағат бойы Cy3 конъюгацияланған есектің қоянға қарсы екіншілік антиденелерінде (1:1000; JacksonImmuno Research) инкубацияланды. Фторомунт көмегімен орнату алдында 30 секунд бойы DAPI қолданылды. Суреттер Leica STELLARIS конфокальды микроскопы көмегімен 20x ұлкейтуде алынды. Барлық талдаулар ImageJ бағдарламасында жасалды, ал Vglut1 және Vgat-тың AAVrg CRH+ жасушаларымен қабаттасуы және mCherry оң жасушалар ішіндегі Crh экспрессия деңгейлері ImageJ 1.54f нұсқасы арқылы сандық түрде бағаланды.&lt;/p&gt;\n&lt;p&gt;mPFC-тегі Vglut1+ және Vglut1- жасушаларындағы Crh экспрессиясын сандық түрде бағалау үшін біз кесінділерді RNAscope жиынтығы арқылы, C2-дегі Crh зонды (ACD Bio #316091-C2) және C1-дегі Vglut1 зонды (ACD Bio #501101) пен сәйкесінше TSA Vivid Dye 620 және 650 бояғыштарын қолдана отырып өңдедік. Суреттер Leica STELLARIS конфокальды микроскопы көмегімен 20x ұлкейтуде алынды. Барлық талдаулар ImageJ бағдарламасында орындалды, атап айтқанда Crh экспрессиялайтын жасушалардың саны, сондай-ақ олардың экспрессия деңгейлері — Vglut1+ және Vglut1- жасушаларына шаққанда есептеліп бағаланды. Сандық бағалау 20x кезінде алынған суреттерде жүргізілді. Мысал суреттер 63x кезінде алынды.&lt;/p&gt;\n&lt;h4 id=\"gistologiya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#gistologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гистология&lt;/span&gt;&lt;/a&gt;Гистология&lt;/h4&gt;\n&lt;p&gt;Тышқандардың жүрекшесіне 20 мл фосфатты-буферлік тұзды ерітінді (PBS, Invitrogen), содан кейін 4% параформальдегид (PFA; Electron Microscopy Sciences) арқылы перфузия жасалды. Содан кейін ми алынып, PFA ішіне 24 сағатқа салынды, ал оптималды кесу температурасындағы қоспаға (OCT) көміп, -80℃ температурада сақтамас бұрын 3 күн бойы 30% сахароза ерітіндісінде ұсталды. Қалыңдығы 60 мкм кесінділер криостат көмегімен дайындалды. Барлық эксперименттер үшін кесінділер PBST-те 2 сағат бойы өткізгіштендіріліп, PBST-те сұйылтылған біріншілік антиденелермен 4°C температурада бір түнге инкубацияланды. Келесі күні кесінділер PBS-те 5 минуттан 3 рет жуылып, бөлме температурасында PBST-те сұйылтылған екіншілік антиденелермен 2 сағат бойы инкубацияланды, PBS-те 1:4000 қатынасында сұйылтылған DAPI-де инкубацияланып, фторомунт көмегімен предметтік шыныға орнатылып, жабын шынымен жабылды. Суреттер Leica DM6 сканерлеуші микроскопы немесе Leica STELLARIS конфокальды микроскопы көмегімен алынды.&lt;/p&gt;\n&lt;p&gt;Fig 2A, Fig 3D, S 3A, Fig S4A,B, D, Fig S5A-D, Fig S7B,C үшін тауықтың GFP-ге қарсы біріншілік (1:2000; Aves Lab) және есектің тауыққа қарсы Alexafluor 488 (1:1000; Jackson Immunoresearch) антиденелері қолданылды. Fig S 3C үшін қоянның pCREB-ке қарсы (1:500; Cell Signaling Technology) біріншілік антиденесі және Cy3 конъюгацияланған есектің қоянға қарсы екіншілік антиденесі (1:100; JacksonImmuno Research, #711-165-152) қолданылды. Fig 3D, Fig S5A-D, Fig 5F,M үшін қоянның Fos-қа қарсы (1:1000; Synaptic Systems) біріншілік антиденесі және есектің қоянға қарсы Alexa-Fluor 647 екіншілік антиденесі (1:1000; JacksonImmuno Research, #711-605-152) қолданылды. Fig 1M, 4C, 5A,H, S2A, B, Fig S6A-C, Fig S8A,L, Fig S10A,B үшін қоянның RFP-ге қарсы (1:2000; Rockland Immunochemicals) және Cy3 конъюгацияланған есектің қоянға қарсы екіншілік антиденесі (1:1000, JacksonImmuno Research) қолданылды.&lt;/p&gt;\n&lt;h4 id=\"sandykh-zhaene-statistikalykh-taldau\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#sandykh-zhaene-statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;САНДЫҚ ЖӘНЕ СТАТИСТИКАЛЫҚ ТАЛДАУ&lt;/span&gt;&lt;/a&gt;САНДЫҚ ЖӘНЕ СТАТИСТИКАЛЫҚ ТАЛДАУ&lt;/h4&gt;\n&lt;p&gt;Еркек және ұрғашы тышқандар эксперименттік топтарға кездейсоқ түрде бөлініп, әр топқа екі жыныстың да енетіні қамтамасыз етілді. Манипуляция үшін эксперименттік жағдайлар (мысалы, бақылау және опсин) жасы мен туыстығы бойынша сәйкес келетін бақылау топтарын құру мақсатында бір аналықтан туған бауырлас жануарлар арасында бөлінді. Деректерді жинау, сондай-ақ мінез-құлық видеолары мен суреттерін талдауды эксперименттік топтардан хабарсыз зерттеушілер жүзеге асырды. Мінез-құлық деректері автоматтандырылған талдау конвейерлерін қолдана отырып, эксперименттік жағдайлардан хабарсыз түрде талданды. Суреттерді қолмен талдау кезінде зерттеушілер эксперименттік әсердің қандай екенін білмеді.&lt;/p&gt;\n&lt;p&gt;Барлық статистикалық сынақтар GraphPad Prism (v10.3.1) немесе MATLAB (vR2022a, Mathworks) көмегімен орындалды. Біздің іріктеме көлемдеріміз бұрынғы жарияланымдарда көрсетілгендерге ұқсас; алайда олар статистикалық әдістермен алдын ала анықталған жоқ. Жиынтық графиктер орташа мән ± орташаның стандартты қателігін көрсетеді. Қалыптылықты анықтау үшін Шапиро-Уилки тесттері қолданылды, ал егер қалыпты емес деп табылса, параметрлік емес тесттер қолданылды. Статистикалық тесттер мен мәндер әр суреттің астындағы жазуда көрсетілген. Жұптық t-тесттер екі жақты болды және айырмашылықтар сенімді деп саналды.&lt;/p&gt;\n&lt;h4 id=\"minez-khulykhtykh-taldau\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#minez-khulykhtykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлықтық талдау&lt;/span&gt;&lt;/a&gt;Мінез-құлықтық талдау&lt;/h4&gt;\n&lt;p&gt;РМА-ның жоғары ажыратымдылықтағы бейнелері Chameleon3 USB камераларының (Teledyne FLIR) көмегімен 50 Гц жиілікте жиналды, бейнелердегі нүктелерді қадағалау DeepLabCut v2.077 жүйесінде орындалды, ал мінез-құлық BehaviorDEPOT v1.3b78 көмегімен талданды. Платформадағы уақытты, платформаға кіру латентті кезеңін, қатып қалуды (freezing) және қозғалыс жылдамдығын сандық бағалау үшін арнайы MATLAB коды пайдаланылды. Ашық алаң, жоғары көлбеу лабиринт, жаңа иіс тесттері және RTPA веб-камера арқылы түсірілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;DeepLabCut және BehaviorDEPOT — бұл бейнежазбалардағы жануарлардың мінез-құлқын автоматты түрде қадағалауға және сандық талдауға арналған компьютерлік көру технологияларына негізделген заманауи бағдарламалық құралдар.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жаңа иіс эксперимент кезінде нақты уақыт режимінде тіркелді. Ашық алаң, жоғары көлбеу лабиринт және RTPA автоматтандырылған бейне-бақылау бағдарламалық жасақтамасы BioViewer арқылы қадағаланды.&lt;/p&gt;\n&lt;h4 id=\"rma-kezindegi-talshykhty-optikalykh-fotometriya-zhazbalary\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#rma-kezindegi-talshykhty-optikalykh-fotometriya-zhazbalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РМА кезіндегі талшықты-оптикалық фотометрия жазбалары&lt;/span&gt;&lt;/a&gt;РМА кезіндегі талшықты-оптикалық фотометрия жазбалары&lt;/h4&gt;\n&lt;p&gt;Жануарлар жазуға дейін 1 күн бұрын оптикалық сымға бейімделді. РМА жаттығуы мен оны еске түсіру кезінде біз коммерциялық талшықты-оптикалық фотометрия жүйесі және RZ10x құлыптау күшейткішін (Tucker David Technologies) басқаратын ілеспе Synapse бағдарламалық жасақтамасы көмегімен BLA ішіндегі GCaMP6s және бақылау флуоресценциясын бір уақытта бейнеге түсірдік. Екі қоздыру толқын ұзындығы (465 және 405 нм) 211 және 566 Гц жиілікте модуляцияланды, сүзілді және флуоресцентті миникуб (Doric Lenses) арқылы біріктірілді. Біріктірілген қоздыру сәулесі 405 нм ядросы, 0,37 NA төмен флуоресцентті арқылы жеткізілді, төмен флуоресцентті сигнал миникуб арқылы жиналды және фемтоватттық фотоқабылдағышқа (Newport, 2151 моделі, күшейту DC LOW күйге келтірілген) фокусталды. Жарық диодтарының қуаты жүйе 465 нм және 405 нм арналары үшін сәйкесінше 8- және жарық бірліктерін алатындай етіп реттелді. Флуоресценция 1017 Гц жиілікте дискреттелді және процессші арқылы демодуляцияланды. Эксперименттің басталуы мен аяқталуы және әрбір тонның басталу уақыты белгілері арнайы MATLAB эксперимент дизайнерінен (MathWorks) жіберілген транзистор-транзисторлық логикалық (TTL) импульстері көмегімен жиналды. Сигналдар Synapse бағдарламалық жасақтамасы арқылы сақталды және талдау үшін MATLAB бағдарламасына экспортталды.&lt;/p&gt;\n&lt;h4 id=\"talshykhty-optikalykh-fotometriyany-taldau\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#talshykhty-optikalykh-fotometriyany-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талшықты-оптикалық фотометрияны талдау&lt;/span&gt;&lt;/a&gt;Талшықты-оптикалық фотометрияны талдау&lt;/h4&gt;\n&lt;p&gt;Деректер MATLAB бағдарламасында арнайы жазылған конвейер (pipeline) көмегімен алдын ала өңделді. Талдау алдында сигнал 10 есе төмен дискреттелді. polyfit функциясын пайдалана отырып, изосбестикалық сигнал 405 нм сигналына сәйкестендірілді және бұл қисық 405 нм каналынан шегерілді. Талшықты-оптикалық фотометрия мен мінез-құлық деректерін сәйкестендіру үшін әрбір мінез-құлық кадрының қай фотометрия кадрына сәйкес келетінін анықтау үшін әрбір TTL импульсі арасында сызықтық интерполяцияны пайдалана отырып, сәйкестендіру кестесі жасалды. Z-бағалары тонның басталуына қатысты -5 пен 0 с аралығындағы бастапқы кезеңді пайдалана отырып есептелді. Жеке жануар үшін барлық іздердің орташа мәні есептелді және талдау үшін пайдаланылды. Графиктерді жасау үшін әрбір орташа із әр 0,5 с сайын мәндерді орташалау арқылы тегіселді, ал жануарлар бойынша тегіселген іздердің орташа мәні ± стандартты қателігі көрсетілді. Соққыға жауап беру үшін қисық астындағы аумақ (AUC) және шыңдық z-бағасы сәйкесінше басталғаннан кейін 0–15 с және 0–3 с аралығында сандық түрде бағаланды. Өшу жылдамдығы соққыға берілген шыңдық жауаптан экспоненциалды қисықты сәйкестендіру арқылы өлшенді, өшу 1/τ ретінде сандық түрде көрсетіледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Z-бағасы сигнал деңгейін бастапқы фонға қатысты стандарттайды, ал AUC уақыт бойынша жауаптың жалпы қарқындылығын қорытындылайды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rma-kezindegi-optogenetikalykh-manipulyaciya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#rma-kezindegi-optogenetikalykh-manipulyaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РМА кезіндегі оптогенетикалық манипуляция&lt;/span&gt;&lt;/a&gt;РМА кезіндегі оптогенетикалық манипуляция&lt;/h4&gt;\n&lt;p&gt;Барлық эксперименттерге дейін тышқандар оптикалық сымға (200 мкм ядро, 0.22 NA, Doric Lenses) бейімделді. РМА-ны еске түсіру кезінде немесе оқытудың алғашқы үш базалық тоны кезінде ешқандай оптогенетикалық манипуляция жасалмады. Тексеріп тежеу (ингибирлеу) эксперименттері үшін vmPFCCRH+ проекцияларының BLA-ға бағытталған бөліктері BehaviorDEPOT қорқыныш шартты рефлекстерін зерттеушісінің MATLAB қолданбасы арқылы басқарылатын көк лазермен (473 нм, тұрақты; SLOC Lasers) соққы кезеңінде және соққы аяқталғаннан кейін 13 с ішінде (барлығы 15 с) фототежелді. Бұл LBN тышқандары осы кезеңде соққыға жауап ретінде BLA-да жоғары белсенділік көрсеткенін көрсететін жаппай фотометрия нәтижелері негізінде таңдалды. Имплантацияға дейінгі оптикалық талшық арқылы өлшенген берілген жарық қуаты 10 мВт жарық шығысына орнатылды. Стимуляция эксперименттері үшін vmPFCCRH+ проекцияларының BLA-ға бағытталған бөліктері сол жарық қуаты бар көк лазермен (473 нм, 15 Гц, 50 мс импульс ені; SLOC Lasers) фотоқоздырылды.&lt;/p&gt;\n&lt;h4 id=\"ashykh-alangdaghy-optogenetikalykh-manipulyaciya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#ashykh-alangdaghy-optogenetikalykh-manipulyaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ашық алаңдағы оптогенетикалық манипуляция&lt;/span&gt;&lt;/a&gt;Ашық алаңдағы оптогенетикалық манипуляция&lt;/h4&gt;\n&lt;p&gt;РМА-ны еске түсіруден кейінгі күні жануарлар жеке бөлмеде 10 минут бойы бейімделді. Көк лазерге қосқаннан кейін (тежеу: 473 нм, тұрақты; стимуляция: 473 нм, 15 Гц) тышқандар ашық алаң аренасына орналастырылды. Оптогенетикалық манипуляция 1 минуттық базалық кезеңнен кейін басталды, одан кейін сегіз кезектесетін 30 секундтық лазерді қосу/өшіру кезеңдері орындалды және стимуляциясыз 60 секундтық кезеңмен аяқталды, сеанстың жалпы ұзақтығы 10 минутты құрады.&lt;/p&gt;\n&lt;h4 id=\"midy-tuegeldej-taldau\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#midy-tuegeldej-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Миды түгелдей талдау&lt;/span&gt;&lt;/a&gt;Миды түгелдей талдау&lt;/h4&gt;\n&lt;p&gt;Ми бойынша жасушалар тығыздығын туралау және сандық бағалау үшін DeepCOUNT DeepCOUNT79 талдау құбыры пайдаланылды. Қысқартып айтқанда, әрбір мидың 640 нм каналынан алынған мидың кескіндерінің стектері Ai14 көмегімен оқытылған модель арқылы TrailMap ішінде сегментацияланды. Кескіндер 488 нм автофлуоресценция каналы арқылы elastix және transformix көмегімен үлгі мимен тіркелді. Түрлендірілген ықтималдық картасының 3D максимумын анықтау үшін MATLAB (Mathworks) қолданылды. Бірнеше пиксельден тұратын кез келген максимусты әр жасуша үшін бір пиксельге дейін қысқарту үшін байланысқан компоненттерді талдау қолданылды.&lt;/p&gt;\n&lt;h4 id=\"zhasushalardy-sandykh-baghalau\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#zhasushalardy-sandykh-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасушаларды сандық бағалау&lt;/span&gt;&lt;/a&gt;Жасушаларды сандық бағалау&lt;/h4&gt;\n&lt;p&gt;Аймақтық CRH+ жасушаларының тығыздығы MATLAB жүйесінде әрбір ми аймағындағы белгіленген пиксельдердің (яғни жасушалардың) санын санау, содан кейін бұл пиксель санын аймақтағы пиксельдердің жалпы санына бөлу арқылы сандық түрде бағаланды. Аймақтар LSFM атласының сығылған нұсқасы арқылы анықталды, мұнда максималды түйіршіктілік мидың кіші аймақтарын дәл емес сандық бағалауға әкелетін тіркеудегі шамалы айырмашылықтарды ескеру қажеттілігімен теңдестірілді. Бұл атлас біздің деректерімізде көрінетін тіннің мөлшеріне сәйкес келу үшін алдыңғы және артқы ұштарында кесілді. Ақ зат жолдары, қарыншалық жүйе, мишық және иіс сезу пиязшығы талдаудан шығарылды. Статистикалық талдау үшін біз BLA-ға проекцияланатыны белгілі және CRH+ жасуша популяцияларын қамтитын аймақтарға назар аудардық. Ми аймақтары арасындағы айтарлықтай айырмашылықтарды анықтау үшін post-hoc көптік салыстыру түзетуі бар екі факторлы қайталанатын өлшемдер ANOVA орындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Екі факторлы қайталанатын өлшемдер ANOVA — бұл екі фактордың бір объектке әртүрлі уақытта немесе жағдайларда тигізетін әсерін бағалауға арналған статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nakhty-uakhyttaghy-oryndy-unatatynyn-anykhtau-testi-kezindegi-optogenetikalykh-manipulyaciya\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#nakhty-uakhyttaghy-oryndy-unatatynyn-anykhtau-testi-kezindegi-optogenetikalykh-manipulyaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нақты уақыттағы орынды ұнататынын анықтау тесті кезіндегі оптогенетикалық манипуляция&lt;/span&gt;&lt;/a&gt;Нақты уақыттағы орынды ұнататынын анықтау тесті кезіндегі оптогенетикалық манипуляция&lt;/h4&gt;\n&lt;p&gt;vmPFCCRH+ проекцияларының оптогенетикалық манипуляциясы PMA-дан тыс мінез-құлыққа әсер етпегенін анықтау үшін барлық оптогенетикалық эксперименттер үшін PMA алынғаннан кейінгі күні RTPP тестілері орындалды. Көк жарыққа қосқаннан кейін (тежеу: 473 нм; тұрақты; стимуляция: 473 нм; 15 Гц) тышқандар орынды таңдау камерасына (68 см × 23 см) 20 мин бойы орналастырылды. Бірінші 10 мин базалық кезеңде тышқандарға аппаратты еркін зерттеуге рұқсат етілді, ал қозғалысты қадағалау және камераның қай жартысын ұнататынын анықтау үшін BioViewer бағдарламалық құралы пайдаланылды. Бұл камераның қай жартысы лазерлік стимуляцияны немесе тежеуді алатынын анықтау үшін қолданылды. Келесі 10 мин ішінде лазер сәулесі камераның ұнатылған жағына (стимуляция) немесе ұнатылмаған жағына (тежеу) берілді. Нәтижелер бастапқы деңгейден пайыздық өзгеріс ретінде есептелді (тест - база / база × 100). Код және деректердің қолжетімділігі. Осы мақалада хабарланған барлық деректер сұрау бойынша жауапты тұлға тарапынан беріледі. Мінез-құлық деректерін талдау үшін пайдаланылатын BehaviorDEPOT https://github.com/DeNardoLab/BehaviorDEPOT мекенжайында қолжетімді. Ми жасушаларының тығыздығын талдау үшін пайдаланылатын DeepCOUNT https://github.com/DeNardoLab/DeepTraCE мекенжайында қолжетімді. Барлық басқа түпнұсқа код Github сайтында орналастырылған және жарияланған күнінен бастап көпшілікке қолжетімді. Осы мақалада хабарланған деректерді қайта талдау үшін қажетті кез келген қосымша ақпаратты сұрау бойынша жауапты тұлғадан алуға болады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en-f4.jpg\" alt=\"4-сурет. vmPFC-CRH+ → BLA жолын тежеу жасөспірімдерде ELA туындататын қашу мінез-құлқын азайтады, бірақ ересектерде емес\" /&gt;&lt;/p&gt;\n&lt;p&gt;*4-сурет. vmPFC-CRH+ → BLA жолын тежеу жасөспірімдерде ELA туындататын қашу мінез-құлқын азайтады, бірақ ересектерде емес. (a) Жасөспірімдер мен ересектер топтарына арналған эксперименттік уақыт шкаласы. (b) Жаттығу кезінде тоқ соғу кезеңінде және тоқ соққаннан кейін 13 секунд ішінде тұрақты лазерлік стимуляциясы бар PMA сызбалық бейнесі (Adol. SR cont., n=12; SR PdCO n=12; LBN cont., n=15, LBN PdCO, n=17; Adult SR cont., n=5; SR PdCO n=7; LBN cont., n=8, LBN PdCO, n=7 тышқандар). (c) CRH-Cre тышқандарының BLA аймағындағы AAV-DIO-PdCO экспрессиясының және екі жақты талшықты-оптикалық импланттардың схемасы мен үлгі суреттері. (d) Тоқ соғуға дейінгі базалық деңгейге және сеанстың соңғы төрт тонына орташаланған PMA жаттығуы кезіндегі жасөспірімдердің сәтті әрекеттерінің үлесі (үш факторлы дисперсиондық талдау: әрекет эффектісі F1,52=91,51, P&amp;lt;0,0001; өсіру эффектісі F1,52=1,74, P=0,193; опсин эффектісі F1,52=0,86, P=0,360; әрекет x өсіру өзара әсері F1,52=0,062, P=0,804; әрекет x опсин өзара әсері F1,52=0,028, P=0,869; өсіру x опсин өзара әсері F1,52=0,0031, P=0,956; әрекет x өсіру x опсин F1,52=0,25, P=0,620). (e-g) PMA еске түсіру кезіндегі мінез-құлық көрсеткіштері. (e) Сеанс бойынша орташаланған платформадағы уақыт үлесі (Тьюкидің пост-хок тестімен екі факторлы дисперсиондық талдау: өсіру эффектісі F1,52=2,88, P=0,10; опсин эффектісі F1,52=4,98, P=0,03; өзара әсер ету эффектісі F1,52=8,95, P=0,004). (f) Тон басталғаннан кейін платформаға кірудің латенттілігі (Тьюкидің пост-хок тестімен екі факторлы дисперсиондық талдау: өсіру эффектісі F1,52=0,029, P=0,867; опсин эффектісі F1,52=3,56, P=0,065; өзара әсер ету эффектісі F1,52=10,20, p=0,0024). (g) Тон кезінде қатып қалу уақытының үлесі (Тьюкидің пост-хок тестімен екі факторлы дисперсиондық талдау: өсіру эффектісі F1,52=9,47, P=0,0033; опсин эффектісі F1,52=2,33, P=0,133; өзара әсер ету эффектісі F1,52=0,0026, P=0,960). (h) Тоқ соғуға дейінгі базалық деңгейге және сеанстың соңғы төрт тонына орташаланған PMA жаттығуы кезіндегі ересектердің сәтті әрекеттерінің үлесі (үш факторлы дисперсиондық талдау: әрекет эффектісі F1,46=52,40, P&amp;lt;0,0001; өсіру эффектісі F1,46=0,21, P=0,652; опсин эффектісі F1,46=0,49, P=0,489; әрекет x өсіру өзара әсері F1,46=0,09, P=0,765; әрекет x опсин өзара әсері F1,46=1,93, P=0,171; өсіру x опсин өзара әсері F1,46=1,28, P=0,264; әрекет x өсіру x опсин F1,46=0,14, P=0,709). (i-k) PMA еске түсіру кезіндегі мінез-құлық көрсеткіштері. (i) Сеанс бойынша орташаланған платформадағы уақыт үлесі (екі факторлы дисперсиондық талдау: өсіру эффектісі F1,23=0,56, P=0,460; опсин эффектісі F1,23=0,07, P=0,788; өзара әсер ету эффектісі F1,23=0,01, P=0,921). (j) Тон басталғаннан кейін платформаға кірудің латенттілігі (екі факторлы дисперсиондық талдау: өсіру эффектісі F1,23=0,052, P=0,822; опсин эффектісі F1,23=1,16, P=0,293; өзара әсер ету эффектісі F1,23=0,125, P=0,27). (k) Тон кезінде қатып қалу уақытының үлесі (екі факторлы дисперсиондық талдау: өсіру эффектісі F1,23=2,72, P=0,113; опсин эффектісі F1,23=0,356, P=0,557; өзара әсер ету эффектісі F1,23=2,16, P=0,156). Барлық деректер нүктелері биологиялық қайталауларды білдіреді. Деректер орташа ± орташаның стандартты қатесі ретінде көрсетілген; *P&amp;lt;0,05, **P&amp;lt;0,01, **&lt;em&gt;P&amp;lt;0,001. Үшбұрыштар ұрғашыларды, ал шеңберлер еркектерді білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-24/early-adversity-promotes-adolescent-avoidance-behavior-by-en.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#CC8400\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ерте стресс&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пен жасөспірім&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қорқынышы&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#F2A93B\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LBN моделі мен&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оптогенетика&lt;/text&gt;&lt;path stroke=\"#CC8400\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#CC8400\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\"
