қалай қалпына келтіруге болады","text":"&lt;p&gt;Жаңа тәсіл онкология терапиясы кезінде Т-жасушалардың шаршап қалуына жол бермейді.&lt;/p&gt;\n","links":[{"url":"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-card.jpg"},"content":{"title":"Альцгеймер кезіндегі жасушааралық зақымдану қалай таралады","text":"&lt;p&gt;Токсикалық ақуыздар көпіршіктер арқылы жасушадан жасушаға беріліп, нейрондарды зақымдайды.&lt;/p&gt;\n","links":[{"url":"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s-card.jpg"},"content":{"title":"Афантазия: ми&amp;nbsp;адамдары неге бейнелей алмайды?","text":"&lt;p&gt;Ғалымдар саналы түрде елестете алмайтын адамдардың ми құрылымындағы ерекшеліктерді тапты.&lt;/p&gt;\n","links":[{"url":"2026-09-23/congenital-aphantasia-reveals-frontotemporal-and-cingulate-s.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-card.jpg"},"content":{"title":"Ми&amp;nbsp;визуалды қыртыстың терең қабаттарында шындықты кейіннен жинақтайды","text":"&lt;p&gt;Қазір көріп тұрған нәрсеміз болашақ оқиғаларға байланысты. 7Т МРТ көмегімен жасалған тәжірибе мидың қабылдауды қалай түзететінін көрсетті.&lt;/p&gt;\n","links":[{"url":"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-23/how-occam-s-razor-guides-human-decision-making-card.jpg"},"content":{"title":"Ми&amp;nbsp;қарапайым түсіндірмелерді қалай таңдайды","text":"&lt;p&gt;Адамдар анық емес деректермен жұмыс істегенде Оккам ұстарасын басшылыққа алып, қарапайым гипотезаларды жөн көреді.&lt;/p&gt;\n","links":[{"url":"2026-09-23/how-occam-s-razor-guides-human-decision-making.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Шығарылым &amp;middot; 22.09.2026","url":"2026-09-22/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h-card.jpg"},"content":{"title":"Ми&amp;nbsp;танысты жаңадан қалай ажыратады: жадтың жасушалық коды табылды","text":"&lt;p&gt;Ғалымдар алғаш рет адам миындағы ұқсас естеліктерді бөлектейтін жеке нейрондардың жұмысын тіркеді.&lt;/p&gt;\n","links":[{"url":"2026-09-22/cellular-code-for-mnemonic-pattern-separation-in-the-human-h.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-card.jpg"},"content":{"title":"Ми&amp;nbsp;нейрондары әлеуметтік ережелерді қалай өңдейді","text":"&lt;p&gt;Ғалымдар әлеуметтік нормаларды бағалау кезінде мидың жекелеген нейрондарының жұмысын алғаш рет тіркеді.&lt;/p&gt;\n","links":[{"url":"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-card.jpg"},"content":{"title":"Жасырын сақина тәрізді РНК молекулалары қауіпті нейродегенеративті ауруды көрсетеді","text":"&lt;p&gt;Мидағы маңызды ақуыздың бұзылуы аномальді сақина тәрізді РНК-лардың жиналуын бастайды, бұл ерте диагностикаға жол ашады.&lt;/p&gt;\n","links":[{"url":"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures-card.jpg"},"content":{"title":"Миымыз түсініксіз өнерді қалай ләззатқа айналдырады","text":"&lt;p&gt;Ғалымдар қызығушылықтан бастап кенеттен түсіну мен қуанышқа дейінгі жолды қадағалады.&lt;/p&gt;\n","links":[{"url":"2026-09-22/tracing-the-epistemic-arc-distinct-physiological-signatures.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-card.jpg"},"content":{"title":"Гормондар аутизм және мидың дамуы гендеріне қалай әсер етеді","text":"&lt;p&gt;Ғалымдар эстрадиолдың аутизммен және ми дамуының бұзылуымен байланысты 36 генге әсерін зерттеп көрді.&lt;/p&gt;\n","links":[{"url":"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio-card.jpg"},"content":{"title":"Қауіпті амебаны анықтайтын жаңа жылдам тест әдісі","text":"&lt;p&gt;Сирек кездесетін қауіпті амебаны кәдімгі клиникаларда тез анықтауға мүмкіндік беретін алғашқы экспресс-тест жасалды.&lt;/p&gt;\n","links":[{"url":"2026-09-22/development-of-a-novel-loop-mediated-isothermal-amplificatio.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery-card.jpg"},"content":{"title":"Ғалымдар кодтаушы сақиналы РНК-лардың бар екенін алғаш рет дәлелдеді","text":"&lt;p&gt;Ғалымдар зертханада ДНК-сыз өмір сүретін және ақуыз кодтайтын жұмбақ сақиналы РНК бар екенін дәлелдеді.&lt;/p&gt;\n","links":[{"url":"2026-09-22/experimental-characterization-of-zeta-viruses-and-discovery.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic-card.jpg"},"content":{"title":"Үзілісті ұйқы мидағы эпилепсиялық дүмпулерді қалай қоздырады","text":"&lt;p&gt;Ұйқы кезіндегі микрооянулардың ұстама ауқымын кеңейтпей, нейрон белсенділігін неліктен арттыратыны анықталды.&lt;/p&gt;\n","links":[{"url":"2026-09-22/sleep-fragmentation-drives-local-network-specific-epileptic.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/plscr1-inhibits-murine-norovirus-entry-card.jpg"},"content":{"title":"Plscr1 ақуызы тышқан норовирусының енуін тежейді","text":"&lt;p&gt;Ғалымдар норовирустың жасушаға енуіне жол бермейтін маңызды жасушалық ақуызды тапты.&lt;/p&gt;\n","links":[{"url":"2026-09-22/plscr1-inhibits-murine-norovirus-entry.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple-card.jpg"},"content":{"title":"Егеуқұйрықтар қара аққулардан қалай қашып, джекпот іздейді","text":"&lt;p&gt;Сирек әрі қауіпті оқиғалар жануарлардың таңдауына күнделікті рутинадан да қатты әсер етеді.&lt;/p&gt;\n","links":[{"url":"2026-09-22/specific-sensitivity-to-rare-and-extreme-events-quasi-comple.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-card.jpg"},"content":{"title":"Тұмау мида із қалдырады: LRRK2 мутациясы ақуыз өзгерістерін қалай қоздырады","text":"&lt;p&gt;Бұрын өткерген тұмау LRRK2 мутациясы бар ағзада нейродегенерацияның алғашқы кезеңдеріне ұқсас өзгерістерді тудырады.&lt;/p&gt;\n","links":[{"url":"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-card.jpg"},"content":{"title":"Альцгеймер ауруын зерттеуге арналған адам гиппокампының жасушалық картасы","text":"&lt;p&gt;Альцгеймер ауруының зертханалық модельдерін тексеру үшін гиппокамптың толық картасы жасалды.&lt;/p&gt;\n","links":[{"url":"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"extended-features-block","animated":false,"title":"БиоСигнал қалай жұмыс істейді","items":[{"title":"Іріктеу","text":"&lt;p&gt;Күн сайын модель ондаған жаңа зерттеуді салыстырып, ең маңызды әрі түсініктілерін таңдайды.&lt;/p&gt;\n"},{"title":"Талдау","text":"&lt;p&gt;Мәні, негізгі қорытындылар мен шектеулер — қарапайым, бірақ дәл тілмен.&lt;/p&gt;\n"},{"title":"Үш тіл","text":"&lt;p&gt;Әр материал орыс, өзбек және қазақ тілдерінде шығады.&lt;/p&gt;\n"},{"title":"Суреттер және толық мәтін","text":"&lt;p&gt;Мақалалардың өз суреттері, ал ашық лицензиялар үшін — толық аударма.&lt;/p&gt;\n"}]},{"type":"questions-block","animated":false,"title":"Сұрақтар","items":[{"title":"&lt;p&gt;Бұл рецензияланған мақалалар ма?&lt;/p&gt;\n","text":"&lt;p&gt;Жоқ, бұл препринттер — рецензияға дейінгі жаңа жұмыстар. Әр материалда зерттеу шектеулері көрсетілген.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Материалдар қаншалықты жиі шығады?&lt;/p&gt;\n","text":"&lt;p&gt;Күніне үш рет: таңертең, күндіз және кешке.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Мәтіндерді пайдалануға бола ма?&lt;/p&gt;\n","text":"&lt;p&gt;Иә, БиоСигнал мен түпнұсқа мақалаға сілтеме жасап (DOI әр материалда көрсетілген).&lt;/p&gt;\n"}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"БиоСигнал","vcsPath":"index.yaml"},"title":"БиоСигнал"},"router":{"pathname":"index","depth":1,"base":"./"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
