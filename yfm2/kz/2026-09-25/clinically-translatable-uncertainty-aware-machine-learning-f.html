            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"118\" cy=\"134\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"602\" cy=\"268\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · EPIDEMIOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жүрек ауруларының қаупін&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болжайтын жасанды интеллект&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жүйесі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f1.jpg\" alt=\"1-сурет: Жүрек-қан тамырлары ауруларын болжауға арналған белсіздікті ескеретін машиналық оқыту жүйесі мен қауымдастық зе\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Жүрек-қан тамырлары ауруларын болжауға арналған белсіздікті ескеретін машиналық оқыту жүйесі мен қауымдастық зерттеуінің зерттеу барысы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Дәстүрлі қауіп шкалалары әртүрлі топтарда жиі қателіктер жібереді және болжамның сенімсіздігін ескермейді. Зерттеушілер болжамның дәлдігі мен факторлардың себеп-салдары байланысын біріктіретін жаңа жүйе әзірледі. Бұл әдіс жүрек-қан тамырлары ауруларының қаупін сенімдірек бағалауға мүмкіндік береді. Нәтижесінде медициналық шешімдерді қабылдаудың сапасы айтарлықтай артады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Кездейсоқ орман моделі 0.90-нан жоғары ROC-AUC нәтижесін көрсетті.&lt;/li&gt;\n&lt;li&gt;Гибридті импутация классификация сапасын жақсартты.&lt;/li&gt;\n&lt;li&gt;Ерлер мен әйелдер үшін негізгі қауіп факторларының айырмашылығы анықталды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жүрек-қан тамырлары аурулары жаһандық деңгейде өлім-жітімнің негізгі себебі болып қала береді. Қолданыстағы клиникалық шкалалар сызықтық параметрлерге ғана сүйенеді және гетерогенді топтарда өз дәлдігін жоғалтады. Осы кемшіліктерді жою үшін авторлар болжамның анықсыздығын бағалайтын және биомаркерлерді зерттейтін жаңа жүйені ұсынды. Бұл тәсіл деректерді талдаудың сенімділігін арттырады.&lt;/p&gt;\n&lt;p&gt;Зерттеу барысында 918 қатысушының, оның ішінде 725 ер адам мен 193 әйелдің мәліметтері қолданылды. Жетіспейтін деректер MICE және кездейсоқ орман әдістері арқылы өңделді. Болжамдардың белсіздігі бутстрап және энтропия әдістерімен өлшенді. Себеп-салдарлық байланыстарды анықтау үшін екі мәрте машиналық оқыту және Causal Forest әдістері қолданылды.&lt;/p&gt;\n&lt;p&gt;Нәтижелер кездейсоқ орман моделінің ROC-AUC мәні 0.90-нан асатын ең тұрақты көрсеткіш көрсеткенін дәлелдеді. Деректерді жетілдіру арқылы F1-көрсеткіші 0.89-ға дейін өсті. Себептерді талдау барысында ірі тамырлар саны, ST сегментінің көлбеуі және стенокардия басты қауіп факторлары екені анықталды, олар жынысқа байланысты ерекшеленді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шағын және жынысы бойынша біркелкі емес ретроспективті деректерге негізделгендіктен, тәуелсіз клиникалық тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Жүрек-қан тамырлары аурулары бүкіл әлем бойынша өлім-жітімнің басты себебі болып қала береді. Машиналық оқыту модельдері болжамдылықтың жоғары тиімділігін көрсетсе де, клиникалық тұрғыдан сенімді жасанды интеллект үшін маңызды болып табылатын белсіздікті бағалауға және жынысқа байланысты қауіп факторларын анықтауға жеткіліксіз көңіл бөлінді.&lt;/p&gt;\n&lt;p&gt;Биомаркерлер бойынша қауымдастық зерттеуін, түсіндірілетін жасанды интеллектті және жыныс бойынша стратификацияланған қауіпті бағалауды біріктіретін, белсіздікті ескеретін және түсіндіруге болатын жүрек-қан тамырлары ауруларын болжауға арналған машиналық оқыту жүйесін әзірлеу және бағалау.&lt;/p&gt;\n&lt;p&gt;Бұл ретроспективті бақылау зерттеуінде 725 ер адам мен 193 әйелді қоса алғанда, 918 қатысушыны қамтитын UCI Heart Disease деректер жинағы пайдаланылды. Демографиялық, клиникалық, зертханалық және физикалық жүктемеге байланысты айнымалылар талданды. Жетіспейтін мәндер MICE пен бақыланатын Random Forest импутациясын біріктіретін гибридті стратегия көмегімен шешілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Импутация — толық емес жазбаларды жоймай, барлық қолжетімді ақпаратты пайдалануға мүмкіндік беретін, деректер жинағындағы жетіспейтін немесе жоқ мәндерді қалпына келтіру немесе толтыру статистикалық әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеушілер жетіспейтін деректер мәселесін шешу үшін ансамбльдік машиналық оқыту стратегиясын әзірледі. Содан кейін стратификацияланған оқыту және сынақ бөліктері мен 5 мәртелі кросс-валидация көмегімен заманауи машиналық оқыту модельдері жасалып, бағаланды. Болжам жасау тиімділігі бірнеше бағалау метрикалары арқылы өлшенді. Белсіздік бутстреп ресемплинг, болжамдық энтропия және өзара ақпарат арқылы санмен есептелді. Жынысқа тән орташа көрсеткіштер мен қауіп факторларының ассоциациялық зерттеулерін бағалау үшін сызықтық қосарлы машиналық оқыту (Linear Double machine learning) және себеп-салдарлық орман қосарлы машиналық оқыту (Causal Forest double machine learning) қолданылды.&lt;/p&gt;\n&lt;p&gt;Random Forest ерлер мен әйелдер когорталарында ең күшті және тұрақты болжамдық тиімділікті көрсетті, ROC-AUC мәндері 0.90-нан асты және кросс-валидация көрсеткіштері жоғары болды. Гибридті импутация классификация тиімділігін жақсартып, F1-score көрсеткішін 0.87-ден 0.89-ға дейін және ROC-AUC мәнін 0.90-нан 0.92-ге дейін өсірді. Себеп-салдарлық қауымдастық зерттеуі негізгі қан тамырларының санын, ST сегментінің көлбеуін, талассемияны және физикалық жүктеме стенокардиясын жүрек ауруларының ең күшті анықтаушы факторлары ретінде анықтады, бұл ретте ерлер мен әйелдердің кіші топтары арасында айтарлықтай айырмашылықтар байқалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Random Forest моделі 0.90-нан жоғары ROC-AUC көрсеткішіне қол жеткізді, ал гибридті импутация бұл көрсеткішті 0.92-ге жеткізіп, жүрек-қан тамырлары ауруларының қауіп факторларындағы негізгі жыныстық айырмашылықтарды анықтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Болжамдық модельдеуді, белсіздікті бағалауды және қауымдастық зерттеуінің машиналық оқытуын біріктіру жүрек-қан тамырлары ауруларының қаупін бағалау үшін сенімді және клиникалық тұрғыдан түсінікті жүйені қамтамасыз етеді. Ұсынылып отырған тәсіл болжамдардың сенімділігін арттырады және бір уақытта жынысқа тән себеп-салдарлық тұрғыдан маңызды қауіп факторларын анықтайды, бұл дәл кардиология мен сенімді клиникалық жасанды интеллектті қолдайды.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"zhuerek-khan-tamyrlary-aurulary-maeselesining-oezektiligi-zhaene-klassikalykh-shkalalardyng-shekteuleri\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#zhuerek-khan-tamyrlary-aurulary-maeselesining-oezektiligi-zhaene-klassikalykh-shkalalardyng-shekteuleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жүрек-қан тамырлары аурулары мәселесінің өзектілігі және классикалық шкалалардың шектеулері&lt;/span&gt;&lt;/a&gt;Жүрек-қан тамырлары аурулары мәселесінің өзектілігі және классикалық шкалалардың шектеулері&lt;/h4&gt;\n&lt;p&gt;Жүрек-қан тамырлары аурулары (ЖҚТА) жаһандық деңгейдегі басты медициналық проблемалардың бірі болып қала береді: 2022 жылғы мәліметтер бойынша, бұл аурумен 500 миллионнан астам адам өмір сүреді, ал оған байланысты өлім-жітім шамамен 20 миллионды құрап, әлемдегі барлық өлімнің үштен біріне жуығын көрсетті. Америка Құрама Штаттарында ЖҚТА өлімнің негізгі себебі болып табылады және жыл сайын әрбір үшінші өлімге жауап береді. Коронарлық артерия ауруы (КАА) тамырлардың тарылуы немесе бітелуі, миокардтың қан ағымының төмендеуі және инфаркт, жүрек жеткіліксіздігі мен кенеттен болатын өлім сияқты ауыр салдарға әкелетін негізгі морбидтік фактор болып саналады. Бұл жүктеме семіздік, артериялық гипертония, диабет және темекі шегу сияқты өмір салтына байланысты қауіп факторларының өсуімен күшейе түседі. Патологиялар байқалмай дамитындықтан, оларды ерте анықтау мен қауіпті дәл болжау тиісті профилактика үшін өте маңызды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Жүрек-қан тамырлары аурулары 500 миллионнан астам адамды қамтып, жыл сайын 20 миллионға жуық өлімге әкеледі, ал олардың жасырын ағымы ерте диагноз қоюды қиындатады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ЖҚТА қаупіне жас пен жыныс қатты әсер етеді: жылдар өте келе жүрек-қан тамырлары функциясының нашарлауы мен қауіп факторларының жиналуына байланысты бұл көрсеткіш екі жыныста да өседі. Ер адамдар қауіпке көбірек ұшырайды және ауру әйелдерге қарағанда шамамен 7–10 жыл ертерек дамиды. 2019 жылы жас бойынша стандартталған жаһандық ЖҚТА өлімі ерлерде 100 000 тұрғынға шаққанда 280.8-ді, ал әйелдерде 204.0-ді құрады. Бұл айырмашылық менопаузаға дейінгі әйелдердегі эстрогеннің қорғаныш әсерімен, сондай-ақ тамыр құрылымы мен түйішектердің түзілуіндегі жыныстық ерекшеліктермен түсіндіріледі. Қауіп факторлары өзгермейтін (жас, жыныс, генетика) және өзгеретін (гипертония, темекі шегу, гиподинамия) болып бөлінеді. Дегенмен, кеудедегі жайсыздық немесе бас айналу сияқты ерте белгілер жиі елеусіз қалып, диагноздың кешігуіне әкеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Өзгертілетін қауіп факторлары — бұл өмір салты мен денсаулық көрсеткіштері, оларды түзету арқылы аурудың алдын алуға болады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қауіпті бағалау әдетте клиникалық тесттер мен тағылып жүретін құрылғылар арқылы жүзеге асырылып, нәтижелер электронды медициналық жазбаларға енгізіледі, бірақ бұл деректер жиі құрылымдалмаған және шуларды қамтиды. ЖҚТА-ның экономикалық жүктемесі өте жоғары және АҚШ-тың өзінде тікелей шығындар мен өнімділік жоғалтуларын қоса алғанда 200 миллиард доллардан асады. Дәстүрлі болжау модельдеріне Framingham Risk Score, ASCVD және SCORE2 жатады, алайда бұл модельдер шектеулі демографиялық және зертханалық айнымалыларға негізделген және сызықтық байланыстарды болжайды. Бұл модельдер гетерогенді когорталарда, мысалы, азшылық топтар немесе жастар арасында өз тиімділігін жоғалтуы мүмкін.&lt;/p&gt;\n&lt;h4 id=\"mashinnoe-obuchenie-i-poisk-prichinno-sledstvennyh-svyazej-s-pomoshyu-double-machine-learning\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#mashinnoe-obuchenie-i-poisk-prichinno-sledstvennyh-svyazej-s-pomoshyu-double-machine-learning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Машинное обучение и поиск причинно-следственных связей с помощью Double Machine Learning&lt;/span&gt;&lt;/a&gt;Машинное обучение и поиск причинно-следственных связей с помощью Double Machine Learning&lt;/h4&gt;\n&lt;p&gt;Есептеу қуаттарының артуы жүрек-қан тамырлары қаупін болжауда машиналық оқыту (МО) әдістерін, соның ішінде кездейсоқ тоғайларды (Random Forests, RF), градиенттік бустингті (Gradient Boosting Machines, GBM), тірек векторлар машиналарын (Support Vector Machines, SVM) және терең нейрондық желілерді қолдануды арттырды. Бұл әдістер сызықтық емес тәуелділіктер мен күрделі өзара әрекеттесулерді моделдей алады. Бірқатар зерттеулерде МО әдістерін қолдану арқылы алынған ROC қисығы астындағы аудан (AUC) көрсеткіштері 0.85-тен асқаны хабарланған. Осыған қарамастан, МО модельдерін күнделікті клиникалық тәжірибеге енгізу әлі де қиындық тудырады, себебі олар шағын ретроспективті деректерге негізделген және «қара жәшік» принципі бойынша жұмыс істейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;«Қара жәшік» түріндегі МО модельдері жоғары AUC көрсетсе де, олардың түсініксіздігі және сыртқы валидацияның болмауы клиникалық сенімге кедергі келтіреді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Интерпретация мәселесін шешу үшін медициналық білімге негізделген белгілерді инженерлеу, LASSO регуляризациясы және SHAP сияқты түсіндіру әдістері қолданылады, олар болжамға әрбір фактордың үлесін көрсетеді. Дегенмен, болжамды маңыздылық фактордың ауру қаупіне тәуелсіз себептік әсерін білдірмейді. Осы мақсатта мақалада негізгі предикторлардың себептік әсерін бағалау үшін Қос машиналық оқыту (Double Machine Learning, DML) әдісі қолданылады. Зерттеуде деректерді алдын ала өңдеу, жетіспейтін мәндерді толтыру, бірнеше МО модельдерін жасау және 5 мәртелі кросс-валидация кезеңдері орындалған. Тиімділік F1-ұпайы, MCC, дәлдік, ROC-AUC, AUPRC және Brier score арқылы бағаланып, Causal Forest DML жекелендірілген ЖҚТА қаупін бағалауға мүмкіндік берді.&lt;/p&gt;\n&lt;h4 id=\"aedebietter-sholuy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#aedebietter-sholuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдебиеттер шолуы&lt;/span&gt;&lt;/a&gt;Әдебиеттер шолуы&lt;/h4&gt;\n&lt;p&gt;Жүрек-қан тамырлары аурулары (ЖҚТА) бүкіл әлем бойынша өлімнің негізгі себебі болып қала беретіндіктен, зерттеушілер олардың алдын алу, диагностикалау және басқару құралдарын жасауға көп жылдар арнады. Али және әріптестері ансамбльдік терең оқыту және белгілерді біріктіру техникасына негізделген жүрек ауруларын болжауға арналған ақылды денсаулық сақтау мониторингі жүйесін ұсынды. Олардың платформасы тағылатын датчиктерден жиналған физиологиялық деректерді электронды медициналық карталармен біріктіреді. Болжау сапасын арттыру үшін жүйе ақпараттың өсуіне негізделген белгілерді іріктеуді қолданды. Нәтижесінде LogitBoost мета-оқыту алгоритмімен жақсартылған ансамбльдік модель шамамен 98.5% дәлдікке қол жеткізді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ансамбльдік оқыту — бұл бірнеше алгоритмдердің нәтижелерін біріктіру арқылы жеке модельге қарағанда әлдеқайда дәл және тұрақты болжам алу тәсілі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кориал және әріптестері хи-квадрат белгілерін іріктеуді көпшілік дауыс беру классификаторымен біріктіре отырып, ЖҚТА-ны ерте анықтауға арналған ансамбльдік жүйені ұсынды. Cleveland деректер базасынан 303 пациент жазбасы мен 13 клиникалық белгіні қолдана отырып, хи-квадрат әдісі ең маңызды бес белгіні анықтап, есептеу жүктемесін 50%-дан астам қысқартты. Дауыс беру ансамблі LR, RF, GNB және KNN классификаторларын біріктіріп, 92.11% дәлдік көрсетті. Ван және әріптестері 797 пациенттің деректерін қолдана отырып, ерте ишемиялық жүрек ауруы (ИЖА) қаупін болжау модельдерін жасады. LASSO және RF модельдері гиперурикемияны, созылмалы бүйрек ауруын және ұйқы артерияларының атеросклерозын ең маңызды предикторлар ретінде анықтады. RF моделі AUC көрсеткіші бойынша LASSO-дан асып түсті (0.91 және 0.84, статистикалық маңызды айырмашылықпен Z = 3.99, P &amp;lt; 0.05).&lt;/p&gt;\n&lt;p&gt;Дорраki және әріптестері UK Biobank деректерін қолдана отырып, ЖҚТА болжамын жақсартудағы психологиялық факторлардың рөлін зерттеді. Дәстүрлі қауіп факторлары ғана қолданылғанда модель 73.13% дәлдік көрсетсе, психикалық денсаулық көрсеткіштерін қосу дәлдікті 85.13%-ға дейін арттырды. Олаваде және әріптестері BESO алгоритмін біріктірген ИЖА болжауға арналған ML жүйесін ұсынды. RF моделі екі деректер базасында 90% және 92% дәлдік көрсетті. Негізгі предикторларға жүрек соғу жиілігі, жас, дене салмағының индексі, систолалық қан қысымы және типтік кеуде ауыруы кірді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Зерттелген модельдердің көпшілігі нақты ретроспективті деректер жиынына негізделген, бұл олардың кең клиникалық тәжірибеде қолданылуын шектеуі мүмкін.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данка және әріптестері XGBoost негізіндегі гибридті жүйені әзірлеп, Cleveland деректер базасында шамамен 95.45% дәлдікке, 92.86% сезімталдыққа және 100% ерекшелікке қол жеткізді. Али және әріптестері Kaggle деректерінде RF моделі 100% дәлдік көрсеткенін анықтады. Рабби және әріптестері VEMLA және BEMLA ансамбльдік модельдерін ұсынып, Cleveland базасында 92%, ал Framingham базасында 97% дәлдікке қол жеткізді. Талукдер және әріптестері деректерді теңестіру мен түсіндірілетін жасанды интеллект құралдарын біріктіретін HXAI-ML фреймворкін жасап, 98.78% дәлдікке қол жеткізді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Қолданыстағы зерттеулер негізінен классификация дәлдігі мен белгілерді іріктеуге бағытталған, алайда гендерлік айырмашылықтар, белгісіздікті бағалау және каузальды предикторлар жеткіліксіз зерттелген.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әдебиеттер шолуынан көрініп тұргендей, көптеген жұмыстар гибридті ML жүйелері арқылы ЖҚТА болжау дәлдігін арттыруға бағытталған. Соған қарамастан, гендерлік қауіп факторлары, белгісіздікті бағалау және каузальды предикторлар әлі де аз зерттелген. Сондықтан алдын ала өңдеуді, сыныптарды теңестіруді және каузальды тәсілдерді біріктіретін кешенді жүйеге қажеттілік бар.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"zhuerek-aurularynyng-derekter-zhiyny\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#zhuerek-aurularynyng-derekter-zhiyny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жүрек ауруларының деректер жиыны&lt;/span&gt;&lt;/a&gt;Жүрек ауруларының деректер жиыны&lt;/h4&gt;\n&lt;p&gt;Зерттеуде жүрек-қан тамырлар аурулары бойынша Кливленд және Венгрия когорталарынан алынған құрылымдық клиникалық деректер жиынтығы пайдаланылды. Ол жүрек-қан тамырлар ауруларын бағалауда жиі қолданылатын демографиялық, физиологиялық және жүктемелік айнымалыларды қамтиды. Деректер жиынтығы жасы, жынысы, кеудедегі ауырсыну түрі, қысым, холестерин деңгейі, электрокардиографиялық көрсеткіштер және физикалық жүктемеге жауап сияқты негізгі предикторытарды қамтиды. Бірқатар айнымалылар клиникалық тұрғыдан анықталған қауіп факторларын көрсетеді: кеудедегі ауырсыну түрі симптоматиканы сипаттайды, ал максималды жүрек соғу жиілігі мен жүктеме стенокардиясы жүректің стресске функционалды жауабын білдіреді. Сарысулық холестерин және аш қарынға қандағы глюкоза сияқты зертханалық өлшеулер метаболизмдік қауіпті қамтиды, ал рентгеноскопия арқылы байқалатын ірі тамырлар саны және талассемия күйі жүректің и ischemic ауруының ауырлығын көрсетеді. Нәтиже айнымалысы жүрек ауруының болуы мен ауырлығын кодтайды, ал жіктеу модельдеуі үшін бұл айнымалы клиникалық маңызды аурудың бар-жоғын көрсету үшін екілік форматқа келтірілді. Барлық айнымалылардың толық сипаттамасы, анықтамалары мен диапазондары Кесте 1-де берілген.&lt;/p&gt;\n&lt;h4 id=\"zertteu-dizajny\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#zertteu-dizajny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу дизайны&lt;/span&gt;&lt;/a&gt;Зерттеу дизайны&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеу жыныс бойынша стратификацияланған талдау мен жас ерекшеліктеріне ерекше назар аудара отырып, жүрек-қан тамырлар ауруларын болжауға арналған машиналық оқыту модельдерін әзірлеу және бағалау үшін қолжетімді клиникалық деректерді пайдалана отырып ретроспективті, бақылау дизайнын қолданды. Әдідологиялық негіз төрт біріктірылген компоненттен тұрды: (i) деректердің сыртқа кетуіне жол бермеу үшін бірыңғай бағандық құбыр желісі шеңберінде стандартталған алдын ала өңдеу; (ii) модельге тәуелсіз сенімді предикторатарды анықтау үшін LASSO, Elastic Net, GBM және RF көмегімен көп алгоритмді айнымалыларды таңдау; (iii) сызықтық, маржаға негізделген, ағашқа негізделген, ықтималдық, мысалға негізделген және нейрондық парадигмаларды қамтитын жеті бақыланатын жіктеуішті пайдалана отырып болжамды модельдеу — LR, SVM, DT, RF, GNB, KNN және MLP; (iv) жыныс бойынша стратификацияланған ішкі топтар арасындағы салыстырмалы өнімділікті бағалау.&lt;/p&gt;\n&lt;h4 id=\"derekterdi-aldyn-ala-oengdeu\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#derekterdi-aldyn-ala-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді алдын ала өңдеу&lt;/span&gt;&lt;/a&gt;Деректерді алдын ала өңдеу&lt;/h4&gt;\n&lt;p&gt;Деректер жиынтығы демографиялық сипаттамаларды, зертханалық өлшеулерді және физикалық жүктеме көрсеткіштерін қоса алғанда, жүрек-қан тамырлар аурулары қаупін бағалауда әдетте қолданылатын құрылымдық клиникалық айнымалылардан тұрды. Екілік нәтиже айнымалысы жүрек ауруының бар (Y=1) немесе жоқ (Y=0) екенін көрсетті. Модельді әзірлеуге дейін барлық машиналық оқыту модельдері арасындағы үйлесімділікті қамтамасыз ету және әртүрлі белгілер масштабтары мен жоғалған деректерден туындайтын ықтимал ауытқуларды азайту үшін стандартталған алдын ала өңдеу құбыр желісі енгізілді.&lt;/p&gt;\n&lt;h4 id=\"derekter-sipattamasy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#derekter-sipattamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректер сипаттамасы&lt;/span&gt;&lt;/a&gt;Деректер сипаттамасы&lt;/h4&gt;\n&lt;p&gt;Деректер жиынтығы жүрек ауруларын жіктеу мақсатында жиналған клиникалық және демографиялық өлшемдерді қамтыды. Толық когорта 918 қатысушыны қамтыды, олардың 725-і (79.0%) ер адамдар және 193-і (21.0%) әйелдер болды. Деректер жиынтығы жүрек ауруы бар және жоқ пациенттердің біршама теңгерімді арақатысын көрсетті: 918 қатысушының 508-іне (55.3%) жүрек ауруы диагнозы қойылды, ал 410-ы (44.7%) сауықтырылған бақылау тобын құрды. Жүрек ауруларының жыныстық ерекшеліктерін зерттеу үшін деректер ерлер мен әйелдердің ішкі топтарына стратификацияланды. Қатысушылар үш жас топтарына бөлінді: 29–39 жас (жас ересектер; n=80), 40–59 жас (орта жастағы ересектер; n=735) және 60–77 жас (егде жастағы ересектер; n=103).&lt;/p&gt;\n&lt;p&gt;Айнымалылар төрт үздіксіз предиктора — сарысулық холестерин (chol, мг/дл), физикалық жүктемеден туындаған ST депрессиясы (oldpeak), қол жеткізілген максималды жүрек соғу жиілігі (thalch, bpm) және тыныштық күйдегі қан қысымы (trestbps, мм рт. ст.) — және сегіз категориялық предиктораға топтастырылды: флюороскопия арқылы боялған ірі тамырлар саны (ca), кеудедегі ауырсыну түрі (cp), жүктеме стенокардиясы (exang), аш қарынға қандағы қант &amp;gt;120 мг/дл (fbs), тыныштық күйдегі электрокардиография нәтижелері (restecg), шыңғы жүктеме ST сегментінің көлбеуі (slope), талассемия (thal) және жүрек ауруының нәтижесі (target). Предикторлардың бірлескен таралуын зерттеу үшін үздіксіз айнымалылар ядролық тығыздық бағалаулары ретінде, ал категориялық айнымалылар жиілік саны ретінде көрсетілді (2-Сурет).&lt;/p&gt;\n&lt;p&gt;Орта жастағы ішкі топ барлық категориялық айнымалылар бойынша бақылаулардың көпшілігін құрады, бұл жүрек аурулары когорталарының күтілетін жас бөлінісіне сәйкес келеді. Үздіксіз айнымалылар жас топтары бойынша негізінен ұқсас орталық тенденцияларды көрсетті, бұл ретте егде жастағыларда thalch төменге, ал oldpeak жоғарыға жылжыды. Категориялық предикторы нақты жыныстық айырмашылықтарды көрсетті: атап айтқанда, ер адамдар барлық категориялық айнымалылардың деңгейлері бойынша әйелдерден асып түсті және аурудың нәтижесі (target) әрбір жас қабатында ер адамдарда жиірек кездесті. Ер (n=725) және әйел (n=193) қатысушылар арасындағы айтарлықтай теңгерімсіздік келесі бөлімдерде келтірілген жыныс бойынша стратификацияланған модельдеу тәсіліне негіз болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;918 қатысушы қатысқан зерттеуде (79% ер адамдар) айқын жыныстық теңгерімсіздік анықталды, бұл ерлер мен әйелдер үшін физиологиялық көрсеткіштердің жастық өзгерістерін ескере отырып, бөлек модельдер құруды талап етті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhetispejtin-derekterdi-oengdeu\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#zhetispejtin-derekterdi-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жетіспейтін деректерді өңдеу&lt;/span&gt;&lt;/a&gt;Жетіспейтін деректерді өңдеу&lt;/h4&gt;\n&lt;p&gt;Жүрек-қан тамыр аурулары (ЖҚА) деректер жиынтығының күрделілігіне байланысты стандартты импутация әдістері тиімсіз болды. Сондықтан авторлар айнымалылар түріне бейімделген гибридті стратегияны қолданды. Үздіксіз айнымалылар (жасы, қан қысымы, холестерин, жүрек соғу жиілігі және ST депрессиясы) үшін MICE (тізбекті теңдеулер арқылы көптік импутация) әдісі қолданылды. Категориялық айнымалылар (жынысы, қандағы қант, стенокардия, кеуде ауруының түрі, ЭКГ нәтижелері, тамырлар саны және талассемия) үшін бақыланатын импутация қолданылды: әрбір белгі үшін қолда бар деректер негізінде кездейсоқ орман (RF) регрессиясы оқытылды және жетіспейтін мәндер болжанған сынып белгілерімен толтырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гибридті тәсіл (MICE және RF) деректердің дискретті құрылымын сақтап, айнымалылар арасындағы көпөлшемді байланыстарды ескеруге мүмкіндік берді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MICE — әрбір айнымалыны басқалары негізінде дәйекті түрде модельдеу арқылы бос орындарды толтыратын итеративті әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"belgilerdi-masshtabtau\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#belgilerdi-masshtabtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Белгілерді масштабтау&lt;/span&gt;&lt;/a&gt;Белгілерді масштабтау&lt;/h4&gt;\n&lt;p&gt;Барлық үздіксіз предикторлар Z-балл нормализациясы арқылы стандартталды: &lt;span class=\"yfm-latex\" data-content=\"x%5E*%20%3D%20%5Cfrac%7Bx%20-%20%5Cmu%7D%7B%5Csigma%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Бұл әдіс LASSO және Elastic Net сияқты модельдер үшін маңызды, себебі оларда коэффициенттер шамасы белгілердің масштабына тікелей тәуелді.&lt;/p&gt;\n&lt;h4 id=\"okhytu-zhaene-testileu-zhiyntykhtaryna-boelu\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#okhytu-zhaene-testileu-zhiyntykhtaryna-boelu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оқыту және тестілеу жиынтықтарына бөлу&lt;/span&gt;&lt;/a&gt;Оқыту және тестілеу жиынтықтарына бөлу&lt;/h4&gt;\n&lt;p&gt;Деректер 80:20 қатынасында (random seed 42) бөлінді. Стратификацияланған іріктеу әдісі қолданылды: P(Ytrain = 1) ≈ P(Ytest = 1). Барлық алдын ала өңдеу операциялары (импутация, масштабтау, кодтау) бірыңғай конвейерге біріктірілді, мұнда параметрлер тек оқыту жиынтығынан есептеліп, тест жиынтығына қолданылды. Бұл деректердің ағып кетуіне (data leakage) жол бермейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Деректердің ағып кетуіне жол бермеу үшін барлық трансформация параметрлері тек оқыту жиынтығынан алынуы тиіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modeldeu-zhaene-klassifikaciya\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#modeldeu-zhaene-klassifikaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельдеу және классификация&lt;/span&gt;&lt;/a&gt;Модельдеу және классификация&lt;/h4&gt;\n&lt;p&gt;x_i белгілер векторы жас, холестерин деңгейі, қан қысымы және физикалық жүктеме кезіндегі стенокардия сияқты клиникалық тәуекелді бағалауда стандартты болып табылатын демографиялық, физиологиялық және функционалдық көрсеткіштерді қамтиды. Мақсат — пациенттерді төмен және жоғары тәуекел топтарына бөлу үшін P(y_i = 1 / x_i) шартты ықтималдықты бағалайтын F: R^p → [0, 1] функциясын үйрету. Модель архитектурасына байланысты F(·) сызықтық предиктор, сызықтық емес түрлендіру немесе шешім қабылдау ережелерінің ансамблі болуы мүмкін. Біз клиникалық предикторлар мен жүрек-қан тамыр аурулары (ЖҚТА) нәтижелері арасындағы күрделі байланысты ескеру үшін параметрикалық және параметрикалық емес ML модельдерінің кең спектрін қолдандық.&lt;/p&gt;\n&lt;p&gt;Сызықтық регрессия (LR) өзінің түсініктілігі мен мүмкіндіктер қатынасын бағалау қабілетіне байланысты базалық ықтималдық моделі ретінде пайдаланылды. Тірек векторлар машинасы (SVM) ядролық түрлендірулер арқылы сызықтық емес шешім шекараларын модельдеу үшін қолданылды. Шешім ағаштары (DT) мөлдір иерархиялық құрылымы үшін, ал кездейсоқ ормандар (RF) болжам тұрақтылығын арттыру және дисперсияны азайту үшін енгізілді. Гаусс нақты Байес классификаторы (GNB) шартты тәуелсіздік болжамы астында тиімді базалық шешім болды, ал k-ең жақын көршілер (KNN) алгоритмі клиникалық белгілердің ұқсастығына негізделіп пациенттерді классификациялауға мүмкіндік берді. Көп қабатты перцептрондар (MLP) сызықтық емес өзара әрекеттесулерді анықтау үшін, ал градиенттік бустинг (GBM) қателерді дәйекті түрде азайту арқылы болжам дәлдігін арттыру үшін қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу ЖҚТА тәуекелін бағалау үшін сызықтық модельдерден бастап, күрделі сызықтық емес ансамбльдер мен нейрондық желілерге дейінгі модельдерді қамтиды.&lt;br /&gt;\n[!tip] Ансамбльдік әдістер (RF, GBM) бірнеше әлсіз алгоритмдердің болжамдарын біріктіріп, бір модельге қарағанда дәлірек және тұрақты нәтиже береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"giperparametrlerdi-ongtajlandyru\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#giperparametrlerdi-ongtajlandyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Гиперпараметрлерді оңтайландыру&lt;/span&gt;&lt;/a&gt;Гиперпараметрлерді оңтайландыру&lt;/h4&gt;\n&lt;p&gt;Модельдердің жалпылау қабілетін арттыру үшін оқу жиынтығында кросс-валидация арқылы гиперпараметрлерді баптау жүзеге асырылды. LR үшін регуляризация параметрлері мен айыппұл функциялары оңтайландырылды. SVM-де ядро параметрлері мен шекараларды регуляризациялау бапталды. Ағашқа негізделген әдістерде (DT, RF, GBM) ағаш тереңдігі, эстиматорлар саны және түйіндерді бөлу критерийлері таңдалды. KNN үшін көршілер саны мен қашықтық метрикалары, ал MLP үшін жасырын қабаттар архитектурасы, активтендіру функциялары және оңтайландыру параметрлері таңдалды. Негізгі критерий ROC-AUC көрсеткіші болды.&lt;/p&gt;\n&lt;h4 id=\"ajyppuldy-ajnymalylardy-tangdau-strategiyasy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#ajyppuldy-ajnymalylardy-tangdau-strategiyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Айыппұлды айнымалыларды таңдау стратегиясы&lt;/span&gt;&lt;/a&gt;Айыппұлды айнымалыларды таңдау стратегиясы&lt;/h4&gt;\n&lt;p&gt;Ишемиялық жүрек ауруының ең ақпаратты предикторларын анықтау үшін біз төрт архитектураны әзірледік: LASSO, Elastic Net, GBM және RF. LASSO және Elastic Net мультиколлинеарлықты басқару және автоматты таңдау үшін пайдаланылды. GBM және RF алдын ала құрылымдық болжамдарсыз күрделі сызықтық емес байланыстарды анықтау үшін қолданылды. ЖҚТА патофизиологиясындағы жыныстық айырмашылықтарды ескере отырып, бүкіл когорта биологиялық жыныс бойынша стратификацияланды және модельдер ерлер мен әйелдер үшін тәуелсіз оқытылды. Талдау конвейері Python 3.4 және scikit-learn 1.8 кітапханасы арқылы жүзеге асырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жыныс бойынша стратификацияны қолдану өте маңызды, себебі ЖҚТА даму механизмдері ерлер мен әйелдерде айтарлықтай ерекшеленуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"lasso-logistikalykh-regressiyasy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#lasso-logistikalykh-regressiyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LASSO логистикалық регрессиясы&lt;/span&gt;&lt;/a&gt;LASSO логистикалық регрессиясы&lt;/h4&gt;\n&lt;p&gt;LASSO әдісі айнымалыларды таңдау үшін таңдалды, себебі оның L₁-айыппұлы азырақ ақпаратты предикторлардың коэффициенттерін нөлге айналдырып, оларды модельден шығарып тастайды. Айыппұл деңгейі ROC-AUC-ті максималдау арқылы бес еселік кросс-валидация көмегімен анықталды. Модель SAGA алгоритмі (максимум 5000 итерация) көмегімен оқытылды. Үздіксіз предикторлар стандартталды, ал категориялық айнымалылар dummy-кодтау арқылы кодталды. Айнымалылардың маңыздылығы соңғы коэффициенттердің абсолютті мәні бойынша анықталды; көп деңгейлі белгілер үшін мәндер жинақталды және модельдер арасында салыстыру үшін 100%-ға дейін нормаланды.&lt;/p&gt;\n&lt;h4 id=\"elasticnet-logistikalykh-regressiyasy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#elasticnet-logistikalykh-regressiyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ElasticNet логистикалық регрессиясы&lt;/span&gt;&lt;/a&gt;ElasticNet логистикалық регрессиясы&lt;/h4&gt;\n&lt;p&gt;Болжамды айнымалылар арасындағы мультиколлинеарлық ықтималдығын ескере отырып, жүрек ауруын болжау үшін реттелген айнымалыларды таңдау мақсатында Elastic Net әдісі қолданылды. LASSO-дан айырмашылығы, Elastic Net L₁ және L₂ айыппұлдарды біріктіреді, бұл болжамдар корреляцияланған кезде модельдің тұрақтылығын жақсартады және маңызды емес коэффициенттерді нөлге дейін қысқарту қабілетін сақтайды. Араластыру параметрі 0.5 болып белгіленді, бұл екі айыппұл компонентіне де тең салмақ берді, ал жалпы регуляризация күші ROC қисығы астындағы аумақты барынша арттыратын бес еселік кросс-валидация арқылы оңтайландырылды. Модель SAGA оңтайландыру алгоритмі көмегімен ең көбі 5000 итерациямен сәйкестендірілді. Айнымалылардың маңыздылығы LASSO моделі үшін сипатталған процедура бойынша анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Elastic Net — бұл маңызды белгілерді таңдайтын және олардың арасындағы өзара байланысты реттейтін LASSO мен Ridge әдістерінің гибридті қосындысы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gbm-belgilerining-mangyzdylyghy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#gbm-belgilerining-mangyzdylyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GBM белгілерінің маңыздылығы&lt;/span&gt;&lt;/a&gt;GBM белгілерінің маңыздылығы&lt;/h4&gt;\n&lt;p&gt;Параметрлік емес регуляризация әдістерінен басқа, ансамбльдік тәсіл арқылы айнымалылардың маңыздылығын бағалау үшін GBM қолданылды. GBM қатарынан тайыз шешім ағаштарын біріктіретін ансамбльдік әдіс болып табылады, мұнда әрбір келесі ағаш ағымдағы ансамбльдің қалдық қателеріне бейімделеді және функция кеңістігінде градиенттік түсу арқылы шығын функциясын минимизациялайды. Модель воспроизводимость қамтамасыз ету үшін фиксирленген кездейсоқ тұқыммен (random_state = 42) scikit-learn ішіндегі GBM регрессоры арқылы жүзеге асырылды, 100 бустинг кезеңі, 0.1 оқыту жылдамдығы, максималды ағаш тереңдігі 3 және субдискретизация үлесі 1.0 пайдаланылды. LASSO үшін сипатталған алдын ала өңдеу конвейері қолданылды. Айнымалылардың маңыздылығы барлық ағаштар бойынша әрбір болжаушыға жататын түйіндік қоспалардың жиынтық төмендеуі ретінде өлшенді.&lt;/p&gt;\n&lt;h4 id=\"rf-belgilerin-tangdau\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#rf-belgilerin-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RF белгілерін таңдау&lt;/span&gt;&lt;/a&gt;RF белгілерін таңдау&lt;/h4&gt;\n&lt;p&gt;GBM ансамбльдік тәсілін толықтыра отырып, тәуелсіз ағашқа негізделген стратегия арқылы айнымалылардың маңыздылығын қосымша бағалау үшін RF регрессоры қолданылды. GBM-нен айырмашылығы, RF бірнеше шешім ағаштарын параллельді түрде құрады, олардың әрқайсысы оқыту деректерінің бутстрэп таңдамасында өсіріледі, ал ағаштар арасындағы корреляцияны азайту және жалпылауды жақсарту үшін әр бөлінуде болжаушылардың кездейсоқ ішкі жиынтығы қарастырылады. Модель scikit-learn-де 500 шешім ағашы (n_estimators = 500) және фиксирленген кездейсоқ тұқым (random_state = 42) көмегімен іске асырылды, барлық басқа гиперпараметрлер әдепкі мәндерінде қалдырылды. LASSO үшін қолданылған алдын ала өңдеу қолданылды. Айнымалының маңыздылығы барлық ағаштар бойынша әрбір болжаушыға жататын Джини қоспасының орташа төмендеуі реті ында анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Белгілерді таңдау және олардың маңыздылығын бағалау үшін үш модель (Elastic Net, 5000 итерациясы / 100 кезеңі бар GBM және 500 ағашы бар RF) пайдаланылды, бұл талдаудың тұрақтылығын қамтамасыз етті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baghalau-koersetkishteri\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#baghalau-koersetkishteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау көрсеткіштері&lt;/span&gt;&lt;/a&gt;Бағалау көрсеткіштері&lt;/h4&gt;\n&lt;p&gt;Модельдің жұмысы стандартты жіктеу метрикалары көмегімен бағаланды:&lt;/p&gt;\n&lt;h4 id=\"daeldik\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дәлдік&lt;/span&gt;&lt;/a&gt;Дәлдік&lt;/h4&gt;\n&lt;p&gt;Дәлдік (Accuracy) = \\frac{TP + TN}&lt;/p&gt;\n&lt;h4 id=\"f1-upajy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#f1-upajy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F1-ұпайы&lt;/span&gt;&lt;/a&gt;F1-ұпайы&lt;/h4&gt;\n&lt;p&gt;F1-өлшемі (F1) = \\frac{2 \\cdot \\text{Precision} \\cdot \\text{Recall}}{\\text{Precision} + \\text{Recall}}&lt;/p&gt;\n&lt;h4 id=\"metyus-korrelyaciya-koefficienti-mcc\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#metyus-korrelyaciya-koefficienti-mcc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мэтьюс корреляция коэффициенті (MCC)&lt;/span&gt;&lt;/a&gt;Мэтьюс корреляция коэффициенті (MCC)&lt;/h4&gt;\n&lt;p&gt;MCC = \\frac{TP \\cdot TN - FP \\cdot FN}{\\sqrt{(TP + FP)(TP + FN)(TN + FP)(TN + FN)}}&lt;/p&gt;\n&lt;h4 id=\"roc-auc-roc-khisyghy-astyndaghy-audan\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#roc-auc-roc-khisyghy-astyndaghy-audan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ROC-AUC (ROC қисығы астындағы аудан)&lt;/span&gt;&lt;/a&gt;ROC-AUC (ROC қисығы астындағы аудан)&lt;/h4&gt;\n&lt;p&gt;ROC-AUC модельдің барлық шешім табалдырықтары бойынша кластарды ажырату қабілетін өлшейді:&lt;br /&gt;\nAUC = \\int_{1}^{0} \\text{TPR}(\\text{FPR}^{-1}(t)) , dt&lt;/p&gt;\n&lt;h4 id=\"brajer-upajy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#brajer-upajy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Брайер ұпайы&lt;/span&gt;&lt;/a&gt;Брайер ұпайы&lt;/h4&gt;\n&lt;p&gt;Брайер ұпайы ықтималдық болжамдарының дәлдігін бағалайды:&lt;br /&gt;\nБрайер ұпайы (Brier Score) = \\frac{1}{n} \\sum_{i=1}^{n} (y_i - \\hat{p}_i)^2&lt;/p&gt;\n&lt;p&gt;ЖСА болжамы контекстінде жоғары қауіпті пациенттерді анықтау үшін сезімталдық өте маңызды, ал ROC-AUC жалпы ажырату өнімділігін көрсетеді. F1-ұпайы дәлдік пен толықтықты теңестіреді, әсіресе теңгерімсіз деректер жиынында. MCC тіпті кластар теңгерімсіз болған кезде де жіктеу сапасының сенімді өлшемін қамтамасыз етеді, ал Брайер ұпайы ықтималдық калибрлерін бағалайды.&lt;/p&gt;\n&lt;h4 id=\"oenimdilikti-baghalaugha-arnalghan-belgisizdikti-baghalau\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#oenimdilikti-baghalaugha-arnalghan-belgisizdikti-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өнімділікті бағалауға арналған белгісіздікті бағалау&lt;/span&gt;&lt;/a&gt;Өнімділікті бағалауға арналған белгісіздікті бағалау&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеуде &lt;span class=\"yfm-latex\" data-content=\"y_i%20%5Cin%20%5C%7B0%2C%201%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ЖСА жоқтығын немесе бар екенін көрсететін болғандықтан, ең жақсы жұмыс істейтін ML моделінің өнімділігі accuracy, F1-score, MCC, ROC-AUC, AUPRC және Brier score көмегімен бағаланды. Өнімділік бағаларындағы белсіздікті санмен өрнектеу үшін сынқұрылғы жиынында бутстрэп қайта таңдамасы орындалды. Әрбір бутстрэп репликаты үшін &lt;span class=\"yfm-latex\" data-content=\"m%20%3D%201%2C%20%5Cdots%2C%20M\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; метрикалар қайта есептелді: &lt;span class=\"yfm-latex\" data-content=\"%5C%7B%5Chat%7B%5Ctheta%7D%5E%7B(m)%7D%5C%7D_%7Bm%3D1%7D%5EM\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Эмпирикалық 95% сенім интервалдары бутстрэп таралуының 2.5 және 97.5 перцентильдерінен алынды. Болжамдық белсіздік ағаш бойынша ықтималдық бағаларының дисперсиясымен сипатталды:&lt;/p&gt;\n&lt;p&gt;\\hat{\\sigma}^2(x_i) = \\frac{1}{B} \\sum_{b=1}^{B} (p_b(x_i) - \\bar{p}(x_i))^2&lt;/p&gt;\n&lt;p&gt;мұнда B — ағаштардың жалпы саны, p_b(x_i) — b-ші ағаштан алынған бақылау үшін болжанған ықтималдық, ал &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7Bp%7D(x_i)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — барлық ағаштар бойынша орташа болжанған ықтималдық. Болжамдық энтропия &lt;span class=\"yfm-latex\" data-content=\"H(x_i)%20%3D%20-%5Cbar%7Bp%7D(x_i)%20%5Clog%20%5Cbar%7Bp%7D(x_i)%20-%20(1%20-%20%5Cbar%7Bp%7D(x_i))%20%5Clog%20(1%20-%20%5Cbar%7Bp%7D(x_i))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ретінде есептелді, ал эпистемикалық белсіздік өзара ақпарат көмегімен анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бутстрэп және ағаш дисперсиясы арқылы белсіздікті бағалау модельдің болжамдардағы сенімсіздігін анықтауға көмектеседі, бірақ ол сынақ жиынының сапасына тәуелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"biomarkerlerding-aeserin-taldau-bojynsha-sebep-saldarlykh-bajlanys-zertteuining-aedisteri-linear-dml\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#biomarkerlerding-aeserin-taldau-bojynsha-sebep-saldarlykh-bajlanys-zertteuining-aedisteri-linear-dml\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Биомаркерлердің әсерін талдау бойынша себеп-салдарлық байланыс зерттеуінің әдістері: Linear DML&lt;/span&gt;&lt;/a&gt;Биомаркерлердің әсерін талдау бойынша себеп-салдарлық байланыс зерттеуінің әдістері: Linear DML&lt;/h4&gt;\n&lt;p&gt;Әрбір клиникалық белгінің жүрек ауруының ықтималдығына тигізетін себеп-салдарлық әсері Linear DML көмегімен бағаланды. Бұл кездейсоқ орманның көмегімен байқалған араласуларды икемді түрде түзеткеннен кейін әрбір белгінің орташа емдеу әсерін (ATE) бөліп алатын ішінара сызықтық регрессия құрылымы болып табылады. Әрбір белгі кезекпен емдеу айнымалысы ретінде, ал қалғандары ковариаталар ретінде қарастырылды. Нәтиже де, емдеу де бес еселік кросс-фиттинг арқылы ковариаталар жиынтығында қалдықтандырылды, ал ATE нәтиже қалдықтарын емдеу қалдықтарына регрессиялау арқылы қалпына келтірілді, бұл асимптотикалық түрде дұрыс сенім интервалдары мен p-мәндерін берді. Модельдер ерлер (n = 725) және әйелдер (n = 193) кіші топтары үшін бөлек бағаланды.&lt;/p&gt;\n&lt;h4 id=\"causalforestdml-sebep-saldarlykh-orman-dml\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#causalforestdml-sebep-saldarlykh-orman-dml\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CausalForestDML (Себеп-салдарлық орман DML)&lt;/span&gt;&lt;/a&gt;CausalForestDML (Себеп-салдарлық орман DML)&lt;/h4&gt;\n&lt;p&gt;Ем әсерлерінің әртүрлілігін бағалау үшін авторлар CausalForestDML әдісін қолданды, бұл стандартты қосарлы машинами оқыту (DML) жүйесінің параметрлік емес кеңейтілімі болып табылады. Ол сызықтық модельді себептік орманмен (causal forest) алмастырып, әсерлердің ковариаталар арасында икемді түрде өзгеруіне мүмкіндік береді. Әрбір клиникалық белгі кезекпен әсер етуші айнымалы ретінде, ал қалған белгілер ковариата ретінде қарастырылды. Нәтиже мен әсерді шудан тазарту үшін кездейсоқ орман (Random Forest) негізіндегі nuisance-модельдер және бес еселік айқас тексеру (five-fold cross-fitting) қолданылды, содан кейін себептік орман жекелеген қатысушылар үшін шартты орташа әсер ету өлшемдерін (CATE) есептеп шығарды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CausalForestDML — бұл кездейсоқ ормандар мен себептік талдауды біріктіретін озық әдіс, ол қатер факторларының жасырын, сызықтық емес байланыстарын қатаң шектеулерсіз табуға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұсынылған орташа әсер ету өлшемдері (ATE) әрбір жыныстық топ ішіндегі CATE көрсеткіштерін орташалау арқылы алынды. Бұл икемділік қарапайым сызықтық модель жіберіп алуы мүмкін күрделі және топқа тән себеп-салдарлық заңдылықтарды анықтауға мүмкіндік береді, бірақ мұның өтемі ретінде сенімділік интервалдары біршама кеңейеді. Модельдер ерлер (n = 725) және әйелдер (n = 193) топтары үшін бөлек есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Талдау ерлер (n = 725) және әйелдер (n = 193) сияқты әртүрлі көлемдегі топтар үшін жеке жүргізілді, ал қорытындылардың сенімділігі ескерілмеген факторлардың жоқтығы мен таралулардың қиылысу шарттарына тәуелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ескерілмеген ығыстырушы факторлар болмаған жағдайда, сондай-ақ таралулардың қиылысуы мен жартылай сызықтық шарттары сақталғанда, ATE бағалаулары әрбір белгінің жүрек аурулары қатеріне қосатын орташа себептік маңызды үлесін білдіреді. ATE көрсеткіштері Python тіліндегі EconML пакетінде қолжетімді LinearDML және CausalForestDML әдістері арқылы есептелді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"sipattamasy-erler-or95percentci-aejelder-or95percentci\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#sipattamasy-erler-or95percentci-aejelder-or95percentci\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сипаттамасы Ерлер OR(95%CI) Әйелдер OR(95%CI)&lt;/span&gt;&lt;/a&gt;Сипаттамасы Ерлер OR(95%CI) Әйелдер OR(95%CI)&lt;/h4&gt;\n&lt;p&gt;Жыныс және басқа параметрлер бойынша түзетілген талдау ерлер мен әйелдердегі клиникалық белгілер мен жүрек-қан тамырлары ауруларының (ЖҚТА) қаупі арасындағы байланыс күшінде айырмашылықтар бар екенін көрсетті (2-кесте). Мысалы, ангиография кезіндегі боялған тамырлар саны (ca) екі жыныста да жоғары мүмкіндіктерді көрсетті: ерлер үшін OR = 7.42 (95% CI: 4.94–11.7) және әйелдер үшін OR = 2.56 (95% CI: 1.64–4.17). Кеуде тұсындағы ауырсынулар (cp: ерлерде OR = 3.01 [2.48–3.69], әйелдерде OR = 4.44 [2.71–7.83]), сондай-ақ ST сегментінің депрессиясы (oldpeak және slope) екі жыныста да үлкен рөл атқарады. Керісінше, холестерин деңгейі (chol) бұл тұрғыда айтарлықтай сызықтық әсер көрсетпеді (екі жыныс үшін де OR = 1.00).&lt;/p&gt;\n&lt;h4 id=\"zhas-toby\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#zhas-toby\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жас тобы&lt;/span&gt;&lt;/a&gt;Жас тобы&lt;/h4&gt;\n&lt;p&gt;Жас бойынша стратификацияланған логистикалық регрессиялық талдау әйелдерге қарағанда ерлерде жас пен жүрек аурулары арасындағы байланыстың күштірек екенін анықтады. 29–39 жастағы ересектер референтті топ ретінде алынды. 40–59 жастағы ерлерде ЖҚТА даму ықтималдығы едәуір жоғары болды (OR = 2.36, 95% CI: 1.37–4.14, p = 0.002), ал 60–77 жастағы топта бұл қауіп тіпті күшейді (OR = 6.95, 95% CI: 3.76–13.1, p &amp;lt; 0.001). 40–59 жастағы әйелдерде жаспен айтарлықтай байланыс байқалмады (OR = 1.41, 95% CI: 0.43–6.41, p = 0.60), ал 60–77 жастағы үлкенірек әйелдерде статистикалық маңыздылық шегіндегі өсу байқалды (OR = 3.86, 95% CI: 1.11–18.1, p = 0.051). Авторлардың пікірінше, мұндай айырмашылықтар эстрогеннің қорғаныш әсерімен және коронарлық анатомия ерекшеліктерімен түсіндіріледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Жас ерлерде ЖҚТА қаупімен тығыз байланысты (60–77 жастағы топта OR 6.95 дейін), ал әйелдерде қауіптің айтарлықтай өсуі кейінірек басталып, әлсіздеу көрінеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modelding-oenimdiligi-zhaene-bolzhamdy-taldau\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#modelding-oenimdiligi-zhaene-bolzhamdy-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельдің өнімділігі және болжамды талдау&lt;/span&gt;&lt;/a&gt;Модельдің өнімділігі және болжамды талдау&lt;/h4&gt;\n&lt;p&gt;ЖҚТА болжау үшін түрлі машиналық оқыту модельдері сынақтан өткізілді (4-сурет). Ансамбльдік әдістер, әсіресе кездейсоқ орман (Random Forest, RF) екі жыныс когортасында да жоғары ROC-AUC, AUPRC және F1-score мәндерімен тұрақты жоғары нәтижелер көрсетті. Логистикалық регрессия (LR) да бәсекеге қабілетті нәтижелер көрсетіп, сызықтық байланыстардың маңыздылығын растады. Әйелдер когортасында RF кросс-валидация тұрақтылығымен 0.90 шамасындағы ROC-AUC және AUPRC мәндеріне қол жеткізді. Ерлерде де RF пен LR тамаша көрсеткіштерді көрсетті, ал қарапайым Байес (GNB) пен k-жақын көршілер (KNN) модельдері үлкен өзгергіштікке ие болды. Сынақ пен кросс-валидация нәтижелерінің сәйкестігі тым қатты бейімделіп кетудің (overfitting) жоқтығын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;ROC-AUC — модельдің екі түрлі классты (мысалы, аурудың бары/жоғы) ажырату қабілетін сипаттайтын метрика.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"erler-toby\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#erler-toby\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ерлер тобы&lt;/span&gt;&lt;/a&gt;Ерлер тобы&lt;/h4&gt;\n&lt;p&gt;Ерлер кіші тобында белгілерді іріктеу төрт классификатор (LASSO, ElasticNet, GBM және RF) көмегімен жүргізілді (5-сурет). Төрт модельдің барлығында төрт негізгі болжаушы фактор ерекшеленді: ca (зақымдалған тамырлар саны), cp (кеуде ауруының түрі), slope (ST сегментінің көлбеуі) және thal (таллий тестінің нәтижелері). Мысалы, ca LASSO-да (шамамен 30%) және ElasticNet-те (шамамен 32%) ең жоғары маңыздылыққа ие болды, cp RF-те (шамамен 17%) және slope GBM-де (шамамен 23%) басым болды. Үздіксіз белгілер ортаңғы орындарды иеленді, ал бинарлы белгілер (restecg, fbs) ең аз салмаққа ие болды. Төрт тәсілдің сапасын бағалау барысында (3-кесте) олардың барлығы 90.4% бен 91.6% аралығындағы auROC мәндерін көрсетті.&lt;/p&gt;\n&lt;h4 id=\"aejelder-topshasy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#aejelder-topshasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әйелдер топшасы&lt;/span&gt;&lt;/a&gt;Әйелдер топшасы&lt;/h4&gt;\n&lt;p&gt;Әйелдер топшасында айнымалылардың маңыздылық рейтингі ерлер топшасынан айтарлықтай ерекшеленді (5-Сурет). Барлық төрт жіктеуіш бойынша thal ең күшті предикатор ретінде анықталды: оның маңыздылығы RF моделі бойынша шамамен 23%-дан LASSO моделі бойынша 40%-ға дейін жетті — бұл ерлер топшасындағы салмағынан едәуір жоғары. slope мен cp көрсеткіштері көптеген модельдерде екінші және үшінші орындарға ие болып (10–21%), ерлерде байқалған маңыздылық деңгейін сақтап қалды. Ең көзге түсетін гендерлік айырмашылық сарысулық холестерин (chol) деңгейінің жоғары маңыздылығы болды, ол әйелдерге арналған GBM (≈16%) және RF (≈12%) модельдеріндегі ең үздік төрт предикатордың қатарына енді, ал ерлерде бұл көрсеткіштің маңызы шамалы ғана болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әйелдер топшасында thal негізгі предикатор болып табылды (40%-ға дейінгі маңыздылықпен), ал модельдердің жалпы ажырату қабілеті auROC бойынша 90.0%-дан 94.8%-ға дейін жоғары деңгейде қалды (RF моделі 94.8% көрсеткішімен ең жақсы нәтиже көрсетті).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тағы бір маңызды жаңалық — ElasticNet моделінде fbs көрсеткішінің айқын көрінуі (≈19%), ал ерлер моделінде бұл көрсеткіш нолге жуықтап, қалған үш әйелдер моделінің басты предикаторлары арасында мүлдем болмады; бұл аталмыш байланыстың модельге тән екенін немесе шектеулі әйелдер іріктемесіндегі аз ғана жағдайларға байланысты екенін көрметді. Керісінше, LASSO мен ElasticNet модельдерінде ерлер арасында үздік үштікке кіретін ca көрсеткіші әйелдер топшасында алғашқы ондыққа да енбеді. Бұл нәтижелер жүректің инемиялық ауруындағы гендерлік айырмашылықтар туралы әдебиеттермен сәйкес келеді: әйелдерде менопаузадан кейін жалпы холестерин мен LDL холестерин деңгейі көтеріледі, ал эстрогеннің жүрек-қан тамырларын қорғайтын әсерінің жоғалуы ерлермен салыстырғанда жүрек-қан тамырлары ауруларының қаупін арттырады. Сонымен қатар, ангиография кезінде әйелдерде ерлерге қарағанда обструктивті емес ИБС жиірек анықталатыны белгілі: жүрек инемиялық ауруы күдігімен коронарлық ангиографиядан өткен әйелдердің шамамен 60–70%-ында обструктивті емес патология анықталса, ерлерде бұл көрсеткіш шамамен 30%-ды құрайды. Бұл көрініс әйелдердегі тамырлардың төменгі балдары мен обструктивті зақымданулардың аз болуынан көрініс табады [39], бұл ca көрсеткішінің әйелдер топшасында неге аз болжамдық салмаққа ие болғанына клиникалық түсініктеме береді. Жинақтай келгенде, бұл бақылаулар клиникалық предикаторлардың жүрек ауруы қаупіне қосатын салыстырмалы үлесі жынысқа байланысты әр түрлі болатынын және гендерлік стратификацияланған модельдер клиникалық маңызды патофизиологиялық айырмашылықтарды жақсырақ көрсете алатынын білдіреді.&lt;/p&gt;\n&lt;p&gt;Әртүрлі машиналық оқыту негізіндегі белгілерді таңдау тәсілдерін қолдану арқылы әйелдер топшасы үшін модельдің жұмысы 3-Кестеде жинақталған. Жалпы өнімділік ерлер топшасында байқалған мәндермен салыстырғанда ұқсас немесе біраз жоғары болды, auROC мәндері 90.0%-дан 94.8%-ға дейін өзгерді. RF негізіндегі белгілерді таңдау тәсілі ең жоғары auROC (94.8%) мәніне қол жеткізді, одан кейін ElasticNet (93.8%) мен GBM (93.1%) тұр. Сезгіштік (Sensitivity) 60.0% бен 80.0% аралығын құрады, ал ерекшелік (Specificity) барлық тәсілдер бойынша тұрақты түрде жоғары (89.7%–96.6%) болып қалды, бұл оң нәтижелерді анықтауға қарағанда сау адамдарды анықтаудағы жоғары тиімділікті білдіреді. Бұл нәтижелер әйелдердің іріктеме көлемінің аздығын және сыныптардың ықтимал теңгерімсіздігін көрсетуі мүмкін, сондықтан топшаға тән көрсеткіштерді түсіндіру кезінде сақтық таныту қажет.&lt;/p&gt;\n&lt;h4 id=\"zhynystar-bojynsha-salystyru\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#zhynystar-bojynsha-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жыныстар бойынша салыстыру&lt;/span&gt;&lt;/a&gt;Жыныстар бойынша салыстыру&lt;/h4&gt;\n&lt;p&gt;Екі топшаны салыстырғанда бірнеше маңызды тұстарды атап өткен жөн. Біріншіден, cp, slope, thal, chol, oldpeak және trestbps сияқты айнымалылар екі жыныс үшін де үздік ондыққа енді, бұл предикаторлардың ортақ негізі бар екенін көрсетеді. Екіншіден, ca ерлерде ғана, ал restecg әйелдерде ғана ерекше маңызды болды, бұл әрі қарай зерттеуді қажет ететін ықтимал жынысқа тән биомаркерлерді меңзейді. Үшіншіден, әйелдерде жалпы ажырату (auROC) ұқсас немесе жоғары болғанымен, сезгіштік пен ерекшелік арасындағы тепе-теңдік жыныстар бойынша айтарлықтай ерекшеленді — ерлер модельдері сезгіштікке, ал әйелдер модельдері ерекшелікке басымдық берді. Бұл нәтижелер жүрек ауруларына арналған гендерлік стратификацияланған болжамды модельдерді әзірлеуді қолдайды, өйткені бірыңғай біріктірілген модель предикаторлардың маңыздылығы мен жұмыс сипаттамаларындағы клиникалық маңызды айырмашылықтарды жасырып қалуы мүмкін.&lt;/p&gt;\n&lt;h4 id=\"oenimdilikting-anykhtalmaghanyn-butstrep-arkhyly-baghalau\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#oenimdilikting-anykhtalmaghanyn-butstrep-arkhyly-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өнімділіктің анықталмағанын бутстрэп арқылы бағалау&lt;/span&gt;&lt;/a&gt;Өнімділіктің анықталмағанын бутстрэп арқылы бағалау&lt;/h4&gt;\n&lt;p&gt;6-Суретте ерлер мен әйелдердің жүрек-қан тамырлары аурулары когорталарындағы RF моделі өнімділігінің бутстрэпке негізделген анықталмағандық квантификациясы (UQ) көрсетілген. Тест жиынын қайталап бутстрэп арқылы қайта іріктеу көмегімен F1-score, MCC, ACC, ROC-AUC, precision-recall қисығы астындағы аудан (AUPRC) және Брайер ұпайының (Brier score) таралымдары бағаланды. Нүктелік бағалаулар эмпирикалық 95% сенімділік интервалдарымен бірге көрсетілген.&lt;/p&gt;\n&lt;p&gt;Жалпы алғанда, RF моделі екі когортада да күшті болжамдық өнімділікті көрсетті, ROC-AUC пен AUPRC үшін салыстырмалы түрде тар анықталмағандық интервалдары жіктеудің тұрақтылығын растайды. Ерлер когортасы жоғары F1-score, MCC және ROC-AUC мәндерінің маңызында шоғырланған бутстрэп таралымдарымен тұрақты түрде жоғары болжамдық дәлдікті көрсетті, бұл қайта іріктелген деректер жиындарында берік жіктеу тұрақтылығын білдіреді. Брайер ұпайының таралымы салыстырмалы түрде төмен мәндерге бағытталған, бұл жақсы ықтималдық калибрлерін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әйелдер когортасында F1-score пен MCC үшін байқалған кеңірек сенімділік интервалдары іріктеме көлемінің аздығымен және әйелдер топшасындағы үлкен гетерогенділікпен байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әйелдер когортасында да модель күшті ажырату қабілетін көрсетті, әсіресе ROC-AUC пен AUPRC үшін, дегенмен ерлер топшасына қарағанда F1-score пен MCC бойынша кеңірек бутстрэп таралымдары байқалды. Бұл өскен вариабельділік деректер көлемінің аз болуын және әйелдер топшасындағы үлкен біртекті еместікті көрсетеді. Осы өзгермелілікке қарамастан, сенімділік интервалдары клиникалық тұрғыдан қабылдан диапазондарда қалып, модельдің сенімділігі сақталғанын көрсетті.&lt;/p&gt;\n&lt;p&gt;Айта кету керек, ROC-AUC пен AUPRC екі когортада да ең кіші салыстырмалы анықталмағандықты көрсетті, бұл рейтингке негізделген ажыратудың F1-score және MCC сияқты шекті мәнге тәуелді жіктеу метрикаларына қарағанда тұрақтырақ болғанын білдіреді. Керісінше, салыстырмалы түрде төмен және тұрақты Брайер ұпайлары болжамды ықтималдықтардың жеткілікті түрде калибрленгенін растайды. Жиынтықтай келгенде, бұл нәтижелер ұсынылған RF құрылымы гендерлік стратификацияланған жүрек-қан тамырлары аурулары популяцияларында өлшенетін анықталмағандық бағалауларын сақтай отырып, күшті және қайталанатын болжамдық өнімділікке қол жеткізгенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"biomarkerlar-aeserin-taldaugha-arnalghan-genderlik-erekshelikterdi-zertteu\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#biomarkerlar-aeserin-taldaugha-arnalghan-genderlik-erekshelikterdi-zertteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Биомаркерлар әсерін талдауға арналған гендерлік ерекшеліктерді зерттеу&lt;/span&gt;&lt;/a&gt;Биомаркерлар әсерін талдауға арналған гендерлік ерекшеліктерді зерттеу&lt;/h4&gt;\n&lt;p&gt;Ерлер мен әйелдер топшаларында жүрек ауруларымен сенімді, шатастырушы факторларға (конфаундерлерге) түзетілген қауымдастықтары бар айнымалыларды анықтау үшін жыныс бойынша жіктелген Causal Forest DML және сызықтық LinearDML талдаулары қолданылды. Бұл тәсіл себеп-салдар бағытын растау үшін емес, бақылау деректерінің араластырушы құрылымы ескерілгеннен кейін қандай болжамды көрсеткіштердің маңызды байланыстарды сақтайтынын бағалау үшін пайдаланылды. 7-суретте көрсетілгендей, ерлер арасында ca, slope, thal және exang екі бағалау алгоритмі аясында да ең күшті түзетілген байланыстарды көрсетті, бұл құрылымдық коронарлық обструкция мен ишемиялық бұзылулардың басқа белгілермен корреляциялық қиылысуына қарамастан жүрек ауруы қаупімен берік байланысқанын білдіреді.&lt;/p&gt;\n&lt;h4 id=\"biomarkerlar-aeserin-taldaugha-arnalghan-genderlik-erekshelikterdi-zertteu-zhalghasy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#biomarkerlar-aeserin-taldaugha-arnalghan-genderlik-erekshelikterdi-zertteu-zhalghasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Биомаркерлар әсерін талдауға арналған гендерлік ерекшеліктерді зерттеу (жалғасы)&lt;/span&gt;&lt;/a&gt;Биомаркерлар әсерін талдауға арналған гендерлік ерекшеліктерді зерттеу (жалғасы)&lt;/h4&gt;\n&lt;p&gt;Әйелдер арасында thal мен slope екі әдіс бойынша да өз маңыздылығын тұрақты түрде сақтап қалды, бұл ишемияға қатысты жолдардың әйелдердегі жүрек-қан тамырлары қаупі үшін негізгі болып қалатынын растайды; сонымен қатар exang тек параметрлік LinearDML аясында ғана маңызды болды, бұл параметрлік емес Causal Forest DML дәлдігін шектеген әйелдердің шағын таңдама көлеміне (n = 193) байланысты оның байланысы thal мен slope-ке қарағанда аз тұрақты болғанын көрсетеді. Дегенмен, ca әйелдерде маңызды болмады, бұл тамыр патологиясындағы жыныстық айырмашылықтарды немесе әйелдер санының аз болуына (n = 193) байланысты төмендеген статистикалық қуатты көрсетуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Causal Forest DML және LinearDML — көптеген жасырын және айқын факторларды ескере отырып, белгілердің әсерін бағалайтын заманауи машиналық оқыту әдістері.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жас, холестерин, тыныштық күйдегі қан қысымы және аш қарынға қандағы қант мөлшерін қоса алғанда, дәстүрлі қауіп факторлары нөлді қамтитын сенімділік интервалдарымен елеусіз түзетілген байланыстарды көрсетті, бұл олардың стандартты модельдердегі болжамды маңыздылығы тәуелсіз байланысты емес, негізінен жалпы корреляциялық құрылымды көрсететінін куәландырады. Causal Forest DML өзгерімпаздық сипатына сай LinearDML-ге қарағанда кеңірек сенімділік интервалдарын тудырды, алайда екі әдіс те бірдей маңызды белгілерге келіп тіреліп, осы байланыстардың сенімділігін арттырды. Бұл талдау бақылау деректеріне негізделгендіктен, өлшенбеген конфаундерлерді толығымен жоққа шығару мүмкін емес екенін және бұл нәтижелер орныққан себеп-салдарлық әсерлер ретінде емес, түзетілген қауымдастықтар ретінде түсіндірілуі тиіс екенін атап өткен жөн.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау деректеріне негізделген, сондықтан анықталған байланыстар дәлелденген себеп-салдарлық әсерлер емес, түзетілген қауымдастықтар болып табылады, ал әйелдер таңдамасының аздығы статистикалық қуатты төмендетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kalibrleu-zhaene-klinikalykh-pajdalylykh\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#kalibrleu-zhaene-klinikalykh-pajdalylykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Калибрлеу және клиникалық пайдалылық&lt;/span&gt;&lt;/a&gt;Калибрлеу және клиникалық пайдалылық&lt;/h4&gt;\n&lt;p&gt;Калибрлеу қисықтары болжамды ықтималдықтар мен байқалған оқиғалар жиілігі арасында ерлер мен әйелдер когорталарында жалпы жақсы сәйкестікті көрсетті, бұл модельдің жүрек-қан тамырлары ауруларының шынайы қаупін шынайы көрсететінін білдіреді. Клиникалық жағдайларда ықтималдықтың дәл бағалары өте маңызды, өйткені қауіпті асыра бағалау негізсіз фармакологиялық араласуларға әкелуі мүмкін, ал кем бағалау ерте алдын алу шараларын жіберіп алуға соқтыруы мүмкін. 6-суретте көрсетілген және бутстрэп көмегімен бағаланған Brier ұпайлары ерлер топшасында шамамен 0.10 және әйелдер топшасында 0.07 төңірегінде шоғырланып, модельдің жүрек-қан тамырлары аурулары қаупін жүйелі түрде асырмай немесе кемітпей, сенімді және жақсы калибрленген ықтималдық бағаларын беретінін растады.&lt;/p&gt;\n&lt;h4 id=\"kalibrleu-zhaene-klinikalykh-pajdalylykh-zhalghasy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#kalibrleu-zhaene-klinikalykh-pajdalylykh-zhalghasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Калибрлеу және клиникалық пайдалылық (жалғасы)&lt;/span&gt;&lt;/a&gt;Калибрлеу және клиникалық пайдалылық (жалғасы)&lt;/h4&gt;\n&lt;p&gt;Тесттік жиынтық пен кросс-валидация өнімділігі бағалары арасындағы сәйкестік, әсіресе Random Forest (RF) сияқты ансамбльдік әдістер үшін, ұсынылған моделдеу тәсілінің жыныс бойынша жіктелген популяциялардағы жалпы қолданылуы мен қайталанатындығын одан әрі нығайтады. Сонымен қатар, жыныс бойынша жіктелген моделдеу тәсілі ерлер мен әйелдер арасындағы жүрек-қан тамырлары патофизиологиясындағы белгіленген айырмашылықтарды ескеру арқылы клиникалық қолданысты жақсартады, бұл болжанған қауіп бағалары клиникалық маңызды гетерогенділікті жасырып қалуы мүмкін бірыңғай біріктірілген модельден алынбай, әрбір пациент топшасына бейімделуін қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдер тамаша калибрлеуді көрсетті (Brier ұпайы ерлерде ~0.10 және әйелдерде ~0.07), бұл олардың сыртқы валидациядан кейін жүрек-қан тамырлары аурулары скринингіне біріктірілу мүмкіндігін растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жалпы алғанда, бұл нәтижелер әзірленген тәсілді клиникалық тәжірибеде жүрек-қан тамырлары ауруларының скринингі мен ерте анықтау жұмыс процестеріне әлеуетті біріктіруді қолдайды, дегенмен енгізер алдында қосымша сыртқы валидация мен клиникалық бағалау қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Brier ұпайы (Brier score) — ықтималдық болжамдарының дәлдігін бағалайтын метрика, мұнда нөлге жақын мәндер модельдің мінсіз калибрленгенін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Бұл зерттеу жүрек-қан тамырлар ауруларын (ЖҚТА) болжау үшін машиналық оқытуды, белсіздікті бағалауды, түсіндірмелі жасанды интеллектті және себеп-салдарлық байланыс параметрлерін біріктіретін кешенді жасанды интеллект жүйесін әзірлеп, бағалады. Когортаға 918 қатысушы (725 ер адам және 193 әйел) кірді. Нәтижелер озық тәсілдер ауру механизмдері мен жеке тәуекелді бағалау бойынша түсінікті мәліметтер бере отырып, тамаша болжау қабілетін қамтамасыз ететінін көрсетеді. Ұсынылған жүйе бұрынғы жұмыстардың шектеулерін жояды.&lt;/p&gt;\n&lt;p&gt;Зерттеудің негізгі жетістігі гибридті импутация стратегиясы арқылы қол жеткізілген айтарлықтай жақсарту болды. ca, thal және slope сияқты жетіспейтін айнымалылар MICE үздіксіз импутациясы және RandomForest (RF) бақыланатын категориялық импутациясы арқылы өңделді. Импутациядан кейін RF көрсеткіштері барлық метрикалар бойынша жақсарды: F1-score 0.87-ден 0.89-ға, ROC-AUC 0.90-нан 0.92-ге, MCC 0.70-тен 0.73-ке, ал AUPRC 0.88-ден 0.91-ге өсті.&lt;/p&gt;\n&lt;p&gt;Барлық жіктеуіштер арасында RF ең жақсы нәтиже көрсетті. Ерлер тобында RF ең жоғары auROC (91.6%) мәніне қол жеткізді (сезімталдығы 90.2%, ерекшелігі 75.5%). Әйелдер тобында RF 94.8% auROC көрсетті, бірақ сезімталдық төменірек (60.0%) болды. Логистикалық регрессия (LR) да ерлер мен әйелдерде сәйкесінше 90.7% және 90.0% auROC көрсетіп, жоғары бәсекеге қабілеттілігін байқатты. Белгілердің маңыздылығын талдау ерлер мен әйелдердегі ортақ және гендерлік ерекшеліктері бар тәуекел факторларын анықтады. Ерлерде ca, cp, slope және thal маңызды болжаушылар қатарына кірсе, әйелдерде thal басым предикторы болды (LASSO бойынша 40%, RF бойынша ~23%). Бустрэп көмегімен жүргізілген белсіздікті талдау ROC-AUC үшін сенімділік интервалдарын көрсетті, алайда әйелдерде таңдама көлемінің кішілігіне (n=193) байланысты шашыраңқылық байқалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гибридті импутация мен RF ЖҚТА болжау дәлдігін жақсартып (ROC-AUC 0.92, әйелдерде 94.8%), гендерлік айырмашылықтарды анықтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kueshti-zhakhtary,-shekteuleri-zhaene-validaciya\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#kueshti-zhakhtary,-shekteuleri-zhaene-validaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Күшті жақтары, шектеулері және валидация&lt;/span&gt;&lt;/a&gt;Күшті жақтары, шектеулері және валидация&lt;/h4&gt;\n&lt;p&gt;Жұмыстың маңызды үлестерінің бірі ЖҚТА қаупін бағалауға себеп-салдарлық машиналық оқыту (DML) әдістерін біріктіру болды. Гендерлік стратификацияланған DML талдаулары ерлерде ca, slope, thal және exang мәндерін ең күшті қауымдастықтар ретінде анықтады, ал әйелдерде thal мен slope маңыздылығын сақтап қалып, ca маңызды емес болып шықты. Қызығы, дәстүрлі тәуекел факторлары (жас, холестерин, қан қысымы) конфаундерлер ескерілгеннен кейін елеусіз орташа әсер көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Себеп-салдарлық машиналық оқыту (DML) — қарапайым статистикалық корреляциялар мен шынайы себеп-салдарлық тәуекел факторларын ажырататын әдіснама.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шектеулер қатарына ретроспективті бақылау деректерін пайдалану және әйелдердің кішірек іріктемесі кіреді, бұл болашақта үлкенірек көп орталықты популяцияларда сыртқы валидацияны қажет етеді. Сондай-ақ себеп-салдарлық талдау бақылау деректерінде толық тексерілмейтін болжамдарға сүйенеді. Болашақта проспективті клиникалық енгізу, электрондық медициналық жазбалар мен тағылатын датчиктерді біріктіру жоспарлануда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу ретроспективті деректерге негізделген және әйелдер саны аз (n=193), сондықтан себеп-салдарлық тұжырымдар проспективті клиникалық валидацияны талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khoghamdykh-densaulykh-sakhtaugha-engizu\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#khoghamdykh-densaulykh-sakhtaugha-engizu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қоғамдық денсаулық сақтауға енгізу&lt;/span&gt;&lt;/a&gt;Қоғамдық денсаулық сақтауға енгізу&lt;/h4&gt;\n&lt;p&gt;Қоғамдық денсаулық сақтау тұрғысынан бұл нәтижелердің маңызы зор. Бірінші кезекте, жоғары болжамдық дәлдігі бар қауіпті топтағы тұлғаларды анықтау ерте араласуға және мақсатты алдын алу шараларына жол ашып, жүрек-қан тамырлары аурулары мен өлім-жітімді әлеуетті түрде азайтады. Екіншіден, гендерлік ерекшеліктерге байланысты себеп-салдар факторларын анықтау дербестендірілген профилактика стратегиялары мен дәл кардиология бастамаларын дамытуға қолдау көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қауіпті топтарды дұрыс анықтау және гендерлік айырмашылықтарды ескеру ерте профилактика мен жекелендірілген тәсіл арқылы жүрек-қан тамырлары сырқаттанушылығын төмендетуге көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Үшіншіден, белсіздік пен болжамсыздықтарды ескеретін болжамдар дәрігерлердің сенөмін арттырып, жасанды интеллект жүйелерін күнделікті медициналық тәжірибеге жауапкершілікпен енгізуге ықпал етеді, өйткені бұл бағалаулар дәрігерлерге қосымша тексеруді немесе мұқият талдауды қажет ететін болжамдарды анықтауға көмектеседі. Соңында, физикалық жүктеме туындататын исхемиялық реакциялар сияқты өзгертуге болатын қауіп факторларының себептерін анықтау қоғамдық денсаулық сақтау ресурстарын скринингке, профилактикаға және өмір салтын өзгертуге тиімдірек бөлуге көмектеседі. Машиналық оқыту бірнеше қауіп факторларын біріктіру және деректердегі заңдылықтарды анықтау арқылы дәстүрлі жүрек-қан тамырлары қаупін болжауды толықтыра алады, бірақ оны алмастыра алмайды, дегенмен кеңінен клиникалық қолдану ең алдымен шынайы жағдайларда болашақты бағалаудан өтуіне байланысты болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Машиналық оқыту алгоритмдерін күнделікті медициналық тәжірибеге кеңінен енгізу нақты клиникалық жағдайларда міндетті түрде алдын ала тексеруден өтуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Жүрек-қан тамырлары аурулары жаһандық денсаулық сақтаудағы басты сын-қатерлердің бірі болып қала береді, бұл дұрыс, сенімді және клиникалық тұрғыдан түсінікті болжамды модельдердің қажеттілігін көр
