сетеді. Бұл зерттеу құрылымдық клиникалық деректер негізінде жүрек-қан тамырлары ауруларының қаупін болжау үшін гибридті деректерді алдын ала өңдеуді, озық машиналық оқытуды, белсіздікті бағалауды, түсіндірмелі жасанды интеллектті және себеп-салдарлық маңыздылықты біріктіретін кешенді жасанды интеллект жүйесін әзірледі.&lt;/p&gt;\n&lt;p&gt;Үздізбелі айнымалыларға арналған тізбекті теңдеулер арқылы көптік импутацияны және санаттық айнымалылар үшін кездейсоқ орман импутациясын біріктіретін гибридті стратегия ақпарат сапасын арттырып, болжам сапасын жақсартты, мұнда F1-score көрсеткіші 0.87-ден 0.89-ға дейін, ал ROC-AUC 0.90-нан 0.92-ге дейін өсті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Импутация (MICE және RF) — медициналық карталардағы жетіспейтін мәндерді статистикалық әдістер арқылы қалпына келтіру процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сыналған машиналық оқыту модельдерінің ішінде кездейсоқ орман (RF) алгоритмі ерлер мен әйелдер топтарында тұрақты түрде ең жоғары нәтижелерді көрсетті. Ол 0.90-нан жоғары ROC-AUC мәндерін, жоғары AUPRC, F1-score, Мэтьюс корреляция коэффициентін (MCC) және жақсы калибрлеуді қамтамасыз етіп, кросс-валидация кезінде тұрақтылықты сақтады. Бутстрэп негізіндегі белсіздікті бағалау болжамдардың сенімді екенін дәлелдеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әзірленген жүйе ROC-AUC көрсеткішін 0.92-ге, ал F1-score көрсеткішін 0.89-ға жеткізді, сонымен қатар кездейсоқ орман екі жыныс үшін де ең жоғары болжам тұрақтылығын көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл зерттеудің басты үлестерінің бірі жүрек-қан тамырлары қаупін бағалауға себеп-салдарлық машиналық оқытуды біріктіру болды. LinearDML және CausalForestDML модельдері себепші факторларды қарапайым статистикалық байланыстардан ажыратып, ірі қон тамырларының саны, ST сегментінің көлбеуі, талассемия күйі және жүктеме стенокардиясын жүрек аурулары қаупінің басты көрсеткіштері ретінде анықтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Себеп-салдарлық машиналық оқыту (Causal ML) — факторлар мен ауру арасындағы жай ғана байланысты емес, нақты емдік әсер етуге болатын шынайы себептерді анықтайтын тәсіл.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анықталған жыныстық айырмашылықтар жалпы популяциялық модельге сүйенбей, жекелендірілген қауіпті бағалауға көшудің маңыздылығын көрсетеді. Болашақ зерттеулер бұл жүйені кең ауқымды көп орталықты когорталар мен проспективті клиникалық сынақтар арқылы тексеруі тиіс.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f1.jpg\" alt=\"1-сурет: Жүрек-қан тамырлары ауруларын болжауға арналған белсіздікті ескеретін машиналық оқыту жүйесі мен қауымдастық зе\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Жүрек-қан тамырлары ауруларын болжауға арналған белсіздікті ескеретін машиналық оқыту жүйесі мен қауымдастық зерттеуінің зерттеу барысы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f2.jpg\" alt=\"2-сурет: Жас және жыныс топтары бойынша үздіксіз және санаттық жүрек-қан тамырлары қауіп факторларының таралуы. Үздіксіз\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Жас және жыныс топтары бойынша үздіксіз және санаттық жүрек-қан тамырлары қауіп факторларының таралуы. Үздіксіз айнымалылар олардың таралуын көрсету үшін тығыздық графиктер түрінде көрсетілген, ал санаттық айнымалылар әр санаттағы жиілік саны бар бағанды диаграммалар түрінде көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f3.jpg\" alt=\"3-сурет: Жүрек аурулары деректер жинағында бақыланатын толықтыруға дейінгі және кейінгі жетіспейтін деректер құрылымы жә\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Жүрек аурулары деректер жинағында бақыланатын толықтыруға дейінгі және кейінгі жетіспейтін деректер құрылымы және болжамды өнімділікті салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Жүрек аурулары деректер жинағында бақыланатын толықтыруға дейінгі және кейінгі жетіспейтін деректер құрылымы және болжамды өнімділікті салыстыру. Жоғарғы сол жақ панельде бірнеше айнымалыларда айтарлықтай жетіспеушілікті көрсететін жетіспеушілік матрицасы көрсетілген. Жоғарғы оң жақ панельде жетіспеушіліктің ең жоғары үлесі бар айнымалылар үшін пайыздық көрсеткіштер берілген. Төменгі панельде бақыланатын толықтыруға дейінгі және кейінгі кездейсоқ орман классификациясының өнімділігі салыстырылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f4.jpg\" alt=\"4-сурет: Ерлер мен әйелдер когорталарында жүрек-қан тамырлары ауруларын болжауға арналған машиналық оқыту жіктеу модельд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Ерлер мен әйелдер когорталарында жүрек-қан тамырлары ауруларын болжауға арналған машиналық оқыту жіктеу модельдерінің салыстырмалы өнімділігі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f5.jpg\" alt=\"5-сурет: Әр түрлі түстермен көрсетілген және жынысы бойынша стратификацияланған төрт түрлі машиналық оқыту моделі бойынш\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Әр түрлі түстермен көрсетілген және жынысы бойынша стратификацияланған төрт түрлі машиналық оқыту моделі бойынша белгілердің маңыздылығын рейтингілеу және жүрек-қан тамырлары қауіп факторларын салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f6.jpg\" alt=\"6-сурет: Жыныс бойынша стратификацияланған RF өнімділік метрикаларының бутстрэп үлестірімдері және 95% сенім интервалдар\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Жыныс бойынша стратификацияланған RF өнімділік метрикаларының бутстрэп үлестірімдері және 95% сенім интервалдары.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f-f7.jpg\" alt=\"7-сурет: Клиникалық белгілердің жүрек ауруы ықтималдығына әсерінің жынысқа тән ассоциациялық зерттеуінің машиналық оқыту\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Клиникалық белгілердің жүрек ауруы ықтималдығына әсерінің жынысқа тән ассоциациялық зерттеуінің машиналық оқыту бағалаулары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет: Клиникалық белгілердің жүрек ауруы ықтималдығына әсерінің жынысқа тән ассоциациялық зерттеуінің машиналық оқыту бағалаулары. (a) және (b) панельдерінде сәйкесінше ерлер мен әйелдер топшалары үшін LinearDML бағалаулары көрсетілген. (c) және (d) панельдерінде сәйкесінше ерлер мен әйелдер топшалары үшін CausalForestDML бағалаулары көрсетілген. Нүктелер орташа әсер ету әсерлерін білдіреді, ал көлденең сызықтар 95% сенім интервалдарын білдіреді. Қызыл нүктелер 5% деңгейінде статистикалық маңызды әсерлерді көрсетеді, ал сұр нүктелер маңызды емес әсерлерді көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-25/clinically-translatable-uncertainty-aware-machine-learning-f.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жүрек қаупін&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дәл бағалау&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қажеттілігі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;машиналық&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оқыту мен&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;энтропия&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;талдауы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ROC-AUC&lt;/text&gt;&lt;text x=\"426\" y=\"102\
