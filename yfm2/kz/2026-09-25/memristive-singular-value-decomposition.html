        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"238\" cy=\"139\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"502\" cy=\"254\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Есептеу мен жадты&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;біріктіретін жаңа буын&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мемристорлы чиптері&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f1.jpg\" alt=\"1-сур. / Деректерді жан-жақты талдау үшін MSVD көмегімен төмен рангті ұсыну. MSVD, яғни X = USVT, массивтік және шуылды \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сур. / Деректерді жан-жақты талдау үшін MSVD көмегімен төмен рангті ұсыну. MSVD, яғни X = USVT, массивтік және шуылды бастапқы деректерді (X) қысқа және түсінікті жинақы ақпаратқа (eX) айналдырады. U және V сәйкесінше сол және оң сингулярлық векторларды қамтитын матрицаларды білдіреді, ал S — сингулярлық мәндердің диагональды матрицасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Қазіргі компьютерлер процессор мен жад арасында деректерді тынымсыз тасымалдауға көп қуат жұмсайды. Инженерлер ақпаратты бір мезгілде сақтап, есептей алатын мемристорларға негізделген тәсілді ұсынды. Бұл күрделі математикалық операцияларды минималды энергия шығынымен орындауға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Мемристорлар деректерді сақтау мен есептеуді бір чипте біріктіреді.&lt;/li&gt;\n&lt;li&gt;SREA архитектурасы есептеу кезінде туындайтын қателерді жояды.&lt;/li&gt;\n&lt;li&gt;Энергия тиімділігі мен жылдамдық көрсеткіштері ондаған есе өсті.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеудің өзегі — деректерді талдауға арналған әмбебап әдіс сингулярлық жіктеу (SVD) жатыр. Дәстүрлі фон Нейман архитектурасы бұл кезде деректерді қайта-қайта тасымалдау салдарынан көп энергия жұмсайды.&lt;/p&gt;\n&lt;p&gt;Ғалымдар бұл кедергіні айналып өту үшін жақсартылған таңдаулы ұсыныс архитектурасын (SREA) жасап шығарды. Бұл жүйе есептеу кезіндегі қателіктер мен сандық ауытқуларды барынша азайтады. Нәтижесінде жүйе кескіндерді жақсарту, эпидемиологиялық деректерді қалпына келтіру және тілдік модельдерді іске қосу міндеттерінде жоғары дәлдік көрсетті.&lt;/p&gt;\n&lt;p&gt;Тестілеу нәтижелері бұл тәсілдің энерготиімділігі мен жылдамдығын кәдімгі жабдықпен салыстырғанда ондаған есе арттыратынын көрсетті. Бұл жасанды интеллект жүйелерін мобильді құрылғылар мен шеткі есептеулерде қолдануға жол ашады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әзірлеме әзірге симуляциялар мен эксперименттік чиптер базасында сынақтан өткізілді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Ғылыми есептеулерде, сигналдарды өңдеуде және машиналық оқытуда кеңінен қолданылатын матрицалардың сингулярлық жіктелуі (SVD) сияқты қайталанатын есептеулер жады мен есептеу блоктры бөлек орналасқан дәстүрлі фон Нейман архитектурасында үлкен көлемде энергия жұмсайды. Деректерді үнемі тасымалдау қажеттілігі күрделі ақпаратты өңдеуде елеулі қиындықтар тудырады. Осы мәселені шешу үшін авторлар жадыда есептеу (compute-in-memory, CIM) мемристивті чиптеріне негізделген мемристивті SVD (MSVD) жүйесін ұсынады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сипатталған тәсіл мемристивті чиптердің модельдері мен симуляторларында сынақтан өтті, алайда оны өндірістік деңгейде толық масштабтау қосымша инженерлік шешімдерді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Итерациялар барысында цифрлық дәлдікті сақтау үшін деректерді іріктеп ұсынуды жақсартатын арнайы архитектура (selective representation enhanced architecture, SREA) қолданылған. MSVD тиімділігі күрделілігі артып келе отырып, үш бағытта дәлелденді: суреттерді жақсарту және эпидемиологиялық деректерді қалпына келтіру үшін төмен рангті жуықтау; қолданушы тарапынан масштабталатын тану, мұнда инкрементальды MSVD бұрынғы ақпаратты өзгертпей жаңа қолданушыларды қосуға мүмкіндіек береді; үлкен тілдік модельдердің салмақтарын жіктеу, мұнда MSVD негізіндегі бастапқы күйге келтіру математикалық тесттерде стандартты дәл баптау (fine-tuning) әдісінен тұрақты түрде асып түседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жадыда есептеу (compute-in-memory, CIM) — бұл деректерді процессорға тасымалдамай, тікелей жады ұяшықтарының өзінде өңдеу арқылы энергия шығынын айтарлықтай азайтатын озық технология.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SREA архитектурасы оңтайландырылмаған MSVD-мен салыстырғанда энергия шығынын азайтып, жинақталу жылдамдығын арттырады. Жалпы алғанда, толық жүйе барлық көрсетілген сценарийлер бойынша дәстүрлі аппараттық құралдармен салыстырғанда энергия тиімділігі мен жылдамдық жағынан бірнеше есе артық нәтиже көрсетеді, және бұл артықшылықтар инкрементальды режимдегі әрбір жаңарту циклі сайын арта түседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CIM чиптері мен SREA архитектурасына негізделген MSVD жүйесі барлық сынақ сценарийлерінде дәстүрлі аппараттық құралдардан жылдамдық пен энергия тиімділігі жағынан бірнеше есе асып түседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыс әртүрлі қолданбалы сценарийлерде SVD операцияларын едәуір жылдамдатады және мемристивті жүйелердің мүмкіндіктерін тек арнайы есептермен шектемей, жалпы мақсаттағы есептеулер саласына кеңейтуге жол ашады.&lt;/p&gt;\n&lt;p&gt;Төмен ранглі көріністер жоғары өлшемді деректерден маңызды үлгілерді шығарып алу және есептеу күрделілігін айтарлықтай төмендету үшін өте маңызды құрал болып табылады. Сингулярлық жіктеу (SVD) ақпараттың ең аз жоғалуын қамтамасыз ететін математикалық оңтайлы әдіс ретінде қызмет етеді. Соңғы жылдары SVD биомедициналық деректерді өңдеуде және үлкен тілдік модельдерді (LLM) бейімдеуде кеңінен қолданыла бастады. Алайда, дәстүрлі CMOS негізіндегі фон Нейман архитектураларында бұл есептеулер деректерді жиі жылжыту салдарынан үлкен энергия тұтынуға және ұзақ өңдеу уақытына әкеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сингулярлық жіктеу (SVD) және мемристорлар&lt;br /&gt;\nSVD — бұл деректерді сығу және жасырын заңдылықтарды табу үшін матрицаны құрамдас бөліктерге бөлетін сызықтық алгебра әдісі. Мемристорлар (CIM) есептеулерді тікелей жад ячейкасында орындау арқылы процесті күрт жылдамдатады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жадтағы есептеулер (CIM) бұл мәселенің тиімді шешімін ұсынады. Дегенмен, SVD-ны мемристорлық базаға көшіру ерекше қос итерациялық процесс пен көп масштабты шығысқа байланысты екі маңызды қиындық тудырады (Сурет SN). Біріншіден, итерация кезеңінде қателердің жиналуына байланысты сандық дрейф пайда болады. Екіншіден, бастапқы матрицадан есептелген мәндердің әсерін алып тастау кезінде дефляция қалдықтары пайда болады.&lt;/p&gt;\n&lt;p&gt;SVD алгоритмі мен CIM жад арасындағы байланысты қамтамасыз ету үшін авторлар селективті ұсынысты күшейтілген архитектураны (SREA) ұсынды. Бұл жүйе сандық дрейфті азайту үшін қосарланған дәлдіктегі карта жасауды (DPM) және дефляция қалдықтарын минимизациялау үшін векторлық өңдеуді нақтылауды (VPR) қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MSVD тиімділігі мен дәлдігі&lt;br /&gt;\nSREA көмегімен MSVD кескінді жақсарту тапсырмаларында 31.0 дБ PSNR және 0.940 SSIM мәніне қол жеткізді, сонымен қатар COVID-19 пандемиясы кезіндегі деректерді қалпына келтіруде 0.999 корреляция коэффициентін көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Перифериялық оқыту тапсырмалары үшін жасалған инкрементальды MSVD әдісі жесттерді тану және ұйқы сатыларын анықтау кезінде сәйкесінше 19.29% және 11.07% жоғары дәлдік көрсетті. Сонымен қатар, LLaMA3.2-3B үлгісі үшін MSVD негізіндегі бастапқы күйге келтіру GSM8K деректер жинағында стандартты әдістен 4.85 тармаққа (10.45%), ал MATH жинағында 0.68 тармаққа (6.27%) асып түсті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өнімділік көрсеткіштері бойынша ескерту&lt;br /&gt;\nБарлық нәтижелер симуляцияларға негізделген; физикалық құрылғылардағы ұзақ мерзімді тұрақтылық қосымша зерттеуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бенчмарк нәтижелері SREA көмегімен энергия тұтыну 48.5%-ға азайып, жылдамдық 48.1%-ға артқанын көрсетті. Дәстүрлі CMOS жабдығымен салыстырғанда, MSVD 29.9 есе жоғары энергия тиімділігі мен 19.0 есе жоғары жылдамдыққа қол жеткізеді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;...&lt;/p&gt;\n&lt;h4 id=\"toemendeu-sipattamasy\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#toemendeu-sipattamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Төмендеу сипаттамасы&lt;/span&gt;&lt;/a&gt;Төмендеу сипаттамасы&lt;/h4&gt;\n&lt;p&gt;SREA алгоритмінің тиімділігін тексеру үшін авторлар алдымен өлшемі 150 × 4 матрица болып табылатын IRIS деректер жинағында тәжірибелер жүргізді. SREA аппараттық жүзеге асыру үшін мынадай параметрлермен баптады: DPM үшін [2, 5] биттік кесу; жүйенің стандартты 8 биттік кіріс дәлдігіне қосымша 6 кіріс биті; және VPR үшін 4 рет векторлық қайталау. 3a-суретте 20 тәжірибенің орташа мәндері бойынша SREA бар және онсыз есептелген сингулярлық мәндер көрсетілген. Бірінші сингулярлық мән тез жинақталады, ал кейінгі мәндер қалдық қателіктердің жиналуына байланысты баяуырақ жинақталады. SREA қолданылган MSVD кішірек қателерді береді, бұл жылдамырақ әрі дәлірек итерацияларды білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SREA (Sparse Reconstruction Error Alleviation) — аппараттық жүйелердегі есептеу қателерін азайту тәсілі, ал DPM пен VPR оның негізгі модульдері болып табылады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3b-суретте SREA бар және онсыз есептелген сингулярлық мәндердің қателері салыстырылған: SREA бар MSVD стандартты MSVD-мен салыстырғанда орташа дәлдікті 13× дейін жақсартатынын көрсетеді. 3c-суретте қалпына келтірілген сингулярлық векторлар (RSV) үшін сандық қателіктердің таралуы берілген. SREA көмегімен шешілген векторлардың қатесінің стандартты ауытқуы σ = 0.192 құрайды, бұл SREA-сыз мәннен (σ = 0.415) екі есе аз, бұл дәлдіктің артқанын растайды. 3d, e-суреттер алғашқы 3 RSV және LSV векторларының эволюциясын көрсетеді, олар бірнеше итерацияда дәл жинақталады. SREA-ның жеке компоненттерінің тиімділігін бағалау үшін абляциялық талдау жасалды (SN 6-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SREA компоненттерінің синергиясы сингулярлық мәндердің дәлдігін 13× дейін жақсартады және RSV қатесінің стандартты ауытқуын екі есеге азайтады (σ = 0.192).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қос дәлдіктегі бейнелеу (DPM) сингулярлық мән қателерін 8.0× дейін төмендетсе, векторлық өңдеуді нақтылау (VPR) қатені 3.4× дейін қысқартады. SREA қағидаттарын түсіндіру үшін алынған шешімдер басты компоненттер талдауы арқылы екі өлшемді параметрлік кеңістікке прокцияланып, әр түрлі рангтер үшін реконструкция қатесі ландшафтары алынды (3f-сурет; толық траекториялар SN 7-суретте және 1-ескертпеде келтірілген). Реконструкция қатесінің ландшафтары SREA және оның компоненттері итеративті динамикаға қалай әсер ететінін көрсетеді. DPM жеке итерациялар үшін тігірек ландшафттарды түзеді, бірақ жоғары рангілі шешімдерде қалдықтардың кесірінен тікелей жинақталу жолдарын орнатуда қиналады. Ал VPR неғұрлым толық дефляцияға қол жеткізеді, алайда тек осы компонентке сүйенетін жүйелер сандық ығысуға ұшырайды. Синергетикалық әсердің арқасында SREA кез келген жеке компонентке қарағанда тиімдірек оңтайландыру траекторияларын жасайды.&lt;/p&gt;\n&lt;h4 id=\"toemen-rangti-zhuykhtau\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#toemen-rangti-zhuykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Төмен рангті жуықтау&lt;/span&gt;&lt;/a&gt;Төмен рангті жуықтау&lt;/h4&gt;\n&lt;p&gt;Төмен рангті жуықтау кескіндер мен уақытша деректерді өңдеу үшін аса маңызды болып табылады. Авторлар MSVD-нің SREA-мен тиімділігін өлшемі 256 × 256 болатын HKU логотипі көмегімен көрсетті (4a-сурет; толық конфигурациялар SN 3-кестеде). Кескін 16 × 16 блоктарға бөлініп, алғашқы 25% рангтерді сақтау үшін MSVD арқылы өңделді. Сапаны бағалау үшін PSNR және SSIM метрикалары қолданылды. Бағдарламалық SVD нәтижелерімен салыстырғанда, SREA бар MSVD максималды PSNR 31.0 дБ және максималды SSIM 0.940 мәніне қол жеткізеді, бұл SREA-сыз MSVD-ге қарағанда PSNR бойынша 4.8 дБ-ге және SSIM бойынша 0.114-ге артық (4b, c-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;PSNR және SSIM — кескінді қалпына келтіру сапасын бағалайтын стандартты көрсеткіштер: мәндері қаншалықты жоғары болса, нәтиже түпнұсқаға соншалықты жақын болады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нейрондық желілерге негізделген және қысылған өлшеу әдістерімен салыстырғанда (SN 8, 9-сурет), MSVD негізіндегі төмен рангті реконструкция үлкен ауқымды параметрлер мен ұзақ оқытуды қажет етпейтін аппараттық қамтамасыз етуге қолайлы тиімділікті ұсынады. Жоғары дәлдікті қажет ететін қолданбалар үшін жүйе өнімділігін жіңішке DPM және VPR артықшылығы арқылы одан әрі арттыруға болады. MSVD-нің уақытша деректермен жұмыс істей алатынын тексеру үшін ол АҚШ-тың 51 штатындағы апта сайынғы COVID-19 ауруханаға жатқызу деректеріне қолданылды (104 × 51 матрица). Бірінші және екінші сингулярлық векторларды пайдалана отырып декомпозиция штаттардағы әртүрлі пандемиялық трендтерді көрсетті (4d, e-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SREA бар MSVD кескіндер үшін 31.0 дБ PSNR және 0.940 SSIM мәніне қол жеткізеді, ал COVID-19 уақыт қатары үшін алғашқы екі ранг бойынша 0.999 корреляция коэффициентін береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SREA-мен біріктірілген MSVD бірінші компонент үшін µ = -4.89 × 10⁻⁵ және екінші компонент үшін µ = 6.72 × 10⁻³ болатын орташа қателермен жоғары дәлдікті көрсетеді. Қалпына келтірілген матрицалар мен бағдарламалық эталон арасындағы корреляция коэффициенттерінің талдауы SREA көмегімен жақсартылған реконструкциялар алғашқы екі ранг үшін 0.999 және үшінші ранг үшін 0.995 коэффициенттеріне қол жеткізетінін растайды (4f-сурет). Бұл көрсеткіштер SREA-ның итеративті дефляция кезіндегі сандық ығысулар мен қалдықтарды азайту қабілетінің арқасында мүмкін болғанын дәлелдейді.&lt;/p&gt;\n&lt;h4 id=\"masshtabtalatyn-zhuejelerge-arnalghan-inkrementaldy-matricalykh-zhikteu\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#masshtabtalatyn-zhuejelerge-arnalghan-inkrementaldy-matricalykh-zhikteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Масштабталатын жүйелерге арналған инкрементальды матрицалық жіктеу&lt;/span&gt;&lt;/a&gt;Масштабталатын жүйелерге арналған инкрементальды матрицалық жіктеу&lt;/h4&gt;\n&lt;p&gt;Инкрементальды SVD биомедициналық сигналдарды өңдеуде белгілерді тиімді бөліп алу, олардың өлшемі мен есептеу жүктемесін азайту үшін кеңінен қолданылады, бұл оны электромиограмма (ЭМГ) мен электроэнцефалограмма (ЭЭГ) сигналдарын талдауға арналған тағылатын медициналық құрылғыларға біріктіруге мүмкіндік береді. Физиологиялық сигналдар адамдар арасында айтарлықтай ерекшеленетіндіктен және бірдей белсенділік әр түрлі пайдаланушыларда бірегей өрнектер тудыратындықтан, бұрынғы пайдаланушыларда оқытылған классификаторларды жаңа пайдаланушыларға қолдану қиынға соғады. Осы мәселені шешу үшін авторлар пайдаланушылар бойынша масштабталатын тануға арналған инкрементальды MSVD жүйесін ұсынады (5a-сурет). Бұл тәсіл жүйені нөлден қайта есептемей-ақ жаңа пайдаланушыларды тиімді қосу үшін алдын ала есептелген сингулярлы компоненттерді (RSV) пайдаланады (5b-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инкрементальды SVD және RSV — жаңа деректер қосылған кезде матрицалық жіктеулерді \"жол-жөнекей\" жаңарту әдістері, ал мемристорлар — есептеулерді тікелей жадта орындауға мүмкіндік беретін аппараттық элементтер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе NinaPro деректер жиынын пайдалана отырып, 4 жест үшін 10 арналы ЭМГ сигналдары негізінде ЭМГ жесттерін тану тапсырмасында сыннан өтті (5c-сурет), мұнда пайдаланушылар саны 2-ден 8-ге дейін біртіндеп арттырылды. Әр қадамда тек жаңа пайдаланушылардың деректерін қамтитын 864 × 500 өлшемді сигнал матрицасы SREA конфигурациялары бар инкрементальды MSVD көмегімен 500 × 6 өлшемді белгі экстракторларын жаңарту үшін қосылды. 2 пайдаланушы үшін 15 қайталау бойынша орташа дәлдік 88.26% құрады (бағдарламалық жасақтамадағы 89.58%-ға қарағанда) (5d-сурет). Пайдаланушылар саны өскен сайын (5e-сурет), 2 пайдаланушының RSV-лерін 8 пайдаланушы сигналдарына тікелей қолдану дәлдіктің күрт төмендеуіне әкеледі, бірақ инкрементальды MSVD жаңартуларсыз 64.72%-ға қарсы 84.01% орташа дәлдікке қол жеткізіп, өнімділікті 19.29%-ға қалпына келтіреді (SN-сурет). Қателер матрицасы (SN-сурет) танудың сенімділігін растайды, ал RSV талдауы (SN-сурет) пайдаланушылар қосылған кезде бірінші вектор сигналдың ортақ сипаттарын бейнелеп минималды өзгеретінін, ал кейιнгі векторлар жеке ерекшеліктерге беімделетінін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Масштабталу қабілеті аппараттық калибрленген симуляция арқылы 75 қатысушыдан тұратын ірі топта ЭЭГ арқылы ұйқы сатыларын анықтау тапсырмасы арқылы қосымша зерттелді (5g-сурет және Әдістер). Бұл тәжірибеде ояулық, REM ұйқысы және терең ұйқы (non-REM 3-сатысы) кезінде жазылып алынған ЭЭГ сигналдарын қамтитын Sleep-EDFx деректер базасы пайдаланылды. Қысқа мерзімді Фурье түрлендіруі арқылы өңделген ЭЭГ сигналдары MSVD/инкрементальды MSVD көмегімен белгілерді бөліп алу және логистикалық регрессия жіктеуі үшін мемристорлық жүйеге берілді. Жаңартуға дейінгі және кейінгі деректер матрицалары 900 × 500 өлшемге ие болды, ал алынған RSV-лер 500 × 5 өлшемді құрады (әр вектор үшін 15 итерациямен). Төрт сатылы жаңартудан кейін инкрементальды MSVD негізіндегі әдіс жаңартылмаған базалық сызыққа қарағанда 11.07% өнімділік өсіміне қол жеткізіп, бағдарламалық жүзеге асыруға ұқсас нәтижелерді көрсетті (5g-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инкрементальды MSVD аппараттық шығындарды арттырмастан жаңа пайдаланушылар үшін ЭМГ және ЭЭГ сигналдарын тану жүйелерін масштабтауға, ЭМГ үшін дәлдікті 84.01%-ға дейін қалпына келтіруге және ЭЭГ үшін 11.07%-ға арттыруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oenimdilikti-taldau-zhaene-benchmarking\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#oenimdilikti-taldau-zhaene-benchmarking\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өнімділікті талдау және бенчмаркинг&lt;/span&gt;&lt;/a&gt;Өнімділікті талдау және бенчмаркинг&lt;/h4&gt;\n&lt;p&gt;MSVD есептеу артықшылықтарын жан-жақты бағалау үшін авторлар бірнеше деректер базалары (IRIS, COVID-19 және NinaPro) бойынша жүйелі өнімділік талдауы мен бенчмаркингті жүзеге асырды. Қуат итерацияларында мақсатты және кейінгі мән арасындағы сингулярлы мән аралығы әр рангтегі жинақталу жылдамдығына әсер етеді. 6a-сурет 10⁰ мен 10⁻³ аралығындағы қалыптастырылған сингулярлы мән аралықтары мен жинақталу итерациялары арасындағы байланысты көрсетеді, бұл ретте қатарынан келетін итерациялар арасындағы уақытша квадраттық сингулярлы мән бағалауларының салыстырмалы айырмашылығы 2%-дан кем болуы талап етіледі. Нәтижелер сызықтық трендті растайды және SREA бар MSVD барлық есеп ауқымдарында SREA жоқ MSVD-ге қарағанда жинақталу үшін тұрақты түрде аз итерацияларды талап ететінін көрсетіп, SREA-ның есептеулерді жылдамдатудағы артықшылығын дәлелдейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өнімділікті бағалау нақты деректер базалары үшін симуляциялар мен аппараттық калибрлеулерге негізделген, сондықтан нәтижелерді кез келген басқа биомедициналық тапсырмаларға тікелей көшіру қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"msvd-oenimdiligi-zhaene-derekterdi-oengdeu-men-tildik-modelderdi-baptaudaghy-aukhymdylyghy\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#msvd-oenimdiligi-zhaene-derekterdi-oengdeu-men-tildik-modelderdi-baptaudaghy-aukhymdylyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MSVD өнімділігі және деректерді өңдеу мен тілдік модельдерді баптаудағы ауқымдылығы&lt;/span&gt;&lt;/a&gt;MSVD өнімділігі және деректерді өңдеу мен тілдік модельдерді баптаудағы ауқымдылығы&lt;/h4&gt;\n&lt;p&gt;Ведин заңын қолдана отырып, MSVD ажыратымдылық шектерін теориялық талдау 14-суретте көрсетілген. Талқылау көрсеткендей, нақты есептің (σ_i - σi+1) / σ₁ ретінде анықталған нормаланған спектрлік саңылауы жүйелік қателермен бірге MSVD-дегі ең кіші шешілетін сингулярлық мәнге әсер етеді. Бірлік SVD есептеуі үшін SREA қамтылған MSVD айтарлықтай артықшылық көрсетеді: SREA жоқ MSVD-мен салыстырғанда SREA жинақталуды жылдамдату арқылы 48.5% энергия үнемдеуді және 48.1% жылдамдықты қамтамасыз етеді. Дәстүрлі графикалық процессорлармен (GPU) салыстырғанда бұл көрсеткіштер әлдеқайда жоғары: EMG сигналдарын тану тапсырмаларында 29.9× энергия тиімділігіне және 19.0× жылдамдықтың артуына қол жеткізіледі (6b, c-суреттер). MSVD жүзеге асырудың энергия шығыны мен аумағының бөлінісі 6d, e-суреттерде көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SREA бар MSVD GPU-мен салыстырғанда энергия тиімділігі бойынша 29.9× дейін, ал жылдамдық бойынша 19.0× дейін озық тұр, ал инкременталды есептерде энергияны үнемдеу 89.6× дейін жетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SREA — есептеулердің жинақталуын жылдамдататын әдіс, ал инкременталды оқыту жүйеге барлық модельді нөлден қайта оқытпай-ақ жаңа деректерге бейімделуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MSVD мен SREA-ның ауқымды қосымшалардағы масштабталуын зерттеу үшін олардың үлкен тілдік модельдерін (LLM) параметрлік тұрғыдан тиімді баптаудағы өнімділігі симуляция арқылы бағаланды. Төмен рангті бейімдеу негізгі салмақтарды қатырып, шағын оқытылатын матрицаларды енгізу арқылы оқыту шығындарын азайтады. Бұл матрицаларды SVD арқылы инициализациялау алдын ала оқытылған салмақтардың негізгі компоненттерін бөліп алып, конвергенцияны жылдамдатады. Авторлар MSVD көмегімен басқарылатын негізгі сингулярлық мәндер мен векторлардың бейімделуін (PiSSA) қолданды (7a, b-суреттер). Модель ішіндегі 2048 × 2048 және 2048 × 512 өлшемді барлық статикалық салмақтар (5-кесте) 4-рангті декомпозициядан өтті.&lt;/p&gt;\n&lt;p&gt;LLaMA 3.2 модельдері (1B және 3B нұсқалары) SREA қосылған MSVD негізіндегі PiSSA көмегімен MetaMathQA деректер жинағында сәйкесінше екі және бір дәуір бойы бапталып, GSM8K және MATH жиындарында бағаланды. Шығын қисықтары (16-сурет) бұл тәсілдің бағдарламалық аналогқа жақын оңтайландыру динамикасын сақтай отырып, процесті тиімді жылдамдататынын көрсетеді. GSM8K (7c-сурет) бен MATH (7d-сурет) бенчмарктерінде MSVD негізіндегі PiSSA бағдарламалық аналогымен салыстырмалы нәтижелерге қол жеткізеді (мысалы, GSM8K үшін 1B және 3B бойынша сәйкесінше 26.41 пен 26.61, 51.25 пен 51.40). Сонымен қатар, ол дәстүрлі әдістен асып түсіп, GSM8K көрсеткішін 1B моделі үшін 24.11-ден 26.41-ге дейін (9.5% салыстырмалы өсім) және 3B моделі үшін 46.40-тан 51.25-ке дейін (10.5% салыстырмалы өсім) көтерді. SREA-ның абляциялық зерттеуі (17-сурет) GSM8K-та 1.09 балдық (4.3% өсім) жақсаруды көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-ді баптау өнімділігі нақты кремний чипінде емес, аппараттық деңгейдегі симуляция көмегімен бағаланған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;7e, f-суреттерде MSVD негізіндегі инициализацияның GPU-мен салыстырғандағы энергия тиімділігі мен жылдамдығы көрсетілген. 32 нм технологиялық түйінінде мемристорлік жүйе GPU-ге қарағанда энергия тиімділігі бойынша 41.6× артықшылыққа және 23.1× жылдамдыққа қол жеткізеді (жүйелік бөлшектер 18-суретте). Бұл нәтижелер MSVD-нің үлкен жұмыс жүктемелеріне масштабталуын және оның практикалық LLM қосымшалары үшін жарамдылығын растайды.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"zhalpy-khorytyndylar-men-perspektivalar\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#zhalpy-khorytyndylar-men-perspektivalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы қорытындылар мен перспективалар&lt;/span&gt;&lt;/a&gt;Жалпы қорытындылар мен перспективалар&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста төмен рангті көріністер үшін энергия үнемдейтін және жоғары дәлдіктегі көп масштабты сингулярлық матрицалық жіктеу (MSVD) жүйесі ұсынылған. Екі еселенген дәлдіктегі картаға түсіруді және векторлық өңдеуді нақтылауды қамтитын мұқият жобаланған SREA архитектурасының арқасында авторлар мемристорлардағы көп масштабты итеративті есептеу процесін тиімді түрде оңтайландырды.&lt;/p&gt;\n&lt;p&gt;Суреттерді қалпына келтіру, уақыттық деректерді талдау, биомедициналық сигналдарды өңдеу және ірі тілдік модельдерді (LLM) тиімді баптауды қамтитын эксперименталды көрсетілімдер ұсынылған тәсілдің бағдарламалық аналогтарға сай келетін дәлдікке қол жеткізетінін көрсетеді. Инкрементальды MSVD құрылымы бейімделгіш есептеу сценарийлерінде деректерді өңдеу мүмкіндіктерін одан әрі айқындай түседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мемристорлар негізінде әзірленген MSVD жүйесі бағдарламалық шешімдер деңгейіндегі дәлдікті қамтамасыз етеді және дәстүрлі CMOS архитектураларымен салыстырғанда жылдамдық пен энергия тиімділігі бойынша айтарлықтай артықшылық көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дәстүрлі CMOS негізіндегі іске асырулармен салыстырғанда, ұсынылған жүйе энергия тиімділігі мен есептеу жылдамдығы бойынша айтарлықтай артықшылықтарға ие. Алынған нәтижелер MSVD-ның әмбебап жіктеу құралы ретіндегі әлеуетін айғақтайды, бұл әсіресе ресурс шектеулі қолданбалар, соның ішінде киілетін медициналық құрылғылар мен шеткі жасанды интеллект жүйелері үшін өте маңызды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жадтағы есептеулер (CIM — Computing-in-Memory) — бұл деректерді сақтау мен өңдеуді бір физикалық құрылғыда біріктіретін озық архитектура, ол процессор мен жад арасындағы деректерді тасымалдау шығындарын түбегейлі азайтуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл зерттеу мемристорға негізделген жадтағы есептеулер (CIM) арқылы көп масштабты итеративті алгоритмдерді өңдеудің өміршең тәсілін көрсетіп, мемристорлық есептеу мүмкіндіктерін кеңірек ғылыми есептеулер мен машиналық оқыту қолданбаларына дейін кеңейтеді.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;Мемристорлік сингулярлық жіктеуді іске асыру&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"X%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BM%20%5Ctimes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; деректер матрицасының SVD жіктелуі математикалық түрде X = USV^T ретінде анықталады, мұндағы &lt;span class=\"yfm-latex\" data-content=\"U%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BM%20%5Ctimes%20M%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"V%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BN%20%5Ctimes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және &lt;span class=\"yfm-latex\" data-content=\"S%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BM%20%5Ctimes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — сәйкесінше сол жақ сингулярлық векторлардың (LSV), оң жақ сингулярлық векторлардың (RSV) және сингулярлық мәндердің матрицалары. Сәйкесінше, деректердің ковариациялық матрицасы &lt;span class=\"yfm-latex\" data-content=\"X%5ET%20X%20%5Cin%20%5Cmathbb%7BR%7D%5E%7BN%20%5Ctimes%20N%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; келесідей өрнектелуі мүмкін: X^T X = V S² V^T. V бағандары (v_i ретінде белгіленеді) &lt;span class=\"yfm-latex\" data-content=\"%5Cmathbb%7BR%7D%5EN\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; үшін ортонормальды базисті құрайтындықтан, кез келген кездейсоқ инициализацияланған кіріс векторы vin осы базистік векторлардың сызықтық комбинациясы ретінде көрсетілуі мүмкін: &lt;span class=\"yfm-latex\" data-content=\"v_%7Bin%7D%20%3D%20c_1%20v_1%20%2B%20%5Cdots%20%2B%20c_N%20v_N\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, мұндағы &lt;span class=\"yfm-latex\" data-content=\"c_1%20%5Cneq%200\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және c_i — скалярлық коэффициенттер (1). Осылайша, X^T X-ті vin-ге k рет қайталап көбейту (2) өрнегін береді, мұндағы s_i — S матрицасындағы i-ші диагональді мән, және &lt;span class=\"yfm-latex\" data-content=\"s_1%20%3E%20s_2%20%3E%20%5Cdots%20%3E%20s_N%20%3E%200\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. &lt;span class=\"yfm-latex\" data-content=\"k%20%5Cgg%201\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; болғанда, i ≥ 2 үшін (s_i / s₁)²k мүшелері нөлге ұмтылады. Демек, бірінші RSV-ні v₁ = norm(X^T X)^k vin формуласынан алуға болады. Практикалық іске асыруда v₁ итерация циклі арқылы алынады. Кездейсоқ инициализацияланған аралық &lt;span class=\"yfm-latex\" data-content=\"%5Ctilde%7Bv%7D_1\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; векторынан бастап, жаңарту ережесі (3) формуласы бойынша орындалады, мұнда norm() CPU-да орындалатын нормализация операциясын білдіреді. Процесс түйісуге қол жеткізілгенге дейін немесе максималды итерация шегіне жеткенге дейін жалғасады. Табылған v₁ кейіннен V матрицасын құру үшін қосымша массивте сақталады және бірінші сингулярлық мән s₁² = v₁^T X^T X v₁ ретінде есептеледі.&lt;/p&gt;\n&lt;p&gt;Келесі сингулярлық векторлар мен мәндерді шығарып алу үшін бұрын есептелген сингулярлық векторларға қатысты компоненттер дефляциялануы тиіс. i-ші сингулярлық вектор v_i үшін дәрежелік итерация-дефляция тәсілі әр циклде (4) формуласы бойынша орындалады, мұнда &lt;span class=\"yfm-latex\" data-content=\"%5Ctilde%7Bv%7D_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — кездейсоқ инициализацияланған аралық вектор, Si-1 — &lt;span class=\"yfm-latex\" data-content=\"V_%7Bi-1%7D%5ET%20%5Ctilde%7Bv%7D_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; көбейндісінің шығысын масштабтайтын алғашқы i-1 сингулярлық мәндерді қамтитын диагональді матрица. Сонымен қатар, S₀ және V₀ нөлдік матрицалар ретінде анықталады. Табылған v_i кейіннен V-ға жаңартылады және i-ші сингулярлық мән (5) формуласынан алынады. SVD қасиеттеріне сүйене отырып, v_i өзара ортогональ болғандықтан (яғни V⁻¹ = V^T), сәйкес LSV-лерді тікелей u_i = norm(X v_i) (6) ретінде алуға болады. LLaMA 3.2 модельдері үшін симуляцияланған MSVD инициализациясын қолдана отырып, дәл баптау өнімділігінің архитектурасы мен салыстырылуы 7-Суретте көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сингулярлық жіктеу (SVD) — бұл деректердің өлшемділігін төмендету және негізгі белгілерді бөліп көрсету үшін матрицаны құрамдас бөліктерге жіктейтін сызықтық алгебра әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы итеративті процестер арқылы MSVD үшін дәрежелік итерация-дефляция аяқталады. MSVD процесінің блок-схемасы S19-Суретте көрсетілген. Есептеу кезінде X деректер матрицасы және есептелген RSV-лер (V) көбейтулерді орындау үшін мемристорлік кроссбар массивтерінде сақталады. Қосымша операциялар, соның ішінде элемент бойынша векторлық көбейту (RSV кірістерінің S² масштабтауы үшін), азайту, нормализациялау (дефляция үшін) және түйісуді анықтау FPGA және CPU-да іске асырылады. Әрбір дәрежелік итерация-дефляция кезеңінің басында екі матрицадағы (X және V) итеративті процестер бірдей кездейсоқ инициализацияланған кіріс векторы &lt;span class=\"yfm-latex\" data-content=\"%5Ctilde%7Bv%7D_i%20%3D%20v_%7Bin%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; арқылы басталады, содан кейін (4) теңдеуінде сипатталған итеративті вектор-матрицалық көбейтулер массивтерде тікелей орындалады. Шамадан тыс итерациялардың алдын алу үшін максималды итерация саны 30-дан аз етіп шектелген. LSV-лер (U) (6) теңдеуінде көрсетілгендей деректер матрицасымен матрицалық-векторлық көбейту арқылы алынады және сондықтан массивте қосымша сақтауды қажет етпейді.&lt;/p&gt;\n&lt;h4 id=\"eki-eselik-daeldiktegi-saejkestendiru\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#eki-eselik-daeldiktegi-saejkestendiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Екі еселік дәлдіктегі сәйкестендіру&lt;/span&gt;&lt;/a&gt;Екі еселік дәлдіктегі сәйкестендіру&lt;/h4&gt;\n&lt;p&gt;Екі еселік дәлдіктегі сәйкестендіру стратегиясында мемристорлерге сәйкестендірілетін әрбір сан төмен ажыратымдылығы бар жоғары ретті бөлікке және жоғары ажыратымдылығы бар төмен ретті бөлікке бөлінеді. Мысалы, 8 биттік X және Y векторлары жоғары 2 бит пен төменгі 6 битке келесідей бөлінуі мүмкін: (7) және (8) теңдеулері, мұндағы h және l сәйкесінше жоғары және төменгі бөліктердің бит нөмірлерін білдіреді. X және Y көбейтіндісі (9) формуласы ретінде өрнектелуі мүмкін, мұндағы &lt;span class=\"yfm-latex\" data-content=\"%5Cll%20l\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; жоғары ретті бөліктің дұрыс шамасын қалпына келтіру үшін l позицияға солға биттік жылжуды білдіреді. Бұл тәсіл кванттаудан кейін жоғары ретті бөліктің шығысы дәл болып қалуын қамтамасыз етеді, бұл маңыздылық салмағы бойынша жоғары ретті қателердің күшеюін азайтады және осылайша MSVD-дегі түйісу тұрақтылығын арттырады. Сонымен қатар, жоғары ажыратымдылыққа ие төмен ретті бөлік есептеу кезінде ұсақ сан мәліметтерін көрсету қабілетін сақтайды, бұл түйісу нәтижелерін нақты мәндерге жақыындатады. Әртүрлі эксперименттердегі егжей-тегжейлі DPM параметрлері S3-Кестеде көрсетілген. S20, S21-Суреттерде және 3-Ескертпеде егжей-тегжейлі сипатталған симуляцияға негізделген зерттеулер мен талдаулар DPM-нің жарамдылығы мен тиімділігін әрі қарай көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"vektordy-oengdeudi-zhetildiru\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#vektordy-oengdeudi-zhetildiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Векторды өңдеуді жетілдіру&lt;/span&gt;&lt;/a&gt;Векторды өңдеуді жетілдіру&lt;/h4&gt;\n&lt;p&gt;Авторы VPR стратегиясын жүзеге асыру үшін кіріс деректерінің дәлдігін реттейді және әсіресе қалдық сингулярлық мәндер векторы (RSV) үшін кеңістіктік қайталауды қолданады. Біріншіден, дәрежелік итерация циклінің екінші векторлық-матрицалық көбейту сатысында (4-теңдеу) RSV матрицасы үшін кіріс векторлары стандартты жүйелік дәлдікпен салыстырғанда жоғары биттік енімен кодталады (толық конфигурациялар S3-кестеде келтірілген). s₂^i көмегімен масштабталған бұл кірістер айтарлықтай үлкен динамикалық диапазонға ие болғандықтан, стандартты кванттау қателері кейінгі көбейтулерде күшейіп, соңғы дәлдікті нашарлатар еді. Осылайша, жоғарылатылған дәлдік көрсету қабілетін сақтайды және жинақталатын кванттау қателерін бәсеңдетеді (талдау S4-ескертпеде және S22-суретте берілген).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қалдық сингулярлық мәндер векторлары (RSV) — дефляцияның әр қадамында негізгі компоненттер алынып тасталғаннан кейін пайда болатын және жоғары дәлдіктегі есептеулерді талап ететін векторлар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екіншіден, мемристорды картаға түсірудегі ауытқулар мен оқу ауытқуларын физикалық түрде басу үшін (олардың дефляция нәтижесіне әсері масштабталған кірістермен де күшейтілер еді) RSV-лер мемристор матрицасы бойынша кеңістікті түрде қайталанады, ал олардың шығыстары шу деңгейі азайтылған нәтижелерді алу үшін орташаланады. Бұл әдіс тек негізгі кірістер үшін жоғары биттік дәлдікті сақтайды және картаға түсіру кезінде тек шағын өлшемді сингулярлық векторларды ғана қайталайды. Нәтижесінде, ол барлық матрицаларды ғаламдық жоғары дәлдікпен және қайталанмалы картаға түсірумен салыстырғанда энергия мен аумақ шығындарын айтарлықтай төмендетіп, дефляция процесінің дәлдігін қамтамасыз етеді.&lt;/p&gt;\n&lt;h4 id=\"arnajy-memristorlykh-apparattykh-platforma-zhaene-arhitektura\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#arnajy-memristorlykh-apparattykh-platforma-zhaene-arhitektura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Арнайы мемристорлық аппараттық платформа және архитектура&lt;/span&gt;&lt;/a&gt;Арнайы мемристорлық аппараттық платформа және архитектура&lt;/h4&gt;\n&lt;p&gt;Авторлар 130 нм технологиялық түйінін қолдана отырып мемристорлық чипті жасап шығарды. Чип 1024 × 128 өлшемді бір транзисторлы-бір резисторлы (1T1R) мемристорлық матрицасына және Si CMOS шеткі схемаларына ие. Әрбір 1T1R ұяшығы TiN/TaOx/HfO₂/TiN материалдар стягы бар мемристорды (0.5  мкм × 0.5  мкм) және қолжетімділік транзисторын қамтиды. Қабаттар құрамына атомдық-қабаттық тұндыру әдісімен салынған қалыңдығы 8 нм HfO₂ резистивті ауысу қабаты, шашырату арқылы жасалған қалыңдығы 45 нм TaOx жылуды күшейтуші қабаты және 30 нм TiN жоғарғы/төменгі электродтары кіреді (бұл S4a-суреттегі өткізгіш электрондық микроскопия кескінінде көрсетілген).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;1T1R құрылымы (бір транзистор-бір резистор) мемристорлық жады ұяшығын басқарушы транзистормен біріктіреді, бұл паразиттік токтарсыз кернеуді дәл беруге және деректерді оқуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кіріс буферлері, драйверлер, жылжыту регистрлері және декодерлерді қамтитын шеткі схемалар оқу/жазу операцияларын қолдайды және толық параллель есептеулерді қамтамасыз етеді (толық мәліметтер S3-суретте). Өткізгіштікті дәл картаға түсіруді қамтамасыз ету үшін стандартты жазу-тексеру схемасы көмегімен әрбір 1T1R мемристорлық ұяшығына бірнеше кернеу импульстары қолданылады, бұл мақсатты мәндер қателік шегіне жеткенге дейін өткізгіштікті кезең-кезеңімен реттейді. Демонстрациялық жүйе мемристорлық платадан, қуат платасынан және бағдарламаланатын логикалық матрица (FPGA, Xilinx, ZCU102) платасынан тұратын үш қабатты баспа платасы конфигурациясын қолданады (S2a-сурет).&lt;/p&gt;\n&lt;p&gt;Жүйе кіріс деректерін 50 нс 1 биттік кернеу импульстарының уақытша тізбегіне цифрлық түрде кодтайды (0.2 В «1» білдіреді және 0 В «0» білдіреді), олар матрицаға векторлық-матрицалық көбейтуді орындау үшін қолданылады. Авторлар матрицалық көбейтулер үшін мемристорлық CIM макросы мен итерацияларды басқару үшін FPGA контроллері арасындағы үйлестірілген операциялар арқылы толық MSVD өңдеуін қамтамасыз ететін арнайы архитектураны жобалады (толық архитектуралық дизайн және деректер ағыны S2b-суретте).&lt;/p&gt;\n&lt;h4 id=\"derekterdi-kartagha-tuesiru-zhaene-taezhiribe-konfiguraciyasy\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#derekterdi-kartagha-tuesiru-zhaene-taezhiribe-konfiguraciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді картаға түсіру және тәжірибе конфигурациясы&lt;/span&gt;&lt;/a&gt;Деректерді картаға түсіру және тәжірибе конфигурациясы&lt;/h4&gt;\n&lt;p&gt;S23-суретте көрсетілгендей, мемристорлық құрылғылардың өткізгіштігін бағдарламалау үшін жазу-тексеру схемасы қолданылады. Сызықты түрде квантталған деректер (S5-ескертпе) 0.5 В пен 2 В аралығындагы SET/RESET кернеу импульстарын қолдану, содан кейін 0.2 В кезінде оқуды тексеру сатысы арқылы бағдарламаланады. Бұл жазу-тексеру циклі оқу тогы мақсатты шекті диапазонға түскенге дейін қайталанады. S24-суретте SET, RESET және оқу операциялары кезінде сәйкесінше таңдалған ұяшықтың WL, SL және BL желілеріне қолданылатын салыстырмалы кернеу конфигурациялары егжей-тегжейлі сипатталған.&lt;/p&gt;\n&lt;p&gt;Оң және теріс матрицалық элементтерді орналастыру үшін дифференциалды картаға түсіру схемасы қабылданады. Құрылғыларымыздың жоғары шығымдылығының арқасында (~ 99.99%) істен шыққан ақаулардың MSVD-ге әсері минималды болып табылады (S25-суретте талданғандай), бұл күрдеlі қателікке төзімді картаға түсіру стратегияларына қажеттілікті жояды. S26-суретте деректер матрицасы және есептелген RSV-лер SREA көмегімен MSVD іске асыру үшін бірыңғай макросқа қалай картаға түсетіні көрсетілген. Кіріс деректерінің матрицасы есептеу басында матрицаға бағдарламаланады, ал шешілген RSV-лер кейіннен ыдырау жалғасуда матрицаға жазылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дифференциалды картаға түсіру оң және теріс сандарды көрсету үшін жады ұяшықтарының жұптарын пайдаланады және олардың тоқтарын азайтып, күрдеlі схемаларсыз таңбалы есептеулерді жасауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;DPM схемасы деректер матрицасы мен RSV-лерді екі сегментке бөледі, ал VPR стратегиясы RSV-лерді матрицада бірнеше рет қайталайды. Әрбір тәжірибе үшін егжей-тегжейлі SREA конфигурациялары S3-кестеде келтірілген. Сынақ платформасының ауқымымен шектелген, кескінді төмен рангті қалпына келтіру және EMG негізіндегі жесттерді тану тапсырмалары үшін авторлар толық матрица құрылғысының өткізгіштіктерін алу үшін қайта бағдарламалау стратегиясын қолданды. Содан кейін біз осы өлшемдер негізінде кеңірек шеткі схемаларды симуляциялау арқылы тәжірибелер жүргіздік.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар, бірнеше макростарды қолданатын ауқымды қондырғылар үшін анықтамалық болып қызмет ететін көп макросты архитектураны ұсынамыз (S27-суретте көрсетілген). EEG негізіндегі ұйқы сатысын анықтау тапсырмасы және MSVD инициализациясымен төмен рангті бейімдеу үшін біз шуға сезімтал мемристорлық модельді және шеткі схема модельдерін (кванттау және жылжыту-және-қосу операцияларын қоса алғанда) қамтитын аппараттық калибрленген симуляциялық ортаны пайдаланамыз. Осы тәжірибелер барысында құрылғының өткізгіштікті картаға түсіру диапазоны 0 мен 30 µS аралығында орнатылады. Құрылғыны оқу және жазу ауытқулары дәлдікті қамтамасыз ету үшін біздің нақты құрылғы өлшемдерімізге (2g-сурет) негізделген Гаусс бойынша таратылған шу ретінде моделденеді.&lt;/p&gt;\n&lt;h4 id=\"keskin-zhaene-uakhytsha-derekter-ueshin-toemen-rangti-zhakhyndatu-metrikalary\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#keskin-zhaene-uakhytsha-derekter-ueshin-toemen-rangti-zhakhyndatu-metrikalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескін және уақытша деректер үшін төмен рангті жақындату метрикалары&lt;/span&gt;&lt;/a&gt;Кескін және уақытша деректер үшін төмен рангті жақындату метрикалары&lt;/h4&gt;\n&lt;p&gt;Қалпына келтірілген кескіндер мен негізгі компоненттері бар деректердің сапасын бағалау үшін кеңінен танылған метрикаларды қолданамыз: PSNR, SSIM және корреляция коэффициенті. Өлшемдері m × n × 3 болатын және K бұл I-дің төмен рангті жақындауы болып табылатын RGB кескіні үшін PSNR келесідей анықталады:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"%5Ctext%7BPSNR%7D%20%3D%2010%20%5Clog_%7B10%7D%20%5Cleft(%20%5Cfrac%7B%5Ctext%7BMAX%7D_I%5E2%7D%7B%5Ctext%7BMSE%7D%7D%20%5Cright)%20%5Cquad%20(10)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;мұндағы MAX_I — кескіндің максималды пиксель мәні, ал MSE — барлық RGB арналары бойынша орташаланған орташа квадраттық қате:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"%5Ctext%7BMSE%7D%20%3D%20%5Cfrac%7B1%7D%7B3mn%7D%20%5Csum_%7BR%2C%20G%2C%20B%7D%20%5Csum_%7Bi%3D1%7D%5E%7Bm%7D%20%5Csum_%7Bj%3D1%7D%5E%7Bn%7D%20%5Cleft(%20I_%7Bch%7D%5E%7Bi%2Cj%7D%20-%20K_%7Bch%7D%5E%7Bi%2Cj%7D%20%5Cright)%5E2%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;мұндағы Ich және Kch сәйкесінше I және K кескіндерінің нақты арналарын білдіреді. SSIM келесідей есептеледі:&lt;/p&gt;\n&lt;h4 id=\"sapa-metrikalary-zhaene-ym-isharany-tanugha-arnalghan-inkrementaldy-zhikteu\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#sapa-metrikalary-zhaene-ym-isharany-tanugha-arnalghan-inkrementaldy-zhikteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сапа метрикалары және ым-ишараны тануға арналған инкременталды жіктеу&lt;/span&gt;&lt;/a&gt;Сапа метрикалары және ым-ишараны тануға арналған инкременталды жіктеу&lt;/h4&gt;\n&lt;p&gt;Кескіндердің құрылымдық ұқсастығын бағалау үшін &lt;span class=\"yfm-latex\" data-content=\"%5Ctext%7BSSIM%7D%20%3D%20%5Cfrac%7B(2%5Cmu_%7BK%2C%5Ctext%7Bch%7D%7D%5Cmu_%7BI%2C%5Ctext%7Bch%7D%7D%20%2B%20C_1)(2%5Csigma_%7BKI%2C%5Ctext%7Bch%7D%7D%20%2B%20C_2)%7D%7B(%5Cmu_%7BK%2C%5Ctext%7Bch%7D%7D%5E2%20%2B%20%5Cmu_%7BI%2C%5Ctext%7Bch%7D%7D%5E2%20%2B%20C_1)(%5Csigma_%7BK%2C%5Ctext%7Bch%7D%7D%5E2%20%2B%20%5Csigma_%7BI%2C%5Ctext%7Bch%7D%7D%5E2%20%2B%20C_2)%7D%20%D1%84%D0%BE%D1%80%D0%BC%D1%83%D0%BB%D1%83%D1%81%D1%8B%D0%BC%D0%B5%D0%BD%20%D0%B5%D1%81%D0%B5%D0%BF%D1%82%D0%B5%D0%BB%D0%B5%D1%82%D1%96%D0%BD%20SSIM%20%D0%BC%D0%B5%D1%82%D1%80%D0%B8%D0%BA%D0%B0%D1%81%D1%8B%20%D2%9B%D0%BE%D0%BB%D0%B4%D0%B0%D0%BD%D1%8B%D0%BB%D0%B4%D1%8B%2C%20%D0%BC%D2%B1%D0%BD%D0%B4%D0%B0%D2%93%D1%8B%20%D1%82%D2%B1%D1%80%D0%B0%D2%9B%D1%82%D1%8B%D0%BB%D0%B0%D1%80%20C_1%20%3D%206.5025%20%D0%B6%D3%99%D0%BD%D0%B5%20C_2%20%3D%2058.5225%2C%20%D0%B0%D0%BB%20%5Cmu%2C%20%5Csigma%20%D0%B6%D3%99%D0%BD%D0%B5%20%5Csigma_%7BKI%7D%20%D0%BF%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D1%82%D1%80%D0%BB%D0%B5%D1%80%D1%96%20K%20%D0%B6%D3%99%D0%BD%D0%B5%20I%20%D0%BA%D0%B5%D1%81%D0%BA%D1%96%D0%BD%D0%B4%D0%B5%D1%80%D1%96%D0%BD%D1%96%D2%A3%20%D1%81%D3%99%D0%B9%D0%BA%D0%B5%D1%81%20%D0%B0%D1%80%D0%BD%D0%B0%D0%BB%D0%B0%D1%80%D1%8B%D0%BD%D1%8B%D2%A3%20%D0%B6%D0%B5%D1%80%D0%B3%D1%96%D0%BB%D1%96%D0%BA%D1%82%D1%96%20%D0%BE%D1%80%D1%82%D0%B0%20%D0%BC%D3%99%D0%BD%D0%B4%D0%B5%D1%80%D1%96%D0%BD%2C%20%D1%81%D1%82%D0%B0%D0%BD%D0%B4%D0%B0%D1%80%D1%82%D1%82%D1%8B%20%D0%B0%D1%83%D1%8B%D1%82%D2%9B%D1%83%D0%BB%D0%B0%D1%80%D1%8B%D0%BD%20%D0%B6%D3%99%D0%BD%D0%B5%20%D3%A9%D0%B7%D0%B0%D1%80%D0%B0%20%D0%BA%D0%BE%D0%B2%D0%B0%D1%80%D0%B8%D0%B0%D1%86%D0%B8%D1%8F%D1%81%D1%8B%D0%BD%20%D0%B1%D1%96%D0%BB%D0%B4%D1%96%D1%80%D0%B5%D0%B4%D1%96.%20%D3%A8%D0%BB%D1%88%D0%B5%D0%BC%D1%96%20m%20%5Ctimes%20n%20%D0%B1%D0%BE%D0%BB%D0%B0%D1%82%D1%8B%D0%BD%20X%20%D0%B6%D3%99%D0%BD%D0%B5%20Y\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; уақытша деректер матрицалары үшін корреляция коэффициенті матрица элементтерінің орташа мәндері арқылы стандартты өрнек көмегімен есептеледі.&lt;/p&gt;\n&lt;h4 id=\"ym-isharany-tanugha-arnalghan-inkrementaldy-zhikteu\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#ym-isharany-tanugha-arnalghan-inkrementaldy-zhikteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ым-ишараны тануға арналған инкременталды жіктеу&lt;/span&gt;&lt;/a&gt;Ым-ишараны тануға арналған инкременталды жіктеу&lt;/h4&gt;\n&lt;p&gt;IncrementalMSVD әдісі жаңадан қосылған деректер матрицалары бар есептер үшін жаңартылған оң жақ сингулярлық векторларды (RSV) алуға арналған. Қолда бар Xexist деректері X' = [Xnew, Xexist] ретінде кеңейген кезде, ковариациялық матрица X'^T X' жаңа компонент пен қолда бар компоненттің төмен рангті жуықтауының қосындысы арқылы аппроксимацияланады: &lt;span class=\"yfm-latex\" data-content=\"X'%5ET%20X'%20%5Capprox%20X_%7B%5Ctext%7Bnew%7D%7D%5ET%20X_%7B%5Ctext%7Bnew%7D%7D%20%2B%20X_%7B%5Ctext%7Bexist%7D%7D%5ET%20X_%7B%5Ctext%7Bexist%7D%7D%20%5Capprox%20X_%7B%5Ctext%7Bnew%7D%7D%5ET%20X_%7B%5Ctext%7Bnew%7D%7D%20%2B%20V_%7B%5Ctext%7Bexist%7D%7D%20S_%7B%5Ctext%7Bexist%7D%7D%5E2%20V_%7B%5Ctext%7Bexist%7D%7D%5ET%2C%20%D0%BC%D2%B1%D0%BD%D0%B4%D0%B0%D2%93%D1%8B%20V_%7B%5Ctext%7Bexist%7D%7D%20%E2%80%94%20%D0%B1%D2%B1%D1%80%D1%8B%D0%BD%20%D1%88%D0%B5%D1%88%D1%96%D0%BB%D0%B3%D0%B5%D0%BD%20RSV-%D0%BB%D0%B5%D1%80.%20%D0%9F%D1%80%D0%B0%D0%BA%D1%82%D0%B8%D0%B3%D0%B0%D0%B4%D0%B0%20%D3%99%D1%80%D0%B1%D1%96%D1%80%20%D0%B6%D0%B0%D2%A3%D0%B0%D1%80%D1%82%D1%8B%D0%BB%D2%93%D0%B0%D0%BD%20v_i'\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; векторы дәрежелік итерация және дефляция тәсілі арқылы цикл көмегімен алынады:&lt;/p&gt;\n&lt;p&gt;&lt;span class=\"yfm-latex\" data-content=\"v_i'%20%3D%20%5Cfrac%7B(V_%7B%5Ctext%7Bexist%7D%7D%20S_%7B%5Ctext%7Bexist%7D%7D%5E2%20V_%7B%5Ctext%7Bexist%7D%7D%5ET%20%2B%20X_%7B%5Ctext%7Bnew%7D%7D%5ET%20X_%7B%5Ctext%7Bnew%7D%7D%20-%20V_%7Bi-1%7D'%20S_%7Bi-1%7D'%5E2%20V_%7Bi-1%7D'%5ET)%20%5Ctilde%7Bv%7D_i%7D%7B%5Ctilde%7Bv%7D_i%5ET%20v_i'%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дәрежелік итерация және дефляция әдісі (power iteration-deflation) — матрицаларды толық қайта есептеусіз меншікті векторлар мен сингулярлық жіктеулерді тиімді табуға арналған итеративті сызықтық алгебра алгоритмі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл ретте ағымдағы кезеңдегі i-ші сингулярлық мән s_i'² = v_i'^T Xnew^T Xnew v_i' + v_i'^T Vexist Sexist² Vexist^T v_i' түрінде анықталады. Аппараттық деңгейде бұрын шешілген RSV-лерді сақтау үшін қосымша мемристорлық массив қолданылады. Жаңа деректер келіп түскенде, олар массивке маппинг жасалады, ал ескі вектолар қолда бар деректерді өрнектеу және жаңартылғандарды есептеу үшін пайдаланылады.&lt;/p&gt;\n&lt;h4 id=\"energiya-tiimdiligi-benchmarkteri\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#energiya-tiimdiligi-benchmarkteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Энергия тиімділігі бенчмарктері&lt;/span&gt;&lt;/a&gt;Энергия тиімділігі бенчмарктері&lt;/h4&gt;\n&lt;p&gt;Энергия тұтыну Сурет 2-де көрсетілген архитектура негізінде, тексерілген дизайн мен 32 нм мемристорлық технологияға негізделген XPESim симуляторы көмегімен бағаланды. Электромиограмма (ЭМГ) негізіндегі ым-ишараны тану міндеті үшін жүйе [3,5] DPM бөлінісімен, вектордың 4 рет қайталануымен және негізгі 8 биттік кіріспен қатар VPR үшін 10 қосымша кіріс битімен конфигурацияланып, әрбір ранг жіктеуі үшін 15 итерация орындалды. Осы параметрлер кезінде бір MSVD есептеуі 13.40 µJ тұтынса, бір инкременталды жаңарту 17.83 µJ тұтынады (толығырақ Сурет SN 6 және Кесте SN 6-да келтірілген). Салыстыру үшін, Nvidia A100 графикалық процеторының энергия тиімділігі 390 GOPS·W⁻¹ құрайды. Талап етілетін 156 млн операция үшін GPU-дағы есептеудің энергия шығыны 400 µJ құрайды. Нәтижесінде, MSVD GPU-мен салыстырғанда 29.9 есе жоғары энергия тиімділігін көрсетеді (13.40 µJ қарсы 400 µJ). Тіпті 130 нм технологиялық түйінінде де MSVD 10 есе артықшылығын сақтайды (Сурет SN 28, Note 7).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f2.jpg\" alt=\"2-сур. / SREA бар MSVD дизайны. а Сингулярлық векторларды (SV) есептеуге арналған MSVD сұлбасы мен деректер ағыны.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сур. / SREA бар MSVD дизайны. а Сингулярлық векторларды (SV) есептеуге арналған MSVD сұлбасы мен деректер ағыны.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сур. / SREA бар MSVD дизайны. а Сингулярлық векторларды (SV) есептеуге арналған MSVD сұлбасы мен деректер ағыны. RSV (v) және LSV (u) сайып келгенде сәйкесінше V және U матрицаларын құрайды. b, c MSVD жүйесіндегі қуат итерациясы-дефляция алгоритміне арналған екі негізгі қиындық. Біріншісі — өткізгіштік ауытқулары бар итерация сатысындағы санның ығысуы (b). Екіншісі — SV үшін маппинг ауытқулары бар дефляция сатысындағы компонент қалдығы (c). d MSVD үшін жасақталған SREA, ол есептеу нәтижелерін қосарланған дәлдіктегі маппинг (DPM) және векторлық өңдеуді нақтылау (VPR) арқылы жүзеге асыруға келмейтін күйден іске асырылатын күйге өзгертеді. S1, S2: бірінші және екінші сингулярлық мәндер. e MSVD іске асыруға арналған 1024-ке 128 массиві бар мемристорлық чиптің фотосуреті. f Оқу циклдары бойынша 32 деңгейдің орташа өткізгіштік эволюциясы, бұл жақсы өткізгіштік тұрақтылығын көрсетеді. Әрбір деңгей 100 мемристордың деректерін қамтиды. Егжей-тегжейлі деректер нүктелері бар график Қосымша 5-суретте келтірілген. g (f) суретіндегі мемристорлардың өлшенген маппинг ауытқулары мен оқу ауытқуларының бөлінісі. Ауытқу/флуктуация деңгейлері маппинг кезінде σ = 0,27 мкСм және оқу кезінде σ = 0,21 мкСм сәйкес келді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Сингулярлық векторларды жаңарту процестері бар инкременталды оқыту кезінде кәсіби тәсілдерді қолданғандағы GPU энергия тұтынуы бірінші, екінші және үшінші жаңартулар үшін сәйкесінше 799 µJ, 1197 µJ және 1597 µJ құрайды. Инкременталды MSVD үшінші жаңарту кезінде 89.6 есеге дейінгі артықшылыққа қол жеткізеді (17.83 µJ қарсы 1597 µJ) және жалпы энергия тұтынуды 67.1 есе азайтады (((799 + 1197 + 1597) / (17.83 × 3)) = 67.1). Жоғары өнімді есептеулерге арналған арнайы интегралдық схемамен (Google TPU v3) салыстырғанда инкременталды MSVD жалпы есеппен 55.9 есе жоғары энергия тиімділігін көрсетеді (Сурет SN 29). Кесте SN 7 басқа CMOS негізіндегі жіктеу ASIC-терімен салыстыруларды ұсынады; тапсырма ауқымындағы айырмашылықтарға қарамастан, MSVD артықшылығы сақталады. Сонымен қатар, ЭЭГ негізінде ұйқы кезеңдерін анықтауға арналған инкременталды MSVD бенчмарктері A100 GPU-ға қарағанда 57.3 есе (84.6 µJ қарсы 4852 µJ) және Google TPU v3-ке қарағанда 47.7 есе (84.6 µJ қарсы 4035 µJ) артықшылық көрсетеді (Сурет SN 30).&lt;/p&gt;\n&lt;p&gt;SREA көмегімен конвергенцияға қажетті итерациялар санын азайту MSVD үшін 48.5%  (13.40 µJ қарсы 26.04 µJ) және инкременталды MSVD үшін 42.4%  (17.83 µJ қарсы 30.97 µJ) энергияны үнемдеуге мүмкіндік береді. Әрбір жүйе модулінің әр түрлі ауқымдағы тапсырмалар бойынша энергия шығыны Сурет SN 31-де көрсетілген.&lt;/p&gt;\n&lt;h4 id=\"normalanghan-zhyldamdykhty-testileu\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#normalanghan-zhyldamdykhty-testileu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нормаланған жылдамдықты тестілеу&lt;/span&gt;&lt;/a&gt;Нормаланған жылдамдықты тестілеу&lt;/h4&gt;\n&lt;p&gt;Нормализацияленген жылдамдық операциялар жылдамдығын қажетті чип ауданына бөлу арқылы бағаланады. ЭМГ негізіндегі ым-ишаратты тану тапсырмасында SREA бар және SREAsiz MSVD кешігулері сәйкесінше 183.8 мкс және 280.5 мкс құрайды (толық ақпарат S8 қосымша ескертпесі мен S8, S9 кестелерінде көрсетілген). SREA бар және SREAsiz MSVD үшін қажетті жалпы аумақтар сәйкесінше 0.236 мм² және 0.229 мм² болып табылады (әрбір жүйе модулінің әртүрлі ауқымдағы тапсырмалар бойынша аумақтық бөлінісі S31 қосымша суретте көрсетілген). Осы метрикаларға сүйене отырып, SREA бар MSVD нормализацияленген шешу жылдамдығы 23054 есептеу·с⁻¹·мм⁻² құрайды, ал SREAsiz MSVD 15568 есептеу·с⁻¹·мм⁻² жетеді. Нәтижесінде SREA алгоритмі MSVD жылдамдығын 48.1% арттырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нормализацияленген жылдамдық кремнийдің бірлік аумағына шаққандағы өнімділігін салыстыру арқылы әртүрлі чиптер мен архитектураларды әділ бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Есептеу қуаты 156 TOPS және кристалл өлшемі 826 мм² болатын A100 GPU үшін нормализацияленген шешу жылдамдығы 1211 есептеу·с⁻¹·мм⁻² құрайды. Осылайша, біздің MSVD жүйеміз нормализацияленген есептеу жылдамдығында 19.0 есе артықшылық көрсетеді. Сонымен қатар, S7 қосымша кестесінде көрсетілгендей, КМОП негізіндегі ASIC-термен салыстырғанда, тапсырма көлемінің айырмашылығына қарамастан, MSVD айтарлықтай басымдық көрсетеді. Деректер матрицасы, алдын ала есептелген векторлар және параллель жұмыс істейтін есептелетін векторлар бар мемристорлық массивтердің көмегімен алдын ала есептелген векторлардағы операциялардың кешігуі қалған екі матрицамен қатар жүретін операциялардың ішінде жасырылуы мүмкін және қосымша шығындар туындатпайды.&lt;/p&gt;\n&lt;p&gt;SREA бар және SREAsiz инкрементальды MSVD аумақтары сәйкесінше 0.313 мм² және 0.298 мм² құрайды (S8 кесте). Әрбір жаңарту үшін SREA бар және SREAsiz инкрементальды MSVD нормализацияленген жылдамдығы 17382 жаңарту·с⁻¹·мм⁻² және 11963 жаңарту·с⁻¹·мм⁻² жетеді, ал GPU жылдамдығы үш жаңарту үшін сәйкесінше 607, 404 және 303 жаңарту·с⁻¹·мм⁻² құрайды (S8 қосымша ескертпесінде толық жазылған). Нәтижесінде инкрементальды MSVD орташа 39.7 есе жылдамдық артықшылығына қол жеткізеді, ал үш жаңарту барысында бұл көрсеткіш 57.3 есеге дейін жетеді. Сонымен қатар, SREA инкрементальды MSVD жылдамдығын 45.3% арттырады. Шамамен 700 мм² кристалл өлшемі бар Google TPU v3-пен салыстырғанда, инкрементальды MSVD орташа 42.6 есе жылдамдықтың жақсарғанын көрсетеді (17382 және 408 жаңарту·с⁻¹·мм⁻², S29 қосымша сурет). Сонымен қатар, ЭЭГ негізіндегі ұйқы сатысын анықтау контекстінде инкрементальды MSVD TPU v3-ке қарағанда орташа 21.0 есе жылдамдықты (8744 және 416 жаңарту·с⁻¹·мм⁻²) көрсетеді (S30 қосымша сурет).&lt;/p&gt;\n&lt;h4 id=\"toemen-rangti-bejimdeu-ueshin-inicializaciyalau\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#toemen-rangti-bejimdeu-ueshin-inicializaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Төмен рангті бейімдеу үшін инициализациялау&lt;/span&gt;&lt;/a&gt;Төмен рангті бейімдеу үшін инициализациялау&lt;/h4&gt;\n&lt;p&gt;Төмен рангті бейімдеу техникасы әдетте алдын ала оқытылған модель салмақтарын екі бөлек компонентке бөледі: қатып қалған (оқытылмайтын) қалдық матрица R^M × N және BranchA R^r × N пен BranchB R^M × r ретінде белгіленген екі оқытылатын төмен рангті тармақ, мұндағы r мақсатты төмен рангті білдіреді. Біздің тәсілімізде бұл компоненттерді инициализациялау үшін MSVD қолданамыз. Атап айтқанда, біз MSVD-ті тілдік модельдердегі (LLM) әрбір трансформер қабатындағы статикалық салмақтарға, соның ішінде сұрау, кілт және мән қабаттарына, шығыс проекцияға, жоғары проекцияға, төмен проекцияға және шлюз қабаттарына 7a суретінде көрсетілгендей қолданамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Төмен рангті бейімдеу (LoRA) және ұқсас әдістер үлкен нейрондық желілерді бар болғаны кішкентай параметрлер үлесін өзгерту арқылы тиімді қосымша оқытуға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әрбір салмақ матрицасы үшін біз ранг-4 MSVD орындаймыз, әр ранг үшін 15 итерация жүзеге асырылады. Алынған жіктеу факторлары кейін PiSSA салмағын бастапқыда құру үшін пайдаланылады. Оқытылатын төмен рангті тармақтар келесідей қалыптасады:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"%5Ctext%7BBranchA%7D%20%3D%20S_%7B1%3Ar%2C%201%3Ar%7D%5E%7B1%2F2%7D%20V_%7B%3A%2C%201%3Ar%7D%5ET%2C%20%5Cquad%20%5Ctext%7BBranchB%7D%20%3D%20U_%7B%3A%2C%201%3Ar%7D%20S_%7B1%3Ar%2C%201%3Ar%7D%5E%7B1%2F2%7D%20%5Cquad%20(16)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;mұндағы S, V, U сәйкесінше шешілген сингулярлық мәндерді, оң сингулярлық векторларды және сол сингулярлық векторларды білдіреді. Сонымен бірге, қатып қалған қалдық матрица төмен рангті жақындатуды бастапқы алдын ала оқытылған W салмақ матрицасынан азайту арқылы алынады:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"M_%7B%5Ctext%7Bres%7D%7D%20%3D%20W%20-%20U_%7B%3A%2C%201%3Ar%7D%20S_%7B1%3Ar%2C%201%3Ar%7D%20V_%7B%3A%2C%201%3Ar%7D%5ET%20%5Cquad%20(17)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Дәл баптауға арналған егжей-тегжейлі параметр конфигурациялары, сондай-ақ трансформер қабаттарының нақты салмақ өлшемдері S5 қосымша кестесінде келтірілген.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f1.jpg\" alt=\"1-сур. / Деректерді жан-жақты талдау үшін MSVD көмегімен төмен рангті ұсыну. MSVD, яғни X = USVT, массивтік және шуылды \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сур. / Деректерді жан-жақты талдау үшін MSVD көмегімен төмен рангті ұсыну. MSVD, яғни X = USVT, массивтік және шуылды бастапқы деректерді (X) қысқа және түсінікті жинақы ақпаратқа (eX) айналдырады. U және V сәйкесінше сол және оң сингулярлық векторларды қамтитын матрицаларды білдіреді, ал S — сингулярлық мәндердің диагональды матрицасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f3.jpg\" alt=\"3-сур. / SREA бар және SREA жоқ MSVD жинақталу сипаттамасы. а SREA жоқ MSVD және эталондық деректермен (GT) салыстырғанд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сур. / SREA бар және SREA жоқ MSVD жинақталу сипаттамасы. а SREA жоқ MSVD және эталондық деректермен (GT) салыстырғандағы итерациялар бойынша сингулярлық мәндердің жинақталуы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сур. / SREA бар және SREA жоқ MSVD жинақталу сипаттамасы. а SREA жоқ MSVD және эталондық деректермен (GT) салыстырғандағы итерациялар бойынша сингулярлық мәндердің жинақталуы. Қателік сызықтары 20 рет іске қосу кезіндегі стандартты қателіктерді көрсетеді. b SREA бар және SREA жоқ MSVD арасындағы S1-S4 сингулярлық мәндерінің қалыптасқан қателігін салыстыру. c Екі тәсіл үшін де сингулярлық вектор элементтерінің қателік бөліністері. d, e Жинақталу барысын көрсететін алғашқы үш оң (d) және сол (e) сингулярлық векторлардың итеративті жаңартулары. f 2-ші және 3-ші рангті жіктеулердегі әртүрлі оңтайландыру тәсілдері бойынша реконструкция қателігінің ландшафттары. Реконструкция қателігі MSVD реконструкциялары мен эталондық деректер арасындағы айырмашылықтың Фробениус нормасы ретінде бағаланады. DPM — қосарланған дәлдіктегі маппинг, VPR — векторлық өңдеуді нақтылау.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f4.jpg\" alt=\"4-сур. / Суреттер мен уақыттық деректер үшін MSVD көмегімен төмен рангті жақындату. а SREA бар және SREA жоқ бағдарламал\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сур. / Суреттер мен уақыттық деректер үшін MSVD көмегімен төмен рангті жақындату. а SREA бар және SREA жоқ бағдарламалық SVD және MSVD көмегімен орындалған HKU логотипіне арналған кескінді жақсартулар. c масштабтау коэффициентін білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сур. / Суреттер мен уақыттық деректер үшін MSVD көмегімен төмен рангті жақындату. а SREA бар және SREA жоқ бағдарламалық SVD және MSVD көмегімен орындалған HKU логотипіне арналған кескінді жақсартулар. c масштабтау коэффициентін білдіреді. b, c Бағдарламалық нәтижелерді эталон ретінде пайдалана отырып, SREA бар және SREA жоқ MSVD арқылы реконструкцияланған кескіндер үшін PSNR (b) және SSIM (c) салыстырулары. d, e SREA бар MSVD көмегімен COVID-19 деректер жинағының52 1-ші (d) және 2-ші рангті (e) реконструкциялары. Кірістірілген суреттер сәйкес қалыптасқан реконструкция қателерінің бөліністерін көрсетеді. f Бағдарламалық SVD шешімдерін эталон ретінде пайдалана отырып, деректер жинағының52 1-ші, 2-ші және 3-ші рангті реконструкцияланған матрицалары үшін SREA бар MSVD пен SREA жоқ MSVD арасындағы корреляция коэффициенттерін салыстыру. Деректер орташа ± стандартты қателік ретінде ұсынылған (n = 20 тәуелсіз іске қосу).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f5.jpg\" alt=\"5-сур. / Инкрементальды MSVD көмегімен пайдаланушы масштабтай алатын тану. а Инкрементальды танудың сұлбасы. b Сингулярл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сур. / Инкрементальды MSVD көмегімен пайдаланушы масштабтай алатын тану. а Инкрементальды танудың сұлбасы. b Сингулярлық векторларды жаңартуға арналған инкрементальды MSVD. c Мемристорлық қимылдарды тану жүйесінің жұмыс процесі. d Екі пайдаланушы үшін…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сур. / Инкрементальды MSVD көмегімен пайдаланушы масштабтай алатын тану. а Инкрементальды танудың сұлбасы. b Сингулярлық векторларды жаңартуға арналған инкрементальды MSVD. c Мемристорлық қимылдарды тану жүйесінің жұмыс процесі. d Екі пайдаланушы үшін мемристорлық және бағдарламалық тәсілдер арасындағы жіктеу дәлдігін салыстыру. Деректер орташа ± стандартты қателік ретінде ұсынылған (n = 15). e Пайдаланушылар санының өсуіне қарай тану дәлдігінің эволюциясы. Жәшік диаграммалары медианаларды, төменгі және жоғарғы квартильдерді, сондай-ақ шығарынды емес диапазонды көрсетеді; кіші нүктелер шығарындыларды, ал үлкен таңбалар 15 қайталау бойынша орташа мәндерді көрсетеді. f Мемристорлық ұйқы кезеңін анықтаудың жұмыс процесі. g Субъектілер саны 15-тен 75-ке дейін өскен кездегі анықтау дәлдігінің эволюциясы. Қателік сызықтары 5 тәуелсіз симуляция бойынша стандартты қателікті көрсетеді. (c) суретінде пайдаланылған қол позы белгішелері Flaticon жүйесінен Uicons арқылы алынды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f6.jpg\" alt=\"Сурет 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-f7.jpg\" alt=\"Сурет 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 7&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#kesteler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кестелер&lt;/span&gt;&lt;/a&gt;Кестелер&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-25/memristive-singular-value-decomposition-tT1.jpg\" alt=\"Кесте 1\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-25/memristive-singular-value-decomposition.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\
