        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"97\" cy=\"159\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"663\" cy=\"208\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · GENOMICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Гормондар аутизм және мидың&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;дамуы гендеріне қалай әсер&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;етеді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f1.jpg\" alt=\"1-сурет: 17𝜷-эстрадиол-х-нейродаму бұзылуы қаупі гендерінің әсерін бағалайтын екі жүйелі, ауқымды, көп модальді скрининг\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: 17𝜷-эстрадиол-х-нейродаму бұзылуы қаупі гендерінің әсерін бағалайтын екі жүйелі, ауқымды, көп модальді скрининг конвейерінің эксперименталдық шолуы. Эстрадиолмен емдеудің және нейродаму бұзылуы (NDD) қауіп гендеріндегі функцияны жоғалту мутацияларының әсері үш модальділік арқылы өлшенеді: (1) hiPSC-тен алынған NGN2-индукцияланған глутаматергиялық нейрондардағы (iGLUTs) бір жасушалы RNAseq, (2) iGLUTs-тағы нейрондық кальций визуализациясы және (3) дернәсілдік зебрабалықтағы сенсомоторлық және қозу мінез-құлқы. Модальділіктер қиылысатын, бірақ тәуелсіз гендер жиынтығын қамтиды. ASD/NDD нысаналы гендері ген экспрессиясын реттеуді (қызғылт), нейрондық функция мен коммуникацияны (жасыл), жасушалық сигнал беруді және ақуыз модификациясын (сұр) және цитоскелетті (көк) қоса алғанда, мыңдаған функцияларды қамтиды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Жыныстық гормондар ми жұмысындағы айырмашылықтардың негізгі факторларының бірі болып саналады, бірақ олардың генетикалық ауытқулардағы рөлі нашар зерттелген. Зерттеушілер эстрадиолдың аутизм мен даму бұзылыстарына байланысты 36 генде мутациясы бар нейрондарға қалай әсер ететінін тексерді. Гормон гендер экспрессиясы деңгейіндегі бұзылуларды делуге көмектесетіні, бірақ тек кейбір мутациялар үшін нейрондардың шамадан тыс белсенділігін бәсеңдететіні анықталды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Эстрадиол аутизм қаупінің 36 гені бойынша сынақтан өткізілді&lt;/li&gt;\n&lt;li&gt;ASH1L және SCN2A гендері гормонға барынша сезімталдық көрсетті&lt;/li&gt;\n&lt;li&gt;Гормон ген экспрессиясын реттейді, бірақ қозуды таңдамалы түрде басады&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жыныстық гормондардың жүйке жүйесі патологияларына әсерін түсіну үшін зерттеушілер адамның индуцияланған плюрипотентті дің жасушаларынан алынған нейрондарды және данио-рерио балықтарының дернәсілдерін пайдаланды. Тәжірибеде CRISPR жүйесі арқылы аутизм мен даму бұзылыстарының қаупі жоғары 36 ірі ген сөндірілді. Бұл гендер транскрипцияны реттеуге, синапстық беріліске және цитоскелет құрылымына жауап береді. 100 наномоль концентрациясындағы эстрадиолмен бір тәулік бойы өңдеу молекулалық жауап әртүрлі мутациялар үшін ортақ және өзіне тән механизмдерді қамтитынын көрсетті.&lt;/p&gt;\n&lt;p&gt;Талдау ортақ әсерді анықтады: эстрадиол зерттелген барлық желілерде бұзылған ген экспрессиясы профилін ішінара қалпына келтіреді. Алайда желілердің электрлік белсенділігін қалыпқа келтіру іріктеп жүзеге асырылды. ASH1L және SCN2A гендеріндегі мутациялар терапияға аса сезімталдық көрсетіп, адам нейрондарында молекулалық және жасушалық қасиеттердің, сондай-ақ балықтардың мінез-құлық реакцияларының толық қалпына келгенін көрсетті. Гормонға ең жақсы жауап беретін жеті ген ақуыздық өзара әрекетсу желісін құрайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұмыс in vitro жасуша культуралары мен данио-рерио балықтары үлгілерінде орындалған және тәуелсіз сараптамадан өтпеген препринт болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Жүйке жүйесінің дамуы барысында жыныстық гормондардың сигнал беру жолдары аутизм спектрінің бұзылыстарын қоса алғанда, нейродаму бұзылыстарының қауіп модуляторлары ретінде әрекет ете алады. Осы әсерлерді жүйелі түрде бағалау үшін авторлар адамның индукцияланған плюрипотентті дің жасушаларынан алынған нейрондар мен zebrafish балығының дернәсілдері көмегімен функционалды түрде әртүрлі 36 ірі аутизм спектрі және нейродаму қауіп гендерінің функциясын жоғалту мутацияларына эстрадиолдың әсерін жан-жақты зерттеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Адамның индукцияланған плюрипотентті дің жасушаларын қолдану тері немесе қан жасушаларын нақты генетикалық ақаулары бар нейрондарға айналдырып, зертханалық жағдайда тірі адам ми тінін зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жұмыс барысында транскриптомдық, нейрожелілік және мінез-құлық деңгейлерінде гендер мен эстрадиол арасындағы ортақ және ерекшеленетін өзара әсерлер анықталды. Эстрадиол зерттелген барлық қауіп гендерінің нокаутынан туындаған экспрессия профильдерінің бұзылыстарын ішінара түзете алатыны анықталды. Алайда оның нейрондық желілердің тым қозу фенотиптерін басу әсері тек белгілі бір гендердің нокаут топтарында ғана таңдамалы түрде жүзеге асады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол барлық 36 зерттелген қауіп гені үшін транскриптом бұзылыстарын әмбебап түрде жөнге келтіреді, бірақ нейрондық желілердің тым жоғары қозуын тек кейбір гендерде ғана таңдамалы түрде қалыпқа келтіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;Эстрадиолмен емдеуге ерекше сезімталдық танытқан ASH1L және SCN2A гендері ерекше назар аударды. Олар үшін адамның нокауттық нейрондарында молекулалық және жасушалық параметрлердің айтарлықтай қалпына келгені, сондай-ақ zebrafish мутантты дернәсілдерінде мінез-құлық ақауларының сәтті компенсацияланғаны тіркелді. Эстрадиолға ең жақсы жауап беретін жеті ген ақуыз-ақуыз өзара әрекеттесу желісі тығыздығының жоғарылағанын, постнатальды кезеңдерде күшті ко-экспрессияны және жоғары қабаттағы жетілген қоздырғыш нейрондарда байытылғанын көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу адам жасушалық модельдерінде және zebrafish балықтарында жүргізілгендіктен, алынған нәтижелердің клиникалық маңызын растау үшін сүтқоректілер мен клиникалық үлгілерде қосымша зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жалпы алғанда, бұл жұмыс таңдалған қауіп гендерінің функциясы жоғалған жағдайдағы ортақ транскриптомдық әсерлерді, сондай-ақ генге тән жасушалық және мінез-құлықтық құтқару жолдарын сипаттайтын эстрадиолдың әсерлерін жан-жақты ашып көрсетеді.&lt;/p&gt;\n&lt;h3 id=\"kirispe1\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#kirispe1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"estradioldyng-nejrondykh-funkciyalardy-retteudegi-roeli\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradioldyng-nejrondykh-funkciyalardy-retteudegi-roeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эстрадиолдың нейрондық функцияларды реттеудегі рөлі&lt;/span&gt;&lt;/a&gt;Эстрадиолдың нейрондық функцияларды реттеудегі рөлі&lt;/h4&gt;\n&lt;p&gt;Эстрадиол нейрогенезді, нейрондардың қозуын, синаптикалық пластиканы және мінез-құлықты қоздырушы және тежеуші тізбектерде реттей отырып, ми қызметінде маңызды орын алады. Бұл әсерлер екі механизм арқылы жүзеге асады. Геномдық механизм эстрадиолдың ядролық рецепторлармен (ERα және ERβ) байланысуын қамтиды, олар транскрипция факторлары ретінде жұмыс істеп, гендер экспрессиясын сағаттар немесе күндер бойы өзгертеді. Маңыздысы, мидағы ERα нысаналары аутизм спектрінің бұзылыстары (АСБ) және нейро даму бұзылыстарымен (НДБ) байланысты гендерге бай. Жылдам геномдық емес механизм GPER1 сияқты мембраналық рецепторларды іске қосып, екінші реттік мессенджерлер мен иондық ағындарды (мысалы, кальций) минуттар ішінде белсендіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол ми қызметін баяу геномдық және жылдам геномдық емес жолдар арқылы модуляциялайды, оның нысаналары көбінесе АСБ/НДБ-мен байланысты гендермен қиылысады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;АСБ/НДБ — ми дамуына әсер ететін генетикалық және орта факторларымен байланысты жағдайлар тобы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеулер көрсеткендей, эстрадиол АСБ/НДБ қауіп гендеріндегі мутациялар тудырған ақауларды түзете алады. Мысалы, ол CNTNAP2 мутациясы бар зебрабалықтарда гиперактивтілікті басады, NRXN1 мутациясы бар адам нейрондарында (hiPSC) сигналдық жолдарды қалпына келтіреді және DYRK1A тапшылығы бар бақа шабақтарында жасуша пролиферациясын қалыпқа келтіреді. Біз бұл жұмыста 17β-эстрадиолдың 36 жоғары қауіпті генмен (соның ішінде ANK2, CHD8, PTEN, SHANK3 және т.б.) байланысты фенотиптерге әсерін мультимодальды скрининг арқылы бағалаймыз (1-сурет).&lt;/p&gt;\n&lt;h4 id=\"zertteu-aedisteri\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zertteu-aedisteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу әдістері&lt;/span&gt;&lt;/a&gt;Зерттеу әдістері&lt;/h4&gt;\n&lt;p&gt;Мутациялар мен эстрадиол арасындағы өзара әрекеттесуді зерттеу үшін біз CRISPR технологияларын қолдандық. Біз гендер экспрессиясын (SN-1 суреті: 36 ген) және адамның индуцияланған глутаматергиялық нейрондарындағы (iGLUTs) нейрондық белсенділікті (SN-2 суреті: 15 ген) талдадық. In vivo сенсомоторлық мінез-құлық пен қозғыштық зебрабалық дернәсілдерінде тексерілді (SN-3 суреті: 31 ген базалық деңгейде, 4 ген эстрадиолмен емделгенде). scn1lab гені үшін RNA-seq, ми белсенділігін карталау және құрысу тесттері өткізілді. Талдаулар ASH1L және SCN2A мутациялары эстрадиолмен түзетуге ең бейім гендер екенін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;iGLUTs — пациенттің діңгекті жасушаларынан алынған және глутамат арқылы қоздырушы сигналдарды беруге маманданған нейрондар. Нокаут — ген функциясын зерттеу үшін оны «өшіру» әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler1\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#naetizheler1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"estradiol-asd/ndd-khauip-genderining-transkripciyalykh-aeserlerin-khalpyna-keltiredi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiol-asd/ndd-khauip-genderining-transkripciyalykh-aeserlerin-khalpyna-keltiredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эстрадиол ASD/NDD қауіп гендерінің транскрипциялық әсерлерін қалпына келтіреді&lt;/span&gt;&lt;/a&gt;Эстрадиол ASD/NDD қауіп гендерінің транскрипциялық әсерлерін қалпына келтіреді&lt;/h4&gt;\n&lt;p&gt;Аутизм мен нейродаму қауіпті гендерінің (ASD/NDD) транскриптомдық деңгейдегі эстрадиолдың ортақ және ерекше әсерлерін анықтау мақсатында авторлар функцияның жоғалуы (LOF) дәлелденген 36 осындай генге басымдық берді (1-1 сурет, SI 1 кесте). Назар орталығына 22 ген экспрессиясының реттеушілері, соның ішінде эпигенетикалық модификаторлар, хроматинді реттеушілер және транскрипциялық факторлар енді: ARID1B, ASH1L, ASXL3, BCL11A, CHD2, CHD8, CREBBP, FOXP2, KDM5B, KDM6B, KMT2C, KMT5B (SUV420H1), MBD5, MED13L, PHF12, PHF21A, POGZ, SETD5, SIN3A, SKI, SMARCC2, WAC. Сонымен қатар 7 нейрондық коммуникация гені (синаптикалық гендер мен иондық арналар: CACNA1G, GRIA3, GRIN2A, NRXN1, SCN2A, SHANK3, SLC6A1), 3 жасушалық сигнал беру гені (CUL3, PPP2R5D, PTEN) және 4 цитоскелет гені (ANK2, ANK3, DPYSL2, DYRK1A) таңдалды. Гендерді таңдау жыныстық айырмашылықтарға негізделмеген; олардың көпшілігі ерлер мен әйелдерде ұқсас пенетранттылыққа ие (SI 1 кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-KO әдісі мен бір жасушалы секвенирлеу (ECCITE-seq) бір уақытта көптеген мақсатты гендерді өшіруге және әрбір жеке жасушаның транскриптомдық жауабын нақты бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Лентивирустық CRISPR-KO кітапханасы алдын ала тексерілген бағыттаушы РНK-лар (gRNA) негізінде жасалып, әр генге үш-төрт gRNA қамтыды (SI 2 және SI 3 кестелер). Олардың 29-ы зерттеушілердің бұрынғы жұмысында енгізіліп, расталған болатын. Біз адамның индуцияланған плюрипотентті дің жасушаларынан (hiPSC) алынған жүйке жасушаларының предшественниктерінде (NPC) екі бақылау донорынан (бір ер адам, бір әйел адам, SI 1A сурет) және функциялық тұрғыдан жетілген iGLUT нейрондарында бір ер адам донорынан алынған (2 сурет, SI 1A сурет) CRISPR ген нокаутын біріктірілген тәсіл ретінде қолдандық (2Ai сурет). Жасушалар эстрадиолмен (100 nM, 24 сағат бойы, рецепторлардың экспрессиясы SI 2 суретте, дозаға тәуелділік тесттері SI 3A суретте) немесе бақылау ерітіндісімен (DMSO) өңделді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименттер адам жасушалық модельдерінде (hiPSC-тен алынған NPC және iGLUT) жүргізілді, бұл нейродамудың тек кейбір аспектілерін in vitro қайталайды және тұтас ағзаға қатысты абайлап қарауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;gRNA-ларды тікелей анықтау бір жасушалы РНK секвенирлеуімен (ECCITE-seq) біріктіріліп, әртүрлі жасуша түрлері мен эстрадиол жағдайындағы әсерлер салыстырылды (gRNA-лар SI 4 суретте расталған). Сүзгілеуден және сапаны бақылаудан кейін ғалымдар 16 ASD/NDD нокауты мен бақылау үлгілері бойынша барлығы 39 278 жасушаны талдады: 7067 бақылау NPC жасушасы, 5553 E2 NPC жасушасы, 14 471 бақылау iGLUT жасушасы және 12 187 E2 iGLUT жасушасы (SI 1B, C суреттер, SI 4 кесте). Мақсатты геннің сарқылуын сүзгілеуді салмақталған ең жақын желілер талдауымен (WNN) біріктіре отырып, зерттеушілер табысты бұзылуларға ұшыраған жасушаларды анықтады және оларды gRNA мен ген экспрессиясы профильдерінің байытылуына сәйкес кластерлерге бөлді. Бұл стратегия әр gRNA үшін iGLUT-та орташа 234 жасуша және NPC-те 198 жасуша, ал iGLUT үшін 39 жасуша берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кең ауқымды CRISPR-KO және ECCITE-seq скринингі арқылы шамамен 40 мың жасушада эстрадиолдың (100 nM) әсерінен 16 ASD/NDD ген нокауты үшін жасушалық кластерлер сәтті анықталды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nokauttar-men-estradioldyng-transkriptomdykh-profilderge-aeseri\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#nokauttar-men-estradioldyng-transkriptomdykh-profilderge-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нокауттар мен эстрадиолдың транскриптомдық профильдерге әсері&lt;/span&gt;&lt;/a&gt;Нокауттар мен эстрадиолдың транскриптомдық профильдерге әсері&lt;/h4&gt;\n&lt;p&gt;CRISPR-KO әдісі 75-тен астам клеткада анықталған 28 нейропротекторлық және 28 нейропредшественник (NPC) gRNA анықтауға мүмкіндік берді. Орта есеппен гендер нокауты iGLUT нейрондарында нысана гендердің 22%-ға, ал NPC клеткаларында 26%-ға төмендеуіне әкелді, бұл клетка популяцияларындағы nonsense-медиацияланған ыдыраудың гетерогенділігіне байланысты шынайы әсерді төмендетіп көрсетуі мүмкін. Транскриптомдық қолтаңбалар нокаут, эстрадиол және олардың өзара әсерлерін бөліп көрсету үшін нысанаға алмайтын бақылау (NT) кластерлерімен салыстырылды (2Ai-сур.). Бастапқы кезеңде әрбір ASD/NDD қауіп гені әр нысана геннің бұзылу дәрежесіне тәуелсіз түрде ортақ және әртүрлі дифференциалды түрде экспрессияланатын гендерді (DEG, FDR &amp;lt; 0.05) тудырды (2B-сур., S1D-сур.). Екі немесе одан да көп gRNA сәтті нысанаға алған он ASD/NDD гені үшін DEG арасында тұрақты корреляциялар байқалды (Пирсон корреляциясы 0.66–0.87, S4B-сур.).&lt;/p&gt;\n&lt;p&gt;Нокаут пен бақылау арасындағы барлық маңызды айырмашылықтар үшін (p &amp;lt; 0.05) авторлар мынадай жіктеуді енгізді: күшейген (exacerbated) — маңыздылығы жоғары бір бағыттағы пертурбация; өзгермеген (unchanged) — бағыты немесе маңыздылығы өзгермеген; бөлшектеп қалпына келу (partial rescue) — бастапқы бағыттағы әлсіздеу пертурбация; қалпына келген (rescued) — мутант пен бақылау арасындағы маңызды айырмашылықтардың жоғалуы; және шамадан тыс түзетілген (over-corrected) — бастапқы фенотипке қарама-қарсы бағыттағы айырмашылық. Эстрадиолдың DEG (FDR &amp;lt; 0.05) мен биологиялық жолдарға (FDR &amp;lt; 0.05) әсері барлық нокауттар үшін бағаланды. Эстрадиол зерттелген 13 нокаутта DEG экспрессиясын қалпына келтірді, бірақ қалпына келу дәрежесінде гетерогенділік орын алды (iGLUT FDR &amp;lt; 0.05, қалпына келген DEG пайызы бойынша реттелген, 2D-сур.; NPC номиналды p &amp;lt; 0.05, S1E-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол зерттелген 13 нокаутта транскриптомдық профильдерді тиімді қалпына келтіреді, бұл ретте ASH1L және SCN2A гендері ең жоғары тұрақтылықты көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдау барысында эстрадиолдың мультимодальды қалпына келтіру әсері бар екі ген ерекше аталды: ASH1L және SCN2A. Негізгі нокаут әсерлерін эстрадиолмен өңделген нокаут әсерлерімен салыстыру эстрадиол мутациялардың жағымсыз әсерлерін бәсеңдететінін көрсетті; нокаут әсерлері мен эстрадиол әсерлері теріс корреляцияда болды (S5-сур., жоғарғы және төменгі панельдер). Бұрын NDD/ASD қауіп гендері арасындағы төменгі ағынды әсерлер жетілген iGLUT-тарда ең жоғары екендігі хабарланған болатын. Күтпеген жерден, қалпына келген DEG-тер қалпына келмегендерге қарағанда эстроген рецепторларының нысандарымен көбірек байытылмаған, бұл олардың ішінара болса да геномдық емес сигналдық жолдар арқылы жүзеге асатынын көрсетеді (2C-сур., S6A, S6C-G-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Геномдық емес сигналдық жолдар — бұл ядродағы транскрипцияны тікелей белсендірместен, жылдам ақуыздық өзара әрекеттер мен киназа каскадтары арқылы жүзеге асатын клеткаішілік сигнал беру механизмдері.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық 16 нокаутта маңызды мета-талдау FDR (FDR &amp;lt; 0.05), Кохранның гетерогенділік тесті бойынша маңызды емес p (p &amp;gt; 0.05) және ортақ бағыты бар конвергентті DEG-тер 7 ген нысанында эстрадиол көмегімен түзетуге көбірек бейім болды (Фишердің нақты тесті, ***FDR &amp;lt; 0.001, **FDR &amp;lt; 0.01, *FDR &amp;lt; 0.05) (2F-сур., S6B-сур.). Нокауттың негізгі әсерінде маңызды болған барлық Gene Ontology (GO) жолдары (p &amp;lt; 0.05) нокаут ішіндегі эстрадиол әсерімен салыстырылды. iGLUT-тарда эстрадиол синаптикалық берілу, нейрондардың дамуы, цитоскелеттің ұйымдасуы, клеткалық байланыстар, клеткалық цикл, гормондарға жауап және иондық арналар белсенділігімен байланысты бұзылған жолдарды қалпына келтірді (2E-сур., S5-кесте). ASH1L және SCN2A үшін эстрадиол интекриндермен, құрылымдық гомеостазбен және транскрипциялық белсенділікпен байланысты жолдарды қалпына келтірді (2G-сур.). NPC-тердегі 8 нокаут үшін эстрадиол транскрипция, трансляция, мембраналық тасымалдау белсенділігі, митохондриялық энергия өндіру және клеткалық байланыстармен байланысты жолдарды қалпына келтірді (S1F-G, S1G-сур., S6-кесте).&lt;/p&gt;\n&lt;h4 id=\"estradiol-aeserinen-asd/ndd-nejrondykh-zhelilerindegi-gipersinhrondylykhtyng-zhedel-khalpyna-kelui\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiol-aeserinen-asd/ndd-nejrondykh-zhelilerindegi-gipersinhrondylykhtyng-zhedel-khalpyna-kelui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эстрадиол әсерінен ASD/NDD нейрондық желілеріндегі гиперсинхрондылықтың жедел қалпына келуі&lt;/span&gt;&lt;/a&gt;Эстрадиол әсерінен ASD/NDD нейрондық желілеріндегі гиперсинхрондылықтың жедел қалпына келуі&lt;/h4&gt;\n&lt;p&gt;Эстрадиолдың iGLUT-нейрондарына тигізетін геномдық емес әсерін зерттеу үшін біз CRISPR-нокаут (KO) әдісін кальцийлік имиджингпен (Fluo4) біріктірдік. Зерттеу 15 генді, соның ішінде экспрессия реттегіштерін (ARID1B, ASH1L, CHD8, KMT5B, POGZ), нейрондық коммуникация (CACNA1G, GRIA3, GRIN2A, NRXN1, SCN2A, SHANK3), сондай-ақ цитоскелет (ANK2, DYRK1A) және сигналдық жолдар (CUL3, PTEN) гендерін қамтыды (1-2-сурет). Нейрондық белсенділік 30-күні (30DIV, жетілмеген желілер — жеке жасушалардың спайктары) және 60-күні (60DIV, жетілген желілер — синхронды осцилляциялар мен желілік дүмпулер) бағаланды (3A-сурет; SN 7, 8A-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-KO — ген функциясын тексеру үшін белгілі бір генді «өшіру» әдісі, ал Fluo4 кальцийлік имиджингі кальций иондары концентрациясының өзгеруі арқылы нейрон белсенділігін нақты уақыт режимінде бақылауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;30DIV сатысында эстрадиол (100 нМ, жедел әсер) 5 KO желісінде (SHANK3, DYRK1A, POGZ, GRIA3, GRIN2A) спайк жиілігін және 6 желіде (DYRK1A, POGZ, GRIA3, GRIN2A, CACNA1G, SHANK3) амплитуданы жақсартты (SN 7-сурет). Жетілген желілерде (60DIV) бастапқыда 4 белсенділік кластері анықталды: 1 — бақылау тобы; 2 — ұзаққа созылған гиперсинхрондылық (ASH1L, SCN2A, SHANK3, ANK2, CACNA1G); 3 — гипоактивтілік (ARID1B, CUL3, CHD8, PTEN); 4 — аралық түр (NRXN1, GRIA3, POGZ, GRIN2A, DYRK1A) (3B, 3C-сурет; SN 8B-E-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол 2-кластердегі (ASH1L, SCN2A, SHANK3, ANK2, CACNA1G) гиперсинхрондылықты ең тиімді жойып, препарат енгізілгеннен кейін бірден қалыпты осцилляция үлгілерін қалпына келтірді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эстрадиолмен өңдеуден кейін KO-нейрондарының белсенділік профильдері бақылау тобына жақындады (3D-сурет). Ең айқын әсер 2-кластерде байқалды: гиперсинхрондылық тез арада қалыпты осцилляциялармен алмасты (3C-сурет). Қалпына келу дәрежесі синхронды жасушалардың пайызы бойынша бағаланды (3E-сурет). Алынған нәтижелер эстрадиолдың ASD/NDD қауіп гендеріндегі мутациялар тудырған аномальды белсенділікті геномдық емес механизмдер арқылы жедел түзету қабілетін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу iGLUT-нейрондарында (in vitro) жүргізілгендіктен, байқалған әсерлердің клиникалық маңыздылығын бағалау үшін тірі ағзаларда тексеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"in-vivo-estradiol-koemegimen-nejrodamu-zhaene-ujkhy-buzylystaryn-tuezetu\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#in-vivo-estradiol-koemegimen-nejrodamu-zhaene-ujkhy-buzylystaryn-tuezetu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In vivo эстрадиол көмегімен нейродаму және ұйқы бұзылыстарын түзету&lt;/span&gt;&lt;/a&gt;In vivo эстрадиол көмегімен нейродаму және ұйқы бұзылыстарын түзету&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер Danio rerio моделдерінде аутизм спектрінің бұзылыстары және нейродамудың бұзылуларымен (ASD/NDD) байланысты ASD/NDD гендерінің 31 ортологы бойынша базалық сенсомоторлық мінез-құлық пен сергектік көрсеткіштерін бағалады. Жұмысқа мозаикалық F0-нокауттар (CRISPants) мен тұрақты мутантты линиялар енгізілді (Сурет 1–3; Кесте S8–S11). Зерттелген гендердің 19-ы экспрессия регуляторлары (ARID1B, ASH1L, BCL11A, CHD2, CHD8, CREBBP, KDM5B, KDM6B, KMT2C, KMT5B, MBD5, PHF12, PHF21A, POGZ, SETD5, SIN3A, SKI, SMARCC2, WAC), 7-еуі нейронаралық коммуникация гендері (CACNA1G, GRIA3, GRIN2A, NRXN1, SCN2A, SHANK3, SLC6A1; Danio rerio балығында scn1lab гені адамның SCN1A және SCN2A гендерінің ортологы болып табылады), 3-еуі жасушалық сигналинг және белоктардың модификациясы гендері (CUL3, PPP2R5D, PTEN), ал 2-еуі цитоқаңқа гендері (ANK2, DYRK1A) болды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f1.jpg\" alt=\"1-сурет: 17𝜷-эстрадиол-х-нейродаму бұзылуы қаупі гендерінің әсерін бағалайтын екі жүйелі, ауқымды, көп модальді скрининг\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: 17𝜷-эстрадиол-х-нейродаму бұзылуы қаупі гендерінің әсерін бағалайтын екі жүйелі, ауқымды, көп модальді скрининг конвейерінің эксперименталдық шолуы. Эстрадиолмен емдеудің және нейродаму бұзылуы (NDD) қауіп гендеріндегі функцияны жоғалту мутацияларының әсері үш модальділік арқылы өлшенеді: (1) hiPSC-тен алынған NGN2-индукцияланған глутаматергиялық нейрондардағы (iGLUTs) бір жасушалы RNAseq, (2) iGLUTs-тағы нейрондық кальций визуализациясы және (3) дернәсілдік зебрабалықтағы сенсомоторлық және қозу мінез-құлқы. Модальділіктер қиылысатын, бірақ тәуелсіз гендер жиынтығын қамтиды. ASD/NDD нысаналы гендері ген экспрессиясын реттеуді (қызғылт), нейрондық функция мен коммуникацияны (жасыл), жасушалық сигнал беруді және ақуыз модификациясын (сұр) және цитоскелетті (көк) қоса алғанда, мыңдаған функцияларды қамтиды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f2.jpg\" alt=\"2-сурет: Эстрадиол iGLUTs-та дисрегуляцияланған DEG және синаптикалық жолдарды қалпына келтіреді. A. Эксперименттік диза\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-сурет: Эстрадиол iGLUTs-та дисрегуляцияланған DEG және синаптикалық жолдарды қалпына келтіреді. A. Эксперименттік дизайнның және түрлі әсер салыстыруларының схемасы. Отыз алты NDD қауіп гені 24 сағат бойы 100 нМ эстрадиолдың әсерімен және әсерінсіз hiPSC-тен алынған NGN2-глутаматергиялық нейрондардағы (iGLUTs) біріктірілген бір жасушалы CRISPR-нокаут скринингі арқылы нысанаға алынды. Әрбір ген 3-4 gRNA көмегімен нысанаға алынды (i). Өңделген және өңделмеген топтар арасында әртүрлі әсер салыстырулары орындалды (ii). Негізгі KO әсері KO+DMSO мен нысанаға алынбаған бақылау (NT)+DMSO салыстырады. Негізгі E2 әсері NT+E2 мен NT+DMSO салыстырады. E2 шегіндегі KO әсері KO+E2 мен NT+E2 салыстырады. KO шегіндегі E2 әсері KO+E2 мен KO+DMSO салыстырады. E2 және KO бірлескен әсері KO+E2 мен NT+DMSO салыстырады. B. Нысаналы NDD гені бойынша пертурбация дәрежесі (сол жақта, нүктелі диаграмма). Шеңбер өлшемі p-мәнінің теріс log10(p-мәнін) көрсетеді. Сабақ нокаут +DMSO мен нысанаға алынбаған бақылау + DMSO логарифмдік еселік өзгерісін көрсетеді. KO нысаналы NDD гендері үшін gRNA байытылуы және нысаналы KO ген экспрессиясының төмендеуі негізінде анықталды. Негізгі KO әсеріндегі дифференциалды экспрессияланған гендер саны гистограммада көрсетілген (FDR &amp;lt;0.05). C. Эстрадиолмен қалпына келтірілген гендер (көк) немесе қалпына келтірілмеген гендер (сұр) ішіндегі ER нысаналы гендерінің пайызы. D. iGLUTs-тағы NDD қауіп гендері бойынша DEG-ке эстрадиолдың қалпына келтіру әсері. Эстрадиолдың негізгі KO DEG санына әсері өзгермеген, ішінара қалпына келтіру, қалпына келтіру және шамадан тыс түзетілген санақтарына жіктеледі. Қалпына келтіру шектерінің дәрежесін егжей-тегжейлі сипаттау үшін Әдістер мен SI 16-суретке қараңыз. Нысаналы гендер қалпына келтірілді деп жіктелген DEG пайызының ең жоғарысынан ең төменіне дейін реттелген (FDR &amp;lt;0.05). E. Үздік 5 нысаналы KO бойынша эстрадиол қалпына келтірген Гендік онтологияның (GO) биологиялық жолдары. Нүкте өлшемі KO ішіндегі E2 әсерінің гендер жиынтығы байытылу маңыздылығының –log10(p-мәнін) көрсетеді. F. NDD KO бойынша сынақтан өткен конвергентті гендердің конвергентті емес гендерге қарағанда E2 арқылы қалпына келтірілу ықтималдығы. Фишердің нақты тесті, ***FDR&amp;lt;0.001, **FDR&amp;lt;0.01, &lt;em&gt;FDR&amp;lt;0.05. G. iGLUTs-тағы ASH1L және SCN2A KO арасында эстрадиолдың қалпына келтірілуін көрсететін таңдалған GO терминдері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f3.jpg\" alt=\"3-сурет: Эстрадиол бес NDD мутанты бойынша гиперсинхронды разряд өрнегін қалпына келтіреді. A. Нейрондық белсенділікті б\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Эстрадиол бес NDD мутанты бойынша гиперсинхронды разряд өрнегін қалпына келтіреді. A. Нейрондық белсенділікті бағалауға арналған эксперименттік жұмыс процесі. 100 нМ эстрадиолды өткір бірден енгізгеннен кейінгі нейрондық белсенділік конфокальды микроскопиясы бар Fluo4 кальций визуализациясын қолдана отырып, iGLUTs-тағы 15 NDD қауіп генінің нокаутында өлшенеді. Жеке жасушалар реттелетін пиксельдік жасуша сегментациясын талдау арқылы анықталады. Кальций транзиенттерінің ұзақтығы мен амплитудасы, сондай-ақ желілік синхронизация оқиғалары өлшенеді. B. Спонтанды желілік синхронизация бойынша корреляциялық талдау ұқсас фенотиптері бар NDD қауіп гендерінің 4 субкластерін анықтайды. Кластер 1: KMT5B және нысанаға алынбаған бақылау (NT). Кластер 2: CACNA1G, SHANK3, ANK2, ASH1L, SCN2A. Кластер 3: CHD8, PTEN, ARID1B, CUL3. Кластер 4: POGZ, NRXN1, GRIA3, GRIN2A, DYRK1A. Сары қорап айқын гиперсинхронды разряд фенотипі бар 2-кластерді көрсетеді. C. Нысанаға алынбаған бақылаудағы, ASH1L, SCN2A, SHANK3, ANK2 және CACNA1G-дағы спонтанды базалық нейрондық белсенділіктің (жоғарыда) және эстрадиолмен өңделген (төменде) растролық диаграммалары. Растролық диаграмманың әрбір жолы — жасуша, ал әрбір баған — кадр. Жасушалар 1 минут бойы түсірілді (750 кадр). D. Спонтанды және эстрадиолмен өңделген желілік синхронизация бойынша корреляциялық талдау. Екі бөлек кластер түзіледі. Кластер 1: Спонтанды ANK2, ASH1L, CACNA1G, SCN2A және SHANK3. Кластер 2: Спонтанды нысанаға алынбаған бақылау, Эстрадиолмен өңделген нысанаға алынбаған бақылау, Эстрадиолмен өңделген ANK2, ASH1L, CACNA1G, SCN2A, SHANK3. E. Эстрадиолмен емдеу арқылы кері қайтарылған синхронизация өрнегіне ықпал ететін белсенді нейрондардың пайызы бойынша қауіп генінің нокауттарын реттеу.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Мінез-құлықты сандық талдау жоғары өнімді автоматтандырылған бейнетрекинг арқылы көру шошыну реакциясының (VSR) және «ұйқы — сергектік» циклінің 24 параметрі бойынша жүргізілді (Сурет 4A, Кесте S7). Иерархиялық кластерлеу бастапқы кезеңде жеті мінез-құлық тобын анықтады (Сурет 4C; Сурет S9A):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;1-топ: wacab, crebbpab, arid1b, phf21aab;&lt;/li&gt;\n&lt;li&gt;2-топ: cacna1g, ptenab, nrxn1ab, scn1lab, ash1l, chd8;&lt;/li&gt;\n&lt;li&gt;3-топ: grin2aab, chd2, skiab, phf12ab;&lt;/li&gt;\n&lt;li&gt;4-топ: kdm5ab, ppp2r5d, bcl11ab, mbd5;&lt;/li&gt;\n&lt;li&gt;5-топ: ank2ab, kmt2cab, kmt5b;&lt;/li&gt;\n&lt;li&gt;6-топ: slc6a1ab, kdm6bab, dyrk1aab, sin3ab;&lt;/li&gt;\n&lt;li&gt;7-топ: smarcc2, setd5, gria3ab, pogzab, shank3ab, cul3ab.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f4.jpg\" alt=\"4-сурет: Эстрадиол рецепторларының механизмдері ash1l және scn1lab мутанттарындағы қозу және сенсомоторлық фенотиптердің\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Эстрадиол рецепторларының механизмдері ash1l және scn1lab мутанттарындағы қозу және сенсомоторлық фенотиптердің эстрадиолмен қалпына келтірілуін болжайды. A. Дернәсілдік зебрабалық мінез-құлық талдауларының эксперименттік қондырғысы. Дернәсілдің мінез-құлқы автоматтандырылған видеобақылау арқылы өлшенеді. Визуалды старт-рефлекс (VSR): дернәсілдер бейімделеді және ұрықтанудан кейінгі 5-ші күні (dpf) 29 секундтық интервалмен бес 1 секундтық жарықтың өшуі (Startle-OFF) немесе жануы (Startle-ON) стимулдарына ұшырайды. Ұйқы-ояулық: дернәсілдер 5-7 dpf аралығында 14сағ:10сағ жарық:қараңғылық цикліне ұшырайды. Визуалды старт-рефлекс және ұйқы-ояулық параметрлері көрсетілген. B. Мутантты мінез-құлық фенотиптерімен корреляцияланбайтын (қарама-қарсы) немесе корреляцияланатын (еліктейтін) дәрілер мен механизмдерді болжау үшін жабайы типтегі зебрабалықтағы FDA мақұлдаған 376 қосылыстың фармакоповеденциялық профильдеу схемасы. C. 24 визуалды старт-рефлекс және ұйқы-ояулық мінез-құлық параметрлері бойынша корреляциялық талдау ұқсас фенотиптері бар NDD қауіп гені мутанттарының 7 субкластерін анықтайды. Кластер 1: wacab, crebbpab, arid1b, phf21aab. Кластер 2: cacna1g, ptenab, nrxn1ab, scn1lab, ash1l, chd8. Кластер 3: grin2aab, chd2, skiab, phf12ab. Кластер 4: kdm5bab, ppp2rd5, bcl11aab, mbd5. Кластер 5: ank2ab, kmt2cab, kmt5b. Кластер 6: slc6a1ab, kdm6bab, dyrk1aab, sin3ab. Кластер 7: smarcc2, setd5, gria3ab, pogzab, shank3ab, cul3ab. F0 және тұрақты желілік мутация тізбектері SI 8-9 кестелерінде табылған. Сары қорап әртүрлі функционалдық жіктемелердегі гендерді қамтитын 2-кластерді ерекшелейді. D. Эстроген рецепторлары (ER) альфа, бета және G-ақуыз молекулалық нысаналары NDD генінің мутанттары бойынша қарама-қарсы әсер ететін (көк, корреляция &amp;lt;-0.5, p&amp;lt;0.05, t-статистика) және корреляцияланатын дәрілер (қызғылт сары, корреляция &amp;gt;0.5, p&amp;lt;0.05, t-статистика) арасында айтарлықтай байытылған. ER байытылуы жоқ мутанттар көрсетілмеген. Шеңбер өлшемі Фишердің нақты тесті арқылы есептелген -log10(p-мәнін) көрсетеді. Сабақ ұзындығы әрбір мутант үшін мүмкіндіктер қатынасын көрсетеді. NDD гендері шеңбер өлшемі мен сабақ ұзындығы бойынша реттелген. Эстроген рецепторларының альфа, бета және G-ақуызының байытылуы және әрбір ген үшін p-мәндері SI 13-кестесінде көрсетілген. E. STRING деректер базасына негізделген ash1l мутанты үшін қарама-қарсы әсер ететін дәрілердің (сұр ромбылар) нысаналары (күлгін шеңберлер) арасындағы Ақуыз-Ақуыз Өзара әрекеттесу (PPI) желісі (корреляция &amp;lt;-0.5, p&amp;lt;0.05, t-статистика) (i). Ақуыздардың түйін өлшемі әрбір ақуызды нысанаға алатын дәрілер санын білдіреді. Дәрілік нысаналар арасында байытылған GO жолдары көрсетілген (ii). F. scn1lab және ash1l мутанттары үшін тек мутанттың әсері (жоғарғы жол, HOM DMSO және WT DMSO) мен мутанттың эстрадиолмен емдеу өзара әсерінің әсері (24 сағ, 20 µM) WT көлік құралына қарағанда (HOM E2 және WT DMSO) арасындағы әрбір мінез-құлық параметрі үшін эмпирикалық бета мәндерінің жылу картасы, мінез-құлық белгілерінің салыстырмалы басылуын көрсетеді. Жұлдызшалар (&lt;/em&gt;) көрсетілген салыстыру тобында айтарлықтай ерекшеленетін мінез-құлық белгілерін көрсетеді (p * &amp;lt;0.05, ** &amp;lt;0.01, ***&amp;lt;0.001, ***&lt;em&gt;&amp;lt;0.0001, LMM). Сары қораптар қалпына келтірілген (HOM DMSO және WT DMSO-да айтарлықтай ерекшеленетін және HOM E2 және WT DMSO-да маңызды емес болған) немесе ішінара қалпына келтірілген (HOM DMSO және WT DMSO-да айтарлықтай ерекшеленетін және HOM E2 және WT DMSO-да азайған) параметрлерді көрсетеді. Фунт белгісі (#) белгінің ішінара қалпына келтірілгенін көрсетеді (i). HOM DMSO және WT DMSO-да p-мәні ≤ 0.05 болатын айтарлықтай ерекшеленетін мінез-құлық белгілері үшін біз әрбір белгі үшін HOM-x-E2 әсерін асқынған, өзгермеген, ішінара қалпына келтіру, қалпына келтіру және шамадан тыс түзетілген ретінде сипаттадық (ii). Әрбір жіктеме үшін шектердің егжей-тегжейлі сипаттамасы үшін Әдістер мен SI 16-суретке қараңыз. Мутанттар қалпына келтірілген немесе ішінара қалпына келтірілген белгілер саны бойынша реттелген. G. scn1lab және ash1l мутанттары үшін скрипка диаграммалары HOM DMSO пен WT DMSO (сол жақта) және HOM E2 пен WT DMSO (оң жақта) арасындағы ұйқы-ояулық мінез-құлық параметрлеріне әсер ету шамасын (масштабталған бета ұпайларының бөлінуі) салыстыруды көрсетеді. Қорап пен мұртты диаграммалар әрбір мутант үшін қалпына келтірілген өкілдік параметрлерді көрсетеді. Түнгі ояулық белсенділігінің жоғарылауы және ұйқы кезеңдері санының жоғарылауы scn1lab және ash1l мутанттарында сәйкесінше эстрадиолмен қалпына келтірілді (Welch түзетуімен жұптастырылмаған t-тест, **** p &amp;lt; 0.0001, *** p = 0.0010. scn1lab n = 48/топ; ash1l WT DMSO n=21, WT E2 n=21, HOM DMSO n=23, HOM E2 n=18).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Автоматтандырылған бейнетрекинг және иерархиялық кластерлік талдау генетикалық моделдерді шошыну реакциясы (VSR) мен ұйқы-сергектік көрсеткіштерінің ұқсас өзгерістеріне қарай топтастыруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Фармако-мінез-құлық деректер базасына сүйене отырып, мутантты фенотипті еліктейтін (оң корреляция) немесе оны басатын (антикорреляция) қосылыстар іздестірілді (Сурет 4B). Авторлар геномдық (ERα және ERβ) немесе геномдық емес (GPER1) эстрогендік сигналинг механизмдеріне әсер ететін препараттардың гендер (Сурет 4D, Кесте S13) мен кластерлер деңгейінде (Сурет S9B) байытылғанын тексерді (эстрадиолмен байытылмаған cacna1g, pten және nrxn1 гендері графиктерде көрсетілмеді).&lt;/p&gt;\n&lt;p&gt;2-кластердегі мутанттардың фенотиптері, әсіресе ash1l мен scn1lab, эстрогендік қосылыстармен ең күшті антикорреляцияны көрсетті (антикорреляция коэффициенті &amp;lt; -0.5, p &amp;lt; 0.05, t-статистикасы) (Кесте S14). Керісінше, басқа кластерлердегі мутанттар (smarcc2, setd5, gria3ab, shank3ab, kmt5b) жабайы типтегі балықтардағы эстрадиол әсерімен жоғары корреляция көрсетті (r &amp;gt; 0.5, p &amp;lt; 0.05, t-статистикасы).&lt;/p&gt;\n&lt;p&gt;Ақуыз-ақуыз әрекеттесу желілерін (STRING) негізгі мақсатты гендер (Сурет 4Ei мен Сурет S9C-дегі ash1l және scn1lab) үшін талдау ERα, ERβ және GPER рецепторларын қарсы әсер ететін нысаналар ретінде растады. Гендер онтологиясын (GO) талдау ядролық транскрипция, гормоналды сигналинг және эстрогендік жауап жолдарының байығанын көрсетті (Сурет 4Eii).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ash1l мен scn1lab гендері бойынша мутанттар эстрадиолға жоғары сезімталдық пен фенотиптің кері корреляциясын (r &amp;lt; -0.5, p &amp;lt; 0.05) көрсетті, бұл мінез-құлық бұзылыстарын эстрадиол арқылы түзетудің биологиялық негізі болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Фенотиптің эстрадиолмен қалпына келуін эксперименттік тексеру ұрықтанғаннан кейінгі 5–7 күндік (dpf) ash1l және scn1lab (түзетіледі деп болжанған), kmt5b (еліктейді деп болжанған) және nrxn1ab (әсері болжанбаған) гомозиготалы мутант дернәсілдерінде жүргізілді (Сурет 4F). Дернәсілдер 20 мкМ эстрадиолмен немесе бақылаумен (ДМСО) 24 сағат бойы инкубацияланды (дозаға тәуелділік Сурет S3B–S3C-де).&lt;/p&gt;\n&lt;p&gt;Жартылай немесе толық қалпына келтірілген көрсеткіштер саны бойынша саралау ең жоғары қалпына келу scn1lab және ash1l мутанттарында байқалғанын көрсетті, одан кейін kmt5b, ал ең аз әсер nrxn1ab-та болды (Сурет 4Fii). Жедел эстрадиолмен өңдеу (геномдық емес механизмдер арқылы) де арнайы фенотиптік қалпына келуге әкелді (Сурет S10, Кесте S12), бірақ 24 сағаттық алдын ала өңдеу әлдеқайда күшті әсер берді. scn1lab және ash1l мутанттарында эстрадиол ұйқы және сергектіктің арнайы параметрлерін қалыпқа келтіріп, тиісінше түнгі гиперактивтілікті және ұйқы үзілістерін азайтты (Сурет 4G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мінез-құлық фенотиптерінің қалпына келу әсері Danio rerio дернәсілдерінде (5–7 dpf) 20 мкМ эстрадиолмен инкубациялау кезінде алынған; бұл нәтижелерді адамға трансляциялау мүмкіндігін бағалау үшін сүтқоректілерде қосымша зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"estradiol-scn2a-zhaene-scn1lab-mutaciyalaryndaghy-transkripciyalykh-zhaene-zhelilik-belsendilikti-khalpyna-keltiredi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiol-scn2a-zhaene-scn1lab-mutaciyalaryndaghy-transkripciyalykh-zhaene-zhelilik-belsendilikti-khalpyna-keltiredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эстрадиол SCN2A және scn1lab мутацияларындағы транскрипциялық және желілік белсенділікті қалпына келтіреді&lt;/span&gt;&lt;/a&gt;Эстрадиол SCN2A және scn1lab мутацияларындағы транскрипциялық және желілік белсенділікті қалпына келтіреді&lt;/h4&gt;\n&lt;p&gt;Эстрадиолдың нейрондық белсенділікке әсерін зерттеу үшін scn1lab мутациясы бар гомозиготалы зебра балықтарының дернәсілдері (6 күн) және жабайы түрдегі балықтар пайдаланылды. Балықтар 24 сағат бойы эстрадиолмен (20 мкМ) немесе еріткішпен (ДМСО) өңделіп, содан кейін РНҚ секвенирлеуі жүргізілді (5A-сурет). Талдаулар эстрадиолдың синапстық берілу, нейрондардың дамуы, жасушалық цикл, митохондриялық энергия алмасуы және иондық арналардың белсенділігімен байланысты гендер экспрессиясын түзететінін көрсетті (5B-C суреттері, SN 11-суреті, SN 15-16 кестелері). Эстрогенге тәуелді жолдардың байытылуы әсердің геномдық сигнал беру арқылы жүзеге асатынын болжайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол scn1lab мутанттарында бұзылған синапстық функция мен энергия алмасуына байланысты гендер экспрессиясын қалыпқа келтіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ми белсенділігін бағалау үшін pERK/tERK карталау әдісі қолданылды (5D-сурет). scn1lab мутанттарында мидың әртүрлі бөліктерінде (теленцефалон, ромбэнцефалон және диэнцефалон) белсенділік бұзылыстары байқалды, олар эстрадиол әсерінен ішінара немесе толық қалпына келді (5E-F суреттері, SN 13-суреті). 149 аймақтан тұратын атлас екі жақты әсерді анықтады: ромбэнцефалон мен гипоталамустағы гипербелсенділіктің төмендеуі және теленцефалондағы белсенділіктің артуы (5G-суреті, SN 18-кестесі). Бұл аймақтар дернәсілдердегі esr2b және gper1 рецепторларының экспрессиясымен сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;pERK/tERK — нейрондар белсенділігін визуализациялау әдісі, мұнда фосфорланған ERK (pERK) кальций ағынының маркері ретінде жасушаның қозуын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пентилентетразолмен (PTZ, 10 мМ) құрысулар шақырылғанда, scn1lab мутанттары белсенділіктің күрт өсуін көрсетті. Эстрадиол (20 мкМ) бұл құрысулардың жиілігі мен ұзақтығын айтарлықтай төмендетті (5H-J суреттері, 5K-суреті, SN 19-кестесі). ERα (PPT), ERβ (DPN) және GPER1 (G1) селективті агонистерін қолдану рецепторлардың барлық үш түрі құрысуларды басуға қатысатынын көрсетті (SN 14-суреті). Дәл осындай әсер SCN2A+/- адам нейрондарында да расталды, мұнда эстрадиол (100 нМ) көп электродты матрица (MEA) көмегімен өлшенген желілік белсенділікті төмендетті (5L-суреті, SN 20-кестесі).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу зебра балықтары мен адам жасушалық дақылдарында жүргізілді; эстрадиолдың әсер ету механизмдері сүтқоректілер ағзасында өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эстрадиолға жоғары сезімтал ең маңызды гендердің дамып келе жатқан қыртыстағы жетілдірілген желілік байланысы және ерекше дамулық экспрессия профильдері&lt;/p&gt;\n&lt;p&gt;Эстрадиолдың терапиялық әсеріне ең бейім ASD/NDD (аутизм және нейродаму бұзылыстары) гендерін анықтау үшін зерттеушілер көпмодальды транскриптомдық, жасушалық және мінез-құлық деректер жиындарын біріктірді (6A сурет, S21 кесте). Әрбір модальділік үшін Вассерсен барицентрлерін латентті кеңістікке орналастыру (6B сурет) үш бөлек кластерді (гендік бақылау, эстрадиолмен және көлік құралымен өңделген топтар) көрсетті (6C сурет). Емдеу жағдайлары арасындағы модальділіктер қашықтығын талдау iGLUT кальций бейнелеу (нейрондық белсенділік) және зебрафиш мінез-құлқы модальділіктері өңдеу жағдайлары ішінде ұқсас екенін, ал бір жасушалы транскриптомика шарттардың ішінде де, олардың арасында да ерекше екенін көрсетті (6D сурет). Барлық модальділіктер бойынша ASD/NDD гендерінің нокауттарын эстрадиолдың қалпына келтіру дәрежесіне қарай ретке келтіргенде, ASH1L және SCN2A ең жоғары сезімталдық көрсетті, олардан кейін SHANK3 тұр (6E сурет). ASXL3, MED13L, CACNA1G және ANK2 үшін модальділікке тән қалыпқа келу әсерлері анағұрлым шектеулі болды (6E сурет; S22 кесте). Жалпы алғанда, біз эстрадиолмен емдеуге ерекше сезімталдық танытқан 7 ASD/NDD генінен тұратын топты анықтадық (ASH1L, SCN2A, SHANK3, ASXL3, MED13L, CACNA1G, ANK2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нокаут (KO) — бұл ғалымдар белгілі бір геннің қызметін анықтау мақсатында оны зертханалық жағдайда жасанды түрде істен шығаратын немесе өшіретін генетикалық әдіс.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эстрадиолға сезімталдық аутизм шеңберінде жыныспен байланысты клиникалық әсерлерді болжай алатынын бағалау үшін авторлар en novo ақуызды қысқартатын варианттардың (PTV) тасымалдаушыларының жыныстық үлестірімін ең сезімтал (n = 7) және ең аз сезімтал (n = 29) ASD/NDD гендерінде бөлек талдап, айырмашылық жоқ екенін анықтады (Фишердің нақты тесті, OR = 0.93, 95% СИ = 0.70–1.25, P = 0.669, S15A-B суреттері, S23-24 кестелер). Сол сияқты, SPARK когортасындағы ер және әйел қатысушылардағы алты стандартты ASD/NDD фенотипі бойынша клиникалық көріністер 7 ең сезімтал және 29 ең аз сезімтал гендердегі варианттары бар пациенттер үшін PTV сезімталдық талдауы бойынша маңызды жыныстық өзара әрекеттесуді көрсетпеді (S25 кесте; S15C сурет). Жалпы алғанда, эстрадиолға сезімталдық жынысқа байланысты клиникалық әсерлерді туындатпайтыны туралы қорытынды жасаймыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Эстрадиолға ең сезімтал жеті ген аутизмнің клиникалық көріністеріндегі жыныстық айырмашылықтарды анықтамайды, бірақ олар постнатальды даму кезеңдерінде күшейтілген ко-экспрессияны және мықты функционалдық желілік байланысты көрсетеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Келесі кезеңде біз эстрадиолға ең сезімтал (n = 7) және ең аз сезімтал (n = 29) гендердің мидағы экспрессиясын зерттедік. Біріншіден, біз постмортальды екі деректер жиынын пайдалана отырып, ми қыртысының базалық жыныстық әсер ететін экспрессиясын (ерлер мен әйелдер арасындағы абсолютті log2 fold change) салыстырдық және екі жағдайда да маңызды айырмашылық таппадық (UCLA, P = 0.333; BrainVar, P = 0.375; мета-талдау, P = 0.757) (7A сурет, S30 кесте). Ми қыртысы дамуының экспрессия траекторияларында да статистикалық маңызды айырмашылықтар анықталмағанымен (ең сезімталдар үшін Spearman ρ = 0.29, P = 0.535; ең аз сезімталдар үшін Spearman ρ = −0.75, P = 0.052) (7B сурет), қоздырғыш нейрондардың бір кіші түрі (жоғарғы қабатта байытылған жетіліп келе жатқан қоздырғыш нейрондар, ExM-U) эстрадиолға ең сезімтал гендермен байланысты таңдаулы жасуша түрінің даму экспрессия қолтаңбасын көрсетті (медианалық z-ұпай 1.59 қарсы −0.11; IQR, 0.956–1.87 қарсы −0.520–0.276; Вилкоксонның рангтік қосынды тесті, W = 189, P = 5.06 × 10−4, FDR = 0.0081) (7C сурет, S28-29 кестелер).&lt;/p&gt;\n&lt;p&gt;Эстрадиолға ең жоғары сезімтал гендер постнатальды қыртыстың даму кезеңдерінде, әсіресе нәрестелік (медианалық байланыс, 0.660 қарсы 0.224; P = 2.36 × 10−4, FDR = 0.00165), балалық (0.611 қарсы 0.424; P = 0.0118, FDR = 0.0275) және жасөспірімдік кезеңдерде (0.723 қарсы 0.484; P = 0.00159, FDR = 0.00557) күшейтілген ко-экспрессиялық байланысты көрсетті (7D сурет, S26-27 кестелер). Сонымен қатар, бұл гендер ең аз сезімтал гендермен салыстырғанда топ ішіндегі қалыпқа келтірілген PPI байланысын айтарлықтай жоғары көрсетті (орташа қалыпқа келтірілген дәреже, 0.381 қарсы 0.160; Вилкоксонның рангтік қосынды тесті, W = 172.5, P = 0.0046, 7E сурет), бұл ең сезімтал гендер арасында күштірек функционалдық байланыс бар екенін айғақтайды. Жиынтықтай келгенде, бұл нәтижелер қыртыстың жынысқа байланысты экспрессиясынан гөрі, ең сезімтал жеті ASD/NDD генінің постнатальды даму кезеңдерінде күшейтілген ко-экспрессия мен тығыз функционалдық желілік ұйымдасуға ие екенін көрсетеді.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"naetizhelerdi-talkhylau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#naetizhelerdi-talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелерді талқылау&lt;/span&gt;&lt;/a&gt;Нәтижелерді талқылау&lt;/h4&gt;\n&lt;p&gt;In vitro адам жасушалары мен in vivo zebrafish мутанттарындағы тәжірибелерді біріктіретін мультимодальды тәсіл эстрадиолдың аутизм спектрі бұзылыстары мен нейродаму қатер гендеріндегі (ASD/NDD) функцияны жоғалту (LoF) мутацияларымен өзара әрекеттесуін егжей-тегжейлі зерттеуге мүмкіндік берді. Алынған деректер эстрадиолдың ASD/NDD гендеріне геномдық және геномдық емес механизмдер арқылы жүзеге асатын ұқсас (конвергентті) те, әртүрлі (дивергентті) те әсер ететінін көрсетеді. Эстрадиолдың ASD/NDD гендерімен байланысқан фенотиптерді басатыны туралы бұрынғы есептерге сүйене отырып, бұл жұмыс белгілі гендер үшін LoF салдарының жұмсарғанын хабарлайды және ASH1L мен SCN2A гендерін эстрадиолға ең сезімтал деп анықтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиол транскрипциялық бұзылыстарды түзетіп, бес ген бойынша желілік гиперқозуды төмендетеді (&lt;em&gt;ASH1L&lt;/em&gt;, &lt;em&gt;SCN2A&lt;/em&gt;, &lt;em&gt;ANK2&lt;/em&gt;, &lt;em&gt;CACNA1G&lt;/em&gt;, &lt;em&gt;SHANK3&lt;/em&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Геномдық емес механизмдер — бұл гормонның ДНҚ-мен тікелей әсерлесуінсіз, мембраналық рецепторлар арқылы секундтар немесе минуттар ішінде жүретін жылдам жасушалық жауаптар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Транскриптом деңгейінде эстрадиол барлық зерттелген нокауттар нәтижесінде бұзылған гендердің экспрессиясын кең ауқымда қалпына келтірді (2-сур.). Гормон нейрондық гендер мен жолдардың экспрессия үлгілерін генотипке қарамастан үйлестіріп, нейротрансмиссияны, нейродамуды және цитоскелет реттелуін қалпына келтірді. Zebrafish scn1lab мутанттарында эстрадиол нейрогенезді, синаптикалық белсенділікті, жасуша циклін, метаболизмді және эстрогендік жолдарды да қалпына келтірді. Геномдық механизмдер ұқсас гендерді ішінара белсендіре алса да, эстроген рецепторлары (ER) нысандарының байығаны байқалмады, бұл геномдық емес механизмдердің маңыздылығын көрсетеді. Ең күшті әсер ASH1L және SCN2A үшін байқалды.&lt;/p&gt;\n&lt;p&gt;Желілік және мінез-құлық деңгейіндегі талдаулар генотипке тән және жылдам дамитын кері әсерлерді анықтады, бұл геномдық емес сигналдарды көрсетеді. Эстрадиол iGLUT нейрондарында бес ген (&lt;em&gt;ASH1L&lt;/em&gt;, &lt;em&gt;SCN2A&lt;/em&gt;, &lt;em&gt;ANK2&lt;/em&gt;, &lt;em&gt;CACNA1G&lt;/em&gt;, &lt;em&gt;SHANK3&lt;/em&gt;) бойынша желілік гиперқозуды таңдамалы түрде басты (3-сур.). Олардың барлығы бұрын адамдардағы құрысу бұзылыстарымен байланысты болған. Zebrafish зерттеулері ash1l және scn1lab мутанттарындағы ұйқы-ояу циклі бұзылыстарын басуды (4-сур.) және scn1lab мутанттарының преоптикалық аймағындағы нейрондық белсенділікті қалыпқа келтіруді көрсетті (5-сур.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиолдың әсері контекстке байланысты: ол кейбір модельдерде құрысуға қарсы қасиеттер көрсетсе, басқа жағдайларда құрысу белсенділігін ынталандыруы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эстрадиолға ең сезімтал жеті ген ASD-де ер адамдардың басым болуын (4:1 қатынас) түсіндірмейді. Қан мен мидағы эстроген концентрациялары негізінен ұқсас, ал клиникалық деректер пренатальды стероидогенездің жоғарылауын ASD-мен байланыстырады. Әйелдерді қорғау моделі әйелдерге ASD шегіне жету үшін үлкен генетикалық жүктеме қажет екенін болжайды, алайда кеш диагнозды ескергенде жыныстық айырмашылық тегістеледі. Ми ішінде синтезделетін эстрадиол концентрациясы қандағыдан асып түсіп, mGluR рецепторларын белсендіре алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстрадиолға сезімтал ASD/NDD гендерінің күшейген ко-экспрессиясы және желілік байланысы олардың мақсатты терапия үшін ортақ нүктелер екенін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Прецизиялық психиатрия науқастың генотипі мен жасушалық жауабын ескере отырып, емдеу әдістерін бейімдеуге тырысады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыс ASD/NDD қатер гендеріндегі LoF варианттарының әсерін эстрадиолдың қалай жоятынын түсіну үшін модель болып табылады. Эстрадиол әсері барлық ген үшін бірдей емес екені анықталды: конвергентті қалпына келтіру де, дивергентті күшею де байқалды. Қызығы, бұл қабілет функционалдық жіктелумен анықталмаған (ең жақсы екі ген ASH1L мен SCN2A түрлі міндеттерді атқарады), керісінше ортақ молекулалық және желілік ақауларды түзетумен байланысты болды. Эстрадиолға сезімтал гендер жетіліп келе жатқан жоғарғы қабат қоздырғыш нейрондарында байығандықтан, бұл терапиялық араласулар үшін маңызды мүмкіндік ашады.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"adamnyng-dinggektik-zhasusha-modelderi-zhaene-crispr-nokaut-kitaphanasynyng-dizajny\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#adamnyng-dinggektik-zhasusha-modelderi-zhaene-crispr-nokaut-kitaphanasynyng-dizajny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адамның діңгектік жасуша модельдері және CRISPR-нокаут кітапханасының дизайны&lt;/span&gt;&lt;/a&gt;Адамның діңгектік жасуша модельдері және CRISPR-нокаут кітапханасының дизайны&lt;/h4&gt;\n&lt;p&gt;Нерв-психикалық даму бұзылыстарының (NDD) жоғары қаупі бар гендер SFARI Gene (синдромдық немесе 1-2 ұпайлық гендер) және Gene2Phenotype (G2P) дерекқорлары негізінде таңдалды. Таңдау кезінде адамның кортикальды дамуының ерте кезеңдерінде жоғары экспрессиясы бар локустарға басымдық берілді. Матрицалық CRISPR-скрининг (кальций визуализациясы) үшін хроматинді қайта құру, синаптикалық функция және жасушалық сигнал берумен байланысты 15 ген таңдалды. Пульденген скрининг (эстрадиолмен өңдеу және scRNA-seq) үшін тізім 36 генге дейін кеңейтілді. Гендерді таңдау жыныстық ерекшеліктерге байланысты емес, дегенмен кейбір гендер (мысалы, MBD5, ASH1L, CUL3) еркектерде басым экспрессия көрсетеді. Әр ген 3-4 gRNA-мен нысанаға алынды. Матрицалық скрининг үшін hESC-iCas9 жасушалары MOI &amp;gt;1, ал пульденген скрининг үшін бірыңғай интеграцияны қамтамасыз ету мақсатында MOI &amp;lt;0,2-мен трансдукцияланды. Пуромицинмен (1 мкг/мл, 48 сағат) селекциядан кейін жасушалар көбейтіліп, криоконсервацияланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRISPR-скрининг — бұл гендердің функциясын өшіру (нокаут) арқылы олардың жасушалық процестерге әсерін зерттеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nejraldy-zhasusha-izasharlaryn-npc-oesiru\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#nejraldy-zhasusha-izasharlaryn-npc-oesiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейральды жасуша-ізашарларын (NPC) өсіру&lt;/span&gt;&lt;/a&gt;Нейральды жасуша-ізашарларын (NPC) өсіру&lt;/h4&gt;\n&lt;p&gt;Шизофрениямен (COS) ауыратын науқастардан алынған расталған hiPSC-NPC желілері (NSB2607-2-1 және NSB3182-3-1) пайдаланылды. Жасушалар қос SMAD ингибирлеуі (0,1 мкМ LDN193189 және 10 мкМ SB542431) арқылы алынып, MACS әдісімен тазартылды. Культивация Matrigel негізіндегі hNPC ортасында жүргізілді. Пульденген скринингтер үшін жасушалар Cas9v2 және LV-gRNA лентивирустарымен трансдукцияланып, пуромицин (1 мг/мл) және гигромицинмен (1 мг/мл) селекцияланды. Жинауға 72 сағат қалғанда LV-gRNA, ал 24 сағат қалғанда эстрадиолмен өңдеу жүргізілді.&lt;/p&gt;\n&lt;p&gt;iGLUT нейрондарын индукциялау&lt;/p&gt;\n&lt;p&gt;NGN2-индукцияланған iGLUT нейрондарын алу үшін H1 (XY) iCas9 желісі қолданылды. gRNA дифференциацияға дейін жеткізілді, ал Cas9 активтенуі мен нокаут NGN2-тәуелді конверсия кезінде доксициклин қосу арқылы жүзеге асты. Жасушалар mTeSR Plus ортасында ұсталды. 85-90% тығыздықта жасушалар Accutase немесе EDTA көмегімен пассаждалды. Жасушалар доксициклин-индукцияланатын NGN2 лентивирусымен трансдукцияланып, 10 мкг/мл бластицидинмен селекцияланды. NGN2 индукциясы 2 мкг/мл доксициклинмен 72 сағат бойы жүргізілді. 4-күні жасушалар Geltrex қапталған планшеттерге ауыстырылып, ROCK ингибиторы (10 мкМ Y-27632) қосылған нейрондық жетілу ортасында өсірілді.&lt;/p&gt;\n&lt;h4 id=\"17b-estradiolmen-oengdeu\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#17b-estradiolmen-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;17β-эстрадиолмен өңдеу&lt;/span&gt;&lt;/a&gt;17β-эстрадиолмен өңдеу&lt;/h4&gt;\n&lt;p&gt;Ұрықтың кортикогенезі кезінде ана қанындағы эстрадиол деңгейі 1561 пг/мл (5,7 нМ) мен 30 000 пг/мл (110 нМ) аралығында болады, оның шамамен үштен бірі биожетімді. Зерттеуде 100 нМ эстрадиол (E2) концентрациясы таңдалды. Әдебиеттерге сәйкес, 100 пМ – 100 нМ диапазонындағы эстрадиол нейрондардың синаптикалық пластикасына және актин полимерленуіне әсер етеді. NPC және iGLUT жасушалары 100 нМ E2 немесе бақылау ерітіндісімен (0,01% DMSO) кальцийлік имиджинг үшін жедел түрде немесе жасушаларды жинауға дейін 24 сағат бұрын өңделді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;17β-эстрадиол — нейрондардың дамуы мен синаптикалық байланыстарына әсер ететін негізгі стероидты гормон.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Емдеу нәтижелерін жіктеу үшін (құтқару, ішінара құтқару, өзгеріссіз, асқыну немесе артық түзету) KO+DMSO (KO-WT) және KO+E2 (KO-E2) топтары арасындағы p-мәндері мен масштабталған бета-коэффициенттері салыстырылды. Егер KO-E2 p-мәні &amp;gt;0,05 болса, әсер «құтқару» деп бағаланды. Әйтпесе, бета-коэффициенттердің бағыты мен шамасы талданды. Жіктеу логикасы SN 16-суретте көрсетілген.&lt;/p&gt;\n&lt;h4 id=\"bir-zhasushaly-rnkh-sekvenirleu-kitaphanalaryn-dajyndau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#bir-zhasushaly-rnkh-sekvenirleu-kitaphanalaryn-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бір жасушалы РНҚ секвенирлеу кітапханаларын дайындау&lt;/span&gt;&lt;/a&gt;Бір жасушалы РНҚ секвенирлеу кітапханаларын дайындау&lt;/h4&gt;\n&lt;p&gt;24 сағаттық инкубациядан кейін NPC немесе iGLUT (22-күнгі) культуралары Accumax көмегімен диссоциацияланды. Жасуша суспензиясы 37 мкм електен өткізіліп, 500 × g жылдамдықта 5 минут бойы центрифугаланды және концентрациясы 2,2 × 10⁶ жасуша/мл-ге дейін жеткізілді (тіршілік қабілеті &amp;gt;80%). Әр жолақ үшін ~52 000 жасуша (83 000 жүктелген) нысанаға алынды. Жасушаларды ұстау және кітапхана дайындау Chromium Single Cell 5' v3 хаттамасы және CRISPR анықтауға арналған Feature Barcode технологиясы негізінде жүзеге асырылды. cDNA 10 ПТР циклінде күшейтілді.&lt;/p&gt;\n&lt;h4 id=\"sekvenirleu-zhaene-derekterdi-oengdeu\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#sekvenirleu-zhaene-derekterdi-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секвенирлеу және деректерді өңдеу&lt;/span&gt;&lt;/a&gt;Секвенирлеу және деректерді өңдеу&lt;/h4&gt;\n&lt;p&gt;Кітапхана сапасы Fragment Analyzer көмегімен тексерілді. Секвенирлеу NovaSeq 6000 платформасында орындалды. GEX кітапханалары үшін әр жасушаға ~30 000 оқылым (reads), ал CRISPR кітапханалары үшін ~5 000 оқылым тереңдігі қамтамасыз етілді.&lt;/p&gt;\n&lt;h4 id=\"bir-zhasushaly-crispr-skrining-naetizhelerin-taldau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#bir-zhasushaly-crispr-skrining-naetizhelerin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бір жасушалы CRISPR-скрининг нәтижелерін талдау&lt;/span&gt;&lt;/a&gt;Бір жасушалы CRISPR-скрининг нәтижелерін талдау&lt;/h4&gt;\n&lt;p&gt;Бір жасушалы транскриптомика деректері Seurat V5 пакеті арқылы өңделді. Сапаны бақылау (QC) әр жасуша түрі мен дозасы үшін жеке жүргізілді. Бастапқы кезеңде митохондриялық, рибосомалық және гемоглобин гендерінің пайызы есептеліп, жасуша түріне тән шекті мәндер бойынша сүзгіден өткізілді. Сондай-ақ, РНҚ саны, анықталған белгілер және gRNA бойынша қосымша сүзгілер қолданылды. Бағыттаушы РНҚ-ларды (gRNA) тағайындау үшін NormalizeData функциясы мен MULTIseqDemux әдісі қолданылды. Талдау үшін тек бір gRNA-сы бар синглеттер сақталды. NPC жасушалары үшін дуплеттерді қайта тағайындау қадамы қосылды: нысаналы емес (non-targeting) және нокауттық (KO) gRNA бар дуплеттер KO gRNA-ға ие деп белгіленді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синглет — бұл бір ғана бағыттаушы РНҚ-сы бар жеке жасуша, ол CRISPR-скрининг кезінде нәтижелердің дәлдігін қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Синглеттер анықталғаннан кейін UMI саны, гендер саны және log10GenesPerUMI көрсеткіштері бойынша қосымша сүзгіден өткізілді; MALAT1, рибосомалық, митохондриялық және гемоглобин гендері жойылды. Биологиялық ковариаталар (жасуша циклінің фазасы, донор, iGLUT субтиптері, астроцит және жүйке қыртысы маркерлері) SCTransform көмегімен қалыпқа келтірілді. Дифференциалды экспрессия (DE) scrambled gRNA бар жасушаларға қатысты есептелді; тек нысаналы генді айтарлықтай төмендеткен (p &amp;lt; 0,1 және logFC &amp;lt; 0) гидтер сақталды. Кластерлер доминантты (егер бір gRNA &amp;gt;75% жасушаны құраса) немесе аралас деп жіктелді. Егер scrambled gRNA &amp;gt;50% болса, кластер аралас деп белгіленді. Қорытынды талдауға барлық жағдайда 75-тен астам жасушада бар гендер енгізілді. Интеграция IntegrateData, ал онтологияларды байыту clusterProfiler::gseGO арқылы жүзеге асырылды.&lt;/p&gt;\n&lt;h4 id=\"gen-ekspressiyasyna-aeserdi-meta-taldau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#gen-ekspressiyasyna-aeserdi-meta-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ген экспрессиясына әсерді мета-талдау&lt;/span&gt;&lt;/a&gt;Ген экспрессиясына әсерді мета-талдау&lt;/h4&gt;\n&lt;p&gt;16 KO және нысаналы емес жасушалар арасындағы дифференциалды экспрессия статистикасы METAL құралына енгізілді. «Конвергентті» гендер деп келесі критерийлерге сай келетіндері белгіленді: FDR &amp;lt; 0,05, Кокранның Q-тесті бойынша гетерогенділіктің болмауы (p &amp;gt; 0,05) және барлық 16 KO-да өзгерістердің бір бағытта болуы. Қалғандары «конвергентті емес» деп жіктелді.&lt;/p&gt;\n&lt;h4 id=\"er-nysanalary-men-e2-aeserin-bajytu-testi\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#er-nysanalary-men-e2-aeserin-bajytu-testi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ER нысаналары мен E2 әсерін байыту тесті&lt;/span&gt;&lt;/a&gt;ER нысаналары мен E2 әсерін байыту тесті&lt;/h4&gt;\n&lt;p&gt;Конвергентті гендердің ER нысаналарымен немесе эстрадиолмен (E2) қалпына келтірілген гендермен байытылуын тексеру үшін Фишердің нақты тесті қолданылды. ER нысаналарының тізімі IPA, ENCODE, ChEA және LINKS L1000 деректер базаларынан алынды.&lt;/p&gt;\n&lt;h4 id=\"kalcijlik-vizualdau-calcium-imaging\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#kalcijlik-vizualdau-calcium-imaging\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кальцийлік визуалдау (Calcium Imaging)&lt;/span&gt;&lt;/a&gt;Кальцийлік визуалдау (Calcium Imaging)&lt;/h4&gt;\n&lt;p&gt;Нейрондық желілердің белсенділігін бағалау үшін TD30 кезеңінде 2μM концентрациясындағы fluo4-AM кальций индикаторы қолданылды. Үлгілер индикатормен 1 сағат бойы инкубацияланып, дереу суретке түсіру жұмыстары жүргізілді. Кальций жарқырауларын тіркеу Dragonfly айналмалы диск микроскопы көмегімен x20 су-иммерсиялық объективі (Leica) арқылы орындалды. Түсіру параметрлері мыналарды қамтыды: толқын ұзындығы 488nm, кеңістіктік ажыратымдылығы 1024 x 1024 пиксель және көру аймағы 0.6 x 0.6 mm, кадр жиілігі секундына 80ms. Тәжірибе жасанды жұлын сұйықтығында (aCSF) жүргізілді, оның құрамы: 130mM NaCl, 3mM KCl, 1.25mM NaH2PO4, 26mM NaHCO3, 1mM MgCl2, 1mM CaCl2 және қосымша 5mM D-(+)-глюкоза. Барлық зерттелетін үлгілер 100nM эстрадиолмен (Sigma-Aldrich, #E2758) инкубацияланды, содан кейін сол бақылау аймақтары қайтадан сканерленді. Алынған кальций белсенділігі видеолары негізінде барлық анықталған жасушалар мен қызығушылық аймақтары үшін растрлық диаграммалар жасалды. Олардағы сарғыш нүктелер белгілі бір жасушадағы және уақыт аралығындағы кальций белсенділігін немесе спайктарды көрсетеді; мұнда y осі жасушаларды, ал x осі кадрлар уақытын сипаттайды. Барлық растрлар MATLAB ортасында жасалды, содан кейін R бағдарламасындағы hclust функциясы арқылы UPGMA әдісімен иерархиялық кластерленуден өткізілді; жылу карталары (heatmaps) R тіліндегі 'pheatmap' пакеті көмегімен жасалды.&lt;/p&gt;\n&lt;p&gt;Кальций кескіндерін талдау барлық уақыт кадрлары бойынша әрбір пиксельдің бастапқы кальций флуоресценциясының қарқындылығын өңдеуге негізделді. Бұдан кейін бас компоненттерді талдау (PCA) арқылы өлшемдерді қысқарту тәсілі қолданылып, уақыт бойынша ең көп өзгеріс көрсететін доминантты пиксельдер таңдап алынды. Содан кейін айқын шыңдарды алу үшін тұрақты және кешігетін кальций сигналдарын деконволюциялау арқылы уақытша шуыл жойылды. Шуылдан тазартылғаннан кейін доминантты пиксельдер ең көп өзгерістерді көрсететін бөліктерді сақтау үшін әр кадр үшін кеңістіктік тұрғыдан сүзгіден өткізілді. Кейіннен таңдалған пиксельдердің кеңістіктік айналасындағы қарқындылық өрнектерін қарау арқылы белсенді жасушалар анықталды. Анықталған жасушалар кеңістіктік деконволюция арқылы қайталанатын сигналдардың жоқтығына тексеріліп, бірегей жасушалар бөлініп шықты. Жасушалар анықталғаннан кейін, уақыт өте келе базальды кальций сигналын үйрету үшін машиналық оқыту алгоритмі (Марков тізбегі Монте-Карло) пайдаланылды. Кейін бұл базальды сигналдар базальды деңгейден айтарлықтай асатын сигналдарды (спайктар деп аталады) анықтау үшін қолданылды. Бұл кальций спайктары әрбір уақыт нүктесі үшін анықталып, кейіннен уақыт бойынша үздіксіз спайктарды анықтау үшін біріктірілді. Барлық анықталған жасушалар үшін кальций спайктары сипатталды, атап айтқанда спайк амплитудасы, жиілігі, ұзақтығы және жалпы саны есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кальцийлік визуализация (Calcium Imaging) — жасуша қозу кезінде кальций иондарына жауап ретінде жарық шығаратын флуоресцентті индикаторлар көмегімен нейрон белсенділігін нақты уақыт режимінде бақылау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"multielektrodty-matrica\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#multielektrodty-matrica\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мультиэлектродты матрица&lt;/span&gt;&lt;/a&gt;Мультиэлектродты матрица&lt;/h4&gt;\n&lt;p&gt;Көпэлектродты матрица (MEA) көмегімен нейрондық жасушадан тыс электрлік белсенділікті тіркеу Axion Maestro жүйесі (Axion Biosystems) арқылы 12.5 kHz жиілікте орындалды. Сигналдар Neural Spikes режимінде алынып, медиандық түзетуден өткізілді және 200-Hz жоғары жиілікті IIR сүзгісімен және 3-kHz Кайзер терезесі бар төмен жиілікті сүзгімен сүзгіден өткізілді. Спайктар электродқа тән шу деңгейінен 5.5 стандартты ауытқу жоғары етіп қойылған AxIS Adaptive Threshold Crossing алгоритмі көмегімен анықталды. Минималды жиілігі минутына 5 спайк болатын электродтар белсенді деп саналды. Бёрстер (спайк топтары) спайктар аралық интервал (ISI) шекті алгоритмі көмегімен анықталып, ең көбі 100ms ISI бар кемінде 5 спайк ретінде анықталды. Желілік бёрстер үшін кемінде 35% электродтардың қатысуы және ең көбі 100ms ISI бар кемінде 50 спайк талап етілді. Синхрондылық 20ms терезесі көмегімен бағаланды. MEA өлшемдері Axion талдау бағдарламалық құралы арқылы өңделді. Поли-D-лизинмен және Geltrex-пен еүрткіден қабатталған MEA ұяшығына D21 жасушалық мәдениетінен алынған 150 000 индуцияланған глутаматергиялық (iGLUT) нейрондар егілді. Қоректік ортаның жартысы әр 2–3 күн сайын алмастырылып тұрды. MEA өлшемдері DMSO (бақылау) немесе 100nM эстрадиолмен 24 сағаттық өңдеуден кейін бірдей көлемдік қатынаста жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"zebrabalykhtar-zebrafish\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zebrabalykhtar-zebrafish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зебрабалықтар (Zebrafish)&lt;/span&gt;&lt;/a&gt;Зебрабалықтар (Zebrafish)&lt;/h4&gt;\n&lt;p&gt;Зебрабалықтармен (zebrafish) байланысты барлық процедуралар Йель университетінің Жануарларды күту және пайдалану жөніндегі институционалдық комитетінің (IACUC; #2024-20054 хаттамасы) нормативтік стандарттарына сәйкес жүзеге асырылды. Зебрабалық дернәсілдері 28°C температурада 14:10 сағаттық жарық пен қараңғылық циклінде өсірілді. Дернәсілдер диаметрі 150 mm Петри табақшаларында көк суда (0.3g/L Instant Ocean, 1 mg/L метилен көгі, pH 7.0) әр табақшаға 60–80 дернәсілден отырғызылып өсірілді. Мінез-құлық сынақтары ұрықтанғаннан кейінгі 5–7 күндік (dpf) зебрабалық дернәсілдерінде жүргізілді. Дамудың бұл сатысында жынысы әлі анықталмаған.&lt;/p&gt;\n&lt;h4 id=\"zebrabalykh-mutanttaryn-alu\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zebrabalykh-mutanttaryn-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зебрабалық мутанттарын алу&lt;/span&gt;&lt;/a&gt;Зебрабалық мутанттарын алу&lt;/h4&gt;\n&lt;p&gt;Тұрақты zebrafish желілері біздің зертханамызда жасалды (соның ішінде &lt;span class=\"yfm-latex\" data-content=\"arid1b%5E%7B%5CDelta7%2F%5C7%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"chd8%5E%7B%5CDelta7%2F%5C7%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"kdm5ba%5E%7B%5CDelta17%2F%5C17b%5CDelta14%2F%5C14%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"pogza%5E%7B%5CDelta23%2F%5C23b%5CDelta20%2F%5C20%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"cul3a%5E%7B%5CDelta7%2F%5C7b%5CDelta32%2F%5C32%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"dyrk1aa%5E%7B%5CDelta77%2F%5C77b%5CDelta8%2F%5C8%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"scn1lab%5E%7B%5CDelta44%2F%5C44%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, nrxn1a⁵i/5ib¹0i/10i, &lt;span class=\"yfm-latex\" data-content=\"ptena%5E%7B%5CDelta10%2F%5C10%7Db%5E%7B%5CDelta2%2F%5C2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) немесе Thyme зертханасы (ash1l¹i,Δ60,19i/1i,Δ60,19i, &lt;span class=\"yfm-latex\" data-content=\"kmt5b%5E%7B%5CDelta208%2C1i%2C%5CDelta5%2F%5C208%2C1i%2C%5CDelta5%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"kmt2ca%5E%7B%5CDelta82%2C17i%2F%5C82%2C17i%7Db%5E%7B%5CDelta6%2C%5CDelta29%2F%5C6%2C%5CDelta29%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"grin2aa%5E%7B%5CDelta175%2F%5C175%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"grin2ab%5E%7B%5CDelta42%5CDelta5%5C38%2F%5C42%5CDelta5%5C38%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"cacna1g%5E%7B%5CDelta52%2F%5C52%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) пен Dallman зертханасынан (shank3a⁴ishank3b¹i) сыйға тартылды. F0 ұрпағының мозаикалық мутанттары (crispants: ank2ab, bcl11aab, chd2, crebbpab, gria3ab, kdm6bab, mbd5, phf12ab, phf21aab, ppp2r5d, setd5, sin3aab, skiab, slc6a1ab, smarcc2, waca
