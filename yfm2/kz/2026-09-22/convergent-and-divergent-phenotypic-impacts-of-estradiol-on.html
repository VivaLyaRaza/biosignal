b) CRISPR-Cas9 әдісімен жасалды. Әрбір аллель үшін екі CRISPR crRNA жобаланып, бастапқы экзондарға бағытталды. CRISPR RNP кешендері жеке жинақталып, бір жасушалы сатыда инъекция жасалар алдында біріктірілді. Бақылау тобына эксперименттік топ үшін қолданылған гидтер санына сәйкес келетін кездейсоқ реттелген гидтер енгізілді.&lt;/p&gt;\n&lt;p&gt;Инъекция жасалған эмбриондар ұрықтанудан кейінгі 5-күнге (dpf) дейін өсіріліп, содан кейін мінез-құлық тесттері жүргізілді. Нейродаму бұзылыстарының (NDD) гендері мутанттары үшін бірегей мінез-құлық «ізі» анықталып, мутанттар арасында ұқсас және әртүрлі фенотиптер байқалды (SI 5A-сурет). Нейрондық желі деңгейінде ортақ функциялары бар конвергентті топтарды жіктеу үшін иерархиялық кластерлеу арқылы корреляциялық талдау жасалды. NDD гендерінің мінез-құлық белгілері жоғары дәрежеде корреляцияланған жеті бөлек ішкі тобы анықталды (4C-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;CRISPR crispants әдісі тұрақты желілерді ұзақ уақыт бойы өсірмей-ақ, эмбриондарда гендерді уақытша өшіруге мүмкіндік береді, ал мінез-құлық профильдері түрлі генетикалық ақауларды ұқсас белгілері бойынша топтастыруға көмектеседі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"minez-khulykh-synakhtary\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#minez-khulykh-synakhtary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлық сынақтары&lt;/span&gt;&lt;/a&gt;Мінез-құлық сынақтары&lt;/h4&gt;\n&lt;p&gt;Генетикалық өзгерістердің салдарынан туындайтын жүйке тізбегі ақауларын бағалау үшін zebrafish дернәсілдерінің қоздырылғыштығы мен сенсомоторлық өңдеуін өлшеу мақсатында автоматтандырылған, жоғары өнімділікті сандық мінез-құлық скринингі жүргізілді. 15 тұрақты гомозиготалы мутант немесе 16 NDD гені үшін F0 мозаикалық crispant желілерінде 24 көру-қорғаныс реакциясы (VSR) және ұйқы-ояу циклі параметрлері өлшенді (SI 8-9-кестелер). Дернәсілдер 96-ұяшықты планшеттің (7701-1651; Whatman, Clifton, NJ) әр ұяшығына 650 мкл стандартты эмбрион суымен (0.3 г/л Instant Ocean, 1 мг/л метилен көктемі, pH 7.0) Zebrabox (Viewpoint LifeSciences, Канада) ішіне орналастырылды. Қозғалыс автоматтандырылған бейне-бақылау жүйесі (Zebrabox және ZebraLab бағдарламасы) арқылы сандық түрде өлшенді.&lt;/p&gt;\n&lt;p&gt;Көру-қорғаныс реакциясы (VSR) тесті 5 dpf жасында орындалды. Жарықтың өшуі стимулдарына жауаптарды (VSR-OFF) бағалау үшін дернәсілдер 1 сағат бойы ақ жарыққа бейімделді, 30 минут бойы базалық белсенділік бақыланды, содан кейін 29 секундтық ақ жарық аралығымен 1 секундтық бес қараңғы жарқыл берілді. Жарықтың жануы стимулдарына жауаптарды (VSR-ON) бағалау үшін тәртіп керісінше өзгертілді: 1 сағат қараңғыда бейімделу, 30 минут базалық белсенділік, содан кейін 29 секундтық қараңғылық аралығымен 1 секундтық бес ақ жарық жарқылы. VSR-OFF және VSR-ON үшін арнайы MATLAB коды көмегімен алты параметр анықталды: (i) барлық шошыну реакцияларының орташа қарқындылығы; (ii) стимулдан кейінгі орташа белсенділік; (iii) бірінші стимулдан кейінгі орташа белсенділік; (iv) стимул мен стимулдан кейінгі белсенділік қатынасы; (v) бірінші стимулға жауаптар қарқындылығы; (vi) соңғы стимулға жауаптар қарқындылығы.&lt;/p&gt;\n&lt;p&gt;Ұйқы-ояу парадигмасы VSR тесттерінен кейін 5-7 dpf аралығында жүргізілді. 14 сағат ақ жарық / 10 сағат қараңғылық циклі кезінде дернәсілдердің белсенділігі мен ұйқы өрнектері Zebrabox ішінде бақыланып, арнайы MATLAB кодымен талданды. Күндізгі және түнгі уақыттар үшін алты параметр өлшенді: (i) жалпы белсенділік; (ii) жалпы ұйқы; (iii) ояу кездегі белсенділік; (iv) тынығу эпизодтары; (v) ұйқы ұзақтығы; (vi) ұйқы латенттілігі. VSR-OFF, VSR-ON және ұйқы-ояу тесттері барысында барлығы 24 параметр талданды.&lt;/p&gt;\n&lt;h4 id=\"minez-khulykhty-taldau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#minez-khulykhty-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлықты талдау&lt;/span&gt;&lt;/a&gt;Мінез-құлықты талдау&lt;/h4&gt;\n&lt;p&gt;Әрбір ген бойынша гомозиготалы мутант пен жабайы тип немесе crispant пен бақылау балықтарының мінез-құлық параметрлерін салыстыру үшін сызықтық аралас модельдер (LMM) қолданылды. Эксперименттер арасындағы фенотиптік өзгергіштік LMM-ге эксперимент күнін кездейсоқ фактор ретінде қосу арқылы ескерілді. Иерархиялық кластерлік талдау LMM-нен алынған таңбаланған &lt;span class=\"yfm-latex\" data-content=\"-%5Clog_%7B10%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;-трансформацияланған p-мәндер негізінде мутанттар мен мінез-құлық параметрлерін топтастыру үшін жүргізілді, мұнда таңба мутанттың жабайы типке немесе crispant-тың бақылауға қарағанда фенотиптік өзгеріс бағытын көрсетеді. 24 параметр бойынша айырмашылықтарға негізделе отырып мутанттар арасындағы корреляцияларды бағалау үшін Pearson корреляциялық талдауы қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Сызықтық аралас модельдер (LMM) тәжірибе күні сияқты кездейсоқ әсерлерді ескеруге мүмкіндік береді, ал таңбасы бар p-мәндері мінез-құлықтың қай бағытқа өзгергенін нақты көрсетеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zebrabalykhtardyng-farmako-minez-khulykhtykh-profilderi-negizinde-daerilik-zattardy-prioritetteu\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zebrabalykhtardyng-farmako-minez-khulykhtykh-profilderi-negizinde-daerilik-zattardy-prioritetteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зебрабалықтардың фармакo-мінез-құлықтық профильдері негізінде дәрілік заттарды приоритеттеу&lt;/span&gt;&lt;/a&gt;Зебрабалықтардың фармакo-мінез-құлықтық профильдері негізінде дәрілік заттарды приоритеттеу&lt;/h4&gt;\n&lt;p&gt;NDD гендерімен байланысты мутант және crispant мінез-құлық фенотиптері жоғарыда сипатталған көру-қорғаныс реакциясы мен ұйқы-ояу тесттерін қолдана отырып zebrafish дернәсілдерінде сынақтан өткізілген АҚШ FDA мақұлдаған 376 дәрілік заттың деректер базасымен салыстырылды. Бұл дәрілер кем дегенде екі мінез-құлық параметріне айтарлықтай әсер етеді (LMM, p &amp;lt; 0.05 / 3, үш тест үшін түзетілген). Pearson корреляциялық талдауы мутанттық мінез-құлық қолтаңбаларымен айтарлықтай корреляцияланатын (корреляция &amp;gt; 0.5, p &amp;lt; 0.05, t-статистика) немесе антикорреляцияланатын (корреляция &amp;lt; -0.5, p &amp;lt; 0.05, t-статистика) дәрілерді анықтау үшін қолданылды (SI 14-кесте).&lt;/p&gt;\n&lt;h4 id=\"zebrabalykhtardy-estradiolmen-oengdeu\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zebrabalykhtardy-estradiolmen-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зебрабалықтарды эстрадиолмен өңдеу&lt;/span&gt;&lt;/a&gt;Зебрабалықтарды эстрадиолмен өңдеу&lt;/h4&gt;\n&lt;p&gt;Мутанттар мен эстрадиолды қолданған тәжірибелерде дернәсілдердің белсенділігі 5–7 dpf жасында бақыланды. Эстрадиолдың жедел әсерін зерттеу үшін әрқайсысына 650 мкл стандартты эмбрион суы құйылған 96 лункалы планшеттің әр лункасына жеке дара жабайы типтегі zebrafish дернәсілдері салынды. DMSO-да еритін β-Estradiol 17-cypionate 10 мM қорытынды ерітіндісі немесе таза DMSO бақылау ретінде тікелей әр лункаға 20 мкM соңғы концентрацияда (0.2% соңғы DMSO) генетикалық тұрғыдан сәйкес келетін 12–24 гомозиготалы немесе жабайы типтегі дернәсілдерге қосылды, содан кейін визуалды шошыну және ұйқы-ояу болу тесттері орындалды. Созылмалы эстрадиол тәжірибелері үшін дернәсілдер 150 мм Петри табақшаларында көк суда 20 мкM эстрадиолмен немесе DMSO-мен 24 сағат бойы өңделді, содан кейін 20 мкM таза эстрадиол немесе DMSO суы бар 96 лункалы планшетке ауыстырылып, мінез-құлық тесттері жүргізілді. Тұрақты мутантты линиялардың генотипін растау үшін әр тәжірибеден кейін генотиптеу жүргізілді. Аса күшею, өзгермеу, ішінара қалпына келу, қалпына келу және шамадан тыс түзету анықтамалары SN-суретте берілген; дәрілік қалпына келудің статистикалық маңыздылығын бағалау үшін Z-тест қолданылды. Мутанттың p-мәні ≤ 0.05 болатын мінез-құлық белгілері үшін (Mutant-WT, HOM DMSO және WT DMSO) дәрілік қалпына келу p-мәні &amp;gt;0.05 болатын белгілер (Mutant-E2, HOM E2 және WT DMSO) қалпына келді деп есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Z-тест — екі топтың орташа мәндері арасындағы статистикалық маңызды айырмашылықты анықтауға көмектесетін статистикалық талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қалған белгілердің ішінде дәрілік p-мәні &amp;gt;0.05 болатындар (E2 Effect, HOM E2 және HOM DMSO) өзгеріссіз деп танылды. Егер дәрілік p-мәні &amp;lt;0.05 болса, онда абсолютті қалпына келу әсері (Mutant-E2) мутанттық әсерге (Mutant-WT) қарама-қарсы бағытта болған белгілер шамадан тыс түзетілген деп бағаланды. Егер дәрілік p-мәні &amp;lt;0.05 болса, абсолютті қалпына келу әсері мутанттық әсермен бір бағытта және одан кіші болған белгілер ішінара қалпына келді, ал қалғандары асқынды деп есептелді.&lt;/p&gt;\n&lt;h4 id=\"immunogistohimiya\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#immunogistohimiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Иммуногистохимия&lt;/span&gt;&lt;/a&gt;Иммуногистохимия&lt;/h4&gt;\n&lt;p&gt;Бөлініп алынған эмбриондарды антиденелермен тұтастай бояу сипатталған әдістеме бойынша орындалды. Қосылыстардың мидың базалды белсенділігіне әсерін тексеру үшін scn1lab^Δ44/Δ44 және фоны сәйкес scn1lab⁺/+ дернәсілдері 5 dpf бастап 24 сағат бойы DMSO-да ерітілген 20 мкM эстрадиолға немесе тек DMSO әсеріне ұшырады. Үлгі мөлшері: scn1lab⁺/+ + DMSO (n=34), scn1lab^Δ44/Δ44 + DMSO (n=35), scn1lab^Δ44/Δ44 + эстрадиол (n=37) 3 тәуелсіз деректер жиынтығы бойынша. Дернәсілдер торлы елеуіш арқылы жиналып, дереу 4% PFA / 4% сахароза PBS + 0.25% Triton (PBST) ерітіндісіне батырылды. Үлгілер 4°C температурада түнде бекітіліп, PBST-те шайылды. Иммунобояу алдында ми тіндері бөлініп алынды. Бөлінген милар 150 mM Tris-HCl ішінде 70°C температурада 15 минут бойы инкубацияланды, PBST-те шайылды, 0.05% Trypsin-EDTA ішінде мұзда 45 минут пермеабилизацияланып, қайтадан PBST-те шайылды. Милар PBST, 10% BSA, 2% қалыпты ешкі сарысуы (NGS) және 1% DMSO қоспасында бір сағат бойы блокталды, содан кейін 4°C температурада түнде NGS жоқ блоктайтын ерітіндіде сұйылтылған бастапқы антиденелермен инкубацияланды. Келесі антиденелер мен сұйылтулар пайдаланылды: pERK және tERK, 1:500. Содан кейін үлгілер PBST-те шайылып, бөлме температурасында 3 сағат бойы NGS жоқ ерітіндіде 1:200 сұйылтуда Alexa флюорофорларымен конъюгацияланған қайталама антиденелермен инкубацияланды. Боя شدہ милар төмен балқу температуралы агарозада (1-2%) дорсальді түрде орнатылып, 25X (0.95W) ұлкейтуде ~200–300 мкм қашықтықты және 1.5 мкм қадамды қамтитын z-stack көмегімен конфокальді микроскопта суретке түсірілді.&lt;/p&gt;\n&lt;h4 id=\"midyng-buekil-belsendiligin-kartagha-tuesiru-taldauy\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#midyng-buekil-belsendiligin-kartagha-tuesiru-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мидың бүкіл белсенділігін картаға түсіру талдауы&lt;/span&gt;&lt;/a&gt;Мидың бүкіл белсенділігін картаға түсіру талдауы&lt;/h4&gt;\n&lt;p&gt;Ми белсенділігін тұтастай картаға түсіру талдауы аймақтық айырмашылықтарды санмен өрнектеу үшін арнайы конвейер көмегімен орындалды (бағдарламалық жасақтама GitHub-та қолжетімді, DOI: 10.5281/zenodo.7996403). Қысқаша айтқанда, tERK боялған милардың конфокальді z-stack кескіндері трансформацияға негізделген деформация көмегімен стандартты эталондық мимен сызықтық емес түрде тіркелді. Геометриялық трансформация pERK конфокальді z-stack кескіндеріне қолданылды. pERK кескінінің қарқындылығы воксельдік бөлу (pERK/tERK) арқылы tERK қарқындылығымен қалыпқа келтірілді. Орташа pERK/tERK қарқындылықтары Z-brain атласында көрсетілген жеке аймақтар ішінде есептелді. 4, 8 және 149 аймақтық атластар Z-brain атлас нұсқаларынан қолмен жасалды. E2 әсерінен кейін мутантты ми белсенділігі фенотиптерінің қалпына келген аймақтарын анықтау үшін бастапқы pERK/tERK мәндеріне сызықтық аралас модельдеу қолданылды.&lt;/p&gt;\n&lt;h4 id=\"mi-belsendiligi-fenotipterin-vizualizaciyalau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#mi-belsendiligi-fenotipterin-vizualizaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ми белсенділігі фенотиптерін визуализациялау&lt;/span&gt;&lt;/a&gt;Ми белсенділігі фенотиптерін визуализациялау&lt;/h4&gt;\n&lt;p&gt;Эстрадиолмен немесе тасымалдаушымен өңделген гомозиготалы мутанттардағы ми белсенділігінің айырмашылықтарын жабайы типтегі бақылау балықтарымен салыстыра отырып визуализациялау үшін BioImage Suite Web қолданылды. Белсенділік кескіндері қайта үлгіленген стандартты эталондық балықтың үстіне қабаттастырылды. pERK/tERK мәндерінің орташа мәні мен стандартты ауытқуын қолдана отырып, мутанттың жабайы типтегі дернәсілдерге қатысты воксельдік нормаланған Z-ұпай мәні есептелді. Кескіндер аксиалды және сагиттальді жазықтықтардағы өсу мен кемулерді көрсету үшін BioImage Suite Web жүйесінде жасалды. Препаратпен және DMSO-мен өңделген үлгілер арасындағы белсенділік айырмашылықтары қалыпқа келтірілген орташа мәндерді азайту ретінде визуализацияланды. Белсенділік айырмашылықтары scn1lab үшін 1 мен 3 аралығындагы Z-ұпай мәндерін картаға түсіру арқылы көрсетілді. Барлық аксиалды мозаикалар Z деңгейі 80-нен басталып, әр кескін үшін кесінділер бойынша кему тәртібімен көрсетілген. Сагиттальді мозаикалар X деңгейі 80-нен басталып, әр кескін үшін 10 кесіндіден кему тәртібімен көрсетіледі.&lt;/p&gt;\n&lt;h4 id=\"mi-belsendiligin-taldau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#mi-belsendiligin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ми белсенділігін талдау&lt;/span&gt;&lt;/a&gt;Ми белсенділігін талдау&lt;/h4&gt;\n&lt;p&gt;Эстрадиолдың (E2) және мутантты фактордың мидың әр аймағындағы белсенділікке әсерін бағалау үшін E2 мен мутанттың негізгі әсерлерін қамтитын сызықтық аралас модельдер (LMM) қолданылды. Зерттеуге үш топ балық кірді: DMSO-мен өңделген жабайы тип (scn1lab⁺/+, DMSO-мен өңделген), гомозиготалы мутанттар (scn1lab^Δ 44/Δ 44) және E2-мен өңделген гомозиготалы мутанттар. Тәжірибелер арасындағы вариабельділікті ескеру үшін эксперимент күні LMM-ге кездейсоқ әсер ретінде енгізілді. Препараттың қалпына келтіру әсері E2-мен өңделген мутантты балықтарды DMSO-мен өңделген жабайы типтегі балықтармен салыстыру мақсатында әр ми аймағындағы E2 мен мутанттың біріккен әсері ретінде анықталды. Статистикалық маңыздылықты бағалау үшін E2 құтқару Z-тесті қолданылды. Мутанттың p-мәні &amp;lt;0.05 болған аймақтар үшін E2 құтқару p-мәні &amp;gt;0.05 болғандар толығымен құтқарылған деп саналды. Қалған аймақтар арасында E2 p-мәні &amp;gt;0.05 болғандары өзгеріссіз қалды деп бағаланды. Егер E2 p-мәні &amp;lt;0.05 болса, E2-нің абсолютті құтқару әсері мутанттың абсолютті әсерінен кіші болған аймақтар ішінара құтқарылған, ал қалғандары асқынған (exacerbated) деп есептелді. Құтқару шектерін шешудің шешімдер ағашы SI 16-суретте келтірілген.&lt;/p&gt;\n&lt;p&gt;Біз әрбір деректер жинағы үшін тәуелсіз LMM талдауын жүргіздік, содан кейін мета-талдау жасау үшін бағалауларды 3 эксперимент бойынша біріктірдік. Біріктірілген бағалау әр экспериментке тән бағалаулардың кері дисперсия бойынша өлшенген орташа мәні ретінде есептелді. Тәжірибелер арасындағы статистикалық маңыздылық жалпы p-мәнін алу үшін Фишердің біріктірілген ықтималдық тесті арқылы бағаланды. Біріктірілген бағалаулар негізінде ми аймақтары қалпына келтіру дәрежелері бойынша жіктелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сызықтық аралас модель (LMM) — бұл иерархиялық немесе өзара тәуелді деректерді талдауға арналған статистикалық әдіс, ол жалпы заңдылықтарды да (фиксирленген әсерлер), кездейсоқ ауытқуларды да (мысалы, күндер арасындағы айырмашылықты) бірдей есепке алуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khurysular\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#khurysular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрысулар&lt;/span&gt;&lt;/a&gt;Құрысулар&lt;/h4&gt;\n&lt;p&gt;Пентилентетразолмен (PTZ) туындатылған құрысу сынқтары Hoffman және соавт. (2016) жұмысына сүйене отырып, өзгерістермен орындалды. Эстрадиолмен құтқару эксперименттері үшін дернәсілдер 4 dpf-тен 5 dpf-ке дейінгі аралықта Петри табақшаларында 20 µ M эстрадиол немесе бақылау мақсатындағы DMSO ортасында түн бойы ұсталды (әр топта генотип бойынша n=24). 5 dpf кезінде дернәсілдер пипетка көмегімен эстрадиол немесе бақылау суы (650 µ L стандартты метилен көгі бар эмбрион суы: 0.3 g/L Instant Ocean, 1 mg/L метилен көгі, pH  7.0) құйылған 96 шұңқырлы планшеттің ұяшықтарына ауыстырылды. Планшет арнайы өзгертілген Zebrabox жүйесіне қойылды. Дернәсілдердің қозғалысы PTZ немесе суды қосқанға дейін және кейін 30 минут бойы Videotrack сандық режимінде жазып алынды. Videotrack детектор параметрлері шу деңгейін минимизациялай отырып, дернәсілдердің қозғалысын анық тіркеу үшін эмпирикалық түрде анықталды. PTZ стерильді дистилденген суда сұйылтылды және тікелей әр ұяшыққа қосылып, соңғы концентрациясы 10 mM болатындай етіп сынақ жалғастырылды. PTZ қосуға дейінгі және кейінгі белсенділік деректері сызықтық графиктер түрінде көрсетілді. Деректер әр балықтың PTZ қосылғаннан кейінгі белсенділігін PTZ-ге дейінгі мәндеріне нормолау арқылы талданды. Ген, эстрадиол және PTZ жауаптарын бөліп көрсету үшін үш факторлы LMM қолданылды. Zebralab бағдарламалық жасақтамасы белсенділік деңгейін сипаттау үшін мына параметрлерді генерациялайды: frect (қату саны), fredur (қату ұзақтығы), midct (орташа қозғалыс саны), middur (орташа қозғалыс ұзақтығы), burct (белсенділік жарқылының саны), burdur (жарқыл ұзақтығы), zerct (нөлдік сан), zerdur (нөлдік ұзақтық) және actinteg (әрекет интеграциясы).&lt;/p&gt;\n&lt;h4 id=\"zhalpy-rnkh-ny-boelip-alu-zhaene-sekvenirleu\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zhalpy-rnkh-ny-boelip-alu-zhaene-sekvenirleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы РНҚ-ны бөліп алу және секвенирлеу&lt;/span&gt;&lt;/a&gt;Жалпы РНҚ-ны бөліп алу және секвенирлеу&lt;/h4&gt;\n&lt;p&gt;Толық РНҚ көздері алынып тасталған дернәсілдердің оқшауланған бастарынан (n=3 бас генотипке/шартқа, әр үлгіге 1 бас) 38-ші дереккөзде сипатталғандай бөлініп алынды. Генетикалық фонды бақылау үшін РНҚ 5–6 dpf аралығында 24 сағат бойы DMSO-да ерітілген 20 µ M эстрадиолдың немесе таза DMSO әсеріне ұшыраған гетерозиготалы scn1lab^Δ 44/+ балықтардың ағайындас немесе туыс ұрпақтарынан алынған дернәсілдерден экстракцияланды. Дернәсілдердің генотипі 3 dpf-те бұрын сипатталғандай Zebrafish Embryo Genotyper (ZEG) жүйесі (wFluidx, Солт-Лейк-Сити, Юта, АҚШ) көмегімен анықталды. 6 dpf-те дернәсілдер мұзда 15 минут ішінде эвтаназия жасалды, содан кейін жіңішке пинцетом бас бөліктері бөлініп, көздері алынып тасталды. РНҚ RNeasy Micro Kit (Qiagen) жиынтығы арқылы бірден бөлініп алынды. РНҚ кітапханасын дайындау NEBNext Single Cell Low Input RNA Library Prep Kit (Cat# E6420L) көмегімен орындалды және Йель геномдық талдау орталығында (Illumina компаниясының NovaSeq X Plus құрылғысында) әр үлгі үшін 25 миллион оқу (reads) көлемінде секвенирленді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жалпы РНҚ секвенирлеуі (RNA-seq) үлгідегі барлық белсенді гендердің экспрессия деңгейін өлшеуге мүмкіндік береді, ал аз мөлшердегі материалмен жұмыс істейтін жиынтықтар (Low Input) данио балықтарының дернәсілдерінің кішкентай бастары секілді микроскопиялық үлгілермен жұмыс істеуге жол ашады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhalpy-rna-seq-derekterinen-differencialdy-ekspressiyalanatyn-genderdi-anykhtau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zhalpy-rna-seq-derekterinen-differencialdy-ekspressiyalanatyn-genderdi-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы RNA-seq деректерінен дифференциалды экспрессияланатын гендерді анықтау&lt;/span&gt;&lt;/a&gt;Жалпы RNA-seq деректерінен дифференциалды экспрессияланатын гендерді анықтау&lt;/h4&gt;\n&lt;p&gt;Дифференциалды экспрессияланатын гендерді (DEG) табу үшін сапасыз оқулар кесіліп, адаптерлік ластанулар Trim Galore (v0.5.0) көмегімен жойылды. Тазартылған оқулар HISAT2 (v2.1.0) көмегімен &lt;em&gt;Danio rerio&lt;/em&gt; референстік геномына (GRCz11) картаға түсірілді. Гендердің экспрессия деңгейлері Ensembl базасының ген модельдері (103-релиз) негізінде StringTie (v1.3.3b) көмегімен сандық түрде бағаланды. Дифференциалды экспрессияны талдау DESeq2 (v1.22.1) көмегімен жүзеге асырылды.&lt;/p&gt;\n&lt;h4 id=\"zhalpy-rna-seq-zholdaryn-taldau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zhalpy-rna-seq-zholdaryn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы RNA-seq жолдарын талдау&lt;/span&gt;&lt;/a&gt;Жалпы RNA-seq жолдарын талдау&lt;/h4&gt;\n&lt;p&gt;Құтқарылған DEG-тердің биологиялық функцияларын түсіну үшін PANTHER көмегімен функционалдық жол талдауы орындалды. Бұрын сипатталғандай, данио балықтарының гендері EnsemblBioMart (нұсқа GRCz10/danRer10) арқылы адам ортологтарымен сәйкестендірілді. Эстрадиол әсерінен кейін қалпына келген жолдарды анықтау үшін алдымен мутант + E2 жоқ топ пен жабайы тип арасындағы (p &amp;lt; 0.1 номиналды мән), сондай-ақ мутант + эстрадиол және жабайы тип арасындағы (p &amp;lt; 0.1 номиналды мән) DEG-тер анықталды. Содан кейін екі салыстырудағы DEG-тер жоғары (өзгеріс коэффициенті &amp;gt;1) және төмен (өзгеріс коэффициенті &amp;lt;1) экспрессияланған топтарға бөлініп, Gene Ontology (GO) биологиялық процестері, жасушалық компоненттер және молекулярлық функциялар ішінен маңызды биологиялық жолдарды анықтау (FDR &amp;lt; 0.05) үшін PANTHER іске қосылды. [мутант + DMSO төмендетілген және мутант + эстрадиол көтерілген] пен [мутант + DMSO көтерілген және мутант + эстрадиол төмендетілген] жолдардың қиылысуларын зерттеу және эстрадиол қайтарған жолдарды анықтау үшін InteractiVenn қолданылды.&lt;/p&gt;\n&lt;h4 id=\"koepmodaldy-transkriptomdykh,-zhasushalykh-zhaene-minez-khulykh-derekterin-integraciyalau\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#koepmodaldy-transkriptomdykh,-zhasushalykh-zhaene-minez-khulykh-derekterin-integraciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көпмодальды транскриптомдық, жасушалық және мінез-құлық деректерін интеграциялау&lt;/span&gt;&lt;/a&gt;Көпмодальды транскриптомдық, жасушалық және мінез-құлық деректерін интеграциялау&lt;/h4&gt;\n&lt;p&gt;scRNA (n жасуша, m ген), кальцийлік имиджинг (n жасуша, m фенотип) және данио балықтарының (n жасуша, m фенотип) деректерін біріктіру үшін метрикалық өлшемді кеңістіктер (MMS) тәсілі қолданылды. Әрбір модальдылық &lt;span class=\"yfm-latex\" data-content=\"k%20%5Cin%20%5C%7B1%2C2%2C3%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; c(k) = (X(k), C(k), p(k)) ретінде беріледі, мұндағы C(k) — модальдылық ішіндегі жұптық қашықтықтар матрицасы, ал p(k) — әр жасуша үшін біркелкі ықтималдық үлестірімі. Модальдылықтарды сәйкестендіру үшін Громов-Вассерштейн (GW) қашықтығы қолданылады, ол π тасымалдау матрицасы арқылы жасушалар арасындағы қатынастар геометриясын минимизациялайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Громов-Вассерштейн (GW) қашықтығы — бұл әртүрлі «кеңістіктегі» (мысалы, гендер мен фенотиптер) деректер құрылымын олардың өз топтары ішіндегі өзара байланыстарын салыстыру арқылы бағалауға мүмкіндік беретін математикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ортақ латентті кеңістікті табу үшін барицентрлер (синтетикалық масса орталықтары) B = (Y, C, p) анықталады. Оңтайландыру итеративті түрде жүреді: алдымен π(k) байланыстарын жаңарту үшін барицентр бекітіледі, содан кейін квадраттық шығын функциясы арқылы барицентрдің қашықтық матрицасы C жаңартылады. Ортақ кеңістік алынғаннан кейін, MDS (көпөлшемді шкалалау) көмегімен төмен өлшемді евклидтік эмбеддингтер жасалады.&lt;/p&gt;\n&lt;h4 id=\"estradiolgha-eng-sezimtal-zhaene-eng-sezimtal-emes-genderdi-salystyru\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#estradiolgha-eng-sezimtal-zhaene-eng-sezimtal-emes-genderdi-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эстрадиолға ең сезімтал және ең сезімтал емес гендерді салыстыру&lt;/span&gt;&lt;/a&gt;Эстрадиолға ең сезімтал және ең сезімтал емес гендерді салыстыру&lt;/h4&gt;\n&lt;p&gt;Біз 34 471 РАС (SPARK, ASC, SSC, MSSNG) және 31 052 дамуында ауытқуы бар (DDD13K, GeneDx, RUMC76) адамдардағы de novo PTV варианттарын талдадық. Гендер екі топқа бөлінді: эстрадиолға ең сезімтал (n = 7: ASH1L, SCN2A, SHANK3, ASXL3, MED13L, CACNA1G, ANK2) және ең сезімтал емес (n = 29, оның ішінде ANK3, ARID1B, CHD8 және т.б.). Клиникалық фенотиптер (FSIQ, SCQ, DCDQ, RBSR, SRS, VABS) SPARK когортасында жыныстар бойынша салыстырылды. Экспрессия ассоциациялары UCLA және BrainVar деректері негізінде log2 fold change арқылы бағаланды. Даму сатыларындағы ко-экспрессия BrainSpan базасы арқылы Спирмен корреляциясы және STRING желісі бойынша зерттелді. Топаралық байланыстылық Вилкоксон критерийімен тексерілді.&lt;/p&gt;\n&lt;h4 id=\"etikalykh-deklaraciya\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#etikalykh-deklaraciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Этикалық декларация&lt;/span&gt;&lt;/a&gt;Этикалық декларация&lt;/h4&gt;\n&lt;p&gt;Йель университетінің институционалдық кеңесі бұл жұмысқа этикалық рұқсатты талап етпеді, себебі hiPSC желілері мен ми деректері жеке басты анықтайтын ақпаратты қамтымайды және адам қатысатын зерттеу болып саналмайды. Данио балықтарымен жүргізілген барлық процедуралар IACUC (хаттама № 2024-20054) стандарттарына сәйкес орындалды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f5.jpg\" alt=\"5-сурет: Эстрадиол scn1lab/SCN2A мутанттарындағы транскрипциялық және нейрондық желі белсенділігінің дисрегуляциясын қал\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Эстрадиол scn1lab/SCN2A мутанттарындағы транскрипциялық және нейрондық желі белсенділігінің дисрегуляциясын қалпына келтіреді. A. scn1lab-/- дернәсілдеріндегі эстрадиолдың базалық ген экспрессиясына әсерін бағалауға арналған эксперименттік жұмыс процесінің схемасы. B-C. scn1lab-/- + DMSO-да жоғары реттелген (B) немесе төмен реттелген (C) DEG-тердің (p &amp;lt;0.1) және scn1lab-/- + эстрадиолдағы (E2) но-DEG-тердің (p &amp;gt;0.1) қиылысуын көрсететін Венн диаграммалары, қалпына келтірілген DEG-терді білдіреді. Венн диаграммалары InteractiVenn155-те жасалған. Жоғары реттелген (қызыл) және төмен реттелген (көк) қалпына келтірілген DEG арасында байытылған Гендік онтологияның (GO)50 жолдары Венн диаграммаларының астында көрсетілген. Штрихталған сызық FDR &amp;lt;0.05 білдіреді. Қалпына келтірілген жолдардың толық тізімі үшін SI 16-кестесіне қараңыз. D. pERK/tERK белсенділігін 149 және 4 аймақтық z-brain атласына картаға түсіру әдісінің схемасы. (E) 4 аймақтық атлас бойынша эстрадиол қалпына келтірген аймақтар. (F) scn1labΔ44/Δ44 + DMSO немесе E2-дегі ми белсенділігінің айырмашылықтарын көрсететін воксель бойынша Z ұпайымен нормаланған pERK/tERK мәндері DMSO-мен өңделген scn1lab+/+ дернәсілдеріне қатысты, өкілдік эксперименттен екі шарт арасындағы айырмашылық және үш эксперименттің мета-талдауындағы 149 аймақтық атластан қалпына келтірілген аймақтар. Барлық үш қайталанатын экспериментті визуализациялау үшін SI 13-суретке қараңыз. (G) scn1labΔ44/Δ44 + DMSO пен scn1lab+/+ + DMSO миларындағы белсенділіктегі (pERK/tERK) айтарлықтай айырмашылықтары бар 149 аймақтық атластан аймақтарды көрсететін жылу картасы (p &amp;lt;0.05, LMM мета-талдауы) scn1labΔ44/Δ44 + E2-де қалпына келтірілген (p &amp;gt;0.05, LMM мета-талдауы) немесе ішінара қалпына келтірілген (қалпына келтіру шегінің критерийлері үшін Әдістер мен SI 16-суретке қараңыз). Әрбір тіктөртбұрыш scn1labΔ44/Δ44 + E2 немесе DMSO-дағы ми белсенділігін scn1lab+/+ + DMSO-мен салыстыратын LMM-нан масштабталған бетаны білдіреді (күлгін, scn1lab+/+ + DMSO-дан жоғары; циан, scn1lab+/+ + DMSO-дан төмен). Аймақ аттарының жанында көрсетілген түстер F панеліндегі «Қалпына келтірілген аймақтар» суретіне қатысты. Жұлдызшалар (&lt;/em&gt;) DMSO шартында маңызды болатын аймақтарды көрсетеді. Фунт белгісі (#) E2 шартында ішінара қалпына келтірілген аймақтарды көрсетеді. E2 шартындағы бос қорап толық қалпына келтіруді білдіреді. H. Сол жақта: scn1lab-/- дернәсілдеріндегі эстрадиолдың туындаған құрысу белсенділігіне әсерін бағалауға арналған эксперименттік жұмыс процесінің схемасы. I. Пентилентетразол (PTZ) әсерінен туындаған құрысу белсенділігі, 20 µM эстрадиолмен 24 сағаттық әсер етілген және етілмеген жағдайда, видеобақылау арқылы scn1lab-/- дернәсілдік зебрабалық мутанттарында өлшенеді. DMSO көлік құралы немесе 20 µM эстрадиол және 10 mM PTZ немесе су әсеріне дейін және кейін 5 dpf-та бақылау және scn1lab-/- дернәсілдерінің өкілдік белсенділік іздері. Таспа +/- SEM көрсетеді. J. Бақылау және scn1lab-/- дернәсілдеріне DMSO көлік құралы немесе 20 µM эстрадиол әсеріне дейін және кейін 10 mM PTZ немесе суды қосудан 30 минут бұрын (pre) және кейін (post) орташа белсенділік. scn1lab-/- + E2 + PTZ дернәсілдері scn1lab-/- + көлік құралы + PTZ дернәсілдеріне қарағанда айтарлықтай төмендетілген белсенділікті көрсетеді (post мәндері бойынша Welch түзетуімен жұптастырылмаған t-тест, ****p&amp;lt;0.0001; n=24/топ). K. Post және pre-PTZ өлшемдерін салыстыра отырып, генотип-х-эстрадиол-х-PTZ әсерін бағалайтын өзара әрекеттесу модельдері. Мутант әсері (HOM мен бақылау), эстрадиол әсері (Эстрадиол мен DMSO) және PTZ әсері (PTZ мен су) талдауы (i). Генотип-х-эстрадиол дернәсілдер тобы арасында PTZ әсерін бағалау үшін үш жақты өзара әрекеттесу моделі (ii). L. Сол жақта: CRISPR арқылы жасалған SCN2A+/- iGLUTs-тағы эстрадиолдың нейрондық жарылыс белсенділігіне әсерін бағалауға арналған эксперименттік жұмыс процесінің схемасы. Оң жақта: Өткір 100 нМ эстрадиолдың әсерімен және әсерінсіз жасушалық және желілік жарылыс белсенділігі көп электродты матрицаны қолдана отырып, SCN2A+/- NGN2-iGLUTs-та өлшенеді. Бағанды диаграммалар бақылау және SCN2A+/- iGLUTs-тағы жасушалық жарылыстар мен желілік жарылыстардың орташа санын көрсетеді. Жұптастырылмаған t-тест, жасушалық жарылыстар *p=0.0415, желілік жарылыстар SCN2A+/- спонтанды және SCN2A+/- E2 *p=0.0127, SCN2A+/- спонтанды және WT спонтанды &lt;em&gt;p=0.0450.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f6.jpg\" alt=\"6-сурет: Мультимодальді мета-талдау ASH1L және SCN2A мутанттарында эстрадиолдың ең үлкен кері әсер ету эффектісін анықта\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Мультимодальді мета-талдау ASH1L және SCN2A мутанттарында эстрадиолдың ең үлкен кері әсер ету эффектісін анықтайды. A. Үш модальділік бойынша нысанаға алынған 36 NDD қауіп генінің кестесі: iGLUT бір жасушалы транскриптомикасы (жасыл), iGLUT кальцийлік бейнелеу (көк) және зебрабалықтардың мінез-құлқы (күлгін). Әрбір мақсатлы ген үшін қораптың жоғарғы жартысының түсі қай модальділік сынақтан өткенін, ал төменгі жартысының түсі эстрадиолдың қай модальділікті сақтап қалғанын көрсетеді. Ақ қораптар мутантта эстрадиолдың сақтау эффектісі байқалмағанын білдіреді. B. Әрбір модальділіктің геометриялық орташа мәнін анықтауға және эстрадиол эффектісін бақылау эффектісінен бөліп алуға арналған Вассерштейн барицентрі әдісінің сызбалық бейнесі. T&lt;/em&gt; бір бөліністі екіншісіне сәйкестендіру жоспарын көрсетеді, ал Z* бөліністер жиналатын барицентрлік латентті кеңістікті көрсетеді. C. Бақылау эффектісін (жасыл), эстрадиол эффектісін (қызғылт сары) және эстрадиолсыз эффектіні (сұр) көрсететін барицентрлік график. Модальділіктер әртүрлі пішіндермен берілген. Шеңбер (•) әр мутант үшін дифференциалды түрде экспрессияланған гендерді көрсетеді. Плюс таңбасы (+) әр мутант үшін синхрондау үлгісін көрсетеді. Жұлдызша (&lt;em&gt;) жеке дернәсілдердің мінез-құлық жауаптарын көрсетеді. Барицентрлер үшбұрыштармен (∆) белгіленген. D. Жобаланған латентті кеңістіктегі модальділіктер арасындағы қашықтықтың жылу картасы. Жылы түстер қысқа қашықтықты, ал салқын түстер ұзақ қашықтықты көрсетеді. Масштаб шкаласы жобаланған кеңістіктегі әр модальділіктің қашықтығына қарай қалыпқа келтірілген. E. Модальділіктер бойынша эстрадиолдың кері әсер ету шамасы негізінде гендерді рейтингке қою.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-f7.jpg\" alt=\"7-сурет: Эстрадиолға жауап беретін гендердің желілік байланысы, даму барысындағы экспрессиясы және жынысқа байланысты эк\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Эстрадиолға жауап беретін гендердің желілік байланысы, даму барысындағы экспрессиясы және жынысқа байланысты экспрессиясы. A. UCLA және BrainVar кортикальды транскриптомикалық деректер жиындарындағы және олардың мета-талдауындағы жынысқа байланысты ген экспрессиясының шамасы. Ерлер мен әйелдер үлгілері арасындағы абсолютті логарифмдік өзгеріс шамасы (/log2FC/) жынысқа байланысты экспрессия шамасын сандық бағалау үшін пайдаланылды. Қорапты диаграммаларда медиана мен кварттаралық ауқым (IQR) көрсетілген, ал жеке нүктелер гендерді білдіреді. Екі ген тобы арасындағы айырмашылықтар екі жақты Уилкоксон рангтік-сомалық тесттері арқылы бағаланды. B. BrainSpan бас миының қыртысындағы екі ген тобының даму барысындағы экспрессиялық траекториялары. Экспрессия мәндері гендер ішінде z-мәндеріне дейін стандартталды, ал қисықтар әр ген үшін медиандық экспрессия z-мәнінің даму траекторияларын көрсетеді. Спирменнің рангтік корреляция коэффициенті (rho) және сәйкес P мәндері әр ген тобы үшін даму сатысы мен экспрессия арасындағы монотонды байланысты сандық түрде анықтайды. C. Дамып келе жатқан адам қыртысындағы екі ген тобының жасуша типіне тән экспрессиясы. Генге қатысты экспрессия мәндері жасуша типтері бойынша стандартталды, ал бағандар жасуша типінің кварттаралық ауқымы (IQR) бар медиандық экспрессия z-мәнін көрсетеді. Екі ген тобы арасындағы айырмашылықтар жасуша типтері бойынша Бенджамини–Хохберг FDR түзетуімен бірге екі жақты Уилкоксон рангтік-сомалық тесттері арқылы бағаланды. Жасуша типтерінің қысқартулары төмендегідей: vRG, қарыншалық радиальды глия; oRG, сыртқы радиальды глия; PgS, S-фазалық циклдік жасушалардың бастаушылары; PgG2M, G2/M-фазалық циклдік жасушалардың бастаушылары; IP, аралық бастаушы жасушалар; ExN, жаңа туған/миграция жасайтын қоздырушы нейрондар; ExM, жетіліп жатқан қоздырушы нейрондар; ExM-U, жоғарғы қабатта байытылған жетіліп жатқан қоздырушы нейрондар; ExDp1 және ExDp2, терең қабаттағы қоздырушы нейрон түрлері 1 және 2; InMGE, медиальды ганглиозды дөңестен пайда болған интернейрондар; InCGE, каудальды ганглиозды дөңестен пайда болған интернейрондар; OPC, олигодендроциттердің ізашар жасушалары; Mic, микроглия; End, эндотелиальды жасушалар; және Per, перициттер. D. BrainSpan бас миы қыртысының үлгілеріндегі екі ген тобының даму сатысына тән бірлескен экспрессиялық байланысы. Әрбір даму сатысы үшін жұптық ген-ген Спирмен корреляциялары кортикальды үлгілер бойынша есептелді және әр ген үшін топішілік орташа Спирмен корреляциясы есептелді. Нүктелер ген деңгейіндегі медиандық байланысты, ал қате сызықтары кварттаралық ауқымды (IQR) көрсетеді. Әрбір даму сатысындағы топтық айырмашылықтар сатылар бойынша Бенджамини–Хохберг жалған ашу деңгейі (FDR) түзетуімен екі жақты Уилкоксон рангтік-сомалық тесттері арқылы бағаланды. E. STRING функционалдық өзара әрекеттесу желісін пайдалана отырып, эстрадиолға ең сезімтал жеті ген мен ең аз сезімтал 29 ген арасындағы қалыпқа келтірілген топішілік ақуыз-ақуыз өзара әрекеттесуі (PPI) дәрежесінің салыстырылуы. Қалыпқа келтірілген дәреже әр ген үшін топішілік өзара әрекеттесулер санын оның ген тобы ішіндегі мүмкін болатын максималды өзара әрекеттесулер санына бөлу арқылы есептелді. Топтар арасындағы айырмашылықтар екі жақты Уилкоксон рангтік-сомалық тесті арқылы бағаланды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/convergent-and-divergent-phenotypic-impacts-of-estradiol-on.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аутизм&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутациялары&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кезіндегі&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гормондар рөлі&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейрондардағы&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;36 генге&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CRISPR&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;скринингі&lt;/text&gt;&l
