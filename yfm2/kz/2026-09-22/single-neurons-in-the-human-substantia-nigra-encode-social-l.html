        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"272\" cy=\"81\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"528\" cy=\"250\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ми нейрондары әлеуметтік&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ережелерді қалай өңдейді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f1.jpg\" alt=\"1-сурет. Экспериментальды құрылым. (A) Қара субстанцияның торлы бөлігіндегі (SNr) микроэлектродты интраоперациялық нысан\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Экспериментальды құрылым. (A) Қара субстанцияның торлы бөлігіндегі (SNr) микроэлектродты интраоперациялық нысанаға алу. Микроэлектродтар тіркеу нысанасына — SNr орналастыру үшін клиникалық нысанадан — субталамус ядросынан (STN) вентральды түрде орналастырылды. Микроэлектродтың орналасуы және оның траекториясы бойындағы ми аймақтарының салыстырмалы анатомиялық орналасуы хирургиялық картаға түсіру, нейрондық спайктарды визуализациялау және Alpha Omega электрофизиологиялық жазу жүйесі көмегімен нейрондық импульстерді тыңдау арқылы нақты уақыт режимінде анықталды, осылайша әрбір аймақты оның жүйке белсенділігінің бірегей қолтаңбасы арқылы анықтауға болады. (B) «Ультиматум» ойыны. Қатысушылар «Ультиматум» ойынының екі нұсқасының бірін ойнады. Бір нұсқада адам аватары серіктестері қатысушыларға 20 долларды бөлу бойынша ұсыныстарды бірнеше рет ұсынды, оларды қатысушылар қабылдады немесе қабылдамады. Егер қатысушы қабылдаса, әр тарап ұсынылған үлесті алады. Егер қатысушы қабылдамаса, әр тарап ешнәрсе алмайды. Әрбір ұсынысты жаңа серіктес ұсынады. Барлық ұсыныстар 9 доллардан аз. «Ультиматум» ойынының екінші нұсқасы адам блогын ғана емес, сонымен қатар «компьютерлік» серіктестермен сынақтар блогын, сондай-ақ таңдау сынақтарының кездейсоқ 33%-дан кейінгі көңіл-күй рейтингін қамтиды. Ми тілігі мен компьютер белгішесі BioRender жүйесінде жасалған. Neal, A. (2027) https://BioRender.com/bpwujj1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Адамдар қоғамдағы жасырын ережелерге оңай бейімделеді, бірақ бұл процестің клетка деңгейінде қалай жүретіні белгісіз еді. Зерттеушілер нейрохирургиялық операция кезінде пациенттердің ми тереңдігіндегі құрылымдардың белсенділігін жазып алды. Қара субстанцияның нейрондары әлеуметтік болжам қателерін қадағалайтыны анықталды. Бұл ретте жасушалардың жауабы компьютерлік бағдарламамен емес, тірі адамдармен әрекеттескенде әлдеқайда күшті болды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Қара субстанция нейрондары әлеуметтік болжам қателерін тіркейді.&lt;/li&gt;\n&lt;li&gt;Нақты адамдармен әрекеттескенде жасуша белсенділігі артады.&lt;/li&gt;\n&lt;li&gt;Боз шарда мұндай өзгерістер байқалған жоқ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Тәжірибеге терең ми стимуляциясы операциясы жасалған Паркинсон ауруы бар 19 пациент (16 ер адам, 3 әйел, орташа жасы 65) қатысты. Процедура барысында микроэлектродтар көмегімен қара субстанцияның торлы бөлігі (SNr) мен ішкі боз шардың (GPi) жеке нейрондарының белсенділігі жазылды. Қатысушылар адам немесе компьютер аватарымен ультиматум ойынын ойнады.&lt;/p&gt;\n&lt;p&gt;Мінез-құлықты есептеу модельдеуі арқылы әр қадамдағы норма болжамының қателері (nPEs) есептелді. Нәтижелер SNr дофаминергиялық нейрондары әлеуметтік қателердің бағытын кодтайтынын көрсетті. Егер қарсылас тірі адам болса, сигнал әлдеқайда күшті болды, ал бақылау тобындағы боз шарда мұндай әсер байқалмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек нейрохирургиялық ота жасалған Паркинсон пациенттерінің шағын тобымен шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Адамдар өзгеретін нормаларға бейімделуде таңғаларлық қабілетке ие, алайда біз адам миының бұл әлеуметтік сигналдарды жеке нейрон деңгейінде қалай кодтайтыны туралы аз білеміз. Осы жұмыста біз нейрохирургиялық қатысушылар адам және компьютерлік аватарларға қарсы қайталанатын ультиматум ойынын ойнап жатқан кезде қара субстанция мен боз шар тәрізді денедегі жеке нейрондардың белсенділігін тіркедік. Мінез-құлықты есептеуіш модельдеуді қолдана отырып, біз қара субстанциядағы болжамды дофаминергиялық бірліктер әлеуметтік нормалардың болжам қателерінің валенттілігін бақылайтынын анықтадық, бұл ретте кодтау компьютерлік аватарлармен салыстырғанда адам аватарларымен ойын кезінде айқынырақ болды. Қара субстанцияға іргелес ядро болып табылатын боз шар тәрізді денедегі ұқсас талдаулар айтарлықтай әсерді анықтаған жоқ. Біздің нәтижелеріміз әлеуметтік оқыту сигналдарын кодтаудағы қара субстанцияның жаңа рөлін анықтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қара субстанция нейрондары адамдармен өзара әрекеттесу кезінде әлеуметтік нормалардың болжам қателерін кодтайды, бірақ компьютермен емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әлеуметтік қызмет аясындағы маңызды дағды - бұл өзгеретін әлеуметтік нормаларға немесе әлеуметтік топтар арасындағы мінез-құлық ережелеріне үйрену және бейімделу қабілеті. Мінез-құлықты есептеуіш модельдеу адамдардың әлеуметтік нормаларды қалай үйренетінін түсінуімізді дамытқанымен, бұл процесске қандай нейрондық механизмдер қолдау көрсететіні туралы аз нәрсе белгілі. Мұнда біз адам миы нормаларды үйрену сигналдарын жеке нейрон деңгейінде қалай кодтайтынын зерттеу үшін мінез-құлықты есептеуіш модельдеуді адамның миішілік тіркеуімен бірге қолданамыз. Біз нейрохирургиялық қатысушылар адам және компьютерлік аватарлармен әлеуметтік алмасу ойынын ойнап жатқанда адамның қара субстанциясының торлы бөлігі (SNr) мен боз шар тәрізді дененің ішкі бөлігіндегі (GPi) жеке нейрондардың белсенділігін тіркедік. Біз әр сынақтағы нормалардың болжам қателерін (nPEs) немесе әлеуметтік болжамда ой жүзінде есептелген қателерді бағаладық және болжамды дофаминергиялық SNr нейрондары nPEs валенттілігін кодтайтынын көрсеттік, бұл ретте компьютерлік аватар серіктестерімен салыстырғанда адам аватар серіктестерімен ойын кезінде күштірек кодтау байқалды. Бұл нәтиже GPi-де байқалмады. Жалпы алғанда, біздің нәтижелеріміз SNr нейрондарының әлеуметтік нормаларды үйренудегі жаңа рөлін анықтау арқылы SNr туралы қолданыстағы білімді кеңейтеді.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Адамдар табиғатынан әлеуметтік тіршілік иелері болып табылады. Адам мінез-құлқының әлеуметтік табиғатын зерттеудегі негізгі бағыттардың бірі — әлеуметтік топтар арасындағы мәдени тұрғыдан қабылданған ережелер немесе мінез-құлық үлгілері ретінде анықталған әлеуметтік нормаларды қабылдауға және соларға жауап беруге бағытталған. Бұрынғы жұмыстар нормаларды салыстырмалы түрде тұрақты әлеуметтік перцепция ретінде қарастырды. Алайда, соңғы кездері мінез-құлықты есептеулік модельдеу (компьютерлік модельдеу) адамдар әлеуметтік сигнал немесе ұсыныс пен ішкі күту арасындағы айырмашылық ретінде анықталатын норманы болжау қателіктері (nPE) негізінде өзгеретін әлеуметтік ортаға бейімделе алатынын көрсету арқылы нормаларды қабылдаудың динамикалық және икемді сипатын айқындай бастады. Нейровизуализация және зақымдану деректері nPE көрсеткіштерін қадағалауда алдыңғы аралшық (anterior insula) пен вентральды стриатумның рөлін көрсетті. Дегенмен, бұл әдістердің белгілі бір шектеулеріне (мысалы, кеңістіктік-уақыттық ажыратымдылығының төмендігі) байланысты мезолимбиялық жүйедегі қара субстанция (SN) сияқты терең ядролардың нормаларға бейімделу процесіне қалай қатысатыны әлі де беймәлім болып отыр.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дәстүрлі әдістердің шектеулеріне байланысты мезолимбиялық жүйедегі терең ядролардың әлеуметтік нормаларға бейімделуге қатысуы бұлыңғыр күйінде қалып отырды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Норманы болжау қателіктері (nPE) — күтілетін әлеуметтік мінез-құлық пен шынайы орын алған жағдай арасындағы айырмашылық, ол миға өзгеретін ережелерге бейімделуге көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қара субстанцияның мінез-құлықтағы рөлі туралы көптеген деректер жануарлар модельдеріне немесе нейродегенеративті аурулары бар науқастарға жасалған инвазивті әдістерге сүйенеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SN функциясы туралы білетініміздің көбі жануарларға жасалған зерттеулер арқылы анықталған. Мысалы, SN-ден шығатын дофаминергиялық (DA) проекциялар марапаттау арқылы оқып-үйренуде негізгі рөл атқаратыны жақсы құжатталған. BOLD fMRI сияқты стандартты инвазивті емес әдістерді қолдану арқылы адамның SN және кеңірек DA жүйесін тікелей зерттеу қиынырақ болғанымен, соңғы зерттеулер SN-нің реинфорсментті (күшейтілген) оқып-үйренудегі рөлін сипаттау үшін инвазивті жазу әдістерін (яғни бірлік нейрондарды жазу) пайдаланды. Айта κету керек, SN құрамына аз мөлшерде гамкергиялық нейрондары бар негізінен DA нейрондарын қамтитын қара субстанцияның компактті бөлігі (SNc) және салыстырмалы түрде аз DA нейрондары бар негізінен гамкергиялық нейрондарды қамтитын торлы бөлігі (SNr) кіреді. SN ішіндегі DA және гамкергиялық нейрон популяциялары анатомиялық бағдарлар бойынша толық бөлінбегенін ескерсек, адамның бірлік нейрондарын зерттеу жұмыстары жиі микроэлектродтар арқылы жазылған DA толқын пішіндерінің сипаттамалық қасиеттеріне сәйкес болжамды DA нейрон белсенділігін SNr немесе SNc ретінде нақты көрсетпей-ақ бөліп алады. Осылайша, мұндай жұмыстар адамның SN-дегі болжамды DA нейрондары (мүмкін SNr және/немесе SNc) күтілмеген қаржылық шығындармен салыстырғанда күтілмеген қаржылық ұтыстардан кейін жоғары импульсация жиілігін көрсететінін көрсетті. Керісінше, бұл жасушалардың фазалық микростимуляциясы оқу процесін тежейді. Бұл нәтижелер SN-ді марапаттау арқылы оқып-үйренумен, ал DA бірліктерін марапатты болжау қателігін кодтаумен байланыстыратын әдебиеттерге сәйкес келеді. Марапаттау арқылы оқып-үйренудегі бұл орталық рөлден басқа, DA белсенділігі адамдар мен кеміруушілерді зерттеулерде де әлеуметтік мінез-құлық үшін маңызды екені көрсетілген. Адамдарда жүргізілген фармакологиялық зерттеулер DA белсенділігі альтруизм мен эгалитарлық мінез-құлықты модерациялайтынын көрсетті. Кеміруушілерге жасалған зерттеулер DA белсенділігі әлеуметтік болжау қателігіне ұқсас түрде бейтаныс дарақтар туралы ақпаратты кодтайтынын көрсетті. Керісінше, DA дисфункциясы мінез-құлықтың икемсіздігіне, жоғары реактивтілікке және агрессияға әкеледі. Соңғы зерттеулердің бірі DA-ның әлеуметтік мінез-құлықтағы, әсіресе SNr-дегі рөлін тікелей зерттеу үшін ультиматум ойынын ойнап жатқан адамдарда жылдам сканерленетін циклдік вольтамперияны қолданды. Бұл зерттеу SNr-дегі жасушадан тыс дофамин концентрациясы алдыңғы және ағымдағы ұсыныстар арасындағы айырмашылықтарды қадағалайтынын көрсетті, мұнда сыналатындар компьютерлік аватарлармен емес, адамдармен ойнаған кезде жалпы дофамин концентрациясының жоғары екендігі байқалды. Дегенмен, адамның әлеуметтік мінез-құлқындағы жеке SN нейрондарының рөлі әлі белгісіз күйінде қалып отыр. Жалпы алғанда, DA жүйесінің марапаттау арқылы оқып-үйренудегі рөлін көрсететін жұмыстар жиынтығын және оның бірлік нейрон деңгейінде әлеуметтік мінез-құлықтағы рөлін көрсететін жұмыстарды ресми түрде байланыстыру өте құнды болар еді.&lt;/p&gt;\n&lt;p&gt;Мұнда біз SNr нейрондарының әлеуметтік норма мінез-құлқындағы есептеулік рөлін анықтау үшін мінез-құлықты есептеулік модельдеуді және адамның бірлік нейрондарын жазу әдісін қолданамыз. Паркинсон ауруы (PD) бойынша миды терең ынталандыру (DBS) құрылғысын имплантациялау операциясынан өткен қатысушылар әділдікке реакцияны, сондай-ақ нормаларға бейімделуді зерттеу үшін бұрын қолданылған мінез-құлық парадигмасы — итеративті ультиматум ойынын (UG) ойнау кезінде SNr немесе бозарған шардың ішкі сегментінен (GPi) бірлік нейрондарды жазу процедурасынан өтті. Жалпы алғанда, қатысушылар адам немесе компьютер серіктестерінің өзгермелі ұсыныстарын қабылдауды немесе қабылдамауды таңдады. Бұрын сипатталғандай, қатысушылар жиі тиімсіз ұсыныстарды қабылдамады, бірақ уақыт өте келе контрагенттердің ұсыныстарына (яғни әлеуметтік нормаға) бейімделе алды. Мінез-құлықты есептеулік модельдеу қатысушылардың компьютерлік серіктестермен салыстырғанда адамдармен ойнаған кезде жоғарырақ ұсыныстарды күткенін көрсетті, бұл әділдік күтулерінің әлеуметтік серіктестің жеке басына тәуелді екенін білдіреді. Маңыздысы, күтілетін және алынған ұсыныстар арасындағы ауытқулардың бағытын көрсететін nPE валентності компьютерлік аватарлармен салыстырғанда адам аватарларымен ойын кезінде көбірек кодталу арқылы болжамды DA SNr нейрондарының белсенділігінде кодталды. GPi-дегі оған ұқсас бақылау эксперименті импульсация жиілігіне nPE валенттілігінің айтарлықтай әсерін анықтаған жоқ. Бұл нәтижелер норманы оқып-үйрену сигналдары әлеуметтік өзара әрекеттесу кезінде SNr белсенділігін басқаратынын көрсетеді және осы белсенділіктің нейроесептеулік сипаттамасын бірлік нейрон деңгейінде қамтамасыз етеді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"eksperimental-khurylym\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#eksperimental-khurylym\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименталь құрылым&lt;/span&gt;&lt;/a&gt;Эксперименталь құрылым&lt;/h4&gt;\n&lt;p&gt;Біз субталамус ядросына (STN) терең ми стимуляциясы (DBS) имплантациясы операциясын өткерген Паркинсон ауруы бар 19 қатысушыдан (16 ер, 3 әйел, жасы 65 ± 1.93 жыл [орташа ± орташа мәннің стандартты қатесі, SEM], S1 кестесі) SNr-дан 27 бірлік нейрон белсенділігін тіркеу сеансын жинадық (1A сурет). Бірлік нейрон белсенділігін тіркеу кезінде қатысушылар ұсыныстар уақыт өте келе динамикалық түрде өзгеретін ультиматум ойынының (UG) итеративті нұсқасын ойнады. Әрбір сынақта қатысушыларға ойдан шығарылған «адам» немесе «компьютер» серіктесінен $20 сомасын бөлу бойынша ұсыныс ұсынылды, олар оны қабылдай немесе қабылдамай алатын еді (1B сурет). Егер қатысушы ұсынысты қабылдаса, әр тарап ұсынылған үлесті алды. Егер қатысушы ұсынысты қабылдамаса, ешбір тарап сыйлық алмады. Ұсыныстар псевдорандомдалған және қалыпты түрде бөлінген болатын, 1 мен 9 аралығында өзгеріп, орташа ұсыныс көлемі $5 құрады. Бұл ойын сондай-ақ әр блок сынақтарының кездейсоқ 33% пайызынан кейін өздігінен бағаланған көңіл-күй рейтингтерін қамтыды. Мінез-құлықты талдау алдында деректердің сапасын зер салмаудан, ұйқышылдықтан немесе нашар түсінуден қорғау үшін бірқалыпты (жазық) мінез-құлық сеанстары алынып тасталды. Жазық сеанстар деп адам немесе компьютер блогының толық көлемінде 2-ден аз ұсыныс қабылданған немесе қабылданбаған, сондай-ақ таңдаудың ұсыныс көлеміне қатысты логистикалық аппроксимациясы оң емес көлбеуі бар сеанстар аталды. SNr когортасында 3 адам аватар блогы және 3 компьютерлік аватар сеансы алынып тасталды. Қосымша ақпарат алу үшін «Материалдар мен әдістер» бөлімін қараңыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Терең ми стимуляциясы (DBS) — мидың нақты құрылымдарына электр импульстарын беретін электродтарды имплантациялау арқылы неврологиялық ауруларды емдеудің хирургиялық әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ultimatum-ojynynyng-minez-khulkhy\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#ultimatum-ojynynyng-minez-khulkhy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ультиматум ойынының мінез-құлқы&lt;/span&gt;&lt;/a&gt;Ультиматум ойынының мінез-құлқы&lt;/h4&gt;\n&lt;p&gt;Бұрынғы жұмыстар сау адамдардың әділетсіз ұсыныстарды, әсіресе адам аватар серіктестерінен келген ұсыныстарды қабылдамауға көбірек бейім екенін анықтаған. Сондықтан біз алдымен аралас әсерлер моделін қолдану арқылы қатысушыларымыздың таңдаулары ұсыныстардың әділдігіне және шешім қабылдау контекстіне (адам және компьютер шарты) байланысты қалай ерекшеленетінін зерттеуге тырыстық. Бұл модельде бинарлы таңдаулар (қабылдамау = 0, қабылдау = 1) ұсыныс көлемі (яғни 1, 2 және т.б.), шарт (адам = 1, компьютер = 2) және осы факторлардың өзара әрекеттесуі арқылы, қатысушы үшін және қатысушы ішіндегі сеанс үшін кездейсоқ әсерлер арқылы болжанды. Тек ұсыныс көлемінің әсері таңдауларға айтарлықтай әсер етті (ұсыныс, ***p = 8.2e-31, β ± SE = -0.85 ± 0.071; мүмкіндіктер қатынасы [OR] = 0.43, 95% сенім интервалы [CI] [0.37, 0.49]; шарт, p = 0.15, β ± SE = -0.93 ± 0.65, OR = 0.40, 95% CI [0.11, 1.41]; ұсыныс × шарт, p = 0.21, β ± SE = 0.14 ± 0.12, OR = 1.15, 95% CI [0.92, 1.45]), бұл шарттарға қарамастан ұсыныс көлемінің артуына қарай қатысушылардың қабылдамау көрсеткіштерінің төмендегенін көрсетеді (2A сурет). Сол кездейсоқ әсерлері бар шарттар бойынша жалпы қабылдамау көрсеткішін болжайтын аралас әсерлер моделі шарттар арасындағы жалпы қабылдамау көрсеткішінің айырмашылығы маңызды емес екенін көрсетті (шарт, p = 0.46, β ± SEM = -0.14 ± 0.18; OR = 0.87, 95% CI [0.61, 1.25]) (2B сурет).&lt;/p&gt;\n&lt;p&gt;Ұқсас аралас әсерлер модельдері жалпы реакция уақыты (шарт, p = 0.29, β ± SEM = 0.43 ± 0.41; OR = 1.53, 95% CI [0.69, 3.41]; S1A сурет) пен көңіл-күй рейтингтері (шарт, p = 0.68, β ± SEM = 1.00 ± 2.41; OR = 2.72, 95% CI [0.023, 320.83]; S1B сурет) шарттар арасында айтарлықтай ерекшеленбегенін көрсетті. Дегенмен, тікелей алдыңғы таңдау, шарт және қатысушы мен сеанстың кездейсоқ әсерлері бар осы термин өзара әрекеттесуі арқылы z-скалаланған көңіл-күй рейтингін болжайтын аралас әсерлер моделі z-скалаланған көңіл-күй рейтингтері адам және компьютер жағдайларында да қабылданбаған сынақтарға қарағанда қабылданған сынақтардан кейін жоғарырақ болғанын көрсетті (таңдау, *p = 0.024, β ± SEM = 0.50 ± 0.22; OR = 1.64, 95% CI [1.07, 2.53]; шарт, p = 0.81, β ± SEM = -0.049 ± 0.20; OR = 0.95, 95% CI [0.64, 1.41]; шарт × таңдау, p = 0.63, β ± SEM = 0.15 ± 0.31; OR = 1.16, 95% CI [0.62, 2.17]) (2C сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұсыныстар көлемінің ұлғаюына қарай қатысушылардың ұсыныстарды қабылдамау жиілігі төмендеді (p = 8.2e-31), ал көңіл-күйі ұсыныстар қабылданғаннан кейін айтарлықтай жоғары болды (p = 0.024).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жиынтықтай алғанда, бұл нәтижелер қатысушылардың төмен ұсыныстарға қарсы болғанын және ұсыныстарды қабылдамағаннан кейін жағымсыз сәттік көңіл-күй күйлерін бастан өткергенін көрсетеді. Бұл деректер Паркинсон ауруының бар болуына қарамастан және тіпті ақшалай ынталандырусыз да, біздің қатысушыларымыз сау, жас ересектердегі ультиматум ойынына қатысты бұрынғы нәтижелерге негізінен ұқсас түрде әрекет еткенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"norma-bejimdeluin-modeldeu\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#norma-bejimdeluin-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Норма бейімделуін модельдеу&lt;/span&gt;&lt;/a&gt;Норма бейімделуін модельдеу&lt;/h4&gt;\n&lt;p&gt;Әрі қарай, біз ұсыныстардан бас тарту мінез-құлқын және субъективті норманы жаңартудың есептеу динамикасын сипаттау үшін мінез-құлықты есептеу модельдеуін жүргіздік. Модельдеудің барлық егжей-тегжейлері «Материалдар мен әдістер» бөлімінде келтірілген. Қысқаша айтқанда, біздің алдыңғы жұмысымызға ұқсас, біз әрбір талпыныста субъективті пайдалылықты U(t) ретінде алынған ұсыныс пен жеке тұлғаның норманың бұзылуына қатысты сезімталдығы арасындағы айырмашылық ретінде құрдық. Модельде f жеке тұлғаның ішкі нормасын, ал альфа (α ∈ [0,1]) қатысушының норманың бұзылуына қатысты сезімталдығын (яғни, ішкі норма мен алынған ұсыныс арасындағы қабылданған айырмашылықты) білдіреді, бұл ретте жоғары α мәндері әділетсіздікке деген үлкен жиіркенішті көрсетеді. Субъективті пайдалылық U(t) таңдау ықтималдығымен softmax функциясы арқылы байланысты. Біз ішкі нормалардың қалай жаңартылатыны туралы болжамдары бойынша ерекшеленетін модельдердің үш класын салыстырдық: Rescorla-Wagner (RW) модельдері, мұнда нормалар уақытша айырмашылықтарды оқыту арқылы жаңартылады; Байес модельдері, мұнда нормалар Байес ережесіне сәйкес жаңартылады; және Fehr-Schmidt (FS) теңсіздікке жиіркеніш модельдері, мұнда нормалар жаңартылмайды. Әрбір класс ішінде жеке модельдер бастапқы ішкі норма (f0) туралы болжамдарымен ерекшеленді, ол $10 (тең бөлінуге сәйкес келетін қатаң f0) немесе әрбір қатысушының мінез-құлқына жеке бейімделген өзгермелі бастапқы норма күтімі (өзгермелі f0) ретінде белгіленуі мүмкін еді. Басқаша айтқанда, егер бір ойыншы сессияны 9 мөлшеріндегі бастапқы ұсыныс үшін әділдік күтімімен бастаса және басқа ойыншы 11 мөлшеріндегі бастапқы ұсыныс күтімімен бастаса, онда өзгермелі f0 моделі модельді сәйкестендіру процесінде осы бастапқы күтімдердің әрқайсысын қамтуы керек. Сонымен, өзгермелі f0 модельдерінде f0 еркін параметр болды. Сонымен қатар, біз өзгермелі f0 модельдерін де қарастырдық, мұнда әділетсіздікке қатысты сезімталдық α топтың орташа α мәніне (қатаң α) теңестірілген; топтың орташа α мәні бастапқыда еркін параметр ретінде сәйкестендірілген α бағаларын орташа есептеу арқылы алынды. Сондықтан біз барлығы 9 модельді (3 модель × 3 бастапқы ішкі норма/альфа спецификациясы) қарастырдық. Өзгермелі f0 модельдері үшін f0 және α екеуі де еркін параметрлер болды. Қатаң f0 модельдері үшін α еркін параметр, ал f0 қатаң болды. Ақырында, қатаң α модельдері үшін f0 еркін параметр, ал α қатаң болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдеу көрсеткендей, қатысушылардың мінез-құлқы ең алдымен қатаң сезімталдық (α) арқылы Fehr-Schmidt (FS) теңсіздікке жиіркеніш моделімен, одан кейін қатаң α бар Rescorla-Wagner (RW) моделімен сипатталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдерді әрбір қатысушының мінез-құлық деректеріне сәйкестендіргеннен кейін, біз жеке деңгейде (SN кестесі, SN деректер жиынтығы) және топтық деңгейде (2D-сурет) алынған минималды Байес ақпараттық критерийі (BIC) балын тексеру арқылы сәйкестік сапасын салыстырдық. FS: қатаң α моделі ең жақсы сәйкестікті көрсетті, одан кейін RW: қатаң α моделі келді (2D-сурет).&lt;/p&gt;\n&lt;p&gt;Сонымен қатар, мінез-құлық классикалық RPE (сыйақыны болжау қатесі) арқылы басқарылуы мүмкін екенін зерттеу үшін біз барлығы 9 модельді алдыңғы жұмыстарға ұқсас Q-оқыту тәсілімен салыстырдық. Классикалық Q-оқыту алгоритмі осы орта динамикасының ешқандай алдын ала моделінсіз орта ішіндегі оңтайлы әрекет-құндылық функциясын оқытады. Ол мұны алынған сыйақы және келесі күйдің бағаланған құндылығы негізінде берілген күйде әрекет ету құндылығын (яғни, Q-құндылығы) жаңарту арқылы жасайды. Бұл әдіс Q-құндылықтарын RPE арқылы басқарылатын түрде кезең-кезеңімен түзетеді. RPE арқылы басқарылатын жаңартулар сыйақы алынғаннан кейін және келесі ұсыныс ұсынылғанға дейін 0 мен 1 арасындағы оқыту жылдамдығында жүзеге асырылады. Сонымен, nPE ұсыныс жеке тұлғаның әділдік бойынша модельге негізделген нормасынан қаншалықты жоғары немесе төмен екенін сипаттаса, RPE нәтиже алдыңғы оқиғаларға негізделген күтімге қатысты қаншалықты жоғары немесе төмен екенін білдіреді. Біз барлығы 9 модельдің сәйкестік сапасын Q-оқыту тәсілімен минималды жалпы BIC балы бойынша салыстырдық. (Барлық параметр бағалары, сондай-ақ әрбір қатысушы және әрбір модель үшін қызғаныш параметрінің таралуы үшін SN деректер жиынтығы мен SN кестесін қараңыз). Модельдерді салыстыру көрсеткендей, Q-оқыту тәсілі барлық 9 модельден нашар жұмыс істеді, мұнда FS: қатаң α және RW: қатаң α модельдері қайтадан ең жақсы сәйкестікті көрсетті (SN-сурет; жеке BIC балдары үшін SN деректер жиынтығын қараңыз). Сонымен қатар, бұл нәтижелер адам және компьютер жағдайлары арасында да дәйекті (SN-сурет). Бұл нәтижелер біздің міндетіміздегі мінез-құлық классикалық Q-оқытумен емес, FS: қатаң α моделіндегідей әлеуметтік айнымалыларға негізделген статикалық артықшылықтармен немесе RW: қатаң α моделіндегідей әлеуметтік ақпаратты уақыт өте келе норма күтімдеріне модельге негізделген енгізумен мотивацияланатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Q-оқыту — бұл агент әлеуметтік нормаларға емес, болжау қателеріне (RPE) негізделіп, болашақ сыйақыны барынша арттыратын әрекеттерді таңдауды үйренетін нығайту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әрі қарай, ең жақсы сәйкес келетін екі модельдің әрқайсысы үшін дәлелдердің күшін жақсырақ бағалауды жеңілдету үшін біз ΔBIC, күтілетін модель жиілігін және қорғалған асып кету ықтималдықтарын бағаладық (SN кестесі). Бұл талдаулар FS: қатаң α моделі 0,435 күтілетін модель жиілігімен және 0,932 қорғалған асып кету ықтималдығымен ең төмен BIC-ке ие болғанын көрсетті. RW: қатаң α моделі 13,707 ΔBIC, 0,174 күтілетін модель жиілігі және 0,043 қорғалған асып кету ықтималдығына ие болды. Сонымен, FS: қатаң α моделін қолдау үшін жалпы алғанда көбірек дәлелдер болғанымен, екі үміткер модель арасындағы ең жақсы сәйкестікте белгілі бір гетерогенділік бар екендігі туралы да дәлелдер бар, бұл орташа BIC балдары FS: қатаң α және RW: қатаң α модельдері үшін сәйкесінше 10,45 және 10,93 болғандығымен дәйекті.&lt;/p&gt;\n&lt;p&gt;Содан кейін біз әрбір модельдің модельді қалпына келтіру арқылы қаншалықты сәйкестендірілетінін зерттей отырып, осы екі модельді бағалауды жалғастырдық (S3 Сурет; S4 Кесте). Модельді қалпына келтіру талдауы RW: fixed alpha моделі үшін 45.47% және FS: fixed alpha моделі үшін 37.62% қалпына келтіру ықтималдығын көрсетті, бұл бұл модельдер ең жақсы сәйкестік бойынша салыстырмалы түрде жақсы жұмыс істегенімен, RW: fixed alpha моделі жоғарырақ сәйкестендірілуді көрсеткенін білдіреді. Әрбір сыныптағы модельдер бойынша қалпына келтіру ықтималдықтарын орташалау арқылы орындалған сынып деңгейіндегі қосымша қалпына келтіру (FS модельдері, RW модельдері, Байес модельдері, Q-learning) бұл есептеу модельдерінің сыныптары тудырған мінез-құлық болжамдары ажыратыла алатынын одан әрі растады (S5 Кесте; S4 Сурет). Демек, ең жақсы сәйке келетін екі модельдің ішінде RW: fixed α моделі модельді қалпына келтіруде ең жақсы сәйкестендірілуді көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RW: fixed α моделі қалпына келтіру кезінде ең жоғары сәйкестендірілуді көрсетті және топтық та, жеке деңгейде де зерттеу қатысушыларының мінез-құлық үлгілерін сәтті қайталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Содан кейін біз параметрлерді қалпына келтіруді де, апостериорлық болжамды тексерулерді де жүргізу арқылы RW: fixed α моделі біздің зерттеуімізде байқалған таңдау үлгілерін қайталайтынын тексердік. Шын (1-кесте) және симуляцияланған параметр мәндері бұл модельде айтарлықтай корреляцияланды (S5 Сурет), бұл параметрлердің жақсы қалпына келетінін көрсетеді. Сонымен қатар, RW: fixed α моделі адам (орташа ± SEM: байқалған: 0.662 ± 0.042; симуляцияланған: 0.652 ± 0.045) және компьютер (байқалған: 0.542 ± 0.050; симуляцияланған: 0.500 ± 0.065) аватары жағдайларындағы жалпы бас тарту жиілігін қайталады (S6A Сурет). RW: fixed α моделі сонымен қатар ұсыныс көлемінің бас тарту жиілігіне тигізетін теріс әсерін қалпына келтірді (S6B Сурет). Соңында, RW: fixed α моделі жеке субъект деңгейінде мінез-құлықты қайталайтынын бағалау үшін байқалған және симуляцияланған сессиялар үшін жеке бас тарту жиіліктері де салыстырылды, бұл күшті сызықтық корреляцияны көрсетті (S6C Сурет; Пирсонның сәттік-туынды корреляциясы, ***p = 4.55e-12, r = 0.914, 95% СИ 0.823 - 0.959).&lt;/p&gt;\n&lt;p&gt;Модельді сәтті қалпына келтіру, параметрлерді қалпына келтіру және RW: fixed α моделінің топтық және жеке деңгейлерде біздің зерттеуімізде байқалған мінез-құлық үлгілерін қайталау қабілеті бірлесіп бұл модельдің біздің тапсырмамыздағы мінез-құлықты басқаратын ментальді модельдерді түсіндіру үшін қолайлы екендігіне дәлел береді.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар, бұл нәтижелер әділетсіздікке тұрақты сезімталдығы бар уақыттық айырмашылықпен оқыту қатысушылардың уақыт өте келе жаңа ақпаратты өздерінің норма туралы күтулеріне енгізуін ең жақсы түсіндіретінін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Әрбір субъектінің Ультиматум Ойынындағы (UG) мінез-құлқына RW fixed alpha норманы бейімдеу моделін сәйкестендіру арқылы алынған температура, бастапқы норма және норманы бейімдеу жылдамдығы үшін параметр бағалаулары. Адам және компьютер блоктары бөлек сәйкестендірілді. Адам және компьютер блогының параметр бағалаулары бір жақты Манн — Уитни критерийлері (Вилкоксонның рангтер қосындысы тесттері) көмегімен салыстырылды. Көрсетілген статистика орташа мән ± орташа мәннің стандартты қатесі болып табылады. *p &amp;lt; 0.05 және n.s. = Вилкоксонның бір жақты рангтер қосындысы тесттері бойынша маңызды емес. n = адам аватарларымен ойын процесінің 21 блогы және компьютер аватарымен ойын процесінің блоктары.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Норманы болжау қатесі (nPE) — бұл ағымдағы ұсыныс пен адамның күтулері арасындағы айырмашылық; ол қаржылық сыйақылар сияқты оның көңіл-күйіне тікелей әсер етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Содан кейін біз жеңіске жеткен RW: fixed α моделінің параметр мәндерін қарастырдық. Біз бастапқы ішкі нормалар да, сессия бойындағы ішкі нормалар (f) да компьютер жағдайына қарағанда адам жағдайында жоғарырақ болғанын анықтадық (2E Сурет; 1-кесте). Атап айтқанда, ішкі норманы жағдай, сынақ және осы терминдер арасындағы өзара әрекеттесу арқылы болжайтын жалпы сызықтық регрессия тек жағдай үшін айтарлықтай әсерді көрсетті, мұнда ішкі нормалар адам жағдайында жоғарырақ болады (жағдай, ***p = 8.9e-05, β ± SEM = 2.5 ± 0.64; сынақ, p = 0.38, β ± SEM = -0.027 ± 0.030; сынақ × жағдай, p = 0.79, β ± SEM = 0.0097 ± 0.036). Жағдайлар арасында бас тартудың жалпы айырмашылығының болмауына қарамастан, бұл модельге негізделген талдау қатысушылардың компьютерлік аватарлармен салыстырғанда адам аватарларының ұсыныстарына жоғарырақ күтулері болғанын болжайды.&lt;/p&gt;\n&lt;p&gt;Ақшалай қателер (PE) сәттік сезімдерге әсер ететіні көрсетілгендіктен, біз мұның nPE үшін де солай екенін зерттедік. Біз nPE мәнін ағымдағы ұсыныс көлемі мен алдыңғы ішкі норма арасындағы айырмашылықты алу арқылы есептедік. (Таңдау мінез-құлқына негізделген nPE бағалау мысалы үшін S7 Суретті қараңыз.) Оң/теріс nPE сәйкесінше ішкі нормалардан жоғары/төмен ұсыныстарды көрсетеді. Біз nPE пен олардан кейінгі дереу көңіл-күй рейтингтері арасында айтарлықтай оң корреляцияны байқадық (Пирсонның сәттік-туынды корреляциясы, **p = 0.0012, r = 0.31, 95% СИ 0.13 - 0.47) (2F Сурет). Көңіл-күй рейтингтерін nPE және сессия үшін кездейсоқ әсері бар жағдай бойынша болжайтын аралас әсерлер моделі тек nPE үшін ғана айтарлықтай тіркелген әсерді тудырды (nPE, **p = 0.0013, β ± SEM = 0.31 ± 0.09; жағдай, p = 0.96, β ± SEM = -0.0089 ± 0.18; OR = 1.36, 95% СИ [1.13, 1.63]). Сонымен қатар, nPE мен көңіл-күй арасындағы байланыстың таңдау есепке алынғаннан кейін де сақталатынын анықтау үшін біз z-ұпайлы көңіл-күйді z-ұпайлы nPE және сессия үшін кездейсоқ әсері бар таңдау арқылы болжайтын аралас әсерлер моделін құрдық. nPE мен көңіл-күй арасындағы байланыс таңдауды тіркелген әсер ретінде қосқаннан кейін де маңызды болып қала берді (nPE, *p = 0.035, β ± SEM = 0.24 ± 0.11; OR = 1.27, 95% СИ [1.02, 1.59]), ал таңдау көңіл-күйге айтарлықтай әсер етпеді (таңдау, p = 0.32, β ± SEM = 0.23 ± 0.22; OR = 1.25, 95% СИ [0.81, 1.95]). Сонымен, жағдай көңіл-күй рейтингтеріне әсер етпесе ҳам, nPE теріс nPE көңіл-күй рейтингтерін төмендететіндей етіп көңіл-күйге әсер етті, бұл прецедентті жұмыстарға сәйкес келеді.&lt;/p&gt;\n&lt;h4 id=\"snr-daghy-bolzhamdy-dofaminergiyalykh-nejrondar-aeleumettik-bolzham-khateligining-valenttiligin-kodtajdy\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#snr-daghy-bolzhamdy-dofaminergiyalykh-nejrondar-aeleumettik-bolzham-khateligining-valenttiligin-kodtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SNr-дағы болжамды дофаминергиялық нейрондар әлеуметтік болжам қателігінің валенттілігін кодтайды&lt;/span&gt;&lt;/a&gt;SNr-дағы болжамды дофаминергиялық нейрондар әлеуметтік болжам қателігінің валенттілігін кодтайды&lt;/h4&gt;\n&lt;p&gt;Біздің негізгі мақсатымыз SNr нейрондарының нормаға бейімделудегі есептеу рөлін зерттеу болды.&lt;/p&gt;\n&lt;p&gt;Осыған байланысты біз SNr микроэлектродтық жазбаларынан жеке импульстердің (спайктардың) белсенділігін шығарып, талдадық.&lt;/p&gt;\n&lt;p&gt;Біз OSORT офлайн сұрыптау алгоритмін қолдана отырып, 27 SNr микроэлектродтық жазбасынан 69 болжамды нейрондық кластерді анықтадық (жазбаға шаққандағы орташа ± SEM кластерлер: 2,6 ± 0,11). Кластерлер офлайн сұрыптау алгоритмі бойынша бір дереккөзден (яғни болжамды нейроннан) шығады деп анықталған спайктар топтарын білдіреді. Осы 69 кластердің ішінен біз 40 бірлікті бұрынғы жұмыстарда SN-дегі адамның жеке нейрондық жазбаларында белгіленген базалық орташа импульс жиілігі (≤15 Гц) және толқын пішінінің морфологиясы (ұзақтығы &amp;gt;0,8 мс, екі фазалы) критерийлері негізінде болжамды дофаминергиялық (ДА) нейрондар ретінде жіктедік (жазбаға шаққандағы орташа ± SEM болжамды ДА-бірліктері: 1,5 ± 0,18) (3A-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Біз 40 болжамды дофаминергиялық нейронды анықтадық, олардың белсенділігі әлеуметтік болжам қателіктері (nPE) контекстінде талданды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әрбір тіркелген болжамды ДА-нейрон үшін пациентке тән стереотаксикалық координаттар S6-кестеде келтірілген.&lt;/p&gt;\n&lt;p&gt;Барлық болжамды ДА-нейрондар үшін толқын ені мен орташа импульс жиілігі S7-кестеде көрсетілген. Әр қатысушы үшін тіркелген болжамды ДА-нейрондар саны S8-кестеде келтірілген. Барлық 40 болжамды ДА-бірлігі үшін толқын пішіндері және осы бірліктер үшін орташа толқын пішіні 3B-суретте бейнеленген. Әрбір бірлік үшін біз спайк тізбектерін үздіксіз импульс жиілігіне дейін тегістедік және популяциялық талдауларда бірліктер арасындағы импульс жиілігінің өзгермелілігін ескеру үшін осы жиіліктерді z-ұпаймен (z-score) қалыпқа келтірдік (S9-сурет). Содан кейін біз тапсырмадағы мінез-құлық тұрғысынан маңызды уақыт нүктесінде, атап айтқанда ұсыныстар ашылған (split reveal) сәтте болжамды ДА-бірліктерінің z-қалыпқа келтірілген импульс жиілігін зерттедік.&lt;/p&gt;\n&lt;p&gt;Біз болжамды ДА-нейрондарының белсенділігі nPE-нің белгілі бір атрибуттарын, олардың әлеуметтік емес оқыту сигналдарын көрсетудегі белгілі рөліне ұқсас түрде кодтай алады деп болжадық. Мұны тексеру үшін біз алдымен адам және компьютер жағдайларында оң және теріс nPE (сәйкесінше ішкі нормадан жоғары және төмен) тудыратын әрекеттер үшін split reveal-дан кейінгі 1000 мс ішінде болжамды ДА-бірліктерінің орташа импульс жиілігін салыстырдық. Абсолютті шикі үздіксіз импульс жиілігін (z-қалыпқа келтіруге дейін) 3C-D суреттерінен қараңыз. Split reveal-дан кейінгі 1000 мс ішіндегі орташа z-қалыпқа келтірілген импульс жиілігінің ықтималдық тығыздығы графиктерін 3E-F суреттерінен қараңыз. Біз адам жағдайында болжамды ДА-бірліктері оң nPE әрекеттерінде теріс nPE әрекеттеріне қарағанда спайк белсенділігін уақытша көбірек арттырғанын байқадық (3C-сурет; 3E-сурет). Бұл өсу компьютер жағдайында әлсіреді (3D-сурет; 3F-сурет). nPE валенттілігінің импульс жиілігіне әсерінің маңыздылығын тексеру және бұл бірліктер nPE шамасын да кодтай алатынын зерттеу үшін біз әр жағдайда бірлік үшін кездейсоқ әсері бар nPE валенттілігі (1 = теріс, 2 = оң), nPE шамасы және осы терминдер арасындағы өзара әрекеттесулер бойынша split reveal-дан кейінгі 1000 мс ішінде ДА-бірлігінің белсенділігін болжайтын аралас әсерлі модельді құрдық (3G-H суреттері; 2-кесте). Адам жағдайында nPE валенттілігі үшін тұрақты әсер импульс жиілігінің жалғыз маңызды болжаушысы болды (nPE валенттілігі, **p = 0,008, β ± SEM = 0,19 ± 7,3e-02, 95% CI [0,05, 0,34]; 3G-сурет; басқа бағалаулар үшін 2-кестені қараңыз).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;nPE (norm prediction error) — норма болжамының қателігі; нәтиженің қатысушы күткенінен қаншалықты ауытқитынын көрсетеді. Аралас әсерлі модельдер жалпы заңдылықтарды (тұрақты әсерлер) және жеке айырмашылықтарды (кездейсоқ әсерлер) ескеруге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу инвазивті микроэлектродтар көмегімен адамдарда жүргізілді; нейрондық белсенділік пен nPE валенттілігі арасындағы корреляция осы тәжірибе аясында тікелей себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жалпы алғанда, бұл нәтижелер SNr болжамды ДА-бірліктері nPE валенттілігін кодтайтынын көрсетеді, бұл ретте адам жағдайында кодтау айқынырақ байқалады, бұл SNr нейрондарының әлеуметтік ақпаратты қадағалауының бірегей нейрондық механизмін қамтамасыз етеді.&lt;/p&gt;\n&lt;p&gt;Адам немесе компьютер жағдайында split reveal-дан кейінгі мс ішінде SNr болжамды ДА-бірліктерінің топтық белсенділігін норма болжамы қателігінің (nPE) шамасы, nPE валенттілігі және олардың тиісті өзара әрекеттесу терминдері болжайтын аралас әсерлі модельдердің қысқаша мазмұны. **p &amp;lt; 0,01 аралас әсерлі модель бойынша. Std. Error = стандартты қателік. n = адам жағдайында 31 болжамды ДА-нейрон және компьютер жағдайында 16 болжамды ДА-нейрон.&lt;/p&gt;\n&lt;h4 id=\"gpi-degi-bolzhamdy-nejrondar-aeleumettik-bolzham-khateligining-valenttiligin-kodtamajdy\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#gpi-degi-bolzhamdy-nejrondar-aeleumettik-bolzham-khateligining-valenttiligin-kodtamajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GPi-дегі болжамды нейрондар әлеуметтік болжам қателігінің валенттілігін кодтамайды&lt;/span&gt;&lt;/a&gt;GPi-дегі болжамды нейрондар әлеуметтік болжам қателігінің валенттілігін кодтамайды&lt;/h4&gt;\n&lt;p&gt;SNr болжамды бірлік белсенділігінде байқалған nPE кодтау әсері базальды ганглий (BG) ядролары бойынша кең таралған белсенділікті көрсетеді. Бұл әсердің анатомиялық ерекшелігін зерттеу үшін біз басқа BG ядросы — GPi-де DBS операциясын өткізген нейрохирургия қатысушыларының басқа когортасында ұқсас тәжірибе өткіздік (5 ер адам, n = 3 PD және n = 2 дистония науқастары, жасы 53 ± 8,5 жыл; Рasm SN9A). Осы 5 қатысушыдан біз тек адам блогымен UG-ның 5 сессиясын және адам мен компьютер блоктары, сондай-ақ көңіл-күй рейтингтері бар UG сессияларын жинадық. Бұл топта бас тарту деңгейі ұсыныс көлемінің артуымен төмендеді, шарттар арасында айтарлықтай айырмашылықтар байқалмады (Рasm SN9B). Ұсыныс көлемі бойынша бинарлы таңдауларды болжайтын логистикалық регрессия моделі айтарлықтай әсерді анықтады (ұсыныс, ***p = 1,9e-14, β ± SEM = 1,3 ± 0,17), бұл төмен ұсыныстарға қарағанда жоғары ұсыныстарды қабылдау ықтималдығы жоғары екенін көрсетеді. SNr жазу тобымен салыстыруды жеңілдету үшін біз осы сессиялар үшін nPE-лерді SNr когортасынан алынған жеңімпаз модель, атап айтқанда белгіленген альфасы бар RW айнымалы бастапқы норма моделі көмегімен бағаладық.&lt;/p&gt;\n&lt;p&gt;Біз 7 жазу сессиясынан 19 болжамды бірлікті анықтадық (жазу бойынша орташа ± SEM кластерлері: 2,7 ± 0,29). Барлық 19 болжамды GPi нейрондары үшін толқын пішінінің ені мен орташа импульсация жиілігі Кесте SN10-да келтірілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;16 GPi нейронын талдау белсенділіктің nPE валенттілігімен немесе шамасымен байланысын анықтамады, бұл осы аймақта болжам қателігін кодтаудың жоқтығын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық 19 болжамды GPi бірліктері үшін толқын пішіндері және осы бірліктер үшін орташа толқын пішіні Рasm SN9C-де бейнеленген. Біз SNr бірлік талдауларында жүзеге асырылған хаттамаға сәйкес спайк тізбектерін үздіксіз импульсация жиілігіне тегістедік. Содан кейін біз GPi болжамды бірлік белсенділігін split reveal-ден кейінгі 1000 мс ішінде nPE валенттілігімен, nPE шамасымен және олардың өзара әрекеттесуімен аралас эффектілі регрессия көмегімен байланыстырдық, бұл адам шартында split reveal кезінде SNr болжамды DA бірлік белсенділігін болжау үшін қолданылған регрессиямен бірдей. Бұл модель компьютер шарты үшін құрылмады, өйткені тек екі ойыншы компьютер блогымен UG-ны аяқтады. Сондай-ақ, 19 болжамды бірліктің 16-сы барлық ұсыныстар қабылданған мінез-құлық сессиясында жазылғанын атап өткен жөн; сондықтан бұл сессияда мінез-құлықты модельдеу жүргізілмеді, нәтижесінде nPE валенттілігі, шамасы және олардың өзара әрекеттесуіне қатысты талдау үшін барлығы 16 болжамды GPi бірлігі қалды. Бұл регрессия осы айнымалылардың немесе олардың өзара әрекеттесуінің ешқайсысы үшін айтарлықтай әсерлерді анықтамады (Кесте 3).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; Ашылу кезінде ішкі боз шардың (GPi) барлық болжалды нейрондарының белсенділігін болжайтын аралас әсерлі модельдің жиынтығы.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тұрукты әсер&lt;/th&gt;\n&lt;th&gt;Бағалау&lt;/th&gt;\n&lt;th&gt;Стандартты қате&lt;/th&gt;\n&lt;th&gt;t-мәні&lt;/th&gt;\n&lt;th&gt;p-мәні&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Адам&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Intercept&lt;/td&gt;\n&lt;td&gt;0.09446&lt;/td&gt;\n&lt;td&gt;0.04858&lt;/td&gt;\n&lt;td&gt;1.944&lt;/td&gt;\n&lt;td&gt;0.0545&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude&lt;/td&gt;\n&lt;td&gt;-0.01331&lt;/td&gt;\n&lt;td&gt;0.01224&lt;/td&gt;\n&lt;td&gt;-1.087&lt;/td&gt;\n&lt;td&gt;0.2775&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE valence&lt;/td&gt;\n&lt;td&gt;0.17970&lt;/td&gt;\n&lt;td&gt;0.15304&lt;/td&gt;\n&lt;td&gt;1.174&lt;/td&gt;\n&lt;td&gt;0.2409&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude x nPE valence&lt;/td&gt;\n&lt;td&gt;-0.18235&lt;/td&gt;\n&lt;td&gt;0.09359&lt;/td&gt;\n&lt;td&gt;-1.948&lt;/td&gt;\n&lt;td&gt;0.0519&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Адам шартында split reveal-ден кейінгі 1000 мс ішінде барлық GPi бірліктерінің топтық белсенділігін болжайтын нормативтік болжам қателігі (nPE) шамасы, nPE валенттілігі және олардың тиісті өзара әрекеттесу мүшелері бойынша аралас эффектілі модельдің қысқаша мазмұны. Std. Error = стандартты қателік. n = 16 болжамды нейрон адам шартында.&lt;/p&gt;\n&lt;p&gt;GPi нейрондары мен SNr нейрондарының нәтижелерін салыстыруды жеңілдету үшін, популяциялар арасындағы толқын пішіні мен импульсация жиілігіндегі айырмашылықтар азырақ әсер етуі үшін, осы 16 GPi болжамды бірлігінің 8-і қайта талдау үшін таңдап алынды, мұнда импульсация жиілігі мен толқын пішінінің ұзындығы критерийлері SNr болжамды DA бірліктерінікіне сәйкестендірілді. Біз қайтадан GPi болжамды бірлік белсенділігін split reveal-ден кейінгі 1000 мс ішінде nPE валенттілігімен, nPE шамасымен және олардың өзара әрекеттесу мүшелерімен тек адам шартында аралас эффектілі регрессия арқылы байланыстырдық. Бұл регрессия осы айнымалылардың немесе олардың өзара әрекеттесуінің ешқайсысы үшін айтарлықтай әсерлерді анықтамады (Кесте 4). (Адам шартында nPE валенттілігі бойынша split reveal кезіндегі орташа импульсация жиілігін визуализациялау үшін Рasm SN6D-ны қараңыз.) Осы популяцияда статистикалық тұрғыдан айтарлықтай әсердің болмауы, әрине, осы аймақта жазылған бірліктердің шектеулі үлгі көлемімен байланысты болуы мүмкін. Осылайша, осы шектеуді ескере отырып, нәтижелеріміз SNr-дегі болжамды DA нейрондары үлгіміз nPE валенттілігін кодтауды көрсетсе де, бұл өрнек GPi-ден алынған болжамды бірліктер үлгімізде, тіпті толқын пішіні мен импульсация жиілігі критерийлері бойынша сәйкестендірілгенде де айтарлықтай деңгейде байқалмағанын болжайды.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 4.&lt;/strong&gt; Ашылу кезінде толқын пішіні мен импульс жиілігі сәйкестендірілген ішкі боз шардың (GPi) болжалды нейрондарының белсенділігін болжайтын аралас әсерлі модельдің жиынтығы.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тұрукты әсер&lt;/th&gt;\n&lt;th&gt;Бағалау&lt;/th&gt;\n&lt;th&gt;Стандартты қате&lt;/th&gt;\n&lt;th&gt;t-мәні&lt;/th&gt;\n&lt;th&gt;p-мәні&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Адам&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Intercept&lt;/td&gt;\n&lt;td&gt;0.088536&lt;/td&gt;\n&lt;td&gt;0.080590&lt;/td&gt;\n&lt;td&gt;1.099&lt;/td&gt;\n&lt;td&gt;0.2771&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude&lt;/td&gt;\n&lt;td&gt;-0.004832&lt;/td&gt;\n&lt;td&gt;0.020630&lt;/td&gt;\n&lt;td&gt;-0.234&lt;/td&gt;\n&lt;td&gt;0.8150&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE valence&lt;/td&gt;\n&lt;td&gt;0.478699&lt;/td&gt;\n&lt;td&gt;0.268627&lt;/td&gt;\n&lt;td&gt;1.782&lt;/td&gt;\n&lt;td&gt;0.0761&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude x nPE valence&lt;/td&gt;\n&lt;td&gt;-0.276125&lt;/td&gt;\n&lt;td&gt;0.164248&lt;/td&gt;\n&lt;td&gt;-1.681&lt;/td&gt;\n&lt;td&gt;0.0941&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Аралас эффектілі модельдің қысқаша мазмұны, мұнда nPE шамасы, nPE валенттілігі және олардың тиісті өзара әрекеттесу мүшелері адам шартында split reveal-ден кейінгі 1000 мс ішінде GPi бірліктерінің (толқын пішіні мен импульсация жиілігі критерийлері бойынша SNr болжамды DA бірлік тобына сәйкестендірілген) топтық белсенділігін болжады. Std. Error = стандартты қателік. n = 8 болжамды нейрон адам шартында.&lt;/p&gt;\n&lt;h4 id=\"snr-degi-bolzhamdy-da-nejrondary-koengil-kuej-signaldaryn-kodtamajdy\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#snr-degi-bolzhamdy-da-nejrondary-koengil-kuej-signaldaryn-kodtamajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SNr-дегі болжамды DA нейрондары көңіл-күй сигналдарын кодтамайды&lt;/span&gt;&lt;/a&gt;SNr-дегі болжамды DA нейрондары көңіл-күй сигналдарын кодтамайды&lt;/h4&gt;\n&lt;p&gt;Соңында, PE-лер бұрын сәттік көңіл-күйге әсер ететіні көрсетілгенін ескере отырып, біз SNr болжамды DA нейрондарының белсенділігі субъективті көңіл-күйді бақылайтынын тексердік. Біз көңіл-күй рейтингтеріне дейінгі 1000 мс ішінде болжамды DA бірліктерінің импульсация жиілігі z-баллданған көңіл-күй рейтингтерімен айтарлықтай корреляцияланбағанын байқадық (Пирсон өнім-момент корреляциясы, p = 0,16, r = -0,09, 95% CI -0,21 – 0,03) (Рasm SN10). Осы кезеңде DA бірлігі тобының белсенділігін көңіл-күй рейтингі бойынша болжайтын аралас эффектілі модель, бірлік үшін кездейсоқ эффектпен, көңіл-күй рейтингі үшін айтарлықтай әсерді анықтамады (көңіл-күй рейтингі, p = 0,16, β ± SEM = -0,027 ± 0,019), бұл корреляциялық тест нәтижелеріне сәйкес келеді. Бұл нәтижелер SNr болжамды DA нейрондары nPE валенттілігіне жауап берсе де, олар көңіл-күй рейтингтерін кодтамайтынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу клиникалық жағдайда адамдарда (PD және дистония науқастары) жүргізілді, бұл нәтижелерді сау адамдарға жалпылауды шектейді; нейрондардың шағын үлгі көлемі әсерлердің жоқтығын түсіндіруде сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Ағымдағы зерттеу адамның SNr бөлігіндегі жеке нейрондардың әлеуметтік оқыту және көңіл-күй сигналдарын қалай кодтайтынын зерттеді. Мінез-құлық тұрғысынан біз қатысушылардың нөлден өзгеше ұсыныстардан жиі бас тартқанын анықтадық, бұл UG-дағы бас тарту мінез-құлқы объективті пайдалылықпен емес, субъективті пайдалылықпен басқарылатынын көрсететін алдыңғы жұмыстармен сәйкес келеді; бұл субъективті пайдалылық ұсыныстың нақты бір адам үшін оның норма күтулері мен әділетсіз теңсіздікке деген жеке сезімталдығын ескере отырып, қаншалықты құнды екенін көрсетеді. Бұл мінез-құлық тіпті компьютерлік аватарлармен ойын кезінде де сақталды, бұл әлеуметтік емес контексттерде әлеуметтік ойлаудың белгілі бір дәрежеде бар екенін көрсетеді, бұл қатысушылардың таңдауын түсіндіруде әлеуметтік норма модельдерінің әлеуметтік емес марапатты оқытуға қарағанда басымдығымен расталады. Әлеуметтік норманы модельдеу көрсеткендей, қатысушылар компьютерлерге қарағанда адамдардан әділдікті көбірек күткен және nPE олардың сәттік көңіл-күйіне әсер еткен. Нейрондық деңгейде substantia nigra нейрондары тәжірибе жасалған nPE валенттілігін бақылап отырған, адам аватары шартында күштірек кодтау байқалған; бұл нейрондар сәттік көңіл-күйді кодтамаған. Жалпы алғанда, бұл нәтижелер substantia nigraning әлеуметтік оқыту сигналдарын кодтаудағы негізгі рөлін белгілейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу substantia nigra әлеуметтік оқыту сигналдарын кодтауда орталық рөл атқаратынын, ал әлеуметтік өзара іс-қимылда мінез-құлықты объективті емес, субъективті пайдалылық анықтайтынын растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біріншіден, біздің нәтижелеріміз есептеу модельдеуінің бақыланатын ұқсас мінез-құлықтардың қалай әртүрлі жасырын психикалық процестерден туындауы мүмкін екенін ашудағы пайдасын көрсетеді. Бас тарту деңгейлері адам және компьютер аватары шарттарында ұқсас болғанымен, біздің модель бұл таңдаулар бастапқы норма күтулері, әділетсіздікке сезімталдық, таңдаудың өзгермелілігі және нормаға бейімделу сияқты жасырын айнымалылар арқылы хабардар болғанын көрсетеді. Атап айтқанда, компьютерлік аватарлармен салыстырғанда адам аватарларымен ойын кезінде жоғарырақ бастапқы және сессия бойындағы ішкі нормалар байқалды, бұл таңдау мінез-құлқына әсер ететін әділдік күтулерінің шынымен де серіктестің жеке басына байланысты екенін көрсетеді. Нәтижесінде, параметрлерді қалпына келтіру және апостериорлық болжамды тексерулермен нығайтылған бұл модельдеу тәсілі тек шикі бас тарту деңгейлері негізінде айқын болмайтын таңдау мінез-құлқына әсер ететін мағыналы жасырын процестерді жарыққа шығарады.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар, нәтижелеріміз SNr нейрондарының әлеуметтік және әлеуметтік емес оқыту салаларында валенттілікті кодтаудағы маңызды рөлін атап көрсетеді. Алдыңғы жұмыстар SN-нің марапатты өңдеу және бекіту арқылы оқытудағы рөлдерін анықтады, бұл ретте DA белсенділігі әлеуметтік емес контексттерде қателікті болжауды кодтаумен байланысты. Нейрохирургиялық науқастарда жүргізілген осындай зерттеулердің бірі SN болжамды дофаминергиялық нейрондар популяциясы күтпеген ұтыстарға қарағанда ұтылыстарға жоғарырақ атылу жиілігін көрсететінін анықтады, бұл біздің зерттеуімізде байқалған әлеуметтік контексттерде nPE валенттілігін кодтауға ұқсас, атылу жиілігі мен шама арасында статистикалық тұрғыдан маңызды байланыс дәлелдерінсіз. Сонымен қатар, адам емес приматтарда орта ми DA нейрондары әлеуметтік емес контексттерде оң қателік сигналдарына арнайы жауап беретіні байқалған. Біздің нәтижелеріміз бұл жұмысты кеңейтіп, ояу адамдарда осы марапатпен байланысты жеке SNr нейрондары адам аватарларымен ойын кезінде оң және теріс nPE-лерге жауап ретінде күшейген белсенділікті көрсететінін растайды, бұл осы болжамды DA бірліктері дәл әлеуметтік салада болжау қателігі валенттілігін кодтайтынын көрсетеді. Болжамды DA SNr нейрондарының атылу жиілігінде байқалған валенттілік кодтауы, ықтимал, көтерілетін аксоналды проекциялар арқылы стриатумдағы DA концентрациясына әсер етеді. Бұл белсенділік, сондай-ақ адам вольтамперометриясы көмегімен адам және компьютер аватарларымен өзара іс-қимыл кезінде SNr-да жоғары DA концентрациясын анықтаған жақында өткізілген алдыңғы жұмыстармен сәйкес, DA-ның жергілікті дендриттік бөлінуі арқылы нигралды белсенділікке әсер етуі мүмкін. Сонымен қатар, біздің зерттеуімізде тіркелген болжамды дофаминергиялық SNr нейрондары дәл nPE валенттілігіне жауап берсе де, біздің нәтижелеріміз басқа нейрондар шаманы кодтауы мүмкін екенін жоққа шығармайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;nPE (norm prediction error) — бұл күтілетін және нақты әлеуметтік нормаларды сақтау арасындағы сәйкессіздік сигналы, оны ми күтулерді түзету үшін пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Болжау қателерін көңіл-күймен байланыстыратын алдыңғы жұмыстармен сәйкес, біздің нәтижелеріміз nPE сәттік көңіл-күй күйлеріне әсер етсе және осы nPE-лердің валенттілігі SNr нейрондық белсенділігінде кодталса да, көңіл-күйдегі өзгерістер адам миының басқа жерлеріндегі нейрондық белсенділікте көрініс табатынын көрсетеді. Нәтижелеріміз SN-нің құрылымдық және функционалдық аномалияларын эмоционалдық бұзылулармен және симптомдармен, сондай-ақ интракраниалды сигналдарды әлеуметтік бағалау сигналдарымен байланыстыратын жақында өткізілген адам зерттеулерін кеңейтіп, эмоционалдық тұрғыдан мазалайтын әлеуметтік өзара іс-қимылдар кезінде ояу адамдарда тікелей тіркелген жеке SNr нейрондарынан алынған дәлелдерді ұсынады. Осылайша, біз осы нейрондардың әлеуметтік контексттерде оқыту сигналдарын көңіл-күймен байланыстырудағы рөлін белгілеп, SN әдебиетіне үлес қосамыз.&lt;/p&gt;\n&lt;p&gt;Атап айтқанда, талдауларымыз GPi, яғни базальды ганглиялардың көршілес ядросы тарапынан nPE сигналдарын елеулі нейрондық бақылауды анықтамады. Бұл нәтиже осы аймақта марапатқа қатысты жеке бірліктердің өте сирек жауап беретінін көрсететін жұмыстармен сәйкес келеді.&lt;/p&gt;\n&lt;p&gt;Біздің нәтижелерімізді келесі шектеулерді ескере отырып түсіндіру қажет. Зерттеу қатысушылары негізінен ер адамдар және егде жастағылар, бұл Паркинсон ауруы (ПА) бойынша терең ми стимуляциясына (DBS) ұшырау ықтималдығы жоғары пациенттерге тән. Демек, біздің зерттеуіміз әлеуметтік нормаларды өңдеудегі жынысқа немесе жасқа байланысты айырмашылықтарды ескермеуі мүмкін. Сондай-ақ бұл қатысушылардың барлығында ПА бар, ол мінез-құлықтың ригидтілігімен, психикалық икемсіздігімен және стратегиялар тиімсіз болған кезде когнитивтік стратегияларды ауыстыру қабілетінің төмендеуімен сипатталады. ПА патологиясы біз нысанаға алған ми аймақтарына қосымша әсер етіп, дофаминерgik кірістің төмендеуіне байланысты SNr және GPi нейрондарында гиперактивтілікті тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шектеулер: зерттеу тек дәрі қабылдамаған егде жастағы Паркинсон ауруы бар ер адамдарда жүргізілгендіктен, қорытындыларды сау адамдарға таратуға болмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл пациенттер біздің зерттеуімізге дофаминерgik препараттарды қабылдамаған («off») күйде қатысады, бұл оқу мен шешім қабылдауды өзгерте алатын препараттардың әсерінсіз, сақталған болжамды дофаминерgik SN нейрондарының әлеуметтік нормаларды меңгерудегі рөлін зерттеуді жеңілдетеді; алайда бұл пациенттердегі дофаминерgik сигнал беру бастапқыда дофамині сарқылған күйде жүреді, яғни бұл зерттеудің нәтижелері жаңа болғанымен, сау адамдардың дофаминерgik тізбектеріне жалпыланбауы мүмкін. ПА патологиясы туындатқан мінез-құлық пен нейрондық өзгерістер біздің зерттеу нәтижелерімізге қалай әсер ететінін жақсырақ анықтау үшін ПА бар және жоқ адамдардан алынған мінез-құлық және нейрондық деректерді салыстыру ең қолайлы болар еді. Мінез-құлық нәтижелерін «Ультиматум» ойынын (UG) пайдаланатын басқа зерттеулердің қатысушыларынан алынған деректермен салыстыруға болатынымен, жеке нейрондардың нейрондық деректері мұндай жазбалардың тым инвазивті сипатына байланысты салыстыру үшін оңай қолжетімді емес. Осыған ұқсас себептер бойынша бұл зерттеу қатысушылардың іріктеу көлемі бойынша шектеулі. Сонымен қатар, қатысушылардың осы шектеулі іріктемесінен барлық қолжетімді тиісті деректерді пайдалану мақсатында бұл зерттеу тапсырманың адам және компьютер жағдайларында да, тек адам жағдайында ғана ойнағандардың деректерін қамтиды, бұл жағдайдың әсерінде теңгерімсіздікті тудырады. Зерттеу сонымен қатар SN-де тіркелген жеке нейрон белсенділігі стриатумдағы дофамин деңгейіне қалай аударылатынын нақты анықтау қабілетінде шектеулі; мұндай шекараны SN жеке бірлігін тіркеу және стриатумда бір мезгілде вольтамперометриялық тіркеу арқылы мүмкін етуге болар еді. Соңында, бұл зерттеу әлеуметтік нормаларды өңдеуде бұл нейрондардың себептік рөлін көрсетпейді; стимуляцияны немесе басқа пертурбация әдістерін қолданатын болашақ жұмыстар себеп-салдар байланысын тікелей шеше алады.&lt;/p&gt;\n&lt;p&gt;Жиынтықтай келгенде, біздің жұмысымыз адамның әлеуметтік болжамдардағы қателерді тану қабілеті үшін нейрондық негізді ұсынады, бұл SN-нің классикалық түрде зерттелген марапатты үйренуде ғана емес, сонымен қатар нормативтік әлеуметтік мінез-құлықты үйренуде де рөлін қолдайды.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"etika-zhaene-khatysushylar\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#etika-zhaene-khatysushylar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Этика және қатысушылар&lt;/span&gt;&lt;/a&gt;Этика және қатысушылар&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеу Маунт-Синайдағы Икан медициналық мектебінің Институционалдық шолу кеңесімен мақұлданды. Зерттеу нәтижесінде ешқандай жағымсыз оқиғалар орын алған жоқ. Зерттеуге 24 нейрохирургиялық пациент (21 ер адам, 3 әйел, орташа жасы ± SEM = 62 ± 2,4 жас; S1 кестесі) қатысты. Миды терең стимуляциялау (DBS) операциясына келісім бергеннен кейін, біздің жетекші нейрохирургымыз зерттеуге қатысуға жарамды деп тапқан пациенттерге осы зерттеуге қатысу туралы ақпарат алу мүмкіндігі берілді. Қызығушылық танытқан жағдайда, пациенттерге зерттеу, оның процедураға әсері және кез келген ықтимал тәуекелдер туралы ақпарат берілді.&lt;/p&gt;\n&lt;p&gt;Оларға сонымен қатар мінез-құлық тапсырмасы туралы қысқаша кіріспе, соның ішінде нұсқаулар мен екі сынақ мысалы ұсынылды. Пациенттерге қатысқандары үшін ақшалай сыйақы алмайтындары хабарланды. Оның орнына оларға $20-ны адам немесе компьютерлік аватар серіктестерімен итеративті түрде бөлісуді елестету тапсырылды. Барлық ақпарат жазбаша келісім алынғанға дейін сұрақтар мен түсініктемелерге жеткілікті уақыт бөліне отырып, ауызша және жазбаша түрде ұсынылды.&lt;/p&gt;\n&lt;h4 id=\"dbs-operaciyasy-zhaene-birlik-zhazbasy\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#dbs-operaciyasy-zhaene-birlik-zhazbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;DBS операциясы және бірлік жазбасы&lt;/span&gt;&lt;/a&gt;DBS операциясы және бірлік жазбасы&lt;/h4&gt;\n&lt;p&gt;DBS құрылғысын имплантациялау үш операция барысында жүзеге асырылды, оның ішінде сол жақ жарты шар электродын имплантациялау, оң жақ жарты шар электродын имплантациялау және батареяны имплантациялау. Бұл операциялар шамамен 2-4 апта аралықпен өткізілді. Қатысушыларға электрод имплантациясы операцияларының бірінде немесе екеуінде де зерттеуге қатысу мүмкіндігі берілді. Операция кезінде қатысушылар стандартты клиникалық хаттамаға сәйкес кемінде 9 сағат бойы дәрі-дәрмек қабылдамаған болатын.&lt;/p&gt;\n&lt;p&gt;DBS операциясында пациенттер клиникалық электродты нысанаға алу және сынау үшін оятылғанда (бұл әдетте электрод имплантациясынан шамамен 10 минут өткен соң орын алған), клиникалық процедура бірлік жазбасы мен тапсырманы орындау үшін қысқа мерзімге тоқтатылды. Біздің жетекші нейрохирургымыз вольфрам микроэлектродын қуатпен жұмыс істейтін микродрайв және трактография көмегімен жазып алу нысанына орналастырды. Микроэлектродты нейрондық белсенділіктің бірегей белгілерімен анықталған нысаналы аймақтарға орналастырғаннан кейін, нейрохирург тұрақты спайк белсенділігінің бар екенін растағанша электрод күйін өзгертті. Нейрондық деректер Alpha Omega электрофизиологиялық жазу жүйесі арқылы жазылды. Субталамикалық ядрода DBS операциясын өткізіп жатқан пациенттер үшін бірлік жазбалары substantia nigra pars reticulata (SNr; 1A-сурет) аймағынан жиналды. Globus pallidus internus (GPi)-да DBS операциясын өткізіп жатқан пациенттер үшін бірлік жазбалары GPi-ден де жиналды (S9A-сурет). Жазбалар жиналғаннан кейін клиникалық стимулятор сынау және түпкілікті имплантация үшін клиникалық нысаналы аймаққа қайта орналастырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бірлік жазбасы (single-unit recording) — бұл жеке нейрондардың электрлік белсенділігін микроэлектродтар арқылы тіркеу әдісі, ол ми жасушаларының жұмысын түсінуге көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SNr когортасы Паркинсон ауруымен ауыратын 19 қатысушыны (16 ер адам, 3 әйел, жасы 65 ± 1,93 жас) қамтиды. GPi когортасы Паркинсон ауруы немесе дистониямен ауыратын 5 қатысушыны (5 ер адам, 0 әйел, жасы 53 ± 8,5 жас) қамтиды. Бірлік жазбасы кезінде қатысушылар көру аймағында орналасқан компьютер мониторында визуализацияланған мінез-құлық тапсырмасын орындады. Қатысушылар өз жауаптарын ойын контроллері арқылы жіберді. Барлығы біз SNr когортасынан 27 сессия және GPi когортасынан 7 сессия жинадық.&lt;/p&gt;\n&lt;h4 id=\"ultimatum-ojyny\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#ultimatum-ojyny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ультиматум ойыны&lt;/span&gt;&lt;/a&gt;Ультиматум ойыны&lt;/h4&gt;\n&lt;p&gt;Әрбір бірлік жазбасы сессиясында қатысушылар әлеуметтік әділдік нормалары мен нормаға бейімделуді бағалау үшін қолданылатын Ультиматум ойынын (UG) ойнады (1B-сурет). Қатысушылар UG-ның екі нұсқасының бірін ойнады: тек адам (n = 15 сессия, SNr когортасынан 10 пациент; n = 5 сессия, GPi когортасынан 3 пациент) және адам мен компьютер шарттары бар толық нұсқа (n = 12 сессия, SNr когортасынан 9 пациент; n = 2 сессия, GPi когортасынан 2 пациент).&lt;/p&gt;\n&lt;p&gt;Тек адам нұсқасында қатысушыларға «адам» аватар серіктестері тарапынан $20-ны бөлісу бойынша ұсыныстар қайта-қайта ұсынылады, олар оны қабылдай немесе қабылдамауы мүмкін еді. Егер қатысушы қабылдаса, әр тарап ұсынылған соманы алады. Егер қатысушы қабылдамаса, әр тарап 0 алады. Әрбір сынақтың басында қатысушыларға алдымен аватар көрсетіледі (1,5-2,5 с). Содан кейін қатысушыларға 20-ны бөлісу ұсынысы беріледі («бөлісуді ашу»; 1 с). Таңдау түймелері (қабылдау/қабылдамау) ұсынылған бөлісудің астында пайда болады және қатысушыларды таңдау жасауға итермелейді (өз қарқынымен). Таңдау жасалғаннан кейін, таңдалған нұсқа экран әр тарап алған доллар сомасын көрсету үшін өзгермейінше 1 секунд бойы бөлінген күйде қалады («бөлісу нәтижесі»; 1,5 с). Барлық ұсыныстар 9 немесе одан аз болды және ұсыныстар 1-ден $9-ға дейінгі қалыпты үлестіріммен псевдо-кездейсоқ түрде жүзеге асырылды. Таңдаулар болашақ ұсыныстарға әсер етпеді. Ойыншылар ұсыныс құрылымынан алдын ала хабардар болмады. Әрбір сынақта жаңа адам аватары арқылы жаңа ұсыныс енгізілді. Адам аватарлары нәсілдік және мәдени әртүрлілікті көрсету үшін есімі, жынысы және физикалық ерекшеліктерімен ерекшеленді. Пациенттер 30 сынақты аяқтады, бұл шамамен 5 минутқа созылды.&lt;/p&gt;\n&lt;p&gt;Адам және компьютер шарттары бар толық нұсқада қатысушылар адам аватар серіктестерімен 30 UG сынағын, сондай-ақ «компьютер» серіктестерімен қосымша 30 сынақ блогын ойнады. Блок реті теңгерімді болды, сондықтан 5 қатысушы адам блогын компьютер блогынан бұрын, ал 7 қатысушы компьютер блогын адам блогынан бұрын ойнады. Сонымен қатар, қатысушылар таңдау сынақтарының кездейсоқ 33%-ынан кейін өз-өзін бағалау көңіл-күйін (өз қарқынымен) толтырды. Бұл көңіл-күйді бағалауды аяқтау үшін қатысушылар өздерінің қазіргі көңіл-күйін бақытсыз беттен (0 деп кодталған) бақытты бетке дейін (100 деп кодталған) шкалада таңдады. Экранда ұсынудың екі кішігірім бөлшегі UG-дағыдан сәл өзгеше болды: бөлісуді ашу таңдау түймелерімен бір уақытта пайда болды және бөлісу нәтижесі 1,5 с орнына 1 с созылды. Жалпы алғанда, UG-ның бұл нұсқасы шамамен 10 минутқа созылды.&lt;/p&gt;\n&lt;h4 id=\"shygharyp-tastau-kriterijleri\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#shygharyp-tastau-kriterijleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шығарып тастау критерийлері&lt;/span&gt;&lt;/a&gt;Шығарып тастау критерийлері&lt;/h4&gt;\n&lt;p&gt;Деректер сапасын зейінсіздік немесе ұйқышылдық салдарынан болатын қателіктерден қорғау үшін, тапсырма нұсқаулары орындалмаған барлық сессиялар мінез-құлықты талдаудан шығарылды. Бұған «жазық» мінез-құлық көрсетілген сессиялар жатады, яғни адам немесе компьютер блогы кезінде 2-ден аз ұсыныс қабылданған немесе қабылданбаған сессиялар. Бұл шара қатысушылар барлық ұсыныстарды қабылдаған сессияларды тиімді түрде алып тастады, бұл модельді сәйкестендіру үшін қажетті таңдау өзгермелілігін қамтамасыз етеді. Сондай-ақ, бинарлық таңдаудың ұсыныс көлеміне тәуелділігі бойынша логистикалық сәйкестендіру оң емес еңіс коэффициентіне ие болған сессиялар шығарылды, бұл ұсыныс көлемі артқан сайын оны қабылдау ықтималдығы артпайтынын білдіреді. Егер көңіл-күй рейтингтері «жазық» болса, олар талдаудан шығарылды, бірақ мінез-құлық таңдауы бойынша деректер талдауда қалдырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Жазық» мінез-құлық немесе рейтингтер қатысушы жауаптарында өзгермеліліктің жоқтығын білдіреді, бұл шешім қабылдау процесін математикалық модельдеуді мүмкін етпейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Жазық» көңіл-күй рейтингтері бар мінез-құлық сессиялары — бұл ең төменгі және ең жоғарғы рейтингтер арасындағы айырмашылық 10 баллдан кем болатын сессиялар. SNr когортасында 3 UG және 3 UG-bot сессиясы «жазық» таңдау себебінен мінез-құлықты талдаудан шығарылды. Қосымша 2 UG-bot сессиясы «жазық» рейтингтер себебінен көңіл-күй рейтингтерін талдаудан шығарылды.&lt;/p&gt;\n&lt;p&gt;GPi когортасында 1 UG сессиясы «жазық» таңдау себебінен мінез-құлықты талдаудан, ал 1 UG-bot сессиясы көңіл-күй рейтингтерін талдаудан шығарылды.&lt;/p&gt;\n&lt;h4 id=\"minez-khulykhty-esepteu-arkhyly-modeldeu\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#minez-khulykhty-esepteu-arkhyly-modeldeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлықты есептеу арқылы модельдеу&lt;/span&gt;&lt;/a&gt;Мінез-құлықты есептеу арқылы модельдеу&lt;/h4&gt;\n&lt;p&gt;Барлық деректерді тазарту, мінез-құлықты талдау және есептеу модельдері MATLAB және RStudio бағдарламаларында жүзеге асырылды. Модельсіз талдаулар мыналарды қамтыды: блок түрі (адам/компьютер) бойынша жалпы бас тарту деңгейі, ұсыныс көлеміне қатысты бас тарту деңгейі, блок түрі бойынша жалпы реакция уақыты, блок түрі бойынша жалпы көңіл-күй рейтингі және таңдауға қатысты көңіл-күй рейтингі (қабылдау/бас тарту).&lt;/p&gt;\n&lt;p&gt;Әрі қарай, пайдалылықты, шешім қабылдау ықтималдығын және нормалардың бейімделуін модельдеу үшін бұрын қолданылған модельдер таңдау деректеріне сәйкестендірілді. Біріншіден, біз әрбір әрекеттегі алмасудың пайдалылығын теңсіздікке қарсылық көрсету пайдалылығы үшін Fehr-Schmidt (FS) теңдеуін қолдана отырып көрсеттік: &lt;span class=\"yfm-latex\" data-content=\"U_i(s_i)%20%3D%20s_i%20-%20%5Calpha%20%5Ccdot%20%5Cmax%5C%7Bf_i%20-%20s_i%2C%200%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Мұнда ұсыныстың (s_i) пайдалылығы (U_i) s_i мен қатысушының ішкі нормасы (f_i) және s_i арасындағы айырмашылық пен қатысушының қолайсыз теңсіздікке сезімталдығы (&lt;span class=\"yfm-latex\" data-content=\"%5Calpha%20%5Cin%20%5B0%2C1%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, «альфа») көбейтіндісінің айырмашылығына тең. Альфа қатысушының сол әрекетте ішкі нормадан төмен ұсынысты қабылдағысы келмейтінін көрсетеді. α-ның жоғары мәндері әділетсіздікке деген жеккөрінішті білдіреді. Қолайлы теңсіздікке сезімталдық («кінә») бұл парадигмада қажет емес, өйткені барлық ұсыныстар $9 немесе одан аз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fehr-Schmidt (FS) моделі — бұл мінез-құлық экономикасында адамның әділетсіз бөліністен аулақ болу үшін жеке пайдасынан бас тартуға дайындығын сандық бағалайтын математикалық тәсіл.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Содан кейін біз softmax функциясын қолдана отырып, әрбір ұсынысты қабылдау ықтималдығын модельдедік: &lt;span class=\"yfm-latex\" data-content=\"p_i(s_i)%20%3D%20%5Cfrac%7Be%5E%7B%5Cbeta%20U_i(s_i)%7D%7D%7B1%20%2B%20e%5E%7B%5Cbeta%20U_i(s_i)%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Бұл функция әрбір ұсыныстың пайдалылығын және қатысушының таңдауларының өзгермелілігін көрсететін кері температура (&lt;span class=\"yfm-latex\" data-content=\"%5Cbeta%20%5Cin%20%5B0%2C1%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) параметрін ескереді. β-ның төмен мәндері неғұрлым өзгермелі таңдауларды білдіреді.&lt;/p&gt;\n&lt;p&gt;FS модельдерінде норма статикалық, өзгермейтін метрика болып саналады. Ішкі норманың бейімделуін модельдеу үшін біз осы когортаның мінез-құлқына ең жақсы сәйкес келетін нормаға бейімделу модельдерінің екі класын салыстырдық: уақытша айырмашылықты оқытудан туындайтын Rescorla-Wagner (RW) модельдері және Байес бақылаушы модельдері. Нормаға бейімделу модельдерінің екі класы да ішкі норма уақыт өте келе дамиды деп болжайды; алайда олар норманы жаңарту ережелерінде ерекшеленеді.&lt;/p&gt;\n&lt;p&gt;RW модельдері — бұл агент белгісіз ортада сыйақыны барынша арттыратын әрекеттерді жасауды үйренетін нығайтуға негізделген тәсіл. RW модельдерінде норма келесідей жаңартылады: &lt;span class=\"yfm-latex\" data-content=\"f_i%20%3D%20f_%7Bi-1%7D%20%2B%20%5Cvarepsilon(s_i%20-%20f_%7Bi-1%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Мұнда i әрекетіндегі ішкі норма (f_i) алдыңғы әрекеттегі нормаға (fi-1) және нормаға бейімделу жылдамдығы (&lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%5Cin%20%5B0%2C1%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) мен ұсыныс (s_i) және алдыңғы әрекеттегі ішкі норма (fi-1) арасындағы айырмашылықтың (немесе nPE) көбейтіндісінің қосындысына тең. &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ұсыныстың (s_i) дамып келе жатқан ішкі нормаға (f_i) әсер ету дәрежесін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Екінші жағынан, Байес модельдері бақыланатын деректер негізінде модель параметрлері бойынша ықтималдық таралуын бағалайтын статистикалық тәсілден туындайды. Біз әрбір қатысушы ұсыныстарды белгісіз орташа және дисперсиямен сипатталатын қалыпты таралудан туындайды деп модельдейді деп болжаймыз. Қатысушыда орташа (µ) және дисперсия (σ²) бойынша бастапқы априорлық таралу бар және бұл априорлық таралу әрбір жаңа ұсыныспен жаңартылады. µ және σ²-ні ескере отырып, ұсыныстар (X) келесідей анықталады: X / µ, σ² ~ N(µ, σ²). Бірінші ұсынысты (s_i) алғаннан кейін және p(µ, σ²) априорлық таралуды ескере отырып, апостериорлық таралу келесідей анықталады: p(µ, σ² / s_i) = p(s_i / µ, σ²)p(µ, σ²).&lt;/p&gt;\n&lt;p&gt;Конъюгацияланған априорлық таралу келесідей анықталады: p(µ, σ²) = P₁(µ / σ²)P₂(σ²), p₁(µ / σ²) = NormalDensity(µ / µ₀, σ² k₀), p₂ = Inv-X²(σ² v₀). Әрі қарай, барлық кейінгі ұсыныстардан кейін, апостериорлық таралулар итеративті түрде келесідей анықталады: &lt;span class=\"yfm-latex\" data-content=\"k_%7Bi%2B1%7D%20%3D%20k_i%20%2B%201%2C%20%5Cnu_%7Bi%2B1%7D%20%3D%20%5Cnu_i%20%2B%201\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"%5Cmu_%7Bi%2B1%7D%20%3D%20%5Cmu_i%20%2B%20%5Cfrac%7B1%7D%7Bk_%7Bi%2B1%7D%7D(s_i%20-%20%5Cmu_i)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"%5Cnu_%7Bi%2B1%7D%5Csigma_%7Bi%2B1%7D%5E2%20%3D%20%5Cnu_i%5Csigma_i%5E2%20%2B%20%5Cfrac%7Bk_i%7D%7Bk_%7Bi%2B1%7D%7D(s_i%20-%20%5Cmu_i)%5E2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Ақырында, i + 1 әрекетінде жаңартылған ішкі норма келесідей анықталады: &lt;span class=\"yfm-latex\" data-content=\"E_i%5BX%5D%20%3D%20%5Cint%20x%20p(x%20%2F%20%5Cmu%2C%20%5Csigma%5E2)p_1(%5Cmu%20%2F%20%5Csigma%5E2%2C%20%5Cmu_i%2C%20k_i)p_2(%5Csigma%5E2%20%2F%20%5Cnu_i)%20%3D%20%5Cmu_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;p&gt;Әрбір модель класы ішінде жеке модельдер бастапқы ішкі норма туралы болжамдарымен ерекшеленді; модельдер не 10-ға тең болатын қатаң бастапқы норма күтімін ($20-ның тең бөлінуіне сәйкес келеді; «fixed f0» деп белгіленген) немесе әрбір субъектінің мінез-құлқына жеке сәйкестендірілген өзгермелі бастапқы норма күтімін («variable f0» деп белгіленген) болжады. Өзгермелі бастапқы норма модельдері, сондай-ақ, альфа әрбір субъектінің мінез-құлқына жеке сәйкестендірілген бе немесе пациенттер үлгісі бойынша топтың орташа альфасы деңгейінде қатаң белгіленген бе («fixed alpha» деп белгіленген) деген тұрғыдан да ерекшеленді.&lt;/p&gt;\n&lt;p&gt;Барлық модельдер әрбір субъектінің мінез-құлық сессияларына (адам және компьютер блоктары бөлек қарастырылған) сәйкестендірілді жән
