е топ бойынша ең аз жалпы Байес ақпараттық критерийі (BIC) балымен анықталған ең жақсы сәйкестік үшін салыстырылды. Жалпы BIC — бұл әрбір модель үшін әрбір субъектінің BIC балдарының топ деңгейіндегі қосындысы. FS: fixed alpha моделі жеңіске жетті, одан кейін RW: fixed alpha моделі келді (2D-сурет).&lt;/p&gt;\n&lt;p&gt;Әрі қарай, мінез-құлық классикалық RPE арқылы басқарыла ма, жоқ па, соны бағалау үшін біз барлық 9 модельді Q-оқыту тәсілімен салыстырдық. Q-оқыту алгоритмі осы орта динамикасының ешқандай алдыңғы моделі жоқ ортада оңтайлы әрекет-құндылық функциясын үйренеді. Бұл алынған сыйақы және келесі күйдің бағаланған құндылығы негізінде белгілі бір күйде әрекет ету құндылығының бағалары болып табылатын Q-құндылықтарды жаңарту арқылы жүзеге асырылады. Бұл әдіс Q-құндылықтарды RPE басқаратын тәсілмен кезең-кезеңімен реттейді. RPE-бағытталған жаңартулар сыйақы алынғаннан кейін және келесі ұсыныс ұсынылғанға дейін 0 мен 1 арасындағы оқыту жылдамдығында жүзеге асырылады. Бастапқы Q-құндылықтар келесідей: &lt;span class=\"yfm-latex\" data-content=\"Q(s_i%2C%20%5Ctext%7Baccept%7D)%20%3D%20s_i%20%5Ccdot%201%20-%20%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"Q(s_i%2C%20%5Ctext%7Breject%7D)%20%3D%20s_i%20%5Ccdot%201%20-%20%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Бұл Q-құндылықтар s_i ұсынысы қабылданған немесе бас тартылған күй-әрекет жұбының бастапқы құндылығын береді. Эта (&lt;span class=\"yfm-latex\" data-content=\"%5Ceta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) уақытша жеңілдік факторын білдіреді, бұл болашақ сыйақылардың ағымдағы құндылыққа қаншалықты әсер ететінін анықтайды; мұнда &lt;span class=\"yfm-latex\" data-content=\"%5Ceta%20%3D%200.8\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Әрі қарай, i &amp;gt; 1 әрекеті үшін, i-1 әрекетіндегі алдыңғы таңдауға (яғни қабылдау немесе бас тарту) негізделе отырып, ұсыныс қабылданған жағдайда Q-оқытуды жаңарту ережесі келесідей: &lt;span class=\"yfm-latex\" data-content=\"Q(s_%7Bi-1%7D%2C%20%5Ctext%7Baccept%7D)%20%3D%20Q(s_%7Bi-1%7D%2C%20%5Ctext%7Baccept%7D)%20%2B%20%5Calpha(U_i(s_i)%20%2B%20%5Ceta%20%5Ccdot%20%5Cmax%20Q(s_i%2C%20a)%20-%20Q(s_%7Bi-1%7D%2C%20%5Ctext%7Baccept%7D))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Мұнда альфа (α) — бұл қате болжамы ескі Q-құндылықты қаншалықты жаңартатынын анықтайтын оқыту жылдамдығы. α 0 мен 1 арасында; 0 жаңартудың жоқтығын (яғни оқытудың жоқтығын), 1 толық жаңартуды (яғни толық оқытуды) көрсетеді.&lt;/p&gt;\n&lt;p&gt;Баламалы түрде, ұсыныс қабылданбаған жағдайда Q-learning жаңарту ережесі келесідей: &lt;span class=\"yfm-latex\" data-content=\"Q(s_%7Bi-1%7D%2C%20reject)%20%3D%20Q(s_%7Bi-1%7D%2C%20reject)%20%2B%20%5Calpha(0%20%2B%20%5Ceta%20%5Ccdot%20%5Cmax%20Q(s_i%2C%20a)%20-%20Q(s_%7Bi-1%7D%2C%20reject))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;p&gt;Мәндер айырмашылығы: V_i = Q(s_i, accept) - Q(s_i, reject).&lt;/p&gt;\n&lt;p&gt;Ақырында, ұсынысты қабылдау ықтималдығы былайша модельденеді: &lt;span class=\"yfm-latex\" data-content=\"p_i(s_i)%20%3D%20%5Cfrac%7Be%5E%7B%5Cbeta%20V_i%7D%7D%7B1%20%2B%20e%5E%7B%5Cbeta%20V_i%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Осылайша, nPE жеке тұлғаның модельге негізделген әділдік нормасынан қаншалықты жоғары немесе төмен екенін сипаттаса, RPE, керісінше, алынған нәтиже мен алдыңғы оқиғаларға негізделген күту арасындағы айырмашылықты білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Q-learning — бұл агент күтілетін сыйақыны максималдау үшін әрекеттерді таңдауды үйренетін нығайтушы оқыту әдісі, ол болжанған және нақты нәтиже арасындағы айырмашылық негізінде Q-мәндерін жаңартады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз барлық 9 модельдің BIC ұпайларын Q-learning тәсілінің BIC ұпайымен салыстырдық және FS: fixed α моделі тағы да ең жақсы сәйкестікті көрсеткенін, одан кейін RW: fixed α моделі келетінін анықтадық, бұл ретте Q-learning тәсілі қалған 9 модельден нашар нәтиже берді (Сурет S2A). Бұл нәтижелер адам және компьютер жағдайларында дәйекті болды (Сурет S2B-C), бұл біздің тапсырмамыздағы мінез-құлық классикалық Q-learning емес, FS: fixed α моделіндегідей статикалық әлеуметтік артықшылықтар немесе RW: fixed α моделіндегідей nPE арқылы уақыт өте келе нормативтік күтулерге жаңа ақпаратты модельге негізделген енгізумен байланысты екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Кейіннен, ең жақсы сәйкес келетін екі модельдің әрқайсысы үшін дәлелдердің күшін бағалауды жеңілдету үшін біз ΔBIC, күтілетін модель жиілігі және қорғалған асып кету ықтималдықтарын бағаладық (Кесте S3). Бұл талдаулар FS: fixed α моделі 0,435 күтілетін модель жиілігімен және 0,932 қорғалған асып кету ықтималдығымен ең төмен BIC-ке ие екенін көрсетті. RW: fixed α моделі 13,707 ΔBIC, 0,174 күтілетін модель жиілігі және 0,043 қорғалған асып кету ықтималдығына ие болды. Бұл халықтың 43,5%-ы FS: fixed alpha моделімен, ал 17,4%-ы RW: fixed alpha моделімен ең жақсы сипатталады дегенді білдіреді. Осылайша, FS: fixed α моделін қолдайтын дәлелдер көбірек болғанымен, екі үміткер модель арасындағы ең жақсы сәйкестікте де белгілі бір гетерогенділік бар, бұл FS: fixed α және RW: fixed α модельдері үшін орташа BIC ұпайлары сәйкесінше 10,45 және 10,93 болғандығымен сәйкес келеді.&lt;/p&gt;\n&lt;p&gt;Содан кейін біз модельді қалпына келтіру арқылы әр модельдің қаншалықты анықталуы мүмкін екенін зерттеу арқылы осы екі модельді бағалауды жалғастырдық (Сурет S3; Кесте S4). Біріншіден, біз 10 модельдің әр параметрі үшін эмпирикалық орташа және стандартты ауытқуды есептедік, әр модель ішіндегі әр параметр үшін осы бағалауларға орталықтандырылған қалыпты үлестірімдерді құрдық және параметрді қалпына келтіруде қолданылған параметр таңдау процедурасы арқылы осы үлестірімдерден жаңа параметр мәндерін алдық. Әр генерациялаушы модель үшін біз осы таңдалған параметрлерді пайдалана отырып, 29 синтетикалық субъекті үшін мінез-құлық деректер жиынын симуляцияладық, бұл біздің зерттеуімізде модельді сәйкестендіруден өткен 29 эмпирикалық мінез-құлық деректер жиынына сәйкес келеді. Содан кейін біз барлық 10 модельді осы симуляцияланған деректер жиынына қайта сәйкестендірдік. Бұл процесс 200 тәуелсіз қайталау үшін жүзеге асырылды, әр қайталауда барлық 29 синтетикалық субъекті үшін жаңа таңдалған параметр мәндері мен симуляцияланған деректер жиыны жасалды. Содан кейін біз осы модель сыныптары ерекшеленетін есептеу процестерін білдіре ме, жоқ па деген сұраққа жауап беру үшін 10x10 қалпына келтіру матрицасын және 4x4 сынып деңгейіндегі қалпына келтіру матрицасын (RW модельдері, Bayes модельдері, FS модельдері және Q-learning моделі) құрдық.&lt;/p&gt;\n&lt;p&gt;Жеке модель деңгейінде ең жоғары қалпына келтіру ықтималдықтары Q-learning (50,79%), Bayes: fixed alpha (45,88%), FS: fixed f0 (45,83%) және RW: fixed alpha (45,47%) модельдерімен көрсетілді (қолжазбаға қосылған және төменде көшірілген жаңа Кесте S4 және Сурет S3-ті қараңыз). FS: fixed alpha моделі 37,62% қалпына келтіру ықтималдығымен әлсіз қалпына келуді көрсетті. Ақырында, RW: variable f0, RW: fixed f0, Bayes: variable f0, Bayes: fixed f0 және FS: variable f0 модельдері негізінен қалпына келтірілмейтін болып шықты (қалпына келтіру ықтималдықтары сәйкесінше 1,28%, 9,72%, 0,41%, 9,33% және 0,71%). Бұл нәтижелер айнымалы f0 модельдерінің аз анықталатынын, ал өзгермейтін α модельдерінің көбірек анықталатынын көрсетеді.&lt;/p&gt;\n&lt;p&gt;Қалпына келтіру матрицасын одан әрі тексеру шатасудың көбінесе бір модель сыныбындағы тиісті модельдер арасында болатынын көрсетті.&lt;/p&gt;\n&lt;p&gt;Модельдер сынып деңгейінде көбірек ерекшелене ме, жоқ па, соны бағалау үшін біз әр сынып ішіндегі модельдер бойынша қалпына келтіру ықтималдықтарын орташа есептеу арқылы сынып деңгейіндегі қалпына келтіру матрицасын құрдық. Сынып деңгейінде RW модельдері, Bayes модельдері, FS модельдері және Q-learning моделі үшін қалпына келтіру ықтималдықтары сәйкесінше 40,57%, 47,67%, 81,82% және 50,79% болды (қолжазбаға қосылған және төменде көшірілген жаңа Кесте S5 және Сурет S4-ті қараңыз). Ең көп шатасу RW және Bayes отбасылары арасында орын алды, бұл екі сыныптың да модельге негізделген нормативтік бейімделу механизмдерін жүзеге асыратынымен сәйкес келеді. Жалпы алғанда, бұл талдаулар тиісті жеке модельдер кейде ортақ модель сыныптары ішінде бір-бірімен шатасып кетсе де, бұл жоғары деңгейдегі модель сыныптары сенімдірек қалпына келтірілетінін көрсетеді, бұл осы есептеу модель сыныптары арқылы жасалған мінез-құлық болжамдарының айтарлықтай ерекшеленетінін білдіреді.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар, ең жақсы сәйкес келетін екі модельдің ішінен RW: fixed α моделі модельді қалпына келтіруде ең жақсы сәйкестендіруді көрсетті.&lt;/p&gt;\n&lt;h4 id=\"parametrlerdi-khalpyna-keltiru\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#parametrlerdi-khalpyna-keltiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Параметрлерді қалпына келтіру&lt;/span&gt;&lt;/a&gt;Параметрлерді қалпына келтіру&lt;/h4&gt;\n&lt;p&gt;Әрі қарай, RW: fixed α моделі жасаған параметрлердің қалпына келуін тексеру үшін 29 эмпирикалық мінез-құлық сессияларынан алынған параметр бағалауларының қалыпты бөліністері негізінде 29 мінез-құлық сессиясы жасанды түрде симуляцияланды. Содан кейін симуляцияланған мінез-құлық бастапқы эмпирикалық мінез-құлықпен бірдей модельдеу процесінен өткізілді. Симуляцияланған сәйкестіктерден алынған нәтижелі модель параметрлері содан кейін корреляция арқылы бастапқы эмпирикалық параметр бағалауларымен салыстырылды. Жоғарырақ Пирсон корреляция коэффициенттері параметрлердің жақсырақ қалпына келгенін көрсетті. Барлық модель параметрлері айтарлықтай дәрежеде қалпына келтірілді (S5 сурет; температура: r = 0.51, p = 0.0049; норманың бейімделу жылдамдығы: r = 0.86, p = 1.8e-09; бастапқы норма: r = 0.94, p = 6.9e-14). Сондықтан біз бұл норманы бейімдеу моделін жеткілікті қайталанушылықпен қолдануға болады деген қорытындыға келдік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Параметрлерді қалпына келтіру — бұл модельдеу алгоритмі бастапқы мәндерді қайтара алатынын тексеру үшін белгілі параметрлері бар деректерді жасанды түрде жасау арқылы орындалатын валидациялық тест.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aposteriorlykh-bolzhamdykh-tekseruler\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#aposteriorlykh-bolzhamdykh-tekseruler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Апостериорлық болжамдық тексерулер&lt;/span&gt;&lt;/a&gt;Апостериорлық болжамдық тексерулер&lt;/h4&gt;\n&lt;p&gt;Біз содан кейін RW: fixed α моделі біздің зерттеуімізде байқалған таңдау үлгілерін қайта шығаратынын зерттедік. Ол үшін әр сессияда ұсынылған нақты ұсыныс векторларын пайдалана отырып, RW: fixed α моделімен эмпирикалық модельді сәйкестендіруден алынған параметр бағалаулары негізінде 29 мінез-құлық деректер жиынтығын симуляцияладық.&lt;/p&gt;\n&lt;p&gt;RW: fixed α моделі адам (орташа ± SEM: бақыланған: 0.662 ± 0.042; симуляцияланған: 0.652 ± 0.045) және компьютер (бақыланған: 0.542 ± 0.050; симуляцияланған: 0.500 ± 0.065) аватарлары серіктес жағдайларының екеуінде де жалпы бас тарту көрсеткіштерін қайталады (S6A сурет). RW: fixed α моделі сонымен қатар ұсыныс көлемінің бас тарту жиілігіне тигізетін жағымсыз әсерін де қалпына келтірді (S6B сурет). Соңында, RW: fixed α моделі мінез-құлықты жеке субъектілер деңгейінде қайталайтынын бағалау үшін бақыланатын және симуляцияланған сессиялар үшін жеке бас тарту көрсеткіштері де салыстырылып, күшті сызықтық корреляцияны көрсетті (S6C сурет; Пирсонның моменттік-туынды корреляциясы, p = 4.55e-12, r = 0.914, 95% CI 0.823 - 0.959).&lt;/p&gt;\n&lt;h4 id=\"sharttar-bojynsha-parametrlerdi-salystyru\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#sharttar-bojynsha-parametrlerdi-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шарттар бойынша параметрлерді салыстыру&lt;/span&gt;&lt;/a&gt;Шарттар бойынша параметрлерді салыстыру&lt;/h4&gt;\n&lt;p&gt;RW: fixed alpha моделі үшін кері температура, норманың бейімделу жылдамдығы және бастапқы норма үшін параметр бағалаулары қатысушы үшін және қатысушы ішіндегі сессия үшін кездейсоқ әсерлері бар әрбір параметрді шарт (адам немесе компьютер аватары) бойынша болжайтын аралас әсерлі модельдер көмегімен салыстырылды (1-кесте). Қатысушы үшін және қатысушы ішіндегі сессия үшін кездейсоқ әсерлері бар температураны шарт бойынша болжайтын аралас әсерлі модель шарттың айтарлықтай әсерін таппады (шарт, p = 0.34, β ± SEM = 0.80 ± 0.83; OR = 2.24, 95% CI [0.41, 12.17]). Қатысушы үшін және қатысушы ішіндегі сессия үшін кездейсоқ әсерлері бар бастапқы ішкі норманы шарт бойынша болжайтын аралас әсерлі модель шарт үшін айтарлықтай әсерді анықтады, мұнда адам аватары серіктестермен ойын кезінде бастапқы нормалар компьютерлік аватарларға қарағанда жоғарырақ болды (шарт, p = 0.025, β ± SEM = -4.76 ± 2.00; OR = 0.0085, 95% CI [0.00014, 0.52]). Соңында, қатысушы үшін және қатысушы ішіндегі сессия үшін кездейсоқ әсерлері бар норманың бейімделу жылдамдығын шарт бойынша болжайтын аралас әсерлі модель шарттың айтарлықтай әсерін таппады (шарт, p = 0.083, β ± SEM = 0.053 ± 0.030; OR = 1.05, 95% CI [0.99, 1.12]). Осылайша, температура мен норманың бейімделу жылдамдығы шарттар бойынша ерекшеленбесе де, бастапқы нормалар шынымен де шарттар бойынша ерекшеленді, яғни әділдік нормалары адам аватары серіктестермен ойын кезінде жоғарырақ болды.&lt;/p&gt;\n&lt;h4 id=\"birlik-elektrofiziologiyalykh-derekterin-taldau\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#birlik-elektrofiziologiyalykh-derekterin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бірлік электрофизиологиялық деректерін талдау&lt;/span&gt;&lt;/a&gt;Бірлік электрофизиологиялық деректерін талдау&lt;/h4&gt;\n&lt;p&gt;Нейрондық деректер 44 000 Гц жиілікте цифрландырылды және тек жоғары жиілікті белсенділікті іріктеп алу үшін 300–9000 Гц диапазонында сүзгіден өткізілді. Сүзгіден өткізілген жеке бірлік жазбаларынан кластерлер Рутихаузер және басқалары әзірлеген OSORT офлайн спайктерді сұрыптау (spike sorting) алгоритмін қолдана отырып MATLAB ортасында анықталды. Спайктер тек нейрондық сигнал орташа сигнал амплитудасының стандартты ауытқу шегінен бес есе асып кеткен кезде ғана анықталды. Әрбір жаңа спайк анықталған сайын, ол көп өлшемді қашықтық бойынша бұрын анықталған ұқсас спайктер кластерлерімен салыстырылды. Егер қашықтық кластерлеу шегінен (жылжымалы терезе бойымен сүзгіден өткізілген сигналдың орташа стандартты ауытқуының квадраты толқын пішініндегі деректер нүктелерінің санына көбейтілген) кіші болса, онда ол осы кластерге қосылды; егер қашықтық кластерлеу шегінен үлкен болса, онда ол жаңа кластер ретінде жіктелді.&lt;/p&gt;\n&lt;p&gt;Содан кейін біз сұрыптау алгоритмі қайтарған әрбір кластерді қолмен қарап шығып, артефактілерді жойдық және қате бөлінген кластерлерді біріктірдік. Егер осы кластерден шығатын барлық спайктердің &amp;gt;5% рефрактерлік кезеңнің ұзақтығына сәйкес келетін 3 мс-тен аз спайкаралық аралыққа (ISI) ие болса, кластер артефакт деп саналды. Қате бөлінулер әр кластер үшін OSORT жасаған проекциялық тесттерді зерттеу арқылы анықталды. Бұл проекциялық тесттер әрбір мүмкін кластер жұбы арасындағы көп өлшемді қашықтықтың визуализациясын қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Спайктерді сұрыптау (spike sorting) — бұл бір микроэлектрод жазып алған әртүрлі нейрондардың электрлік сигналдарын олардың бірегей толқын пішіні бойынша бөліп алуға арналған компьютерлік әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз ISI &amp;lt;5% сипатталатын кластерлерді болжамды жеке бірліктер (putative single units) ретінде жіктедіміз. Біз UG тапсырмасында ұсыныс ұсынылатын нүкте — бөліністі ашу (split reveal) кезінде әрбір болжамды бірлік үшін растрлық графиктерді және перистимулдық уақыт гистограммаларын жасадық. Содан кейін біз әрбір уақыт нүктесінде орталықтандырылған жылжымалы, симметриялы Гаус ядросын (ені = 300 мс) пайдаланып болжамды бірліктер үшін спайк тізбектерін үздіксіз толқын пішіндеріне тегістедік (бір бірліктің мысалы үшін S8-суретке қараңыз). Тегістеу нөлдік фазада орындалды және нейрондық жауаптардың уақытына уақытша ығысулар енгізбеді. Біз әрбір болжамды бірлік үшін орташа импульсация жиілігін есептедік және орташа толқын пішіндерін шыңдар саны, толқын ені, полярлығы және шыңдар мен ойыстар арасындағы қашықтық бойынша сипаттадық. SNr ішінде біз 27 SNr микроэлектродтық жазбасынан 69 болжамды нейрондық кластерді анықтадық (орташа ± SEM кластерлер саны әр жазба үшін: 2,6 ± 0,11). Импульсация жиілігі 15 Гц-ке тең немесе одан аз және екі фазалы пішіні бар толқын ені 0,8 мс-тен үлкен бірліктерді болжамды дофаминергиялық (DA) бірліктер ретінде белгіледік. Егер бірліктің биполярлық толқын пішіні теріс ауытқуға, содан кейін оң ауытқуға ие болса (кері полярлықтың орнына), бұл бірлік электродтың орналасуына қатысты бағдары ықтимал кері бұрылған болжамды DA бірлігі деп саналды. Жалпы алғанда, 69 болжамды бірліктің 40-ы болжамды DA бірліктері ретінде белгіленді (орташа ± SEM болжамды DA бірліктері әр жазба үшін: 1,5 ± 0,18) (3A-сурет). Барлық 40 болжамды DA бірлігі үшін толқын пішіндері және бұл бірліктер үшін орташа толқын пішіні 3B-суретте көрсетілген. Тек 3B-суреттегі визуализация мақсатында кері полярлығы бар болжамды DA бірліктерінің толқын пішіндері электрод ұшына қатысты төңкерілген бағдарды түзету үшін x осі бойынша көрсетілді (яғни микровольттар әр уақыт нүктесінде –1-ге көбейтілді). Әрбір бірлік үшін үздіксіз импульсация жиіліктері сессия бойындағы бірлік белсенділігінің орташа мәні мен стандартты ауытқуын қолдана отырып, бүкіл жазба бойынша z-шкаладан өткізілді. Бұл z-шкаладан өткен үздіксіз импульсация жиіліктері кейінгі популяциялық талдаулар үшін қызығушылық тудыратын оқиғалардың (яғни бөліністі ашу, көңіл-күй рейтингі және т.б.) айналасынан шығарып алынды.&lt;/p&gt;\n&lt;p&gt;Бұл болжамды DA нейрондарының белсенділігі nPE қасиеттерін кодтай алатынын тексеру үшін біз алдымен nPE оң болған сынақтардағы бөліністі ашқаннан кейінгі 1000 мс ішіндегі осы бірліктердің импульсация жиіліктерін nPE теріс болған сынақтармен салыстырдық. Топтық деңгейдегі болжамды DA бірлігінің белсенділігі адам жағдайында теріс nPE сынақтарымен салыстырғанда оң nPE сынақтары кезінде жоғарырақ болып көрінді (ықтималдық тығыздығы функциялары үшін 3E-суретке қараңыз); бұл өрнек компьютерлік жағдайда әлсіреді (ықтималдық тығыздығы функциялары үшін 3F-суретке қараңыз). Осы бақылаудың статистикалық маңыздылығын тексеру, сондай-ақ бұл бірліктердің nPE шамасын кодтайтынын тексеру үшін біз әрбір жағдайдағы бірлік үшін кездейсоқ әсермен бірге nPE валенттілігі (1 = теріс, 2 = оң), шамасы және олардың өзара әсерлесуі бойынша бөліністі ашқаннан кейінгі 1000 мс ішінде осы бірліктердің белсенділігін болжау үшін аралас әсерлер моделін енгіздік. Валенттілік фактор ретінде қарастырылды. Барлық аралас әсерлер модельдері RStudio бағдарламасындағы «lme4» және «lmerTest» пакеттерін пайдаланып жүзеге асырылды. Адам жағдайына арналған аралас модель валенттілік үшін маңызды әсер етті (nPE валенттілігі, p = 0,008, β ± SEM = 0,19 ± 7,3e-02, 95% CI [0,05, 0,34]; 3G-сурет; басқа бағалаулар үшін 2-кестеге қараңыз). Валенттілік компьютерлік жағдайда импульсация жиілігінің маңызды предикторы болмады (PE валенттілігі, p = 0,79, β ± SEM = -0,02 ± 7,7e-02, 95% CI [-0,17, 0,13]; 3H-сурет; басқа бағалаулар үшін 2-кестеге қараңыз).&lt;/p&gt;\n&lt;p&gt;nPE валенттілігі әсерінің әртүрлі жағдайларда қалай ерекшеленетінін ресми түрде тексеру үшін біз аралас әсерлер моделін құрдық. Бұл модельде nPE шамасы, nPE валенттілігі, жағдай (адам немесе компьютер) және олардың сәйкес өзара әрекеттесу мүшелері тіркелген әсерлер ретінде, ал нейрон SNr болжамды дофаминерgикалық нейрондарының бөліну ашылуынан (split reveal) кейінгі 1000 мс ішіндегі топтық белсенділігін болжайтын кездейсоқ әсер ретінде қарастырылды (S9 кесте). Бұл модель SNr болжамды дофаминергиялық нейрондарының орташа импульсация жиілігі тек nPE валенттілігімен (nPE валенттілігі, p = 0.0057, β ± SEM = 0.20 ± 7.3e-02, 95% ДИ [0.06, 0.34]) ғана емес, сонымен қатар nPE валенттілігі мен жағдай арасындағы өзара әрекеттесумен де (nPE валенттілігі × жағдай, p = 0.036, β ± SEM = -0.22 ± 0.11, 95% ДИ [-0.43, -0.01]) сенімді түрде болжанғанын көрсетті, мұнда nPE валенттілігінің импульсация жиілігі арқылы кодталуы компьютер жағдайына қарағанда адам жағдайында едәуір күштірек болды. Жиынтығында бұл нәтижелер SNr болжамды дофаминергиялық нейрондары nPE валенттілігіне, әсіресе әлеуметтік контексттерде, сезімтал болуы мүмкін екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аралас сызықтық модельдер топтық деңгейдегі жалпы заңдылықтарды да, жеке нейрондардың ерекшеліктерін де бір мезгілде ескеруге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұсыныс көлемінің nPE валенттілігіне байқалатын нейрондық жауаптағы ықтимал рөлін ескеру үшін біз адам жағдайындағы бөлінудің ашылу кезіндегі SNr болжамды дофаминергиялық нейрондарының белсенділігін ұсыныс көлемі мен nPE валенттілігінің тіркелген әсерлері және нейрон үшін кездейсоқ әсер арқылы болжайтын сызықтық аралас әсерлер моделін құрдық. Бұл талдау nPE валенттілігі ұсыныс көлемі бақыланғаннан кейін де бөлінудің ашылу кезіндегі импульсация жиілігінің маңызды предикторы болып қала беретінін көрсетті (nPE валенттілігі, p = 0.022, β ± SEM = 0.12 ± 5.1e-02, 95% ДИ [0.02, 0.21]), ал ұсыныс көлемі маңызды предикторы болмады (ұсыныс, p = 0.45, β ± SEM = -3.6e-03 ± 4.7e-03, 95% ДИ [-0.01, 0.01]). Біз бұл талдауды ұсынысты категориялық айнымалы ретінде қарастырып қайталадық. Тағы да nPE валенттілігі импульсация жиілігінің жалғыз маңызды предикторы болды (nPE валенттілігі, p = 0.030, β ± SEM = 0.11 ± 5.1e-02, 95% ДИ [0.01, 0.21]), ал ұсыныстың айтарлықтай әсері байқалмады. Бұл деректер осы болжамды дофаминергиялық нейрондардың байқалған импульсациялық белсенділігі ұсыныс көлемінің өзінен гөрі, ұсыныстың қатысушының ішкі нормативтік күтуінен жақсы немесе нашар екенін кодтауға көбірек сәйкес келетінін болжайды.&lt;/p&gt;\n&lt;p&gt;Соңында біз осы болжамды дофаминергиялық нейрондардың белсенділігі сәттік көңіл-күй бағалауларымен қалай байланысты екенін зерттедік. Біз алдымен z-өзгертілген көңіл-күй бағалаулары мен көңіл-күй бағалауын таңдауға дейінгі 1000 мс ішіндегі болжамды дофаминергиялық нейрондардың импульсация жиілігі арасында Пирсонның көбейтінді-моментті корреляциялық тестін қолдандық және импульсация жиіліктері мен z-өзгертілген көңіл-күй бағалауларының айтарлықтай корреляцияланбағанын анықтадық (p = 0.16, r = -0.09, 95% ДИ -0.21, -0.03) (S10 сурет). Содан кейін біз нейрон үшін кездейсоқ әсері бар z-өзгертілген көңіл-күй бағалауы арқылы осы кезеңдегі болжамды дофаминергиялық нейрондардың топтық белсенділігін болжау үшін аралас әсерлер моделін енгіздік, бұл көңіл-күй бағалауының нейрондық белсенділікке айтарлықтай әсер етпейтінін растады (көңіл-күй бағалауы, p = 0.16, β ± SEM = -0.027 ± 0.019). Бұл нәтижелер осы болжамды дофаминергиялық нейрондардың белсенділігі көңіл-күй бағалауларына емес, тек nPE валенттілігіне жауап беретінін болжайды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f1.jpg\" alt=\"1-сурет. Экспериментальды құрылым. (A) Қара субстанцияның торлы бөлігіндегі (SNr) микроэлектродты интраоперациялық нысан\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Экспериментальды құрылым. (A) Қара субстанцияның торлы бөлігіндегі (SNr) микроэлектродты интраоперациялық нысанаға алу. Микроэлектродтар тіркеу нысанасына — SNr орналастыру үшін клиникалық нысанадан — субталамус ядросынан (STN) вентральды түрде орналастырылды. Микроэлектродтың орналасуы және оның траекториясы бойындағы ми аймақтарының салыстырмалы анатомиялық орналасуы хирургиялық картаға түсіру, нейрондық спайктарды визуализациялау және Alpha Omega электрофизиологиялық жазу жүйесі көмегімен нейрондық импульстерді тыңдау арқылы нақты уақыт режимінде анықталды, осылайша әрбір аймақты оның жүйке белсенділігінің бірегей қолтаңбасы арқылы анықтауға болады. (B) «Ультиматум» ойыны. Қатысушылар «Ультиматум» ойынының екі нұсқасының бірін ойнады. Бір нұсқада адам аватары серіктестері қатысушыларға 20 долларды бөлу бойынша ұсыныстарды бірнеше рет ұсынды, оларды қатысушылар қабылдады немесе қабылдамады. Егер қатысушы қабылдаса, әр тарап ұсынылған үлесті алады. Егер қатысушы қабылдамаса, әр тарап ешнәрсе алмайды. Әрбір ұсынысты жаңа серіктес ұсынады. Барлық ұсыныстар 9 доллардан аз. «Ультиматум» ойынының екінші нұсқасы адам блогын ғана емес, сонымен қатар «компьютерлік» серіктестермен сынақтар блогын, сондай-ақ таңдау сынақтарының кездейсоқ 33%-дан кейінгі көңіл-күй рейтингін қамтиды. Ми тілігі мен компьютер белгішесі BioRender жүйесінде жасалған. Neal, A. (2027) https://BioRender.com/bpwujj1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f2.jpg\" alt=\"2-сурет. «Ультиматум» ойынының мінез-құлқы. (A) Ұсыныс көлемі бойынша қабылдамау жиілігі және (B) компьютер (көк) және а\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-сурет. «Ультиматум» ойынының мінез-құлқы. (A) Ұсыныс көлемі бойынша қабылдамау жиілігі және (B) компьютер (көк) және адам (қызғылт сары) жағдайларындағы жалпы қабылдамау жиілігі. (C) Адам және компьютер жағдайларындағы таңдауға (қабылдау/қабылдамау) қарсы көңіл-күй рейтингі (z-шкалаланған). (D) Барлық сессиялар мен қатысушылар үшін жалпы Байестік ақпараттық критерий (BIC) ұпайы бойынша норма бейімделу модельдерін салыстыру. Ең төменгі жалпы BIC ұпайы бар модель ең жақсы сәйкестікке ие (жасыл). (E) Компьютер және адам жағдайларындағы сынақ бойынша ішкі норма. Ішкі нормалар ең жақсы жұмыс істейтін норма бейімделу моделі арқылы есептелді. (F) Барлық сессиялар мен қатысушылар үшін көңіл-күй рейтингіне (z-шкалаланған) қарсы норма болжамының қатесі (z-шкалаланған). Бағандар, нүктелер және сызықтар орташа мәнді білдіреді. Қате бағандары орташаның стандартты қатесін білдіреді. **p &amp;lt; 0.01; **&lt;em&gt;p &amp;lt; 0.001 екі жақты Уилкоксон рангалық қосынды тестілері (C), жалпы сызықтуу регрессия (E) және Пирсонның моменттік корреляциялық тесті (F) бойынша. n = (A), (B), (D) және (E) үшін адам аватарларымен 21 ойын блогы және компьютер аватарымен 8 ойын блогы. n = (C) және (F) үшін адам аватарларымен 6 ойын блогы және компьютер аватарымен 5 ойын блогы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l-f3.jpg\" alt=\"3-сурет. Болжалды дофаминергиялық (ДА) бірлік белсенділігі әлеуметтік болжам қатесінің валенттілігін кодтайды. (A) Офлай\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-сурет. Болжалды дофаминергиялық (ДА) бірлік белсенділігі әлеуметтік болжам қатесінің валенттілігін кодтайды. (A) Офлайн сұрыптау алгоритмі көмегімен анықталған үш болжалды бірлік мысалы және орташа толқын пішінінің ені &amp;gt;0.8 мс, екі фазалы морфология және атқылау жиілігі ≤15 Гц болатын бір болжалды ДА бірлігі (ашық күлгін). (B) SNr болжалды ДА бірліктері (сұр) үшін орташа толқын пішіні (қара). (C) адам және (D) компьютер жағдайларында оң (жасыл, тұтас) пен теріс (пурпурлы, үзіл сызықты) норма болжамы қателерін (nPE) тудыратын сынақтар үшін бөліну ашылғаннан кейінгі 1000 мс ішіндегі SNr болжалды ДА бірліктерінің орташа шикі атқылау жиілігі. Бөлінудің ашылуы 0 мс уақытта орын алады. (E) адам және (F) компьютер жағдайларында оң (жасыл) пен теріс (пурпурлы) норма болжамы қателерін (nPE) тудыратын сынақтар үшін бөліну ашылғаннан кейінгі 1000 мс ішіндегі SNr болжалды ДА бірліктерінің орташа атқылау жиілігінің ықтималдық тығыздығы функциялары. (G) адам және (H) компьютер жағдайларында бөліну ашылғаннан кейінгі 1000 мс ішінде SNr болжалды ДА бірліктерінің орташа атқылау жиілігін nPE валенттілігі, nPE шамасы және бірлік үшін кездейсоқ әсері бар осы регрессорларға арналған өзара әрекеттесу шарттары бойынша болжайтын аралас әсерлі модельдерге арналған β коэффициенттері. Қате бағандары орташаның стандартты қатесін білдіреді. *&lt;em&gt;p &amp;lt; 0.01 аралас әсерлі модель бойынша. n = (B) үшін барлығы 40 болжалды ДА нейрондары. n = (C), (E) және (G) үшін адам жағдайындағы 31 болжалды ДА нейроны. n = (D), (F) және (H) үшін компьютер жағдайындағы 16 болжалды ДА нейроны.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"2026-09-22/single-neurons-in-the-human-substantia-nigra-encode-social-l.html#kesteler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кестелер&lt;/span&gt;&lt;/a&gt;Кестелер&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Эмпирикалық параметр бағалаулары.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Шарт&lt;/th&gt;\n&lt;th&gt;Температура (n.s.)&lt;/th&gt;\n&lt;th&gt;Бастапқы норма (*)&lt;/th&gt;\n&lt;th&gt;Норманың бейімделу жылдамдығы (n.s.)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Адам&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;4.31 ± 1.43&lt;/td&gt;\n&lt;td&gt;14.96 ± 0.86&lt;/td&gt;\n&lt;td&gt;0.02 ± 0.01&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Компьютер&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;5.19 ± 3.19&lt;/td&gt;\n&lt;td&gt;10.20 ± 2.54&lt;/td&gt;\n&lt;td&gt;0.08 ± 0.04&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;n.s. - маңызды емес, * - p &amp;lt; 0.05&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Ашылу кезінде қара субстанцияның торлы бөлігінің (SNr) болжалды дофаминергиялық (DA) бірліктерінің белсенділігін болжайтын аралас әсерлі модельдердің жиынтығы.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Тұрукты әсер&lt;/th&gt;\n&lt;th&gt;Бағалау&lt;/th&gt;\n&lt;th&gt;Стандартты қате&lt;/th&gt;\n&lt;th&gt;t-мәні&lt;/th&gt;\n&lt;th&gt;p-мәні&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Адам&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Intercept&lt;/td&gt;\n&lt;td&gt;-0.004703&lt;/td&gt;\n&lt;td&gt;0.027146&lt;/td&gt;\n&lt;td&gt;-0.173&lt;/td&gt;\n&lt;td&gt;0.86280&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude&lt;/td&gt;\n&lt;td&gt;-0.001546&lt;/td&gt;\n&lt;td&gt;0.003287&lt;/td&gt;\n&lt;td&gt;-0.470&lt;/td&gt;\n&lt;td&gt;0.63876&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE valence **&lt;/td&gt;\n&lt;td&gt;0.194946&lt;/td&gt;\n&lt;td&gt;0.073006&lt;/td&gt;\n&lt;td&gt;2.670&lt;/td&gt;\n&lt;td&gt;0.00771&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;nPE magnitude x nPE valence&lt;/td&gt;\n&lt;td&gt;-0.073754&lt;/td&gt;\n&lt;td&gt;0.038881&lt;/td&gt;\n&lt;td&gt;-1.897&lt;/td&gt;\n&lt;td&gt;0.05815&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Компьютер&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Intercept&lt;/td&gt;\n&lt;td&gt;-0.003115&lt;/td&gt;\n&lt;td&gt;0.031721&lt;/td&gt;\n&lt;td&gt;-0.098&lt;/td&g
