            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"241\" cy=\"128\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"639\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Альцгеймер ауруын зерттеуге&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;арналған адам гиппокампының&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жасушалық картасы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"1-сурет. Адамның дамып келе жатқан гиппокамп атласы (HuDeHA) ерте эмбриональды кезеңдерден постнатальды кезеңдерге дейін\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Адамның дамып келе жатқан гиппокамп атласы (HuDeHA) ерте эмбриональды кезеңдерден постнатальды кезеңдерге дейінгі гиппокамптың дамуының уақытча динамикасын көрсетеді. (A) 20 аннотацияланған жасуша класын көрсететін Адамның дамып келе жатқан гиппокамп атласынын (HuDeHA; 658 059 жасуша) UMAP проєкциясы. Атлас радиальды глия мен аралық ізашар жасушалардан (IPC) ерте және жетілген нейрондарға дейінгі нейрондық сызықты, сондай-ақ пролиферацияланатын радиальды глия мен IPC күйлерін; глиальды ізашарларды, олигодендроциттердің ізашарларын (OPC), олигодендроциттер мен астроциттерді қамтитын глиальды сызықты; эктодермальды емес нейрондық популяцияларды (эпендима мен хориоидты өрім); нерв қырқасын (NC) және NC-нан туындаған нейрондарды; эктодермальды емес популяцияларды (мезенхималық, эндотелиальды, микроглиальды/миелоидты және басқа иммундық жасушалар), сондай-ақ жұлын/мишықпен байланысты шағын топты қамтиды. (B) Даму барысындағы (концепциядан кейінгі апта (PCW) 3 пен 15,3 жыл аралығында) жасуша класы пропорцияларының тығыздығы нейрогенезден глиогенезге және постнатальды байланысты жасуша кластарының пайда болуына дейінгі күтілетін ауысуларды көрсетеді: эмбриональды үлгілерде радиальды глия мен NC басым; ұрық кезеңінде IPC пен глиальды ізашарлар пайда болады, ал жетілген нейрондар астроциттер мен олигодендроциттермен бірге постнатальды кезеңде басым болады. (C) Даму жасы бойынша анықталған, даму барысындағы жеке жасуша кластарының пропорционалды динамикасы. (B)-ге қосымша ретінде, бұл көрініс жеке кластардың пайда болу және сарқылу уақытын көрсетеді: радиальды глия мен ерте нейрондардың эмбриональды басымдығы, NC-ден туындаған жасушалардың біртіндеп жоғалуы және глиальды ізашарлардың кеңеюі, сондай-ақ OPC, олигодендроциттер мен астроциттермен қатар жетілген нейрондардың постнатальды басымдығы. (D) Барлық 20 аннотацияланған жасуша кластарындағы каноникалық маркерлердің экспрессиясын көрсететін нүктелік график (dotplot): радиальды глия (VIM, SOX2), IPC (EOMES), пролиферацияланатын радиальды глия және IPC (TOP2A, MKI67), ерте (DCX) және жетілген нейрондар (SNAP25), Кахаль-Ретциус (CR) нейрондары (RELN), глиальды ізашарлар (BCAN), OPC (OLIG1), олигодендроциттер (MBP), астроциттер (GFAP), эктодермальды емес нейрондық популяциялар – эпендима (PIFO), хориоидты өрім (TTR), NC (MPZ) және NC-ден туындаған нейрондар (ISL1), мезенхима (DCN), эндотелий (CLDN5), микроглиалық (CX3CR1) және иммундық жасушалар (CD3D), жұлын/мишық тобы (CDX2/4).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ғалымдар эмбриондық кезеңнен жасөспірімдік шаққа дейінгі адам гиппокампының бірыңғай жасушалық атласын жасады. Оның көмегімен отбасылық Альцгеймер ауруын тудыратын мутациясы бар ми органоидтары зерттелді. Талдау барысында жасуша құрамының бұзылуы және нейрондардың ерте жетілуі анықталды. Бұл жаңа деректер базасы зертханада жүйке ауруларын дәлірек модельдеуге көмектеседі.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Альцгеймер ауруының отбасылық түрі (fAD) — бұл APP, PSEN1 немесе PSEN2 гендеріндегі аутосомды-доминантты нұсқалар туындататын аурудың ерте басталатын түрі, мұнда генетикалық анықталған жағдайлардың көпшілігі PSEN1 үлесіне тиесілі. Гиппокамп ауру кезінде бірінші болып және ең ауыр зақымданатын ми аймақтарының бірі болып табылады. Адамның индуцияланған плюрипотентті дің жасушаларынан (iPSC) алынған ми органоидтары адам миының ерте дамуының негізгі белгілерін қайталайды және fAD мутацияларының нейроонтогенез процестерін қалай бұзатынын зерттеуге арналған ыңғайлы модельді ұсынады. Дегенмен, олардың нәтижелерін түсіндіру әртүрлі хаттамалардағы аймақтық сәйкестіктің әртектілігі, жетілу күйінің және жасушалық құрамның әртүрлі болуына байланысты қиындайды. Адам гиппокампы бойынша қолданыстағы жалғыз жасушалы зерттеулер пренатальды және постнатальды кезеңдерді қамтиды, бірақ үздіксіз даму анықтамалығын қамтамасыз етпейді. Жалғыз жасушалы РНК секвенирлеу деректерін пайдалана отырып, біз органоидтық жасуша класы, түрі және жетілу күйлері туралы стандартталған ақпарат алдық.&lt;/p&gt;\n&lt;p&gt;Біз Дамып келе жатқан адам гиппокампының атласын (HuDeHA) құрдық; бұл тұжырымдамадан кейінгі 3 аптадан 15,3 жасқа дейінгі кезеңді қамтитын 658 059 жасушадан тұратын біріктірілген жалғыз жасушалы анықтамалық жүйе, және оны ірі колумбиялық популяцияда fAD-пен байланысты PSEN1E280A мутациясы бар iPSC-тен алынган ми органоидтарын салыстыру үшін қолдандық. Анықтамалық картаға түсіру арқылы PSEN1E280A органоидтарындағы өзгерген жасушалық құрам анықталды, соның ішінде радиальды глияның азаюы және жүйке қыртысынан шыққан нейрондардың көбеюі байқалды. Бұл өзгерістер сызықаралық транскрипциялық ауытқулармен, соның ішінде вентральды өрнектеу факторы MEIS2-нің кең көлемде артуымен және хориоидты өрім мен эпендимальды топтарда Aβ-байланыстырушы ақуыз transtretin (TTR) экспрессиясының төмендеуімен бірге жүрді. Қайта құрылған нейрондық желі траекториялары PSEN1E280A органоидтарында жетілген күйлерге қарай жылжу бар екенін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HuDeHA атласы PSEN1E280A органоидтарында радиальды глияның тапшылығын, жүйке қыртысы нейрондарының артық болуын, MEIS2 көтерілуін және TTR төмендеуін, сондай-ақ нейрондардың жеделдетілген жетілуін анықтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алынған нәтижелер HuDeHA-ны гиппокампқа қатысты органоидтық жүйелерді даму тұрғысынан бағалау ресурсы ретінде белгілейді және fAD кезіндегі ерте жасушалық өзгерістерді түсінуге көмектесетін PSEN1E280A органоидтарындағы жасуша-сызықтық өзгерістерді сипаттайды.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"human-developing-hippocampus-atlas-hudeha-pre-zhaene-postnataldy-uakhyt-shkalasy-bojynsha-negizgi-zhasusha-klastaryn-anykhtajdy\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#human-developing-hippocampus-atlas-hudeha-pre-zhaene-postnataldy-uakhyt-shkalasy-bojynsha-negizgi-zhasusha-klastaryn-anykhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Human Developing Hippocampus Atlas (HuDeHA) пре- және постнатальды уақыт шкаласы бойынша негізгі жасуша кластарын анықтайды&lt;/span&gt;&lt;/a&gt;Human Developing Hippocampus Atlas (HuDeHA) пре- және постнатальды уақыт шкаласы бойынша негізгі жасуша кластарын анықтайды&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер жалпыға қолжетімді scRNA-seq деректер жиындарынан 107 топтаманы біріктіру арқылы адамның даму үстіндегі гиппокамп атласын (HuDeHA) жасады, ол барлығы 658 059 жасушаны қамтыды (1А-сурет; S1А, B-сурет; S1-кесте). Уақыт аралығы ұрықтанудан кейінгі 3-аптадан (PCW3) басталатын ерте эмбриональды кезеңдерді және ең үлкен постнатальды үлгілердің жасы 15,3 жасқа жеткен постнатальды жасөспірімдік кезеңді қамтиды. Аннотацияланған популяциялар нейрондық, глиальды, нейрондық емес, тамырлық және иммундық жасуша түрлерін қоса алғанда, даму сызықтарының күтілетін әртүрлілігін көрсетті. Канондік маркерлік гендерге сүйене отырып, авторлар HuDeHA атласында 20 негізгі жасуша класын анықтады (1D-сурет).&lt;/p&gt;\n&lt;p&gt;Нейроэктодермалық сызықтар нейрондық дифференциация континуунмын құрды. Ол VIM, SOX2 және NES экспрессиялайтын 194 105 жасушадан тұратын радиальды глиядан және TOP2A, MKI67, UBE2C және CDK1 гендеріне бай пролиферацияланатын радиальды глиядан (11 390 жасуша) басталады. Олар өз кезегінде EOMES және ASCL1 белгіленген аралық ізашар жасушаларға (IPC; 15 033 жасуша) және пролиферацияланатын IPC-ларға (3860 жасуша) өтеді. Өз кезегінде бұлар DCX, NEUROD2 және ELAVL3 экспрессиялайтын ерте нейрондарды (246 627 жасуша) және постмитотикалық және синаптикалық гендер RBFOX3, SNAP25 және SYT1-ге бай дифференциацияланған нейрондарды (95 335 жасуша) түзді. Кахал-Ретциус (CR) нейрондарының шағын популяциясы (170 жасуша) жоғары RELN экспрессиясымен ерекшеленді. Глиальды сызыққа VIM және SOX2 экспрессиясы бойынша радиальды глиямен ішінара қабаттасатын BCAN және TNC экспрессиялайтын глиальды ізашарлар (8536 жасуша) кірді, бұл олардың өтпелі сипатын көрсетеді. Жетілген глиальды популяциялар олигодендроциттердің ізашарларын (OPC; 11 483 жасуша; OLIG1 және PDGFRA), олигодендроциттерді (7908 жасуша; PLP1 және MBP) және астроциттерді (15 701 жасуша; GFAP және AQP4) анық бөлінген кластерлер ретінде қалыптастырды. Қосымша нейроэктодермалық популяцияларға эпендимальды жасушалар (2200 жасуша; PIFO) және хориоидты өрім жасушалары (2119 жасуша; TTR), сондай-ақ жүйке қыртысы (NC) жасушалары (10 036 жасуша; SOX10 және MPZ) және жүйке қыртысынан шыққан нейрондарды (6302 жасуша; ISL1 және SIX1) қамтитын жүйке қыртысы сызығы кірді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;scRNA-seq — әрбір жеке жасушадағы ген экспрессиясын егжей-тегжейлі зерттеуге және сирек кездесетін жасуша түрлерін анықтауға мүмкіндік беретін жеке жасушалардың РНҚ-сын секвенирлеу әдісі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эктодермалық емес популяцияларға мезодермадан шыққан мезенхима (8052 жасуша; DCN), эндотелий (228 жасуша; CLDN5), микроглия (4876 жасуша; CX3CR1) және басқа иммундық жасушалардың шағын популяциясы (160 жасуша; CD3D) кірді. Сондай-ақ жұлынмен/ми бағанымен байланысты азшылық популяция байқалды (480 жасуша; CDX2 және CDX4) (1D-сурет). Содан кейін ғалымдар жасуша кластарының пропорционалды тығыздығы мен жалпы үлес динамикасын визуализациялау арқылы жасуша құрамы мен жетілу дәрежесі PCW3-тен 15,3 жасқа дейінгі бүкіл атлас уақыт шкаласы бойынша қалай өзгеретінін зерттеді (1B, C-сурет; S1D-сурет). Бұл динамика ерте эмбриональды үлгілердің радиальды глия мен жүйке қыртысы популяцияларына бай екенін көрсетті, ал кейінгі пренатальды кезеңдерде радиальды глияның салыстырмалы түрде азаюы, ерте нейрондық популяциялардың кеңеюі және глиальды ізашар күйлерінің пайда болуы байқалды, бұл ерте нейрогенезден глиогендік бағдарламаларға ауысуға сәйкес келеді. Постнатальды үлгілер жетілген нейрондармен және дифференциацияланған глиальды популяциялармен, соның ішінде астроциттермен және олигодендроциттер сызығының жасушаларымен байытылған. Жүйке қыртысы мен одан шыққан нейрондар негізінен ерте эмбриональды кезеңдерде байқалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;HuDeHA атласы 658 059 жасушаны 20 негізгі сыныпқа біріктіріп, пренатальды кезеңдегі радиальды глиядан постнатальды кезеңдегі жетілген нейрондар мен глияға ауысуды көрсетті.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Үлгілердің донорлық жасы даму кезеңдеріне бөлініп, жасуша популяциялары бойынша таралуын көрсету үшін эмбеддингке прожекцияланды (1E-сурет, S1D-сурет). Меллон негізіндегі жасуша тығыздығын бағалау негізгі популяцияларға сәйкес келетін тығыз үлгі алынған аймақтарды және глиальды ізашарлар сияқты сирек немесе өтпелі күйлерге сәйкес келетін сирек аймақтарды көрсетті (1F-сурет). Даму әлеуетін тікелей бағалау үшін авторлар CytoTRACE2 әлеует ұпайын есептеді (1G-сурет; S1C-сурет). Нейрондық сызық бойымен даму әлеуеті пролиферацияланатын ізашарлар мен радиальды глиядан (CytoTRACE2 медианалық ұпайлары сәйкесінше 0,57 және 0,57) IPC арқылы (0,43) ерте және жетілген нейрондарға дейін (сәйкесінше 0,09 және 0,05) біртіндеп төмендеді, бұл нейрондық дифференциация барысында даму әлеуетінің біртіндеп жоғалуына сәйкес келеді. Жүйке қыртысы, мезенхима және жұлын/ми бағаны жасушаларын қоса алғанда, басқа ізашартәрізді популяциялар жоғары әлеует ұпайларын көрсетті. Керісінше, олигодендроциттер, астроциттер және эпендимальды жасушаларды қамтитын постнатальды кезеңмен байланысты дифференциацияланған популяциялар ең төменгі әлеует ұпайларын көрсетті.&lt;/p&gt;\n&lt;h4 id=\"hudeha-fad-organoidtarynyng-derekterin-referenske-negizdelgen-tuerde-saejkestendiruge-muemkindik-beredi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#hudeha-fad-organoidtarynyng-derekterin-referenske-negizdelgen-tuerde-saejkestendiruge-muemkindik-beredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HuDeHA fAD органоидтарының деректерін референске негізделген түрде сәйкестендіруге мүмкіндік береді&lt;/span&gt;&lt;/a&gt;HuDeHA fAD органоидтарының деректерін референске негізделген түрде сәйкестендіруге мүмкіндік береді&lt;/h4&gt;\n&lt;p&gt;Индукцияланған плюрипотентті дің жасушаларынан (iPSC) алынған ми органоидтарының деректер жиыны Perez-Corredor және әр. [18] жұмысынан алынды және PSEN1 мен APOE статусы бойынша анықталған төрт генотиптік топты қамтыды: PSEN1WT/APOEWT, PSEN1WT/APOEChristchurch (APOECh), PSEN1E280A/APOEWT және PSEN1E280A/APOECh. Деректер жиыны екі донорлық iPSC фонынан бастау алатын сегіз CRISPR жасушалық линиясынан жасалған сегіз scRNA-seq кітапханасынан тұрды, секвенирлеуге дейін әрбір жасушалық линия үшін алты органоидтан біріктірілді. Авторлар scPoli [19] әдісін қолданды; бұл референстік және сұраушы жасушалар арасында ортақ жасырын көріністі үйренетін және референске негізделген жасуша класының белгілерін сұраушы деректер жиынына тасымалдайтын жартылай бақыланатын нейрондық желіге негізделген референстік карта жасау жүйесі (2A-сур.). Модель HuDeHA референсінде оқытылды және кейін ми органоидтарындағы жасушаларды аннотациялау үшін пайдаланылды. Бұл тәсіл прогениторлар, нейрондар, эпителиальды/вентрикулярлық, мезенхимальды және NC-тен шыққан линияларды анықтады (2B-сур.). Бұл кезеңде дифференцияланған глиальды немесе иммундық/тамырлық популяциялар анықталған жоқ. Нейрондық линия ішінде аралық прогениторлық жасушалар (IPCs), сондай-ақ ерте және жетілген нейрондар анықталды, алайда олар айтарлықтай әртүрлі пропорцияларды құрады: ерте нейрондар (19 131 жасуша) мен радиальды глия (18 384 жасуша) басым болды, ал IPCs (1308 жасуша) және жетілген нейрондар (877 жасуша) тек азшілік популяцияларды құрады. IPC популяциясы ASCL1 мен HES6 экспрессиялады, бұл ерте нейрогендік аралық күйге сәйкес келеді, ал EOMES жасушалардың &amp;lt;1% бөлігінде анықталды. Ерте нейрондар TUBB3, STMN2 және DCX экспрессиясын күшті көрсетті, ал жетілген нейрондар GRIN2B пен GRIA2 экспрессиялады (2C, D-сур.). Күшті S100B сигналы байқалды және негізінен NC компартментіне карта жасалды (2B, C-сур.), ол сондай-ақ MPZ, FOXD3 және SOX10 экспрессиялады (2D-сур.) және эпендимдік жасушаларда қосымша карта жасау байқалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;scPoli — бұл нейрондық желілерге негізделген машиналық оқыту әдісі, ол бұрыннан белгілі биологиялық атластағы (референстегі) жасуша белгілері туралы ақпаратты жаңа эксперименталды деректерге тасымалдауға мүмкіндік береді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель жалпы алғанда төмен аннотация-белгісіздік ұпайларын көрсетсе де, эпендима, глиальды прогениторлар және хороидты өрім сияқты кейбір популяциялар салыстырмалы түрде жоғары белгісіздік көрсетті (S2A-сур.). Зерттеушілер органоидтар деректер жиынының баламалы орналасуымен бірге каноникалық маркерлерді зерттеді. Талдау HuDeHA-да нақты ұқсастығы жоқ, CFAP126, CFAP144, CFAP276, CFAP141 және CFAP90 экспрессиялайтын жеке CFAP-қа бай популяцияны анықтады (S2B-сур.). Сондықтан біз бұл популяцияны органоидқа тән класс ретінде қостық және оны ерте эпендима деп белгіледіiz. Бұл жасушалар FOXJ1 мен кірпіктердің түзілу бағдарламасын ішінара экспрессиялады, бірақ бірнеше негізгі аксонемалық динеин мен кірпіктерді құрастыру гендеріне ие болмады. Эпендимаға ұқсас жасушалар сондай-ақ вентрикулярлық эпителиальды дифференцировканың толық еместігіне сәйкес келетін хороидты өрім маркерлерімен ішінара қиылысуын көрсетті. Глиальды прогениторлар популяциясы төбе пластинкасы / дорсальды орта сызық прогениторлық маркерлеріне, соның ішінде LMX1A/B, MSX1, GDF7-ге байығанын көрсетті (S2C-сур.). WNT тұқымдасы гендерінің экспрессиясы бұл популяцияда WNT1/3A үшін таңдалған оңдылықты одан әрі атап көрсетті (2C-сур., S2C-сур.). Керісінше, in vivo бірнеше каноникалық глиальды прогениторлық маркерлер, соның ішінде TNC, BCAN және NFIB органоидтарда әлсіз экспрессияланды немесе мүлдем болмады (S2D-сур.). Радиаális глия да болжам жасау сенімділігінің төмендеуін көрсетті (S2A-сур.), бұл шамамен органоидтардағы гетерогенді радиальды глия күйлерін көрсетеді; бұл жасушалар SOX2 және NES сияқты негізгі радиальды глия маркерлерін экспрессиялады, сонымен бірге глиальды прогениторлармен байланысты гендер үшін ішінара байытуды көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;HuDeHA көмегімен интеграция органоидтарда ерте нейрондардың (19 131 жасуша) және радиальды глияның (18 384 жасуша) басым екенін анықтады, сондай-ақ бастапқы референсте болмаған CFAP және FOXJ1 гендеріне бай ерте эпендима популяциясын бөліп көрсетуге мүмкіндік берді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;In vivo және органоидтық жасуша кластары арасындағы ұқсастықты scPoli негізіндегі аннотацияға тәуелсіз бағалау үшін авторлар екі өзара толықтырушы өлшемді есептеді: Жаккард ұқсастығы және Пирсон корреляциясы. Әрбір жасуша класы үшін ең жақсы 1500 дифференциалды экспрессияланған гендер (DEG) көмегімен есептелген Жаккард ұқсастығы HuDeHA және ми органоидтарындағы классқа тән маркер-ген бағдарламалары арасындағы қабаттасуды сандық түрде бағалады (2E-сур., S3A-C-сур.). Ең күшті сәйкестік органоидтар мен референстік атлас арасында ең жоғары жұптасқан ұқсастықты көрсеткен мезенхимальды жасушалар үшін байқалды (Жаккард = 0.38). Ерте нейрондар да өздерining сәйкес референстік популяциясымен нақты транскрипциялық қабаттасуды көрсетті (Жаккард = 0.32), бұл органоидтарда негізгі нейрондық сәйкестіктің сақталғанын қолдайды. Прогениторлармен байланысты бірнеше популяциялар қатаң біркелкі сәйкестіктен гөрі кеңірек класаралық ұқсастықты көрсетті. Мысалы, пролиферацияланатын прогениторлар органоидтардағы радиальды глиямен және пролиферацияланатын прогениторлармен қабаттасуды көрсетті (сәйкесінше Жаккард = 0.32 және 0.29), бұл ортақ пролиферативті және нейрогендік маркер бағдарламаларына сәйкес келеді. Ерте эпендима популяциясы барлық референстік кластар үшін бірдей төмен ұқсастықты көрсетті, бұл оның дамып келе жатқан гиппокамп атласында жақсы ұсынылмаған органоидта байытылған немесе атипті популяция ретінде жіктелуін қолдайды. Өзіне тән ерекшелік бақылауы ретінде біз органоидтарда болжанбаған референстік популяцияларды, соның ішінде астроциттерді, OPC-терді, олигодендроциттерді және микроглияны енгіздік және ешқандай органоидтық популяциямен күшті ұқсастықты байқамадық (S3B-сур.). Әртүрлі гендер жиындары бойынша Пирсон, Спирмен және Кендалл келісіміне негізделген қосымша талдаулар сол заңдылықты қолдады (S3D-F-сур.). Мезенхимальды жасушалар мен ерте нейрондар референстік атласқа ең жоғары транскрипциялық ұқсастықты көрсетті, ал эпендима, хороидты өрім және ерте эпендима популяциялары төменгі немесе өзгермелі ұқсастықты көрсетті, бұл осы органоидтық күйлердің in vivo референсінен ішінара ауытқуына сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Транскрипциялық профильдерді салыстыру органоидтардағы жасуша күйлері мен in vivo референсі арасында, атап айтқанда эпендимдік және тамырлық популяциялар үшін ішінара алшақтық бар екенін анықтады, бұл in vitro жағдайында олардың фенотиптерінің толық қайталанбайтынын көрсетеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар fAD органоидтар жиынтығындағы даму сатысының ұқсастығын болжау үшін HuDeHA жас аннотацияларына сүйене отырып scPoli алгоритмін қолданды (2F-сурет). Болжанған күйлер ерте пренатальды кезеңдерден постнатальды кезеңдерге дейінгі аралықты қамтып, эмбеддинг кеңістігінде жасқа байланысты орташа ұйымдасуды көрсетті (2G-сурет). Органоид жасушаларының көп бөлігі ерте пренатальды сатыларға, атап айтқанда PCW4–PCW9 аралығына сәйкес келді, ал тек 1%-ға жуығы PCW11 және кейінгі кезеңдерге тиесілі болды. Әрбір жасуша класы үшін жас топтарына тағайындалған жасушалардың үлесі есептеліп, жылу картасы түрінде көрсетілді (2H-сурет). Алынған бөліну күтілетін даму логикасына сәйкес келді: ерте болжанған жастар прогениторлық және нейрондық емес популяцияларда (пролиферацияланатын прогениторлар, мезенхималық және жүйке қыртысы жасушалары) басым болды.&lt;/p&gt;\n&lt;h4 id=\"psen1e280a-organoidtary-zhasusha-klasynyng-khuramy-men-transkripciyalykh-profilderi-bojynsha-erekshelenedi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#psen1e280a-organoidtary-zhasusha-klasynyng-khuramy-men-transkripciyalykh-profilderi-bojynsha-erekshelenedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PSEN1E280A органоидтары жасуша класының құрамы мен транскрипциялық профильдері бойынша ерекшеленеді&lt;/span&gt;&lt;/a&gt;PSEN1E280A органоидтары жасуша класының құрамы мен транскрипциялық профильдері бойынша ерекшеленеді&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер PSEN1E280A органоидтарында PSEN1WT органоидтарымен салыстырғанда негізгі жасуша кластарының құрамында өзгерістер бар-жоғын зерттеді (3A-B-сурет). Жасуша пропорциялары scCODA байестік жүйесі арқылы бағаланды (3B-сурет). Бұл талдау мутантты органоидтарда WT-мен салыстырғанда жүйке қыртысынан шыққан нейрондардың көбейгенін және радиальды глияның азайғанын көрсетті. Жасуша кластары ішіндегі болжанған жас есептелді (3C-сурет). Cliff’s delta көрсеткіші PSEN1E280A органоидтарындағы пролиферацияланатын прогениторлар мен жүйке қыртысы нейрондарының WT-мен салыстырғанда жас екенін көрсетті (сәйкесінше 5.5 пен 6.7 PCW және 5.7 мен 7.4 PCW), ал басқа кластарда айырмашылықтар аз болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PSEN1E280A мутантты органоидтары прогениторлар (5.5 және 6.7 PCW) мен жүйке қыртысы нейрондары (5.7 және 7.4 PCW) үшін болжанған жастың жас мәндерін және жасушалық құрамның өзгерістерін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дифференциалды экспрессия талдауы жүйке қыртысы жасушаларында, жүйке қыртысы нейрондарында және хориоидты өрімде DEG санының ең көп екенін анықтады (3D-сурет). Қайталанатын өзгерістер арасында MEIS2 зрелые және ерте нейрондарда, IPC және глиальды прогениторларда жоғарылады, ал MEIS1 зрелые нейрондарда басым болды. NR2F1 зрелые, ерте нейрондарда және жүйке қыртысы жасушаларында өсті, ал TAC1 зрелые және ерте нейрондарда жоғарылады. Жүйке қыртысы нейрондарында HES6, NEUROD1 және NFIA күшті экспрессияланды. Пролиферацияланатын прогениторларда S100B, LGALS1, S100A10 өсіп, SLIT2, TENM2 азайды; радиальды глияда S100B мен APOE өсіп, RSPO2 азайды; глиальды прогениторларда WNT2B пен WNT4 азайды. IPC-те MEIS2, ID1, ID3, DDIT4 өсіп, DCC, TENM2, TENM3, PCDH9, CADM2 азайды. Адгезия және аксонды бағыттау гендері (CNTNAP2, ROBO1, EPH отбасы) бірнеше популяцияда өзгерді. Қарыншалық аймаққа қатысты популяцияларда хориоидты өрімде және эпендималық жасушаларда TTR төмендеді. Хориоидты өрімде IGF1 мен RSPO2 азайып, FOLR1 өсті. Ерте эпендималық жасушаларда CCNO өсті, ал эпендималық жасушаларда MSX1 өсіп, митохондриялық транскрипттер (MT-CO1, MT-CO2, MT-CO3, MT-CYB, MT-ATP6) төмендеді. Толық тізім S2 кестеде берілген. PSEN1E280A және WT органоидтары арасындағы жолдардың байытылуын салыстыру пролиферацияланатын прогениторларда WNT-пен байланысты көрсеткіштердің төмендегенін көрсетті (S4A-сурет). HuDeHA референттік жасушаларымен салыстыру (S4B-сурет) дифференциацияланған нейрондық популяциялардың ұқсас екенін, ал пролиферацияланатын прогениторларда WNT сигналдарының төмендегенін растады.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;мәтін&lt;/p&gt;\n&lt;h4 id=\"nejrondykh-traektoriyany-taldau-damu-barysynyng-buzyluyn-koersetedi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#nejrondykh-traektoriyany-taldau-damu-barysynyng-buzyluyn-koersetedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейрондық траекторияны талдау даму барысының бұзылуын көрсетеді&lt;/span&gt;&lt;/a&gt;Нейрондық траекторияны талдау даму барысының бұзылуын көрсетеді&lt;/h4&gt;\n&lt;p&gt;Нейрондық желінің траекториясын талдау генотиптер арасындағы жетілу динамикасын салыстыруға және даму барысының бұзылуымен байланысты кандидаттық бағдарламаларды анықтауға негіз берді. Біздің деректер жинағымызда PSEN1E280A мутациясы нейрондық жетілу траекториясы бойымен анағұрлым озық күйлерге қарай ығысумен байланысты екені анықталды. Бұл кейінгі күйлерде нейрондық дифференциацияға, аксон мен дендриттердің дамуына, сондай-ақ синапстық ұйымдасуға қатысатын гендердің күштірек экспрессиясы байқалды. Бұл бақылау отбасылық Альцгеймер ауруының кейбір мутациялары ерте нейрондық дифференциацияны ынталандыра алатынын немесе прогениторлық күйлерден шығуды жылдамдататынын көрсететін бұрынғы зерттеулермен сәйкес келеді. Сонымен қатар, басқа зерттеулер PSEN1L435F сияқты мутацияға тән модельдерде прогениторлардың сақталуын және нейрондық дифференциацияның төмендеуін хабарлады. Бұл қарама-қайшы нәтижелер PSEN1 мутацияларының нейрондық дамуға әсері мутацияға, модельге және сатыға тәуелді екенін көрсетеді. Маңыздысы, мұнда байқалған ығысу толық жетілген нейрондық идентификацияға қол жеткізуді емес, органоидтың даму траекториясы шеңберіндегі салыстырмалы ілгерілеуді білдіреді. Жалпы алғанда, біздің нәтижелеріміз PSEN1E280A ми органоидтарындағы прогениторлық, нейрондық, жүйке қыртысына ұқсас және қарыншалық эпителийге ұқсас популяцияларды қамтитын жасушалық күй балансының бұзылуымен байланысты екенін көрсетеді. HuDeHA гиппокампқа қатысты жүйке күйлерін органоидқа тән популяциялардан ажырату және мутацияға байланысты өзгерістерді адамның ағзасындағы даму контекстінде түсіндіру үшін пайдалы негіз ұсынды. Бұл нәтижелер органоидтық модельдерді түсіндіруді жақсарту және аурумен байланысты жасушалық өзгерістерді даму шеңберіне орналастыру үшін референттік салыстырудың құндылығын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PSEN1E280A мутациясы органоид жасушаларын дифференциация және синапс гендерінің белсендірілуімен жетілудің озық сатыларына ығыстырып, жасушалық балансты бұзады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h4&gt;\n&lt;p&gt;Зерттеудің шектеулеріне келсек, органоидтардың деректер жинағы бұрын жарияланған жалғыз зерттеуден алынған тек екі PSEN1WT және алты PSEN1E280A органоидын қамтыды, бұл статистикалық қуатты және мутацияға байланысты әсерлерді органоидтар арасындағы өзгермеліліктен ажырату мүмкіндігін шектейді. Байқалған жүйке қыртысынан шыққан популяциялардың көбеюі PSEN1E280A тікелей салдары емес, ішінара хаттамаға тәуелді тұқым қуалау спецификасын көрсетуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Талдау шағын іріктеумен шектелген (бір көзден алынған екі бақылау және алты мутантты органоид), ал жасуша популяцияларының өзгерістері өсіру хаттамасына байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"derekterdi-zhinau\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#derekterdi-zhinau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді жинау&lt;/span&gt;&lt;/a&gt;Деректерді жинау&lt;/h4&gt;\n&lt;p&gt;HuDeHA жобасы ұрықтың даму жасын PCW3 аптасынан 15.3 жасқа дейінгі кезеңдерді қамтиды. Бастапқы ашық деректер жиынтығы даму сатысы мен анатомиялық сипаттамасы бойынша үш топқа бөлінді: ерте даму, пренатальды гиппокамп және постнатальды гиппокамп, әр топ жеке біріктірілді. Ерте даму деректері ми, алдыңғы ми және гиппокамп жасушаларын іріктеу үшін сүзгіден өткізілді, ал пренатальды және постнатальды топтар гиппокамп тіндерімен шектелді. Қалған ішкі жиынтықтар бастапқы топтар (батчтар) бойынша бөлініп, жеке объектілер ретінде өңделді және HuDeHA құру үшін біріктірілді. Ерте даму тобы үш жарияланған зерттеуден алынған 70 топ пен 476 237 жасушаны қамтыды. Пренатальды жиынтық үш зерттеуден 15 топ пен 48 679 жасушаны қамтыды. Постнатальды жиынтық екі зерттеуден 22 топ пен 133 143 жасушаны қамтыды. Әр топтың метадеректері S1 кестесінде келтірілген. Ерте кезеңдерде гиппокамп тіндері әрдайым бөлінбегендіктен, ерте даму тобы дене, бас, ми және ганглиозды дөңестердің үлгілерін қамтыды. Жеке біріктіруден кейін бұл деректер ми, алдыңғы ми және гиппокамп популяцияларын сақтау үшін даму, аймақ және линия маркерлері арқылы консервативті түрде сүзгіден өткізілді. Ганглиозды дөңестердің деректері тежеуші нейрондардың дамуына үлес қосатын ізашар жасушаларды жақсақ көрсету үшін қосылды, өйткені гиппокамптың ГАМК-эргиялық интернейрондары даму барысында осы аймақтардан миграция жасайды. Бұл стратегия гиппокампқа тән жиынтықтар бірдей қамтымайтын кезеңдерді біріктіретін үздіксіз даму анықтамалығын жасауға мүмкіндік берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Батчтар (batches) — бұл зертханалар арасындағы техникалық айырмашылықтарды жою үшін математикалық алгоритмдер арқылы біріктірілетін жеке тәжірибе немесе секвенирлеу топтары.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zheke-obuektilerdi-oengdeu\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#zheke-obuektilerdi-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке объектілерді өңдеу&lt;/span&gt;&lt;/a&gt;Жеке объектілерді өңдеу&lt;/h4&gt;\n&lt;p&gt;Әрбір деректер жиынтығы Seurat пакеті (v4.3.0) көмегімен тәуелсіз өңделді. Әр үлгі жеке Seurat объектісі ретінде қарастырылды. Сапаны бақылау (QC) келесі шекті мәндер бойынша жүргізілді: митохондриялық гендердің үлесі percent.mt &amp;lt; 30%, рибосомалық гендердің үлесі percent.rb &amp;lt; 40%, nCount_RNA &amp;gt; 300 және nFeature_RNA &amp;gt; 400. Гендер мен UMI мөлшерінің жоғарғы шектері әр жиынтықтың таралуына қарай анықталды. Сапаны бақылаудан кейін деректер қалыпқа келтіріліп, ауыспалы белгілер FindVariableFeatures(selection.method = \"vst\", nfeatures = 3000) көмегімен анықталды, ал масштабтау vars.to.regress = c(\"percent.mt\", \"percent.rb\", \"S.Score\", \"G2M.Score\") регрессиясы арқылы орындалды. Жасуша циклінің ұпайлары cc.genes.updated.2019 гендер жиынтығымен CellCycleScoring() функциясы арқылы есептелді. Ықтимал дублеттерді жою үшін DoubletFinder пакеті (v2.0.3) қолданылды. Aniқтау үлесі параметрі (pK) paramSweep_v3 көмегімен бірнеше мәндерді тексеру және find.pK арқылы ең жоғары Бинарлы жіктеу метрикасына (BCmetric) ие мәнді таңдау арқылы оңтайландырылды. Күтілетін дублет деңгейі жалпы жасуша санының 5% мөлшерінде орнатылып, modelHorotypic бағалаулары бойынша анықталмайтын гомотиптік дублеттер үшін түзетілді. Дублеттер жойылғаннан кейін әр Seurat объектісі қайта өңделді.&lt;/p&gt;\n&lt;h4 id=\"aralykh-atlastardy-zhinakhtau-erte-damu-satysy\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#aralykh-atlastardy-zhinakhtau-erte-damu-satysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аралық атластарды жинақтау Ерте даму сатысы&lt;/span&gt;&lt;/a&gt;Аралық атластарды жинақтау Ерте даму сатысы&lt;/h4&gt;\n&lt;p&gt;Ерте даму тобының ерте гиппокамп бөлігін сүзу үшін деректер 3 топқа бөлінді: дене және бас бірге (PCW3–8), бүкіл ми (PCW7–12) және ганглиозды дөңестер деректері бөлек (PCW7–16). Дене және бас үлгілері біріктіріліп, содан кейін мидан шыққан жасушалар бөлініп алынды. Бүкіл ми деректер жиынтығы бөлек біріктіріліп, гиппокамп және көршілес теленцефалон популяцияларын таңдау үшін пайдаланылды. Ганглиозды дөңестердің деректері қосымша бөлік ретінде өңделді және кейіннен жалпы біріктіруге қосылды.&lt;/p&gt;\n&lt;h4 id=\"buekil-dene-buekil-bas\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#buekil-dene-buekil-bas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;• Бүкіл дене + бүкіл бас&lt;/span&gt;&lt;/a&gt;• Бүкіл дене + бүкіл бас&lt;/h4&gt;\n&lt;p&gt;PCW3–8 кезеңдерін қамтитын дене және бас деректері бірге біріктіріліп, нәтижесінде алынған объект тек ми жасушаларымен шектелді. Бастапқы стратегия ретінде MapMyCells (RRID:SCR_024672) көмегімен бүкіл ми референсіне негізделген карта жасау орындалып, 0.75 және 0.99 шектері бойынша болжанған кластардың ықтималдықтары бағаланды. Қатаң шек (0.99) ми және миға жатпайтын популяцияларды сәл анығырақ ажыратқанымен, жалпы ажырату оңтайлы болмады. Сондықтан біз бұл стратегияны әдебиеттерден алынған ерте даму ми маркерлерімен — SOX2, VIM, HES1/HES5, PAX6, NES — толықтырдық.&lt;/p&gt;\n&lt;h4 id=\"buekil-mi\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#buekil-mi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;• Бүкіл ми&lt;/span&gt;&lt;/a&gt;• Бүкіл ми&lt;/h4&gt;\n&lt;p&gt;PCW7–12 аралығындағы бүкіл ми деректері біріктіріліп, содан кейін деректер ZBTB20, CALB1, FOXG1, PAX6, LHX5, EMX2, OTX2, NKX2-1 сияқты белгіленген маркерлік гендер негізінде алдыңғы ми және гиппокамп популяцияларымен шектелді.&lt;/p&gt;\n&lt;h4 id=\"gangliozdi-doengester\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#gangliozdi-doengester\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ганглиозді дөңестер&lt;/span&gt;&lt;/a&gt;Ганглиозді дөңестер&lt;/h4&gt;\n&lt;p&gt;PCW7–16 аралығындағы барлық қолжетімді ганглиозды дөңестердің (ganglionic eminences, GE) деректер жиынтығы біріктіріліп, әрбір жасуша үшін CytoTRACE2 бағдарламасы арқылы әдепкі параметрлер бойынша дифференциация әлеуеті анықталды. Содан кейін авторлар ашық қолжетімділіктегі анықтамалық деректерге сүйене отырып, GE жасушаларын аннотациялау әдісін сынап көрді. Алынған нәтижелер қабылданған маркер-гендердің экспрессиясымен және күтілетін аймақтық сәйкестілікпен нашар үйлескендіктен, бұл тәсіл соңғы аннотация үшін қолданылмады. Ілгерінді (progenitor) популяцияларды байыту және дифференциацияланған GE туынды жасушаларының үлесін азайту мақсатында, кейінгі талдауға тек CytoTRACE2 мультипотентті деп жіктеген жасушалар ғана қалдырылды (CytoTRACE2_Potency == \"Multipotent\").&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CytoTRACE2 — бұл ген экспрессиясы деректері негізінде жеке жасушалардың жетілу дәрежесі мен дифференциация әлеуетін бағалайтын есептеу құралы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prenataldy,-postnataldy-kezengder\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#prenataldy,-postnataldy-kezengder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пренатальды, постнатальды кезеңдер&lt;/span&gt;&lt;/a&gt;Пренатальды, постнатальды кезеңдер&lt;/h4&gt;\n&lt;p&gt;Пренатальды және постнатальды гиппокамп деректер жиынтығы бөлек өңделді және біріктірілді. Соңғы біріктіруге дейін эритроциттерді қоса алғанда, бөгде жасушалық популяциялар маркерлік гендердің экспрессиясы бойынша анықталып, жойылды.&lt;/p&gt;\n&lt;h4 id=\"hudeha-integraciyasy\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#hudeha-integraciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;HuDeHA интеграциясы&lt;/span&gt;&lt;/a&gt;HuDeHA интеграциясы&lt;/h4&gt;\n&lt;p&gt;Ерте даму, пренатальды және постнатальды кезеңдердің аралық интеграциясынан кейін гиппокамп құрылымдарына байытылған жасуша жиынтығы бөлініп алынды. Алынған деректер бастапқы топтарға (батчтарға) бөлініп, жеке объектілер ретінде қайта өңделді, нәтижесінде HuDeHA құру үшін кейіннен біріктірілген 107 батч пайда болды. Соңғы интеграция үшін scVI моделі 3000 жоғары вариабельді ген негізінде оқытылды, мұнда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3cj1fe5w\"&gt;batch_key&lt;/code&gt; ретінде бастапқы батч көрсетілді. Гиперпараметрлерді баптау кезінде 128 немесе 256 жасырын бірлік, бір жасырын қабаттан үшке дейін, 20, 30 немесе 40 латентті өлшем және максимум 100 немесе 300 дәуір (эпоха) оқыту ұзақтығы комбинациялары бағаланды. Үш жасырын қабаты, 256 жасырын бірлігі және 30 латентті өлшемі бар соңғы архитектура таңдалды; бұл нұсқа ең төменгі валидациялық шығынға (validation loss) негізделіп, оқыту және валидация қисықтарын талдау, scIB метрикалары мен эмбеддингтегі ген экспрессиясының таралуын бағалау арқылы бекітілді. Соңғы модель валидациялық шығынды бақылайтын және бес дәуірге тең шыдамдылықпен (patience) ерте тоқтату (early stopping) функциясын қоса отырып, ең көбі 100 дәуір бойы оқытылды. scVI латентті кеңістігіндегі жасуша популяциялары алғашында іріктелген маркер-гендер тізімі көмегімен аннотацияланды. Содан кейін оқытылған scVI моделі бастапқы аннотацияларды басшылыққа ала отырып және түпкілікті желі архитектурасын сақтай отырып, scANVI моделіне өзгертілді. scANVI құралы бастапқы маркерлік аннотациядан кейін белгісіз болып қалған жасушаларды қоса алғанда, толық деректер жиынтығы бойынша белгілерді нақтылау және тарату үшін қолданылды.&lt;/p&gt;\n&lt;h4 id=\"derekterdi-aldyn-ala-oengdeu-zhaene-suezgileu\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#derekterdi-aldyn-ala-oengdeu-zhaene-suezgileu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді алдын ала өңдеу және сүзгілеу&lt;/span&gt;&lt;/a&gt;Деректерді алдын ала өңдеу және сүзгілеу&lt;/h4&gt;\n&lt;p&gt;Бастапқы деректер GEO деректер базасынан GSE241453 нөмірімен жүктелді. Әрбір үлгі жоғарыда сипатталған бірыңғай конвейер көмегімен өңделді, ол митохондриялық және рибосомалық сапаны бақылау арқылы сүзгілеуді, дуплеттерді жоюды, жасуша циклін бағалауды және масштабтауды қамтыды. Деректер жиынын біріктіру Seurat v.4 стандартты интеграциялық конвейері арқылы орындалды. Бастапқы аннотациядан кейін митохондриялық гендері жоғары, сапасы төмен немесе күйзеліске ұшыраған жасушаларға сәйкес келетін бір Seurat кластері анықталды. Осы 9359 жасуша жоғарылатылып, қалған деректер жиыны 30 басқа компонентті (30 PC) қолдана отырып Seurat жүйесінде қайта біріктірілды. Жасуша кластарын қолмен нақтылау үшін біз сондай-ақ баламалы scVI эмбеддингін жасадық (&lt;span class=\"yfm-latex\" data-content=\"n%5C_layers%20%3D%202\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"n%5C_latent%20%3D%2020\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, &lt;span class=\"yfm-latex\" data-content=\"n%5C_hidden%20%3D%20128\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) және бұл көріністі scPoli алғашында тасымалдаған жасуша класының белгілерін жетілдіру үшін қолдандық. Белгілер тасымалданған белгілерді, scVI латентті кеңістігіндегі кластер құрылымын және канондік маркерлік гендердің экспрессиясын бірлесіп бағалау арқылы нақтыланды (S2F-G суреті).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scVI және scPoli — бір жасушалы РНК талдауы (single-cell RNA-seq) деректерін өңдеуге арналған заманауи машиналық оқыту алгоритмдері, олар әртүрлі үлгілерді біріктіруге және жасуша түрлерін дәл анықтауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Cell class mapping&lt;/p&gt;\n&lt;p&gt;Жасуша класының аннотацияларын анықтамалық атластан ми органоидтарының деректер жиынына тасымалдау үшін біз scPoli [19] алгоритмін келесі дайындық және оқыту процедурасымен қолдандық. Алдымен анықтамалық және сұраныс деректеріндегі жасуша түрлерінің түйіршіктілігі жақын субтиптерді біріктіру арқылы үйлестірілді: пролиферацияланатын IPC және пролиферацияланатын радиалды глия (Radial glia proliferating) пролиферацияланатын ата-тектілер (Proliferating progenitors) ретінде, CR нейрондары жетілген нейрондармен (Mature neurons), ал иммундық жасушалар мен микроглия микроглияға (Microglia) біріктірілді. Шамадан тыс үйреніп кетудің (overfitting) алдын алу және салыстырмалы белгілер кеңістігін қамтамасыз ету үшін төмен экспрессиялы гендерді сүзгілеу анықтамалық және сұраныс деректер жиындарында бөлек орындалды, содан кейін талдау екі жиында да сақталған 22467 генмен шектелді. scPoli моделі 10 өлшемді эмбеддингпен, 20 өлшемді латентті кеңістікпен, 128 түйіні бар бір жасырын қабатпен және теріс-биномдық реконструкциялау шығын функциясымен оқытылды. Ерте тоқтату (early stopping) валидациялық прототиптің шығындарын 20 дәуір төзімділігімен минимизациялау режимінде бақылады. Оқыту жылдамдығы 13 дәуір төзімділігі мен 0.1 азайту коэффициенті арқылы платоға жеткенде төмендетілді. Валидациялық прототиптің шығындары ең төмен болған модель бақылау нүктесі сақталып қалуы үшін қалдырылды.&lt;/p&gt;\n&lt;p&gt;Даму жасын картаға түсіру&lt;/p&gt;\n&lt;p&gt;Уақытша ажыратымдылықты үйлестіру және кластардың теңгерімсіздігін азайту үшін жасушалары аз ұсынылған даму жастары кеңірек санаттарға төмендегідей біріктірілді: PCW23 және PCW25 — PCW23–25 ретінде; 0.1–4.3 жыл; 6–6.7 жыл; 13–15.3 жыл. Бұл біріктірулер анықтамалық атластағы жас санаттарының жиілігін теңгерімді етті. Органоидтық жасушалар үшін нақты даму жастары болмағандықтан, кейιнгі талдаулар максималды апостериорлық сынып ықтималдығы кемінде 0.75 болатын жоғары сенімді болжамдармен шектелді. Даму жасын болжау жоғарыда сипатталған scPoli моделінің архитектурасы мен оқыту параметрлерін қолдана отырып жүзеге асырылды, мұнда даму жасы тобы бақыланатын белгі ретінде пайдаланылды.&lt;/p&gt;\n&lt;p&gt;Compositional analysis&lt;/p&gt;\n&lt;p&gt;PSEN1E280A органоидтары (MUT; n = 6) мен жабайы типтегі органоидтар (WT; n = 2) арасындағы жасушалық құрамның айырмашылықтары жалғыз жасушалы композициялық деректерді талдауға арналған Байестік модель — scCODA көмегімен бағаланды [27]. scCODA автоматты эталонды таңдау процедурасы жетілген нейрондарды (Mature Neurons) эталонды жасуша класы ретінде анықтады. Бұл популяция салыстырмалы түрде аз болғандықтан, эталонды таңдауға тұрақтылық қалған әрбір жасуша класын балама эталон ретінде қолданып, талдауды қайталау арқылы бағаланды. Радиалды глия және жүйке қыртысынан шыққан нейрондар (NC-derived neurons) үшін анықталған әсерлер эталонды таңдауға қарамастан тұрақты болып қалды.&lt;/p&gt;\n&lt;p&gt;Ми органоидтарындағы даму жасын салыстыру&lt;/p&gt;\n&lt;p&gt;PSEN1E280A және PSEN1WT органоидтары арасындағы болжанған даму жастарын салыстыру үшін талдаулар әрбір жасуша класы шегінде бөлек орындалды. Болжанған жас мәндері үздіксіз сандық шкалаға түрлендіріліп, екі жақты Манн-Уитни U-тесті арқылы генотиптер арасында салыстырылды. Кез келген генотип тобында 10-нан аз жасушамен ұсынылған жасуша кластары статистикалық тестілеуден шығарылды. P-мәндері Бенджамини-Хохберг жалған жаңалық деңгейі (FDR) процедурасын қолдана отырып, жасуша кластары бойынша бірнеше тесттер үшін түзетілді. Әсер өлшемдері Клифф дельтасы арқылы бағаланды, мұнда оң мәндер PSEN1E280A жасушаларында WT жасушаларына қарағанда үлкенірек болжанған даму жастарын көрсетеді. Статистикалық маңыздылық ретінде түзетілген p-мәні &amp;lt; 0.05 пайдаланылды.&lt;/p&gt;\n&lt;p&gt;HuDeHA және ми органоидтарындағы дифференциалды экспрессия&lt;/p&gt;\n&lt;p&gt;PSEN1E280A және PSEN1WT ми органоидтары арасындағы дифференциалды экспрессияны талдау Seurat FindMarkers көмегімен әрбір жасуша класы ішінде бөлек орындалды. Әрбір жасуша класы үшін жасушалар шарттар бойынша бөлініп, дифференциалды экспрессия Уилкоксонның рангтер қосындысы тесті арқылы тексерілді. Дифференциалды экспрессияланған гендер абсолютті log2fold change ≥ 0.5 және түзетілген p-мәні &amp;lt; 0.05 болғандар ретінде анықталды.&lt;/p&gt;\n&lt;p&gt;HuDeHA және ми органоидтарындағы жолдардың байытылуы&lt;/p&gt;\n&lt;p&gt;Жолдарды байыту талдауы үшін біз Notch және WNT сигналдық жолдарына, нейрондық және глиальды дифференциацияға, сондай-ақ жасуша тағдырын анықтауға қатысты MSigDB C5 жинағынан таңдалған GO және HP гендер жиындарының ішкі жиынтығын қолдана отырып ssGSEA орындадық. Әрбір жасуша үшін байыту ұпайлары escape v.1.10.0 пакеті [60] мен әдепкі параметрлері бар enrichIt функциясы арқылы есептелді. Ми органоидтарын HuDeHA-мен салыстыру үшін анықтамалық атластың жасушалары органоидтық деректер жиынында болжанған даму жасы аралықтарымен шектеліп, сәйкес жасуша кластары шегінде талданды. Бұл даму сатысының әсерлерін азайтуға және жол белсенділігін көбірек салыстырмалы жасушалық контекстте бағалауға мүмкіндік берді.&lt;/p&gt;\n&lt;h4 id=\"zhakkard-ukhsastyghy\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#zhakkard-ukhsastyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жаккард ұқсастығы&lt;/span&gt;&lt;/a&gt;Жаккард ұқсастығы&lt;/h4&gt;\n&lt;p&gt;HuDeHA мен ми органоидтары арасындағы транскрипциялық ұқсастықты сәйкес келетін жасуша кластары немесе даму кезеңдері бойынша бағалау үшін авторлар арнайы маркерлік гендер жиынтықтары негізінде Жаккар ұқсастығын қолданды. Дифференциалды экспрессия әрбір деректер жинағы үшін scanpy көмегімен scanpy.tl.rank_genes_groups функциясы және Wilcoxon rank-sum тесті арқылы дербес есептелді. Гендер Scanpy статистикасы бойынша реттеліп, әрбір жасуша класы немесе уақыт тобы үшін топтық маркерлер жиынтығын анықтайтын үздік n ген таңдалды. Кейιнгі салыстырулар үшін тек екі деректер жинағында да анықталған гендер ескерілді. HuDeHA және органоидтардың сәйкестендірілген жұптары үшін Жаккар ұқсастығы J(G₁, G₂) формулусы арқылы G₁ және G₂ жиындарының қиылысу көлемінің олардың бірігу көлеміне қатынасы ретінде есептелді.&lt;/p&gt;\n&lt;p&gt;HuDeHA және ми органоидтарының жасуша кластары деңгейіндегі транскрипциялық ұқсастығы төрт белгілер жиынтығы арқылы бағаланды: HuDeHA-да анықталған 3000 жоғары вариабельді ген (HVG), органоидтар деректер жинағындағы 3000 HVG, екі HVG жиынтығының қиылысуы (944 ген) және олардың бірігуі (5056 ген). Әрбір жасуша класындағы әрбір ген үшін орташа қалыптасқан экспрессия есептелді, ал HuDeHA мен органоидтар арасындағы жұптық ұқсастық Пирсон, Спирмен және Кендалл корреляция коэффициенттері көмегімен өлшенді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жаккар ұқсастығы — бұл екі жиын элементтерінің ортақ бөлігінің барлық элементтер жиынтығына қатынасын көрсететін және әртүрлі модельдердегі маркерлік гендер жиындарының қаншалықты ұқсас екенін түсінуге көмектесетін қарапайым көрсеткіш.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhasusha-taghdyrynyng-traektoriyasyn-bolzhau\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#zhasusha-taghdyrynyng-traektoriyasyn-bolzhau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасуша тағдырының траекториясын болжау&lt;/span&gt;&lt;/a&gt;Жасуша тағдырының траекториясын болжау&lt;/h4&gt;\n&lt;p&gt;HuDeHA және органоидтар деректер жинақтары арасындағы нейрондық дифференциация траекторияларын салыстыру үшін зерттеушілер екі жиыннан аралық ізашар жасушаларды (IPCs), ерте нейрондарды және жетілген нейрондарды қоса алғанда, нейрондық сызық популяцияларын бөліп алды. Анықтамалық атлас пен органоидтар арасындағы жасушалар санының теңгерімсіздігін азайту үшін HuDeHA нейрондық сызық ішкі жиынтығы кездейсоқ түрде 18 000 жасушаға дейін азайтылды (downsampling), бұл органоидтардағы 17 296 нейрондық сызық жасушаларына жақын келеді. Процедура қайталануды қамтамасыз ету үшін тұрақты кездейсоқ тұқым (random seed) көмегімен орындалды.&lt;/p&gt;\n&lt;p&gt;Траекторияларды реконструкциялау техникалық ауытқулар мен батч-эффекттердің әсерін азайту үшін scVI негізіндегі латенттік көріністе жүзеге асырылды. Бірінші кезекте зерттеушілер 30 жақын көрші көмегімен k-жақын көрші графтарын құру үшін Palantir [61] қолданды және neigs = 2 кезінде диффузия компоненттерін есептеді. Псевдоуақытты бағалау және траекторияны визуализациялау scFates [62] көмегімен орындалды. Визуализация үшін ForceAtlas2 орналасуы траектория көрсетілімінің алғашқы екі компоненті арқылы іске қосылды.&lt;/p&gt;\n&lt;h4 id=\"zhasushanyng-potenciyasy-men-tyghyzdyghyn-taldau\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#zhasushanyng-potenciyasy-men-tyghyzdyghyn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасушаның потенциясы мен тығыздығын талдау&lt;/span&gt;&lt;/a&gt;Жасушаның потенциясы мен тығыздығын талдау&lt;/h4&gt;\n&lt;p&gt;HuDeHA деректеріндегі жасушалық потенция бір жасушалы RNA-seq профильдері негізінде стандартты параметрлермен CytoTRACE2 [56] арқылы бағаланды. Жасуша күйінің тығыздығы scANVI латенттік кеңістігіндегі барлық 20 латентті өлшемдерді (ncomponents = 20) пайдалана отырып, Mellon [63] көмегімен барлық HuDeHA жасушалары үшін есептелді. Mellon біріктірілген латентті кеңістік ішіндегі жергілікті шоғырлануды білдіретін әрбір жасуша үшін лог-тығыздық бағасын жасады, қалған барлық параметрлер әдепкі бойынша қалдырылды.&lt;/p&gt;\n&lt;p&gt;HuDeHA үшін UMAP эмбеддингінде түстік кодтау даму сатыларына сәйкес келетін жас топтарын, Mellon жасуша тығыздығының қабатын және ізашарлардан дифференциацияланған түрлерге дейін төмендейтін CytoTRACE2 потенция градиентін көрсетеді (E–G суреттері). Ми органоидтарында қайта құрылған нейрондық сызық траекториясы scFates псевдоуақыты, жағдайлар (PSEN1WT пен PSEN1E280A) және псевдоуақыт биндері бойынша түстермен белгіленген (B–B'' суреттері). Псевдоуақыт бойынша жасуша тығыздығының таралуы траекторияны 6 бинге бөлуге мүмкіндік берді, бұл PSEN1E280A органоидтарында кейінгі кезеңдерде айтарлықтай байытылудың бар екенін көрсетті (C суреті). Жолдарды байыту талдауы бұл өзгерістің жасуша өлімі немесе стресспен емес, жетілгендік маркерлерімен байланысты екенін көрсетті (D суреті), ал жылу картасы NEUROG1, CXCR4, NEUROD4, SNAP25, SYT1 және VAMP2 сияқты негізгі динамикалық гендерді көрсетеді (E суреті).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f1.jpg\" alt=\"1-сурет. Адамның дамып келе жатқан гиппокамп атласы (HuDeHA) ерте эмбриональды кезеңдерден постнатальды кезеңдерге дейін\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Адамның дамып келе жатқан гиппокамп атласы (HuDeHA) ерте эмбриональды кезеңдерден постнатальды кезеңдерге дейінгі гиппокамптың дамуының уақытча динамикасын көрсетеді. (A) 20 аннотацияланған жасуша класын көрсететін Адамның дамып келе жатқан гиппокамп атласынын (HuDeHA; 658 059 жасуша) UMAP проєкциясы. Атлас радиальды глия мен аралық ізашар жасушалардан (IPC) ерте және жетілген нейрондарға дейінгі нейрондық сызықты, сондай-ақ пролиферацияланатын радиальды глия мен IPC күйлерін; глиальды ізашарларды, олигодендроциттердің ізашарларын (OPC), олигодендроциттер мен астроциттерді қамтитын глиальды сызықты; эктодермальды емес нейрондық популяцияларды (эпендима мен хориоидты өрім); нерв қырқасын (NC) және NC-нан туындаған нейрондарды; эктодермальды емес популяцияларды (мезенхималық, эндотелиальды, микроглиальды/миелоидты және басқа иммундық жасушалар), сондай-ақ жұлын/мишықпен байланысты шағын топты қамтиды. (B) Даму барысындағы (концепциядан кейінгі апта (PCW) 3 пен 15,3 жыл аралығында) жасуша класы пропорцияларының тығыздығы нейрогенезден глиогенезге және постнатальды байланысты жасуша кластарының пайда болуына дейінгі күтілетін ауысуларды көрсетеді: эмбриональды үлгілерде радиальды глия мен NC басым; ұрық кезеңінде IPC пен глиальды ізашарлар пайда болады, ал жетілген нейрондар астроциттер мен олигодендроциттермен бірге постнатальды кезеңде басым болады. (C) Даму жасы бойынша анықталған, даму барысындағы жеке жасуша кластарының пропорционалды динамикасы. (B)-ге қосымша ретінде, бұл көрініс жеке кластардың пайда болу және сарқылу уақытын көрсетеді: радиальды глия мен ерте нейрондардың эмбриональды басымдығы, NC-ден туындаған жасушалардың біртіндеп жоғалуы және глиальды ізашарлардың кеңеюі, сондай-ақ OPC, олигодендроциттер мен астроциттермен қатар жетілген нейрондардың постнатальды басымдығы. (D) Барлық 20 аннотацияланған жасуша кластарындағы каноникалық маркерлердің экспрессиясын көрсететін нүктелік график (dotplot): радиальды глия (VIM, SOX2), IPC (EOMES), пролиферацияланатын радиальды глия және IPC (TOP2A, MKI67), ерте (DCX) және жетілген нейрондар (SNAP25), Кахаль-Ретциус (CR) нейрондары (RELN), глиальды ізашарлар (BCAN), OPC (OLIG1), олигодендроциттер (MBP), астроциттер (GFAP), эктодермальды емес нейрондық популяциялар – эпендима (PIFO), хориоидты өрім (TTR), NC (MPZ) және NC-ден туындаған нейрондар (ISL1), мезенхима (DCN), эндотелий (CLDN5), микроглиалық (CX3CR1) және иммундық жасушалар (CD3D), жұлын/мишық тобы (CDX2/4).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f2.jpg\" alt=\"2-сурет. HuDeHA-ға сілтемелік карта жасау iPSC-тен алынған ми органоидтарын in vivo гиппокамп жасушалық күйлерімен және \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. HuDeHA-ға сілтемелік карта жасау iPSC-тен алынған ми органоидтарын in vivo гиппокамп жасушалық күйлерімен және даму уақытымен салыстыруға мүмкіндік береді. (A) Талдау жұмыс үрдісінің схемасы. HuDeHA (3 PCW пен 15,3 жыл аралығындағы; 20 аннотацияланған жасуша класы) iPSC-тен алынған PSEN1WT және PSEN1E280A адам ми органоидтарына жасуша класы мен даму жасы белгілерін scPoli негізінде тасымалдау үшін анықтамалық ретінде қызмет етті. scPoli анықтамалық пен сұрау арасындағы гендер жиынтығының қиылысында (22 467 ген) оқытылды және белгілерді болжау үшін органоидтық жасушалар зерттелген латентті кеңістікке проецияланды. (B) HuDeHA-дан шығарылған 12 болжанған жасуша класы бойынша боялған iPSC-тен алынған адам ми органоидтарының UMAP, одан кейін шектеулі қолмен түзету (Әдістерді қараңыз). Жұлдызшалар HuDeHA-ға қатысты жаңадан анықталған немесе біріктірілген кластарды белгілейді: \"ерте эпендима\" (қолмен қосылған, HuDeHA-да жоқ) және \"пролиферацияланатын ізашарлар\" (пролиферацияланатын радиальды глия мен пролиферацияланатын IPC жиынтығы). (C) Органоидтық біржасушалық эмбеддинг бойынша таңдалған аймақтық және сызықтық маркерлердің сипаттамалық сюжеттері (feature plots). PAX6 кең дорсальды ізашар компартментін, GRIA2 бөлек жетілген нейрондық популяцияны, S100B басым түрде эпендима тәрізді жасушаларда қосымша экспрессиясы бар NC популяциясын, ал WNT1 шатыр пластинасының немесе кортикальды дөңгешектің сәйкестігіне сәйкес келетін шағын дорсальды ортаңғы сызық тәрізді популяцияны белгіледі. (D) Болжанған органоидтық жасуша кластары үшін маркер-ген экспрессиясының нүктелік графигі: пролиферацияланатын ізашарлар (TOP2A, MKI67); радиальды глия (SOX2); IPC (ASCL1); ерте нейрондар (TUBB3) және жетілген нейрондар (GRIN2B); NC-ден туындаған нейрондар (ISL1); глиальды ізашарлар (SOX9); ерте эпендима (CFAP144) және эпендима (FOXJ1); хориоидты өрім (TTR); NC (MPZ, FOXD3); мезенхима (DCN, PRRX1). (E) Класс бойынша ең жақсы 1 500 дифференциалды экспрессияланатын (DE) гендер бойынша есептелген HuDeHA және органоидтық жасуша кластары арасындағы Жаккард ұқсастығының жылу картасы, кластық маркер-ген бағдарламалары арасындағы сәйкестікті сандық түрде анықтайды. (F) Даму сатыларына біріктірілген шығарылған жас бинттері бойынша боялған органоидтардың UMAP. (G) Логарифмдік шкала бойынша жасуша саны осіндегі болжанған даму жасының бөлінуі. Жасушалар органоидты жинаудың бір уақыт нүктесінде кең даму гетерогенділігін қамтиды: жасушалардың көп бөлігі PCW4-PCW9-ға карталанады, ал кішірек бөлігі постнатальды кезеңдерге тағайындалады. (H) Болжанған жас бинттері бойынша жасуша класы пропорцияларының жылу картасы. Ерте сатымен байланысты кластар (пролиферацияланатын ізашарлар, NC-ден туындаған нейрондар) жас пренатальды жастар үшін байытылды, ал кейінгі сатымен байланысты кластар (хориоидты өрім, эпендима, жетілген нейрондар, олигодендроциттер)...&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f3.jpg\" alt=\"3-сурет. PSEN1E280A өзгерген сызық балансымен және нейрондық спецификацияның, ізашар және қарыншалық бағдарламалардың жа\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. PSEN1E280A өзгерген сызық балансымен және нейрондық спецификацияның, ізашар және қарыншалық бағдарламалардың жасуша класына тән дисрегуляциясымен байланысты. (A) Жағдайлар бойынша бөлінген (PSEN1WT үшін n = 2 және PSEN1E280A органоидтары үшін n = 6) ми органоидтарының UMAP, болжанған жасуша класы бойынша боялған, жағдайлар арасындағы жасуша класының таралуындағы айырмашылықтарды көрсетеді. (B) Әрбір жасуша класының жағдайлар бойынша пайыздық құрамын көрсететін жинақталған бағанды графиктер. Жұлдызшалар жағдайлар арасындағы салыстырмалы мөлшері айтарлықтай өзгеше жасуша кластарын көрсетеді. WT органоидтарымен салыстырғанда, PSEN1E280A органоидтары NC-ден туындаған нейрондардың үлесінің артуын және радиальды глия үлесінің төмендеуін көрсетті. Оң жақтағы кесте әрбір жағдайдағы әрбір жасуша класының нақты пайызын береді. (C) Біріктірілген деректер жиынтығы бойынша орташа мәннің кему ретімен реттелген жасуша класы бойынша орташа болжанған даму жасының жылу картасы. Жұлдызшалар Клифф дельтасы арқылы бағаланған жағдайлар арасындағы маңызды жас айырмашылықтары бар жасуша кластарын белгілейді. Шектеулер: түзетілген p-мәні ≤ 0.05. (D) Жасуша класы бойынша шешілген PSEN1 E280A пен WT органоидтарындағы дифференциалды экспрессияланатын гендер. Жоғары реттелген гендер қызыл түспен, төмен реттелгендер жасыл түспен көрсетілген; жасуша кластары жалпы DE-ген санының кему ретімен реттелген. Әрбір класс үшін ең жақсы 10 ең ақпараттық гендер белгіленген; log2FC осі визуализация үшін масштабталған. Шектеулер: түзетілген p-мәні ≤ 0.05, /log2FC/ ≥ 0.5.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f3-2.jpg\" alt=\"Сурет 3 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4.jpg\" alt=\"4-сурет. PSEN1E280A нейрондық дифференциацияны көбірек жетілген даму күйлеріне өзгертеді. (A) Нейрондық сызық траектория\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. PSEN1E280A нейрондық дифференциацияны көбірек жетілген даму күйлеріне өзгертеді. (A) Нейрондық сызық траекториясын талдау схемасы. IPC, ерте нейрондар және жетілген нейрондар iPSC-тен алынған ми органоидтарынан да, HuDeHA-дан да бөлініп алынды және жалған уақыт траекторияларын қайта құру үшін пайдаланылды. Органоидтық траекториялар жағдайлар арасында (PSEN1WT және PSEN1E280A) салыстырылды және in vivo HuDeHA анықтамалығымен бенчмаркінг жасалды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4-2.jpg\" alt=\"Сурет 4 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4-3.jpg\" alt=\"Сурет 4 (жалғасы 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4 (жалғасы 3)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca-f4-4.jpg\" alt=\"Сурет 4 (жалғасы 4)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4 (жалғасы 4)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ми органоидтар&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ының құрылымын&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бағалау&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қиындығы&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;658 мың&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасушадан&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тұратын&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гиппокамп&lt;/text&gt;&lt;text x=\"226\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;атласы құрыл&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt; ually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;bioRxiv&lt;/td&gt;\n&lt;td&gt;neuroscience&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Ivleva, E.; Kruikov, E.; Arboleda-Velasquez, J. F.; Baranov, P.&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.64898/2026.09.18.752796\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;doi.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"boelisu\"&gt;&lt;a href=\"2026-09-22/a-lifespan-single-cell-atlas-of-the-human-developing-hippoca.html#boelisu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бөлісу&lt;/span&gt;&lt;/a&gt;Бөлісу&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"180\" height=\"208\"&gt;&lt;rect width=\"180\" height=\"180\" fill=\"#fff\" rx=\"5.51\"&gt;&lt;/rect&gt;&lt;path fill=\"#111\" d=\"M7.35 7.35h25.76v3.72H7.35zM40.41 7.35h3.72v3.72h-3.72zM58.78 7.35h3.72v3.72h-3.72zM77.14 7.35h3.72v3.72h-3.72zM84.49 7.35h3.72v3.72h-3.72zM99.18 7.35h3.72v3.72h-3.72zM113.88 7.35h11.07v3
