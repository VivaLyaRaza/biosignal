        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"210\" cy=\"141\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"670\" cy=\"250\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Тұмау мида із қалдырады:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LRRK2 мутациясы ақуыз&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өзгерістерін қалай қоздырады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f1.jpg\" alt=\"1-сурет. Lrrk2G2019S аллельдері тұмау А вирусымен (H1N1) мұрын арқылы инфицирленген тышқандардың өкпесіндегі тіршілік ет\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Lrrk2G2019S аллельдері тұмау А вирусымен (H1N1) мұрын арқылы инфицирленген тышқандардың өкпесіндегі тіршілік ету қабілетіне, салмақтың өзгеруіне немесе вирус титріне әсер етпейді. Бұл зерттеуде қолданылған эксперименттік уақыт шкаласы (A). Ересек тышқандарға (еркек және ұрғашы; жасы 5-7 апта) тұмау А вирусының (H1N1 серотипі) 2 × бляшка түзуші бірлігі (PFU) мұрын арқылы енгізілді. Тіршілік ету қабілеті инокуляциядан кейінгі күндерге (p.i.) қатысты пайыыз ретінде графикалық түрде көрсетілген (B, E), ал салмақтар p.i. күндеріне қатысты бастапқы дене салмағының пайызы ретінде көрсетілген (C, F). Деректер ұрғашы (B-D) және еркек (E-G) тышқандар үшін бөлек көрсетілген. Вирус титрлері p.i. 3-күні өкпеде өлшенді (D, G). Әрбір таңба бір жануарды білдіреді. Қателік сызықтары орташа ± стандартты қатені (SEM) білдіреді. WT = жабайы тип; GS = Lrrk2G2019S мутантты аллелі. Қолданылған статистикалық тесттер: тіршілік ету қисықтары үшін лог-рангтық (Мантел-Кокс) тест; вирус титрін талдау үшін бір факторлы дисперсиялық талдау (ANOVA).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Паркинсон ауруына генетикалық бейімділігі бар адамдардың кейбірінде белгілер байқалса, басқаларында неге білінбейді? Зерттеушілер бұған жұқпалы аурулар сияқты сыртқы факторлар түрткі болады деп болжады. Тышқандарға жасалған тәжірибе тұмау вирусы LRRK2 геніндегі мутация аясында ми тіндегі ақуыздардың жиналуына әкелетінін көрсетті. Бұл жаңалық нейродегенеративті аурулардың даму механизмін түсінуге көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;LRRK2 мутациялары тышқандарда өткір тұмаудың ауырлығын өзгертпейді&lt;/li&gt;\n&lt;li&gt;Тұмаудан алты апта өткен соң мида pSer129 альфа-синуклеин деңгейі өседі&lt;/li&gt;\n&lt;li&gt;Инфекция мидағы тотығу стресс пен ақуыз модификациясын күшейтеді&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;LRRK2 геніндегі мутациялар Паркинсон ауруы қаупін арттырады, бірақ патология барлық тасымалдаушыларда дами бермейді. Бұған дейін ғалымдар аурудың көрінуі үшін вирустық инфекция сияқты қосымша сыртқы әсер қажет деп болжаған. Зерттеушілер тобы LRRK2 мутациясы бар (соның ішінде киназа белсенділігі жоғары p.G2019S нұсқасы) тышқандарды H1N1 тұмау вирусымен зақымдап, осы гипотезаны тексеріп көрді.&lt;/p&gt;\n&lt;p&gt;Инфекцияның өткір фазасы мен жануарлардың өмір сүру деңгейі ерекшеленбесе де, алты аптадан кейінгі талдау алаңдатарлық өзгерістерді көрсетті. Гомозиготты LRRK2 p.G2019S мутациясы бар аман қалған тышқандардың миында фосфорланған альфа-синуклеин (pSer129) мен тау-ақуыз (pSer199) деңгейінің өскені анықталды. Сондай-ақ ми протеомында тотығу стресс белгілерінің артқаны тіркелді.&lt;/p&gt;\n&lt;p&gt;Алынған деректер тыныс жолдарының вирустық инфекциясы генетикалық осал ағзаларда ми протеомын өзгертуге қабілетті екенін көрсетеді. Бұл перифериялық инфекциялардың нейродегенеративті үдерістерді бастаудағы рөлін түсіндіруі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек жануарлар моделінде және бір вирустық штабта орындалған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tumau-a-virusy-tuyndaghan-pnevmonitten-kejingi-lrrk2-pg2019s-mutantty-tyshkhandardaghy-fosforlanghan-a-sinuklein-men-fosforlanghan-tau-akhuyzynyng-zhogharylauy\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tumau-a-virusy-tuyndaghan-pnevmonitten-kejingi-lrrk2-pg2019s-mutantty-tyshkhandardaghy-fosforlanghan-a-sinuklein-men-fosforlanghan-tau-akhuyzynyng-zhogharylauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тұмау А вирусы туындаған пневмониттен кейінгі Lrrk2 p.G2019S-мутантты тышқандардағы фосфорланған α-синуклеин мен фосфорланған тау ақуызының жоғарылауы&lt;/span&gt;&lt;/a&gt;Тұмау А вирусы туындаған пневмониттен кейінгі Lrrk2 p.G2019S-мутантты тышқандардағы фосфорланған α-синуклеин мен фосфорланған тау ақуызының жоғарылауы&lt;/h3&gt;\n&lt;h3 id=\"soez-sany-4082-soez-zhuegirmeli-takhyryp-tumau-a-pnevmonitterinen-kejingi-tyshkhandardaghy-nejrohimiyalykh-oezgerister\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#soez-sany-4082-soez-zhuegirmeli-takhyryp-tumau-a-pnevmonitterinen-kejingi-tyshkhandardaghy-nejrohimiyalykh-oezgerister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сөз саны: 4082 сөз. Жүгірмелі тақырып: Тұмау А пневмониттерінен кейінгі тышқандардағы нейрохимиялық өзгерістер&lt;/span&gt;&lt;/a&gt;Сөз саны: 4082 сөз. Жүгірмелі тақырып: Тұмау А пневмониттерінен кейінгі тышқандардағы нейрохимиялық өзгерістер&lt;/h3&gt;\n&lt;p&gt;Мүдделер қақтығысы: Авторлар мүдделер қақтығысы жоқ екенін мәлімдейді.&lt;/p&gt;\n&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Кіріспе: Тұмау вирусының әсері паркинсонизмнің жиілігін арттырады. Біз және басқа зерттеушілер бұрын Паркинсон ауруымен байланысты LRRK2 локусындағы аллельді варианттардың иесінің вирулентті микробтарға қарсы жауабын модуляциялайтынын анықтадық.&lt;/p&gt;\n&lt;p&gt;Мақсат: Біз Lrrk2 мутациялары мұрын арқылы жұқтырылған өкпе инфекциясынан кейін ересек жануарларда аурудың нәтижелерін өзгертетінін зерттедік.&lt;/p&gt;\n&lt;p&gt;Әдістер: Біз мутантты knock-in Lrrk2 генотиптері бар C57BL/6J тышқандарына H1N1 серотипіндегі А тұмауы вирусын (1 × LD₅₀ = 2000 тізбек түзуші бірлік) мұрын арқылы енгіздік.&lt;/p&gt;\n&lt;p&gt;Қорытынды: Өмірге қауіп төндіретін пневмотропты РНК вирусы тудырған инфекциядан аман қалған гомозиготалы Lrrk2G2019S-мутантты тышқандар мидағы тотығу стресс, pSer199 тау және pSer129 α-синуклеин деңгейлерінің өзгерістерін көрсетеді. Бұл нәтижелер адамдардағы нейродегенерациямен байланысты өзгерістердің басталуына қатысты болуы мүмкін және LRRK2 мутанттарының пенетранттық жиілігі мен экспрессивтілігіндегі айырмашылықтарды түсіндіруге көмектеседі.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Паркинсон ауруы (ПА), күрделі нейродегенеративті бұзылыс, таралуы артып келеді, алайда бұл аурудың этиологиясы әлі де түсініксіз. ПА генетикалық тәуекел, қоршаған ортаның әсері және қартаю арасындағы күрделі өзара әрекеттесуден туындайды деп саналады. Қоршаған ортаның бірнеше қауіп факторлары анықталды, соның ішінде нейротропты емес вирустық инфекциялар. Мысалы, А тұмауының H1N1 серотипінің нұсқасы тудырған тұмау пандемиясы кейіннен фон Экономо энцефалитінің пайда болуымен, соның ішінде инфекциядан кейінгі паркинсонизммен байланысты түрімен байланысты болды. Жақында тұмаумен ауыру тарихы (он бес жыл бұрынғыға дейін) ПА ауруының өсуімен байланыстырылды. Тышқандарда жоғары патогенді құс тұмауының H5N1 серотипімен (нейротропты вирус) мұрын арқылы инокуляциядан кейінгі инфекция жабайы типтегі тышқандардың миында α-синуклеиннің фосфорлануы мен агрегациясына, сондай-ақ дофаминергиялық жасушалардың жойылуына әкелді. Сонымен қатар, H1N1 ex vivo жағдайында α-синуклеин деңгейін арттыратыны көрсетілді, бұл тұмауға қарсы препаратпен алдын ала емдеу арқылы түзетілді. Қоршаған ортаның қауіп факторларынан тыс, &amp;gt;90 локустағы нұсқалар анықталды және олар ПА қаупінің өзгеруімен байланыстырылды, соның ішінде LRRK2 геніндегі мутациялар, олар мамандандырылған клиникаларда байқалатын паркинсонизм жағдайларының ~2%-ын құрайды. Бұл гендегі мутациялар ПА-ның отбасылық және спорадиялық формалары үшін де қауіп төндіреді, дегенмен механизмдері әлі де түсініксіз. Айта кетейік, LRRK2 мутацияларымен байланысты толық емес пенетранттылық бар, соның ішінде ең көп таралған p.G2019S нұсқасы үшін. Бұл бізге LRRK2 мутациясын тасымалдаушыларда аурудың көрінуі екінші триггерді, генетикалық немесе қоршаған орталықты талап етуі мүмкін деген ой салды; біз және басқа зерттеушілер соңғы фактор микробтық сипатта болуы мүмкін деп болжадық. Маңыздысы, LRRK2 локусындағы мутациялар Крон ауруымен, алапеспен және жүйелі қызыл жегімен де байланыстырылды. Бұл аурулардың әрқайсысы созылмалы қабынудың бұзылуымен сипатталады. Төрт түрлі ауру арасындағы ортақ қауіп локусы LRRK2-нің эволюциялық сақталған функциясы иммундық жауаптарды реттеуді қамти ма деген сұрақты тудырады. LRRK2 периферияда (мысалы, сүйек кемігі, өкпе) миға қарағанда жоғары деңгейде экспрессияланады және иммундық жүйе жасушаларында (нейтрофилдер, моноциттер және макрофагтар) нейрондарға қарағанда көбірек кездеседі. Сонымен қатар, ақуыз инфекциялық патогендер мен қабыну медиаторлары (мысалы, IFN-γ және NF-κB) арқылы белсендірілуі мүмкін, бұл LRRK2-нің патогендерден қорғануда және иммундық жүйе жауаптарында қатысатынын көрсетеді. Бірқатар зерттеулер Lrrk2-нің бактериялық патогендікке микробқа тәуелді түрде әсер ететінін көрсетті. Біз бұрын Lrrk2-нің вирустық инфекцияларға жауап берудегі рөлін де зерттегенбіз; онда біз тышқан балаларында реовируспен [izotip type-3 Dearing (T3D)] мұрын арқылы инокуляциядан кейінгі ауру нәтижелері Lrrk2 аллельді нұсқаларына байланысты жынысқа қарай әсер ететінін көрсеттік. Мұнда біз Lrrk2 аллельді нұсқалары ересек C57BL/6J тышқандарында потенциалды өлімге әкелетін өкпе инфекциясының барысын өзгерте алатынын және пневмотропты РНҚ вирусының әсерінен кейін ми патологиясын анықтай алатынын тексердік. Біз Lrrk2-нің киназа-гиперактивті нұсқасы өкпедегі вирус репликациясын төмендетіп, ересек жануарлардың өмір сүру деңгейін өзгертуі мүмкін деп болжадық. Сонымен қатар, біз бұл инфекция тірі қалған жануарларда нейрохимиялық маркерлердің өзгеруіне әкелуі мүмкін деп болжадық. Мұны тексеру үшін біз жабайы типтегі және Lrrk2 нок-ин мутантты тышқандарда пневмонитті қоздыру үшін тышқандарға бейімделген А тұмауы вирусын, H1N1 серотипін (A/Fort Monmouth/1/1947) қолдандық. Біз Lrrk2 p.G2019S немесе p.D1994S мутанттарының ешқайсысы жедел ауру нәтижелерін өзгертпегенін анықтадық. Алайда, H1N1 тұмауынан тірі қалу гомозиготалы Lrrk2 p.G2019S жануарларының миында өздерінің бір туыстарына қарағанда тотығу стрессі деңгейінің жоғарылауына және α-синуклеин мен тау метаболизмінің өзгеруіне әкелді.&lt;/p&gt;\n&lt;h4 id=\"aedister-tyshkhandar-koloniyalary\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#aedister-tyshkhandar-koloniyalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ӘДІСТЕР: Тышқандар колониялары&lt;/span&gt;&lt;/a&gt;ӘДІСТЕР: Тышқандар колониялары&lt;/h4&gt;\n&lt;p&gt;Барча тышқан колониялары гетерозиготалы будандастыру жұптарын қолдана отырып, C57BL/6J фонында сақталды. Жануарлармен жасалатын тәжірибелер Канаданың жануарларды күту жөніндегі кеңесінің нұсқауларына сәйкес орындалды және Оттава университетінің Жануарларды күту комитетінің Этикалық кеңесімен мақұлданды. Вирустық инфекцияларға қатысты тәжірибелер 2-ші биоқауіпсіздік деңгейіндегі жануарлар виварийінде жүргізілді. Lrrk2 p.G2019S (MGI:5295368) және Lrrk2 p.D1994S (MGI:5295371) нок-ин тышқандарын сипатталғандай доктор Дерья Шимшек мейірімділікпен ұсынды. Осы зерттеуде көрсетілгендей, ұрғашы да, еркек тышқандар да пайдаланылды.&lt;/p&gt;\n&lt;h4 id=\"tyshkhangha-bejimdelgen-tumau-a-h1n1-virusymen-muryn-arkhyly-infekciyalau\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tyshkhangha-bejimdelgen-tumau-a-h1n1-virusymen-muryn-arkhyly-infekciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тышқанға бейімделген тұмау A H1N1 вирусымен мұрын арқылы инфекциялау&lt;/span&gt;&lt;/a&gt;Тышқанға бейімделген тұмау A H1N1 вирусымен мұрын арқылы инфекциялау&lt;/h4&gt;\n&lt;p&gt;Тұмау A H1N1 вирусының тышқанға бейімделген нұсқасының [A/Fort Monmouth/1/1947 ('FM-MA')] түзілуі бұрын сипатталған. 5-7 апталық ересек тышқандар 1 минут бойы 1 л/мин жылдамдықтағы O₂ ішіндегі 3% изофлуранмен анестезияланды. FM-MA H1N1 (50 мкл PBS ішінде дайындалған) 2× 10³ бляшка түзуші бірлік (БОЕ) мөлшерінде мұрын жолдарына енгізіліп, шамамен 50% өлім-жітіммен ауыр пневмонитті тудырды (1 LD₅₀). Тышқандар инкубациядан кейін 14 күн бойы (dpi) бақыланды және 4-14 dpi аралығында күн сайын екі рет өлшенді. Эвтаназия жасауға көрсеткіш болатын соңғы критерийлерге морибундты күй, тыныс алудың қиындауы немесе дене салмағының ≥ 30% жоғалуы кірді. Жедел вирустық инфекциядан аман қалған тышқандар (14 dpi кезінде тірі қалуымен расталады) инокуляциядан кейінгі жалпы 6 аптаға (wpi) дейін тағы 4 апта бойы ұсталды (Сурет 1a). H1N1 әсер еткен тышқандармен қатар, бақылау тобындағы (mock-inoculated) жануарларға вируссыз 50 мкл PBS берілді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f1.jpg\" alt=\"1-сурет. Lrrk2G2019S аллельдері тұмау А вирусымен (H1N1) мұрын арқылы инфицирленген тышқандардың өкпесіндегі тіршілік ет\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Lrrk2G2019S аллельдері тұмау А вирусымен (H1N1) мұрын арқылы инфицирленген тышқандардың өкпесіндегі тіршілік ету қабілетіне, салмақтың өзгеруіне немесе вирус титріне әсер етпейді. Бұл зерттеуде қолданылған эксперименттік уақыт шкаласы (A). Ересек тышқандарға (еркек және ұрғашы; жасы 5-7 апта) тұмау А вирусының (H1N1 серотипі) 2 × бляшка түзуші бірлігі (PFU) мұрын арқылы енгізілді. Тіршілік ету қабілеті инокуляциядан кейінгі күндерге (p.i.) қатысты пайыыз ретінде графикалық түрде көрсетілген (B, E), ал салмақтар p.i. күндеріне қатысты бастапқы дене салмағының пайызы ретінде көрсетілген (C, F). Деректер ұрғашы (B-D) және еркек (E-G) тышқандар үшін бөлек көрсетілген. Вирус титрлері p.i. 3-күні өкпеде өлшенді (D, G). Әрбір таңба бір жануарды білдіреді. Қателік сызықтары орташа ± стандартты қатені (SEM) білдіреді. WT = жабайы тип; GS = Lrrk2G2019S мутантты аллелі. Қолданылған статистикалық тесттер: тіршілік ету қисықтары үшін лог-рангтық (Мантел-Кокс) тест; вирус титрін талдау үшін бір факторлы дисперсиялық талдау (ANOVA).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"tumau-a-virusynyng-h1n1-serotipine-arnalghan-blyashka-taldauy\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#tumau-a-virusynyng-h1n1-serotipine-arnalghan-blyashka-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тұмау А вирусының H1N1 серотипіне арналған бляшка талдауы&lt;/span&gt;&lt;/a&gt;Тұмау А вирусының H1N1 серотипіне арналған бляшка талдауы&lt;/h4&gt;\n&lt;p&gt;2× 10³ PFU H1N1 вирусымен мұрын арқылы инфицирленген тышқандар 3 dpi күні өлтірілді. Өкпелер бірден мұздатылып, содан кейін Magna Lyser (Roche) құрылғысында металл моншақтарды қолдана отырып, максималды жылдамдықта 10 секунд бойы PBS-те (3:1, v:w) лизиске ұшырады, содан кейін бір рет қатырылып-ерітілді. MDCK жасушалары 6-ұяшықты планшеттерде 90% конфлюенттікке дейін өсірілды. Өкпе гомогенаттары центрифугаланды (5000 айн/мин), ал супернатанттар сарысуы жоқ DMEM ішінде қатарынан сұйылтылды (10 есе). MDCK моноқабаттары PBS-пен екі рет шайылып, әр сұйылтудың 100 мкл мөлшерімен жабылды және 37 °C температурада, 5% CO₂ ортасында 30 минут бойы, әр 15 минут сайын шайқала отырып инкубацияланды. Бір сағаттан кейін жасушалардың үстіне 0,1 мкг/мл TPCK-трипсин бар 1:1 қатынасындағы 1,2% агароза мен 2xDMEM қоспасының 3 мл құйылып, 3 күн бойы инкубацияланды. Жасушалар метанол:сірке қышқылы (3:1) қоспасында бір сағат бойы фиксацияланды. Қабаттар ағын су астында алынып тасталды және Кумасси көгімен 30 минут бойы боялды. Бляшкалар визуалды түрде есептелді. Вирустық титрлер тілдік тіннің грамына шаққандағы БОЕ түрінде көрсетілген.&lt;/p&gt;\n&lt;h4 id=\"belokty-ekstrakciyalau\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#belokty-ekstrakciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Белокты экстракциялау&lt;/span&gt;&lt;/a&gt;Белокты экстракциялау&lt;/h4&gt;\n&lt;p&gt;Ақуыз жоғарыда вирус титрін талдау үшін сипатталғандай тіндерді гомогенизациялау арқылы экстракцияланды. Аликвоттар 1% Triton-X 100 және фосфатаза тежегіштері бар 2x протеазада (Thermo Scientific) дайындалып, 4 °C температурада 30 минут бойы 14 800 айн/мин жылдамдықта центрифугаланды. Ақуыз концентрациялары микропланшет процедурасына сәйкес бицинхонин қышқылын (BCA) талдау жиынтығы (Thermo Fisher Scientific, 23227) көмегімен анықталды.&lt;/p&gt;\n&lt;p&gt;α-синуклеин мен тау ақуызын ELISA көмегімен мөлшерлік анықтау&lt;/p&gt;\n&lt;p&gt;Лизаттардағы жалпы α-синуклеин бұрын сипатталғандай сэндвич ELISA көмегімен өлшенді. α-синуклеин ақуызының концентрациялары әр үлгідегі жалпы ақуыз концентрациясына нормаланды. Жалпы тышқан тау ақуызы Tau (Total) Mouse ELISA Kit (KMB7011, Invitrogen) көмегімен өлшенді. Тышқанның фосфо-тауының (фосфо-серин 199) мөлшері Mouse Tau (Phospho) [Ser199] ELISA Kit (KMB7041, Invitrogen) көмегімен өлшенді.&lt;/p&gt;\n&lt;h4 id=\"vestern-blotting\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#vestern-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вестерн-блоттинг&lt;/span&gt;&lt;/a&gt;Вестерн-блоттинг&lt;/h4&gt;\n&lt;p&gt;Ақуыз үлгілері (әр лункаға 40 мкг; анти-нитротирозин үшін 75 мкг) 1xNuPAGE™ LDS буферімен араластырылып, 95 °C температурада 5 минут бойы қайнатылды және тотықсыздандыратын (анти-нитротирозин үшін тотықсыздандырмайтын) жағдайларда 4-12% градиентті SDS-MES гельдерінде жүгіртілді. Ақуыздар трис-глицин-метанол буферінде жартылай құрғақ әдіспен PVDF мембраналарына көшірілді. Анти-нитротирозин антиденесі (Cell Signalling, 9691S) блоттары үлдірге түсіріліп, ImageJ көмегімен мөлшерленіп, Ponceau S боялуына нормаланды. Фосфо-α-синуклеин (Ser129) (Abcam, ab51253), hSA4 (сипатталғандай (Mollenhauer et al. 2008) рекомбинантты, толық ұзындықтағы адам α-синуклеиніне қарсы алынған және аффинді түрде тазартылған коммерциялық емес поликлоналды антидене) және Plk2 (Novus Biologicals, NBP3-04961) антиденелерінің блоттары BioRad ChemiDoc көмегімен түсіріліп, ImageLab көмегімен мөлшерленді. Фосфорланған α-синуклеин мен жалпы α-синуклеин сигналдары жүктеме бақылауы ретінде актинге (Santa Cruz, sc-47778) нормаланды (Plk2 Ponceau S боялуына нормаланды) және блотаралық мөлшерлеу үшін ішкі блот бақылауларына қосымша нормаланды.&lt;/p&gt;\n&lt;h4 id=\"reaktivti-ottegi-tuerlerin-sandykh-anykhtau\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#reaktivti-ottegi-tuerlerin-sandykh-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реактивті оттегі түрлерін сандық анықтау&lt;/span&gt;&lt;/a&gt;Реактивті оттегі түрлерін сандық анықтау&lt;/h4&gt;\n&lt;p&gt;Тіндердегі H2O2 мөлшерін сандық анықтау үшін эндогендік H2O2 деңгейін бақылау мақсатында Amplex® Red hydrogen peroxide/peroxidase assay kit (Invitrogen, A22188) жинағы қолданылды. Сагиттальды кесілген ми жарты шарлары жоғарыда сипатталғандай PBS ерітіндісінде лизиске ұшыратылды. Гомогенаттардағы H2O2 деңгейлері өндірушінің нұсқауларына сәйкес өлшенді. Алынған H2O2 мәндері (мкМ) тін салмағына (г) қатысты нормаландырылды.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау&lt;/span&gt;&lt;/a&gt;Статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Барлық статистикалық талдаулар GraphPad Prism 11 нұсқасы (GraphPad Software, Сан-Диего, Калифорния, АҚШ) көмегімен жүргізілді. Тірі қалу сынақтарындағы топтар арасындағы айырмашылықтар лог-рангтік (Мантел-Кокс) тест арқылы бағаланды. Топтар арасындағы айырмашылықтар екі факторлы дисперсиялық талдау (ANOVA) және түзетілмеген Фишердің LSD пост-хок тесті арқылы бағаланды. Деректер қолданылған жағдайда орташа ± стандартты қате (SEM) ретінде және суреттердің сипаттамасында көрсетілгендей берілген. Деректер *P&amp;lt;0,05, **P&amp;lt;0,01, ***P&amp;lt;0,001, ****P&amp;lt;0,0001 түріндегі P мәндерімен көрсетілген.&lt;/p&gt;\n&lt;h4 id=\"derekterding,-hattamalardyng-zhaene-materialdardyng-kholzhetimdiligi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#derekterding,-hattamalardyng-zhaene-materialdardyng-kholzhetimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректердің, хаттамалардың және материалдардың қолжетімділігі&lt;/span&gt;&lt;/a&gt;Деректердің, хаттамалардың және материалдардың қолжетімділігі&lt;/h4&gt;\n&lt;p&gt;Осы зерттеуде пайдаланылған және/немесе талданған деректер жиынтығы мен кескіндер, сондай-ақ егжей-тегжейлі хаттамалар мен негізгі зертханалық материалдарды олардың тұрақты идентификаторларымен қамтитын Негізгі ресурстар кестесі (KRT) Zenodo платформасында қолжетімді: https://doi.org/10.5281/zenodo.16576378.&lt;/p&gt;\n&lt;h4 id=\"naetizheler-zhaene-talkhylau\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#naetizheler-zhaene-talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;НӘТИЖЕЛЕР және ТАЛҚЫЛАУ:&lt;/span&gt;&lt;/a&gt;НӘТИЖЕЛЕР және ТАЛҚЫЛАУ:&lt;/h4&gt;\n&lt;p&gt;Lrrk2 p.G2019S тышқандары H1N1 пневмониті кезінде жабайы типтегі тышқандармен бірдей ауру барысын көрсетеді. Біз алдымен Lrrk2G2019S және жабайы типтегі тышқандарда нейротропты емес вирусты қолдана отырып, иесінің жауаптарындағы Lrrk2 киназа белсенділігінің рөлін зерттедік (Сурет 1). А тұмау вирусы, H1N1 серотипі (FM-MA штаммы) өкпе тропизміне ие, ол тышқандарда белгілі бір дозаларда өлімге әкелетін пневмонит тудыруы мүмкін. Айта кетейік, Lrrk2 өкпеде жоғары деңгейде экспрессияланады. 5-7 апталық ересек тышқандарға мұрын арқылы бұрын белгіленген LD50 дозасы (2x10^3 PFU) енгізілді; жануарлар өкпедегі вирус титрін талдау үшін 3-күні (dpi) өлтірілді немесе тірі қалу деңгейі бағаланды, содан кейін тірі қалғандары өсірілді (Сурет 1a). Тірі қалу деңгейлері мен салмақтары ұрғашы (Сурет 1b, c) және еркек (Сурет 1e, f) жануарларда 14-күнге дейін (dpi) өлшенді. Ұрғашы тышқандар жалпы алғанда еркектерге қарағанда өлім деңгейінің жоғарылығын көрсетті, бұл C57BL/6J тышқандарында H1N1-дің әртүрлі штаммдарын қолданған алдыңғы есептерге сәйкес келеді. Алайда, біз жабайы типтегі тышқандармен салыстырғанда Lrrk2 p.G2019S нок-ин тышқандарының тірі қалуында ешқандай айырмашылық анықтамадық. Сол сияқты, генотиптер (және мутантты аллельдер саны) арасында бастапқы салмақ жоғалту немесе кейінгі салмақ қосуда айтарлықтай айырмашылықтар болмады, олар сәйкесінше ауру мен қалпына келудің суррогаттары ретінде қызмет етті. H1N1 инфекциясының үшінші нәтижесі ретінде біз бөлек когортада инфекцияның шыңында, атап айтқанда 3-күні (dpi) өкпедегі вирус титрлерін өлшедік. Біз ұрғашы Lrrk2G2019S гомозиготалы тышқандарда төменірек титрлер үрдісін байқағанымызбен (мұны біз күшіктердегі реовирус T3D нәтижелерімізден күткен едік), тиісті еркектерде титрлердің үлкен өзгермелілігі байқалды. Жалпы алғанда, 3-күні (dpi) генотиптер арасында вирус титрлері үшін айтарлықтай айырмашылықтар есептелмеді (Сурет 1d, g).&lt;/p&gt;\n&lt;h4 id=\"lrrk2-kinaza-belsendiligi-h1n1-infekciyasyna-kharsy-zhedel-ielik-khorghanys-ueshin-talap-etilmejdi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#lrrk2-kinaza-belsendiligi-h1n1-infekciyasyna-kharsy-zhedel-ielik-khorghanys-ueshin-talap-etilmejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lrrk2 киназа белсенділігі H1N1 инфекциясына қарсы жедел иелік қорғаныс үшін талап етілмейді&lt;/span&gt;&lt;/a&gt;Lrrk2 киназа белсенділігі H1N1 инфекциясына қарсы жедел иелік қорғаныс үшін талап етілмейді&lt;/h4&gt;\n&lt;p&gt;Біз гипербелсенді киназа p.G2019S мутанты берген тірі қалу модуляциясын анықтамағандықтан, біз келесі кезекте Lrrk2 белсенділігінің жоғалуы H1N1 инфекциясының нәтижелеріне әсер ете ме, жоқ па, соны зерттедік, дәл жаңа туған нәрестелердегі реовирус-T3D-ге жауап ретінде көргеніміздей. Жоғарыдағыдай тәсілді қолдана отырып, біз Lrrk2 киназа-өлі p.D1994S нок-ин мутациясын алып жүретін тышқандарды ектік. Біз еркек те, ұрғашы да Lrrk2D1994S гомозиготалы және гетерозиготалы тышқандар H1N1 инфекциясынан кейін жабайы типтегі тышқандармен бірдей тірі қалу деңгейі мен салмақ өзгерістерін көрсеткенін анықтадық (Қосымша Сурет 1a, b, d, e). Одан әрі зерттеу үшін біз осы тышқандардың өкпесінде 3-күні (dpi) H1N1 вирус титрлерін өлшедік және тағы да жабайы типтегі, гетерозиготалы және гомозиготалы Lrrk2 p.D1994S жануарлары арасында топтық айырмашылықтарды анықтамадық (Қосымша Сурет 1c, f). Бұл ұжымдық нәтижелер бізге Lrrk2 киназа белсенділігінің өзі H1N1 пневмонитінің жедел фазасында ересек тышқандардың жауабында байқалатын әсер көрсетпегенін білдірді.&lt;/p&gt;\n&lt;h4 id=\"h1n1-den-tiri-khalghandar-mida-virustykh-akhuyz-ekspressiyasynyng-belgilerin-koersetpejdi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-den-tiri-khalghandar-mida-virustykh-akhuyz-ekspressiyasynyng-belgilerin-koersetpejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1-ден тірі қалғандар мида вирустық ақуыз экспрессиясының белгілерін көрсетпейді&lt;/span&gt;&lt;/a&gt;H1N1-ден тірі қалғандар мида вирустық ақуыз экспрессиясының белгілерін көрсетпейді&lt;/h4&gt;\n&lt;p&gt;Содан кейін біз аман қалған тышқандардың миына H1N1 вирусының әсерінен кейінгі салдарларын және Lrrk2G2019S knock-in мутациясына байланысты болуы мүмкін кез келген әсерді зерттедік. H1N1 инфекциясынан аман қалған гомозиготалы тышқандар алдымен инфекциядан кейінгі жалпы 6 аптаға (6wpi) дейін қосымша төрт апта бойы ұсталды (1а-сурет). Содан кейін біз H1N1-мен және жалған инфекцияланған жануарлардың ми гомогенаттарын қояндардың анти-H1N1 иммундық сарысуы арқылы Вестерн-блоттинг көмегімен зерттедік. 3-ші күнгі инфекцияланған өкпені оң бақылау ретінде пайдалана отырып, біз аман қалған тышқандар тобының миында вирус кодтайтын H1N1 ақуыздарын, атап айтқанда нуклеопротеин NP және матрикс ақуызы M1 таба алмадық (деректер көрсетілмеген), бұл күтілгендей, H1N1 бұл жағдайларда мида анықталмағанын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"h1n1-infekciyasynan-kejin-lrrk2-pg2019s-mutantty-miynda-fosforlanghan-tau-akhuyzy-artady\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-infekciyasynan-kejin-lrrk2-pg2019s-mutantty-miynda-fosforlanghan-tau-akhuyzy-artady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 инфекциясынан кейін Lrrk2 p.G2019S мутантты миында фосфорланған тау ақуызы артады&lt;/span&gt;&lt;/a&gt;H1N1 инфекциясынан кейін Lrrk2 p.G2019S мутантты миында фосфорланған тау ақуызы артады&lt;/h4&gt;\n&lt;p&gt;Тұмау А (H1N1) вирусы пандемиясы құрбандығы болған паркинсонизмнің постэнцефалиттік жағдайларында бұрын жүргізілген ми аутопсиялары тауопатияның белгілерін анықтады. Айта кету керек, LRRK2-мен байланысты БП жағдайларында байқалатын ми патологиясы әртүрлі және өзіне тән α-синуклеин агрегаттарын, фосфорланған таумен байланысқан патологияны, қосындылардың түзілуінсіз нейрондық жоғалуды немесе аралас патологияларды қамтиды. Сондықтан біз алдымен жалпы тау мөлшерін, содан кейін H1N1 инфекциясын жұқтырып аман қалғандар мен жалған емделген жануарларда 6wpi-да (2a-c сурет) жалпы ми гомогенаттарының еритін фракциясындағы фосфорланған тау (pSer199 tau) деңгейін ELISA көмегімен өлшедік.&lt;/p&gt;\n&lt;p&gt;Бұл лизаттардағы жалпы тау мөлшерін өлшеген кезде, инфекцияға, мутацияға (2а-сурет) немесе жынысқа байланысты ешқандай айырмашылық байқалмады (2a, 3a қосымша суреттер). pSer199 tau мөлшерін анықтаған кезде, екі факторлы ANOVA инфекция мен генотиптің айтарлықтай өзара әрекеттесуін көрсетті (F(1, 23)=5.418, P=0.0291; 2b-сурет). Мұнда pSer199 tau деңгейі жалған емделген мутантты тышқандармен салыстырғанда инфекцияланған Lrrk2 p.G2019S тышқандарында айтарлықтай өсті (P=0.0099), бұл әсер жабайы типтегі тышқандарда болған жоқ. Содан кейін біз осы үлгілердегі фосфорланған және жалпы тау ақуызының арақатынасын есептедік (2c-сурет), мұнда жалған емделген мутантты тышқандармен салыстырғанда инфекцияланған Lrrk2 p.G2019S-мутантты жануарларда айтарлықтай өсім анықталды. H1N1 инфекциясын жұқтырған мутантты тышқандар да инфекцияланған жабайы типтегі тышқандармен салыстырғанда айтарлықтай жоғары қатынасты көрсетті (P&amp;lt;0.05; 2c-сурет). Екі факторлы ANOVA соңғы қатынас үшін маңыздылыққа қарай тенденцияны көрсетті (P=0.0521). Бұл нәтижелер H1N1 инфекциясынан кейін мидағы еритін pSer199 tau концентрациясының жоғарылағанын көрсетті, бұл гомозиготалы Lrrk2G2019S knock-in мутациясының экспрессиясымен байланысты болды. pSer199 tau үшін тиісті киназа болып табылатын GSK3β үшін сол гомогенаттарды зерттеген кезде (белсенді және белсенді емес формалар Вестерн-блоттинг көмегімен зерттелді), нәтижелер инфекцияға, жынысқа немесе мутацияға байланысты ешқандай әсерді көрсетпеді (деректер көрсетілмеген). Бүгінгі күнге дейін біз басқа тау киназаларын әлі зерттеген жоқпыз.&lt;/p&gt;\n&lt;h4 id=\"h1n1-infekciyasynan-kejin-lrrk2-pg2019s-mutantty-miynda-fosforlanghan-a-sinuklein-artady\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-infekciyasynan-kejin-lrrk2-pg2019s-mutantty-miynda-fosforlanghan-a-sinuklein-artady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 инфекциясынан кейін Lrrk2 p.G2019S мутантты миында фосфорланған α-синуклеин артады&lt;/span&gt;&lt;/a&gt;H1N1 инфекциясынан кейін Lrrk2 p.G2019S мутантты миында фосфорланған α-синуклеин артады&lt;/h4&gt;\n&lt;p&gt;Содан кейін біз сол жануарлардағы α-синуклеин метаболизмін зерттедік (2d-f сурет). Біз бұрын реовируспен (T3D) инфекцияланған жаңа туылған тышқандардың миында Lrrk2G2019S-ке тәуелді жалпы α-синуклеиннің өскенін байқаған едік. Сондықтан біз аман қалған ұрғашы және еркек жануарлардың барлық ми гомогенаттарына Вестерн-блоттинг пен ELISA жасап, жалпы синуклеин мен pSer129 α-синуклеин деңгейлерін зерттедік. Екі факторлы ANOVA мутантты ұрғашылардың миындағы жалпы α-синуклеинге бұрынғы H1N1 инфекциясының әсерін көрсетті (F(1, 8)=7.32, P=0.0268, 3d қосымша сурет), бірақ еркектерде жоқ (2d қосымша сурет); соған қарамастан, жыныстар біріктірілген кезде инфекция әсері маңызды болып қала берді (P=0.0474) (2d-сурет). Сонымен қатар, біз аман қалған жануарларда pSer129 α-синуклеин деңгейлерінің жоғарылағанын анықтадық (2e-сурет).&lt;/p&gt;\n&lt;p&gt;Екі факторлы ANOVA айтарлықтай генотип әсерін (F(1, 20)=54.73, P&amp;lt;0.0001), маңызды инфекция әсерін (F(1, 20)=10.76, P=0.0037) және маңызды генотип пен инфекцияның өзара әрекеттесуін (F(1, 20)=6.186, P=0.0218) көрсетті, бұл негізінен ұрғашы жануарлардың есебінен болды (3e қосымша сурет). Бір қызығы, ұрғашы Lrrk2 p.G2019S тышқандары бастапқы деңгейде мидағы pSer129 α-синуклеиннің жоғарылағанын көрсетті (3e қосымша сурет). Фосфорланған және жалпы α-синуклеин деңгейлерінің арақатынасын есептеген кезде, біз жұптық салыстырулар арқылы инфекцияланған жабайы типтегі жануарлармен салыстырғанда инфекцияланған мутантты тышқандарда жоғары қатынасты анықтадық (P&amp;lt;0.05) (2f-сурет), бұл ең алдымен еркектерде байқалды (2f қосымша сурет); екі факторлы ANOVA бұл үшін маңыздылықты көрсетті&lt;/p&gt;\n&lt;p&gt;interaction (P=0.0381). Бұл нәтижелер бізге H1N1 туындаған пневмониттің Lrrk2 p.G2019S гомозиготалы аман қалған жануарлардың бас миындағы еритін, фосфорланған α-синуклеиннің дисрегуляциясына әкелуі мүмкін екенін көрсетті. Polo-тәрізді киназа-2 (Plk2) бірнеше ғылыми топтардың, соның ішінде біздің топтың қатысуымен α-синуклеиннің Ser129 қалдығы бойынша фосфорлануына арналған тиісті фермент ретінде анықталғанын ескере отырып (42–44), біз оны батыс блотинг (Western blotting) әдісі арқылы ми лизаттарында да зерттедік. Біз мутантты ұрғашы жануарлардың миындағы Plk2 ақуызының бапталған деңгейде айтарлықтай өскенін байқадық (P&amp;lt;0.05) (Suppl. Сурет 3g), бұл жабайы типтегі жануарлардағы бұрынғы H1N1 инфекциясы кезінде нашарлады; бұл әсер жыныстар біріктірілген кезде байқалмады (деректер көрсетілмеген). Болашақ жұмыстар H1N1 пневмониттерінен аман қалған жануарлардың миында Plk2 ферментінің белсенділігінің өзі (немесе pSer129 α-синуклеиннің дефосфорлануы) өзгергенін анықтайды.&lt;/p&gt;\n&lt;h4 id=\"h1n1-pnevmonity-lrrk2-pg2019s-tyshkhandarynyng-miyndaghy-totyghu-stress-denggejining-zhogharylauyna-aekeledi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#h1n1-pnevmonity-lrrk2-pg2019s-tyshkhandarynyng-miyndaghy-totyghu-stress-denggejining-zhogharylauyna-aekeledi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H1N1 пневмониты Lrrk2 p.G2019S тышқандарының миындағы тотығу стресс деңгейінің жоғарылауына әкеледі&lt;/span&gt;&lt;/a&gt;H1N1 пневмониты Lrrk2 p.G2019S тышқандарының миындағы тотығу стресс деңгейінің жоғарылауына әкеледі&lt;/h4&gt;\n&lt;p&gt;Әрі қарай біз екі когорталық салыстыруда үш түрлі гомозиготалы генотиптегі аман қалған жануарлардың миындағы тотығу стресс деңгейлерін өлшедік (Сурет 2g, h). H1N1 инфекциясы жұққан аман қалған тышқандардың гомогенаттарындағы H₂O₂ концентрациясы Amplex® Red талдауы көмегімен анықталды. Онда біз екі факторлы дисперсиялық талдауды (ANOVA) қолдана отырып, жабайы типтегі және Lrrk2 p.G2019S жануарлар когортасында пневмониттің H₂O₂ деңгейіне әсерін анықтадық, атап айтқанда жұқтырылған жабайы типтегі еркек тышқандар мен жалған өңделген тышқандар арасында (F(1, 12)=10.20, P=0.0077) (Suppl. Сурет 2h); алайда бұл когортадағы басқа салыстырулар үшін айтарлықтай айырмашылық табылмады (Сурет 2g). Жабайы типті тышқандарды киназалық белсенділігі жойылған Lrrk2 p.D1994S мутантты тышқандарымен салыстырған бөлек когортада H₂O₂ концентрациясын өлшеген кезде, біз жабайы типтегі еркек тышқандарда тағы da айтарлықтай айырмашылықты байқадық (F(1, 18)=7.869, P=0.0117) (Сурет 2h; Suppl. Сурет 1g,h). Пост-хок талдауында бұрынғы H1N1 инфекциясы жалған өңделген тышқандармен салыстырғанда жабайы типтегі жануарларда H₂O₂ деңгейінің айтарлықтай жоғары болуына әкелді (P=0.0087); мидағы H₂O₂ деңгейінің жоғарылау тенденциясы инфекцияға тәуелді түрде ұрғашы және еркек Lrrk2 p.G2019S-мутантты тышқандарында байқалды (Сурет 2g; Suppl. Сурет 2h, 3h). Бір қызығы, H1N1 әсер еткен, киназалық белсенділігі жойылған Lrrk2 p.D1994S жануарларының миында H₂O₂ концентрациясының жоғарылауы анықталған жоқ (Сурет 2h; Suppl. Сурет 1g, h). Тотығу стресінің қосымша өлшемі ретінде біз 6wpi кезінде H1N1 жұқтырған тышқандардың миынан алынған ақуыз сығындыларындағы қайтымсыз ақуыз нитротирозинденуін зерттедік (Сурет 2i). Вестерн-блоттинг пен денситометрияны қолдана отырып, біз H1N1 әсерінің барлық ұрғашылардағы ақуыз нитротирозинденуіне айтарлықтай әсер ететінін анықтадық (F(1, 8)=13.34, P=0.0065) (Suppl. Сурет 3i). Қашан&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in-f2.jpg\" alt=\"2-сурет. Lrrk2 p.G2019S экспрессиясы H1N1 тұмауы пневмониясынан кейін тышқандардың миындағы тау және α-синуклеин метабол\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Lrrk2 p.G2019S экспрессиясы H1N1 тұмауы пневмониясынан кейін тышқандардың миындағы тау және α-синуклеин метаболизмін, сондай-ақ тотығу стресс деңгейін өзгертеді. Инокуляциядан кейінгі 14 күннен астам уақыт бойы тіршілік еткен ересек жалған инфицирленген (H1N1 -) және H1N1 жұқтырған (H1N1 +) тышқандар (еркектер мен ұрғашылар көрсетілген; жасы 5-7 апта) қосымша 4 апта ұсталып, олардың милары жиналды. Бағанды диаграммалар жалпы тау ақуызының деңгейін (A), фосфорланған тауды (pSer199) (B), фосфорланған таудың жалпы тау деңгейіне қатынасын (C); жалпы α-синуклеинді (ИФА арқылы орындалған; D), фосфорланған α-синуклеинді (pSer129) (E) және фосфорланған α-синуклеиннің жалпы α-синуклеинге қатынасын (екеуі де Вестерн-блоттинг арқылы орындалған; F) көрсетеді. Тышқандардың екі бөлек тобындағы H2O2 деңгейлері (G, H). Мидың ақуызды нитротирозиндену мөлшері (I) (H2O2 және нитротирозиндену өлшемдері ми салмағына қатысты көрсетілген). Әрбір таңба бір жануарды білдіреді. Қателік сызықтары орташа ± SEM білдіреді. WT = жабайы тип; GS = Lrrk2 p.G2019S мутантты тышқандары; DS = Lrrk2 p.D1994S мутантты тышқандары. Статистикалық талдау: Фишердің түзетілмеген LSD пост-хок тестімен екі факторлы дисперсиялық талдау (ANOVA). P мәні &amp;lt;0.05 (&lt;/em&gt;), P мәні &amp;lt;0.01 (&lt;strong&gt;), P мәні &amp;lt;0.001 (&lt;/strong&gt;&lt;em&gt;), P мәні &amp;lt;0.0001 (&lt;/em&gt;**&lt;em&gt;).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Еркек дарақтардың тиісті деңгейлерін талдай отырып, екі факторлы дисперсиялық талдау инфекция (F(1, 8)=8.484, P=0.0195) және генотип (F(1, 8)=13.62, P=0.0061) үшін айтарлықтай әсерлерді анықтады (Қосымша Сурет 2i). Постхок талдаулары H1N1 әсер еткен еркек Lrrk2 p.G2019S тышқандарында нитротирозиндеу деңгейлері жалған өңделген мутантты жануарларға және егу жасалған жабайы типтегі тышқандарға қарағанда жоғары екенін растады.&lt;/p&gt;\n&lt;p&gt;Жақында екі топ — соның ішінде біздің топ — NADPH оксидаза-2 (NOX2) белсенділігін жоғарылатудағы Lrrk2 p.G2019S рөлін анықтады, бұл белгілі бір иммундық жасушалар арқылы АФТ өндірісінің күрт өсуіне әкеледі; сондықтан біз сондай-ақ белсенді кешен құрамындағы NOX2 суббірлігі p47phox-ты зерттедік, оны біз бұрын нейтрофилдерде Lrrk2 p.G2019S арқылы гиперфосфорланған деп тапқан едік. Бүгінгі күнге дейін жоғарыда зерттелгендей, H1N1 инфекциясын жұқтырып аман қалғандардың ми лизаттарын жалған егілген жануарлармен салыстыра отырып, Western blotting көмегімен p47phox-қа қарсы талдау нақты нәтиже бермеді (мәліметтер келтірілмеген).&lt;/p&gt;\n&lt;p&gt;Қорыта айтқанда, біз төменгі тыныс жолдарының вирустық инфекциясы салдарынан өміріне қауіп төндіретін пневмонитті бастан өткерген ересек C57BL/6J тышқандарында мида нейрохимиялық өзгерістер болғанын көрсеттік. Пневмотропты H1N1 инфекциясы егуден кейін 6 апта өткен соң, яғни аман қалғандар өткір аурудан сауыққан кезде, ересек Lrrk2 p.G2019S мутантты тышқандарында тотығу стрессесінің айтарлықтай өсуіне және фосфорланған α-синуклеиннің де, фосфорланған тау ақуызының да деңгейінің жоғарылауына әкелді.&lt;/p&gt;\n&lt;p&gt;Біздің нәтижелеріміз Lrrk2 p.G2019S немесе Lrrk2 p.D1994S мутациясы H1N1 өкпенің өткір вирус жұқтыруы кезінде ешқандай артықшылық немесе жоғары қауіп бермегенін көрсетеді, бұны ұқсас аман қалу көрсеткіштері, вирус титрлері және салмақ өзгерістері растайды (Сурет 1). Біздің бұрынғы зерттеулерімізде Lrrk2 p.G2019S Salmonella typhimurium сепсис моделінде және Listeria monocytogenes инфекциясы моделінде қорғанысты қамтамасыз еткен еді, бірақ реовирус (T3D) тудырған энцефалит кезінде аналық жыныс әсерімен аман қалуды нашарлатқан еді.&lt;/p&gt;\n&lt;p&gt;Бұл нәтижелер Lrrk2 p.G2019S мутанты мидан тыс кейбір микробтық инфекцияларға қарсы иесінің қорғанысын күшейте алатыны, бірақ инфекция жүйке жүйесіне жеткен кезде нейрондардың жоғалу қаупін көбірек арттыратыны (жабайы типтегі жануарлар мен Lrrk2 p.D1994S тышқандарымен салыстырғанда) туралы гипотезаны тудырды. Біздің бұрынғы зерттеулерімізге сүйене отырып, ми денсаулығының нашарлауына ықпал ететін факторларға АФТ артық өндірілуі (мысалы, жоғарылаған NOX2 белсенділігі арқылы), микроглиальды реактивтіліктің күшеюі және миға миелоидты жасушалардың хемотаксисінің күшеюі кірді.&lt;/p&gt;\n&lt;p&gt;H1N1 ми үшін тікелей тропизмге ие болмағандықтан, біз периферияда басталған қабынуға қарсы жауаптар миға жетіп, мұнда сипатталған пневмонит моделінде оның нейрондық және/немесе глиальды метаболизміне әсер етті деп болжаймыз, бұл тұжырым ғасыр бұрын H1N1 пандемиясынан кейінгі постинфекциялық паркинсонизм үшін Кадар және т.б. жасаған қорытындыға сәйкес келеді.&lt;/p&gt;\n&lt;p&gt;α-синуклеиннің жоғарылауы in vivo әр түрлі қабыну триггерлеріне жауап ретінде хабарланған. Мұнда біз H1N1 инфекциясынан кейін аналық және аталық тышқандардағы pSer129 α-синуклеиннің тұрақты күйіне Lrrk2 p.G2019S негізделген әсерін анықтадық. Демек, біздің нәтижелеріміз тұқым қуалайтын немесе кеш басталатын Паркинсон ауруының (ПА) кейінгі жиілігімен тұмау А вирусы инфекциясының қауіп қауымдастығы үшін маңызды болуы мүмкін, әсіресе синуклеинопатия дамитын мутантты LRRK2 генотипінің тасымалдаушыларында.&lt;/p&gt;\n&lt;p&gt;LRRK2-мен байланысқан ПА мидың плейотропты патологиясын көрсетеді, ал ондағы мутациялар сонымен қатар прогрессивті надъядерлі сал ауруының (PSP) тауопатиясымен байланысты болды. Осы контекстте біз алдыңғы H1N1 инфекциясының тау метаболизміне әсерін бағаладық. Біз pSer199 тау тұрақты күйіне қатысты маңызды инфекция және генотип өзара әрекеттесуін анықтадық; онда H1N1 инфекциясынан кейін Lrrk2 p.G2019S-мутантты (бірақ жабайы типтегі емес) аналық тышқандарда деңгейлері айтарлықтай жоғарылады.&lt;/p&gt;\n&lt;p&gt;Адамдарда ерімейтін нейрофибриллярлық түйіндері бар тауопатия постинфекциялық паркинсонизм жағдайларында ғана емес, сонымен қатар қызылша вирусы тудырған субжедел склероздаушы панэнцефалитте да сипатталған. Болашақ жұмыста циркуляциялық цитокиндер, хемокиндер және инфильтрацияланатын иммундық жасушалар сияқты перифериялық иммундық медиаторлар біздің пневмонит моделінде байқалған нейрохимиялық өзгерістерге механикалық үлесі үшін бағалануы қажет.&lt;/p&gt;\n&lt;p&gt;Біздің зерттеуіміздің шектеулері бар. Біріншіден, талдаулар егуден кейін 6 аптамен шектелді, бұл аурудың шешілу траекториясын толығымен қамтымауы мүмкін.&lt;/p&gt;\n&lt;p&gt;Екіншіден, біз жасқа байланысты сезімталдықты бағаламадық, өйткені барлық тышқандар салыстырмалы түрде жас (5-7 апталық) болды және иммундық жауаптар, сондай-ақ қан-ми барьерінің тұтастығы өмір бойы өзгеретіні белгілі. Үшіншіден, бірнеше зерттеулер тау ақуызының фосфорлануы гипотермия, қызу, анестезия және ұйқы-ояу циклі сияқты сыртқы факторлар мен стресс жағдайларына жоғары сезімтал екенін көрсетті. Біздің зерттеулерімізде біз осы ықтимал модификаторларға назар аудардық, бірақ басқалары (әлі анықталмаған) модуляциялық рөл атқарған болуы мүмкін. Төртіншіден, біз H1N1 пневмонитінен аман қалған Lrrk2 p.G2019S тышқандарындағы α-синуклеин мен тау ақуызының гиперфосфорлануының артындағы механизмдерді әлі анықтаған жоқпыз (айта кетейік, Lrrk2 өзі тау немесе α-синуклеин үшін нейрондық киназа болып саналмайды). Бесіншіден, еритін ми лизаттарындағы екі ақуыздың гиперфосфорлануы өмірдің кейінгі кезеңінде нейрондардың ішінде түйіндердің түзілуімен және Леви типті қосындылармен байланысты еритін, амилоидогендік агрегаттардың пайда болуына тең емес; алайда бұл бастапқы оқиға ретінде қызмет етуі мүмкін. Соңында, әрбір эксперименталды топқа көбірек жануарлардың қосылуы біздің нейрохимиялық көрсеткіштеріміздегі жыныстық әсерлерге бұдан да көп жарық түсіруі мүмкін еді. Соған қарамастан, біздің нәтижелеріміз пневмотропты РНК вирусымен инфекция C57BL/6J жабайы типті тышқандардың миындағы тотығу стресс күшеюі мүмкін екенін және H1N1 тікелей нейротропизмінің болмауына қарамастан (және сол кезде мида анықталатын вирустық ақуыздар жоқ болса да) мұрынға енгізілгеннен кейін алты апта өткен соң Lrrk2 p.G2019S knock-in жануарларында фосфорланған α-синуклеин мен фосфорланған тау ақуызын жоғарылата алатынын көрсетеді. Бақыланатын жағдайларда ұсталатын ересек тышқандардағы біздің нәтижелеріміз перифериялық органдарды нысанаға алатын вирулентті микробтар мен иесінің геномы арасындағы өзара әрекеттесу ересек адамның миындағы нейродегенерациямен байланысты өзгерістердің бастамашылары бола алады деген тұжырымдаманы толықтырады.&lt;/p&gt;\n&lt;h4 id=\"avtorlardyng-khoskhan-uelesi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#avtorlardyng-khoskhan-uelesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;АВТОРЛАРДЫҢ ҚОСҚАН ҮЛЕСІ:&lt;/span&gt;&lt;/a&gt;АВТОРЛАРДЫҢ ҚОСҚАН ҮЛЕСІ:&lt;/h4&gt;\n&lt;p&gt;Зерттеу дизайны: M.O.L., J.J.T., E.G.B., M.G.S.; Жазу және Суретті дайындау: M.O.L., K.T., J.J.T., E.G.B., M.G.S. Барлық авторлар қолжазбаны шолып шықты және / или өңдеді және ұсынылған нұсқаны мақұлдады. Эксперименттер: M.O.L., K.T., N.L., Q.H-V., эксперименттерді және / или деректерді талдауды орындады. Талдау: M.O.L., K.T., N.L., Q.H-V., J.J.T., S.S., E.G.B., M.G.S. деректерді интерпретациялауды орындады. Зерттеуге басшылық ету: J.J.T., E.G.B., M.G.S. Жалпы жауапкершілік: M.G.S. aSCENT-PD зерттеушілеріне мыналар кіреді: Benjamin Arenkiel, Gianfilippo Coppola, Zhandong Liu, Brit Mollenhauer, Josef Penninger, Maxime Rousseaux, Natalina Salmaso, Christine Stadelmann, Michael G. Schlossmacher, Julianna J. Tomlinson, John M. Woulfe.&lt;/p&gt;\n&lt;h4 id=\"suretter-h1n1-tumauy-pnevmonitinen-kejin-tyshkhandardyng-miyndaghy-totyghu-stressi\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#suretter-h1n1-tumauy-pnevmonitinen-kejin-tyshkhandardyng-miyndaghy-totyghu-stressi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;СУРЕТТЕР: H1N1 тұмауы пневмонитінен кейін тышқандардың миындағы тотығу стрессі.&lt;/span&gt;&lt;/a&gt;СУРЕТТЕР: H1N1 тұмауы пневмонитінен кейін тышқандардың миындағы тотығу стрессі.&lt;/h4&gt;\n&lt;p&gt;Жалған жұқтырылған (H1N1 -) және H1N1 жұқтырылған (H1N1 +) ересек тышқандар (еркектер мен ұрғашылар көрсетілген; жасы 5-7 апта), инокуляциядан кейін 14 күннен астам уақыт аман қалған, қосымша 4 апта бойы ұсталып, олардың миы жиналды. Бағанды графиктер жалпы тау ақуызының деңгейін (A), фосфорланған тауды (pSer199) (B), фосфорланған таудың жалпы тау деңгейіне қатынасын (C); жалпы α-синуклеин (ELISA көмегімен орындалған; D), фосфорланған α-синуклеин (pSer129) (E) және фосфорланған α-синуклеиннің жалпы α-синуклеинге қатынасын (екеуі де Western blotting көмегімен орындалған; F) көрсетеді. Тышқандардың екі бөлек тобындағы H₂O₂ деңгейлері (G, H). Мидың ақуыз нитротирозиндеу құрамы (I) (H₂O₂) және нитротирозиндеу&lt;/p&gt;\n&lt;p&gt;өлшеулер ми салмағына қатысты көрсетілген). Әрбір таңба бір жануарды білдіреді. Қате жолақтары орташа ± SEM мәнін көрсетеді. WT = жабайы тип; GS = Lrrk2 p.G2019S мутантты тышқандары; DS = Lrrk2 p.D1994S мутантты тышқандары. Статистикалық талдау: түзетілмеген Фишердің LSD post-hoc тестімен екі факторлы дисперсиялық талдау (two-way ANOVA). P мәні &amp;lt;0.05 (&lt;em&gt;), P мәні &amp;lt;0.01 (&lt;strong&gt;), P мәні &amp;lt;0.001 (&lt;/strong&gt;&lt;/em&gt;), P мәні &amp;lt;0.0001 (****).&lt;/p&gt;\n&lt;p&gt;тұмау А вирусымен, H1N1 мұрын арқылы жұқтырылған тышқандардың өкпесіндегі титрлер. Өмір сүру ұзақтығы&lt;/p&gt;\n&lt;p&gt;графикалық түрде инфекциядан кейінгі күндерге қарсы өмір сүру пайызы түрінде көрсетілген (A, D), ал салмақтары инфекциядан кейінгі күндерге қарсы бастапқы дене салмағының пайызы ретінде көрсетілген (B, E). Деректер ұрғашы (A-C) және еркек тышқандар (D-F) үшін бөлек көрсетілген. Вирустық титрлер өкпеде инфекциядан кейінгі 3-ші күні өлшенді (C, F). H2O2 деңгейлері еркектер (G) және ұрғашылар (H) үшін берілген (өлшеулер ми салмағына қатысты көрсетілген). Әрбір таңба бір жануарды білдіреді. Қате жолақтары орташа ± SEM мәнін көрсетеді. WT = жабайы тип; DS = Lrrk2 p.D1994S мутантты тышқандары. Қолданылған статистикалық тесттер: өмір сүру қисықтары үшін лог-ранг (Мантел-Кокс) тесті; вирустық титрді талдауға арналған бір факторлы дисперсиялық талдау (one-way ANOVA); түзетілмеген Фишердің LSD post-hoc тестімен екі факторлы дисперсиялық талдау (two-way ANOVA). P мәні &amp;lt;0.05 (*), P мәні &amp;lt;0.01 (**).&lt;/p&gt;\n&lt;p&gt;фосфорланған тау-белоктың жалпы тау-белок деңгейлеріне қатынасы (C); жалпы α-синуклеин (ИФА көмегімен орындалған; D),&lt;/p&gt;\n&lt;p&gt;фосфорланған α-синуклеин (pSer129) (E) және фосфорланған α-синуклеиннің жалпы α-синуклеинге қатынасы (екеуі ҳам Вестерн-блоттинг арқылы орындалған; F). Мидың Plk2 (G), H2O2 (H) деңгейлері және ақуыздың нитротирозиндену мөлшері (I) (H2O2 және нитротирозиндену өлшеулері ми салмағына қатысты көрсетілген). Әрбір таңба бір жануарды білдіреді. Қате жолақтары орташа ± SEM мәнін көрсетеді. WT = жабайы тип; GS = Lrrk2 p.G2019S мутантты тышқандары; DS = Lrrk2 p.D1994S мутантты тышқандары. Статистикалық талдау: түзетілмеген Фишердің LSD post-hoc тестімен екі факторлы дисперсиялық талдау (two-way ANOVA). P мәні &amp;lt;0.05 (*), P мәні &amp;lt;0.01 (**).&lt;/p&gt;\n&lt;p&gt;фосфорланған тау-белоктың жалпы тау-белок деңгейлеріне қатынасы (C); жалпы α-синуклеин (ИФА көмегімен орындалған; D),&lt;/p&gt;\n&lt;p&gt;фосфорланған α-синуклеин (pSer129) (E) және фосфорланған α-синуклеиннің жалпы α-синуклеинге қатынасы (екеуі де Вестерн-блоттинг арқылы орындалған; F). Мидың Plk2 (G), H2O2 (H) деңгейлері және ақуыздың нитротирозиндену мөлшері (I) (H2O2 және нитротирозиндену өлшеулері ми салмағына қатысты көрсетілген). Әрбір таңба бір жануарды білдіреді. Қате жолақтары орташа ± SEM мәнін көрсетеді. WT = жабайы тип; GS = Lrrk2 p.G2019S мутантты тышқандары; DS = Lrrk2 p.D1994S мутантты тышқандары. Статистикалық талдау: түзетілмеген Фишердің LSD post-hoc тестімен екі факторлы дисперсиялық талдау (two-way ANOVA). P мәні &amp;lt;0.05 (&lt;em&gt;), P мәні &amp;lt;0.01 (&lt;strong&gt;), P мәні &amp;lt;0.001 (&lt;/strong&gt;&lt;/em&gt;).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/elevated-phosphorylated-synuclein-and-phosphorylated-tau-in.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LRRK2 пенентра&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нттылық&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;себептері&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белгісіз&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LRRK2&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мутациялы&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тышқандарды&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;H1N1-мен&lt;/text&gt;&lt;text x=\"226\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зақымдау&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;6 аптадан&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кейін мида&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фосфорланған&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ақуыздар өсті&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Инфекция нейро&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дегенерация&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;триггері болуы&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мүмкін&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt
