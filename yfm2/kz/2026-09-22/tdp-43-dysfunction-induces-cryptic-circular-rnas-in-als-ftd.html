t;/span&gt;&lt;/a&gt;Нонсенс-делдалды ыдырауды (NMD) тежеу және субжасушалық фракциялау:&lt;/h4&gt;\n&lt;p&gt;Фракциялау эксперименттері үшін SH-SY5Y жасушалары TDP-43-ке қарсы shRNA-ны индукциялау үшін 25 нг/мл доксициклин гиклатымен (Sigma) 10 күн бойы және NMD аппаратын блоктау үшін 0,5 мкМ SMG1-11j тежегішімен 24 сағат бойы өңделді. 10 күннен кейін жасушалар трипсинизацияланды, тұнбаға түсірілді және 1X PBS (Thermo) ішінде қайта суспензияланды. Қайта суспензияланған жасушалардың бір бөлігі тұнбаға түсіріліп, өндірушінің нұсқауларына сәйкес Ambion PARIS Kit (Life Technologies) көмегімен субжасушалық фракциялау үшін пайдаланылды. Ядролық және цитозольдік фракциялардан РНҚ Direct-zol жинағымен (Zymo) бағандағы ДНКаза I өңдеуімен экстракцияланды және NanoDrop One (ThermoFisher Scientific) көмегімен сандық анықталды. Әрбір эксперименттік жағдай үшін 2 мкг цитоплазмалық РНҚ және тең көлемдегі ядролық РНҚ фракциясы өндірушінің нұсқауларына сәйкес RevertAid First Strand cDNA Synthesis Kit (Thermo Fisher Scientific) көмегімен кері транскрипцияланды. RT-qPCR PowerUp SYBR Green Master Mix реагентімен (ThermoFisher Scientific) орындалды. ДНҚ амплификациясы QuantStudio 5 Real-Time PCR жүйесінде (Applied Biosystems) бақыланды. Ядролық және цитоплазмалық фракциялардағы әрбір транскрипттің салыстырмалы мөлшері Ct мәндері бойынша 2^−Ct ретінде бағаланды және әрбір компартменттегі транскрипт үлесі 100% деп қабылданған екі фракцияның қосындысына қатысты есептелді.&lt;/p&gt;\n&lt;h4 id=\"vestern-blotting\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#vestern-blotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вестерн-блоттинг:&lt;/span&gt;&lt;/a&gt;Вестерн-блоттинг:&lt;/h4&gt;\n&lt;p&gt;i3Neurons RIPA лизистік буферінде (Thermo Fisher Scientific, кат. № 89900), cOmpleteTM EDTA-free протеаза тежегішінің коктейлімен (Roche, кат. № 11836170001) және PhoSTOP фосфатаза тежегішімен (Roche, 4906845001) толықтырылған күйде гомогенизацияланды. Үлгілер NuPAGE 4−12% Bis-Tris ақуыз геліне (Invitrogen) жүктелді және NuPAGE MOPS буферінде электрофорез жүргізілді. Ақуыздар Trans-Blot Turbo 5x Transfer Buffer (BioRad, 10026938) және Trans-Blot Turbo Transfer System жүйесін пайдаланып 30 минут ішінде нитроцеллюлозалық мембранаға тасымалданды. Мембрана TBST (20 мМ Tris, 150 мМ NaCl және 0,1% Tween 20) ішіндегі 5% майсыз сүтте блокталды және TBST ішіндегі 5% майсыз сүтте сұйылтылған бастапқы антиденелермен түні бойы инкубацияланды (anti-RPTOR (Proteintech, 20984-1-AP) 1:2000, anti-EHMT1 (Bethyl Laboratories A301-642A) 1:2000, anti-TDP-43 (Proteintech, 10782-2-AP) 1:2000 және anti-TUBULIN (Proteintech, 66031) 1:2000). TBST ішіндегі 5% сүтте сұйылтылған пероксидазамен (HRP) конъюгацияланған екінші реттік антиденелермен 1 сағаттық инкубациядан кейін (anti-mouse HRP (Bio-Rad, 1706516) 1:10 000 және anti-rabbit HRP (Bio-Rad, 1706515) 1:10 000), мембрана Immobilon Classico HRP субстраты (Sigma-Aldrich) және Bio-Rad ChemiDoc жүйесінің көмегімен дамытылды.&lt;/p&gt;\n&lt;h4 id=\"rnkh-sekvenirleu-zhaene-aldyn-ala-oengdeu\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#rnkh-sekvenirleu-zhaene-aldyn-ala-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНҚ-секвенирлеу және алдын ала өңдеу:&lt;/span&gt;&lt;/a&gt;РНҚ-секвенирлеу және алдын ала өңдеу:&lt;/h4&gt;\n&lt;p&gt;SH-SY5Y, SK-N-BE(2) және i3N секвенирлеу кітапханалары RiboErase жинағы бар KAPA RNA HyperPrep көмегімен дайындалды және NovaSeq 6000 аппаратында секвенирленді. SH-SY5Y үшін 150 п.н. жұптық оқу, i3N үшін 100 п.н. жұптық оқу пайдаланылды. Үлгілердің сапасы Fastp көмегімен “qualified_quality_phred: 10” параметрімен қысқартылды және GENCODE v31 гендік модельдерімен STAR (v2.7.0f) көмегімен құрылған GRCh38 геномына теңестірілді. Ген экспрессиясы GENCODE v31 гендік модельдерін пайдаланып FeatureCounts көмегімен сандық анықталды.&lt;/p&gt;\n&lt;h4 id=\"ciri2-koemegimen-circrna-anykhtau\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#ciri2-koemegimen-circrna-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CIRI2 көмегімен circRNA анықтау:&lt;/span&gt;&lt;/a&gt;CIRI2 көмегімен circRNA анықтау:&lt;/h4&gt;\n&lt;p&gt;Өңделген оқылымдар (reads) BWA-MEM (v0.7.17) көмегімен -T 19 опциясымен адамның референстік геномына (GRCh38) тураланады. Әр үлгідегі circRNA-ны анықтау CIRI2 (v2.0.6) бағдарламалық жасақтамасы арқылы жүзеге асырылады, ол back-splicing түйісулеріне сәйкес келетін оқылымдарды іздеу арқылы circRNA-ларды анықтай алады. circRNA иесі гендерін анықтау үшін бағдарламаға Ensembl 108 ген аннотациясы ұсынылады. Табылған әрбір back-splicing оқиғасы үшін CIRI2 back-splicing түйісуіне және сәйкес сызықтық splicing түйісулеріне сәйкес келетін оқылымдар санын есеп береді, бұл back-splicing-ге қатысатын екі splicing түйісуіне де сызықтық түрде сәйкес келетін барлық оқылымдарды жинақтау арқылы есептеледі; егер circRNA басқа үлгілерде анықталған болса да, back-splicing түйісуіне ешқандай оқылым тағайындалмаған болса, екіншісі есеп берілмейді. Басқа үлгілерде анықталған тиісті back-splicing түйісулеріне ешқандай оқылым сәйкес келмеген үлгілерде сызықтық splicing сайттарына (тиісті сызықтық splicing түйісуі, SJ) сәйкес келетін оқылымдарды санау үшін әр үлгідегі туралау файлдары тек басқа үлгілерде табылған circRNA-ларға сәйкес келетін оқылымдарды қосу арқылы өзгертілді және CIRI2 осы файлдарда қайта іске қосылды. Туралау файлдарының операциялары Picard (v2.24.1) және SAMtools (v1.10) жиынтықтары арқылы орындалды.&lt;/p&gt;\n&lt;h4 id=\"differencialdy-ekspressiya-taldauy\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#differencialdy-ekspressiya-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дифференциалды экспрессия талдауы:&lt;/span&gt;&lt;/a&gt;Дифференциалды экспрессия талдауы:&lt;/h4&gt;\n&lt;p&gt;circRNA-лардың knock-down және бақылау жағдайлары арасындағы дифференциалды экспрессиясын бағалау үшін edgeR (v3.34.1) R пакеті анықталған back-splicing оқиғаларының оқылымдар санымен қамтамасыз етіледі. Оқылымдар саны аз оқиғалар дифференциалды экспрессия үшін сыналмайды. Оқылымдар санының төменгі шегі әр жағдайдағы үлгілер санына қарай белгіленді, атап айтқанда: SH-SY5Y және SK-N-BE(2) үшін кемінде 2 үлгіде 2 оқылым, i3LMN үшін кемінде 2 үлгіде 2 оқылым және i3N үшін кемінде 6 үлгіде 2 оқылым. Әр контраст үшін үлгілер стандартты edgeR нормализациясы (TMM) арқылы нормаланады; модельді сәйкестендіру және сынау glmFIT және glmLRT функциялары арқылы жүзеге асырылады. Back-splicing түйісулеріне сәйкес келетін оқылымдар edgeR арқылы Count Per Million (CPM) мәндеріне айналдырылады және circRNA мөлшерін анықтау үшін қолданылады. Сынақ үшін қолданылатын оқылымдар саны аз болғандықтан, біз дифференциалды түрде өрнектелген оқиғаларды таңдау үшін қате ашылу деңгейі (FDR) орнына p-мәнін қолдануды шештік және маңыздылық шегін 0,05 деп белгіледік. Біз кемінде 2 жасуша желісінде айтарлықтай жоғарылаған circRNA-ларды «High-Confidence» деп анықтадық. Біз TDP-KD жағдайында жоғарылаған, әр бақылау үлгісіне 1-ден аз оқылымы барларды «крипттік» (cryptic) деп санадық. Сызықтық РНҚ-лар мен тиісті сызықтық splicing түйісуі талдауы үшін біз бірдей оқылымдар саны шектерін қолдандық. Жылу карталары (Heatmaps) және Upset plot графикалық бейнелері ComplexHeatmap (v2.8.0) R пакеті арқылы бейнеленді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;edgeR әдісі топтар арасындағы оқылымдар санындағы айырмашылықтар статистикалық тұрғыдан маңызды екенін анықтау үшін статистикалық модельдерді пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"clr-taldauy\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#clr-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CLR талдауы:&lt;/span&gt;&lt;/a&gt;CLR талдауы:&lt;/h4&gt;\n&lt;p&gt;Әр үлгі үшін сақиналы back-splicing түйісуінің есептері (BSJ) және тиісті сызықтық splicing түйісуінің есептері (SJ) CIRI2 шығыс файлынан алынды. Әр circRNA оқиғасы үшін сақиналы-сызықтық қатынас (CLR) есептелді. CLR келесідей есептелді: CLR = 2BSJ/(2BSJ+SJ). CIRI2 нұсқаулығын ұстана отырып, BSJ есептері сақиналы және сызықтық оқылым үлесі арасындағы асимметрияны түзету үшін екіге көбейтілді: әр BSJ-ді қамтитын оқылым сақиналы түйісудің екі жағынан келетін тізбекті білдіреді, бірақ тек бір рет есептеледі, ал сызықтық (түйісу емес) оқылымдар бір ұшынан келеді. Содан кейін CTRL және TDP-43 knock-down (KD) топтары үшін жеке орташа CLR есептелді және топтық орташа көрсеткіштер арасындағы айырмашылық (ΔCLR) сақиналану процесіндегі өзгерістерді сандық бағалау үшін қолданылды: ΔCLR = CLRKD - CLRCTRL. Статистикалық маңыздылықты бағалау үшін біз биномдық жалпыланған сызықтық модельді (GLM) қолдандық, онда 2BSJ мәндері «табыстар», ал SJ мәндері «сәтсіздіктер» ретінде қаралды. Әр circRNA оқиғасы үшін екі ішкі модель сәйкестендірілді: жағдай әсері жоқтығын болжайтын нөлдік модель (CLR үлгілер бойынша тұрақты) және жағдайды болжаушы ретінде қамтитын толық модель. Содан кейін модельдерді салыстыру және жағдай терминін енгізу модельдің сәйкестігін айтарлықтай жақсартқанын анықтау үшін ықтималдық қатынасы тесті (LRT) қолданылды.&lt;/p&gt;\n&lt;h4 id=\"tdp-bajlanysu-sajttaryn-taldau\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#tdp-bajlanysu-sajttaryn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-байланысу сайттарын талдау:&lt;/span&gt;&lt;/a&gt;TDP-байланысу сайттарын талдау:&lt;/h4&gt;\n&lt;p&gt;TDP байланысу аймақтары POSTAR3 деректер базасынан алынды. Жоғарылаған circRNA-лар (кандидаттар) олардың айналасындағы интрондарда (нақтырақ айтқанда, BSJ-ден +- 1000bp аймағында немесе экзондық аймақпен қиылысса, одан азырақ) TDP байланысуы үшін сыналды. Әр кандидат үшін 2 бақылау circRNA-сы инвариантты circRNA-лардан (p-мәні &amp;gt; 0,05) айналасындағы интрондардың қасиеттерін (ұзындығы, %GC, back-splicing экзондары арасындағы қашықтық) және бақылау жағдайында иесі ген экспрессиясын ескере отырып таңдалды. Mann-Whitney U тестімен біз жоғарыда сипатталған терезелердің қасиеттері екі жиынтық арасында теңестірілгенін тексердік. 2 тәуелсіз деректер жиынтығында кемінде 2 қабаттасатын TDP-байланысу аймағы бар circRNA-лар TDP-интеракторлар деп белгіленді. c-circRNA айналасындағы интрондарында TDP-43 байланысуының сәйкес бақылау circRNA-ларына қатысты байытылуы Fisher-дің нақты тесті арқылы бағаланды.&lt;/p&gt;\n&lt;h4 id=\"kripttik-ekzondy-kartalau-taldauy\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#kripttik-ekzondy-kartalau-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Крипттік экзонды карталау талдауы:&lt;/span&gt;&lt;/a&gt;Крипттік экзонды карталау талдауы:&lt;/h4&gt;\n&lt;p&gt;TDP-43-ке тәуелді крипттік splicing оқиғаларының геномдық координаттары Brown және т.б. жұмысынан алынды, соның ішінде экзонды қосу және экзонды өткізіп жіберу оқиғалары. c-circRNA айналасындағы интрондарының координаттары тиісті транскрипт аннотацияларынан алынды. TDP-43 байланысу талдауы үшін қолданылған бірдей сәйкес бақылау circRNA-лар жиынтығы фон ретінде пайдаланылды. Крипттік оқиға, оның геномдық координаттары тізбекке тән түрде, екі айналасындағы интрондардың әрқайсысымен қабаттасқанда, circRNA-мен байланысты деп саналды. c-circRNA айналасындағы интрондарында крипттік splicing оқиғаларының сәйкес бақылау circRNA-ларына қатысты байытылуы Fisher-дің нақты тесті арқылы бағаланды.&lt;/p&gt;\n&lt;h4 id=\"nygc-als-konsorciumynyng-rna-sequencing-kogortasy\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#nygc-als-konsorciumynyng-rna-sequencing-kogortasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;NYGC ALS консорциумының RNA-sequencing когортасы:&lt;/span&gt;&lt;/a&gt;NYGC ALS консорциумының RNA-sequencing когортасы:&lt;/h4&gt;\n&lt;p&gt;Постмортальды тіндердің РНК секвенирлеу үшін біз NYGC ALS консорциумының үлгілерін пайдаландық, оның ішінде неврологиялық аурулары жоқ бақылау топтары, FTLD, амиотрофиялық латеральді склероз (ALS), ALS пен бірге жүретін маңдай-самақай деменциясы (ALS-FTLD) немесе Альцгеймер ауруына күдікті ALS (ALS-AD) үлгілері болды. Маңдай-самақай деменциясы (FTLD) бар пациенттер патологтың TDP-43 қосындылары бар FTLD (FTLD-TDP) диагнозына немесе FUS немесе Tau агрегаттарының болуына сәйкес жіктелді. ALS үлгілері консорциумның қолжетімді метадеректерін пайдалана отырып, келесі кіші санаттарға бөлінді: SOD1 немесе FUS мутациялары тіркелген немесе тіркелмеген ALS. Қарапайым болу үшін SOD1 немесе FUS мутациялары жоқ барлық ALS үлгілері осы жұмыста ALS-TDP ретінде топтастырылды, дегенмен постмортальды TDP-43 қосындыларын тіркеу жүйелі сипатқа ие болмады және сондықтан метадеректерге біріктірілмеді. Расталған постмортальды TDP-43 патологиясы барлық FTLD-TDP үлгілері үшін хабарланды. Үлгілерді өңдеу, кітапханаларды дайындау және РНК-seq сапасын бақылау превентіпті жұмыстарда кеңінен сипатталған.&lt;/p&gt;\n&lt;p&gt;Қысқаша айтқанда, РНК жылдам мұздатылған постмортальды тіннен TRIzol (Thermo Fisher Scientific) мен хлороформ көмегімен экстракцияланды, ал рибосомалық РНК-ны сарku үшін KAPA Stranded RNA-Seq Kit with RiboErase (KAPA Biosystems) көмегімен 500 нг жалпы РНК-дан RNA-Seq кітапханалары дайындалды. Сапа критерийлерінен өткен біріктірілген кітапханалар (орташа кірістіру өлшемі: 375 bp) Illumina HiSeq 2500 (125 bp жұптық ұштарымен) немесе Illumina NovaSeq (100 bp жұптық ұштарымен) құрылғыларында секвенирленді. Үлгілердің 16 мен 167 миллион жұп оқылымдар аралығындағы медиандық секвенирлеу тереңдігі 42 миллион оқылым жұбын құрады. Үлгілер біркелкі өңделді, соның ішінде Trimmomatic көмегімен адаптерлерді кесу және GENCODE v30 индекстері бар STAR (2.7.2a) көмегімен hg38 геном құрастырмасына туралау жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Биоинформатикадағы hg38 (Human Genome 38) — адам геномның қазіргі заманғы референттік нұсқасы болып табылады, ол генетикалық зерттеулерде оқылымдарды дұрыс орналастыру үшін негіз ретінде қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жынысы мен шығу тегі тінін растау үшін SAMtools пен Picard Tools көмегімен ауқымды сапаны бақылау жүзеге асырылды. Әлеуетті араласушы айнымалылар әр тін үшін бөлек бағаланды. Топтар арасындағы секвенирлеу тереңдігіндегі, РНК тұтастық көрсеткішіндегі (RIN) және қайтыс болған кездегі жастағы айырмашылықтар екі жақты Уилкоксон — Манн — Уитни тестілері, содан кейін көптік салыстырулар үшін Бонферрони түзетуі арқылы бағаланды. Жыныстық бөлініс Фишердің нақты тесті арқылы салыстырылды.&lt;/p&gt;\n&lt;h4 id=\"nygc-circrna-anykhtau-zhaene-bajytu-taldauy\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#nygc-circrna-anykhtau-zhaene-bajytu-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;NYGC circRNA анықтау және байыту талдауы:&lt;/span&gt;&lt;/a&gt;NYGC circRNA анықтау және байыту талдауы:&lt;/h4&gt;\n&lt;p&gt;Циркуляциялық РНК-лар (circRNA) «CircRNA detection» бөлімінде сипатталғандай анықталды. Егер кері сплайсинг түйіспесін (BSJ) қолдайтын кем дегенде бір оқылым анықталса, circRNA үлгіде экспрессияланған деп саналды. ALS-TDP үлгілерінде байытылған circRNA-ларды анықтау үшін біз Фишердің нақты тестін пайдаланып, әр тін үшін дербес түрде ALS-TDP және бақылау топтары арасында әр circRNA экспрессиялайтын үлгілердің үлесін салыстырдық. P-мәндері Бенджамини — Хохберг процедурасы арқылы көптік салыстырулар үшін түзетілді. ALS-TDP үлгілерінде байытылған және бақылау үлгілерінің 5%-дан азында анықталған circRNA-лар жасырын circRNA-лар (c-circRNA) ретінде жіктелді. Жеке c-circRNA кандидаттары үшін экспрессия BSJ-ті қолдайтын оқылымдардан есептелген және картаға түсірілген оқылымдардың жалпы санына нормаланған миллион картаға түсірілген оқылымдарға шаққандағы оқылымдар (RPM) түрінде мөлшерлік тұрғыдан бағаланды. Сәйкес сызықтық транскрипттер Salmon (v1.8.0) көмегімен мөлшерлік тұрғыдан бағаланды және миллион транскрипт (TPM) түрінде өрнектелді. Топтар арасындағы айырмашылықтар әр тін үшін дербес түрде екі жақты Уилкоксон — Манн — Уитни тестілері және Бонферрони түзетуі арқылы бағаланды. Жылу карталары (heatmaps) ComplexHeatmap58 R пакеті (v2.8.0) көмегімен жасалды.&lt;/p&gt;\n&lt;h4 id=\"tdp-43-zhasyryn-zhuektemesin-taldau\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#tdp-43-zhasyryn-zhuektemesin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43 жасырын жүктемесін талдау:&lt;/span&gt;&lt;/a&gt;TDP-43 жасырын жүктемесін талдау:&lt;/h4&gt;\n&lt;p&gt;TDP-43 жасырын жүктемесінің ұпайлары бұрын сипатталғандай алынды. Әр тін үшін үлгілер өздерінің жүктеме ұпайларына сәйкес рейтингке қойылды және төмен жүктеме тобына (төменгі 25%) және жоғары жүктеме тобына (жоғарғы 25%) бөлінді. Жүктеме топтары арасындағы секвенирлеу тереңдігіндегі айырмашылықтар әр тін үшін екі жақты Уилкоксон — Манн — Уитни тестілері мен Бонферрони түзетуі арқылы бағаланды. Жоғары және төмен жүктеме топтары арасындағы circRNA байытылуы екі топ арасындағы әр circRNA экспрессиялайтын үлгілердің үлесін салыстыру арқылы Фишердің нақты тесті көмегімен әр тін үшін дербес бағаланды.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-baghdarlamalykh-khamtamasyz-etu-zhaene-vizualizaciya\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#statistikalykh-baghdarlamalykh-khamtamasyz-etu-zhaene-vizualizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық бағдарламалық қамтамасыз ету және визуализация:&lt;/span&gt;&lt;/a&gt;Статистикалық бағдарламалық қамтамасыз ету және визуализация:&lt;/h4&gt;\n&lt;p&gt;Барлық статистикалық талдаулар R60 (v4.5.1) көмегімен орындалды. Қабылдаушының жұмыс сипаттамасы (ROC) қисығының талдаулары pROC61 (v1.19.0.1) көмегімен жүргізілді. Графикалық кескіндер ggplot262 (v4.0.1), ComplexHeatmap58 (v2.24.1), EnhancedVolcano63 (v1.26.0), eulerr64 (v7.0.4), circlize65 (v0.4.16), ggvenn66 (v0.1.19), ggpubr67 (v0.6.2), RColorBrewer68 (v1.1.3) және viridisLite69 (v0.4.2) R пакеттері арқылы жасалды. Осы жұмыстың суреттерінде көрсетілген деректердің таралуы мен ауытқуы, айтарлықтай айырмашылықтарды есептеу үшін қолданылатын статистикалық тесттер және n нақты мәні (мысалы, эксперименттердің биологиялық қайталанулар саны) сурет астындағы түсіндірмелерде көрсетілген. Сурет астындағы түсіндірмелерде «SD» «стандартты ауытқуды» (standard deviation), ал «SEM» «орташаның стандартты қатесін» (standard error mean) білдіреді. Суреттердегі маңыздылық мәндері келесі шартты белгілер көмегімен бейнеленді: n.s. p &amp;gt; 0.05, *p &amp;lt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001. Қорапты диаграммаларда (boxplot) интерквартильдік ауқым деректердің 75-ші және 25-ші перцентильдерін қамтиды, ал медиана қорап ішіндегі сызық ретінде көрсетілген (50-ші перцентиль). Қажет болған жағдайда, деректер GraphPad Prism 10 көмегімен салынды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f2.jpg\" alt=\"2-сурет — c-circRNA-лар посмерттік ALS/FTD кезінде TDP-43 протеинопатиясын сезімтал түрде ажыратады: A) Талданған бес ОЖ\" /&gt;&lt;/p&gt;\n&lt;p&gt;*2-сурет — c-circRNA-лар посмерттік ALS/FTD кезінде TDP-43 протеинопатиясын сезімтал түрде ажыратады: A) Талданған бес ОЖЖ аймағында (мойын жұлын, бел жұлын, моторлық қыртыс, маңдай қыртысы және самай қыртысы) бақылаумен салыстырғанда ALS-TDP үлгілеріндегі криптикалық circRNA-лардың (c-circRNA) байытылуын (мүмкіндіктер қатынасының табиғи логарифмі, LnOR) көрсететін жылу картасы. c-circRNA-лар жылу картасының оң жағындағы гистограммаларда көрсетілгендей, тіндер бойынша орташа LnOR мәнімен реттелген. Түстің қарқындылығы Фишердің нақты тесті арқылы есептелген c-circRNA байытылу шамасын көрсетеді. B) Төмен және жоғары жүктеме топтарына тағайындалған ALS-TDP үлгілеріндегі TDP-43 криптикалық жүктеме ұпайының таралуын көрсететін жәшік диаграммасы. Үлгілер тиісінше TDP-43 криптикалық жүктеме ұпайының ең төменгі және ең жоғары квартильдеріне сәйкес стратификацияланды. C) Төмен және жоғары жүктеме топтарында әрбір c-circRNA-ны экспрессиялайтын ALS-TDP үлгілерінің үлесін көрсететін сызықтық график. Әрбір сызық бір c-circRNA-ны білдіреді. Жоғары жүктеме тобында айтарлықтай байытылған c-circRNA-лар (P &amp;lt; 0.05, Фишердің нақты тесті) белгіленген. Төмен жүктеме тобында ешқандай c-circRNA айтарлықтай байытылған жоқ. Көк көрсеткілер қосымша тексеру үшін таңдалған төрт кандидат c-circRNA-ны көрсетеді. D) Ауру топтары мен ОЖЖ аймақтары бойынша NYGC ALS Consortium RNA-seq деректер жинағындағы таңдалған c-circRNA-лардың (c-circUNC13A, c-circBCAR1, c-circDIP2C және c-circDSCAM) экспрессиясын көрсететін жәшік диаграммалары. c-circRNA экспрессиясы кітапхана өлшеміне нормаланған бэк-сплайсинг түйінінің (BSJ) санағынан (миллион оқуға шаққандағы RPM) мөлшерлік түрде анықталды. Әрбір нүкте жеке үлгіні білдіреді. Статистикалық маңыздылық Бонферрони түзетуі бар Уилкоксон — Манн — Уитни тесті көмегімен бағаланды (*p &amp;lt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001). Маңызды емес салыстырулар (p &amp;gt; 0.05) хабарланбайды. E) Сау бақылаулардан (CTRL, n = 21) және TDP-43 патологиясы бар (FTD-TDP, n = 56) немесе жоқ (FTD-non-TDP, n = 12) FTD пациенттерінің посмерттік адам маңдай қыртысы үлгілеріндегі таңдалған c-circRNA-лардың (c-circUNC13A, c-circBCAR1, c-circDIP2C, c-circDSCAM) RT–qPCR талдауы. c-circRNA экспрессиясы GAPDH мРНК-сына нормаланды және 1 мәніне орнатылған бақылау үлгісіне қатысты еселік өзгеріс (log₂(2^−ΔΔCt)) ретінде ұсынылған. Әрбір нүкте жеке үлгіні білдіреді. Статистикалық маңыздылық Бонферрони түзетуі бар Уилкоксон — Манн — Уитни тесті көмегімен бағаланды (n.s. p &amp;gt; 0.05, **&lt;em&gt;p &amp;lt; 0.001). F) Жеке c-circRNA-лардың және біріктірілген төрт маркером моделінің FTD-TDP-ны сау бақылаулардан және TDP-43 патологиясы жоқ FTD жағдайларынан ажырату қабілетін бағалайтын қабылдаушының жұмыс сипаттамасы (ROC) қисықтары. Қисық астындағы аумақтар (AUC) көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f3.jpg\" alt=\"3-сурет — c-circRNA және сызықтық CE-лер нейродегенерациямен байланысты гендермен байланысады: A) Жоғары сенімді криптик\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-сурет — c-circRNA және сызықтық CE-лер нейродегенерациямен байланысты гендермен байланысады: A) Жоғары сенімді криптикалық circRNA-лар (көк) мен өздерінің фланктеуші интрондарының бірінде криптикалық сплайсинг оқиғасы бар жоғары сенімді криптикалық circRNA-лар (жасыл) арасындағы қабаттасуды көрсететін Венн диаграммасы. Қабаттасудың маңыздылығын бағалау үшін Фишердің нақты тесті қолданылды. 14 ортақ circRNA оң жақта тізімделген. Қараңғы шрифтпен көрсетілген c-circRNA-лар кейінгі талдаулар үшін таңдалды. B) RPTOR генінде криптикалық сплайсинг оқиғасының (жасыл) және криптикалық сақиналы РНК (c-circRNA) түзу оқиғасының (көк) бір мезгілде пайда болуын көрсететін Сашими графикасы. Жоғарғы панель оқиғалардың схемалық көрінісін көрсетеді, ал төменгі панельдер көрсетілген жағдайларда оқу қаптамасын және сплайсинг сайттарының қолданылуын көрсетеді: бақылау (CTRL NT), TDP-43 нокдауны (KD NT) және нонсенс-медиацияланған ыдырауды тежеумен бірге TDP-43 нокдауны (KD NMDi). C) UNC13A, RPTOR, EHMT1 және DIP2C сызықтық криптикалық сплайсинг изоформалары үшін олардың сәйкес дұрыс сплайсинг жасалған түйіндеріне қатысты пайыздық сплайсинг жасалған (PSI, ψ) мәндері. ψ мәндері бақылау немесе TDP-43 нокдауны жағдайында, циклогексимид арқылы нонсенс-медиацияланған ыдырауды (NMD) тежеумен немесе онсыз SH-SY5Y жасушаларынан алынған массалық RNA-seq деректерінен есептелді. Жолақтар тәуелсіз биологиялық қайталаулардың орташа ± SD мәнін білдіреді, жеке қайталаулар қара нүктелер ретінде көрсетілген (n = 4). Статистикалық маңыздылық бірнеше тесттік салыстыруға түзетуі бар екі жақты жұптастырылмаған Стьюдент t-тесті көмегімен бағаланды (FDR Бенджамини — Хохберг) (n.s. p &amp;gt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001). D) Бақылау және TDP-нокдаун i3N жасушаларындағы EHMT1, RPTOR және TDP-43 ақуыз деңгейлерін көрсететін өкілді вестерн-блот; жүктеу бақылауы ретінде α-тубулин (TUBULIN) қолданылды. n = 3 тәуелсіз биологиялық қайталау. E) Көрсетілген гендерден алынған сызықтық криптикалық транскрипттердің (CE) және сәйкес криптикалық circRNA-лардың (c-circRNA) жасушаемшілік локализациясы. TDP-43 сарқылған SH-SY5Y жасушаларынан ядролық және цитоплазмалық фракциялар бөлініп алынды және транскрипт мөлшері RT-qPCR көмегімен өлшенді. Қабатталған бағанды диаграммалар ядролық (ақшыл сұр) және цитоплазмалық (қою сұр) фракцияларда анықталған әрбір транскрипттің үлесін көрсетеді. GAPDH және пре-GAPDH тиісінше цитоплазмалық және ядролық бақылау ретінде қолданылды. Жолақтар үш тәуелсіз биологиялық қайталаудың орташа ± SD мәнін білдіреді (n = 3). F) Сау бақылаулардан (CTRL, n = 21) және TDP-43 патологиясы бар (FTD-TDP, n = 56) немесе жоқ (FTD-non-TDP, n = 12) FTD пациенттерінің посмерттік адам маңдай қыртысы үлгілеріндегі сызықтық криптикалық транскрипттердің (CE, жасыл) және олардың сәйкес криптикалық circRNA-ларының (c-circRNA, көк) RT-qPCR талдауы. Транскрипт мөлшері GAPDH мРНК-сына нормаланды және логарифмдік түрде түрлендірілген экспрессия мәндері (log₂(2^−ΔCt)) ретінде ұсынылған. Әрбір нүкте жеке үлгіні білдіреді. Статистикалық маңыздылық Бонферрони түзетуі бар Уилкоксон — Манн — Уитни тесті көмегімен бағаланды (n.s. p &amp;gt; 0.05, **&lt;em&gt;p &amp;lt; 0.001).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd-f4.jpg\" alt=\"4-сурет — c-circUNC13A in vitro және in vivo жағдайларында UNC13A CE-мен бірге реттеледі: A) Бақылау (Control) және TDP-\" /&gt;&lt;/p&gt;\n&lt;p&gt;*4-сурет — c-circUNC13A in vitro және in vivo жағдайларында UNC13A CE-мен бірге реттеледі: A) Бақылау (Control) және TDP-43 сарқылуы (TDP-43 KD) жағдайында төрт жасушалық модельде анықталған UNC13A circRNA изоформаларының схемалық көрінісі. Көк доғалар екі жағдайда да анықталған circRNA изоформаларын білдіреді, ал қызыл доғалар тек TDP-43 сарқылуынан кейін анықталған circRNA изоформаларын көрсетеді. Доға қалыңдығы төрт деректер жинағы бойынша орташа circRNA экспрессия деңгейіне (CPM) пропорционалды. B) Бақылау (CTRL) және TDP-43 нокдаун (TDP-43 KD) жағдайында көрсетілген төрт жасушалық модельдегі c-circUNC13A экспрессиясының RT-qPCR талдауы. Транскрипт мөлшері GAPDH мРНК-сына нормаланды және бақылау шарты 1 мәніне орнатылған салыстырмалы экспрессия мәндері (2^−ΔΔCt) ретінде ұсынылған. Әрбір нүкте тәуелсіз биологиялық қайталауды білдіреді (n = 4). Статистикалық маңыздылық екі жақты жұптастырылмаған Стьюдент t-тесті көмегімен бағаланды (***p &amp;lt; 0.001). C) PROTAC көмегімен TDP-43 сарқылуы және кейінгі қалпына келу кезіндегі UNC13A криптикалық экзонының (CE) және c-circUNC13A мөлшерінің RT-qPCR талдауы. Сол жақ панель: транскрипт мөлшері PROTAC көмегімен TDP-43 сарқылуы индукцияланғаннан кейін көрсетілген уақыт нүктелерінде өлшенді. Оң жақ панель: 14 күндік PROTAC емінен кейін жасушалар TDP-43 деңгейін қалпына келтіру үшін каталитикалық белсенді емес бәсекелеске (PROTACi) ауыстырылды және транскрипт мөлшері көрсетілген қалпына келу уақыт нүктелерінде өлшенді. Екі панельде де транскрипт мөлшері GAPDH мРНК-сына нормаланды және салыстырмалы экспрессия мәндері (2^−ΔΔCt) ретінде ұсынылды, PROTAC емінің соңғы уақыт нүктесі (72 сағ) және PROTACi емінің бастапқы уақыт нүктесі (0 сағ) әрқайсысы 1 мәніне орнатылды. Деректер үш тәуелсіз биологиялық қайталаудың орташа ± SD мәнін білдіреді (n = 3). D) CRISPR/Cas9 көмегімен UNC13A криптикалық экзонының (CE, жасыл) жойылуының схемалық көрінісі. ΔCE жасушылық желісін жасау үшін қолданылатын екі гид РНК (gRNA1 және gRNA2) позициялары көрсетілген. E) Бақылау (CTRL) немесе TDP-43 нокдаун (KD) жағдайында жабайы түрдегі (Wt) немесе UNC13A криптикалық экзоны жойылған (ΔCE) фоны бар SH-SY5Y жасушаларындағы көрсетілген нысандардың RT-qPCR талдауы. Транскрипт мөлшері GAPDH мРНК-сына нормаланды және CTRL үлгілеріне қатысты 1 мәніне орнатылған салыстырмалы экспрессия мәндері (2^−ΔΔCt) ретінде ұсынылған. Әрбір нүкте жеке үлгіні білдіреді (n = 4). Статистикалық маңыздылық екі жақты жұптастырылмаған Стьюдент t-тесті көмегімен бағаланды (n.s. p &amp;gt; 0.05, **p &amp;lt; 0.01, ***p &amp;lt; 0.001). F) UNC13A криптикалық экзонына (CE, жасыл) бағытталған жоғары тиімді сплайсингті түзететін антисенс олигонуклеотидтің (ASO) көрінісі. ASO байланысу сайты қызыл түспен көрсетілген. G) TDP-43 сарқылған жасушалардағы ASO-1-дің өсіп келе жатқан концентрацияларының c-circUNC13A экспрессиясына әсерін көрсететін доза-жауап қисығы. c-circUNC13A деңгейлері 100% етіп орнатылған TDP-43 нокдаун шартына қатысты ұсынылған. Жеке деректер нүктелері орташа ± SD мәнімен көрсетілген. Деректер 4 параметрлі лог-логистикалық функциямен сәйкестендірілген. H) ASO-1 арқылы c-circUNC13A және UNC13A криптикалық экзон экспрессиясының төмендеуі арасындағы корреляция. Деректер нүктелері ASO-1 концентрациясына сәйкес боялған. Айқындар тек TDP-43 KD жасушаларындағы c-circUNC13A және UNC13A криптикалық экзон деңгейлерін көрсетеді (әр ось үшін орташа ± SD). Үшбұрыштар TDP-43 нокдауны жоқ базальды жағдайларды көрсетеді, онда не c-circUNC13A, не UNC13A криптикалық экзоны анықталмайды. I) ASO-1 арқылы c-circUNC13A экспрессиясының төмендеуі және дұрыс сплайсинг жасалған UNC13A транскриптінің қалпына келуі арасындағы корреляция. Деректер нүктелері ASO-1 концентрациясына сәйкес боялған. Сұр жолақтар ASO емі жоқ жасушалардағы орташа ± SD экспрессия деңгейлерін көрсетеді. J) c-circUNC13A деңгейлеріне UNC13A криптикалық экзонына бағытталған ASO емінің әсерін бағалау үшін in vivo эксперименттік дизайнның схемалық көрінісі. Бүкіл адам UNC13A генін экспрессиялайтын BAC трансгенді тышқандары ASO-ның интрацеревентрикулярлық (ICV) енгізілуін, содан кейін TDP-43 нокдаунын индукциялау үшін miRNA экспрессиялайтын AAV-ның венаішілік енгізілуін қабылдады. K) AAV арқылы TDP-43 нокдаунынан кейін, UNC13A криптикалық экзонына бағытталған ASO емімен немесе онсыз адам UNC13A BAC трансгенді тышқандарының қыртысында, ми бағанында, каудальды жұмылында (SC) және ростральды жұлынында (SC) c-circUNC13A экспрессиясының RT-qPCR талдауы. c-circUNC13A экспрессиясы TBP мРНК-сына нормаланды және 100% етіп орнатылған TDP-43 нокдаун шартына қатысты пайыздық экспрессия ретінде ұсынылған. Әрбір нүкте жеке тышқанды білдіреді. Статистикалық маңыздылық бірнеше тесттік салыстыруға түзетуі бар бір жақты Anova көмегімен бағаланды (n.s. p &amp;gt; 0.05, **&lt;em&gt;p &amp;lt; 0.001).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-22/tdp-43-dysfunction-induces-cryptic-circular-rnas-in-als-ftd.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width
