рталық блоктан) таңдалып, талданды. Бұл процедура әрбір еркек қосымша безінің (MAG) екі бөлігі үшін де қайталанып, орташа мәні есептелді; әрбір эксперименттік жағдай үшін 10 жеке без бағаланды. Әрбір шаршының өлшемі 100 x 100 пиксель болды. Талдау бөлшектерді анықтау құралы арқылы жүргізілді, мұнда шаршылар үшін пиксель шегінің мәні тұрақты экспозицияда ≥ 25 (максимум 255) деп белгіленді, содан кейін әрбір шаршының ішінде келесі көрсеткіштер есептелді: GFP-MFAS пунктаттарының саны, әрбір пунктаттың орташа өлшемі, GFP флуоресценциясының жалпы ауданы, GFP флуоресценциясымен жабылған ауданның пайызы, GFP-оң пиксельдердің орташа қарқындылығы, интегралды тығыздық (% флуоресценция ауданы × орташа флуоресценция сигналының қарқындылығы). Сондай-ақ, біз әрбір аномальды агрегацияланған материалды қамтитын құрылымның өлшемін анықтау үшін % GFP-оң ауданның пунктаттар санына қатынасын (% GFP-оң аудан/пунктат) есептедік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Негізгі жасушалардағы GFP-MFAS талдауы әрбір жағдай үшін 10 безді 100x100 пиксельдік стандартты торды пайдаланып, қарқындылық пен агрегаттар морфологиясын өлшеу арқылы жүргізілді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bekitilgen-tinderdi-pajdalanyp-mag-lyumenindegi-gfp-mfas-taldauy\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#bekitilgen-tinderdi-pajdalanyp-mag-lyumenindegi-gfp-mfas-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бекітілген тіндерді пайдаланып MAG люменіндегі GFP-MFAS талдауы&lt;/span&gt;&lt;/a&gt;Бекітілген тіндерді пайдаланып MAG люменіндегі GFP-MFAS талдауы&lt;/h4&gt;\n&lt;p&gt;ImageJ бағдарламасындағы тіктөртбұрыш құралын пайдаланып, әрбір бөліктің ортасындағы орталық люмен аймағында бір шаршы (200 x 200 пиксель) белгіленді және ImageJ орташа қарқындылық функциясы арқылы әрбір бөлік үшін орташа GFP-MFAS қарқындылығы есептелді. Содан кейін бұл екінші бөлік үшін қайталанды. Әрбір еркек шыбын үшін осы екі мәннің орташасы есептелді.&lt;/p&gt;\n&lt;h4 id=\"keskinderdi-oengdeu-zhaene-suretterge-dajyndau\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#keskinderdi-oengdeu-zhaene-suretterge-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескіндерді өңдеу және суреттерге дайындау&lt;/span&gt;&lt;/a&gt;Кескіндерді өңдеу және суреттерге дайындау&lt;/h4&gt;\n&lt;p&gt;Осы зерттеу үшін тірі жасушалардың кескіндері Leica Thunder микроскопында жинақталған деконволюциялық стектерді пайдаланып дайындалды. Барлық ұсынылған суреттерде кескіндер секреторлық жасушалар (SC) морфологиясын оңтайлы көрсету үшін таңдалған бір қабатты композиттер болып табылады. Қызығушылық тудыратын фенотиптерді ең жақсы көрсететін флуоресценция қарқындылығы таңдалып, барлық тірі жасуша деректері бойынша кескіндерді өңдеу үшін пайдаланылды. Суреттерде көрсетілген әрбір генотип үшін талдау кескіндерін жасауда кесінділердің дәйекті проекциясы мен параметрлері қолданылды. Барлық кескіндер SC бөлшектеріне назар аудара отырып, бірдей өлшемдерге дейін қиылды.&lt;/p&gt;\n&lt;p&gt;Бекітілген бездердің MC кескіндері үшін LSM980 конфокальды микроскопын пайдаланып, MC ядроларының ортасынан өтетін бір z-жазықтық алынды. Флуоресценция қарқындылығын сандық бағалауда дәйектілікті қамтамасыз ету үшін GFP күшейткіш параметрлері барлық генотиптер үшін тұрақты сақталды.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"sandykh-baghalau-zhaene-statistikalykh-taldau\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#sandykh-baghalau-zhaene-statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сандық бағалау және статистикалық талдау&lt;/span&gt;&lt;/a&gt;Сандық бағалау және статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Бірнеше эксперименталды генотиптерді бақылау тобымен салыстыру үшін біз Краскел–Уоллис параметрлік емес критерийін және одан кейін Даннның көптік салыстыруларға арналған post-hoc тестін қолдандық. Екі топты салыстырғанда, Манн–Уитни параметрлік емес U-критерийі пайдаланылды.&lt;/p&gt;\n&lt;p&gt;Бұл статистикалық талдаулар GraphPad Prism бағдарламасында орындалды. Суреттерде көрсетілген барлық графиктер әр генотип үшін орташа мәнді көрсетеді және стандартты ауытқуды (SD) білдіретін қателік сызықтарын қамтиды.&lt;/p&gt;\n&lt;h4 id=\"keskinderdi-oengdeu\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#keskinderdi-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескіндерді өңдеу&lt;/span&gt;&lt;/a&gt;Кескіндерді өңдеу&lt;/h4&gt;\n&lt;p&gt;Zerene Stacker көмегімен стектеуден кейін, әр көздің композиттік кескіндері FIJI көмегімен әртүрлі макростарды қолданатын автоматтандырылған баптаулар арқылы өңделді (макростар үшін 1-қосымшаны қараңыз). Бүкіл процесс Рис. S5 суретінде бейнеленген. Көздің ортасында 576 x 624 пиксель өлшеміндегі эллипстік аймақ таңдалды. ImageJ үшін Trainable Weka Segmentation плагині шыбын көзінің бірқатар эталондық кескіндері негізінде жеке омматидийлерді анықтау және «қалыпты» және ақаулы көздердегі олардың арасындағы шекараларды белгілеу үшін оқытылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Watershed (суайрық) — бұл кескінді сегменттеу алгоритмі, ол пиксель жарықтығын топографиялық бедер ретінде қарастырып, бір-біріне тиіп тұрған объектілерді бөледі, мұнда объект шекаралары «суайрықтарға» сәйкес келеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алынған сегменттелген ықтималдық картасы 8-биттік форматқа ауыстырылып, бинарлық түрге келтірілді, содан кейін жеке омматидийлерді идентификациялау үшін watershed трансформациясы қолданылды. Өңдеуден кейін, FIJI-дің кіріктірілген «Analyse Particles» функциясы омматидийлердің XY координаттарын генерациялады және олар Excel-ге экспортталды.&lt;/p&gt;\n&lt;h4 id=\"derekterdi-taldau\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#derekterdi-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді талдау&lt;/span&gt;&lt;/a&gt;Деректерді талдау&lt;/h4&gt;\n&lt;p&gt;Тұрақтылықты есептеу үшін қолданылған деректерді талдау әдістемесі Рис. S5 суретінде көрсетілген. Таңдалған аймақтағы әр омматидий үшін ең жақын алты омматидийге дейінгі бұрыш есептелді. Бұл бұрыштар нақты генотиптің әр көзі үшін жинақталды (әр көз үшін шамамен 250 омматидий). Эталондық қисық үшін бақылау генотипіндегі шамамен 15 аналық шыбынның бұрыштары, әр көз үшін ең жиі кездесетін бұрыш мәнін нөлге теңестіру арқылы қисық стандартталғаннан кейін жинақталды.&lt;/p&gt;\n&lt;p&gt;Басқа барлық генотиптердің жеке көздері үшін қисықтар, тағы да ең жиі кездесетін бұрыш мәнін нөлге теңестіргеннен кейін, осы эталондық қисықпен салыстырылды және Пирсон корреляция коэффициенті есептелді. Анық айырмашылықтар Пирсон корреляция коэффициентін эталондық қисыққа қатысты өзгертті, ол кейіннен Фишер трансформациясы көмегімен қалыпқа келтірілді. Фишер трансформациясы әр көз үшін Пирсон корреляцияларына қолданылып, статистикалық талдау үшін қалыпты үлестірілген деректерді құрады. Трансформацияланған Z-мәндері GraphPad Prism-ге экспортталды, онда салыстырулар Браун–Форсайт және Уэлч ANOVA тесттері, содан кейін көптік салыстырулар үшін Уэлч түзетуімен жұпталмаған t-тесттер арқылы жүзеге асырылды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f1.jpg\" alt=\"1-сурет. СК-экспрессияланатын адамның Aβ белоктары қосалқы жыныс безінің (MAG) орталығындағы эпителий жасушаларында эндо\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. СК-экспрессияланатын адамның Aβ белоктары қосалқы жыныс безінің (MAG) орталығындағы эпителий жасушаларында эндолизосомалық ақауларды тудырады. A. Эксперименталды стратегияны көрсететін схема. СК-лар тек MAG дистальды ұшында орналасады, бірақ GFP-MFAS және DCG компартименттерінің басқа мазмұнын бездің люменіне секрециялайды, содан кейін олар МК арқылы эндоцитозға ұшырауы мүмкін. B-D. GFP-mfas гендік тұзағын экспрессиялайтын және арнайы СК-ларда басқа трансгенсіз (B) немесе UAS-реттелетін Aβ-wt (C) немесе Aβ-Iowa (D) экспрессиялайтын 6 күндік аталықтардың MAG орта шеніндегі МК эпителий қабаты мен MAG люмені арқылы көлденең қималарының конфокальды кескіндері (ең оң жақтағы панельдер). Үлкейтілген панельдер 3 есе үлкейтуді көрсетеді. E-H. MAG орталық бөлігіндегі МК қабатындағы GFP-MFAS флуоресценциясының жалпы % аумағын (E), интеграцияланған қарқындылықты (аумақ МК-дағы орташа GFP флуоресценция қарқындылығына көбейтілген) (F), GFP-MFAS-пен белгіленген жеке МК компартименттерінің/пункталарының орташа % аумағын (G) және MAG люменіндегі GFP-MFAS флуоресценциясының орташа қарқындылығын (H) көрсететін бағанды диаграммалар. СК-спецификалық Aβ-wt және Aβ-Iowa экспрессиясы МК ішінде құрамында GFP-MFAS бар үлкенірек құрылымдарды тудыратынын ескеріңіз, сонымен қатар Aβ-Iowa МК ішіндегі GFP-MFAS бар жалпы аумақты және интеграцияланған қарқындылықты айтарлықтай арттырады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f2.jpg\" alt=\"2-сурет. Aβ-Iowa тудырған МК арқылы GFP-MFAS қабылдануы СК-дағы секрецияны тудыратын BMP сигнализациясына тәуелді. A, B.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Aβ-Iowa тудырған МК арқылы GFP-MFAS қабылдануы СК-дағы секрецияны тудыратын BMP сигнализациясына тәуелді. A, B. СК-да шамадан тыс экспрессияланған Dad бар (B) немесе жоқ (A) жағдайда Aβ-Iowa экспрессиялайтын бездердің МК қабатында және MAG люменінде GFP-MFAS жиналуын көрсететін конфокальды суреттер. Dad экспрессияланған кезде секреция мен МК GFP-MFAS айтарлықтай төмендейтінін ескеріңіз. C-F. MAG орталық бөлігіндегі МК қабатындағы GFP-MFAS флуоресценциясының жалпы % аумағын (C), МК флуоресценциясының интеграцияланған қарқындылығын (D), GFP-MFAS-пен белгіленген жеке МК компартименттерінің орташа % аумағын (E) және MAG люменіндегі GFP-MFAS флуоресценциясының орташа қарқындылығын (F) көрсететін бағанды диаграммалар.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f3.jpg\" alt=\"3-сурет. СК-экспрессияланатын Aβ-wt және Aβ-Iowa DCG-ге локализацияланады. A-C. Жабайы типтегі MAG (A) және СК-ларда Aβ-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. СК-экспрессияланатын Aβ-wt және Aβ-Iowa DCG-ге локализацияланады. A-C. Жабайы типтегі MAG (A) және СК-ларда Aβ-wt (B) немесе Aβ-Iowa (C) экспрессиялайтын және GFP-mfas гендік тұзағы бар MAG дистальды бөліктерінің конфокальды суреттері, олардың барлығы адамның Aβ эпитопымен айқас әрекеттесетін антиденемен иммунобояудан өткен. Жалпы алғанда, Aβ боялуы барлық дерлік СК DCG компартименттерінде байқалатынын және GFP-MFAS-пен белгіленген DCG-мен қабаттасатынын ескеріңіз (ақ көрсеткілер), дегенмен флуоресценция деңгейі GFP-ге қарағанда көбірек өзгермелі болып келеді. Aβ-ға қарсы антидене сонымен қатар Aβ экспрессияламайтын MAG-та да перифериялық бұлшықет қабатындағы құрылымдармен орынсыз айқас әрекеттеседі (қызыл көрсеткі). Мысал СК-лар ақ пунктирлі шеңбермен қоршалған. Ақ шаршылар үлкейту аймақтарының орналасқан жерін белгілейді. Масштабты сызғыштар: жоғары үлкейтіп көру үшін 30 µm, 10 µm және 5 µm (сәйкесінше Zoom x 3 және Zoom x 6).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f4.jpg\" alt=\"4-сурет. СК Rab11-экзосомалары да МК арқылы эндоцитозға ұшырайды. A, B. СК-ларда GFP-mfas гендік тұзағы бар және CD63-mC\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. СК Rab11-экзосомалары да МК арқылы эндоцитозға ұшырайды. A, B. СК-ларда GFP-mfas гендік тұзағы бар және CD63-mCherry экспрессиялайтын, басқа трансгенсіз (A) немесе Aβ-wt-пен бірге (B) аталықтардың MAG орталық аймақтарының конфокальды суреттері. CD63-mCherry екі жағдайда да МК арқылы эндоцитозға ұшырайтынын және оның көп бөлігі GFP-MFAS-пен ко-локализацияланатынын (көрсеткілер) немесе жақын жерде орналасқанын ескеріңіз. СК-лар Aβ-wt экспрессиялаған кезде GFP-MFAS сигналы көбірек шашыраңқы болады (сонымен қатар 1 және S1D-F суреттерді қараңыз) және бұл үлкенірек эндолизосомалардағы локализацияға сәйкес келетін CD63-mCherry таралуында көрініс табады. Ақ шаршылар үлкейту аймақтарының орналасқан жерін белгілейді. Масштабты сызғыштар: үлкейтілген көріністер үшін 30 µm және 10 µm.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f5.jpg\" alt=\"5-сурет. СК-спецификалық Chmp5 нокдауны Aβ тудырған GFP-MFAS-тың МК-ға қабылдануын күшті түрде басады. A, B, G, H, M, N.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. СК-спецификалық Chmp5 нокдауны Aβ тудырған GFP-MFAS-тың МК-ға қабылдануын күшті түрде басады. A, B, G, H, M, N. СК-ларда әртүрлі нокдаун конструкцияларын, сондай-ақ Aβ-wt (G, H) және Aβ-Iowa (M, N) конструкцияларын экспрессиялайтын және GFP-mfas гендік тұзағы бар аталықтардың MAG орталық аймақтарының конфокальды суреттері. Aβ экспрессиясы болмаған кезде, СК-спецификалық Chmp5 нокдауны mCherry нокдаун бақылауымен (A) салыстырғанда МК-дағы GFP-MFAS деңгейін төмендетеді (B). МК-дағы GFP-MFAS деңгейлері сондай-ақ СК-ларда Aβ-wt (G, H) немесе Aβ-Iowa (M, N) экспрессияланатын MAG-та mCherry нокдаун бақылауларымен салыстырғанда Chmp5 нокдауны арқылы төмендейді. C-F, I-L, O-R. СК-лар Aβ (C-F), Aβ-wt (I-L) немесе Aβ-Iowa (O-R) экспрессияламайтын генотиптерде Chmp5 нокдауны тудырған GFP-MFAS тасымалдануының басылуын сандық түрде көрсететін бағанды диаграммалар. Chmp5 нокдаунынан кейін MAG орталық бөлігіндегі МК қабатындағы GFP-MFAS флуоресценциясының жалпы % аумағын (C, I, O), интеграцияланған тығыздықты (аумақ МК-дағы орташа GFP флуоресценция қарқындылығына көбейтілген) (D, J, P) және GFP-MFAS-пен белгіленген жеке МК компартименттерінің орташа % аумағын (E, K, Q) өлшейтін талдаулар арқылы барлық генотиптер үшін айтарлықтай төмендеу байқалады. Chmp5 нокдауны сондай-ақ СК-лар Aβ экспрессияламайтын MAG-та GFP-MFAS секрециясын (MAG люменіндегі GFP-MFAS флуоресценциясының орташа қарқындылығын) төмендетеді (F), бірақ Aβ-wt экспрессияланған кезде ешқандай әсер етпейді және Aβ-Iowa болған кезде секрецияны арттыратын сияқты. Ақ шаршылар үлкейту аймақтарының орналасқан жерін белгілейді. Масштабты сызғыштар: үлкейтілген көріністер үшін 30 µm және 10 µm.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f6.jpg\" alt=\"6-сурет. SC-спецификалық Chmp5 нокдауны DCG компартменттерінің биологиясы мен сапа бақылауына тек шамалы әсер етеді A-F.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет. SC-спецификалық Chmp5 нокдауны DCG компартменттерінің биологиясы мен сапа бақылауына тек шамалы әсер етеді A-F. Жеке SC-ның (үзінді шеңбермен белгіленген) ex vivo кең өрісті флуоресцентті кескіндері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f7.jpg\" alt=\"7-сурет. Адамның Aβ-wt және Aβ-Iowa экспрессиясы Drosophila көзіндегі оматидиальды тұрақтылықтың санмен өлшенетін бұзылу\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет. Адамның Aβ-wt және Aβ-Iowa экспрессиясы Drosophila көзіндегі оматидиальды тұрақтылықтың санмен өлшенетін бұзылуын тудырады A-D. Башка трансгені жоқ (A), UAS-lacZ (B), UAS-Aβ-wt (C) және UAS-Aβ-Iowa (D) бар үшінші хромосомалық GMR-GAL4 (III) кірістіруі бар 2-4 күндік ұрғашылардың көздерінің стереомикроскопиялық кескіндері. E. Бақылау GMR-GAL4 (III) анықтамалық қисығына қатысты осы генотиптердегі көздер үшін тұрақтылық ұпайын (Фишердің Z-трансформациясы ретінде) көрсететін гистограмма. F-I. Басқа трансгені жоқ (F), UAS-lacZ (G), UAS-Aβ-wt (H) және UAS-Aβ-Iowa (I) бар екінші хромосомалық GMR-GAL4 (II) кірістіруі бар 2-4 күндік ұрғашылардың көздерінің стереомикроскопиялық кескіндері. J. Бақылау GMR-GAL4 (II) анықтамалық қисығына қатысты осы генотиптердегі көздер үшін тұрақтылық ұпайын (Фишердің Z-трансформациясы ретінде) көрсететін гистограмма. Масштабты сызғыш: 100 мкм, барлық кескіндерге қолданылады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f8.jpg\" alt=\"8-сурет. Chmp5 нокдауны көздегі Aβ-wt тудырған дезорганизацияны басады A-C. UAS-Aβ-wt бар және басқа трансгенді (A), UAS\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет. Chmp5 нокдауны көздегі Aβ-wt тудырған дезорганизацияны басады A-C. UAS-Aβ-wt бар және басқа трансгенді (A), UAS-mCherry-RNAi (B) немесе UAS-Chmp5-RNAi (C) коэкспрессияламайтын үшінші хромосомалық GMR-GAL4 (III) кірістіруі бар 2-4 күндік ұрғашылардың көздерінің стереомикроскопиялық кескіндері. D. Бақылау GMR-GAL4 (III) анықтамалық қисығына қатысты осы генотиптердегі көздер үшін тұрақтылық ұпайын (Фишердің Z-трансформациясы ретінде) көрсететін гистограмма. Chmp5 нокдау арқылы екі бақылауға қатысты дезорганизацияның ішінара қалпына келуіне назар аударыңыз. E-G.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f9.jpg\" alt=\"9-сурет. Басқа қосымша ESCRT-III гендерінің нокдауны көздегі Aβ-wt және Aβ-Iowa тудырған дезорганизацияны басады A-C. UA\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет. Басқа қосымша ESCRT-III гендерінің нокдауны көздегі Aβ-wt және Aβ-Iowa тудырған дезорганизацияны басады A-C. UAS-Aβ-wt бар және UAS-mCherry-RNAi (A), немесе UAS-Chmp1-RNAi (B), немесе UAS-Ist1-RNAi (C) коэкспрессиялайтын үшінші хромосомалық GMR-GAL4 (III) кірістіруі бар 2-4 күндік ұрғашылардың көздерінің стереомикроскопиялық кескіндері. D. Бақылау GMR-GAL4 (III) анықтамалық қисығына қатысты осы генотиптердегі көздер үшін тұрақтылық ұпайын (Фишердің Z-трансформациясы ретінде) көрсететін гистограмма. Chmp1 және Ist1 нокдау арқылы бақылауға қатысты дезорганизацияның ішінара қалпына келуіне назар аударыңыз. E-G. UAS-Aβ-Iowa бар және UAS-mCherry-RNAi (E), немесе UAS-Chmp1-RNAi (F), немесе UAS-Ist1-RNAi коэкспрессиялайтын екінші хромосомалық GMR-GAL4 (II) кірістіруі бар 2-4 күндік ұрғашылардың көздерінің стереомикроскопиялық кескіндері. H. Бақылау GMR-GAL4 (II) анықтамалық қисығына қатысты осы генотиптердегі көздер үшін тұрақтылық ұпайын (Фишердің Z-трансформациясы ретінде) көрсететін гистограмма. Chmp1 және Ist1 нокдау арқылы РНҚ экспрессиялайтын бақылауға қатысты дезорганизацияның ішінара қалпына келуіне назар аударыңыз. Масштабты сызғыш: 100 мкм.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f10.jpg\" alt=\"10-сурет. Aβ тудырған эндолизосомалық трафик ақауларының жасушааралық таралуындағы Rab11-экзосомалардың рөлін түсіндіруг\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет. Aβ тудырған эндолизосомалық трафик ақауларының жасушааралық таралуындағы Rab11-экзосомалардың рөлін түсіндіруге арналған ұсынылған модель. Схема сау жасушалардағы (A) және қалыпты (B) немесе төмендетілген (C) деңгейдегі Rab11-экзосомаларын өндіретін Aβ экспрессиялайтын жасушалардағы реттелетін секреторлық процесті көрсетеді. Реттелетін секреция DCG биогенезін (① және ②), Rab11-оң рециркуляциялық эндосомалардың бірегейлігіне компартментальды ауысуды және APP процессингін талап ететін процесті, содан кейін сапа бақылауын (③) және секрецияны қамтиды. Сау жасушаларда (A) DCG компартменттерінің тек аз бөлігі лизосомалық деградацияға бағытталады, бұл Aβ минималды жиналуына әкеледі. Егер Aβ жинала бастаса (B), бұл DCG биогенезін бұзады, мембрана:агрегат өзара әрекеттесулерінің диссоциациясының төмендеуіне (мысалы, APP арқылы; қызыл ②) және осы компартменттердің лизосомаларға жоғарылаған, бірақ аберрантты бағытталуына (қызыл ③) әкеледі. Бұл компартменттердің көпшілігі әлі де секрецияланатын сияқты (қызыл ④). Ақаулы секрецияланатын материал басқа жасушалармен (сондай-ақ секрециялайтын жасушалардың өзімен (көрсетілмеген)) қалыптан тыс эндоцитозға ұшырайды және ұлғайтылған эндолизосомаларда жиналып, трафик ақауын таратады (қызыл ⑤). Бұл және секрециялайтын жасушалардағы эндолизосомалық трафик ақаулары ақырында SC-ларда да (Singh et al., 2025), кеңінен хабарланғандай (Kimura and Yanagisawa, 2018), нейрондарда да дегенерацияны тудырады. Біз адам және Drosophila жасушаларында Rab11-экзосомаларының биогенезін таңдамалы түрде тежейтін SC-лардағы Chmp5 нокдауны (Marie et al., 2023) Aβ экспрессиялайтын жасушаларға анықталатын әсер етпейтінін анықтадық. Алайда ол эндолизосомалық ақаулардың фенотиптік таралуын, шамасы секрециялайтын жасушалардағы агрегаттардың жалпы құрамына және/немесе олардың везикулалармен өзара әрекеттесуіне әсер ету арқылы, не секрециядан кейін (мұнда көрсетілгендей), не секрецияланатын материал басқа жасушалармен эндоцитозғалған кезде басады. Бұл генетикалық манипуляция шыбын көзіндегі Aβ тудырған нейродегенерацияны азайту үшін де жеткілікті, бұл Aβ-пен байланысты БА патологиясында Rab11-экзосомаларының рөлін көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS1.jpg\" alt=\"1-сурет. SC-дағы Aβ экспрессиясы MC эндолизосомаларында ақаулар тудыради (1-суретке қатысты)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. SC-дағы Aβ экспрессиясы MC эндолизосомаларында ақаулар тудыради (1-суретке қатысты)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS2.jpg\" alt=\"2-сурет. SC-да экспрессияланатын адамның Aβ изоформалары MAG эпителий жасушаларында эндолизосомалық ақауларды тудыради (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. SC-да экспрессияланатын адамның Aβ изоформалары MAG эпителий жасушаларында эндолизосомалық ақауларды тудыради (1-суретке қатысты)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS3.jpg\" alt=\"3-сурет. SC-спецификалық Chmp5 нокдауны MC-дағы GFP-MFAS бар эндолизосомалық компартменттерде бірнеше өзгерістер тудыруы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. SC-спецификалық Chmp5 нокдауны MC-дағы GFP-MFAS бар эндолизосомалық компартменттерде бірнеше өзгерістер тудыруы мүмкін (5-суретке қатысты)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS5.jpg\" alt=\"5-сурет. Омматидийлердің тұрақтылығын есептеу талдауы (7-суретке қатысты)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. Омматидийлердің тұрақтылығын есептеу талдауы (7-суретке қатысты)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS6.jpg\" alt=\"S6 суреті. Көздегі қосымша ESCRT-III гендерінің нокдауны жалпы алғанда омматидийлердің реттілігіне әсер етпейді (8 және \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;S6 суреті. Көздегі қосымша ESCRT-III гендерінің нокдауны жалпы алғанда омматидийлердің реттілігіне әсер етпейді (8 және 9-суреттерге қатысты)&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#kesteler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кестелер&lt;/span&gt;&lt;/a&gt;Кестелер&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Реагенттер мен ресурстар&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Реагент/Ресурс&lt;/th&gt;\n&lt;th&gt;Сіл
