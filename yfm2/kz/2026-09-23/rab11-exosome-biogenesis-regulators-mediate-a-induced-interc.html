        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"243\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"577\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Альцгеймер кезіндегі&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жасушааралық зақымдану қалай&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;таралады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-f1.jpg\" alt=\"1-сурет. СК-экспрессияланатын адамның Aβ белоктары қосалқы жыныс безінің (MAG) орталығындағы эпителий жасушаларында эндо\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. СК-экспрессияланатын адамның Aβ белоктары қосалқы жыныс безінің (MAG) орталығындағы эпителий жасушаларында эндолизосомалық ақауларды тудырады. A. Эксперименталды стратегияны көрсететін схема. СК-лар тек MAG дистальды ұшында орналасады, бірақ GFP-MFAS және DCG компартименттерінің басқа мазмұнын бездің люменіне секрециялайды, содан кейін олар МК арқылы эндоцитозға ұшырауы мүмкін. B-D. GFP-mfas гендік тұзағын экспрессиялайтын және арнайы СК-ларда басқа трансгенсіз (B) немесе UAS-реттелетін Aβ-wt (C) немесе Aβ-Iowa (D) экспрессиялайтын 6 күндік аталықтардың MAG орта шеніндегі МК эпителий қабаты мен MAG люмені арқылы көлденең қималарының конфокальды кескіндері (ең оң жақтағы панельдер). Үлкейтілген панельдер 3 есе үлкейтуді көрсетеді. E-H. MAG орталық бөлігіндегі МК қабатындағы GFP-MFAS флуоресценциясының жалпы % аумағын (E), интеграцияланған қарқындылықты (аумақ МК-дағы орташа GFP флуоресценция қарқындылығына көбейтілген) (F), GFP-MFAS-пен белгіленген жеке МК компартименттерінің/пункталарының орташа % аумағын (G) және MAG люменіндегі GFP-MFAS флуоресценциясының орташа қарқындылығын (H) көрсететін бағанды диаграммалар. СК-спецификалық Aβ-wt және Aβ-Iowa экспрессиясы МК ішінде құрамында GFP-MFAS бар үлкенірек құрылымдарды тудыратынын ескеріңіз, сонымен қатар Aβ-Iowa МК ішіндегі GFP-MFAS бар жалпы аумақты және интеграцияланған қарқындылықты айтарлықтай арттырады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Альцгеймер ауруы кезінде мида амилоидты түйіндер жиналады, бірақ алғашқы ақаулар жасуша ішінде басталады. Зерттеушілер улы сигналдардың арнайы экзосомалар арқылы басқа жасушаларға берілетінін анықтады. Ғалымдар бұл үдерістегі маңызды ақуызды бұғаттағанда, бұзылу каскады тоқтады. Бұл дерттің таралу жолдарын жаңа қырынан түсінуге көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Бета-амилоид жасушаішілік тасымалды бұзып, көрші жасушаларға беріледі.&lt;/li&gt;\n&lt;li&gt;Chmp5 ақуызы мен ESCRT-III кешені токсикалық везикулалардың бөлінуін реттейді.&lt;/li&gt;\n&lt;li&gt;Rab11-экзосома жолын бұғаттау дрозофиладағы нейродегенерацияны тоқтатады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Альцгеймер ауруы сыртқы амилоидтық тақташалармен және ішкі нейрофибриллярлы шумақтармен сипатталады. Алайда нейрондар жаппай қырылғанға дейін зат тасымалы мен ыдырауына жауап беретін эндолизосомалық жүйе зақымданады. Дрозофила шыбындарының жасушаларында жасалған бұрынғы жұмыстар бета-амилоидтың секрециялық түйіршіктерді бұзып, көрші жасушаларға ақау тарататынын көрсеткен еді.&lt;/p&gt;\n&lt;p&gt;Жаңа зерттеуде авторлар ESCRT ақуыз кешенінің бұл процестегі рөлін тексерді. ESCRT-III көмекші ақуызын кодтайтын Chmp5 генінің белсенділігі төмендетілген кезде, эндолизосомалық ақаулардың таралуы толығымен тоқтайтыны анықталды. Бұл ақуыз Rab11-экзосомалары түрінде сыртқа шығарылатын везикулалардың түзілуін реттейді.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар дрозофила көзінде Chmp5 немесе басқа ESCRT-III гендерін басу нейродегенерацияға байланысты өзгерістердің алдын алды. Бұл нәтижелер Rab11-экзосома биогенезі жолының амилоидты патология мен жасуша өлімін байланыстыратынын дәлелдеп, болашақ емдеу әдістеріне бағыт береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек дрозофила моделінде жүргізілгендіктен, нәтижелерді сүтқоректілерде тексеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Альцгеймер ауруы (АА) екі гистопатологиялық белгімен сипатталады: жасуша ішкі тау-ақуызы бар нейрофибриллярлық түйіндер және құрамында амилоидтық предшественник ақуызының (APP) арнайы ыдырау өнімі β-амилоид (Aβ) бар жасушадан тыс амилоидтық бляшкалар. Алайда, Aβ туындататын нейрондық патологияның басталуы жасушалар арасында тарала алатын эндолизосомалық трафикке әсер ететін жасушаішілік оқиғаларды қамтиды деп болжануда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эндолизосомалық трафик — бұл молекулаларды эндосомалар мен лизосомалар арасында тасымалдайтын және өңдейтін жасушаішілік көлік жүйесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нейрондық емес Drosophila қайталама жасушаларындағы (SC) соңғы зерттеулер Aβ ақуыздың агрегациясы оқиғаларына кедергі келтіретінін көрсетті, олар қалыпты реттелетін секреция кезінде сигналдық молекулаларды ерімейтін тығыз ядролы түйіршіктерге (DCG) қаптайды және басқа жасушаларға берілетін эндолизосомалық ақауларды тудырады.&lt;/p&gt;\n&lt;p&gt;Мұнда SC көмегімен біз көмекші ESCRT-III ақуызы Chmp5 кодтайтын генді нокаут жасау SC DCG компартменттері ішінде кейіннен Rab11-экзосомалар ретінде бөлінетін интралюминальды көпіршіктердің (ILV) түзілуін таңдамалы түрде реттейтінін және Aβ туындататын эндолизосомалық трафик ақауларының таралуын тежейтінін көрсетеміз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл зерттеу үлгілік организмдерде (Drosophila) орындалғандықтан, бұл механизмдердің адамдардағы рөлін растау үшін қосымша клиникалық зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, Chmp5 немесе басқа көмекші ESCRT-III гендерін нокаут жасау Drosophila көзіндегі Aβ туындататын, нейродегенерацияға тәуелді морфологиялық ақауларды да басады.&lt;/p&gt;\n&lt;p&gt;Біз Rab11-экзосома биогенезі жолын басқаратын гендер Aβ туындататын эндолизосомалық трафик ақауларында да, нейродегенерацияға әкелетін жасушалық оқиғаларда да маңызды рөл атқарады деген қорытындыға келдік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chmp5 экспрессиясын басу Aβ туындататын эндолизосомалық ақаулардың таралуын бұғаттайды және нейродегенеративті өзгерістерді азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біздің нәтижелеріміз бұл процестердің өзара байланысты екенін көрсетеді және болашақта АА терапиясын әзірлеу үшін жаңа нысаналы жолдарды ұсына алады.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Альцгеймер ауруы (АА) бүкіл әлем бойынша деменцияның басты себебі болып табылады және 2050 жылға қарай ол 100 миллионнан астам адамға әсер етеді деп болжанууда. Гиперфосфорланған тау-ақуызы бар жасушаішілік нейрофибриллярлық түйіндер және Амилоидты предшественник ақуызының (APP) арнайы кесілу өнімдері болып табылатын Aβ-пептидтерден тұратын жасушасыртылық амилоидты тілімдері АА-ның негізгі гистопатологиялық белгілері болып табылады. Дегенмен, дегенерацияны тудыратын жасушалық-биологиялық триггерлерге қатысты әлі де айтарлықтай пікірталастар бар.&lt;/p&gt;\n&lt;p&gt;Бір тартымды модель, «жол кептелісі гипотезасы», эндосомалық және лизосомалық жүйе арқылы тасымалдаудағы ақаулар ыдырамайтын Aβ қамтитын жасушаішілік компартменттердің жиналуына әкеледі деп постулаттайды. Бұл эндолизосомалық фенотип басқа жасушаларға берілуі мүмкін және синаптикалық тасымалдауды, құрылымды және тұтастықты бұзудағы бастапқы қадам болып табылады.&lt;/p&gt;\n&lt;p&gt;Нейрофибриллярлық түйіндермен байланысқан гиперфосфорланған тау-ақуыз эндолизосома арқылы жүретін механизмдер арқылы Aβ және патологиялық Aβ-олигомерлерімен әрекеттесетін көрінеді, бұл тау мен Aβ ауруда қалай функционалды түрде байланысқанын түсіндіру үшін бір ықтимал түсінікті ұсынады. Алайда, жуырға дейін АА-ға байланысты эндолизосомалық ақаулар қалыпты APP процесіне қатысатын арнайы тасымалдау процесінің бұзылуын көрсете ала ма деген сұрақ шешілмеген күйінде қала берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Drosophila қосалқы жасушаларындағы APP функцияларын зерттеу реттелетін секрециядағы жетілу мен сапаны бақылау процестерін алғаш рет визуализациялауға көмектесті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Реттелетін секреция — жасушалар секрецияланатын заттарды арнайы түйіршіктерде жинап, белгілі бір сигналдарға жауап ретінде шығаратын процесс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз жақында еркек қосалқы безінің (MAG) простата тәрізді жасушалары болып табылатын Drosophila қосалқы жасушаларындағы (ҚЖ) APP функцияларын зерттедік, олар тым үлкейген секреторлық және лизосомалық компартменттерді қамтиды. Бұл жасушаларда реттелетін секреция кезіндегі жетілу және сапаны бақылау қадамдарымен бірге жүретін компартменттер ішіндегі динамикалық оқиғалар алғаш рет визуализацияланды. Жоғары сатыдагы организмдердің жасушаларында секрецияға арналған ақуыздар реттелетін секреторлық компартменттер ішінде тығыз ядролы түйіршіктерге (DCG) жиналады. Бular тек компартменттер плазмалық мембранамен қосылғанда немесе ақаулы компартменттер кринофагия деп аталатын процестерде лизосомалық деградацияға бағытталғанда таралады. ҚЖ-ларда Drosophila трансмембранды APP ортологі, APPL, қалыпты DCG ақуыз агрегациясын ынталандыру үшін қажет. Содан кейін ол DCG агрегаттарын компартменттің шектеуші мембранасынан ажырату үшін Aβ түзілуі үшін қажетті бірінші кесуді жасайтын β-секретазамен кесілуі керек. APPL-дің реттелетін секрециядағы функциялары адамның APP көмегімен алмастырылуы мүмкін, бұл процесте эволюциялық сақталған рөлді көрсетеді.&lt;/p&gt;\n&lt;p&gt;ҚЖ секреторлық жолында жабайы типтегі Aβ немесе ерте басталған отбасылық АА-ға байланысты Aβ амилогендік мутантты түрлері экспрессияланғанда, APP процесі бұзылады, DCG қалыпты түрде түзілмейді және көбірек компартменттер лизосомалық деградацияға бағытталады. Алайда, бұл бағыттау аберрантты болып табылады және ішінара деградацияланған компартменттер ҚЖ ішінде жиналып, эндолизосомалық тасымалдау ақауын тудырады. Сонымен қатар, бұл аномальды компартменттердің мазмұны секрецияланатын және Aβ экспрессияламайтын басқа көршілес жасушалардың эндолизосомалары ішінде жиналатын көрінеді, олар оларды эндоцитоз жасап, эндолизосомалық фенотипті таратады. Бұл нәтижелер АА кезіндегі Aβ тудырған эндолизосомалық патологиялар аберрантты реттелетін секрециядан туындауы мүмкін екенін болжайды, бұл адамның АА-мен байланысты гендерін ин силико талдауымен расталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эндолизосомалық ақаулардың таралуы туралы қорытындылардың көпшілігі Drosophila модельдерінен алынған, бұл адамның Альцгеймер ауруының патогенезіне тікелей экстраполяция жасауда сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Реттелетін секреторлық компартменттердің жетілуі транс-Гольджи желісінен (TGN) пайда болатын компартменттердің қайта өңделетін эндосомалық сәйкестігіне ауысуын талап етеді, мұны қайта өңделетін эндосомалық маркеp Rab11 біртіндеп иеленуі арқылы бақылауға болады. ҚЖ-дағы реттелетін секреторлық компартменттер интралюминальды везикулаларды (ILV) түзеді, бұл процесс адамның DCG компартменттерінде де сақталған көрінеді (Wang et al., 2025), және бұл везикулалар мамандандырылған Rab11-экзосомалар ретінде секрецияланады.&lt;/p&gt;\n&lt;p&gt;Атқарған зерттеулер APPL осы ILV-ларға тасымалданатынын және ILV биогенезін реттейтін төрт Эндосомалық сұрыптау кешенінің (ESCRT) арнайы компоненттерін кодтайтын гендердің нокдаун жасалуы ҚЖ-да DCG түзілуін бұзатынын көрсетті.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар, Aβ және оның олигомерлерінің нейрондардан басқа жасушаларға, соның ішінде басқа нейрондарға өтуі экзосомаларды қамтитын көрінеді.&lt;/p&gt;\n&lt;p&gt;Сондықтан біз Rab11-экзосомалар жасушалар арасында Aβ тудырған эндолизосомалық тасымалдау ақауларын таратуға қатысуы мүмкін деп болжадық.&lt;/p&gt;\n&lt;p&gt;Мұнда біз Aβ экспрессиялайтын ҚЖ тудырған эндолизосомалық ақаулар MAG эпителий жасушалары арқылы таралатынын көрсетеміз. Rab11-экзосома түзілуін таңдамалы түрде реттейтін қосымша ESCRT-III ақуызын кодтайтын Chmp5 нокдауны бұл таралуды күшті басады. Chmp5 және басқа қосымша ESCRT-III гендерінің нокдауны шыбын көзінде Aβ экспрессиясы тудырған нейродегенерациямен байланысты морфологиялық ақауларды да басады. Демек, біздің нәтижелеріміз Aβ тудырған реттелетін секрецияның бұзылуынан туындаған эндолизосомалық тасымалдаудағы ақаулар АА-ға байланысты дегенерацияда маңызды рөл атқаруы мүмкін екенін және оларды Rab11-экзосома биогенез аппаратын тежеу арқылы жеңілдетуге болатынын көрсетеді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"sekretorlykh-zhasushalar-ekspressiyalajtyn-adamnyng-ab-akuyzy-khosalkhy-zhynys-bezining-mag-barlykh-epitelij-zhasushalarynda-endolizosomalykh-akhaular-tudyrady\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#sekretorlykh-zhasushalar-ekspressiyalajtyn-adamnyng-ab-akuyzy-khosalkhy-zhynys-bezining-mag-barlykh-epitelij-zhasushalarynda-endolizosomalykh-akhaular-tudyrady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Секреторлық жасушалар экспрессиялайтын адамның Aβ акуызы қосалқы жыныс безінің (MAG) барлық эпителий жасушаларында эндолизосомалық ақаулар тудырады&lt;/span&gt;&lt;/a&gt;Секреторлық жасушалар экспрессиялайтын адамның Aβ акуызы қосалқы жыныс безінің (MAG) барлық эпителий жасушаларында эндолизосомалық ақаулар тудырады&lt;/h4&gt;\n&lt;p&gt;Бұған дейін біз сүтқоректілердің жасушадан тыс матрикс акуызы TGF-\beta-induced (TGFBI) шыбын ортологі болып табылатын MFAS DCG акуызының GFP-пен белгіленген нысаны эндогендік ген локусынан экспрессияланған кезде секреторлық жасушаларда (СЖ) жоғары деңгейде таңдамалы түрде өндірілетінін және СЖ DCG-леріне оралатынын көрсеттік (Singh et al., 2025). Екі лопальды MAG әр лопасының дистальды ұшындағы шамамен 40 СЖ-да Aβ экспрессияланған кезде, секрецияланған GFP-MFAS-тың көршілес негізгі жасушаларға (НЖ) сіңірілуі күшейеді және GFP LysoTracker Red-пен боялатын ұлғайған эндолизосомалық компартменттерде жиналады (Singh et al., 2025). Бұл бұл компартменттердің эндоцитоз жасалған DCG акуыздарын қалыпты түрде ыдырата алмайтынын және GFP флуоресценциясын толық сөндіре алмайтын жоғары люминальды pH мәніне ие екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;LysoTracker Red лизосомалық бояғышы мен GFP акуыздық меткалары органеллалар молекулаларды қорыту қабілетін жоғалтқан кезде жасушаішілік қышқыл орта ақауларын бақылауға көмектеседі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aβ тудырған НЖ эндолизосомалық ақауларының біздің бастапқы талдауымыз тікелей СЖ-ға жақын орналасқан жасушалармен шектелді. Осы НЖ үшін СЖ шығарған эндоцитоз жасалған GFP-MFAS MAG люменіне секрециялануы немесе латеральды мембраналар арқылы жасушалар арасында тасымалдануы мүмкін еді. Люминальды GFP-MFAS таралу фенотипі үшін жауапты екенін растау үшін біз MAG бойындағы эпителий жасушаларының GFP-MFAS қабылдауын зерттедік. Ересек аталық шыбындар алынды, оларда ересек СЖ я дикий типті Aβ (Aβ-wt) немесе амилоидогендік Aβ-Iowa мутантын (Grabowski et al., 2001) секреторлық жолға бағыттау үшін өңделетін N-ұштық ER сигналды тізбегімен біріктіріліп экспрессияланды (Chouhan et al., 2016; Metsla et al., 2022; Singh et al., 2025). MAG-тың СЖ ішінде тек ересектерде экспрессияға температураға сезімтал GAL4 ингибиторы GAL80ts қатысуымен UAS реттейтін трансгендерді dsx-GAL4 арқылы белсендіру арқылы, шыбын шыққан кезде 25oC-тан 29oC-қа ауыстыру арқылы қол жеткізілді, бұл GAL80ts-ті тұрақсыздандырады (Fan et al., 2020).&lt;/p&gt;\n&lt;p&gt;Бұрын хабарланғандай (Singh et al., 2025), Aβ экспрессиясы СЖ-дағы DCG биогенезі мен эндолизосомалық трафикке әсер етіп, ішінара қышқылданған компартменттер мен лизосомалардың жиналуының артуына, ал Aβ-Iowa жағдайында акуыздардың үлкен DCG-ге жиі толық емес агрегациясына әкелді (S1A-C суреті). Ex vivo препаратталған MAG-тардың орталық бөлігіндегі НЖ эпителий қабатын талдау (1A суреті) СЖ-да Aβ изоформаларын экспрессиялау НЖ қышқыл компартменттерінің мөлшерін арттырғанын және әсіресе Aβ-Iowa үшін осы ұлғайған компартменттер ішінде GFP-MFAS-тың көбірек жиналуына әкелгенін көрсетті (S1D-F суреті). Бұл біздің MAG-тың дистальды бөлігі үшін бұрынғы нәтижелерімізді қайталады және эндолизосомалық ақаулардың без бойымен таралатынын болжады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Секреторлық жасушаларда Aβ экспрессиясы қосалқы жыныс безінің барлық аумағында негізгі жасушаларда эндолизосомалық компартменттердің кеңеюіне және GFP-MFAS жиналуына әкеледі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл өзгерістерді жүйелі түрде сандық бағалауға мүмкіндік беру үшін біз GFP-MFAS экспрессиялайтын аталықтардан MAG-тарды фиксирледік, жіңішке жалпақ НЖ эпителий қабатын анықтау үшін оларды DAPI-мен боядық және конфокальды микроскопия көмегімен GFP таралуын бейнеледік (1A суреті). Бұл дистальды СЖ Aβ-wt және Aβ-Iowa экспрессиялаған кезде, экспрессияламайтын бақылаулармен салыстырғанда 6 күндік аталықтардың MAG-тарының орталық және проксимальды аймақтарындағы НЖ тарапынан GFP-MFAS-тың жоғары қабылданғанын көрсетті (1B-D суреті; S2A-C суреті).&lt;/p&gt;\n&lt;p&gt;MAG ортасында орналасқан эндоцитоз жасалған GFP-MFAS ядролары бойынша анықталған эпителий НЖ көлденең қимасындағы GFP флуоресценциясы бар жалпы ауданның % мөлшерін, интеграцияланған тығыздықты (% аудан x орташа флуоресценция сигналының қарқындылығы) және GFP-MFAS бар әрбір жасушаішілік аймақ үшін орташа % ауданды өлшеу арқылы сандық бағаланды. СЖ Aβ-Iowa экспрессиялаған кезде осы үшеуі де бақылаулармен салыстырғанда айтарлықтай өсті (1E-G суреті). СЖ-да Aβ-wt экспрессияланған MAG-тар үшін де GFP-MFAS бар әрбір аймақтың орташа % ауданында нақты өсу байқалды (1G суреті); көптеген, бірақ барлық бездер үшін емес, флуоресценцияның жалпы % ауданы мен интеграцияланған қарқындылығы да орташа бақылау мәндеріне қатысты өскен сияқты болды (1E және 1F суреті), бірақ үлкен өзгергіштікке байланысты бұл өзгерістердің ешқайсысы маңыздылыққа жетпеді. Екі Aβ генотипі үшін де, бақылаумен салыстырғанда, GFP бар НЖ құрылымдарының саны мен орташа флуоресценттік сигнал қарқындылығы өзгерген жоқ немесе Aβ-Iowa жағдайында флуоресценция қарқындылығы үшін аздап өсті (S2D және S2E суреті). Жалпы алғанда, бұл нәтижелер СЖ-да Aβ экспрессиясы СЖ-ның белгіленген DCG жүгі GFP-MFAS-ты жинайтын НЖ эндолизосомалық компартменттерінің кеңеюін туындататынын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Нәтижелер модельдік ағзаларда (Drosophila melanogaster) алынды, сондықтан механизмдерді адам патологиясына тікелей көшіру дәрежесі қосымша зерттеулерді талап етеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MAG люменінің орталық аймағы да осы әртүрлі генетикалық фонда суретке түсіріліп, секрецияланған GFP-MFAS флуоресценция деңгейлері Singh et al. (2025) бойынша өзгертілген хаттама көмегімен өлшенді (1A-D және 1H суреті). Aβ-wt және Aβ-Iowa үшін бақылауларға қарағанда көбірек өзгермелі флуоресценция деңгейлері байқалды; кейбір бездерде біз бұрын хабарлағанымыздай (Singh et al., 2025) жоғары деңгейдегі GFP-MFAS болды; алайда жалпы алғанда, осы талдау арқылы өлшенгендей секрецияның айтарлықтай өсуі болған жоқ (1H суреті), бұл НЖ-дағы эндолизосомалық өзгерістердің түсіндірмесі ретінде жоғары секрецияны жоққа шығарады.&lt;/p&gt;\n&lt;p&gt;GFP-MFAS-тың СЖ секрециясы Aβ тудырған НЖ-ға тасымалдану үшін қажет екенін растау үшін біз СЖ-да BMP сигнализациясының теріс транскрипциялық реттеушісі Dad-ты Aβ-wt немесе Aβ-Iowa мутантымен бірге экспрессияладық (2 сурет). Аутокринді BMP сигнализациясы СЖ люминальды секрециясын ынталандырады және бұл Dad арқылы басылады (Corrigan et al., 2014; Redhai et al., 2016). Aβ-wt және Dad-ты бірге экспрессиялайтын бір де бір ересек аталық шыбын шықпады, бұл шамамен dsx-GAL4/GAL80ts жүйесінің бақылауымен даму кезіндегі әлсіз экспрессияның синтетикалық өлімге әкелетініне байланысты. Соған қарамастан, Aβ-Iowa экспрессиялайтын СЖ-да Dad экспрессиясы MAG люменіндегі GFP-MFAS деңгейлерін төмендетті және бұл біріктірілген акуыздың НЖ-ға сіңірілуін күрт азайтты (2 сурет).&lt;/p&gt;\n&lt;p&gt;Қорытындылай келе, біздің деректеріміз MC клеткалары SC бөліп шығаратын DCG ақуыздарын эндоцитозға ұшырататынын және бұл қармау процесі SC клеткалары жабайы типтегі немесе амилоидогенді мутантты Aβ экспрессиялағанда күшейетінін және/немесе деградациясы тежелетінін қатаң түрде растайды. Бұл MC эндолизосомалық компартменттерінің ұлғаюына әкеледі, олардың құрамында деградацияға ұшырамаған флуоресцентті GFP-MFAS жоғары деңгейлері болады және олар сөндірілмейді, бұл ықтимал түрде осы ақаулы компартменттердің pH деңгейінің жоғарылауына байланысты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SC клеткаларындағы Aβ экспрессиясы MC клеткаларының өзгерген DCG ақуыздарын эндоцитоз жасауына және олардың pH деңгейі жоғарылаған эндолизосомалық компартменттерінің ұлғаюына әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ab-izoformalary-zhetilip-kele-zhatkhan-dcg-kompartmentterinde-dcg-khuramyna-birigedi\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#ab-izoformalary-zhetilip-kele-zhatkhan-dcg-kompartmentterinde-dcg-khuramyna-birigedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aβ изоформалары жетіліп келе жатқан DCG компартменттерінде DCG құрамына бірігеді&lt;/span&gt;&lt;/a&gt;Aβ изоформалары жетіліп келе жатқан DCG компартменттерінде DCG құрамына бірігеді&lt;/h4&gt;\n&lt;p&gt;SC клеткаларындағы Aβ экспрессиясының GFP-MFAS тасымалдануына және эндолизосомалық ақаулардың MC клеткаларына таралуына әсері біздің прецеденттік бақылауларымызға сәйкес келеді: Aβ GFP-MFAS агрегациясына және болжам бойынша SC клеткаларындағы басқа секрецияланатын DCG ақуыздарына, ықтимал түрде аберрантті мембрана-агрегат өзара әрекеттесулері арқылы әсер етеді, бұл секрециядан кейін MC клеткаларының осы ақуыздарды қармауын күшейтеді.&lt;/p&gt;\n&lt;p&gt;Aβ пептидтерінің тікелей DCG құрамына кіретінін зерттеу үшін біз осы пептидтерге арналған бұрын расталған 6E10 антиденесін қолдандық (Ray et al., 2017). Бұл антидене адамның Aβ пептидтерімен және APP-мен айқас әрекеттеседі, бірақ Drosophila APPL-мен әрекеттеспейді.&lt;/p&gt;\n&lt;p&gt;Антидене MAG бұлшықет капсуласының айналасында жоғары деңгейдегі фондық боялуды тудырды (3A-сурет), бұл жұқа MC қабатындағы Aβ локализациясын бағалауды қиындатты. Соған қарамастан, Aβ-wt пен Aβ-Iowa екеуі де SC ішіндегі GFP-MFAS оң DCG көпшілігімен күшті колокализация жасады, дегенмен антиденелердің боялу қарқындылығы әртүрлі DCG арасында айтарлықтай өзгеріп тұрды (3-сурет).&lt;/p&gt;\n&lt;p&gt;Біз SC клеткаларында экспрессияланатын Aβ DCG құрамына қосылады және DCG компартментінің жетілуін өзгертеді деген қорытындыға келдік. Бұл клеткалар секрециялаған кезде, Aβ-ның MFAS DCG ақуызына әсері MAG люменінде сақталады немесе қайта қалпына келеді, нәтижесінде MFAS MC клеткаларымен аномальды түрде эндоцитозға ұшырап, олардың эндолизосомалық трафигін бұзады.&lt;/p&gt;\n&lt;h4 id=\"sc-ekzosomalary-dcg-akhuyzdarymen-birge-mc-kletkalarymen-endocitozdalady\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#sc-ekzosomalary-dcg-akhuyzdarymen-birge-mc-kletkalarymen-endocitozdalady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SC экзосомалары DCG ақуыздарымен бірге MC клеткаларымен эндоцитоздалады&lt;/span&gt;&lt;/a&gt;SC экзосомалары DCG ақуыздарымен бірге MC клеткаларымен эндоцитоздалады&lt;/h4&gt;\n&lt;p&gt;SC DCG компартменттері сонымен қатар MAG люменіне Rab11-экзосомалар ретінде секрецияланатын ILV түзеді. Біз бұл экзосомалардың MC клеткаларымен эндоцитоздалатынын және бұл процеске SC клеткаларындағы Aβ экспрессиясы әсер ететінін зерттедік. Біз GFP-MFAS экспрессиялайтын SC клеткаларында Rab11-экзосомаларды белгілейтін адам экзосома маркери CD63-тің mCherry-мен белгіленген формасын бірлесіп экспрессияладық, осылайша біз MC клеткаларындағы GFP-MFAS бар компартменттерді, сондай-ақ эндоцитозға ұшыраған экзосомаларды онай анықтай алдық. Біз GFP-MFAS, CD63-mCherry және Aβ-Iowa трансгендері, олардың барлығы dsx-GAL4-пен бірдей хромосомада орналасқан, бірлесіп экспрессияланған аталықтарды ала алмадық. Дегенмен, CD63-mCherry бақылау MAG-тарында да, Aβ-wt экспрессиялайтын SC бар MAG-тарда да MC ішінде локализацияланып, жиі GFP-MFAS-пен колокализация жасады (4-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экзосомалар — клеткааралық байланыс үшін бөлінетін микроскопиялық көпіршіктер, ал олардың CD63 маркері олардың ағзадағы жолын қадағалауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, GFP-MFAS сигналы үшін сияқты (1B-D және S1D-F суреттер), Aβ-wt экспрессиясы MC клеткаларында CD63-mCherry-дің диффузиялық таралуына әкелді, бұл осы клеткалардағы эндолизосомалық компартменттердің ұлғаюына сәйкес келеді. Демек, SC клеткаларынан шығатын экзосомалардың MC клеткаларына эндоцитозы GFP-MFAS-пен бірге жүреді. Бұл жабайы типтегі MAG-тарда, сондай-ақ MC эндолизосомалары SC клеткаларына тән Aβ экспрессиясымен бұзылған MAG-тарда да орын алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Байқалатын эндолизосомалық тасымалдау бұзылыстары дрозофила модельдерінде алынды, бұл адам патологиясына тікелей экстраполяция жасауда сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sc-daghy-rab11-ekzosoma-biogenezining-rettegishi-chmp5-ekspressiyasyn-tezheu-ab-tudyrghan-endolizosomalykh-akhaulardyng-mc-gha-taraluyn-basady\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#sc-daghy-rab11-ekzosoma-biogenezining-rettegishi-chmp5-ekspressiyasyn-tezheu-ab-tudyrghan-endolizosomalykh-akhaulardyng-mc-gha-taraluyn-basady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SC-дағы Rab11-экзосома биогенезінің реттегіші Chmp5 экспрессиясын тежеу Aβ тудырған эндолизосомалық ақаулардың MC-ға таралуын басады&lt;/span&gt;&lt;/a&gt;SC-дағы Rab11-экзосома биогенезінің реттегіші Chmp5 экспрессиясын тежеу Aβ тудырған эндолизосомалық ақаулардың MC-ға таралуын басады&lt;/h4&gt;\n&lt;p&gt;Біздің алдыңғы талдауымыз SC-дағы Aβ экспрессиясы агрегацияланған DCG ақуыздарының мембранадан диссоциациялануын басатынын көрсетті — бұл DCG-дің қалыпты жетілуінің маңызды кезеңі, нәтижесінде ақаулы DCG компартменттері лизосомаларға қалыпты тасымалданбайды және аберрантты түрде секрецияланады. DCG компартменттеріндегі ILV-лер DCG-мен компартменттің жетілу процесі кезінде де, одан кейін де байланысты болады. Шынында да, бұл ILV-лер DCG биогенезінде рөл атқарады. Біз Rab11-экзосомалар MC-дағы Aβ тудырған эндолизосомалық тасымалдау ақауларын күшейтуі мүмкін деп болжадық, өйткені Aβ-ны экспрессиялайтын SC-дағы мембраналар мен GFP-MFAS құрамындағы ақуыз агрегаттары арасындағы тұрақтанған өзара әрекеттесулер осы жасушалардан тыс жерде сақталуы мүмкін.&lt;/p&gt;\n&lt;p&gt;Мұны тексеру үшін біз Aβ-пептидтерінің қатысуымен және жоқтығында SC-да Rab11-экзосома биогенезін тежедік. DCG компартменттеріндегі ILV биогенезі төрт ESCRT кешенінің негізгі компоненттерімен басқарылады, олар сондай-ақ кешкі эндосомалық экзосомаларды генерациялай алады; алайда, біз бұған дейін шыбын және адам жасушаларында ESCRT-III қосымша ақуыздары кешкі эндосомалардағы экзосома биогенезіне қарағанда Rab11-экзосомалардың қалыптасуына таңдамалы түрде қатысатынын көрсеткенбіз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SC-дағы Chmp5 нокдауны Aβ экспрессиясына қарамастан, MC-ның GFP-MFAS сіңіруін күрт төмендетеді, бұл Rab11-экзосомалардың DCG компоненттерін жасушааралық тасымалдаудағы маңызды рөлін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы ақуыздарды кодтайтын гендердің нокдауны DCG компартменттерінде ILV түзілуін басады, бірақ негізгі ESCRT нокдаундарынан айырмашылығы, кешкі эндосомалар мен лизосомалардағы убиквитинденген ақуыздардың ILV-ге тәуелді деградациясына айтарлықтай әсер етпейді.&lt;/p&gt;\n&lt;p&gt;Сондықтан біз SC-дағы қосымша ESCRT-III компоненті Chmp5 генінің нокдаунынан кейін GFP-MFAS-тың MC-ға ауысуын бағаладық. Бұрын біз SC-да ксантиндегидрогеназа ферментін кодтайтын rosy көз пигментациясы геніне бағытталған бақылау RNAi-ін экспрессиялағанда, бұл MC-дағы GFP-MFAS деңгейін арттыратынын анықтадық. Сондықтан біз Drosophila гені емес, mCherry-ге бағытталған баламалы RNAi-ді қолдандық; Aβ болмаған кезде ол да экспрессияланбайтын бақылау топтарымен салыстырғанда MC-ның GFP-MFAS сіңіруін күшейткендей болды (5A, 5C-E суреттерін 1-суретпен салыстырыңыз), бірақ rosy-RNAi-ге қарағанда азырақ дәрежеде. Бұл нәтиже және басқа зерттеулер SC-дағы RNAi процессинг аппаратын белсендіру GFP-MFAS-тың жасушааралық ауысуын күшейтуі мүмкін екенін болжайды. Осы күшейтуге қарамастан, Chmp5 нокдауны біз қолданған барлық үш талдау бойынша өлшенгендей, тек SC-да жабайы типтегі Aβ немесе Aβ-Iowa экспрессияланған MAG-тарда ғана емес, тіпті Aβ экспрессияламайтын жасушаларда да ішкі GFP-MFAS деңгейін қатты басты (5-сурет). Бұл манипуляция MC эндолизосомалық компартменттеріндегі GFP флуоресценциясының орташа қарқындылығын да төмендетті, ал SC-да Aβ экспрессияланбаған немесе Aβ-wt экспрессияланған MAG-тар үшін MC-да анықталған ірі эндолизосомалық құрылымдардың саны да азайды (SN-сурет). Бұл деректер SC-дағы Chmp5 нокдауны GFP-MFAS эндоцитозын қатты төмендететінін және/немесе оның MC-дағы деградациясын күшейтетінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RNAi (РНҚ интерференциясы) — ген функциясын зерттеу үшін нақты бір ген экспрессиясын «өшіру» немесе төмендету әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MAG люменіндегі GFP-MFAS деңгейін бағалау Chmp5 нокдаунының Aβ-wt экспрессиялайтын SC арқылы GFP-MFAS секрециясын төмендетпегенін (5H және 5L-суреттер) және шын мәнінде Aβ-Iowa үшін оны арттырғандай болғанын (5N, 5R-суреттер) көрсетті, бұл MC сіңіруінің өзгеруі люмендік GFP-MFAS-тың төмендеуімен түсіндірілмейтінін көрсетеді. Бақылау бездерінде Chmp5 нокдауны GFP-MFAS секрециясының төмендеуіне әкелді (5F-сурет), дегенмен MC сіңіруіне тежегіш әсері күштірек көрінді (5C-E суреттер). Жалпы алғанда, бұл деректер Rab11-экзосомалар және/немесе олардың ILV прекурсорлары DCG компоненттерінің жасушадан жасушаға ауысуында және Aβ тудырған эндолизосомалық ақаулардың таралуында маңызды рөл атқаратынын көрсетеді.&lt;/p&gt;\n&lt;p&gt;Кейбір, бірақ барлығы емес, ESCRT нокдаундары SC-да ірі DCG өндірісін тежейді, бұл осы компартменттердің лизосомаларға бағытталуын арттыруы және сондықтан Aβ экспрессиялайтын жасушаларда туындайтын эндолизосомалық ақауларда өзгерістер тудыруы мүмкін. Сондықтан біз Chmp5 нокдауны фенотиптік таралуға әсерінен бөлек, секреция үшін SC сапасын бақылау жолында эндолизосомалық тасымалдауды өзгертті ме немесе Aβ-wt немесе Aβ-Iowa экспрессиялайтын SC-да байқалған эндолизосомалық тасымалдау ақауларын модификациялады ма, соны зерттедік (6-сурет).&lt;/p&gt;\n&lt;p&gt;SC-да Aβ болмаған кезде экспрессияланғанда, Chmp5-RNAi осы жасушалардағы қышқылданған компартменттер санын және лизосомалық ауданды арттырды (6A, 6B, 6I, 6J-суреттер), мүмкін жасушалар қалыптан тыс DCG-лердің жоғары үлесін қамтығандықтан (6H-сурет). Сондай-ақ бақылау топтарымен салыстырғанда MC арқылы GFP-MFAS сіңіруінің төмендеу үрдісі байқалды (6K-сурет), дегенмен бұл талдау MAG ортасындағы сіңіру талдауынан айырмашылығы, айтарлықтай өзгерісті анықтау үшін жеткілікті сезімтал болмады (5F-сурет).&lt;/p&gt;\n&lt;p&gt;Aβ-wt немесе Aβ-Iowa-мен бірге экспрессияланғанда (6C-F суреттер), MC GFP-MFAS сіңіруінің төмендеуі байқалды (6K-сурет, 5H-K және 5N-Q суреттерін қараңыз). Алайда, қалыптан тыс DCG-лердің, қышқылданған компартменттердің немесе лизосомалық ауданның айқын азаюы байқалмады, дегенмен Aβ-Iowa экспрессиялайтын жасушаларда DCG компартменттерінің саны артқан (6G-J суреттер). Сондықтан, SC-да Chmp5 нокдауны арқылы Aβ тудырған DCG ақауларын жасушалық-автономды фенотиптік басу біздің стандартты талдауларымызбен анықталмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жеміс шыбыны моделінде жүргізілді; ақуыздардың жасушааралық ауысуы бойынша нәтижелерді сүтқоректілерге экстраполяциялауда сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Негізінде, SC-дағы DCG қамтитын барлық компартменттер Rab11-оң болып табылады және бұған Chmp5 нокдауны да, Aβ изоформаларының артық экспрессиясы да әсер етпейді. Rab11 генінің локусында N-терминалды YFP ақуыз синтезін алып жүретін шыбындарды пайдаланып, біз DCG компартменттерінің санында кейбір шағын ауытқулар болса да (SN-сурет), барлық зерттелген генотиптер үшін олардың DCG компартменттері Rab11-мен белгіленгенін растадық (SN-сурет). Бұл DCG жетілу процесінің Rab11-оң рециркуляциялаушы эндосома идентификаторына ауысуын қамтитын кезеңі қалыпты өтетінін көрсетеді (SN-сурет).&lt;/p&gt;\n&lt;p&gt;YFP-Rab11 сонымен қатар осы компартменттердің ішіндегі ішкі люминальды везикулалардың (ILV) субпопуляциясын таңбалайды. Біз бұған дейін ILV биогенезінің өлшемі ретінде флуоресцентті пункталары бар Rab11-оң компартменттердің үлесін бағалаған болатынбыз.&lt;/p&gt;\n&lt;h4 id=\"chmp5-nokdaunynyng-ilv-biogenezine-aeseri\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#chmp5-nokdaunynyng-ilv-biogenezine-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Chmp5 нокдаунының ILV биогенезіне әсері&lt;/span&gt;&lt;/a&gt;Chmp5 нокдаунының ILV биогенезіне әсері&lt;/h4&gt;\n&lt;p&gt;Бұл талдау Chmp5 нокдаунының Aβ-wt бар және жоқ жағдайында да бақылау тобымен салыстырғанда ILV бар компартменттердің үлесін төмендететінін растады (Сурет S4A-D және S4H). Aβ-Iowa экспрессиялайтын SC үшін ILV бар барлық Rab11-оң компартменттерді санау қиынға соқты, өйткені бұл ILV-лердің көпшілігі шекаралық мембрананың жанында орналасқан және YFP шоғырлануы ретінде көрінеді (Сурет S4E және S4H). Chmp5 нокдауны орталықта орналасқан ILV-лердің санын арттырды (Сурет S4I), бұл осы генетикалық фонда ILV бар DCG компартменттерінің санын неліктен аздап арттырғанын түсіндіреді (Сурет S4F және S4H).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc-fS4.jpg\" alt=\"4-сурет. SC-спецификалық Chmp5 нокдауны Aβ экспрессиялайтын жасушаларда DCG компартментінің бірегейлігін өзгертпейді (6-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. SC-спецификалық Chmp5 нокдауны Aβ экспрессиялайтын жасушаларда DCG компартментінің бірегейлігін өзгертпейді (6-суретке қатысты)&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chmp5 нокдауны DCG компартменттерінде ILV түзілуін азайтады, сонымен қатар Aβ-Iowa экспрессияланған кезде ILV-лердің компартмент орталығына қарай ығысуы байқалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осылайша, SC-дегі Chmp5 нокдауны DCG компартменттерінде ILV түзілуін селективті түрде төмендетеді, алайда Aβ изоформалары артық экспрессияланған кезде осы компартменттердің жетілуі мен сапасын бақылауға әсер ететін кез келген кейінгі әсерлер біз қолданатын стандартты талдаулар арқылы анықталмады. Дегенмен, бұл нокдаун GFP-MFAS-тың басқа эпителий жасушаларына тасымалдануын және Aβ тудыратын эндолизосомалық ақаулардың осы жасушаларға таралуын қатты басады. Қызығы, Chmp5 нокдауны тіпті Aβ экспрессияламайтын SC-ден де тасымалдануды тежейтін сияқты болғандықтан, бұл экзосомаға тәуелді процесс физиологиялық тұрғыдан жұмыс істеуі мүмкін, бірақ ол Aβ изоформаларының қатысуымен күштірек артады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нокдаун — ген экспрессиясын төмендету арқылы ақуыз функциясын зерттеуге мүмкіндік беретін генетикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"escrt-iii-khosalkhy-genderining-nokdauny-ab-tudyrghan-koezdegi-nejrodegeneraciyany-basady\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#escrt-iii-khosalkhy-genderining-nokdauny-ab-tudyrghan-koezdegi-nejrodegeneraciyany-basady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ESCRT-III қосалқы гендерінің нокдауны Aβ тудырған көздегі нейродегенерацияны басады&lt;/span&gt;&lt;/a&gt;ESCRT-III қосалқы гендерінің нокдауны Aβ тудырған көздегі нейродегенерацияны басады&lt;/h4&gt;\n&lt;p&gt;Біздің зерттеулеріміз көрсеткендей, SC-да жабайы типтегі немесе оның мутанттық формаларының Aβ экспрессиясы АА (Альцгеймер ауруы) басталуына қатысы болуы мүмкін кем дегенде үш фенотипті тудырады: DCG компартменттеріндегі мембраналардан агрегацияланған ақуыздардың диссоциациясының бұзылуы, эндолизосомалық трафиктегі ақаулар және бұл ақаулардың SC секрециясы мен MC арқылы эндоцитоз арқылы басқа жасушаларға таралуы. DCG компартменттерінде ILV түзілуін және демек, Rab11-экзосомалардың секрециясын тежейтін Chmp5 нокдауны таралу фенотипін қатты басады, бірақ SC DCG және эндолизосомалық жүйесіндегі Aβ тудырған ақауларға мардымсыз әсер етеді (егер мүлдем әсер етсе).&lt;/p&gt;\n&lt;p&gt;Біз Aβ тудырған реттелетін секреция ақаулары АА кезінде байқалатын нейродегенеративті фенотиптерді бастауы мүмкін деп болжадық. Осылайша, SC-дағы осы ақаулардың кез келгенін басатын генетикалық манипуляциялар нейрондардағы Aβ экспрессиясы арқылы қоздырылатын дегенерацияны да тежей алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ESCRT-III қосалқы гендерінің (Chmp5, Ist1, Chmp1) нокдауны Aβ тудырған нейродегенерацияны басады, бұл Rab11-экзосомалар биогенезі жолының АА патогенезіндегі шешуші рөлін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл гипотезаны тексеру үшін біз АА-мен байланысты нейродегенерацияны зерттеу үшін кеңінен қолданылатын шыбын көзіндегі нейродегенерация моделін қолдандық. Дамып келе жатқан Drosophila көзінде көзге тән GMR-GAL4 драйверін қолдану арқылы жабайы типтегі Aβ немесе Aβ-Iowa экспрессиясы ересек көз морфологиясы қалыптасу кезеңінде жасушалардың дегенерациясына байланысты омматидийлердің қалыпты гексагональды құрылымын бұзады (7-сурет).&lt;/p&gt;\n&lt;p&gt;АА-мен байланысты нейродегенерацияның бірнеше генетикалық және фармакологиялық супрессорлары, сондай-ақ секреция модификаторлары бұл фенотиптерді ішінара құтқарады. Сонымен қатар, Rab11 Drosophila фоторецепторларында апикальды трафик пен секрецияда маңызды рөл атқаратыны белгілі, бұл бұл жасушалардың, көптеген басқа жасуша түрлері сияқты, SC-да бар негізгі реттелетін секреторлық биогенез аппаратына ие екендігі туралы идеямен сәйкес келеді.&lt;/p&gt;\n&lt;p&gt;Біз екі түрлі GMR-GAL4 инсерциясының бақылауымен Aβ-wt және Aβ-Iowa экспрессиясы ретсіз көз фенотипіне әкелетінін растадық (7-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GMR-GAL4 — бұл Drosophila көзінде гендердің мақсатты экспрессиясы үшін қолданылатын генетикалық жүйе, ол нақты ақуыздардың тіндердің құрылымына әсерін зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұрын «кедір-бұдыр көз» фенотиптерін зерттеу үшін аналитикалық құралдар әзірленген, алайда біз олардың біздің стереомикроскопиялық кескіндерімізбен нашар жұмыс істейтінін анықтадық. Сондықтан біз осы әдістердің элементтерін бейімдедік және шамамен 250 орталық омматидий үшін көздің гексагональды құрылымының тұрақтылығын өлшеу үшін автоматтандырылған омматидийлерді талдау құбырын әзірледік. Бұл көз ішіндегі орталық эллиптикалық аймақта бақылау көздері мен Aβ экспрессиялайтын көздердегі әрбір элементар көз үшін ең жақын алты омматидийге қатысты бұрышты анықтауға мүмкіндік берді. Біз UAS-трансген инсерциясын қамтымайтын шыбындармен шағылыстырғанда әрбір GMR-GAL4 желісі үшін эталондық қисықты орнаттық; ол әрқайсысы 60 градустық бұрышпен бөлінген алты айқын шыңды қамтыды (SN-сурет). Осы эталондық қисықпен салыстырғанда, біз Aβ экспрессиялайтын көздердегі омматидийлердің ретсіз орналасуын бақылау lacZ трансгенін экспрессиялайтын шыбындардың көздерінен анық ажыратуға болатынын анықтадық (SN-сурет).&lt;/p&gt;\n&lt;p&gt;Бақылау РНҚ-интерференциясының (mCherry-RNAi) экспрессиясы бақылау көздеріндегі омматидийлердің тұрақтылығына да, жабайы типтегі Aβ және Aβ-Iowa тудырған ретсіздікке де әсер етпеді (SN-сурет, 8A, 8B, 8D, 8E, 8F және 8H). Керісінше, Chmp5-RNAi жабайы типтегі Aβ тудырған ретсіздікті басты, бірақ Aβ-Iowa экспрессиялайтын көздерде емес (8C, 8D, 8G және 8H-суреттер). Жалғыз экспрессияланғанда, ол үшінші хромосома GMR-GAL4 (III) драйверімен қолданылғанда омматидийлердің аздаған ретсіздігін тудырды (SN-сурет), бұл ESCRT-III қосалқы функциясы даму барысында көздің қалыпты морфологиясын реттеуде физиологиялық рөл атқаруы мүмкін екенін болжайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу Drosophila моделінде жүргізілді; нәтижелер адам АА патогенезінің күрделілігін толық көрсете алмауы мүмкін және байқалған әсерлер сүтқоректілердің нейрондық жүйелерінде қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алдыңғы зерттеуде негізгі ESCRT компоненттерін (Stam, Vps25 және Vps4) РНҚ-интерференция арқылы азайту шыбын көзінде GMR-GAL4 бақылауымен адам APP артық экспрессиясы салдарынан туындаған дегенерация фенотипін басатыны туралы хабарланған болатын, бұл APP/Aβ-мен байланысты АА дегенерация модельдерінде ESCRT функциясы дегенерация үшін қажет деген болжамды растайды. ESCRT-III қосалқы ақуыздары және Rab11-экзосомалар арқылы делдалдық етілген биогенез жолы Aβ тудырған дегенерацияда маңызды қатысушы екенін растау үшін біз GMR-GAL4 моделінде басқа екі ESCRT-III қосалқы генінің, Ist1 және Chmp1 нокдаунының әсерін сынап көрдік. Бұрын екі нокдаун да SC DCG компартменттерінде ILV түзілуін селективті түрде тежейтіні көрсетілген. Олар Aβ-wt және Aβ-Iowa тудырған дегенерацияны басты (9-сурет), бірақ көзде жалғыз экспрессияланғанда әсер көрсетпеді (SN-сурет).&lt;/p&gt;\n&lt;p&gt;Қорытындылай келе, біздің деректеріміз Rab11-экзосомалар биогенезінде селективті қатысуы белгілі ESCRT-III қосалқы жолын блоктайтын болсақ, әртүрлі Aβ формалары тудырған дегенерациямен байланысты морфологиялық фенотипті басатынын көрсетеді.&lt;/p&gt;\n&lt;p&gt;Бұл дегенерация механизмі Rab11-экзосомалар биогенезін және мүмкін оның секреторлық DCG компоненттерін қалыпты эндоцитарлық қабылдауды бұзатын реттелетін секреторлық жолға кейінгі әсерін қамтитын процесті қамтитынын болжайды.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Aβ-ның APP-дан түзілуі арқылы нейродегенерацияны бастайтын және дегенеративті фенотиптердің басқа жасушаларға ауысуына ықпал ететін жасушалық биологиялық оқиғалар әлі де түсініксіз болып қалуда. Алайда, эндолизосомалық тасымалдаудағы ақаулар және бұл фенотиптің кейінгі жасушааралық таралуы маңызды рөл атқарады. Drosophila простатасына ұқсас SC жасушаларын пайдалана отырып жүргізген соңғы зерттеулеріміз бұл ақаулар реттелетін секрецияны бақылайтын эволюциялық сақталған APP-қа тәуелді процестердің реттелмеуінен туындауы мүмкін екенін көрсетеді. Бұл процестер Aβ-ны қалыпты деңгейде түзе алады, бірақ бұл деңгейлер жасушаның сапаны бақылау жүйелері арқылы адекватты түрде өңделеді.&lt;/p&gt;\n&lt;p&gt;Мұнда біз SC жасушаларында Aβ-wt және ерте басталатын отбасылық АА-мен байланысты Aβ-ның мутантты түрі Aβ-Iowa экспрессиясы Drosophila MAG бойындағы эпителий жасушаларына эндолизосомалық ақаулардың таралуын тудыратынын көрсетеміз. Түзілген аберрантты эндолизосомалар DCG компоненті MFAS-тың артық деңгейлерін, сондай-ақ, ықтимал SC DCG бөлімдерінде түзілген экзосомаларды қамтиды, дегенмен біз CD63-mCherry-мен белгіленген кейбір везикулалар басқа механизмдер арқылы түзілген болуы мүмкін екенін жоққа шығара алмаймыз. SC жасушаларын Rab11-экзосома биогенезін тежеу үшін генетикалық манипуляциялау Aβ экспрессиялайтын жасушалардағы DCG биогенез жолына шектеулі әсер етеді, бірақ таралуды күшті басады.&lt;/p&gt;\n&lt;p&gt;Сонымен қатар, Rab11-экзосома биогенез жолын төмендету (downregulating) шыбын көзінде Aβ тудырған дегенеративті әсерлерді де басады, бұл реттелетін секрециямен байланысты процестердің бұзылуы нейродегенерацияға қатысатынын және болашақ терапиялық стратегиялар үшін нысана болуы мүмкін екенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"ab-tudyrghan-endolizosomalykh-tasymaldau-akhaularynyng-taraluy-retteletin-sekretorlykh-zholmen-bajlanysty\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#ab-tudyrghan-endolizosomalykh-tasymaldau-akhaularynyng-taraluy-retteletin-sekretorlykh-zholmen-bajlanysty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aβ тудырған эндолизосомалық тасымалдау ақауларының таралуы реттелетін секреторлық жолмен байланысты&lt;/span&gt;&lt;/a&gt;Aβ тудырған эндолизосомалық тасымалдау ақауларының таралуы реттелетін секреторлық жолмен байланысты&lt;/h4&gt;\n&lt;p&gt;SC жасушаларындағы қатты ұлғайған DCG бөлімдерін пайдалана отырып, біз бұрын Aβ экспрессиясы реттелетін секреторлық жолды және оның сапаны бақылауын бұзатынын, сондай-ақ көрші жасушаларға таралатын эндолизосомалық ақауларға әкелетінін көрсеткен едік. Осы зерттеу үшін LysoTracker Red бояуын пайдаланып, MC жасушаларындағы эндолизосомалық бөлімдердің қатты ұлғайғанын және олар GFP-мен белгіленген SC DCG ақуызы MFAS-тан алынған күшейтілген GFP флуоресценциясын көрсететінін дәлелдеу мүмкін болды. MAG өзінің екі бөлігінің дистальды ұшында шамамен 40 SC жасушасын қамтиды, олар сондай-ақ шамамен 1000 MC жасушасын қамтиды. Мұнда біз MAG-тың қалған бөлігіндегі ұлғайған MC эндолизосомалық бөлімдерінің ішінде GFP жиналуын анықтадық; Aβ-Iowa үшін күтілгендей, қалыптан тыс қабылдау SC жасушаларындағы BMP сигналдауына тәуелді екенін көрсету мүмкін болды, бұл жасушалардағы реттелетін секрецияны бақылайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Aβ әсерінен DCG биогенезі мен Rab11-ге тәуелді экзосома жолының бұзылуы ақуыздардың көрші жасушаларға патологиялық ауысуына әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Адамның Aβ-сына тән антиденемен иммунобояу Aβ-пептидтерінің SC DCG-леріне енгізілетінін көрсетті. Осы антидене тудырған фондық бояуға байланысты бұл пептидтердің MC жасушаларына да ауысатынын растау мүмкін болмады. Алайда, біздің нәтижелеріміз Aβ тікелей DCG биогенезі мен бөлімдердің жетілуіне араласатыны туралы идеяны қатты қолдайды және секрециядан кейін DCG компоненттерімен өзара әрекеттесу сақталуы ықтималдығын арттырады, бұл секрецияланған MFAS-тың MC жасушалары тарапынан аберрантты қабылдануын түсіндіреді.&lt;/p&gt;\n&lt;h4 id=\"rab11-ekzosomalar-ab-indukciyalanghan-endolizosomaldy-akhaulardyng-zhasushaaralykh-taraluyna-ykhpal-etedi\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#rab11-ekzosomalar-ab-indukciyalanghan-endolizosomaldy-akhaulardyng-zhasushaaralykh-taraluyna-ykhpal-etedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rab11-экзосомалар Аβ-индукцияланған эндолизосомальды ақаулардың жасушааралық таралуына ықпал етеді&lt;/span&gt;&lt;/a&gt;Rab11-экзосомалар Аβ-индукцияланған эндолизосомальды ақаулардың жасушааралық таралуына ықпал етеді&lt;/h4&gt;\n&lt;p&gt;Кеміргіштер мен адам жасушаларындағы бұрынғы зерттеулер Аβ және Аβ-олигомерлер экзосомалармен байланысты түрде секрецияланатынын және амилоидты түйіндер өздерінің түзілуіне ықпал ететін экзосомаларды және/немесе басқа жасушадан тыс көпіршіктерді (ЖТК) қамтитынын көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Экзосомалар — бұл жасушааралық коммуникацияға қатысатын және патогенді ақуыздарды жасушалар арасында тасымалдай алатын кішкентай жасушадан тыс көпіршіктер.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, Альцгеймер ауруы (АА) бар пациенттердің плазмасы мен жұлын сұйықтығынан (ЖС), АА пациенттерінің нейрондық жасушаларынан және АА кеміргіш модельдерінің плазмасынан алынған Аβ-байланысты ЖТК патологиялық фенотиптерді басқа нейрондарға береді. Бұдан басқа, нейроуытты Аβ-олигомерлер экзосомаларды қамтитын механизм арқылы адам нейрондары мен глиясы арасында тасымалданатыны хабарланды. Бұл процесс ЖТК секрециялайтын жасушалардағы эндолизосомалық ақаулармен ынталандырылады.&lt;/p&gt;\n&lt;p&gt;Біз DCG компартменттерінің ішіндегі ішкі қуыстық көпіршіктер (ІҚК) эндолизосомальды ақаулардың таралуына қатысатын Аβ-байланысты ЖТК-ның ең болмағанда бір бөлігін көрсете алады деп ойладық. Шын мәнінде, SC-дағы Chmp5 нокауты MC тарапынан GFP-MFAS-тың қалыптан тыс сіңірілуін күрт басты, бұл осы идеяны қолдайды. Біз бұрын ESCRT-III көмекші гендері шыбын мен адам жасушаларындағы Rab11-экзосома биогенезінде таңдамалы рөл атқаратынын көрсеткен едік. Аβ-индукцияланған таралудың күшті басылуы Chmp5 нокаутының басқа жасушалық әсерлерімен байланысты екенін жоққа шығара алмасақ та, бұл екіталай көрінеді, өйткені бұл генетикалық фонда GFP-MFAS әлі де секрецияланады және бұл секрецияны қамтамасыз ететін SC DCG және эндолизосомалық компартменттерінде үлкен өзгерістер байқалмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;ESCRT-III ақуыздары мен экзосомалардың рөлі туралы қорытындылар модельдік организмдер мен жасуша культураларына негізделген, сондықтан олардың адамдағы Альцгеймер патогенезіне тікелей қосқан үлесі қосымша клиникалық растауды талап етеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бірқатар зерттеулер қалыпты және патологиялық нейрондық жасушааралық коммуникацияда Rab11-оң компартменттердің маңызды функцияларын атап өтті. Мысалы, шыбындарда Rab11 жүйке-бұлшықет түйісуіндегі пресинаптикалық секрецияға қатысады, ол экзосома тәрізді көпіршіктердің бөлінуін қамтиды. Сүтқоректілердің нейрондарындағы зерттеулер де АА және оның модельдерінде Аβ-байланысты экзосомалардың секрециясында Rab11-дің орталық рөлін көрсетеді.&lt;/p&gt;\n&lt;p&gt;Шын мәнінде, жалпы адамдық Rab11-экзосома қолтаңбалары мен АА пациенттерінің жұлын сұйықтығында жоғарылаған ақуыздар арасында сәйкестік бар.&lt;/p&gt;\n&lt;p&gt;Біздің нәтижелеріміз DCG компоненттерінің аберрантты жасушааралық тасымалдануы Аβ-индукцияланған экзосомамен байланысты патологиялардың таралуымен байланысты болуы мүмкін екенін көрсетеді. Бұл компоненттердің күшейтілген тасымалдануы Аβ туындатқан MC-лардың жоғарылаған эндоцитарлық белсенділігін немесе төмендеген деградациялық функцияларын көрсетуі мүмкін. Алайда, MFAS, мембраналар және ІҚК Аβ экспрессиялайтын SC-лардың DCG компартменттерінде қалыптан тыс өзара әрекеттесетіні туралы бақылау (Singh et al., 2025) экзосома кешендері, экзосоманың «биомолекулярлық тәжі» ішіндегі Аβ-мен, сондай-ақ DCG ақуыздарымен байланысқан күйде секрецияланған кезде сақталып қалуы және MC-ларда эндолизосомалық ақауларды тудыруы мүмкін екендігін болжайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Chmp5 нокауты GFP-MFAS жасушааралық тасымалдануын басады, ал DCG ақуыздары мен Аβ бар экзосома кешендері сақталып қалып, нысана жасушаларда эндолизосомалық ақауларды тудыруы мүмкін.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шын мәнінде, мұндай механизмнің жоғарылаған Аβ болмаған жағдайда физиологиялық түрде жұмыс істейтіні әлі де белгісіз. Chmp5 нокауты Аβ шамадан тыс экспрессияламайтын SC-лардағы GFP-MFAS жасушааралық тасымалдануын басқанымен, басқа РНКi шамадан тыс экспрессиялайтын бақылаулар экспрессияламайтын бақылаулармен салыстырғанда GFP-MFAS жасушааралық тасымалдануының жоғарылағанын көрсетеді. Сондықтан РНКi аппаратын гиперактивациялау жасушааралық таралу белсенділігін арттыруы мүмкін және Chmp5 нокауты бұл өсуді басады. Соған қарамастан, Аβ физиологиялық жасушааралық сигнал беруге қатысатыны анықталды, сондықтан бұл процесс Rab11-экзосома:агрегат кешендерін қамтуы мүмкін, бұл идеяны енді сынақтан өткізуге болады. SC-спецификалық Chmp5 нокауты жұптасуға арналған арнайы аналық жауапты — басқа аталықтардан бас тартуды тежейді (Marie et al., 2023), және DCG ақуыз агрегациясының негізгі реттеушісі mfas, APP немесе басқа DCG компоненттерінің осы экзосома арқылы жүретін процеске қатысатынын зерттеу қызықты болар еді.&lt;/p&gt;\n&lt;h4 id=\"rab11-ekzosoma-retteushilerining-nokdauny-ab-tuyndatkhan-nejrodegeneraciyany-da-basady\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#rab11-ekzosoma-retteushilerining-nokdauny-ab-tuyndatkhan-nejrodegeneraciyany-da-basady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rab11-экзосома реттеушілерінің нокдауны Aβ туындатқан нейродегенерацияны да басады&lt;/span&gt;&lt;/a&gt;Rab11-экзосома реттеушілерінің нокдауны Aβ туындатқан нейродегенерацияны да басады&lt;/h4&gt;\n&lt;p&gt;GMR-GAL4 арқылы басқарылатын Aβ экспрессиясы нейродегенерациямен байланысты морфологиялық ақауды туындататыны белгілі және бұл үдерістің супрессорларын анықтау үшін тиімді сынақ жүйесін қамтамасыз етті.&lt;/p&gt;\n&lt;p&gt;Zhuang және т.б., 2023 жылғы зерттеуі негізгі ESCRT ақуыздарының нокдауны GMR-GAL4 басқаратын адам APP туындатқан көз дегенерациясын басатынын хабарлады. Олар бұл манипуляция Aβ қалыпта түзілетін кейінгі эндосомаларға APP тасымалдануын төмендететінін алға тартты. Біз сілекей бездерінде (SCs) және адам колоректальды қатерлі ісік жасушаларында көрсеткеніміздей, көмекші ESCRT-III нокдауны кеш эндосомальды экзосомаларға қарағанда Rab11-экзосомаларына қатысты салыстырмалы түрде селективті әсер ететіні (Marie et al., 2023) және алдын ала кесілген жабайы тип пен мутантты Aβ туындатқан дегенерацияны тежеуге қабілетті екендігі нейродегенерацияның ESCRT арқылы жүретін супрессиясына басқа үдерістердің де қатысатынын көрсетеді. MAGs талдауынан туындайтын бір қарапайым түсіндірме — Rab11-экзосома биогенезін тежеу арқылы эндолизосомалық ақаулардың таралуын блоктау Aβ әсерлерінің кейбірін әлсіретеді (10-суреттегі модельді қараңыз). Алайда, GMR-GAL4 драйвері Aβ-ны барлық фоторецепторларда экспрессиялайды, сондықтан ақаулы фоторецепторлардан қалыпты фоторецепторларға фенотиптік таралу бұл процесте басты рөл атқармайтын сияқты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Көмекші ESCRT-III компоненттерінің нокдауны Rab11-экзосома биогенезін тежеу арқылы Aβ индукциялаған нейродегенерацияны бәсеңдетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Баламалы мүмкіндік — қате жиналған тығыз секреторлық түйіршік (DCG) компартменттерінен секрецияланатын материалдың сіңірілуі басқа Aβ экспрессиялайтын жасушаларда және әлеуетті түрде секрециялаушы жасушаның өздерінде эндолизосомалық трафик ақауларын күшейтеді. Біз Chmp5 нокдауны жасалған Aβ экспрессиялайтын SC-лардың DCG немесе эндолизосомалық компартменттерінде ешқандай үлкен өзгерістерді байқамасақ та, бұл жасушалар GMR-GAL4 сынағындағы фоторецепторлар сияқты эндоцитоз болмаған кездің өзінде де көбірек Aβ синтездеуді жалғастырады. Сондықтан олар қате Aβ синтезін бастау үшін осы механизмдерді қажет ететін жасушаларға қарағанда фенотиптік таралу механизмдерін тежеуге аз ұшырауы мүмкін. Бұл сондай-ақ байқалған нейродегенерацияның толық емес түрде басылуын түсіндіруі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Деректер Drosophila модельдері мен жасуша линияларында алынған; нейродегенерацияның толық басылмауы Aβ патогенезінің күрделілігі мен көпкомпоненттілігін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"retroteli-sekreciyanyng-buzyluy-zhaene-aeb-patologiyasynyng-bastaluynyng-integraciyalanghan-modeli\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#retroteli-sekreciyanyng-buzyluy-zhaene-aeb-patologiyasynyng-bastaluynyng-integraciyalanghan-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ретротели секрецияның бұзылуы және ӘБ патологиясының басталуының интеграцияланған моделі&lt;/span&gt;&lt;/a&gt;Ретротели секрецияның бұзылуы және ӘБ патологиясының басталуының интеграцияланған моделі&lt;/h4&gt;\n&lt;p&gt;Егер ақаулы реттелетін секреция Aβ туындататын ӘБ патологиясын бастауда және оның таралуында маңызды рөл атқарса, ӘБ-дағы басқа негізгі ойыншылар, атап айтқанда тау-ақуыз бұл жерге қалай сәйкес келеді? Aβ-мен байланысқан эндолизосомалық ақаулар кеміргіштердің нейрондарында тау патологияларын туындататыны көрсетілген (Gao et al., 2025; Schützmann et al., 2021), ал Aβ адам нейрондары арасында патологиялық тау тұқымдарының экзосомалық тасымалдануына қатысады (Miyoshi et al., 2021), бұл процестер аберрантты секреторлық трафикпен байланысты болуы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Секреция ақаулары мен Arc ақуызы Aβ-ны тау патологиясының таралуымен эндолизосомалық жол арқылы байланыстырып, Rab11a экзосомалары арқылы ерте диагностикалау мүмкіндіктерін ашады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Белсенділікпен реттелетін цитоскелетпен байланысқан ақуыз (ARC) жақында тау тұқымдануымен де тікелей байланысты болды (Tyagi et al., 2026). Көптеген зерттеулер Arc-ты ӘБ-мен байланыстырады (Wu et al., 2011; Landgren et al., 2012; Bi et al., 2018), ал Drosophila-да Arc ортологі Arc1 генінің нокауты бірнеше ӘБ модельдерінде тау тудыратын патологияны басады (Schulz et al., 2023). Arc пресинаптических ұшында ILV өндірісіне тығыз қатысатындықтан (Ashley et al., 2018) және APP цитоплазмалық доменімен байланыса алатындықтан (Lee et al., 2023), ол эндолизосомалық таралу фенотипіне қатысты тау-модуляцияланған цитоскелет пен реттелетін секреторлық компартменттер арасындағы маңызды байланысты қамтамасыз ете алады. Осыған байланысты, Arc1 SC-ларда ерекше жоғары деңгейде транскрипцияланатыны және сондықтан бұл жүйеде де рөл атқаруы мүмкін екендігі қызықты (Immarigeon et al., 2021).&lt;/p&gt;\n&lt;p&gt;Біздің зерттеуіміз ӘБ-дағы ең ерте патологиялық ақаулар ауруға тән беткі жүктерді тасымалдайтын қалыптан тыс Rab11 экзосомаларының секрециясымен байланысты деген қызықты мүмкіндікті тудырады (10-Сурет). Бұл экзосомалардың кеш эндосомалық экзосомаларға қарағанда әр түрлі ақуыздық жүктерін қамтитыны белгілі (Marie et al., 2023; Singh et al., 2025), сондықтан биологиялық сұйықтықтардағы басқа EV арасынан нейрондық Rab11 экзосомаларын (адамдарда Rab11a-экзосомалар деп аталады) ажырату үшін тесттерді әзірлеу ерте сатыдағы немесе тіпті продромальды диагностикалық тесттерді жасаудың жаңа жолын қамтамасыз етуі мүмкін. Деменциясы бар ӘБ пациенттері мен ауруға төзімді адамдардың нейрондық субклетоcлық протеомын жуырдағы талдауы эндолизосомалық ақуыздардың, әсіресе ерте және рециклингтік эндосомалармен байланыстылардың үйлестірілген қайта ұйымдастырылуын көрсетеді, бұл когнитивті төмендеуі бар пациенттерде айқынырақ. Rab11a-экзосомалар болжамға қатысты осы айырмашылықтардың индикаторын қамтамасыз ете алады деген болжам жасауға болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экзосомалар — бұл жасушааралық байланыс үшін бөлінетін шағын жасушадан тыс көпіршіктер, ал эндосомалар — ақуыздар мен липидтерді сұрыптайтын жасуша ішілік көпіршіктер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Реттелетін секреция мен оның сапа бақылауындағы ақаулар Aβ генерациялайтын эндолизосомалық компартменттердің жиналуына әкеліп соқтырады, ақуыздың агрегациясын және жасушалар арасында эндолизосомалық фенотиптердің таралуын ынталандырады деген гипотезаны енді адам және сүтқоректілер нейрондарында егжей-тегжейлі тексеру қажет (Verma et al., 2026). Алайда, SC-лардағы қосымша зерттеулер тығыз секреторлық түйіршіктердің (DCG) агрегациясын бұзатын және ақаулы агрегацияланған материалдың жасушалар арасында таралуын ынталандыратын қосымша ойыншыларды, сондай-ақ бұл фенотиптердің генетикалық супрессорларын анықтауға көмектесуі тиіс.&lt;/p&gt;\n&lt;p&gt;Маңыздысы, егер спорадиялық ӘБ пациенттеріндегі патология өмір бойы біртіндеп жиналатын және таралатын DCG биогенезіндегі шағын ақауларды қамтитын болса, бұл супрессорлардың салыстырмалы түрде жұмсақ модуляциясы кейінгі өмірде деменцияның дамуына жол бермейтін ерте сатыларда терапиялық жолды қамтамасыз етуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелерді модельдік ағзалардан (Drosophila) адамның спорадиялық Альцгеймер ауруына экстраполяциялау қосымша клиникалық тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы қолжазбада қолданылған Drosophila штамдары Реактивтер кестесінде көрсетілген. Трансгенді шыбын линияларының көпшілігі Блумингтондағы Drosophila қойма орталығынан (BDSC) және Венадағы Drosophila ресурс орталығынан (VDRC) алынды. Ерекшеліктер келесідей болды; dsx-GAL4 (С. Гудвин, Оксфорд, Ұлыбритания ұсынған) (Rideout et al., 2010), эндогендік Rab локусындағы YFP-Rab11 фьюжн гені (С. Итон, Макс Планк, Германия ұсынған) (Dunst et al., 2015), UAS-Dad (Д. Беннетт, Ливерпуль университеті ұсынған). Линиялар бұрынғы зерттеулерде жасалған және/немесе қолданылған жағдайда, бұл төмендегі тізімдегі стоктардың жанында атап өтілген: w1118 (Л. Партридж, UCL, Ұлыбритания ұсынған)&lt;/p&gt;\n&lt;p&gt;(мыс., Singh et al., 2025): GFP-mfas гендік қақпаны (MI11275 GFSTF.2; BDSC 63204)&lt;/p&gt;\n&lt;p&gt;(Nagarkar-Jaiswal et al., 2015; Singh et al., 2025): UAS-CD63-mCherry (Fan et al., 2020): w; GAL80ts; dsx-GAL4 (Fan et al., 2020): w; tub-GAL80ts; dsx-GAL4, GFPmfas (Singh et al., 2025): w; tub-GAL80ts; YFP-Rab11, dsx-GAL4 (Fan et al., 2020):&lt;/p&gt;\n&lt;p&gt;UAS-Aβ-wt (BDSC 33769) (Wu et al., 2017) және UAS-Aβ-Iowa (BDSC 33779; Vitruvean) (Chouhan et al., 2016) конструкциялары оларды секреторлық жүйеге бағыттау үшін үзілетін ER сигналдық тізбегін қамтиды (Singh et al., 2025 ж. қолданылған): UAS-Aβ-wt w; UAS-Aβ-wt, tub-GAL80ts; dsx-GAL4 және w; UAS-Aβ-wt, tub-GAL80ts; dsx-GAL4, GFP-mfas жасау үшін басқа трансгендермен біріктірілді: UAS-Chmp5-RNAi (P{KK109120}VIE-260B; VDRC 101422; шығарылудан қалған сток) (Dietzl et al., 2007; Marie et al., 2023): UAS-mCherry-RNAi (VALIUM20-mCherry; BDSC 35785)&lt;/p&gt;\n&lt;p&gt;(Duan et al., 2023): UAS-Chmp1-RNAi (P{GD11219}v21788; VDRC 21788) (Dietzl et al., 2007; Marie et al., 2023): UAS-Ist1-RNAi (P{GD11948}:VDRC 22497) (Dietzl et al., 2007; Marie et al., 2023): w; GMR-GAL4 (II) (Хафен зертханасы ұсынған: ETH Цюрих) (Freeman, 1996), GMR-GAL4 (III) (Уилсон зертханасында жасалған): GMR-GAL4 (III) w; UAS-A\\beta-wt; GMR GAL4 (III) жасау үшін біріктірілді, ал GMR-GAL4 (II) w; GMR GAL4 (II); UAS-A\\beta-Iowa алу үшін қолданылды.&lt;/p&gt;\n&lt;p&gt;Шыбындар 25°C температурада 12 сағаттық жарық/қараңғылық циклінде стандартты жүгері-агар ортасында ұсталды [әр литрге 12.5 г агар (F.Gutlind &amp;amp; Co. Ltd), 75 г жүгері ұны (B. T. P. Drewitt), 93 г глюкоза (Sigma-Aldrich, #G7021), 31.5 г инактивацияланған ашытқы (Fermipan Red, Lallemand Baking), 8.6 г калий натрий тартрат тетрагидраты (Sigma Aldrich, #S2377), 0.7 г кальций хлориді дигидраты (Sigma-Aldrich, #21907) және 12 мл этанолда ерітілген 2.5 г нипагин (Sigma-Aldrich, #H5501)]. Олар әр 3-4 күн сайын жаңа азыққа ауыстырылып тұрды.&lt;/p&gt;\n&lt;p&gt;MAG-пен байланысты тәжірибелер үшін tub-GAL80ts; dsx-GAL4 драйверлік желісін алып жүретін ұрғашы шыбындар, жеке немесе GFP-mfas, YFP-Rab11 немесе UAS CD63-mCherry-мен бірге (кейбір жағдайларда UAS-реттелетін Aβ-wt немесе Aβ-Iowa формаларымен бірге), UAS-трансгендерін немесе w1118 (бақылау) алып жүретін еркек шыбындармен шағылыстырылды, бұл SC-спецификалық нысаналы ген экспрессиясының температурамен басқарылатын индукциясына мүмкіндік берді.&lt;/p&gt;\n&lt;p&gt;Алдыңғы зерттеулердегідей (Singh et al., 2025), MAG және тірі тіндерді визуализациялау тәжірибелері үшін, жас еркек ұрпақтар жұмыртқадан шыққаннан кейін жиналып, дамудан кейінгі SC-спецификалық трансген экспрессиясын белсендіру үшін 6 күн бойы 29°C-қа ауыстырылды.&lt;/p&gt;\n&lt;p&gt;Негізгі жасушалардағы (MC) GFP-MFAS мөлшерін анықтау тәжірибелері үшін, бұл фиксацияланған тіндерді визуализациялауды қамтыды, еркектер RNAi жинақталуына уақыт беру мақсатында жұмыртқадан шығар алдында 24 сағат бұрын 29°C-қа ауыстырылды, SC-де DCG бөлімдері қалыптаса бастағанша, содан кейін жұмыртқадан шыққаннан кейін 6 күн бойы 29°C-та сақталды.&lt;/p&gt;\n&lt;p&gt;Drosophila көздерін талдау тәжірибелері үшін, UAS-RNAi трансгендерін немесе w1118 бақылауын алып жүретін ұрғашы шыбындар, нысаналы гендердің көзге тән экспрессиясын қоздыру үшін, жеке немесе UAS-Aβ-wt немесе UAS-Aβ-Iowa-мен бірге GMR-GAL4 алып жүретін еркек шыбындармен шағылыстырылды. Бұл шағылыстырулар бүкіл тәжірибе бойы 25°C-та сақталды. Жұмыртқадан шыққаннан кейін, ұрғашы шыбындар еркектерінен бөлініп, мұздату және визуализациялау алдында 25°C-та 2-4 күн бойы жасартылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SC және MC-де трансген экспрессиясын белсендіру үшін 29°C температуралық бақылау қолданылды, бұл RNAi және Aβ-ның тін морфологиясына әсерін зерттеуге мүмкіндік берді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vizualizaciyalau-ueshin-mag-tardy-dajyndau\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#vizualizaciyalau-ueshin-mag-tardy-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуализациялау үшін MAG-тарды дайындау&lt;/span&gt;&lt;/a&gt;Визуализациялау үшін MAG-тарды дайындау&lt;/h4&gt;\n&lt;p&gt;Біз тірі жасушаларды визуализациялау үшін Fan et al., 2020 сипаттаған әдістеменің бейімделуін қолдандық. Алты күндік ересек еркек шыбындар CO2 көмегімен жансыздандырылып, мұздай 1X PBS (Thermo Fisher Scientific) ерітіндісіне батырылды. Еркек репродуктивті жүйесі микропинцеп көмегімен құрсақ қуысының соңғы сегменті арқылы абайлап сыртқа шығарылды. Тұқым бездері, тұқым көпіршіктері және эякуляторлы көпіршік зақымдалмай және безге бекітілген күйінде қалдырылды, бірақ тіндердің бүктелуіне және MAG визуализациясы кезінде кедергі келтірмеуі үшін май тіндері мен ішектер абайлап алынып тасталды. Содан кейін бездер мұз үстінде 2-5 минут бойы PBS-те 500 нМ Lysotracker Red (Thermo Fisher Scientific) ерітіндісімен инкубацияланып, мұздай PBS-пен жуылды. Тін кейіннен екі жабын шыны (тікбұрышты: жабын шыны №1, 22 мм × 50 мм, Fisher, #1237-3128 және дөңгелек: жабын шыны №1, 13 мм, #49492, VWR) арасында 1x PBS тамшысында тұрақты орнатылды, құрылғы арнайы дайындалған металл ұстағышпен бірге ұсталды. Бездер визуализациялауға дайын болғанда, үлгілерді сәл тегістеу үшін сүзгі қағазы көмегімен артық PBS алынып тасталды.&lt;/p&gt;\n&lt;p&gt;Конфокалды талдау үшін микропрепарация бөлме температурасында PBS-те жүзеге асырылды және кейін үлгілер 20 минут бойы PBS-тегі 4% параформальдегидте (Sigma-Aldrich) фиксацияланды. Содан кейін бездер SuperFrost микроскоп слайдтары (VWR) үстіне DAPI (Vector Laboratories) бар Vectashield тамшысына орнатылмас бұрын шамамен 5 минут бойы 1x PBS-те жуылды. Үлгілер жабын шынымен (22 мм × 22 мм, 0,13–0,17 мм; Fisher) орнында ұсталды.&lt;/p&gt;\n&lt;h4 id=\"fiksaciyalanghan-tinderdi-antidenelermen-boyau\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#fiksaciyalanghan-tinderdi-antidenelermen-boyau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фиксацияланған тіндерді антиденелермен бояу&lt;/span&gt;&lt;/a&gt;Фиксацияланған тіндерді антиденелермен бояу&lt;/h4&gt;\n&lt;p&gt;Антиденелермен бояу үшін MAG-тар бөлініп алынып, (жоғарыда сипатталғандай) 4% параформальдегидте фиксацияланды. Фиксацияланған бездер кейіннен PBST-де (1× PBS, 0,3% Triton X-100 [Sigma-Aldrich]) 6 × 10 минут бойы өткізгіш жасалды, PBSTG-де (PBST, 10% ешкі сарысуы [Sigma-Aldrich]) 30 минут бойы блокталды және PBSTG-де 1:500 қатынасында сұйылтылған тышқан anti-Aβ 6E10 (BioLegend, 39320) антиденелерімен 4°C-та түн бойы инкубацияланды. Бездер содан кейін PBST-де 6 × 10 минут бойы жуылды, содан кейін бөлме температурасында 2 сағат бойы PBSTG-де 1:500 қатынасында сұйылтылған Cy3-конъюгацияланған есек anti-тышқан екіншілік антиденелерімен (The Jackson Laboratory) 1:400 қатынасында инкубацияланды. Бездер DAPI жоқ Vectashield-ке орнатылмас бұрын PBST-де тағы 6 × 10 минут бойы жуылды.&lt;/p&gt;\n&lt;h4 id=\"koezdi-vizualizaciyalau-ueshin-shybyndardy-dajyndau\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#koezdi-vizualizaciyalau-ueshin-shybyndardy-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көзді визуализациялау үшін шыбындарды дайындау&lt;/span&gt;&lt;/a&gt;Көзді визуализациялау үшін шыбындарды дайындау&lt;/h4&gt;\n&lt;p&gt;Ересек көздерді жарық стереомикроскопымен визуализациялау үшін, шағылыстырулардан алынған ұрғашы шыбындар жиналып, 25°C-та 2-4 күн бойы жасартылды, содан кейін көмірқышқыл газы арқылы жансыздандырылып, 0,6 мл Eppendorf түтікшелеріне (SLS) ауыстырылып, кемінде 24 сағат бойы -20°C-та мұздатылды; шыбындардың көпшілігі мұздатылғаннан кейін бір апта ішінде суретке түсірілді. Көздерді визуализациялау үшін шыбындар солдан оңға қараған күйде орналастырылды, көздің орталық бөлігі объектив линзасына мүмкіндігінше көлденең күйде болды.&lt;/p&gt;\n&lt;h4 id=\"tiri-zhasushalardy-vizualizaciyalau\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#tiri-zhasushalardy-vizualizaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тірі жасушаларды визуализациялау&lt;/span&gt;&lt;/a&gt;Тірі жасушаларды визуализациялау&lt;/h4&gt;\n&lt;p&gt;Тірі жасушаларды визуализациялау бөлме температурасында жүзеге асырылды және негізінен Singh et al., 2025-те қолданылған әдістемеге сүйенді. Leica Thunder инверттелген кең алаңды микроскопы (Leica) 100x үлкейтуде (Leica HCX PL FLUOTAR NA 1.3, майлы объектив) K8 sCMOS камерасымен қолданылды. Әрбір MAG үшін төрт SC (әр бөлік үшін екеуден) ≥10 жеке жас еркектер үшін талданды. Алынған кескіндер әдетте 0,2 мкм z-қашықтығымен 8–12 мкм тереңдіктегі z-стектер болды.&lt;/p&gt;\n&lt;p&gt;Thunder технологиясы (Leica) контрастты күшейту және фокустан тыс бұлыңғырлықты жою үшін шағын көлемді есептеу тазарту (SVCC) әдісімен қолданылды. SC морфологиясы FLURO-Bright Field визуализациялау көмегімен визуалдандырылды. LED параметрлері келесідей болды: GFP, 40% лазер қарқындылығында 475 нм қоздыру; YFP, 42% лазер қарқындылығында 510 нм қоздыру; және RFP, 30% лазер қарқындылығында 550 нм қоздыру. MAG-тардың орталық бөлігіндегі тірі MC-лер дәл осылайша, эпителий қабатындағы MC ядроларын анықтау үшін жарық алаңы арнасын пайдалана отырып суретке түсірілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SVCC (Small Volume Computational Clearing) — бұл кескінді өңдеу алгоритмі, ол фокустан тыс фондық жарықты (тұмандықты) жойып, тіндердің терең қабаттарын анық суретке түсіруге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bekitilgen-tinderdegi-gfp-mfas-bar-negizgi-zhasushalardy-taldau\"&gt;&lt;a href=\"2026-09-23/rab11-exosome-biogenesis-regulators-mediate-a-induced-interc.html#bekitilgen-tinderdegi-gfp-mfas-bar-negizgi-zhasushalardy-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бекітілген тіндердегі GFP-MFAS бар негізгі жасушаларды талдау&lt;/span&gt;&lt;/a&gt;Бекітілген тіндердегі GFP-MFAS бар негізгі жасушаларды талдау&lt;/h4&gt;\n&lt;p&gt;ImageJ бағдарламасындағы тор құралының көмегімен GFP-MFAS арнасы үшін негізгі жасушалардың (MC) кескініне 25 шаршыдан тұратын тор салынды. Көп жағдайда, төменде сипатталғандай, орталық 7, 8, 9-шаршылар талданып, орташа мәні есептелді. Без осы аймақтарда тегіс болмаған жағдайда, олардың орнына 12, 13, 14, 17, 18 немесе 19-шаршылар (тоғыз шаршыдан тұратын о
