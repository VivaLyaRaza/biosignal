        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"104\" cy=\"114\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"516\" cy=\"172\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ми аурулары кезіндегі ақуыз&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ақауы жаңа сақиналы РНК&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;түзілуін туындайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f1.jpg\" alt=\"1-сурет. TDP-43 жоғалуы криптикалық circRNA биогенезін тудырады. a, Дифференциацияның 14-күнінде i3Нейрондарда sgRNA көм\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. TDP-43 жоғалуы криптикалық circRNA биогенезін тудырады. a, Дифференциацияның 14-күнінде i3Нейрондарда sgRNA көмегімен TDP-43 нокдаунын көрсететін Вестерн-блот.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Амиотрофиялық латеральды склероз және маңдай-самал деменциясы кезінде TDP-43 ақуызы жасуша ядросынан жоғалады. Жаңа зерттеу бұл ақаудың нейрондарды әдеттен тыс тұйықталған РНК құрылымдарын жинауға мәжбүрлейтінін көрсетті. Мұндай молекулалар жоғары тұрақтылыққа ие және уақыт өте келе жиналады. Олар Альцгеймер ауруымен ауырған науқастардың ми тіндерінде де кездеседі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;TDP-43 тапшылығы нейрондарда арнайы криптикалық сақиналы РНК-лардың синтезін бастайды.&lt;/li&gt;\n&lt;li&gt;Жаңа молекулалар ұзын интрондардан түзіліп, жоғары тұрақтылықпен ерекшеленеді.&lt;/li&gt;\n&lt;li&gt;Мұндай сақиналы РНК-лар нейродегенерация кезінде науқастардың миында жиналады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;TDP-43 ақуызы РНК сплайсингін реттейді, бірақ нейродегенеративті аурулар кезінде ол нейрондардың ядросынан жоғалады. Авторлар circRNA (сақиналы РНК) тағдырын зерттеу үшін CRISPRi әдісімен TDP-43 деңгейі төмендетілген адам нейрондарын қолданды. Линейни молекулаларды алып тастап, РНК-секвенирлеу жүргізу арқылы ғалымдар circRNA құрамындағы жаппай өзгерістерді тіркеді. TDP-43 жетіспеген кезде ұзын интрондардың ішіндегі жасырын сайтар белсендіріліп, ерекше сақиналы құрылымдардың пайда болуына әкеледі.&lt;/p&gt;\n&lt;p&gt;Бұл жаңа жасырын сақиналы РНК-лар ыдырауға қарсы тұрақтылық танытып, жасушаларда біртіндеп жиналады. Амиотрофиялық латеральды склероз, маңдай-самал деменциясы және Альцгеймер науқастарының ми үлгілерін талдау осындай молекулалардың деңгейі жоғары екенін растады. Алынған нәтижелер TDP-43 қызметінің бұзылуы жүйке жүйесіндегі РНК алмасуына тікелей әсер ететінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу жасушалық модельдер мен қайтыс болған адамдардың ми тіндеріне негізделген, сондықтан тірі организмдегі нақты байланыстарды қосымша зерттеу қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;TDP-43 ақуызы бүйірлік амиотрофиялық склероз (БАС) пен маңдай-самай деменциясының (МСД) негізгі патологиялық маркері болып табылады және РНҚ сплайсингін реттеуде маңызды рөл атқарады. TDP-43 тапшылығының сызықтық транскрипттерге әсері жақсы зерттелгенімен, оның сақиналы РНҚ (circRNA) биогенезіне әсері әлі күнге дейін зерттелмеген болатын.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 тапшылығы ерекше криптикалық circRNA класының жаппай түзілуіне әкеледі, олар өздерінің жоғары тұрақтылығына байланысты нейрондарда жинақталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;Бұл жұмыста TDP-43 деңгейінің төмендеуі адам нейрондарындағы circRNA профилінде ауқымды өзгерістерді тудыратыны көрсетілген. Атап айтқанда, TDP-43 жоғалған кезде ғана пайда болатын криптикалық circRNA-лардың ерекше класы белсендіріледі. Бұл молекулалардың кейбірі интрондық тізбектерден алынған криптикалық экзондарды қамтитыны анықталды. Мұндай криптикалық circRNA-лардың басты ерекшелігі — олардың сәйкес сызықтық РНҚ изоформаларына қарағанда тұрақтылығы жоғары, бұл олардың нейрондарда біртіндеп жинақталуына әкеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Криптикалық экзондар — бұл қалыпты жағдайда интрон болып табылатын, бірақ сплайсинг механизмі бұзылғанда геннің кодтаушы бөлігі ретінде оқылатын РНҚ учаскелері.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, БАС, МСД және Альцгеймер ауруымен ауырған науқастардың қайтыс болғаннан кейінгі ми тіндерінде осы криптикалық circRNA деңгейінің жоғарылағаны анықталды. Бұл нәтижелер TDP-43-тің криптикалық circRNA түзілуін басудағы бұрын белгісіз болған рөлін ашады және бұл circRNA-ларды TDP-43 дисфункциясының тұрақты молекулалық маркерлері ретінде бекітеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу адам нейрондары мен қайтыс болғаннан кейінгі ми тіндеріне негізделген, сондықтан бұл РНҚ-лардың нейродегенерацияның дамуына тікелей әсерін анықтау үшін қосымша зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe1\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#kirispe1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"nejrodegeneraciya-kezindegi-ortakh-patologiyalykh-mehanizmder\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#nejrodegeneraciya-kezindegi-ortakh-patologiyalykh-mehanizmder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейродегенерация кезіндегі ортақ патологиялық механизмдер&lt;/span&gt;&lt;/a&gt;Нейродегенерация кезіндегі ортақ патологиялық механизмдер&lt;/h4&gt;\n&lt;p&gt;Амиотрофиялық бүйірлік склероз (АБС) және фронтотемпоральды деменция (ФТД) ортақ генетикалық және клиникалық белгілері бар нейродегенеративті аурулар болып табылады. Екі аурудың да айқындаушы белгісі — TDP-43 (TAR DNA-binding protein 43 kDa) ақуызының патологиясы, ол ядродағы ақуыздың азаюымен және нейрондар мен глия жасушаларының цитоплазмасында жинақталуымен сипатталады. TDP-43 патологиясы Альцгеймер, Паркинсон, Гентингтон аурулары, LATE және шашыраңқы склероз сияқты басқа да неврологиялық бұзылыстарда кездеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 функциясының жойылуы (LOF) РНҚ метаболизміндегі бұзылыстарды тудыратын негізгі фактор болып табылады, бұл әртүрлі нейродегенеративті жағдайларды біріктіретін ортақ молекулалық механизм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеулер көрсеткендей, TDP-43-тің ядролық деңгейінің төмендеуі цитоплазмалық агрегаттардың түзілуінен бұрын жүреді. Ядрода TDP-43 пре-мРНҚ сплайсингін реттейді, ал оның тапшылығы криптикалық экзондардың қосылуы, интрондардың сақталуы және экзондардың түсіп қалуы сияқты қателіктерге әкеледі. Сонымен қатар, TDP-43 альтернативті полиаденилденуді, мРНҚ тұрақтылығын және микроРНҚ мен ретротранспозондар сияқты кодталмайтын РНҚ-ларды реттейді. Осы процестердің бұзылуы нейрондардың жұмысының нашарлауына және дегенерацияға әкеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LOF (loss-of-function) — ақуыздың өзінің қалыпты биологиялық қызметін атқара алмауы, бұл жасушалық процестердің бұзылуына алып келеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tdp-43-ting-cirkulyarly-rnkh-biogenezindegi-roeli\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#tdp-43-ting-cirkulyarly-rnkh-biogenezindegi-roeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43-тің циркулярлы РНҚ биогенезіндегі рөлі&lt;/span&gt;&lt;/a&gt;TDP-43-тің циркулярлы РНҚ биогенезіндегі рөлі&lt;/h4&gt;\n&lt;p&gt;Циркулярлы РНҚ-лар (circРНҚ) — бұл кері сплайсинг арқылы түзілетін ковалентті тұйықталған молекулалар. Олар экзонуклеазалардың әсеріне төзімді және негізінен жүйке жүйесінде кездесіп, синаптикалық функциялар мен нейрондардың дамуына қатысады. Альцгеймер және Паркинсон ауруларында circРНҚ реттелуінің бұзылуы байқалады, бірақ оның молекулалық механизмдері әлі толық зерттелмеген.&lt;/p&gt;\n&lt;p&gt;CircРНҚ биогенезі сплайсингті реттейтін РНҚ-байланыстырушы ақуыздармен (RBP) тығыз байланысты. TDP-43 интрондармен белсенді байланысатындықтан, авторлар оның circРНҚ биогенезіне әсерін тексерді. Зерттеу барысында TDP-43-тің кері сплайсинг реттеушісі екені анықталды. TDP-43 жойылған кезде «криптикалық» circРНҚ-лардың жаңа класы түзіледі, олар нейродегенеративті ауруға шалдыққан адамдардың тіндерінде жоғары деңгейде болады. Бұл тұрақты молекулалар сызықтық транскрипттер ыдырағаннан кейін де сақталып, аурудың патогенезіне үлес қосуы және биомаркер ретінде қызмет етуі мүмкін.&lt;/p&gt;\n&lt;h3 id=\"naetizheler1\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#naetizheler1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"tdp-43-zhoghaluy-i3neurons-zhuejesinde-kriptikalykh-circrna-lardy-inducirlejdi\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#tdp-43-zhoghaluy-i3neurons-zhuejesinde-kriptikalykh-circrna-lardy-inducirlejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43 жоғалуы i3Neurons жүйесінде криптикалық circRNA-ларды индуцирлейді&lt;/span&gt;&lt;/a&gt;TDP-43 жоғалуы i3Neurons жүйесінде криптикалық circRNA-ларды индуцирлейді&lt;/h4&gt;\n&lt;p&gt;TDP-43 ақуызының тапшылығы нейрондардағы сақиналы РНК-лардың (circRNA) экспрессиясына қалай әсер ететінін анықтау үшін зерттеушілер CRISPRi жүйесі бар және TDP-43-ке бағытталған sgRNA экспрессиялайтын i3Neurons50 желісін дифференциациялады. Дифференциациядан кейін 14 күн өткен соң иммуноблоттинг көмегімен TDP-43 ақуызының деңгейі тиімді төмендегені расталды (1a-сурет). circRNA-ларды талдау үшін авторлар poly(A)+ мРНК-ларды алдын ала алып тастап, RNase R ферментімен өңдеп және рибосомалық рРНК-ны азайтып, РНК секвенирлеуін (RNA-seq) орындады (Әдістерді қараңыз). Параллель түрде кәдімгі сызықтық мРНК экспрессиясын бағалау үшін poly(A) емес фракцияға да RNA-seq жасалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;CRISPRi — бұл ДНК-ны кеспей-ак белгілі бір гендердің белсенділігін басу әдісі, ал RNase R — сызықтық РНК-ларды іріктеп бұзатын және сақиналы circRNA-ларды шоғырландыруға мүмкіндік беретін фермент.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RNA-seq талдауы TDP-43 азайғаннан кейін circRNA мөлшерінде ауқымды өзгерістер болғанын көрсетті (1b-сурет, S1-кесте). Бұл өзгерістер сәйкес келетін сызықтық транскрипттердің деңгейімен әлсіз байланыс көрсетті (S1a-сурет), бұл circRNA реттелуі ата-аналық гендердің транскрипциясына тәуелсіз жүретінін білдіреді. Бір геннен бірнеше circRNA изоформалары түзілуі мүмкін болғанымен, авторлар оларға салыстырмалы мөлшеріне қарай нөмірлер берді, ал мәтінде бастапқы ген аттары қолданылды (изоформа нөмірлері S1-кестеде көрсетілген). TDP-43 жоғалғаннан кейін circRNA-лардың төмендеуіне қарағанда олардың артуы (белсенуі) басым екені байқалды (1b, c-сурет). Бақылау нейрондарында дерлік анықталмайтын, бірақ TDP-43 тапшылығы кезінде de novo пайда болатын circRNA-лардың шағын тобы анықталды (1c-сурет, қызыл түспен белгіленген; S2-кесте).&lt;/p&gt;\n&lt;h4 id=\"transkriptomdykh-erekshelikterdi-taldau-zhaene-validaciya\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#transkriptomdykh-erekshelikterdi-taldau-zhaene-validaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транскриптомдық ерекшеліктерді талдау және валидация&lt;/span&gt;&lt;/a&gt;Транскриптомдық ерекшеліктерді талдау және валидация&lt;/h4&gt;\n&lt;p&gt;Белсендірілген circRNA-лардың транскриптомдық сипаттамаларын зерттей отырып, ғалымдар олардың түзілу механизмін тексерді және қосылу нүктелерін (back-splicing junctions) қамтитын праймерлер көмегімен кандидаттарды растады. Белсендірілген қосылу нүктелерінің көпшілігі канондік экзоннардың арасында орын алды (1d-сурет, S1-кесте). Олардың көбі бақылау нейрондарында болып, TDP-43 жоғалған кезде күрт өсті (мысалы, circSOX5.1, circZNF420, circTMEFF1, circRIMS1; S1b-сурет). Кейбіреулері тек TDP-43 нокдаун жасалған нейрондарға тән болды: мысалы, circDIP2C алты аннотацияланған экзоннан тұрады, ал 33-экзонның 28-экзонмен қосылуы тек TDP-43 азайғанда пайда болды (1e-сурет). Басқа расталған мысалдарға circUNC13A, circNCOR2, circDDAH1 және circCCNY жатады (S1b-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;TDP-43 жоғалуы жаңа сақиналы РНК-лардың (circRNA) ауқымды түрде пайда болуына әкеледі, олардың арасында de novo молекулалары және ұзын интрондардағы криптикалық экзондары бар гибридтік құрылымдар бар.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, біз экзон ішіндегі балама сплайсинг сайттарын пайдаланатын circRNA-ларды да анықтадық, мысалы, circZNF566 және circSELENOT (сәйкесінше 5 және 6-экзондар ішінде; 1f-сурет, S1c-сурет). Біз экзон-интрон шекараларын қамтитын немесе толығымен интрондық аймақтарда орын алатын жаңа қосылу нүктелерін анықтадық (1d-сурет, S2-кесте). Бұл құбылыстар TDP-43 тапшылығы кезінде интрондар ішіндегі криптикалық сплайсинг сайттарының активациясы нәтижесінде пайда болады және криптикалық экзонды (CE) қамтитын circRNA-ларды түзу үшін қолданылады. circADGRL3 құрамында төменгі ағындағы канондік экзонмен сақина түзетін CE бар (1g-сурет); сонымен қатар circPBX1, circFOXK1 және circZNF423 осындай гибридті circRNA-ларға мысал бола алады (S1d-сурет).&lt;/p&gt;\n&lt;p&gt;Сондай-ақ TDP-43 жоғалуы салдарынан белсендірілген интрондардан шыққан және тек криптикалық экзондардан тұратын circRNA-лар табылды. circGRM7 тек бір интрон ішіндегі үш көршілес аннотацияланбаған CE-ден түзіледі (1h-сурет), ал circDAPK1 2-интрондағы екі CE-ден тұрады (S1e-сурет). circUNC5D 1-интрондағы алты аннотацияланбаған CE кластерінен пайда болады (S1e-сурет). Маңыздысы, мұндай интрондық криптикалық circRNA-лар сол гендердегі басқа интрондарға қарағанда айтарлықтай ұзын интрондардан артық түрде түзілген (S1f-сурет). Бірнеше circRNA-лардың толық ұзындықтағы тізбектері плазмидаларға салынғаннан кейін Сэнгер секвенирлеуі арқылы расталды (S3-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Барлық тәжірибелер адам нейрондарының жасанды жасушалық моделі (i3Neurons50) көмегімен жүргізілді, сондықтан алынған заңдылықтарды адам тіндерінде қосымша тексеру қажет.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kriptikalykh-circrna-lardyng-ishki-zhiyntyghy-tdp-43-bajlanysuynyng-zhojyluyna-bajlanysty-aberrantty-syzykhtykh-splajsingpen-bajlanysty\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#kriptikalykh-circrna-lardyng-ishki-zhiyntyghy-tdp-43-bajlanysuynyng-zhojyluyna-bajlanysty-aberrantty-syzykhtykh-splajsingpen-bajlanysty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Криптикалық circRNA-лардың ішкі жиынтығы TDP-43 байланысуының жойылуына байланысты аберрантты сызықтық сплайсингпен байланысты&lt;/span&gt;&lt;/a&gt;Криптикалық circRNA-лардың ішкі жиынтығы TDP-43 байланысуының жойылуына байланысты аберрантты сызықтық сплайсингпен байланысты&lt;/h4&gt;\n&lt;p&gt;circRNA деңгейінің жоғарылауы мен TDP-43 арасындағы байланысты зерттеу үшін біз i3-нейрондарда ARTR-seq әдісін қолдандық. Бұл тәсіл RBP ақуыздарын иммунопреципитациялау мен in situ кері транскрипцияны біріктіреді, бұл ақуыздың РНҚ-мен байланысу орындарын карталауға мүмкіндік береді (Сурет SN 2a-b). Талдау TDP-43 негізінен интрондық аймақтардағы UG-бай мотивтермен байланысатынын растады, бұл белгілі деректерге сәйкес келеді (Сурет 2a, Сурет SN 2b). K562 жасушаларындағы eCLIP-seq деректерімен салыстыру әдістің ерекшелігін растады (Сурет SN 2c). Маңыздысы, TDP-43 деплециясы кезінде деңгейі жоғарылаған circRNA-лар back-splice түйісулерін қоршап тұрған интрондарда осы ақуыздың байланысуының артқанын көрсетті, бұл circPBX1, circUNC13A, circUNC5D.1 және circDIP2C үшін айқын көрінді (Сурет 2b, 2c).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f2.jpg\" alt=\"2-сурет. Жоғары реттелген circRNA-лар TDP-43 байланысуының байытылуымен байланысты және аберрантты сызықты сплайсингпен \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Жоғары реттелген circRNA-лар TDP-43 байланысуының байытылуымен байланысты және аберрантты сызықты сплайсингпен ұштасқан. a, TDP-43 ARTR-seq шыңдарының мотивтік талдауы геном бойынша каноникалық UG-ке бай RNA байланыстыратын мотивтің байытылғанын көрсетеді. b, Жоғары реттелген circRNA-лар (жасыл) және айтарлықтай өзгермеген (ns) circRNA-лардың (сұр) кері сплайсинг түйіндерін (±1 кб) қамтитын интрондық аймақтар бойынша TDP-43 байланысуының таралуы. Түс реңктері үш қайталаудың түйісу стандартты қателігін көрсетеді. c, circPBX1, circUNC13A, circUNC5D.1 және circDIP2C локустарында ARTR-seq көмегімен анықталған репрезентативті TDP-43 байланысу профильдері. circARID1A (кері сплайсинг түйіні: chr1:26729651-26732792), өзгермеген circRNA, теріс бақылау ретінде көрсетілген. Көлденең ось әр панельде орталықтандырылған, circRNA кері сплайсинг түйінін қамтитын ±1 кб геномдық тізбекті білдіреді. Кері сплайсингте қолданылатын 5′ және 3′ сплайсинг сайттары (ss) көрсетілген. Экзондар ашық көк түспен, интрондар қызғылт, ал CE-лер қызғылт түспен көрсетілген. Қою көк тректер қалыптастырылған TDP-43 ARTR-seq сигналын білдіреді. Қара көрсеткілер транскрипциялық бағдарды көрсетеді. d–g, NMD тежелуінен кейін TDP-43 сарқылуы туындатқан криптикалық circRNA биогенезі мен аберрантты сплайсинг оқиғалары арасындағы байланыстың репрезентативті мысалдары. d, CE қамтитын сызықтық транскрипттер және тиісті криптикалық circRNA-лар. e, Көршілес CE-лерден интрондық криптикалық circRNA түзілуі. f, Көршілес криптикалық сплайсинг сайттарының активациясымен ұштасқан экзондық circRNA-лар. g, Баламалы 5′ сплайсинг сайтын пайдаланумен байланысты circRNA түзілуі. Репрезентативті оқиғалар RT–qPCR (d, e, f) немесе RT–PCR (g) көмегімен расталды. Дөңгелек доғалар кері сплайсинг оқиғаларын білдірсе, бұрыштық доғалар сызықтық сплайсинг оқиғаларын білдіреді. Көк доғалар каноникалық сплайсинг түйіндерін, қызғылт сары доғалар TDP-43 сарқылуы туындатқан аберрантты сплайсинг түйіндерін, ал қызыл доғалар криптикалық circRNA-мен байланысты түйіндерді білдіреді. Екі түсті көк-қызыл доғалар каноникалық және циркулярлық транскрипттер арасындағы ортақ сплайсинг түйіндерін көрсетеді. Тұтас доғалар эксперименталды түрде расталған немесе каноникалық сплайсинг түйіндерін білдіреді, ал үзіл сызықты доғалар болжанған сплайсинг түйіндерін көрсетеді. Көрсеткілер RT–PCR немесе RT–qPCR талдаулары үшін қолданылатын праймер орындарын көрсетеді. Деректер үш биологиялық қайталаудың орташа мәні ± SEM түрінде көрсетілген. Статистикалық маңыздылық екі жақты жұптаспаған t-тесттер арқылы анықталды.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 деплециясы кезінде circRNA деңгейінің жоғарылауы көршілес интрондарда ақуыз байланысуының жойылуымен байланысты, бұл TDP-43-тің осы орындарды басудағы реттеуші рөлін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ARTR-seq — кері транскрипция процесінде биотинмен белгіленген нуклеотидтерді тікелей енгізу арқылы белгілі бір ақуызбен байланысқан РНҚ-ны карталау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;circRNA мен аберрантты сплайсинг арасындағы байланысты зерттеу NMD (nonsense-mediated decay) тежелуі жағдайында жүзеге асырылды. 569 upregulated circRNA-ның 97-сі аберрантты сплайсинг оқиғаларымен (экзондарды өткізіп жіберу, криптикалық экзондарды (CE) қосу) байланысты болды. CE-ді қамтитын circPBX1, circADGRL3 және circFOXK1 үшін RT-qPCR TDP-43 жойылуы сызықтық РНҚ-ға CE қосылуының көбеюіне әкелетінін көрсетті, бұл NMD тежелуімен одан әрі күшейеді (Сурет 2d). Бұл CE бар сызықтық РНҚ-лардың NMD арқылы тез деградацияға ұшырайтынын растайды. Керісінше, тиісті circRNA-лар тұрақты болды және NMD-ге тәуелді емес еді, бұл олардың осы бақылау механизміне төзімділігін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу i3-нейрондарда жүргізілді; сызықтық және сақиналы РНҚ-лардың NMD-ге тәуелділігі басқа жасуша түрлерінде өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Интрондық CE-ді қамтитын circGRM7 жағдайларында сызықтық өнімдер өте сирек кездеседі және NMD тежелуімен тұрақтанбайды, бұл сызықтық изоформалардың деградациясынан гөрі, circRNA түзілуі үшін криптикалық орындарды басым пайдалануды білдіреді. Сондай-ақ, circUNC13A және circNCOR2 сияқты CE-дің өзін қоспастан circRNA белсендірілген жағдайлар да анықталды (Сурет 2f). Мұнда TDP-43 сызықтық РНҚ-лардағы криптикалық орындарды пайдалануды да, back-splicing-ті де басады. CE бар сызықтық РНҚ-лар NMD-деградациясына ұшыраса да, тиісті circRNA-лар жоғары экспрессия деңгейін сақтайды, бұл TDP-43 ақуызы тарапынан осы процестердің үйлестірілген реттелуін дәлелдейді.&lt;/p&gt;\n&lt;p&gt;Біз TDP-43 тапшылығы басқа да аберрантты сплайсинг түрлеріне қалай әсер ететінін зерттедік. SOX5 транскриптінде TDP-43 деңгейінің төмендеуі 8-экзон ішіндегі баламалы 5′-сплайсинг сайтының қолданылуына әкелді, бұл circSOX5.2 бэк-сплайсинг түйініне жақын орналасқан және 8-экзонның қысқаруына себеп болды (2g-сурет). RT-PCR талдауы TDP-43 нокдаунынан кейін толық ұзындықтағы 8-экзонның азайғанын және қысқарған нұсқасының көбейгенін растады. CE (крипттік экзондар) бар сызықтық транскрипттерден айырмашылығы, бұл баламалы изоформа NMD ингибициясы кезінде айтарлықтай өзгермеді (2g-сурет). circSOX5.2 деңгейі де TDP-43 азаюымен бірге өсті және NMD ингибициясына тәуелсіз болып қалды, бұл сплайсинг сайтын таңдау мен circRNA биогенезі арасындағы механикалық байланысты растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 функциясының жойылуы сызықтық және сақиналы сплайсингтегі өзгерістерге әкеледі, мұнда крипттік circRNA-лар деградациядан аман қалып, біртіндеп жинақталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл нәтижелер TDP-43 сплайсинг сайтын таңдауда маңызды рөл атқаратынын және әртүрлі РНҚ изоформаларын үйлестірілген түрде реттейтінін көрсетеді. Крипттік сплайсинг сайттарының белсендірілуі сызықтық және сақиналы аберрантты РНҚ өнімдерін түзеді, бірақ олардың тағдыры әртүрлі: сызықтық транскрипттер NMD арқылы ыдырайды, ал circRNA-лар сақталып қалады және TDP-43 дисфункциясының тұрақты молекулалық көрсеткіші ретінде қызмет етеді.&lt;/p&gt;\n&lt;h4 id=\"kripttik-circrna-lar-zhoghary-turakhtylykhkha-ie-zhaene-nejrondarda-birtindep-zhinakhtalady\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#kripttik-circrna-lar-zhoghary-turakhtylykhkha-ie-zhaene-nejrondarda-birtindep-zhinakhtalady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Крипттік circRNA-лар жоғары тұрақтылыққа ие және нейрондарда біртіндеп жинақталады&lt;/span&gt;&lt;/a&gt;Крипттік circRNA-лар жоғары тұрақтылыққа ие және нейрондарда біртіндеп жинақталады&lt;/h4&gt;\n&lt;p&gt;circRNA-лардың экзонуклеаздық деградацияға төзімділігін ескере отырып, біз олардың тұрақтылығын сызықтық транскрипттермен салыстырдық. Актиномицин D көмегімен транскрипцияны тоқтатқанда, сызықтық мРНҚ-лар біртіндеп азайды, ал circRNA-лар іс жүзінде ыдырамады (3a-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Актиномицин D — РНҚ синтезін тоқтататын зат, ол РНҚ-ның жартылай ыдырау мерзімін анықтау үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нейрондардың дифференциациясы барысында circADGRL3 және circUNC13A деңгейлері TDP-43 нокдауны кезінде уақыт өте келе артты, ал мРНҚ-лар өзгеріссіз қалды (3b-сурет, SN 3a-сурет). Жасушалық фракциялау талдауы (SN 3b-сурет) circRNA-лардың негізінен цитоплазмада орналасқанын және көбінесе өздерінің мРНҚ-ларына қарағанда күштірек цитоплазмалық байытуды көрсететінін анықтады (3c-сурет).&lt;/p&gt;\n&lt;h4 id=\"tdp-43-akhuyz-patopatiyasy-bar-adam-miynyng-postmortem-tinderinde-kriptikalykh-circrna-denggeji-zhogharylaghan\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#tdp-43-akhuyz-patopatiyasy-bar-adam-miynyng-postmortem-tinderinde-kriptikalykh-circrna-denggeji-zhogharylaghan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43 ақуыз патопатиясы бар адам миының postmortem тіндерінде криптикалық circRNA деңгейі жоғарылаған&lt;/span&gt;&lt;/a&gt;TDP-43 ақуыз патопатиясы бар адам миының postmortem тіндерінде криптикалық circRNA деңгейі жоғарылаған&lt;/h4&gt;\n&lt;p&gt;Адам ауруларында TDP-43 реттейтін circRNA өзгерістерін анықтау үшін авторлар БАС/ФДТ бар пациенттер мен неврологиялық сау бақылау топтарының уақытша қыртысынан алынған postmortem үлгілеріндегі кандидат circRNA деңгейін өлшеді. Зерттеуге C9ORF72-БАС/ФДТ және спорадикалық ФДТ жағдайлары да кірді.&lt;/p&gt;\n&lt;p&gt;Кандидат криптикалық circRNA талдауы RT-qPCR әдісі арқылы айтарлықтай жоғарылағанын көрсетті, мұнда circADGRL3 пен circUNC13A бақылау тобымен салыстырғанда C9ORF72 БАС/ФДТ және спорадикалық ФДТ жағдайларында да ең күшті өсімді көрсетті (4a-сурет). Керісінше, сәйкес иелік мРНК тек қана шамалы өзгерістерге ұшырады немесе мүлдем өзгерген жоқ (S4a-сурет), бұл circRNA өсуі иелік гендердің транскрипциясының өзгеруіне байланысты емес екенін білдіреді. Айта кету керек, circRNA индукциясының ауқымы белгілі сызықты CE қамтитын транскрипттердің, соның ішінде UNC13A, CAMK2B, STMN2 және HDGFL2 деңгейімен шамалас болды немесе кейбір жағдайларда олардан асып түсті (4b-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Криптикалық circRNA (circADGRL3 пен circUNC13A) БАС/ФДТ кезінде күрт артып, өзгеріс деңгейі бойынша көптеген белгілі сызықты транскрипттерден асып түседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TDP-43 протеопатиясы Альцгеймер ауруында (АА) да кездесетіндіктен, зерттеушілер мақсатты circRNA мен олардың иелік мРНК экспрессиясын АА пациенттерінің миының сол аймағында зерттеді. АА тіндерінде circRNA өзінің сызықты иелік транскрипттеріне қарағанда әлдеқайда айқын өзгерістер көрсетті (4c-сурет, S4b-сурет) және БАС/ФДТ-да байқалғаннан өзгеше экспрессия үлгілерін көрсетті (4a, c-сурет). Егер circADGRL3 пен circUNC13A БАС/ФДТ кезінде күшті жоғарыласа (4a-сурет), АА үлгілерінде олар дерлік анықталмады (4c-сурет). Керісінше, circZNF566, circDIP2C және circNCOR2 АА үлгілерінде көбірек көтерілсе, БАС пен ФДТ-да әлсіз өзгерді немесе өзгеріс көрсетпеді (4a, c-сурет). Сызықты CE де ауруға тән әртүрлі үлгілерді көрсетті; мысалы, UNC13A CE БАС/ФДТ кезінде ең жоғары өсім көрсетсе, АА-да анықталмады, ал CAMK2B CE АА-да БАС/ФДТ-ға қарағанда көбірек көтерілді (4b, d-сурет). Бұл нәтижелер TDP-43 дисфункциясынан кейінгі сплайсинг бұзылыстары нейродегенеративті ауруларда ауруға тән ерекше үлгілерге ие екенін білдіреді, дегенмен бұл бақылауларды растау үшін көбірек үлгілерді талдау қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BaseScope in situ әдісі тін кесінділерінде жеке жасушалар деңгейінде РНК молекулаларын визуализациялауға және сандық бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар circADGRL3 пен circZNF566 back-splice түйісулеріне бағытталған зондтары бар BaseScope in situ гибридизациясын қолдана отырып, адам миы тініндегі криптикалық circRNA жоғарылауын қосымша растады. Бақылау үлгілерінде сигналдар дерлік байқалмады, керісінше БАС/ФДТ миында анық BaseScope сигналдары байқалды (4e-сурет, көрсеткілер). Сандық талдау ауру үлгілеріндегі екі мақсатты circRNA үшін нүктелер (puncta) санының бақылаумен салыстырғанда айтарлықтай өскенін көрсетті (4e-сурет), бұл БАС/ФДТ кезінде криптикалық circRNA сенімді түрде жоғарылайтынын тағы да растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу адамның postmortem тіндерінде орындалған, бұл патологияның соңғы сатыларын ғана көрсетеді және себеп-салдарлық байланыстарды бағалауда сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қорытындылай келе, бұл нәтижелер TDP-43 ақуыз патопатиясы бар адам миының postmortem тіндерінде криптикалық circRNA жоғарылайтынын және ауруға тән, кейбір жағдайларда ауру үшін селективті экспрессия үлгілерін көрсететінін дәлелдейді.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"tdp-43-akhuyzy-arkhyly-sakhinaly-rnk-tueziluin-retteu\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#tdp-43-akhuyzy-arkhyly-sakhinaly-rnk-tueziluin-retteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TDP-43 ақуызы арқылы сақиналы РНК түзілуін реттеу&lt;/span&gt;&lt;/a&gt;TDP-43 ақуызы арқылы сақиналы РНК түзілуін реттеу&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеуде біз TDP-43 ақуызының кері сплайсингті (back-splicing) бақылаудағы жаңа қызметін анықтадық және TDP-43 байланысуының жоғалуы криптикалық circRNA (cryptic circRNAs) деп аталатын ерекше сақиналы РНК класының пайда болуымен байланысты екенін көрсеттік. TDP-43 кәдімгі сызықтық сплайсингті реттеуші ретінде жақсы белгілі болғанымен, біздің нәтижелеріміз бұл ақуыздың сақиналы РНК биогенезін де шектейтінін дәлелдеп, осы тұжырымдаманы кеңейте түседі (5-сурет). Осылайша, бұл TDP-43 протеинопатиясын тұрақты, кодталмайтын РНК түрлерінің синтезімен байланыстырады.&lt;/p&gt;\n&lt;p&gt;Қалыпты жағдайда TDP-43 криптикалық сплайсинг сайттарының жанына орналасып, криптикалық экзондардың (CE) қосылуын тежейді. TDP-43 жоғалған кезде бұл аймақтар аберрантты сплайсинг сайттарын таңдауға мүмкіндік береді, бұл CE-дің сызықтық мРНК құрамына енуіне әкеледі. Осындай белсендірілген сплайсинг сайттарының бір бөлігі кері сплайсингке ұшырап, CE-дің сақиналы РНК құрамына кіруіне әкеледі. Кейбір криптикалық circRNA құрамында криптикалық және канондық экзондар да болады, ал басқалары толығымен интрондық криптикалық тізбектерден тұрады. Жоғарылатылған circRNA-лардың басым бөлігі тек канондық экзондардан тұрады. Бұл сақиналы РНК-лардың кейбіреулері сәйкес сызықтық транскрипттердің байқалатын өзгерістеріне тәуелсіз түзілсе, басқалары көршілес альтернативті сплайсинг оқиғаларымен байланысты. Олардың кейбіреулері базалық деңгейде анықталып, TDP-43 тапшылығы кезінде тағы да артады, ал басқалары TDP-43 жоғалғаннан кейін de novo пайда болады. Жалпы алғанда, бұл бақылаулар TDP-43 криптикалық және канондық экзондарда да сақиналы РНК биогенезін басатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кері сплайсинг (back-splicing) — 3'-ұшындағы сплайсинг сайты сол немесе жоғарыдағы экзонның 5'-ұшындағы акцепторлық сайтпен «кері» бағытта қосылып, сақиналы РНК түзетін процесс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;circRNA күшеюін және сақиналы мен сызықтық криптикалық сплайсинг арасындағы таңдауды реттейтін факторлар әзірге түсініксіз күйінде қалып отыр. Сплайсинг сайтының күші, интрондық архитектура, РНК екінші реттік құрылымы, транскрипция кинетикасы және қосымша РНК байланыстыратын ақуыздар сияқты ерекшеліктер бұған әсер етуі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"kriptikalykh-circrna-lardyng-molekulalykh-turakhtylyghy-zhaene-olardyng-biomarkerlik-aeleueti\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#kriptikalykh-circrna-lardyng-molekulalykh-turakhtylyghy-zhaene-olardyng-biomarkerlik-aeleueti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Криптикалық circRNA-лардың молекулалық тұрақтылығы және олардың биомаркерлік әлеуеті&lt;/span&gt;&lt;/a&gt;Криптикалық circRNA-лардың молекулалық тұрақтылығы және олардың биомаркерлік әлеуеті&lt;/h4&gt;\n&lt;p&gt;Биогенезінен басқа, криптикалық circRNA-лардың сақталып қалуына ықпал ететін молекулалық қасиеттері бар. CE бар РНК изоформалары үшін сызықтық транскрипттер көбінесе NMD және туысқан РНК сапасын бақылау жолдары арқылы ыдыратылып, олардың жиналуын шектейді, ал криптикалық circRNA-лар әдетте NMD арқылы ыдырауға ұшырамайды. circRNA-лардың экзонуклеолиттік ыдырауға төзімділігімен бірге бұл қасиеттер криптикалық circRNA-лардың сақталып қалуына және сплайсинг бұзылуының тұрақты молекулалық көрсеткіштері ретінде жиналуына мүмкіндік береді. Сонымен қатар, circRNA-лардың экзосомаларды қоса алғанда, жасушадан тыс везикулаларға артықшылықпен оралатыны көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TDP-43 ақуызы қызметінің жоғалуы NMD жүйесімен ыдырамайтын және жасушалар мен везикулаларда патологияның сенімді маркерлері ретінде жинала алатын тұрақты криптикалық сақиналы РНК-лардың түзілуін белсендіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Криптикалық circRNA-лардың адамның қайтыс болғаннан кейінгі ми тіндерінде анықталуы олардың TDP-43 протеинопатиясымен байланысты нейродегенеративті ауруларға қатыстылығын растайды. Біз ауруға тән экспрессия үлгілерін байқадық, мұнда circADGRL3 және circUNC13A ALS пен FTD-де көбірек жоғарыласа, circZNF566, circDIP2C және circNCOR2 Альцгеймер ауруында айқынырақ өсуді көрсетті. Бұл айырмашылықтар аурулар арасындағы TDP-43 патологиясының таралу, уақыт немесе кофакторлар гетерогендігін көрсетуі мүмкін және әртүрлі криптикалық circRNA-лар TDP-43 дисфункциясының әртүрлі көріністерін қамти алатынын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мәліметтер адамның қайтыс болғаннан кейінгі тіндерін талдауға негізделген, сондықтан circRNA-ларды диагностика және болжам үшін қолжетімді биомаркерлер ретінде анықтау үшін биологиялық сұйықтық үлгілеріне кең ауқымды зерттеулер қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жиынтықта бұл нәтижелер TDP-43-ке тәуелді РНК реттеу аясын кері сплайсингке дейін кеңейтеді және криптикалық circRNA-ларды адамның нейродегенерациясындағы TDP-43 қызметінің жоғалуының тұрақты молекулалық салдары ретінде анықтайды.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"plazmidalar\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#plazmidalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Плазмидалар&lt;/span&gt;&lt;/a&gt;Плазмидалар&lt;/h4&gt;\n&lt;p&gt;Бағыттаушы РНҚ-ларды (sgRNA) pU6-sgRNA EF1α-puro-T2A-BFP векторына клондау арқылы алды. Келесі тізбектер қолданылды: бақылау (нысаналы емес) — GGACTAAGCGCAAGCACCTA және TDP-43 үшін — GGCCCGCGCGTGCCAGCCGA.&lt;/p&gt;\n&lt;p&gt;Сақиналы РНҚ-ларды (circRNA) валидациялау үшін дивергентті праймерлер (SN4-кесте) және 32 циклді ПТР көмегімен cDNA амплификацияланды. ПТР өнімдері 2,5% агарозды гельде бөлініп, қажетті өлшемдегі жолақтар тазартылды. Фрагменттер Zero Blunt TOPO PCR Cloning Kit жинағымен плазмидаларға клондалып, Сэнгер әдісімен секвенирленді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сэнгер секвенирлеуі — ДНҚ-ның нуклеотидтік тізбегін дәл анықтауға мүмкіндік беретін «алтын стандарт» әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhasusha-dakhyldary-zhaene-transfekciya\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#zhasusha-dakhyldary-zhaene-transfekciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасуша дақылдары және трансфекция&lt;/span&gt;&lt;/a&gt;Жасуша дақылдары және трансфекция&lt;/h4&gt;\n&lt;p&gt;HEK293T жасушалары 10% FBS, 100 ЕБ/мл пенициллин және 100 мкг/мл стрептомицин қосылған DMEM ортасында 37°C және 5% CO₂ жағдайында өсірілді. Жасушалар sgRNA конструкцияларын лентивирустық қаптау үшін қолданылды.&lt;/p&gt;\n&lt;h4 id=\"adamnyng-ipsk-zhaene-ipsk-dan-alynghan-nejrondar\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#adamnyng-ipsk-zhaene-ipsk-dan-alynghan-nejrondar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адамның иПСК және иПСК-дан алынған нейрондар&lt;/span&gt;&lt;/a&gt;Адамның иПСК және иПСК-дан алынған нейрондар&lt;/h4&gt;\n&lt;p&gt;иПСК-ны нейрондарға (i3Neurons) дифференциациялау dCas9 және доксициклинмен индукцияланатын mNGN2 экспрессиясы арқылы жүргізілді. Жасушалар Matrigel жабыны бар планшеттерде Essential 8 ортасында ұсталды. Дифференциация N2 ортасында 3 күн бойы доксициклинмен басталып, кейін жасушалар поли-L-орнитин жабыны бар планшеттерге BrainPhys ортасына (B27, NT-3, BDNF, ламинин және доксициклинмен) ауыстырылды. Нейрондар 14-күні жиналды.&lt;/p&gt;\n&lt;p&gt;ARTR-seq тәжірибелері үшін PiggyBac-TO-hNGN2 желісі қолданылды. Трансфекция мен пуромицинмен селекциядан кейін пролиферацияланатын жасушаларды жою үшін 5-фтор-2'-дезоксиуридин және уридин қосылды. BrainPhys ортасына GDNF (1 мкг/мл) қосылып, 14-күні жиналды.&lt;/p&gt;\n&lt;h4 id=\"nejrondardy-oengdeu-zhaene-taldau\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#nejrondardy-oengdeu-zhaene-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейрондарды өңдеу және талдау&lt;/span&gt;&lt;/a&gt;Нейрондарды өңдеу және талдау&lt;/h4&gt;\n&lt;p&gt;NMD-ны тежеу үшін нейрондар 24 сағат бойы 0,5 мкМ hSMG1 тежегішімен өңделді (бақылау — DMSO). Цитоплазмалық және ядролық фракцияларды бөлу үшін NP-40 лизистік буфері қолданылды. 3000 айн/мин (4°C, 7 мин) жылдамдықта центрифугалаудан кейін супернатант цитоплазмалық фракция ретінде алынды, ал ядролық тұнба РНҚ бөліп алғанға дейін EDTA буферімен үш рет жуылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NMD (nonsense-mediated mRNA decay) — жасушадағы қате мРНҚ молекулаларын анықтап, жоятын сапаны бақылау механизмі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"adam-miynyng-tinderi\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#adam-miynyng-tinderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адам миының тіндері&lt;/span&gt;&lt;/a&gt;Адам миының тіндері&lt;/h4&gt;\n&lt;p&gt;Мұздатылған және фиксацияланған (FFPE) ми тіндері Johns Hopkins Brain Resource Center-ден алынды. Мұздатылған үлгілер (50 мг) протеаза және фосфатаза тежегіштері бар буферде гомогенизацияланып, РНҚ бөліп алу үшін қолданылды.&lt;/p&gt;\n&lt;h4 id=\"rnkh-ekstrakciyasy,-rt-pcr-zhaene-rt-qpcr\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#rnkh-ekstrakciyasy,-rt-pcr-zhaene-rt-qpcr\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНҚ экстракциясы, RT-PCR және RT-qPCR&lt;/span&gt;&lt;/a&gt;РНҚ экстракциясы, RT-PCR және RT-qPCR&lt;/h4&gt;\n&lt;p&gt;Жалпы РНК өсірілген жасушалардан және адамның постмортальды тіндерінен өндірушінің нұсқауы бойынша TRIzol Reagent реагенті көмегімен бөлініп алынды. Комплементарлы ДНК (кДНК) HiScript III RT SuperMix for qPCR жиынтығы арқылы синтезделді. РНК-ның жартылай ыдырау кезеңін, субжасушалық фракциялауды және РНК жиналуын зерттеу тәжірибелері үшін кері транскрипция алдында әрбір қалыпқа келтірілген РНК үлgiciне бірдей мөлшерде сыртқы бақылау үшін CLuc RNA spike-in қосылды. Жартылай мөлшерлі ПСР сплайсинг өзгерістерін бағалау үшін 30–33 амплификация циклдарымен 2× Rapid Taq Master Mix көмегімен жүргізілді.&lt;/p&gt;\n&lt;p&gt;ПСР өнімдері 2,5% агарозды гельдерде бөлініп, ChemiDoc Imaging System көмегімен суретке түсірілді, ал жолақтардың салыстырмалы қарқындылығы Image Lab бағдарламасы көмегімен фондық сигналды азайту арқылы есептелді. Экзонның қосылу пайызы (PSI) ұзын және қысқа изоформалы ПСР өнімдерінің салыстырмалы қарқындылығы негізінде PSI = long / (long + short) формуласы бойынша анықталды. Мөлшерлік ПСР (qPCR) әрбір кДНК үлгісі үшін техникалық дубликаттарда Taq Pro Universal SYBR qPCR Master Mix көмегімен QuantStudio 6 және QuantStudio 3 Flex Real-Time PCR Systems құрылғыларында орындалды.&lt;/p&gt;\n&lt;p&gt;Салыстырмалы экспрессия деңгейлері ΔΔCt әдісімен есептелді. CLuc spike-in жартылай ыдырау, фракциялау және жиналу тәжірибелерінде, GAPDH — NMD тежеу тәжірибелерінде, ал HPRT1 — қалған барлық qPCR талдаулары үшін референстік ген ретінде пайдаланылды. Анықталмаған Ct мәндері үшін статистикалық талдау және визуализация мақсатында 40 мәні берілді. Праймерлердің тізбектері Таблица S4 кестесінде көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нақты уақыттағы мөлшерлік ПСР (qPCR) арнайы флуоресцентті бояғыштардың көмегімен РНК молекулаларының нақты мөлшерін дәл өлшеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rnkh-nyng-zhartylaj-ydyrau-periodyn-oelsheu\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#rnkh-nyng-zhartylaj-ydyrau-periodyn-oelsheu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;РНҚ-ның жартылай ыдырау периодын өлшеу&lt;/span&gt;&lt;/a&gt;РНҚ-ның жартылай ыдырау периодын өлшеу&lt;/h4&gt;\n&lt;p&gt;Нейрондар (i3Neurons) 3 µg/mL концентрациясындағы actinomycin D препаратымен өңделді және 14-күні 0, 4, 8, 12 және 24 сағаттарда жиналды. Жалпы РНК әрбір уақыт нүктесінде бөлініп алынып, жоғарыда сипатталғандай RT-qPCR көмегімен талданды. РНК-ның салыстырмалы мөлшері әрбір транскрипт үшін нөлдік уақыт нүктесіне қатысты қалыпқа келтірілді. Транскрипттердің жартылай ыдырау кезеңдері GraphPad Prism бағдарламасында бір фазалы экспоненциалды ыдырау моделі арқылы сызықтық емес регрессия көмегімен бағаланды.&lt;/p&gt;\n&lt;p&gt;Сызықтық мРНК үшін жартылай ыдырау кезеңдері сәтті есептелді, ал сақиналы РНК (circRNAs) үшін мөлшері 24 сағаттық бақылау кезеңінде өзгеріссіз қалды және модельге сәйкес келмеді, сондықтан олардың жартылай ыдырау кезеңі 24 сағаттан асады деп бағаланды.&lt;/p&gt;\n&lt;p&gt;circRNA-мен байланысты RNA-seq кітапханасын дайындау&lt;/p&gt;\n&lt;p&gt;Әрбір үлгі үшін i3Neurons жасушаларынан бөлініп алынған 5 µg жалпы РНК circРНК-мен байытылған кітапхананы дайындау үшін пайдаланылды. Алдымен poly(A)+ мРНК NEBNext Poly(A) mRNA Magnetic Isolation Module көмегімен бөлініп алынды. Poly(A)(-) фракциясы oligo(dT)₂₅ моншақтарынан ағын ретінде жиналып, Quick-RNA Microprep Kit арқылы тазартылды. Тазартылған poly(A)(-) РНК 37 °C температурада 20 минут бойы 5 бірлік RNase R ферментімен өңделді.&lt;/p&gt;\n&lt;p&gt;Ферментативті ыдыраудан кейін РНК TRIzol реагентімен қалпына келтіріліп, Qubit флуориметрімен өлшенді. Кейінгі қадамдар үшін 500 нг алынған poly(A)(-)/RNase R(+) РНК Ribo-off rRNA Depletion Kit көмегімен рибосомалық РНК-дан тазартылды. Алынған circРНК-мен байытылған РНК дереу VAHTS Universal V10 RNA-seq Library Prep Kit for Illumina жиынтығы арқылы RNA-seq кітапханасын дайындауға қолданылды. Сонымен қатар, сәйкес poly(A)+ мРНК фракциясының 50 нг бөлігі де сол жиынтық арқылы кітапхана құру үшін өңделді. Әрбір топ үшін 3 тәуелсіз биологиялық қайталау үлгілері дайындалды. Кітапханалар Illumina NovaSeq X Plus платформасында 150 жұп негіздік оқылымдарды жасау үшін секвенирленді.&lt;/p&gt;\n&lt;h4 id=\"rna-seq-taldauy-gennomiyalykh-anykhtama\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#rna-seq-taldauy-gennomiyalykh-anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RNA-seq талдауы Генномиялық анықтама&lt;/span&gt;&lt;/a&gt;RNA-seq талдауы Генномиялық анықтама&lt;/h4&gt;\n&lt;p&gt;Барлық талдаулар үшін адамның референстік геномы ретінде GRCh38.p14 (Ensembl release 112) және GENCODE v32 ген аннотациясы пайдаланылды. Рибосомалық РНК (рРНК), соның ішінде 28S, 18S, 5.8S және 5S рРНК тізбектері NCBI дерекқорынан жүктеп алынды.&lt;/p&gt;\n&lt;h4 id=\"gen-ekspressiyasyn-taldau\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#gen-ekspressiyasyn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ген экспрессиясын талдау&lt;/span&gt;&lt;/a&gt;Ген экспрессиясын талдау&lt;/h4&gt;\n&lt;p&gt;Poly(A) кітапханасының шикі оқылымдары Cutadapt 5.06 нұсқасы арқылы кесіліп, Phred Score ≥ 33 сапа критерийі бойынша сүзілді. Өңделген оқылымдар HISAT2 2.2.1 нұсқасы көмегімен картаға түсіріліп, Picard MarkDuplicates 3.3.0 көмегімен дубликаттардан тазартылды және FeatureCounts 2.0.8 көмегімен мөлшері есептелді. Жоғары деңгейде экспрессияланатын гендер (барлық үлгілерде ≥ 10 оқылым) дифференциалды экспрессияны талдау үшін пайдаланылды. Сүзілген оқылымдар DESeq2 (1.46.0 нұсқасы) көмегімен өлшем факторын қалыпқа келтіру арқылы өңделді.&lt;/p&gt;\n&lt;p&gt;Дифференциалды экспрессияны талдау Log2FoldChange және p-adjusted мәндері арқылы жүргізілді (/LFC/ ≥ 1, p-adjusted &amp;lt; 0.05). Картаға түсірілген оқылымдар deepTools bamCoverage 3.5.6 бағдарламасы арқылы визуализацияланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Биоинформатикалық талдауда оқылымдар сапасы бақыланып, геномға сәйкестендірілген соң, DESeq2 сияқты статистикалық пакеттер топтар арасындағы ген экспрессиясының айырмашылықтарын анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;circRNA-ны анықтау және талдау&lt;/p&gt;\n&lt;p&gt;Poly(A)(–)/RNase R(+)/rRNA(–) кітапханаларының шикі оқылымдары Cutadapt (v5.063) көмегімен кесіліп, сапасы бойынша (Phred Score ≥33) сүзгіден өткізілді. Back-splicing түйісулері (BSJ) CIRI2 алгоритмі арқылы әдепкі параметрлермен анықталды. Дифференциалды экспрессияны талдау үшін үлгілердің кемінде 50%-ында BSJ ≥5 болатын жоғары сенімді circRNA-лар пайдаланылды. Сүзгіден өткен BSJ көрсеткіштері DESeq2 (v1.46.0) көмегімен өлшем факторы (size factor) бойынша қалыпқа келтірілді. Дифференциалды экспрессия үшін /LFC/ ≥0.5 және p &amp;lt; 0.05 шекті мәндері қолданылды. circRNA ішіндегі сызықтық криптикалық түйісулер LeafCutter (v0.2.9) көмегімен bam-файлдардан анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CIRI2 — бұл circRNA-ларға тән «кері» сплайсинг орындарын анықтауға арналған биоинформатикалық құрал, ол экзондардың қалыптан тыс қосылуын идентификациялауға негізделген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"alternativti-splajsingti-taldau\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#alternativti-splajsingti-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Альтернативті сплайсингті талдау&lt;/span&gt;&lt;/a&gt;Альтернативті сплайсингті талдау&lt;/h4&gt;\n&lt;p&gt;NMD (nonsense-mediated decay) тежелуімен немесе онсыз sgCON және sgTARDBP i3Neurons жасушаларынан алынған RNA-seq деректері пайдаланылды. Альтернативті сплайсинг оқиғалары rMATS (v4.3.0) көмегімен --novelSS, --variable-read-length, --individual-counts және -t paired параметрлерімен анықталды. Түйісу қамтылуы ≥10, /ΔPSI/ ≥ 0.1 және FDR &amp;lt; 0.05 болатын оқиғалар сақталды. PSI мәндері бақылау шарттары (max_PSI_control) және TDP-43 тапшылығы мен NMD тежелуі (max_PSI_TDP_NMD) үшін максималды көрсеткіштер ретінде анықталды.&lt;/p&gt;\n&lt;p&gt;Дифференциалды сплайсинг dPSI_TDPvsCTRL ретінде есептелді және оқиғалар /ΔPSI/ &amp;gt; 0.1 бойынша жіктелді. sgTDP тобында жоқ оқиғалар “NMD” деп белгіленді. Оқиғалар BED форматына ауыстырылып, BEDTools көмегімен circRNA back-splice түйісулерімен қиылыстырылды. Дәлдікті арттыру үшін сплайсинг шекараларының дәл сәйкес келуі талап етілді.&lt;/p&gt;\n&lt;h4 id=\"artr-seq-kitaphanasyn-dajyndau\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#artr-seq-kitaphanasyn-dajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ARTR-seq кітапханасын дайындау&lt;/span&gt;&lt;/a&gt;ARTR-seq кітапханасын дайындау&lt;/h4&gt;\n&lt;p&gt;ARTR-seq әдісі бұрын сипатталғандай, шағын өзгерістермен орындалды. Жасушалар 1.5% параформальдегидпен (10 мин) бекітіліп, 125 мМ глицинмен (1 мин) тоқтатылды, 0.5% Triton X-100 (10 мин) көмегімен өткізгіштікке келтірілді және РНКаза тежегіші бар 0.1% BSA-мен блокталды. TDP-43 ақуызы антиденелер (Abnova, 2E2-D3, 1:500) арқылы нысанаға алынып, Alexa Fluor 546 екіншілік антиденесімен және pAG-RTase-пен инкубацияланды. Ядролық бақылау үшін Hoechst бояуы қолданылды. Кері транскрипция in situ adapter-RT праймері және биотин-16-dUTP/dCTP нуклеотидтік қоспасы көмегімен жүзеге асырылды. Реакция 20 мМ EDTA және 10 мМ EGTA-мен тоқтатылғаннан кейін, протеиназа K-мен өңделіп, фенол-хлороформ экстракциясы және этанолмен тұндыру арқылы қалпына келтірілді. РНКаза H, A және T1-мен өңдегеннен кейін, биотинделген кДНК стрептавидин моншақтары арқылы байытылды. 3' кДНК адаптері лигацияланып, кітапханалар ПТР арқылы күшейтілді және 180–300 bp фрагменттер таңдап алынды. Секвенирлеу Illumina NovaSeq 6000 платформасында (150 bp, жұптық оқылым) үш биологиялық қайталаумен орындалды.&lt;/p&gt;\n&lt;h4 id=\"artr-seq-taldauy\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#artr-seq-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ARTR-seq талдауы&lt;/span&gt;&lt;/a&gt;ARTR-seq талдауы&lt;/h4&gt;\n&lt;p&gt;Оқылған тізбектердегі адаптерлер Cutadapt (5.063 нұсқасы) көмегімен --nextseq-trim=20, --action=trim, -m 20, -e 0.15, -n 3, -O 5 параметрлерімен өңделді. R1-дің 5′ ұшындағы және R2-нің 3′ ұшындағы 8 nt бірегей молекулалық идентификаторлар (UMI) алынып тасталды, ал R1-ден алынған UMI кейінгі дедупликация үшін оқылым атауына қосылды. Кездейсоқ праймерлердегі сәйкессіздіктерден туындайтын қателерді азайту үшін R1 және R2-нің 3′ және 5′ ұштарынан қосымша 4 nt кесілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;UMI (бірегей молекулалық идентификатор) — бұл РНҚ немесе ДНҚ молекулаларын амплификацияға дейін таңбалау үшін қолданылатын қысқа нуклеотидтер тізбегі, ол нақты биологиялық көшірмелерді ПТР кезінде пайда болған артефактілерден ажыратуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рибосомалық РНҚ (rRNA) ластануын жою үшін оқылымдар Bowtie2 (v.2.4.4) көмегімен rRNA тізбектеріне карталандырылды және сәйкес келгендері алынып тасталды. Қалғандары STAR (v2.7.11b) бағдарламасы арқылы геномға карталандырылды. Бірегей карталанған оқылымдар UMICollapse көмегімен дедупликацияланды. Визуализация үшін BAM файлдары deepTools (v.3.5.5) көмегімен bigWig форматына ауыстырылды және секвенирлеу тереңдігі бойынша нормаланды. ARTR-seq профильдері computeMatrix және ggplot2 арқылы есептелді.&lt;/p&gt;\n&lt;p&gt;Шыңдарды анықтау (peak calling) үшін оқылымдар оң және теріс тізбектерге бөлініп, BEDTools көмегімен BED форматына ауыстырылды. MACS3 бағдарламасы --keep-dup -p BEDPE параметрлерімен қолданылды. Сигналдың байытылуы (fold enrichment) және P-мәндері Пуассон үлестірімі негізінде есептеліп, Бенджамини-Хохберг түзетуі қолданылды. Әр тізбек үшін шыңдар бөлек анықталып, кейін біріктірілді.&lt;/p&gt;\n&lt;h4 id=\"akhuyz-ekstrakciyasy-zhaene-immunoblotting\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#akhuyz-ekstrakciyasy-zhaene-immunoblotting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ақуыз экстракциясы және иммуноблоттинг&lt;/span&gt;&lt;/a&gt;Ақуыз экстракциясы және иммуноблоттинг&lt;/h4&gt;\n&lt;p&gt;i3Neurons жасушалары DPBS-пен жуылып, центрифугаланды және протеаза ингибиторлары қосылған RIPA буферінде лизис жасалды. 12 000 × g жылдамдықта 20 минут бойы 4°C температурада центрифугаланғаннан кейін, супернатант жиналып, BCA әдісімен ақуыз концентрациясы анықталды. 5 мкг ақуыз 5× жүктеу буферімен араластырылып, 90°C-та 2 минут қыздырылды және 10% SDS-PAGE гелінде бөлінді.&lt;/p&gt;\n&lt;p&gt;Ақуыздар нитроцеллюлоза мембранасына көшірілді. Мембраналар 5% сүтті TBST ерітіндісінде блокталды және бастапқы антиденелермен (anti-TDP-43, 1:1000; anti-GAPDH, 1:1000) 4°C-та бір түн бойы инкубацияланды. Келесі күні мембраналар жуылып, екіншілік антиденелермен (1:10 000) 1 сағат бойы бөлме температурасында инкубацияланды. Сигнал ECL реагенттері және Bio-Rad ChemiDoc жүйесі көмегімен анықталды.&lt;/p&gt;\n&lt;h4 id=\"basescope-taldauy\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#basescope-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BaseScope талдауы&lt;/span&gt;&lt;/a&gt;BaseScope талдауы&lt;/h4&gt;\n&lt;p&gt;circADGRL3 және circZNF566 анықтау үшін BaseScope v2 Detection Reagent Kit–RED жүйесі қолданылды. Осы мақсатта сақиналы РНҚ-лардың (circRNA) кері сплайсинг (back-splice junction) тізбегіне бағытталған арнайы 1ZZ зондтары әзірленді. Зерттеуде формалинмен бекітілген және парафинге (FFPE) құйылған адам миының постмортальды кесінділері пайдаланылды. Дайындық процесі ксилолда депарафинизацияны және спирт ерітінділерінде регидратацияны қамтыды. Тіндер сутегі асқын тотығымен өңделіп, содан кейін ~99 °C температурада 15 минут ішінде арнайы реагентте антигендерді ашу (target retrieval) процесі жүргізілді. Тіннің өткізгіштігін арттыру үшін үлгілер бөлме температурасында 30 минут бойы Protease III ферментімен инкубацияланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BaseScope әдісі — бұл in situ гибридизацияның жоғары сезімтал түрі, ол қысқа зондтардың көмегімен жекелеген РНҚ молекулаларын, соның ішінде сақиналы РНҚ түрлерін визуализациялауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мақсатты және бақылау (оң және теріс) зондтарының гибридизациясы 40 °C температурада 2 сағат бойы ылғалды камерада өткізілді. Сигналды күшейту (AMP1–AMP8 кезеңдері) Fast RED хромогенді субстраты арқылы аяқталды. Кесінділер гематоксилинмен боялып, VectaMount ортасымен жабылды. Визуализация 60× үлкейтуде жарық микроскопы арқылы жүзеге асырылды, мұнда әрбір РНҚ молекуласы жеке қызыл нүкте ретінде көрінді.&lt;/p&gt;\n&lt;p&gt;Сандық талдау әр кесінді үшін кемінде 10 көру аймағында, барлығы 100-ден кем емес жасуша есепке алынып орындалды. Жасушалардың жалпы саны ядроны бояу арқылы анықталды, бұл ретте глия жасушаларына тән кішкентай гиперхромды ядросы бар жасушалар талдаудан шығарылды. Қызыл нүктелер саны жалпы жасушалар санына қатысты нормаландырылды. Барлық суретке түсіру және есептеу жұмыстары соқыр (blinded) әдіспен жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау&lt;/span&gt;&lt;/a&gt;Статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Мәліметтерді өңдеу және статистикалық маңыздылықты бағалау үшін GraphPad Prism және RStudio бағдарламалары қолданылды. Статистикалық маңыздылықтың шектік мәні p &amp;lt; 0,05 деп белгіленді. Маңыздылық деңгейлері *P &amp;lt; 0,05, **P &amp;lt; 0,01, ***P &amp;lt; 0,001 және ****P &amp;lt; 0,0001 ретінде көрсетілді. Ақуыз үлгілерін талдау кезінде бақылау ретінде GAPDH қолданылды. Барлық тәжірибелер n=3 биологиялық қайталаныммен жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Биологиялық қайталаным (biological replicate) — бұл тәуелсіз биологиялық көздерден (мысалы, әртүрлі жасуша культуралары немесе жануарлар) алынған үлгілер, бұл нәтижелердің қайталануын бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;circRNA-ға байытылған РНҚ-seq талдауы 7689 транскриптті анықтады. /LFC/ ≥ 0,5 және p &amp;lt; 0,05 критерийлері бойынша сүзгіден өткізгеннен кейін, TDP-43 деплециясы кезінде 585 жоғары (upregulated) және 379 төмен (downregulated) экспрессияланған circRNA анықталды (Сурет b). Мәліметтер жанартау диаграммасында көрсетілген, мұнда -log10(p-value) мәндері 40-тан жоғары болса, жоғарғы шекпен шектелген. Жылу картасы (Сурет c) ең көп экспрессияланған 50 circRNA-ны көрсетеді; бір ген-иесінен шыққан circRNA изоформалары үшін нөмірлеу жоғарыдан төменге қарай берілген. Қызыл түспен белгіленген de novo circRNA-лар бақылау үлгілерінде (sgCON) нөлдік экспрессия деңгейіне ие болған.&lt;/p&gt;\n&lt;p&gt;Нәтижелерді растау үшін circRNA-сыз жалпы РНҚ-да RT-qPCR жүргізілді (Сурет e–h). Бұл мәліметтер үшін статистикалық маңыздылық екі жақты жұпталмаған t-тест арқылы есептелді. Самай қыртысының тіндеріндегі (бақылау, ALS/FTD, спорадикалық FTD және AD) маңыздылық екі жақты Манн-Уитни тесті арқылы анықталды. BaseScope (in situ гибридизация) тәжірибелерінде circADGRL3 және circZNF566 үшін (Сурет e) әр топтағы (n=3 донор) 100 жасушаға шаққандағы оң сигналдар саны t-тест арқылы бағаланды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f1.jpg\" alt=\"1-сурет. TDP-43 жоғалуы криптикалық circRNA биогенезін тудырады. a, Дифференциацияның 14-күнінде i3Нейрондарда sgRNA көм\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. TDP-43 жоғалуы криптикалық circRNA биогенезін тудырады. a, Дифференциацияның 14-күнінде i3Нейрондарда sgRNA көмегімен TDP-43 нокдаунын көрсететін Вестерн-блот.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f3.jpg\" alt=\"3-сурет. Криптикалық circRNA-лар тұрақты және нейрондарда біртіндеп жиналады. a, TDP-43 нокдауны бар i3Нейрондардағы реп\" /&gt;&lt;/p&gt;\n&lt;p&gt;*3-сурет. Криптикалық circRNA-лар тұрақты және нейрондарда біртіндеп жиналады. a, TDP-43 нокдауны бар i3Нейрондардағы репрезентативті circRNA-лар мен тиісті хост мРНК-лардың RNA ыдырау талдауы. RNA деңгейлері актиномицин D-мен өңдегеннен кейінгі көрсетілген уақыт нүктелерінде RT–qPCR көмегімен өлшенді және бақылау RNA spike-in-ге қалыптастырылды. Барлық уақыт нүктелері 0 уақытпен салыстырылды. Транскрипттердің болжалды жартылай ыдырау кезеңдері (t₁/₂) көрсетілген. Деректер екі биологиялық қайталаудың орташа мәні ± SEM түрінде көрсетілген. b, Бақылау және TDP-43 нокдауны бар i3Нейрондардағы нейрондық дифференциация кезіндегі circRNA-лар мен тиісті хост мРНК-лардың RT–qPCR талдауы. RNA деңгейлері дифференциациядан кейінгі көрсетілген күндерде өлшенді және дифференциациядан кейін тұрақты болып қалатын HPRT1-ге қалыптастырылды50. Деректер үш биологиялық қайталаудың орташа мәні ± SEM түрінде көрсетілген. Статистикалық маңыздылық 15-ші күн үлгілері үшін екі жақты жұптаспаған t-тесттер арқылы анықталды. ns, маңызды емес; &lt;em&gt;P &amp;lt; 0.05, ** P &amp;lt; 0.01. c, TDP-43 нокдауны бар i3Нейрондардың цитоплазмалық және ядролық фракцияларындағы circRNA-лар мен тиісті хост мРНК-лардың RT–qPCR талдауы. Әрбір фракциядағы RNA деңгейлері бақылау RNA spike-in-ге қалыптастырылады және жалпы RNA-ға қатысты ұсынылады. Деректер төрт биологиялық қайталаудың орташа мәні ± SEM түрінде көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f4.jpg\" alt=\"4-сурет. Криптикалық circRNA-лар пациенттердің қайтыс болғаннан кейінгі ми тіндерінде жоғарылаған. a–d, Неврологиялық ем\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. Криптикалық circRNA-лар пациенттердің қайтыс болғаннан кейінгі ми тіндерінде жоғарылаған. a–d, Неврологиялық емес бақылаулардан (n = 15), C9ORF72-байланысты ALS/FTD (n = 15), спорадиялық FTD жағдайларынан (n = 5) (a, b) және Альцгеймер ауруынан (AD; n = 8) (c, d) алынған самай қыртысы тіндеріндегі криптикалық circRNA-лардың (a, c) және сызықтық CE қамтитын транскрипттердің (b, d) RT–qPCR талдауы. Салыстырмалы экспрессия деңгейлері HPRT1-ге қалыптастырылып есептелген және log10 шкаласында көрсетілген. Әрбір нүкте жеке донордың үлгісін білдіреді, ал көлденең сызықтар медиандық мәндерді көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur-f5.jpg\" alt=\"5-сурет. TDP-43 жоғалуы криптикалық circRNA биогенезін босатып жібереді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. TDP-43 жоғалуы криптикалық circRNA биогенезін босатып жібереді.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-23/loss-of-tdp-43-function-drives-cryptic-circular-rnas-in-neur.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нейродегенерац&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;иядағы TDP-43&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ақауы&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;адам&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=
