        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"204\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"616\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · IMMUNOLOGY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ракты емдеу кезінде&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;иммунитетті қалай қалпына&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;келтіруге болады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f1.jpg\" alt=\"1-сурет / TCE монотерапиясы кезіндегі пациенттердің Т-жасушаларының функционалдық бұзылуы мен транскрипциялық қайта бағд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет / TCE монотерапиясы кезіндегі пациенттердің Т-жасушаларының функционалдық бұзылуы мен транскрипциялық қайта бағдарламалануы (A) mCRPC бар пациенттерден алғашқы емдеу цикліне дейін және кейін (сәйкесінше 1 және 8-күндері) PBMC (n=5) жиналды және кез келген уақыт нүктесінің 100 000 жасушасы CC-1 немесе изотипті бақылау антиденесі (CC-iso) (әрқайсысы 1 нМ) қатысуымен LNCaP жасушаларымен (E:T қатынасы 1:1) 72 сағат бойы инкубацияланды, содан кейін функционалдық талдау жасалды. (B-C) Т-жасушаларының пролиферациясы, CD4+ және CD8+ Т-жасушаларының активациясы және IFN-γ бөлінуі сәйкесінше 3H-тимидиннін қосу, ағынды цитометрия және LEGENDplex мультиплексті талдаулары арқылы анықталды (B); LNCaP жасушаларының азаюы ағынды цитометрия көмегімен анықталды (C). Жеке пациенттердің деректерін 1A қосымша суретінен қараңыз. (D) Емдеуге дейін (1, 22, 43, 64-күндер) және кейін (7, 29, 50, 71-күндер) көрсетілген уақыт нүктелерінде алынған үш пациенттің PBMC-лері сәулеленген LNCaP жасушаларымен және CC-1 (1 нМ) инкубацияланды. 72 сағаттан кейін Т-жасушаларының пролиферациясы 3H-тимидиннін қосу арқылы бағаланды. Жеке пациенттердің деректерін 1C қосымша суретінен қараңыз. (E) Бірнеше емдеу циклі кезінде көрсетілген уақыт нүктелерінде CC-1 және еритін интерлейкин-2 рецепторының (sIL-2R) плазмадағы концентрациялары өлшенді және сарысу деңгейлері ИФА арқылы санмен анықталды. Бір репрезентативті пациенттің үлгілік нәтижелері көрсетілген. Екі қосымша пациенттің деректерін 1D қосымша суретінен қараңыз. (F) UMAP арқылы визуализацияланған scRNA секвенирлеу деректерінің Лейден негізіндегі кластерленуі, бастапқы деңгейде (1-күні) және терапиядан кейін (8-күні) жиналған пациенттердің PBMC-леріндегі негізгі иммундық жасуша популяцияларын бейнелейді, олар канондық желілік маркерлерге сәйкес аннотацияланған. UA, тағайындалмаған. (G) Уақыт нүктелері бойынша Т-жасушаларының тыныштық күйіне/анэргиясына, ерте активацияға және метаболикалық реттеугіштерге қатысы бар таңдалған гендердің экспрессия өзгерістерін қорытындылайтын нүктелі графиктер; нүкте өлшемі тиісті гендерді экспрессиялайтын жасушалардың үлесін көрсетеді; түс қарқындылығы орташа экспрессияны көрсетеді. (H) Емдеуге дейінгі үлгілермен (1-күні) салыстырғанда анэргиямен және гипореактивтілікпен байланысты канондық транскрипциялық бағдарламалардың айтарлықтай байытылғанын көрсететін гендер жиынтығын байыту талдауы (GSEA). SAFFORD_T_LYMPHOCYTE_ANERGY жолы (MSigDB) 8-күнгі CD4+ және CD8+ Т-жасушаларында айтарлықтай байытылды. NES, қалыпталған байыту баллы; FDR, жалған ашу жиілігі. (I) Т-жасушаларының субкластерленуі UMAP көмегімен визуализацияланды, бұл терапиядан кейін пайда болатын пролиферативті, эффекторлық тәрізді және гипореактивті популяцияларды қоса алғанда, әртүрлі функционалдық күйлерді анықтады. (J) Емдеуге дейінгі (1-күні) және терапиядан кейінгі (8-күні) Т-жасушалары күйлерінің таралуын иллюстрациялайтын кірістіру тығыздығы графиктер, гипореактивті және пролиферативті емес фенотиптерге қарай жылжуды құжаттайды. Бағанды графиктер әрбір жағдайдағы кластердің таралуын көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Арнайы биспецификалық антиденелер иммундық жасушаларды ісікке қарсы күресуге мәжбүрлейді, бірақ уақыт өте келе оларды әлсіретеді. Ғалымдар мұның себебін анықтап, қосымша молекулалық сигналдар арқылы Т-жасушалардың жұмыс қабілетін қайтару әдісін жасады. Тәжірибелер бұл тәсілдің ісікке қарсы иммунитетті толық қалпына келтіретінін көрсетті.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;TCE монотерапиясы Т-жасушаларының анергиясын тудырады.&lt;/li&gt;\n&lt;li&gt;Екі валентті CD28 байланысы бар BiCos жасалды.&lt;/li&gt;\n&lt;li&gt;BiCos пен TCE комбинациясы лимфоциттер функциясын қалпына келтіреді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;CD3 рецепторын ынталандыратын TCE препараттары онкологияда қолданылады, бірақ олардың жеке терапиясы Т-жасушаларының функционалдылығын жоғалтады. Жалғыз жасушалық РНК секвенирлеу тәсілі бірінші сигналдың оқшаулануы CBLB және BACH2 гендерінің экспрессиясын арттырып, тыныштық күйін тудыратынын көрсетті.&lt;/p&gt;\n&lt;p&gt;Бұл мәселені шешу үшін зерттеушілер CD28-мен екі валентті байланысу арқылы екінші сигнал беретін биспецификалық костимуляторларды (BiCos) жасады. Бұл құрылым ісік антигендері мен жасушадан тыс матрикс үшін қатаң селективтілікті сақтайды.&lt;/p&gt;\n&lt;p&gt;Адамдастырылған тышқандардағы сынақтар BiCos мен TCE комбинациясы ісіктерді жоюға әкелетінін көрсетті. Молекулярлық талдау Т-жасушаларының пролиферативті қабілетінің толық қалпына келгенін растады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер жасушалық модельдерде, адамдастырылған тышқандарда және ерте фазадағы клиникалық сынақ үлгілерінде алынды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;CD3 рецепторын ынталандыратын биспецификалық Т-жасушалық тартушылар (TCE) онкологиялық терапияда қарқынды дамып келеді. Біз қатерлі ісікпен ауыратын науқастарды тек TCE-мен емдеу T-жасушаларының гипореактивтілігіне, соның ішінде пролиферациялық және литикалық қабілеттерінің жойылуына әкелетінін анықтадық. Жеке жасушалық РНК секвенирлеу (single-cell RNA-sequencing) арқылы анэргия мен тыныштық күйінің транскрипциялық белгілері анықталды, олардың қатарына CBLB және BACH2 гендерінің артуы, сондай-ақ тек «Т-жасушаның 1-сигналының» берілуі салдарынан AP-1-ге тәуелді белсендіру бағдарламаларының басылуы кіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жеке жасушалық РНК секвенирлеу — бұл әрбір жеке жасушаның гендік белсенділігін талдауға және жасырын айырмашылықтарды көруге мүмкіндік беретін озық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;T-жасушалардың қызметін қалпына келтіру үшін біз жоғары тиімді bivalent CD28 байланысуы арқылы «2-сигналды» жеткізетін, сонымен бірге ісік жасушалары мен жасушадан тыс матрикс экспрессиялайтын антигендерге қатаң шектелген белсенділікті сақтайтын биспецификалық костимуляторларды (BiCos) жасадық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жасалған BiCos костимуляторлары CD28-мен байланысу арқылы маңызды 2-сигналды жеткізіп, TCE туындатқан лимфоциттердің гипореактивтілігін жояды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Клиникаға дейінгі талдаулар BiCos TCE монотерапиясының тиімділігін күшейтетінін көрсетті, олардың белсенділігі univalent Knob-into-Hole CD28 костимуляторларынан асып түсіп, T-жасушаларының гипореактивтілігін қайтарады. Гуманизацияланған тышқандарда BiCos өте аз мөлшердегі TCE-мен бірлесіп, қалыптасқан ісіктердің жойылуын қамтамасыз етті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Деректер гуманизацияланған тышқандардағы клиникаға дейінгі үлгілерде алынды, сондықтан адамдарда қауіпсіздікті растау үшін клиникалық сынақтар қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Соңында, BiCos TCE қабылдаған науқастардың Т-жасушаларындағы BACH2 және KLF2 жоғары экспрессиясы сияқты тыныштық күйінің молекулалық белгілерін кері қайтарып, жасуша функциясының толық қалпына келуіне және тұрақты ісікке қарсы иммунитеттің қалыптасуына әкелді.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;1980 жылдары жүре пайда болған иммунитеттің негізгі эфекторлық жасушалары — T-жасушаларының қызметін реттейтін орталық рецепторлар анықталып, сипатталды. Олардың ішіндегі алғашқысы T-жасушалық рецептор (TCR)/CD3 кешені болып, ол белсендіру үшін маңызды «1-сигналды» қамтамасыз етеді. Көп ұзамай CD28 маңызды «2-сигналды» беретін прототипті костимуляторлық рецептор ретінде анықталды. Кейіннен 4-1BB (CD137) және OX40 (CD134) сияқты қосымша костимуляторлық рецепторлар табылды. Костимуляция «1-сигналды» күшейтіп қана қоймай, тек TCR/CD3 стимуляциясынан кейін пайда болатын T-жасушаларының гипореактивтілігіне жол бермейтіні расталды. Сонымен қатар, CTLA-4 және PD-1 сияқты иммундық бақылау нүктелері T-жасушаларының белсенділігін шеkтейтін коингибиторлық сигналдарды беретіні анықталды. Бұл жаңалықтар клеточный иммунитетті терапевтік тұрғыдан реттеуге жол ашты.&lt;/p&gt;\n&lt;p&gt;CD3 стимуляциялайтын биспецификалық T-жасуша тартқыштарынан (TCE) және функционалдық жақын CAR-T жасушаларынан басқа, иммундық бақылау нүктелерінің ингибиторлары да T-жасушаларын тарту стратегияларын толықтырып, қазіргі уақытта онкологиялық емнің негізіне айналды. TCE және CAR-T арасындағы маңызды айырмашылық — соңғылары терапевтік тиімділікке қол жеткізу үшін тек CD3-тен ғана емес, сонымен қатар CD28 немесе 4-1BB сияқты костимуляторлық молекулалардан да сигналдарды талап етеді. Біз биспецификалық антителолар (bsAb) саласына костимуляторлық сигналдарды әлі 1980 жылдары енгізген едік: сол кезде авторлар TAAxCD3 және TAAxCD28 спецификалығы бар bsAb (TAA — ісікпен байланысқан антиген) тіркесімі ісік жасушаларына қарсы T-жасушаларының жоғары реактивтілігін қамтамасыз ететінін көрсетіп, осындай комбинацияны бағалайтын клиникалық сынақ жүргізген болатын.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Биспецификалық антителолар мен CAR-T жасушалары — бұл қатерлі ісікті жою үшін ісік антигені мен иммундық рецепторларға бір мезгілде бағытталған жасанды ақуыздар немесе өзгертілген T-жасушаларын қолданатын заманауи иммунотерапия әдістері.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Одан кейін ісікке бағытталған костимуляцияны клиникалық дамыту 2006 жылы TGN1412 (Tegenero) оқиғасы салдарынан қатты тежелді, сол кезде CD28-ге қарсы суперагонистік моноклоналды антитело сынаққа қатысқан сау еріктілерде өмірге қауіп төндіретін цитокиндік боран синдромын тудырған еді.&lt;/p&gt;\n&lt;h4 id=\"bispecifikalykh-kostimulyatorlardy-aezirleu\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bispecifikalykh-kostimulyatorlardy-aezirleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Биспецификалық костимуляторларды әзірлеу&lt;/span&gt;&lt;/a&gt;Биспецификалық костимуляторларды әзірлеу&lt;/h4&gt;\n&lt;p&gt;Оңтайландырылған биспецификалық костимуляторларды (BiCo) жасау жөніндегі күш-жігеріміз PSMA-ға бағытталған TCE қолданылған клиникалық зерттеу барысындағы соңғы бақылаулардың арқасында күшейе түсті. Біз бұл жерде, біздің білуімізше, алғаш рет TCE монотерапиясын ұзақ уақыт қолдану белсендіру бағдарламаларының басылуына, сондай-ақ канондық анергия мен тыныштық (квиесценция) гендерінің қосылуына байланысты пациенттің T-жасушаларының функционалдық гипореактивтілігін тудыруы мүмкін екенін хабарлаймыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;TCE монотерапиясын ұзақ мерзімді қолдану пациенттің T-жасушаларының белсендіру бағдарламаларын өшіріп, олардың гипореактивтілігі мен тыныштық күйін туындатады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;T-жасушаларының қызметін күшейту және биваленттілік CD28 антителоларының агонистік белсенділігін күрт арттыратынын ескере отырып, біз бұрын қолжетімді болған құрылымдардан айырмашылығы, тек ісікпен шектелген белсенділікті сақтай отырып, бивалентті TAA және CD28 байланыстырушы бөліктері бар BiCo әзірледік. Нысана ретінде біз тек ісік жасушаларында ғана емес, сонымен қатар ісіктердің жасушадан тыс матриxсында (жаңадан түзілген тамырларды қоса алғанда) экспрессияланатын эндоглин мен B7-H3 таңдадық. Сондай-ақ, біз сау тіндерде қиылыспайтын екі түрлі TAA қолдану TCE мен BiCo комбинациясы үшін қосымша қауіпсіздік деңгейін қамтамасыз етеді деп есептедік, өйткені соңғыларға костимуляторлық функцияны атқару үшін TCE тарапынан «1-сигнал» және белсендіру қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Ұсынылған деректер жасушалық модельдер мен пациенттердің үлгілеріне негізделген; кез келген доклиникалық қорытындылар клиникалық жағдайда қатаң тексеруді талап етеді.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыста біз бивалентті BiCo көмегімен CD28 арқылы сигналдарды жеткізу TCE монотерапиясы кезінде пайда болатын T-жасуша гипореактивтілігінің алдын ала алатынын және оны кері қайтара алатынын көрсетеміз. Бұған пролиферативті жасуша циклі бағдарламаларын қалпына келтіру, эфекторлық профильдер мен белсендіру жолдарын күшейту, сондай-ақ T-жасуша анергиясы мен тыныштық белгілерін жою арқылы қол жеткізіледі, бұл T-жасушаларының ісікке қарсы терапевтік иммунитетінің күрт артуына әкеледі.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"zheke-tce-agentimen-emdeu-t-zhasushalarynyng-giporeaktivtiligin-tudyrady\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#zheke-tce-agentimen-emdeu-t-zhasushalarynyng-giporeaktivtiligin-tudyrady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке TCE агентімен емдеу Т-жасушаларының гипореактивтілігін тудырады&lt;/span&gt;&lt;/a&gt;Жеке TCE агентімен емдеу Т-жасушаларының гипореактивтілігін тудырады&lt;/h4&gt;\n&lt;p&gt;Метастазды кастрацияға төзімді простата обыры (mCRPC) бар науқастардың қатысуымен жүріп жатқан 1a-фазалы клиникалық сынақта біздің PSMA-бағытталған TCE CC-1 препаратын жеке терапия ретінде қолданған кезде PSA деңгейінің жылдам, бірақ қысқа мерзімді төмендеуі байқалды (NCT04104607). Емге дейін және одан кейін алынған осы науқастардың шеткі қан мононуклеарлы жасушаларын (PBMC) қолдана отырып жүргізілген ex vivo талдауы (1A-сурет) CD4⁺ және CD8⁺ Т-жасушаларының саны бірдей болғанына қарамастан, CD3-стимуляциясына жауап ретінде Т-жасушаларының белсенуі, пролиферациясы, цитокиндердің секрециясы мен цитолитикалық белсенділігі күрт төмендегенін көрсетті (1-сурет, B және C; S1-қосымша сурет, A және B). Лонгитюдтік ex vivo талдаулары ем екі аптаға тоқтатылғаннан кейін науқастардың Т-жасушалары бұл гипореактивті күйден ішінара қалпына келетінін көрсетті (1D-сурет, мысалы, 7-күн мен 22-күнді салыстырыңыз; S1C-қосымша сурет). Алайда, TCE емдеуге әлсіз жауаптар (1D-сурет, 1-күн мен 22 және 64-күнді салыстырыңыз; S1C-қосымша сурет) және емдеу циклдарының саны артқан сайын ерітіндідегі IL-2 рецепторының (sIL-2R) сарысулық шыңының төмендеуі арқылы көрінетіндей, жалпы реактивтілік терең деңгейде басылған күйінде қалып, науқастар арасында айтарлықтай өзгеріске ұшырады (1E-сурет және S1D-қосымша сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TCE CC-1 препаратымен монотерапия классикалық сарқылу белгілерінсіз Т-жасушаларының терең, бірақ ішінара қайтымды гипореактивтілігін тудырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Гипореактивті Т-жасушалар сарқылу маркерлерінің (мысалы, PD-1: CD4⁺ Т-жасушаларында P = 0.7 және CD8⁺ Т-жасушаларында P = 0.5) немесе қартаю мен терминалды дифференцировкаға тән фенотиптің (PD-1, CD57, KLRG1, CD27/CD28 жоғалуы) айтарлықтай жоғарылауын көрсетпеді (S1-қосымша сурет, E және F). TCE еміне дейін және кейін алынған PBMC үлгілеріне жүргізілген бір жасушалы РНК секвенирлеуі (scRNA-seq) жеті түрлі иммундық жасуша кластерін, соның ішінде CD4+ Т-жасушалары, CD8+ Т-жасушалары, NK-жасушалары, В-жасушалары, CD16+ моноциттері, CD14+ моноциттері және дендритті жасушаларды анықтады (1F-сурет). 1-ші және 8-ші күнгі жұптастырылған үлгілерді салыстырмалы scRNA-seq талдауы TCE емі Т-жасушаларының анергиясы/тыныштық күйіне тән үйлестірілген транскрипциялық бағдарламаны қоздыратынын көрсетті: реттеуші метаболикалық факторлар мен анергияға/тыныштыққа байланысты гендердің (CBLB, BACH2, FOXP1, PTPN22, LAG3, LDHA және UCP2) жоғарылауы және ерте белсену гендерінің (FOS, FOSB, JUN, JUNB, DUSP1, CD69) төмендеуі орын алды (1G-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;scRNA-seq және GSEA талдаулары жасушаішілік үдерістерді және гендер топтарының жұмысын зерттеуге мүмкіндік беріп, жасушаның анергия күйіне ауысқанын айқын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл ген экспрессиясының профилі AP-1 белсену бағдарламалары басылған және CBLB экспрессиясының артуы сияқты анергияға ұқсас тежеуші белгілері бар BACH2 басқаратын тыныштық күйіне сәйкес келеді. Осыған сәйкес, гендер жиынтығын байыту талдауы (GSEA) TCE әсер еткен Т-жасушаларында анергияға байланысты гендер жиынтығының айтарлықтай байығанын анықтады (CD4⁺ Т-жасушаларында NES = 1.633, p &amp;lt; 0.0001 және FDR &amp;lt; 0.0001; CD8⁺ Т-жасушаларында NES = 1.420, p &amp;lt; 0.0001 және FDR &amp;lt; 0.0001) (1H-сурет және S2-қосымша сурет). Субкластерлеу және тығыздықты талдау (1-сурет, I және J) CD8⁺ Т-жасушалары эффекторлы-жады күйінен дисфункционалды терминалды эффекторға ұқсас күйге ауысқанын, ал CD4⁺ Т-жасушалары ерте белсенген/орталық жады фенотиптен тыныштық күйіне өткенін растады. Бақыланған субкластерлердің таралуы созылмалы, теңгерімсіз стимуляция кезіндегі өзгерген дифференцировка үлгілеріне сәйкес келеді.&lt;/p&gt;\n&lt;h4 id=\"ongtajlandyrylghan-bispecifikalykh-cd28-kostimulyaciyasy-ueshin-format-zhaene-bajlanystyrghyshty-tangdau\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#ongtajlandyrylghan-bispecifikalykh-cd28-kostimulyaciyasy-ueshin-format-zhaene-bajlanystyrghyshty-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оңтайландырылған биспецификалық CD28 костимуляциясы үшін формат және байланыстырғышты таңдау&lt;/span&gt;&lt;/a&gt;Оңтайландырылған биспецификалық CD28 костимуляциясы үшін формат және байланыстырғышты таңдау&lt;/h4&gt;\n&lt;p&gt;Моноспецификалық CD28 антиденелері костимуляторлық белсенділікті көрсету үшін моновалентті емес, бивалентті байланысуды қажет етеді. Тиісінше, бивалентті CD28 байланысуы костимуляторлық bsAb функцияларын жақсарта алады, бірақ бұл нысанамен шектелген белсенділікті жоғалту қаупін тудырып, жанама әсерлерге әкелуі мүмкін. Осы дилемманы шешу үшін біз мақсатты емес ерекшелігі бар төрт бивалентті BiCo форматын жасадық және сипаттадық (2A-сурет және S3-қосымша сурет, A және B). Олардың екеуі (bs-CD28-1 және bs-CD28-2) Т-жасушаларындағы CD28-ге жоғары аффиндігі бар Fab-бөліктері арқылы байланысса, қалған екеуі (bs-CD28-3 және bs-CD28-4) ауыр немесе жеңіл тізбектерге біріктірілген бір тізбекті anti-CD28 домендерін қамтыды (S3C-қосымша сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Төрт BiCo форматының ішінде тек bs-CD28-4 форматы ісік антигені болмаған кезде Т-жасушаларын ынталандырмай, қатаң түрде нысанаға бағытталған белсенділікті көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«1-сигналды» қамтамасыз ететін TCE (CC-1) субмитогендік дозаларымен бірге тек bs-CD28-4 форматы ісікпен байланысқан антиген (TAA) болмаған кезде Т-жасушаларының стимуляциясының болмауымен сипатталатын қатаң түрде нысанаға бағытталған белсенділікті көрсетті (2B-сурет). Осыған сәйкес, bs-CD28-4 форматы эндоглин мен B7-H3-ке бағытталған BiCo жасау үшін таңдалды. Бұл TAA солидті ісіктерде, сондай-ақ жаңа түзілген тамырларды қоса алғанда, ісікпен байланысқан жасушадан тыс матриксте (ECM) кеңінен экспрессияланады (16, 17) және сондықтан CC-1 тудырған иммундық жауаптарды күшейтуге оңтайлы түрде сәйкес келеді (S3D-қосымша сурет). Жаңадан жасалған және бұрын сипатталған (18) mAb панельдерінен оңтайлы аффиндік негізінде екі эндоглин және екі B7-H3 байланыстырғыштары таңдалды (S3-қосымша сурет, E және F). Сәйкес төрт құрылым клондалып, сипатталғаннан кейін, Т-жасушаларының пролиферациясын қоздыруды салыстырмалы талдау негізінде BiCo-1 (endoglin-Kro22xCD28) және BiCo-2 (B7-H3-8H8xCD28) деп аталатын екі BiCo негізгі кандидаттар ретінде таңдалды (S3-қосымша сурет, G-I).&lt;/p&gt;\n&lt;h4 id=\"bico-molekulalarynyng-funkcionaldykh-sipattamasy\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bico-molekulalarynyng-funkcionaldykh-sipattamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BiCo молекулаларының функционалдық сипаттамасы&lt;/span&gt;&lt;/a&gt;BiCo молекулаларының функционалдық сипаттамасы&lt;/h4&gt;\n&lt;p&gt;Ісігі жоқ гуманизацияланған тышқандарда жүргізілген in vivo қауіпсіздік сынақтары барысында, UCHT1 бақылау антиденесінен айырмашылығы, BiCo-1 де, BiCo-2 де дербес түрде немесе CC-1 препаратымен бірлескенде ешқандай цитокиннің босап шығуына әкелмейтіні анықталды (2D сурет). Бұл BiCo қолданған кезде T-жасушаларының мақсатты емес активациясы жоқ екенін және комбинацияланған әдістің нысанаға қатаң тәуелді екенін растайды.&lt;/p&gt;\n&lt;p&gt;Нысана-антигені бар және жоқ жасушалардың қатысуымен жасалған талдаулар, сондай-ақ дозаға тәуелділік зерттеулері белсенділіктің ісік антигеніне қатаң тәуелді екенін көрсетті. T-жасушаларының максималды пролиферациясы 25 pM CC-1 және 0.5 nM BiCo концентрацияларында байқалды (2E сурет және 4 пен 5 қосымша суреттер, A және B). Дәл осы концентрациялар кейінгі тәжірибелер үшін пайдаланылды. Екі BiCo қосылысы да TCE басқаратын CD4⁺ және CD8⁺ T-жасушаларының активациясын, IFN-γ секрециясын және ісік жасушаларын жоюды күшті түрде арттырды (2 сурет, F және G; 5 қосымша сурет, C-E). Әсіресе ұзақ мерзімді сынақтарда BiCo мен төмен дозалы TCE комбинациясы, тіпті жоғары дозадағы (1000 pM) жалғыз TCE-мен салыстырғанда да, айтарлықтай күшейтілген (мысалы, CD8⁺ T-жасушалары үшін BiCo-1 бойынша P = 0.03 және BiCo-2 бойынша P = 0.004) T-жасуша пролиферациясын және эффекторлық пен орталық жады жасушаларының айқын өсуін қамтамасыз етті (5 қосымша сурет, F және G).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Екі валентті BiCo молекулалары төмен дозалы TCE-мен бірге CD4+ және CD8+ T-жасушаларының нысанаға тәуелді пролиферациясын күшейтеді (P = 0.03 және P = 0.004) және ісікті тиімді жояды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біздің валентті BiCo форматымызды қазіргі уақытта клиникалық сынақтардан өтіп жатқан моновалентті Knob-into-Hole CD28 костимуляторларымен (KiH) (NCT06826768, NCT04626635, NCT04590326) салыстыру үшін біз BiCo құрамында қолданылатын TAA және CD28 байланыстырғыштары бар KiH-1 және KiH-2 құрылымдарын жасадық (2H сурет және 6 қосымша сурет, A және B). Күтпеген жерден, аффинділік тұрғысынан KiH құрылымдары біздің BiCo молекулаларымызға ұқсас болып шықты (3I қосымша сурет және 6 қосымша сурет, C-E). Әрі қарай, біз TCE-мен бірге қолданылған bivalent BiCo форматының костимуляциялық әлеуетін моновалентті KiH құрылымдарымен салыстырдық. Концентрациялардың кең диапазонында BiCo молекулаларының костимуляциялық белсенділігі KiH аналогтарынан анық басым түсті (2I сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Knob-into-Hole (KiH) технологиясы ауыр тізбектерді модификациялау арқылы биспецификалық антиденелерді жасау үшін қолданылатын гетеродимеризация әдісі болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кейінгі талдауларда BiCo және KiH молекулалары үшін қанықтырушы концентрация ретінде nM деңгейін пайдаланып, екі валентті BiCo форматы CD4+ және CD8+ T-жасушаларының пролиферациясын (CD4+ үшін BiCo және KiH арасында P &amp;lt; 0.0001; CD8+ үшін BiCo-1 және KiH-1 арасында P &amp;lt; 0.0001, BiCo-2 және KiH-2 арасында P = 0.0014), жадының қалыптасуын және ісік жасушаларының лизисін (BiCo-1 пен KiH-1 үшін P &amp;lt; 0.0001, BiCo-2 бен KiH-2 үшін P = 0.0002) айтарлықтай жоғары деңгейде ынталандыратынын анықтадық (2 сурет, J-M және 7 қосымша сурет, A-E). Бұл тиімділік айырмашылығы екі валентті BiCo молекулаларының CD28 байланыстырушы бөлігінің диссоциация жылдамдығының (off-rate) 5 есе азаюына байланысты болуы мүмкін (6D қосымша сурет).&lt;/p&gt;\n&lt;p&gt;C57BL/6 тышқандарында жүргізілген фармакокинетикалық талдаулар BiCo форматының сарысудағы жартылай шығарылу кезеңі классикалық моноклоналды антиденелерге ұқсас екенін көрсетті (2N сурет). Адамның PBMC жасушалары егілген NSG тышқандарында CC-1 және BiCo препараттарымен бір мезгілде емдеу (тек TCE емес) ірі LNCaP-E ісіктерін толығымен жойды және жануарлардың өмір сүру ұзақтығын статистикалық тұрғыдан айтарлықтай жақсартты (P &amp;lt; 0.0001, 2O сурет, 7F қосымша сурет). Бастапқы CC-1 монотерапиясынан кейін BiCo препаратын кешіктіріп енгізу онша айқын емес, бірақ тек CC-1 қолданғанға қарағанда әлдеқайда тиімді нәтиже берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер жануарлар модельдерінде алынғандықтан, оларды адам клиникасына тасымалдау кезінде сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bicos-t-zhasushalarynyng-giporeaktivtiligin-zhoyady-zhaene-onyng-aldyn-alady\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bicos-t-zhasushalarynyng-giporeaktivtiligin-zhoyady-zhaene-onyng-aldyn-alady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BiCos Т-жасушаларының гипореактивтілігін жояды және оның алдын алады&lt;/span&gt;&lt;/a&gt;BiCos Т-жасушаларының гипореактивтілігін жояды және оның алдын алады&lt;/h4&gt;\n&lt;p&gt;TCE терапиясынан бұрын (1-цикл, 1-күн) және кейін (8-күн) алынған бес пациенттің шеткі қан мононуклеарлы жасушаларын (PBMC) қолдана отырып, Т-жасушалардың пролиферациясы мен ісік жасушаларын жою қабілетін талдау BiCos қолдану гипореактивтілікті толығымен жоятынын көрсетті. Айта κету κερәк, TCE-ге жауап берген де, жауап бермеген де пациенттердің Т-жасушаларында BiCos белсенділік деңгейін тек TCE-нің жоғары концентрациясымен (жауап беретін жасушаларда) қол жеткізілген мәндерден едәуір асырып түсірді (3-Сурет, A және B, P &amp;lt; 0.0001). Бұл әсер кейінгі емдеу циклдарында алынған жасушаларды талдағанда да сақталды (3C-Сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BiCos қолдану Т-жасушаларының гипореактивтілігін толығымен кері қайтарып, олардың белсенділігін монотерапия деңгейінен жоғары көтереді (P &amp;lt; 0.0001) және эффекторлық жад популяцияларын қалпына келтіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жеке жасушалар деңгейіндегі транскриптомдық талдау BiCo терапиясы MCM отбасы мүшелері мен CDC гендерінің экспрессиясын күшейтуді, сондай-ақ эффекторлық бағдарламалар мен белсендірумен байланысты жолдарды (GZMB, NKG7, TNF, IL2RA, IRF4) қоса алғанда, жасуша циклінің пролиферативті бағдарламасын қайта бастағанын көрсетті. Сонымен қатар, KLF2, PNRC1, TXNIP, CD52, SARAF және BACH2 төмендеуі арқылы T-жасушаларының анергиясы мен тыныштық күйінің негізгі белгілері кері қайтарылды (3-Сурет, D және E). Қосымша тығыздықты талдау (3-Сурет, F және G) BiCo терапиясы CD8⁺ Т-жасушаларының дисфункционалды терминалды эффектор тәрізді күйлерінен эффекторлық жад популяцияларына қарай қайта ығысуымен байланысты екенін көрсетті. Параллельді түрде CD4⁺ Т-жасушалары тыныш фенотиптерден ерте белсендірілген орталық жад күйлеріне ауысты, бұл белсендіру мен функционалдық қалпына келу тепе-теңдігіне сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GSEA — бұл белгілі бір әсерге жауап ретінде жасушадағы тұтас ген топтарының белсенділігі бірлесіп өзгеретінін анықтауға мүмкіндік беретін статистикалық талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;TCE терапиясы кезінде гипореактивтіліктің пайда болуы PBMC және нысана жасушаларды 7 күн бойы TCE әсеріне ұшырату, содан кейін TCE-мен қайта стимуляциялау кезіндегі реактивтілікті бағалау арқылы in vitro модельденді. Пациенттердегідей, CC-1-дің ұзақ әсер етуі ісік нысаналары болмаған жағдайда CC-1 әсері Т-жасушаларының реактивтілігіне әсер етпегендіктен, нысанамен байланысуға тәуелді Т-жасушаларының гипореактивтілігіне әкелді. Пациенттердің Т-жасушаларынан алынған деректерге сәйкес, гипореактивтілікті бірінші 7 күндік культивация кезінде TCE әсері және функционалдық талдау кезеңінде BiCos болуы арқылы толығымен алдын алуға және кері қайтаруға болатын еді (3-Сурет, H және I; S7G қосымша суреті).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алынған нәтижелер in vitro эксперименттеріне және пациенттердің шектеулі үлгілеріне (n=5) негізделген, сондықтан клиникалық тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұқсас нәтижелер тарлатамаб көмегімен де алынды (3J-Сурет), бұл біздің TCE туындатқан Т-жасуша гипореактивтілігі туралы тұжырымдарымызды басқа клиникалық препараттарға да таратуға мүмкіндік береді. Тарлатамаб жақында ұсақ жасушалы өкпе рагын (SCLC) емдеу үшін мақұлданды және ісік жасушаларындағы DLL3 пен Т-жасушаларындағы CD3-ке байланысатын екі бір тізбекті айнымалы фрагменттен (scFv) тұратын, модификацияланған Fc доменімен біріктірілген жартылай шығарылу периоды ұзартылған арнайы биспецификалық Т-жасуша тартқышы (BiTE) болып табылады.&lt;/p&gt;\n&lt;p&gt;Жиынтықтай алғанда, біздің нәтижелеріміз TCE монотерапиясы терминалды сарқылудан гөрі функционалдық анергиямен немесе тыныштықпен байланысты ішкі жолдардың өзгеруімен сипатталатын Т-жасуша гипореактивтілігін тудыратынын көрсетеді. BiCos арқылы CD28 сигналингін қамтамасыз ету арқылы Т-жасушаларының функционалдығын қалпына келтіруге және гипореактивтіліктің алдын алуға болады, бұл Т-жасушаларының ісікке қарсы иммунитетін бұрын-соңды болмаған деңгейге дейін күшейтеді.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"t-zhasushalarynyng-giporeaktivtilik-mehanizmderi-men-bispecifikalykh-antidenelerdi-talkhylau\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#t-zhasushalarynyng-giporeaktivtilik-mehanizmderi-men-bispecifikalykh-antidenelerdi-talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T-жасушаларының гипореактивтілік механизмдері мен биспецификалық антиденелерді талқылау&lt;/span&gt;&lt;/a&gt;T-жасушаларының гипореактивтілік механизмдері мен биспецификалық антиденелерді талқылау&lt;/h4&gt;\n&lt;p&gt;Ісік антигендері мен CD3 рецепторына бағытталған дәстүрлі биспецификалық антиденелер (TCE) B-жасушалық қатерлі ісіктерді емдеуде сәтті қолданылып, ұсақ жасушалы өкпе рагын емдеу үшін тартиреламабтың мақұлдануымен және 35% жалпы жауап беру жиілігімен басқа ісік түрлерінде де белсенді енгізілуде. Алайда, пациенттердің едәуір бөлігі, әсіресе солидті ісіктер кезінде, бұл терапияға жауап бермейді, бұл сәтсіздік себептерін терең зерттеуді талап етеді. NCT04104607 клиникалық зерттеуінде PSMAxCD3 TCE CC-1 қабылдаған простата рагы бар пациенттердің T-жасушаларын талдау барысында, авторлар ұзақ мерзімді TCE терапиясы T-жасушаларының айқын функционалдық гипореактивтілігіне әкелетінін анықтады. Бұл күй екі апталық үзілістерден кейін де толық жойылмады, мұны емдеу циклдарының саны артқан сайын сарысулық sIL-2R шыңдық деңгейлерінің төмендеуі растайды. Бұл деректер TCE терапиясы пациенттерде T-жасушаларының резистенттілігін тудыруы мүмкін екенін алғаш рет көрсетеді. PBMC-ны in vitro тартиреламабпен стимуляциялаған кезде де осындай басылу байқалды. Болашақ зерттеулер оңтайлы мөлшерлеуді анықтау үшін TCE сызбасы мен гипореактивтілік арасындағы байланысты ашуы тиіс.&lt;/p&gt;\n&lt;p&gt;TCR/CD3 кешенінің оқшауланған стимуляциясы T-жасушалары гипореактивтілігінің дамуына әкелетіні белгілі. Бұл күй интерлейкин-2 өндірісінің бұзылуымен, пролиферацияның тоқтауымен және реттеуші бағдарламалардың қосылуымен сипатталады. Бұл жұмыста алғаш рет пациенттердің T-жасушаларын тікелей талдау арқылы TCE монотерапиясы FOS және JUN отбасыларының AP-1 транскрипциялық факторларының басылуына, белсендіру және метаболикалық бағдарламалардың жоғалуына, сондай-ақ BACH2, FOXP1, CBLB, PNRC1, PTPN22 және метаболикалық репрессорлар TXNIP пен UCP2 сияқты реттеушілердің индукциясына әкелетіні көрсетілді. PD-1 немесе терминалды дифференцировка маркерлерінің тұрақты өсуі байқалмады, бұл қайтымсыз шаршау немесе қартаю қаупін жоққа шығарады. Оның орнына транскрипциялық профиль ісік антигендерінің созылмалы әсері кезінде сипатталатын ерте «салқындық» күйіне сәйкес келеді. Бір жасушалық талдау CD8⁺ және CD4⁺ T-жасушаларының аралық сатыларда тоқтап қалатынын көрсетті. Бұл BACH2 ақуызының AP-1 арқылы жүретін эффекторлық дифференцировканы тежеп, төзімділікті сақтайтыны туралы бұрынғы бақылаулармен толық сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұзақ мерзімді TCE монотерапиясы AP-1 басылуы және BACH2 индукциясы арқылы T-жасушаларының функционалдық гипореактивтілігін тудырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гипореактивтілік — бұл T-жасушаларының стимуляцияға функционалды сезімталдығының жоғалуы, олар ісікке қарсы белсенді әрекет ете алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұрын CD28 молекуласы арқылы қосымша екінші сигналдар TCR/CD3 шамадан тыс стимуляциясы туындатқан гипореактивтілікке қарсы тұра алатыны хабарланған болатын. Осы деректер мен бақылауларға сүйене отырып, авторлар антиденелер терапиясының әлеуетін толық ашу үшін биспецификалық костимуляциялық молекулалар (BiCos) қажет деген қорытындыға келді. CD28-ге қарсы ерітілетін бивалентті антиденелер күшті белсенділікке ие болғанымен, олар мақсатты шектеу талабына қайшы келеді. Бұл жұмыста CD28 үшін биваленттілікті сақтай отырып, толық мақсатты түрде жұмыс істейтін тетравалентті BiCo форматы ұсынылады. CD28 байланыстыратын екі scFv бөлігінің кеңістіктік конформациясы тек нысана жасушамен байланысқаннан кейін ғана агонистік белсенділік көрсетуге мүмкіндік береді. Ісік жасушаларында және ісік матриксінде жақсы экспрессияланатындықтан, эндоглин (BiCo-1) және B7-H3 (BiCo-2) жетекші құрылымдар үшін TAA ретінде таңдалды.&lt;/p&gt;\n&lt;h4 id=\"bispecifikalykh-kostimulyaciya-tiimdiligin-eksperimentaldy-baghalau\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bispecifikalykh-kostimulyaciya-tiimdiligin-eksperimentaldy-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Биспецификалық костимуляция тиімділігін эксперименталды бағалау&lt;/span&gt;&lt;/a&gt;Биспецификалық костимуляция тиімділігін эксперименталды бағалау&lt;/h4&gt;\n&lt;p&gt;Түрлі in vitro модельдерінде BiCo-1 және BiCo-2 өте төмен концентрациялардың өзінде T-жасушаларының ісікке қарсы реактивтілігін күшті ынталандырды, бұл клиникалық қолдану кезінде жанама әсерлерді азайтуға мүмкіндік береді. Біріктірілген терапия TCE монотерапиясынан, тіпті жоғары концентрацияларда да, айтарлықтай асып түсті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алынған деректер in vitro модельдері мен шектеулі клиникалық таңдауларға негізделген, сондықтан кең көлемді клиникалық сынақтарда расталуы тиіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tce-zhaene-bico-kombinaciyasynyng-basymdyghy\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#tce-zhaene-bico-kombinaciyasynyng-basymdyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TCE және BiCo комбинациясының басымдығы&lt;/span&gt;&lt;/a&gt;TCE және BiCo комбинациясының басымдығы&lt;/h4&gt;\n&lt;p&gt;TCE және BiCo біріктірілген терапиясының тиімділігі тышқандардағы ксенотрансплантат модельдерінде расталды, мұнда тек бірлескен емдеу ісікті толық жоюға әкелді. Біздің бивалентті BiCo конструкцияларымызды KiH технологиясы арқылы жасалған қолжетімді моновалентті аналогтармен салыстыру тетравалентті BiCo форматының костимуляциялық қабілеті айтарлықтай жоғары екенін көрсетті. Таңқаларлық жайт, айырмашылық CD28-мен байланысу аффинділігінде емес, диссоциация жылдамдығында (off-rates) болды, ол моновалентті конструкцияларда шамамен 5 есе жылдам еді. Бұл BiCo-ның CD28 молекуласымен тұрақтырақ кешен түзетінін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BiCo-ның бивалентті құрылымы CD28-мен тұрақты байланысуды қамтамасыз етеді және ісіктерді жоюда моновалентті аналогтардан басым түседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алайда, кинетикалық тұрақтандыру мен рецепторлардың құрылымдық кластерленуінің үлесін бөліп көрсету қиын, өйткені бивалентті архитектура екі параметрге де әсер етеді. Сондықтан BiCo форматының артықшылығын тек бір механизммен түсіндіруге болмайды.&lt;/p&gt;\n&lt;h4 id=\"t-zhasushalardyng-funkcionaldyghyn-khalpyna-keltiru\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#t-zhasushalardyng-funkcionaldyghyn-khalpyna-keltiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т-жасушалардың функционалдығын қалпына келтіру&lt;/span&gt;&lt;/a&gt;Т-жасушалардың функционалдығын қалпына келтіру&lt;/h4&gt;\n&lt;p&gt;Біздің деректеріміз BiCo-ның Т-жасушалардың эффекторлық қабілетін күшейтіп қана қоймай, TCE монотерапиясын алған пациенттердегі гипореактивтілік күйін еңсеріп, оны қалпына келтіре алатынын көрсетеді. Бұл TCE тудырған анергия және тыныштық күйімен байланысты гендер экспрессиясының төмендеуімен және активация, цитотоксикалық, пролиферация мен цитокиндік жауапқа қатысты гендер экспрессиясының қалпына келуімен қатар жүреді. Бұл жасушаларға G0/G1 фазасындағы тоқтауды еңсеріп, пролиферацияға өтуге мүмкіндік береді. Бұл нәтижелер CD28 сигналдары IL-2 өндірісін күшейту және BACH2 делдалдығымен репрессияны жою арқылы анергия күйін бейтараптандыратынын көрсететін соңғы зерттеулермен сәйкес келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анергия — бұл Т-жасушалардың иммунологиялық толеранттылық немесе «ұйқы» күйі, олар стимулға жауап бермейді, бұл терминалды сарқылудан айырмашылығы, қайтымды процесс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қорытындылай келе, TCE монотерапиясы Т-жасушалардың гипореактивтілігіне әкелуі мүмкін, бұл емдеу тиімділігін төмендетеді. DLL3xCD3 (тарлатамаб) биспецификалық антиденесін қолдану арқылы алынған клиникаға дейінгі модельдеріміз TCE терапиясының сыныпқа тән әсерін көрсетеді. BiCo қолдану пролиферативтік әлеует пен цитотоксикалық белсенділікті сақтайды, сонымен қатар TCE тудырған молекулалық қолтаңбаны жояды. Біз шартты CD28-костимуляцияны иммунотерапия тиімділігін арттыру стратегиясы ретінде қарастырамыз. TCE және BiCo комбинациясын зерттейтін клиникалық сынақ 2026 жылы басталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қорытындылар клиникаға дейінгі модельдер мен пациенттер үлгілерін талдауға негізделген; комбинацияның клиникалық тиімділігі әлі алдағы сынақтарда расталуы керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"zhynys-biologiyalykh-ajnymaly-retinde\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#zhynys-biologiyalykh-ajnymaly-retinde\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жыныс биологиялық айнымалы ретінде&lt;/span&gt;&lt;/a&gt;Жыныс биологиялық айнымалы ретінде&lt;/h4&gt;\n&lt;p&gt;Зерттеуге тек метастазды кастрацияға төзімді қуықасты безінің обырымен ауыратын ер адамдар қатысты. In vivo эксперименттері аналық тышқандарда жүргізілді, себебі бұл ісіктердің біркелкі орнығуын қамтамасыз етеді және тәжірибелік топтар арасындағы өзгермелілікті азайтады.&lt;/p&gt;\n&lt;h4 id=\"pacientterding-uelgileri-zhaene-zhasushalykh-zheliler\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#pacientterding-uelgileri-zhaene-zhasushalykh-zheliler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пациенттердің үлгілері және жасушалық желілер&lt;/span&gt;&lt;/a&gt;Пациенттердің үлгілері және жасушалық желілер&lt;/h4&gt;\n&lt;p&gt;PBMC үлгілері CC-1 (PSMAxCD3 биспецификалық антиденесі) препаратын бағалайтын I фазалық клиникалық сынақ (NCT04104607) аясында бес пациенттен алынды. Қан CC-1 терапиясы басталғанға дейін және 7 күн үздіксіз қолданғаннан кейін алынды: 1-күні 78 мкг, 2-күні 215 мкг және 3-7 күндері күн сайын 826 мкг. Жасушалар Biocoll ерітіндісін қолдану арқылы тығыздық градиенті центрифугасымен бөліп алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PBMC (перифериялық қанның мононуклеарлы жасушалары) — бұл лимфоциттер мен моноциттерден тұратын қан фракциясы, ол иммунологиялық зерттеулерде терапияға жауапты бағалау үшін жиі қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LNCaP және SHP-77 жасушалық желілері DSMZ және ATCC биобанктерінен алынды. LNCaP-E (эндоглин экспрессиялайтын) және LNCaPKO (B7-H3 нокаутты) желілерін жасау үшін лентивирустық трансдукция қолданылды. Культивация 10 мкг/мл пуромицинмен, ал LNCaPKO үшін қосымша 1 мкг/мл генетицинмен жүргізілді. Барлық желілер микоплазманың жоқтығына тұрақты тексерілді.&lt;/p&gt;\n&lt;h4 id=\"endoglinge-kharsy-monoklonaldy-antidenelerdi-alu\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#endoglinge-kharsy-monoklonaldy-antidenelerdi-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эндоглинге қарсы моноклоналды антиденелерді алу&lt;/span&gt;&lt;/a&gt;Эндоглинге қарсы моноклоналды антиденелерді алу&lt;/h4&gt;\n&lt;p&gt;8 апталық BALB/c тышқандары эндоглинмен трансфекцияланған Sp2/0-Ag14 жасушаларымен ішпердеішілік иммунизацияланды. Екі апталық аралықпен төрт ретке дейін иммунизация жасалды, жасушалар біріккенге дейін төрт күн бұрын соңғы бустер жасалды. Спленоциттер PEG 1500 көмегімен Sp2/0-Ag14 миелома жасушаларымен біріктірілді. Гибридомалар HAT ортасында іріктеліп, клондар ағынды цитометрия арқылы тексерілді, субклондалды және криоконсервацияланды.&lt;/p&gt;\n&lt;h4 id=\"bispecifikalykh-antidenelerdi-zhasau-zhaene-tazartu\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bispecifikalykh-antidenelerdi-zhasau-zhaene-tazartu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Биспецификалық антиденелерді жасау және тазарту&lt;/span&gt;&lt;/a&gt;Биспецификалық антиденелерді жасау және тазарту&lt;/h4&gt;\n&lt;p&gt;Эндоглин, B7-H3 және бақылау MOPC-21 үшін вариабельді домендер CHO жасушаларында экспрессия үшін кодон-оңтайландырылды. Fc-функцияларын басу үшін LALA (L234A/L235A) және жартылай ыдырау мерзімін ұзарту үшін YTE (M252Y/S254T/T256E) мутациялары бар IgG1κ қаңқасы қолданылды. CD28 scFv фрагменті глицин-серин байланыстырғышы арқылы жалғанды. «Knob-into-hole» (KiH) құрылымы үшін CH3 доменіне мутациялар енгізілді (knob: T366W; hole: T366S/L368A/Y407V). Тазарту А ақуызының аффинді хроматографиясымен жүргізілді, тазалығы SDS-PAGE және гель-фильтрациямен тексерілді. Эндотоксин деңгейі &amp;lt;0,5 U/мл құрады.&lt;/p&gt;\n&lt;h4 id=\"bajlanysu-kinetikasy-zhaene-affindilik\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#bajlanysu-kinetikasy-zhaene-affindilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысу кинетикасы және аффинділік&lt;/span&gt;&lt;/a&gt;Байланысу кинетикасы және аффинділік&lt;/h4&gt;\n&lt;p&gt;Кинетика мен аффинділік беттік плазмонды резонанс (SPR) және биоқабатты интерферометрия (BLI) әдістерімен өлшенді. Байланысу параметрлері (kon, koff) және диссоциация константалары (K_D) BIAevaluation v4.1 және Octet Data Analysis v11.1 бағдарламаларының көмегімен есептелді. LNCaP-E және Т-жасушаларындағы антигендермен байланысуы ағынды цитометрия (BD FACSCanto II, BD FACSCalibur) арқылы талданды, деректер FlowJo-да өңделді, ал EC₅₀ мәндері GraphPad Prism 9-да есептелді.&lt;/p&gt;\n&lt;h4 id=\"zheke-zhasushalykh-transkriptomikalykh-profildeu-zhaene-esepteu-taldauy\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#zheke-zhasushalykh-transkriptomikalykh-profildeu-zhaene-esepteu-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке жасушалық транскриптомикалық профильдеу және есептеу талдауы&lt;/span&gt;&lt;/a&gt;Жеке жасушалық транскриптомикалық профильдеу және есептеу талдауы&lt;/h4&gt;\n&lt;p&gt;Простата обырымен ауыратын науқастардан алынған PBMC үлгілерін дайындау 10× Genomics Feature Barcode хаттамасына сәйкес жүргізілді. Үлгілерді мультиплекстеу және партия әсерін азайту үшін донорлық жасушалар TotalSeq-C антиденелерімен белгіленді (SN 1-кесте). Жасушалар Chromium X жүйесі арқылы GEMs ішіне капсулаланды. 5′ GEX, TCR (VDJ) және SP кітапханалары Chromium Next GEM Single Cell 5′ HT v2 жиынтықтарымен дайындалды. Секвенирлеу Illumina NovaSeq 6000 платформасында орындалды. Деректерді өңдеу, туралау (GRCh38-202-A) және есептеу Cell Ranger 7.1.0 бағдарламасында, ал визуализация Scanpy 1.11.1 және Seurat көмегімен жүзеге асырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мультиплекстеу әдісі әртүрлі донорлардан алынған жасушаларды бір тәжірибеде біріктіруге мүмкіндік береді, бұл техникалық айырмашылықтарды азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3 жасушадан кем экспрессияланған гендер, сондай-ақ митохондриялық, рибосомалық гендер, lncRNA және псевдогендер талдаудан шығарылды. Кластерлеу Leiden алгоритмі арқылы жүргізілді. Ex vivo және in vitro үлгілері үшін кластерлеу параметрлері: n_pcs 13–25, n_neighbors 25–30, min_dist 0.3–0.5, resolution 0.21–0.63. CD3+ жасушаларын субкластерлеу үшін n_pcs 5–31, n_neighbors 5–15, min_dist 0.45–0.7 және resolution 0.1–0.4 параметрлері қолданылды. DEG-лер Wilcoxon тесті және Benjamini-Hochberg түзетуімен есептелді.&lt;/p&gt;\n&lt;p&gt;GSEA талдауы GSEApy prerank функциясы (2000 ауыстыру) арқылы CD4+ және CD8+ Т-жасушаларындағы 0 және 8-күндер арасындағы функционалдық өзгерістерді бағалау үшін өткізілді. Safford_T_Lymphocyte_Anergie және GSE46242_TH1_VS_ANERGIC_TH1_CD4_TCELL_UP жолдары қолданылды. FDR &amp;lt; 0.05 статистикалық маңызды деп белгіленді. 8-күні жоғары экспрессияланған гендер SN 1-кестеде келтірілген.&lt;/p&gt;\n&lt;h4 id=\"t-zhasushalardyng-proliferaciyasy\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#t-zhasushalardyng-proliferaciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т-жасушалардың пролиферациясы&lt;/span&gt;&lt;/a&gt;Т-жасушалардың пролиферациясы&lt;/h4&gt;\n&lt;p&gt;Моноциттерден тазартылған PBMC bsAbs бар немесе жоқ нысаналы жасушалармен бірге өсірілді. 48 сағаттан кейін 3H-метил-тимидин (0.5 мкКи/ұяшық) қосылып, 20 сағаттан соң радиоактивтілік өлшенді. Сонымен қатар, CellTrace Violet (2 мкМ) қолданылды. 3-күні ісік жасушалары мен bsAbs жаңартылды, пролиферация 4 немесе 6-күні ағынды цитометрия (CD4, CD8, CD45RO, CD62L) арқылы анықталды.&lt;/p&gt;\n&lt;h4 id=\"citotoksikalykh-taldaular\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#citotoksikalykh-taldaular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цитотоксикалық талдаулар&lt;/span&gt;&lt;/a&gt;Цитотоксикалық талдаулар&lt;/h4&gt;\n&lt;p&gt;Нысаналы жасушалардың лизисін анықтау үшін 24 немесе 72 сағаттық өсіруден кейін ағынды цитометрия жүргізілді. Т-жасушалар (CD4, CD8), белсенділік (CD69, CD25) және ісік жасушалары (EpCAM) 7-AAD көмегімен талданды. Калибрлеу шарлары көлемді бақылау үшін пайдаланылды. Нақты уақыт режимінде жою xCELLigence RTCA жүйесімен 120 сағат бойы бақыланды.&lt;/p&gt;\n&lt;h4 id=\"citokin-sekreciyasy\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#citokin-sekreciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цитокин секрециясы&lt;/span&gt;&lt;/a&gt;Цитокин секрециясы&lt;/h4&gt;\n&lt;p&gt;PBMC және ісік жасушаларының 24 сағаттық инкубациясынан кейін IL-2 және IFN-γ деңгейлері Legendplex жиынтықтарымен өлшенді. Науқастың қан плазмасындағы sIL-2R концентрациясы ELISA жиынтығы арқылы анықталды.&lt;/p&gt;\n&lt;h4 id=\"t-zhasushalarynyng-giporeaktivtiligin-in-vitro-taldau\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#t-zhasushalarynyng-giporeaktivtiligin-in-vitro-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T-жасушаларының гипореактивтілігін in vitro талдау&lt;/span&gt;&lt;/a&gt;T-жасушаларының гипореактивтілігін in vitro талдау&lt;/h4&gt;\n&lt;p&gt;T-жасушаларының гипореактивтілігін бағалау үшін сау донорлардың перифериялық қан мононуклеарлы жасушалары (PBMC) ісік жасушаларымен 2:1 қатынасында (E:T) дақылдандырылды. Ортаға TCE (1 нМ) жеке немесе BiCos (0,5 нМ) қосындысымен қосылды. 4-күні орта, ісік жасушалары және антиденелер ауыстырылды. 7-күні PBMC қайтадан ісік нысаналы жасушаларымен (E:T = 1:1) және TCE-мен (BiCos бар немесе жоқ) стимуляцияланды. 10-күні T-жасушаларының пролиферациясы ³H-тимидинді қосу әдісімен, ал CD8⁺ T-жасушаларының белсенуі және ісік жасушаларын жою ағынды цитометрия арқылы бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ағынды цитометрия — лазерлер мен флуоресцентті белгілердің көмегімен мыңдаған жеке жасушалардың физикалық және химиялық сипаттамаларын жылдам анықтауға мүмкіндік беретін талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Науқастардың PBMC беттік маркерлерінің экспрессиясы (SN 1-сурет, C және D) in vitro стимуляциясыз ағынды цитометрия арқылы анықталды. Антиденелер SN 2-кестеде көрсетілген, үлгілер автоматты компенсациясы бар Cytek Aurora спектральды цитометрінде талданды.&lt;/p&gt;\n&lt;h4 id=\"in-vivo-zertteuleri\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#in-vivo-zertteuleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In vivo зерттеулері&lt;/span&gt;&lt;/a&gt;In vivo зерттеулері&lt;/h4&gt;\n&lt;p&gt;Барлық жануарларға жасалған тәжірибелер SPF (арнайы патогендерден таза) жағдайында өткізілді. Жас және жыныс бойынша сәйкестендірілген тышқандар пайдаланылды, олардың денсаулығы күнделікті бақыланды. Белгіленген гуманитарлық шектік нүктелерге жеткенде тышқандар эвтаназияланды. Зерттеуде соқыр әдіс қолданылмады.&lt;/p&gt;\n&lt;p&gt;Фармакокинетиканы бағалау үшін 20 мкг конструкциялар C57BL/6 тышқандарына көктамыр ішіне енгізілді және сарысудағы концентрациялар биолюминесцентті T-жасушалық талдаулар (Promega) арқылы анықталды. Ісікке қарсы белсенділікті бағалау үшін NSG тышқандарының оң жақ бүйіріне диаметрі шамамен 5 мм ісіктерді қалыптастыру үшін firefly люциферазасымен трансдукцияланған LNCaP-E жасушалары тері астына енгізілді. 1, 8 және 15-күндері тышқандарға 1×10⁷ адам PBMC, CC-1 (0,8 мкг) қосындысымен немесе BiCo-1, BiCo-2 немесе изотиптік бақылаумен (20 мкг) көктамыр ішіне енгізілді. Кешіктірілген BiCo топтарында тышқандар 1-күні тек CC-1, 4-күні BiCo-1 немесе BiCo-2, ал 8 және 15-күндері CC-1/BiCo комбинациясын алды. Кешіктірілген комбинацияланған топтарда CC-1 1-күні, ал комбинацияланған терапия 8-күні басталды. Ісіктің өсуі аптасына екі рет бақыланды, диаметрі 15 мм-ге жеткенде эвтаназия жасалды. Биолюминесцентті кескіндер IVIS Lumina II жүйесінде (PerkinElmer) алынды және Living Image бағдарламасы арқылы сандық бағаланды.&lt;/p&gt;\n&lt;p&gt;Уыттылықты бағалау үшін NSG тышқандарына 20×10⁶ адам PBMC, 20 мкг антиденелермен немесе онсыз көктамыр ішіне енгізілді. Сарысудағы цитокиндер деңгейі 24 сағаттан кейін LEGENDplex™ Human Th1 Cytokine Panel (BioLegend) көмегімен өлшенді.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау&lt;/span&gt;&lt;/a&gt;Статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Мәліметтер GraphPad Prism бағдарламасында талданды. Нәтижелер орташа ± стандартты ауытқу (SD) немесе жеке мәндер ретінде ұсынылған. Топаралық салыстыру two-way ANOVA, one-way ANOVA, Стьюдент t-тесті, Уилкоксон тесті немесе Манн-Уитни тесті арқылы жүзеге асырылды. Қалыптылық Шапиро-Уилк тестімен, дисперсия гомогенділігі Браун-Форсайт тестімен тексерілді.&lt;/p&gt;\n&lt;h4 id=\"zertteudi-makhuldau\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#zertteudi-makhuldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеуді мақұлдау&lt;/span&gt;&lt;/a&gt;Зерттеуді мақұлдау&lt;/h4&gt;\n&lt;p&gt;Метастатикалық кастрацияға төзімді простата обырымен ауыратын науқастардың (NCT04104607) және сау донорлардың PBMC үлгілері жазбаша келісім негізінде алынды. Жануарларға жасалған тәжірибелер «3R» қағидаларына және 2010/63/EU директивасына сәйкес өткізілді. Хаттамалар Тюбинген университетінің (M02/22 G) этикалық комитетімен мақұлданды.&lt;/p&gt;\n&lt;h4 id=\"maelimetterding-kholzhetimdiligi\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#maelimetterding-kholzhetimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мәліметтердің қолжетімділігі&lt;/span&gt;&lt;/a&gt;Мәліметтердің қолжетімділігі&lt;/h4&gt;\n&lt;p&gt;Барлық шикі мәліметтер Supporting Data Values файлдарында келтірілген. Бір жасушалы транскриптомикалық мәліметтер GEO (GSE333581) базасында қолжетімді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f1.jpg\" alt=\"1-сурет / TCE монотерапиясы кезіндегі пациенттердің Т-жасушаларының функционалдық бұзылуы мен транскрипциялық қайта бағд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет / TCE монотерапиясы кезіндегі пациенттердің Т-жасушаларының функционалдық бұзылуы мен транскрипциялық қайта бағдарламалануы (A) mCRPC бар пациенттерден алғашқы емдеу цикліне дейін және кейін (сәйкесінше 1 және 8-күндері) PBMC (n=5) жиналды және кез келген уақыт нүктесінің 100 000 жасушасы CC-1 немесе изотипті бақылау антиденесі (CC-iso) (әрқайсысы 1 нМ) қатысуымен LNCaP жасушаларымен (E:T қатынасы 1:1) 72 сағат бойы инкубацияланды, содан кейін функционалдық талдау жасалды. (B-C) Т-жасушаларының пролиферациясы, CD4+ және CD8+ Т-жасушаларының активациясы және IFN-γ бөлінуі сәйкесінше 3H-тимидиннін қосу, ағынды цитометрия және LEGENDplex мультиплексті талдаулары арқылы анықталды (B); LNCaP жасушаларының азаюы ағынды цитометрия көмегімен анықталды (C). Жеке пациенттердің деректерін 1A қосымша суретінен қараңыз. (D) Емдеуге дейін (1, 22, 43, 64-күндер) және кейін (7, 29, 50, 71-күндер) көрсетілген уақыт нүктелерінде алынған үш пациенттің PBMC-лері сәулеленген LNCaP жасушаларымен және CC-1 (1 нМ) инкубацияланды. 72 сағаттан кейін Т-жасушаларының пролиферациясы 3H-тимидиннін қосу арқылы бағаланды. Жеке пациенттердің деректерін 1C қосымша суретінен қараңыз. (E) Бірнеше емдеу циклі кезінде көрсетілген уақыт нүктелерінде CC-1 және еритін интерлейкин-2 рецепторының (sIL-2R) плазмадағы концентрациялары өлшенді және сарысу деңгейлері ИФА арқылы санмен анықталды. Бір репрезентативті пациенттің үлгілік нәтижелері көрсетілген. Екі қосымша пациенттің деректерін 1D қосымша суретінен қараңыз. (F) UMAP арқылы визуализацияланған scRNA секвенирлеу деректерінің Лейден негізіндегі кластерленуі, бастапқы деңгейде (1-күні) және терапиядан кейін (8-күні) жиналған пациенттердің PBMC-леріндегі негізгі иммундық жасуша популяцияларын бейнелейді, олар канондық желілік маркерлерге сәйкес аннотацияланған. UA, тағайындалмаған. (G) Уақыт нүктелері бойынша Т-жасушаларының тыныштық күйіне/анэргиясына, ерте активацияға және метаболикалық реттеугіштерге қатысы бар таңдалған гендердің экспрессия өзгерістерін қорытындылайтын нүктелі графиктер; нүкте өлшемі тиісті гендерді экспрессиялайтын жасушалардың үлесін көрсетеді; түс қарқындылығы орташа экспрессияны көрсетеді. (H) Емдеуге дейінгі үлгілермен (1-күні) салыстырғанда анэргиямен және гипореактивтілікпен байланысты канондық транскрипциялық бағдарламалардың айтарлықтай байытылғанын көрсететін гендер жиынтығын байыту талдауы (GSEA). SAFFORD_T_LYMPHOCYTE_ANERGY жолы (MSigDB) 8-күнгі CD4+ және CD8+ Т-жасушаларында айтарлықтай байытылды. NES, қалыпталған байыту баллы; FDR, жалған ашу жиілігі. (I) Т-жасушаларының субкластерленуі UMAP көмегімен визуализацияланды, бұл терапиядан кейін пайда болатын пролиферативті, эффекторлық тәрізді және гипореактивті популяцияларды қоса алғанда, әртүрлі функционалдық күйлерді анықтады. (J) Емдеуге дейінгі (1-күні) және терапиядан кейінгі (8-күні) Т-жасушалары күйлерінің таралуын иллюстрациялайтын кірістіру тығыздығы графиктер, гипореактивті және пролиферативті емес фенотиптерге қарай жылжуды құжаттайды. Бағанды графиктер әрбір жағдайдағы кластердің таралуын көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f2.jpg\" alt=\"2-сурет / BiCO пішімін таңдау және функционалдық сипаттамасы (A) MOPC-21 мақсатсыз антигеніне бағытталған әртүрлі биспец\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет / BiCO пішімін таңдау және функционалдық сипаттамасы (A) MOPC-21 мақсатсыз антигеніне бағытталған әртүрлі биспецификалық CD28 антидене (bs-CD28) пішімдерінің схемалық көрінісі. Әртүрлі тетравалентті пішіндердің жалпы құрылымы екі бивалентті байланыстырушы бөлікті қамтиды, біріншісі IgG қаңқасының табиғи N-ұшымен түзіледі, екіншісі екі С-соңында біріктірілген бір тізбекті Fv фрагменттерінен (scFvs) тұрады. CD28 байланыстырушы бөлігі табиғи N-кончылық байланыстырушы бөлікті (1 және 2-нұсқалар) немесе С-кончылық scFv бөлігін (3 және 4-нұсқалар) құрайды. С-кончылық scFv бөліктері CH3- (1 және 3-нұсқалар) немесе CL-домендеріне (2 және 4-нұсқалар) біріктірілген. Қаңқа спецификалық емес Fc-гамма рецепторының әсерін болдырмау үшін Fc функциясы өшірілген IgG1k болып табылады. (B) Сәулеленген LNCaP жасушалары CC-1 (25 пМ) және көрсетілген bs-CD28 құрылымдарының (10 нМ) қатысуымен 4:1 E:T қатынасында PBMC (n=8) культивацияланды. Пролиферация үш күннен кейін 3H-тимидиннін қосу арқылы өлшенді. Деректер орташа ± SD түрінде көрсетілген. (C) Сәулеленген LNCaP-E жасушалары CC-1 (25 пМ) және bs-CD28-4 құрылымдарының көрсетілген концентрацияларының (эндоглинге бағытталған Kro22 және Kro23; B7-H3-ке бағытталған 8H8 және 7C4) қатысуымен PBMC (n=2 донор) инкубацияланды. Үш күннен кейін пролиферация 3H-тимидиннін қосу талдауы көмегімен бағаланды. (D) NSG тышқандарына (әр топ үшін n=4) ішіперделік түрде 2×10^7 адамның PBMC және көктамыр ішіне 20 мкг BiCo-1 немесе BiCo-2 жеке немесе 0,8 мкг CC-1 біріктіріліп енгізілді. UCHT1 антиденесі (anti-CD3) оң бақылау ретінде пайдаланылды. Сарысудағы цитокин деңгейлері LEGENDplex көмегімен 24 сағаттан кейін алынған қан үлгілерінде өлшенді. (E) PBMC (n=6) сәулеленген LNCaP-E жасушаларымен және көрсетілген құрылымдармен культивацияланды, содан кейін 3H-тимидиннін қосу арқылы пролиферацияға талдау жасалды. Сол жақта: BiCo-iso, BiCo-1 немесе BiCo-2 (барлығы 0,5 нМ) қатысуымен CC-1 дозасын титрлеу. Оң жақта: CC-1 немесе CC-iso (екеуі ҳам 25 пМ) қатысуымен BiCo-1 және BiCo-2 дозасын титрлеу. Сөрелер кейінгі тәжірибелер үшін таңдалған концентрацияларды көрсетеді. Деректер орташа ± SD ретінде көрсетілген. (F) PBMC (n=5 донор) LNCaP-E жасушаларымен CC-1 (25 пМ, CC-1low) және көрсетілген BiCo молекулаларының (0,5 нМ) қатысуымен 1:1 E:T қатынасында культивацияланды. Нысана жасушаларының азаюы 72 сағаттан кейін ағынды цитометрия көмегімен санмен анықталды. (G) Моноциттерден тазартылмаған PBMC, CC-1 (25 пМ, CC-1low) және BiCo (0,5 нМ) қатысуымен xCELLigence жүйесін пайдалана отырып, LNCaP-E ісік жасушаларының өсуін нақты уақыт режимінде мониторинг жасау. (H) BiCo пішімі A суретінде көрсетілген эндоглинге (BiCo-1) немесе B7-H3-ке (Bico-2) бағытталған бивалентті нысанаға алу бөлігі және бивалентті CD28 байланыстырушы бөлігі (αCD28) бар 4-нұсқадан тұрады. KiH пішімі нысанаға алу бөліктерін (эндоглин немесе B7-H3) және CD28 моновалентті түрде байланыстыратын екі табиғи IgG тізбегінен тұрады. Екі пішімде де қолданылатын эндоглин, B7-H3 және CD28 байланыстырғыштары бірдей. (I) PBMC (n=4 донор) CC-1 немесе изотипті бақылау (CC-iso) (екеуі де 25 пМ) қатысуымен BiCo-1, BiCo-2, KiH-1 немесе KiH-2 көрсетілген концентрацияларымен сәулеленген LNCaP-E жасушаларымен культивацияланды, содан кейін 3H-тимидиннін қосу арқылы пролиферацияға талдау жасалды. Деректер орташа ± SD ретінде көрсетілген. Сөрелер кейінгі тәжірибелер үшін таңдалған концентрацияны көрсетеді. (J-M) CellTrace Violet-пен белгіленген моноциттерден тазартылған PBMC көрсетілгендей CC-1 (25 пМ, CC-1low) және BiCo/KiH (екеуі ҳам 5 нМ) көмегімен LNCaP-E жасушаларымен 1:1 E:T қатынасында культивацияланды. Орта, нысана жасушалар және құрылымдар 4-күні толықтырылды, содан кейін ағынды цитометриялық талдау жасалды. (J) 4 күннен кейін алынған репрезентативті пролиферация профильдері (сол жақ панельдер). Пролиферацияланатын CD4+ Т-жасушалары мен CD8+ Т-жасушаларының бөліну индексі (n=6 донор) FlowJo көмегімен есептелді (оң жақ панельдер). (K-L) 7-күні анықталған CD4+ Т-жасушалары (K) және CD8+ Т-жасушалары (L) үшін репрезентативті tSNE графиктер (сол жақта) және Т-жасушаларының субпопуляцияларының саны (оң жақта) (n=6 донор). (M) Ісік жасушаларын жою 7-күні бағаланды (n=5 донор). (N) C57Bl/6 тышқандарына (әр топ үшін n=4 тышқан) 20 мкг BiCo-1 және BiCo-2 енгізіліп, содан кейін Promega талдауы көмегімен көрсетілген уақыт нүктелерінде сарысу концентрациялары анықталды. (O-P) Бүйірінде орныққан LNCaP-E ісіктері бар NSG тышқандарына (~4 мм диаметрлі) адамның PBMC ауыстырылып, көктамыр ішіне CC-1 (0.8 мкг), BiCo-1, BiCo-2 немесе BiCo-iso (20 мкг) енгізілді; ісік өсуі аптасына екі рет бақыланды. (O) TCE және BiCo көмегімен біріктірілген ем 1, 8 және 15-күндері қолданылды. Күннің репрезентативті биолюминесценция кескіндері (сол жақ панель), штангенциркульмен анықталған ісік мөлшері (оң жақ панель) көрсетілген. Деректер әр топ үшін n=5 тышқанды білдіреді. (P) BiCo емін кешіктіру әсерлерін зерттеу үшін жануарларға 1-күні CC-1, содан кейін 4-күні BiCo қолданылды және 8-күннен бастап біріктірілген ем басталды (кешіктірілген BiCo когорталары); баламалы түрде, тышқандарға 1-күні CC-1, содан кейін 8-күннен бастап біріктірілген ем қолданылды (кешіктірілген CC-1 + BiCo когорталары). Ісік мөлшері штангенциркуль өлшеуі арқылы анықталды. Деректер әр топ үшін n=5 тышқанды білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons-f3.jpg\" alt=\"3-сурет / BiCo көмегімен TCE тудырған Т-жасушалары гипореактивтілігін кері қайтару және алдын алу (A) PBMC пациенттерден\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет / BiCo көмегімен TCE тудырған Т-жасушалары гипореактивтілігін кері қайтару және алдын алу (A) PBMC пациенттерден TCE еміне дейін және кейін (сәйкесінше 1 және 8-күндері) жиналды, ex vivo түрінде тек CC-1 немесе BiCo-мен біріктіріліп инкубацияланды және кейіннен функционалдық талдауға түсірылды. (B) Пациенттерден алынған PBMC (n=5) 1 нМ CC-1 қатысуымен немесе қатысуынсыз 0,5 нМ BiCo-1, BiCo-2 немесе изотипті бақылау (BiCo-iso) көмегімен 1:1 E:T қатынасында LNCaP-E ісік жасушаларымен культивацияланды. 72 сағаттан кейін Т-жасушаларының пролиферациясы 3H-тимидиннін қосу арқылы санмен анықталды, ісік жасушаларын жою ағынды цитометрия көмегімен анықталды. (C) Емге дейін және кейін алынған үш пациенттің PBMC-лері (кейінгі циклдардың 1 және 8-күндері; 1D суретіндегі схеманы қараңыз) тек CC-1 (5 нМ) немесе BiCo-1 (5 нМ) бірге инкубацияланды. 72 сағаттан кейін Т-жасушаларының пролиферациясы 3H-тимидиннін қосу арқылы бағаланды. (D) Терапиядан кейін (8-күні) жиналған және LNCaP-E және 1 нМ CC-1-мен 0,5 нМ BiCo қатысуымен немесе қатысуынсыз in vitro жағдайында 3 күн бойы инкубацияланған пациент PBMC үлгілеріндегі Т-жасушалары популяцияларын бейнелейтін, UMAP арқылы визуализацияланған scRNA-seq деректерінің Лейден негізіндегі субкластерленуі, канондық желілік маркерлерді пайдалана отырып аннотацияланды. Т-жасушалары субкластерленуінің UMAP визуализациясы, әртүрлі функционалдық Т-жасушалары күйлерін ажыратты. (E) Т-жасушаларының активациясына, цитотоксиктікке, пролиферацияға және тыныштық күйіне қатысы бар таңдалған гендердің уақытша экспрессия өзгерістерін қорытындылайтын нүктелі графиктер. Нүкте өлшемі тиісті генді экспрессиялайтын жасушалардың үлесін көрсетеді; және түс қарқындылығы орташа экспрессияны көрсетеді. (F-G) Тек CC-1 немесе CC-1+BiCo көмегімен in vitro өңделген пациенттердің Т-жасушаларының (8-күні) күй таралуындағы жылжуларды суреттейтін тығыздық графиктер (F), пролиферативті фенотиптерге айқын ауысуды көрсетеді. (G) Эксперименттік жағдайларда кластердің таралуын бейнелейтін бағанды графиктер. (H) PBMC (n=4) CC-1 (1 нМ) қатысуымен 1:2 E:T қатынасында LNCaP-E жасушаларымен культивацияланды; созылмалы әсерді имитациялау үшін орта, нысана жасушалар және құрылымдар 4-күні толықтырылды. 7-күні PBMC тек CC-1 (1 нМ) немесе көрсетілген BiCo құрылымдарымен (0,5 нМ) бірге 1:1 E:T қатынасында LNCaP-E жасушаларымен қайта ынталандырылды. 10-күні Т-жасушаларының пролиферациясы 3H-тимидиннін қосу арқылы бағаланды және ісік жасушаларын жою ағынды цитометрия көмегімен бағаланды. (I) PBMC (n=4) CC-1 (1 нМ) қатысуымен немесе қатысуынсыз тек немесе BiCo құрылымдарымен (0,5 нМ) бірге 1:2 E:T қатынасында LNCaP-E жасушаларымен культивацияланды. Орта, нысана жасушалар және құрылымдар 4 және 7-күндері толықтырылды (7-күні LNCaP-E жасушалары E:T қатынасы 1:1). 10-күні Т-жасушаларының пролиферациясы 3H-тимидиннін қосу арқылы бағаланды және ісік жасушаларын жою ағынды цитометрия көмегімен бағаланды. (J) PBMC (n=3) тарталамаб (1 нМ) қатысуымен 1:2 E:T қатынасында SHP-77 жасушаларымен культивацияланды. Орта мен нысана жасушалар 4-күні толықтырылды. Гипореактивтілік индукциясын имитациялайтын 7-күнге дейінгі әсерден кейін, PBMC тарталамаб (1 нМ) қатысуымен немесе BiCo-2 (0,5 нМ) біріктіріліп 1:1 E:T қатынасында SHP жасушаларымен қайта ынталандырылды. Пролиферация 10-күні 3H-тимидиннін қосу арқылы өлшенді, және ісік жасушаларын жою ағынды цитометрия көмегімен бағаланды.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-23/bivalent-bispecific-cd28-antibodies-reinforce-t-cell-respons.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tce терапиясы&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кезінде&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;т-жасушалардың&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әлсіреуі&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рнк&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;секвенирлеу&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және bicos&lt;/text&
