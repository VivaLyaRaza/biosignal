        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"273\" cy=\"167\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"527\" cy=\"189\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     BIOSIGNAL · NEUROSCIENCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ми визуалды қыртыстың терең&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қабаттарында шындықты&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;кейіннен жинақтайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f1.jpg\" alt=\"1-сурет. Эксперименталды парадигма және мінез-құлық нәтижелері. A) Жоғарыда: арасында қосымша дыбысы бар екі аудиовизуал\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Эксперименталды парадигма және мінез-құлық нәтижелері. A) Жоғарыда: арасында қосымша дыбысы бар екі аудиовизуалды стимулдар жұбын көрсету қосымша визуалды стимулды қабылдауға әкеледі; төменде: арасында қосымша жарқылы бар екі аудиовизуалды стимулдар жұбын көрсету осы қосымша жарқылдың басылуына әкеледі (Stiles et al. (5) негізінде бейімделген). B) Қатысушылар екі емес, үш жарқыл көргенін хабарлаған сынақтардың үлесі, әртүрлі жағдайлар үшін бөлек. Жағдайлардың визуалды бейнесін S1 суретінен қараңыз. Қара жолақтар орташа мәннің стандартты қателігін (SEM) білдіреді. *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Қарапайым қабылдау сыртқы әлемнің тікелей көрсетіліміндей көрінгенімен, ми жиі бейнені кейіннен жинақтайды. Ғалымдар дыбыс сигналдары тудыратын визуалды иллюзиялар бастапқы визуалды қыртыстың терең қабаттарының белсенділігін өзгертетінін анықтады. Бұл мидың өткен сигналдарды кейінгі ақпарат негізінде қайта есептейтін постдикция механизмінің бар екенін дәлелдейді. Бұл үрдіске самай аймағынан келетін кері байланыс қатысады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Қабылдау самай қыртысының кері байланысы арқылы кейіннен түзетіледі&lt;/li&gt;\n&lt;li&gt;7Т МРТ көмегімен V1 терең қабаттарындағы сигналдар тіркелді&lt;/li&gt;\n&lt;li&gt;Иллюзорлы жарқылдар V1-де нақты стимулдар сияқты белсенділік үлгілерін тудырады&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Ұзақ уақыт бойы нейробиология негізінен предикцияға — мидың өткен тәжірибеге сүйене отырып болашақты болжау қабілетіне назар аударды. Алайда, бірнеше жүз миллисекунд кешігумен келетін ақпарат бұрын болған стимулды қабылдауды өзгерте алатын постдикция құбылысы да бар. Осы уақытқа дейін бұл түзету ақпаратты өңдеудің қай сатысында болатыны белгісіз еді. Зерттеушілер бұл үшін көп сенсорлы аймақтардан бастапқы визуалды қыртысқа (V1) кері байланыс жауап береді деп болжады.&lt;/p&gt;\n&lt;p&gt;Бұл гипотезаны тексеру үшін ғалымдар дыбыс сигналы жоқ жарқылды тудыратын немесе шын мәніндегі жарқылды басатын екі кросс-модальды иллюзияны қолданды. Тәжірибе барысында 23 қатысушы 7-тесла томографында сканерленді, бұл қыртыстың жеке қабаттарының белсенділігін бөліп алуға мүмкіндік берді. Рецептивті өрістерді картаға түсіру V1 аймағын дәл анықтауға көмектесті.&lt;br /&gt;\n23 қатысушы қатысқан зерттеу нәтижелері көрсеткендей, терең қабаттардағы белсенділік үлгілері шын қабылдауға сәйкес келеді. Байланыс талдауы жоғарғы самай қыртысын кері байланыс көзі ретінде көрсетті. Осылайша, V1 қазіргіні қабылдап қана қоймай, қабылдауды ретроспективті түрде қайта қарауға қатысады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу 23 қатысушыдан тұратын шағын топта жүргізіліп, жасанды аудиовизуалды иллюзиялар қолданылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қабылдаудың ең жұмбақ аспектілерінің бірі – постдикция: кейінгі ақпарат бұрынғы стимулдың қалай қабылданатынын өзгерте алады. Бұл қабылдау сыртқы әлемнің тікелей трансляциясы емес, керісінше ретроспективті реконструкция екенін көрсетеді. Ми қабылдауды қалай қайта қарастырады? Сенсорлық иерархиядағы кері байланысты өңдеу кейінгі ақпарат оған әсер етуі үшін бұрынғы ақпаратты жеткілікті ұзақ уақыт ұстап тұра алады деп болжанған. Біз бұл жоғары деңгейлі мультисенсорлық аймақтардан келетін кері байланысқа бастапқы көру қыртысындағы (V1) бұрынғы визуалды стимулдардың көрінісін өзгертуге мүмкіндік береді деген болжам жасадық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Постдиктивті иллюзиялар V1 терең қабаттарында нақты қабылдауларға ұқсас белсенділік өрнектерін тудырады, бұл жоғары бөлімдерден келетін ретроспективті кері байланысты көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл зерттеуде біз бұл болжамды екі постдиктивті иллюзия көмегімен тексердік, мұнда тонның болуы немесе болмауы елесті жарқылдың қабылдануын немесе шынайы ұсынылған жарқылдың қабылдау тұрғысынан басылуын анықтайды. Бұл бізге ретинотоpлық кеңістіктегі сенсорлық кірістерден елесті қабылдауларды көрсететін нейрондық сигналдарды бөліп алуға мүмкіндік берді. Иллюзияларды бастан өткерген қатысушылардан (N = 23) 7T қабатқа тән фМРТ деректерін жинадық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;7T (Тесла) томографтағы жоғары ажыратымдылықтағы фМРТ ми қыртысының жеке қабаттарындағы белсенділікті ажыратуға мүмкіндік береді, бұл ақпарат ағынының бағытын анықтауға жол ашады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз постдиктивті иллюзиялар нақты қабылдаулар сияқты белсенділік үлгілерін, атап айтқанда V1 терең қабаттарында тудыратынын анықтадық, бұл постдиктивті кері байланысты меңзейді. Ақпараттық байланыс талдаулары бұл кері байланыстың көзі Жоғарғы самай қыртысы (Superior Temporal Cortex, STC) екенін көрсетті. Біз қабылдаудың постдиктивті монтажы V1-де көрініс табады және жоғары деңгейлі сенсорлық қыртыспен кешіктірілген кері байланыс ілмегі арқылы жүзеге асырылады деп қорытынды жасаймыз. Бұл V1-дің қабылдау үдерісіндегі рөлін кеңейтеді: ол осы шақты көрсететін сенсорлық кірістерді және болашақ болжамдарын қабылдаумен қатар, қабылдауды кейіннен қайта қарауға қатысады.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Қабылдау — бұл ми сенсорлық ақпарат пен бұрынғы тәжірибеден алынған болжамдардың комбинациясы негізінде әлемнің қазіргі белгісіз күйін анықтауға тырысатын процесі. Алайда, ми бұл екі ақпарат көзін уақыт бойынша қалай біріктіретіні туралы аз нәрсе белгілі. Ғылыми диалог осы уақытқа дейін негізінен мидың прецеденттік ақпаратты қабылдауға, яғни болжамға қалай біріктіретініне бағытталған еді. Алайда, постдикция — бұл стимулдан кейін бірнеше жүз миллисекунд ішінде келетін ақпарат оның қалай қабылданатынына әсер ететін өзара толықтырушы құбылыс. Постдикция бізге — интуицияға қайшы болса да — біздің қабылдауымыз сыртқы әлемнің тікелей эфирі емес, керісінше мида кейіннен (постфактум) құрылатынын көрсетеді. Постдикцияның нейрондық механизмдерін зерттей отырып, біз мидың саналы тәжірибемізді қалай тудыратынына жарық түсіре аламыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Постдикция қабылдау сыртқы стимулдан кейінгі жүз миллисекундтар ішінде қалыптасатынын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қабылдаудың кейін келетін ақпарат арқылы өзгеруі қалай мүмкін? Сенсорлық өңдеудің қандай da кезеңінде кейінгі ақпараттың ертеректегі сигналдарды қуып жетуіне мүмкіндік беретін кідіріс болуы тиіс, бұл екі көздің де бірігуіне болатын уақыт терезесін жасайды. Бұл кідірісті түсіндіру үшін екі орынды, бірақ әлі тексерілмеген теория ұсынылды. Тікелей байланыс теориясы (feedforward) нейрондардың уақытша интеграция терезесі кортикальды иерархия бойымен артатынына сүйенеді, бұл кейінгі ақпаратқа жоғары тәртіптегі сенсорлық өңдеу аймақтарында (мысалы, самай бөлігінде) ертеректегі сигналдарды қуып жетуге мүмкіндік береді. Екінші жағынан, кері байланыс теориясы кортикальды иерархия төмен қарай қайталанатын кері байланыс ертеректегі сигналдардың бастапқы сенсорлық қыртыста кейінгі ақпараттың әсеріне ұшырауына мүмкіндік беретінін ұсынады. Яғни, бастапқы тікелей ағыннан кейін сенсорлық сигналдар жоғары сенсорлық аймақтардың өзара байланыстарына байланысты кідіріспен бастапқы сенсорлық қыртысқа кері беріледі, бұл кейінгі ақпаратқа оны модульдеуге мүмкіндік береді. Бұл теорияларды ажырату біздің перцептивті тәжірибеміздің кортикальды иерархияда қалай құрылатынын түсінуге көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кортикальды иерархия — бұл мидың ақпаратты қарапайым сезім аймақтарынан күрделірек талдау орталықтарына біртіндеп өткізу құрылымы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екі теорияның маңызды айырмашылықтарының бірі — постдиктивті қабылдаудағы бастапқы сенсорлық қыртыстың рөлі. Атап айтқанда, кері байланыс теориясы бастапқы сенсорлық қыртыс постдиктивті түрде қайта қарастырылған қабылдауды көрсететінін болжайды, ал тікелей байланыс теориясы бұлай болмайтынын болжайды, өйткені интеграция тек кеңейтілген уақытша рецептивті өрістері бар жоғары тәртіптегі сенсорлық аймақтарда орын алады. Постдикция контекстінен тыс, сенсорлық қыртысқа кері байланыс қабылдауды құруда маңызды рөл атқаратыны ұсынылды. Мысалы, бастапқы көру қыртысына (V1) ретинотопиялық тән кері байланыс Каницса иллюзиясының негізі екендігі көрсетілді. Біз сенсорлық қыртысқа кері байланыстың бұл маңызды рөлі постдиктивті қабылдауға да таралады деген гипотезаны алға тарттық.&lt;/p&gt;\n&lt;p&gt;Бұл гипотезаны тексеру үшін біз екі сенімді кросс-модальды постдиктивті иллюзияны қолдандық. Бір иллюзияда көру жарқылының перцептісі басқаша стимуляцияланbaitын ретинотопиялық орында есту стимулы арқылы туындайды, ал екінші иллюзияда ұсынылған жарқыл есту стимулының болмауынан перцептивті түрде басылады (1А-сурет). Біріктірілген бұл иллюзиялар V1-дегі ықтимал постдиктивті сигналдарды зерттеу үшін тамаша сынақ алаңын қамтамасыз етеді, өйткені олар иллюзорлық перцепттерді ретинальды кірістерден толығымен ажыратуға мүмкіндік береді (S1-сурет). Біз бұл иллюзия көпсенсорлық кортикальды аймақтардан (яғни жоғары самай қыртысынан) кері байланыс нәтижесінде V1 терең қабаттарында көрініс табады деп болжадық. Біз бұл гипотезаны иллюзорлық жарқылдың орналасуына бапталу үшін популяциялық рецептивті өріс (pRF) картасын жасаумен біріктірілген ультра жоғары ажыратымдылықтағы 7T фМРТ (0.8 мм воксельдер) көмегімен қабатқа тән BOLD сигналдарын өлшеу арқылы сынадық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу 7T фМРТ және арнайы иллюзияларға негізделген, сондықтан нәтижелерді басқа жағдайларға экстраполяциялау кезінде сақтық таныту қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелерімізді алдын ала баяндай отырып, біз постфактум құрылған перцептивті мазмұн V1 терең қабаттарында көрініс тапқаны туралы дәлелдер таптық, бұл постдикцияның кері байланыс моделін қолдайды. Бұл нәтижелер бастапқы көру қыртысындағы пре-перцептивті сенсорлық ақпараттың перцептивті қорытынды арқылы кейіннен түзетілетініне сәйкес келеді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"minez-khulykh-eksperimentteri-men-nejrovizualizaciya-naetizheleri\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#minez-khulykh-eksperimentteri-men-nejrovizualizaciya-naetizheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлық эксперименттері мен нейровизуализация нәтижелері&lt;/span&gt;&lt;/a&gt;Мінез-құлық эксперименттері мен нейровизуализация нәтижелері&lt;/h4&gt;\n&lt;p&gt;Біз fMRI сканерлеу кезінде екі аудио-визуалды постдиктивті иллюзияны сәтті тудырдық және бақылау шарттарын растадық (1B-сурет). «Иллюзорлы жарқыл» шартында ортаңғы дыбыс сигналы иллюзорлы жарқылды тудырды: қатысушылар тек екі жарқыл көрсетілгеніне қарамастан, 0,83 ± 0,04 (орташа ± орташа қателік) жағдайда үш жарқыл туралы хабарлады. Бұл үлес қосымша дыбыссыз әрекеттерге (яғни «Жарқылсыз» шарты, 0,08 ± 0,02; W(22) = 3,615, p &amp;lt; 0,001) қарағанда айтарлықтай жоғары болды. Екінші иллюзорлы шартта, «Басылған жарқыл», дыбыстың болмауы нақты жарқылды қабылдауды басты: үш жарқыл туралы тек 0,25 ± 0,07 жағдайда хабарланды, бұл үш жарқыл және үш дыбыс болған әрекеттерге (яғни «Нақты жарқыл» шарты, 0,92 ± 0,03; W(22) = 3,601, p &amp;lt; 0,001) қарағанда айтарлықтай аз. Қатысушылар өздерінің нақты да, иллюзорлы да қабылдауларына өте сенімді болды (S2-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мінез-құлық тесттері иллюзияларды тудырудың тиімділігін растады: «Иллюзорлы жарқыл» шартында қатысушылар 83% жағдайда екеуінің орнына үш жарқыл көрді, ал «Басылған жарқыл» шартында нақты жарқылдарды қабылдау 25%-ға дейін басылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз бұл постдиктивті иллюзиялар V1 қабаттарындағы BOLD-белсенділік өрнектерінде көрінетінін анықтауға тырыстық. Әрбір постдиктивті иллюзия үшін біз «қабылдау өрнектерінің ұқсастығын» есептедік, бұл иллюзия тудырған BOLD-белсенділік өрнегі мен сәйкес нақты қабылдау тудырған белсенділік өрнегі (яғни «Иллюзорлы жарқыл» × «Нақты жарқыл» және «Басылған жарқыл» × «Жарқылсыз») арасындағы корреляция ретінде анықталады, одан сәйкес ретиналды кіріс тудырған өрнекпен корреляция алынып тасталады (яғни «Иллюзорлы жарқыл» × «Жарқылсыз» және «Басылған жарқыл» × «Нақты жарқыл»; визуализация үшін 1A-суретті қараңыз). Бұл көрсеткіш иллюзия тудырған белсенділік бір нәрсені қабылдауға (қабылдау өрнектерінің ұқсастығы &amp;gt; 0) немесе тор қабыққа бірдей кіріс сигналын алуға (қабылдау өрнектерінің ұқсастығы &amp;lt; 0) көбірек ұқсайтынын сандық бағалады. Біз бұл көрсеткішті екі иллюзия үшін де есептедік, талдауды иллюзорлы орналасуда (яғни ортаңғы жарқыл орнында) рецептивті өрісі бар V1 воксельдерімен шектедік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BOLD-сигнал (Blood-Oxygen-Level-Dependent) — қандағы оттегі деңгейінің өзгеруіне негізделген ми белсенділігінің көрсеткіші. Қабылдау өрнектерінің ұқсастығы ми адам «көріп отырған» нәрсені (иллюзияны) кодтап жатыр ма, әлде физикалық түрде тор қабыққа түсіп жатқан нәрсені кодтап жатыр ма, соны түсінуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл талдау постдиктивті иллюзиялар V1-дің әртүрлі қабаттарына әртүрлі әсер ететінін көрсетті («Қабат» және «Иллюзия түрі» факторларымен екі факторлы дисперсиялық талдау, қабаттың негізгі әсері: F(1,21) = 4,588, p = 0,016; 2A-сурет). Атап айтқанда, қабылдау өрнектерінің ұқсастығы ортаңғы қабаттарға қарағанда терең қабаттарда күштірек болды (t(21) = 2,735, p = 0,012). Басқа қабаттарды салыстырулар айтарлықтай болмады (терең және беткі: t(21) = 1,755, p = 0,093; ортаңғы және беткі: t(21) = 1,489, p = 0,151). Қорытындылай келе, тек терең қабаттар қабылдау өрнектерінің ұқсастығының айтарлықтай оң әсерін көрсетті (бір жақты t-тест, t(21) = 2,027, p = 0,028; 2-сурет), ал басқа қабаттарда бұл қабылдау әсері болмады (ортаңғы: t(21) = -1,516, p = 0,144; беткі: t(21) = 0,414, p = 0,683), бұл постдиктивті иллюзияны қабылдау терең қабаттың белсенділігіне әсер ететінін дәлелдейді. Бұл әсер бақылау ретинотопиялық орналасуына бапталған V1 воксельдерінде болмады (барлық қабаттар p &amp;gt; 0,05; 2B-сурет). Бұл әсерлі нәтиже V1-дің терең қабаттары ретиналды кірістерді көрсетуден гөрі, постдиктивті түрде қорытындыланған қабылдауларды бейнелейтінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;V1-дің терең қабаттары қабылдау өрнектерінің айтарлықтай ұқсастығын (p=0,028) көрсетеді, бұл физикалық стимул емес, иллюзорлы қабылдау кодталып жатқанын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екі иллюзия V1 белсенділігіне әсері бойынша айтарлықтай ерекшеленбеді (ANOVA, «Иллюзия түрі» негізгі әсері: F(1,21) = 2,457, p = 0,132; «Қабат» және «Иллюзия түрі» арасындағы өзара әрекеттесу: F(1, 21) = 1,999, p = 0,148), бұл постдиктивті иллюзорлы жасалу және жарқылдарды басу V1 белсенділігін ұқсас дәрежеде модуляциялағанын көрсетеді. Яғни, екі жағдайда да V1 терең қабатының белсенділігі тор қабықта ұсынылған стимулға қарағанда қабылданған стимулға көбірек ұқсас болды. Бұны бақылау үшін біз екі иллюзия нәтижелерін бөлек талдадық. Күтілгендей, «Иллюзорлы жарқыл» шартында V1 терең қабаттарындағы белсенділік «Нақты жарқыл» тудырған белсенділікке «Жарқылсыз» тудырған белсенділікке қарағанда көбірек ұқсас болды (бір жақты t-тест: t(22) = 1,814, p = 0,042; 3A-сурет). Бұл әсер терең қабаттарда ортаңғы қабаттарға қарағанда күштірек болды (t(22) = 3,644, p = 0,001). Ортаңғы қабаттарда қарама-қарсы бағытта үрдіс байқалды (екі жақты t-тест: t(22) = -2,045, p = 0,053), бұл ортаңғы қабаттар тікелей сенсорлық сигналдарды (feedforward) қабылдайтынымен, бірақ кері байланыс (feedback) сигналдарын қабылдамайтынымен сәйкес келеді. Беткі қабаттардағы белсенділік өрнектері қабылдау және ретиналды ұқсастықты нақты ажырата алмады (t(22) = 0,108, p = 0,457), мүмкін олар тікелей және кері байланыс сигналдарының қоспасын қамтитындықтан (Талқылауды қараңыз). Маңыздысы, бұл әсерлер иллюзорлы жарқыл орнындағы рецептивті өрісі бар воксельдерге тән болды және фиксациядан жоғары бақылау аймағындағы рецептивті өрісі бар воксельдерде болмады (барлық қабаттар p &amp;gt; 0,05; 3B-сурет).&lt;/p&gt;\n&lt;p&gt;Біз «Басылған жарқыл» сынақтарында да сондай талдау жасадық (4-Сурет). Бұл жағдай біздің гипотезаларымызды екі себеп бойынша қатаң түрде тексеруді қамтамасыз ететінін атап өткен жөн. Біріншіден, перцепттің иллюзорлық жоқтығы торға түсетін кіріс, яғни күшті төменнен-жоғарыға (bottom-up) ағын болған кезде пайда болады және V1-дегі нейрондық сигналдар Иллюзорлық жарқыл жағдайындағыдай «таза» инференциалды сигнал емес, торлы қабық кірістері мен перцептивті жоқтықтың қоспасы болып табылады. Екіншіден, бұл иллюзия онша күшті емес еді, сынақтардың 77%-нда сәтті болды (иллюзорлық жарқыл сынақтарындағы 83%-бен салыстырғанда; χ²(2391) = 24.83, p &amp;lt; .001). Шын мәнінде, бір қатысушы басылған жарқыл иллюзияларының жеткіліксіз санына байланысты бұл талдаудан шығарылуы керек еді (Әдістерді қараңыз). Оған қарамастан, біз V1 терең қабаттарындағы белсенділік үлгілері ортаңғы жарқыл ұсынылмаған сынақтардағыларға қарағанда (яғни, екі жарқыл және екі дыбыстық сигнал, ұқсас перцептивті нәтиже) ортаңғы жарқыл ұсынылған сынақтардағыларға қарағанда (яғни, үш жарқыл және үш дыбыстық сигнал, бірдей торлы қабық кірісі; бір жақты t-тест: t(21) = 1.926, p = .034; 4A-Сурет) көбірек ұқсас екенін анықтадық. Бұл әсер, қайтадан, бақылау орнына бағытталған терең қабат воксельдерінде байқалмады (барлық қабаттар p &amp;gt; .05; 4B-Сурет). Ортаңғы және беткі қабаттар да осындай әсер көрсетпеді (ортаңғы: t(21) = .516, p = .695; беткі: t(21) = -0.568, p = .288), ал ортаңғы қабаттар беткі немесе терең қабаттардан айтарлықтай ерекшеленбеді (терең және ортаңғы: t(21) = -1.682, p = .107, беткі және ортаңғы: t(21) = -0.945, p = .356).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;V1 терең қабаттарында басылған жарқыл кезіндегі белсенділік үлгілері торлы қабық стимулының болуына қарамастан, жарқыл жоқ жағдайға ұқсас болды (t(21) = 1.926, p = .034).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл үлгі ұқсастығы әсерлері веридикалық перцепттер сияқты қыртыстың бірдей аймағын белсендіретін иллюзорлық перцепттерден туындай ма? Мұны тексеру үшін біз жалпы BOLD амплитудасы (белсенділік үлгілері емес) иллюзорлық перцепттердің әсеріне ұшырағанын зерттедік (S3-Сурет). Біріншіден, біз «Иллюзорлық жарқыл» жағдайы «Жарқыл жоқ» бақылау жағдайымен салыстырғанда BOLD белсенділігін арттыратынын тексerdik — тағы да, тек рецептивті өрісі ортаңғы жарқылдың орналасқан жерін қамтитын воксельдер үшін. Біз мұның дәлелін таппадық («Иллюзорлық жарқыл» &amp;gt; «Жарқыл жоқ»: t(22) = -.316, p = .623; S3A-Сурет), ал нақты жарқыл BOLD белсенділігін арттырды («Нақты жарқыл» &amp;gt; «Жарқыл жоқ»; t(22) = 2.184, p = .02) — бұл біздің тәсіліміздің дұрыстығын растайды. Керісінше, егер қабылдау жалпы BOLD амплитудасында көрініс тапса, «Басылған жарқыл» жағдайы «Жарқыл жоқ» жағдайы сияқты «Нақты жарқылға» қарағанда төменірек BOLD амплитудасын тудыруы керек. Біз бұл жерде де қабылдау арқылы басқарылатын амплитуданың өзгеруінің дәлелін таппадық («Басылған жарқыл» &amp;lt; «Нақты жарқыл»: t(21) = -1.306, p = .897). Сондай-ақ үлгі ұқсастығы әсерлері бар терең қабаттарда BOLD-тың жоғары немесе төмен реттелуінің дәлелдері болған жоқ (S3B-Сурет; «Иллюзорлық жарқыл» &amp;gt; «Жарқыл жоқ»: t(22) = -1.076, p = .853; «Басылған жарқыл» &amp;lt; «Нақты жарқыл»: t(21) = -.907, p = .187; S3-Сурет). Жиынтықтай келгенде, нәтижелер субъективті қабылдау белсенділік үлгілерінде көрініс тапқанын, бірақ сигналдың жалпы амплитудасында көрінбегенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BOLD амплитудасы — мидағы оттегімен қаныққан қан деңгейінің өзгеруі, ол аймақтағы жалпы нейрондық белсенділікті көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Терең қабаттардағы бұл үлгі ұқсастығы әсерлерін жалпы BOLD амплитудасы әсерінің болмауымен қалай үйлестіруге болады (3D және 4D-Сурет)? «Иллюзорлық жарқыл» жағдайына назар аударсақ, ықтимал түсіндірмелердің бірі иллюзорлық жарқылдың екі жағынан да тежелумен (мысалы, латеральды тежелуге байланысты) қоршалған, нақты иллюзорлық жарқыл орналасқан жерге бағытталған воксельдерде нейрондық сигналдың артуына әкелуі мүмкін екендігі болуы мүмкін. Бұл екі нақты жарқыл арасындағы аймақта таза нөлдік сигналға әкелуі мүмкін, сонымен бірге ретотопикалық дәл иллюзия тудыратын белсенділікті сақтайды. Егер бұл дұрыс болса, иллюзия тудыратын BOLD амплитудасы мен воксельдің рецептивті өрісі орталығының V1 терең қабаттарындағы иллюзорлық жарқыл орналасқан жерге дейінгі қашықтығы арасында теріс корреляция байқалуы керек еді. Біз бұл пост-hoc гипотезаны BOLD амплитудасы мен ортаңғы жарқыл орналасқан жердің орталығы мен воксельдердің pRF орталығы арасындағы абсолютті көлденең қашықтық арасындағы корреляцияны есептеу арқылы сынадық. Шынында да, біз V1 терең қабаттарында Иллюзорлық жарқыл жағдайы үшін теріс корреляцияны (r = -.11), ал Жарқыл жоқ жағдайы үшін таба алмадық (r = -.01) (Иллюзорлық жарқыл мен Жарқыл жоқ; t(22) = 1.840, p = .039). Post-hoc болғанына қарамастан, бұл нәтижелер иллюзияның тежелумен қоршалған жоғары ретотопикалық спецификалық нейрондық белсенділікті тудыратынына сәйкес келеді [15, 23].&lt;/p&gt;\n&lt;p&gt;V1 аймағындағы бұл кері байланыс тудырған белсенділіктің көзі мидың қай аймағы болуы мүмкін? Жоғарғы самай қыртысы (STC) мультилингвальды интеграциядағы рөлі және постдикциядағы болжамды рөлі ескеріле отырып, негізгі үміткер болып табылады. Біз сондай-ақ болжамды тізбектерді көрсетудегі рөлін ескере отырып, гиппокампты қосымша зерттеу нысаны ретінде қарастырдық. Сынақтар барысында аймақтар арасында перцептивті ақпараттың бөлісетінін анықтау үшін ақпараттық байланыстылықты есептедік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ақпараттық байланыстылық — мидың әртүрлі бөліктеріндегі белсенділік өрнектерінің нақты стимулдар деңгейінде өзара қаншалықты байланысты екенін бағалауға мүмкіндік беретін фМРТ талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таңқаларлықтай, «Жалған жарқыл» шарты үшін жоғарғы самай қыртысындағы перцептивті өрнектің ұқсастығы жарқыл тізбегінің орналасуына, яғни үш жарқыл орнына бағытталған ортаңғы қабаттарға қарағанда, V1 терең қабатының воксельдерімен көбірек ковариацияланғанын анықтадық (екі жақты t-тест; t(22) = 2,562, p = 0,018; 5A сурет). Бұл бақылау ретинотопикалық орналасуына қатысты болмады (екі жақты t-тест; t(22) = -1,251, p = 0,225; 5B сурет). Бұл әсер беткі қабаттар үшін айтарлықтай байқалмады («123 жарқылы», беткі және ортаңғы қабаттар: t(22) = 1,659, p = 0,112; бақылау: t(22) = -0,654, p = 0,519).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жоғарғы самай қыртысы жалған жарқылдар туралы ақпаратты дәл V1 терең қабаттарына тасымалдайды (t(22) = 2,562, p = 0,018), бұл кері байланыс гипотезасын растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл нәтиже STC апостериорлы түрде қорытылған жалған жарқылдар туралы ақпаратты V1-ге қайта жіберетіні туралы гипотезаға сәйкес келеді. Бұл әсер «Басылған жарқыл» иллюзиясы үшін болмағанын атап өткен жөн («123 жарқылы»: терең мен ортаңғы және беткі мен ортаңғы үшін p &amp;gt; 0,05; бақылау: терең мен ортаңғы және беткі мен ортаңғы үшін p &amp;gt; 0,05), бұл иллюзияға сезімталдықтың төмендігімен және осы шартта жоғарыдан төмен және төменнен жоғары сигналдардың айқын бөлінбеуімен байланысты болуы мүмкін (жоғарыны қараңыз). Сондай-ақ иллюзия кезінде V1 мен гиппокамп арасында қабатқа тән ақпараттық байланыстылық байқалмады («123 жарқылы» терең және ортаңғы: t(21) = 0,566, p = 0,578; «123 жарқылы» беткі және ортаңғы: t(21) = 1,265, p = 0,220).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл әсер басқа иллюзия түрінде («Басылған жарқыл») байқалмады, бұл нәтижелердің эксперимент параметрлеріне және иллюзияның көріну күшіне тәуелді екенін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Бұл зерттеуде біз постдикцияның нейрондық механизмдерін — стимулды қабылдау кейінгі ақпараттың әсерінен қалыптасатын құбылысты зерттедік. Біз постдиктивті иллюзиялар V1 терең қабаттарында шынайы қабылдау тудыратындарға ұқсас белсенділік үлгілерін тудыратынын анықтадық (эквивалентті торғабықтық кіріске қарама-қарсы). Бір қызығы, бұл екі қарама-қарсы постдиктивті эффект үшін де орын алды: жарқылдарды тудыру және басу — бұл нейрондық механизмнің әмбебаптығын растайды. Постдиктивті эффекттер тек иллюзорлы жарқыл орналасқан жерге бағытталған воксельдерде көрініс тауып, иллюзорлық перцепттердің ретотопиялық ерекше нейрондық коррелятын көрсетті. Бұл эффект V1 ортаңғы қабаттарында болмады, бұл ортаңғы қабаттар негізінен төменнен жоғарыға қарай торғабықтық кірісті алатыны және жоғарыдан төмен кері байланыстан тыс қалатыны туралы фактіге сәйкес келеді.&lt;/p&gt;\n&lt;p&gt;Эффект кері байланыс сигналдарын алатын беткі қабаттарда да айтарлықтай байқалмады. Жоғарыда талқыланғандай, сигнал тікелей кірістермен сұйылтылуы мүмкін екендігінен басқа, мұнда зерттелген кері байланыс түрі салыстырмалы түрде қашықтағы көздерден келетіндіктен, әсіресе кортикальды терең қабаттарға бағытталған болуы мүмкін, бұл болжау, бетті толтыру және ментальды бейнелер сияқты басқа кері байланыс сигналдары үшін хабарланған. Балама ретінде, терең қабат нейрондары перцептивті гипотезаларды (бұл жағдайда болжанған визуалды жарқылдарды) ұсынады, ал беткі қабат нейрондары осы гипотезалар мен кірістер арасындағы сәйкессіздіктерге (бұл жағдайда болжанған және ұсынылған жарқылдар арасындағы айырмашылыққа), яғни болжам қателеріне жауап береді деп болжанады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Постдиктивті эффекттер бірінші реттік көру қыртысының (V1) терең қабаттарында көрініс тауып, ретотопиялық орналасуға байланысты болады, бұл жалпы сигнал амплитудасының өзгеруіне емес, ақпаратты төменге қарай өңдеуге дәлел болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Визуалды стимулдарды ұсыну әдетте сенсорлық қыртыста нейрондық белсенділіктің шыңына әкеледі, бұл ағымдағы зерттеуде ұсынылған нақты жарқылдар үшін расталды. Алайда, мұнда зерттелген иллюзорлық перцепттер үшін қабылдау мен нейрондық белсенділік үлгісі арасында тығыз байланыс болды, бірақ оның жалпы амплитудасында емес. Бұл нәтиже тұрақты қабылдау жауап амплитудасында емес, нейрондық белсенділік үлгілерінде көрінетінін көрсететін интракраниальды ЭЭГ зерттеулеріне сәйкес келеді. Айта кету керек, пост-хок талдау V1-дегі иллюзорлы жарқыл тудырған белсенділік үлгісі шын мәнінде жоғары кеңістіктік ерекшелігі бар амплитуданың жоғарылауын көрсетуі мүмкін екенін анықтады, бірақ торғабық арқылы ұсынылған жарқылға қарағанда сирегірек кодталған және тежелумен қоршалған болуы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЭЭГ — бас сүйегіне қойылған датчиктер арқылы мидың электрлік белсенділігін миллисекундтық дәлдікпен өлшейтін әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл нәтижелер V1-ді торғабық арқылы келетін сенсорлық ақпаратты өңдейтін және оны жоғары деңгейлі көру аймақтарына жіберетін пассивті белгілерді экстрактор ретіндегі дәстүрлі көзқарастаن түбегейлі ерекшеленеді. Соңғы онжылдықтардағы көптеген дәлелдер V1 белсенділігі назар мен күту сияқты жоғарыдан төмен процестермен модуляциялануы мүмкін екенін көрсетті. Алайда, бұл жұмыс тек дайындық кері байланыс процестері ерте нейрондық жауаптарды қалай модуляциялайтынына бағытталған болатын. V1 үшін постдиктивті кері байланыс рөлін көрсететін біздің нәтижелеріміз оның бастапқы тура ағыннан тыс, сенсорлық өңдеудің кеш сатысында перцептивті қорытындыға қатысуын жалғастыратынын болжайды. Бұл рөл ерте көру қыртысы торғабықтық стимуляция болмаған жағдайда да визуалды перцептивті тәжірибені мұқият қадағалайтынын көрсетеді.&lt;/p&gt;\n&lt;p&gt;Ашық сұрақтардың бірі — V1 қабылдаудың уақытша тәртібін де көрсете ме. Иллюзорлы жарқыл барлық нақты жарқылдар (және үндер) өңделгеннен кейін ғана анықталғанымен, ол екінші үнмен бір уақытта және үшінші үн-жарқыл жұбының алдында орын алатындай қабылданады. Бұл өңдеу уақыты мен қабылдау уақыты арасындағы айырмашылыққа әкеледі. фМРТ уақытша ажыратымдылығының жоқтығын ескере отырып, біз қазір бұл уақыт шкалаларының қайсысы V1-де көрінетінін айта алмаймыз. ЭЭГ/МЭГ сияқты уақыт бойынша шешілген әдістерді қолданатын болашақ зерттеулер V1-дегі белсенділік қабылдау уақытын немесе өңдеу уақытын — немесе екеуін де көрсететінін тексеруі тиіс.&lt;/p&gt;\n&lt;p&gt;Біз қыртыс иерархиясында жоғары орналасқан көп сенсорлық аймақтар аудиовизуалды сигналдарды біріктіреді және болжамды кодтауға ұқсас түрде пост-хок перцептивті қорытынды нәтижесінде алынған ақпаратты V1-ге қайтарады деп болжадық. Оған сәйкес, біз STC және V1 терең қабаттарындағы перцептивті үлгі ұқсастығы бірге ауытқитынын анықтадық, бұл STC шын мәнінде V1-ге постдиктивті түрде анықталған ақпаратты жібере алатынын, ерте сенсорлық көріністерді қайта қарастыратынын білдіреді. STC көп сенсорлық интеграциядағы рөлін ескере отырып, осы функцияны орындау үшін қолайлы орында орналасқан. Аудиовизуалды болжамдарға қатысуымен қатар, бұл сенсорлық кірісті бағалау және жаңарту рөлін көрсетеді.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Постдиктивті эффекттер қабылдау шындықтың тікелей эфирі емес, керісінше пост-хок монтаж екенін көрсетеді. Мұнда біз бұл монтаж жоғары деңгейлі көп сенсорлық қыртыстан келетін кері байланыс нәтижесінде бірінші реттік көру қыртысындағы нейрондық көріністерге әсер ететінін көрсетеміз. Осылайша, бұл зерттеу біздің қоршаған әлем туралы субъектілі тәжірибеміз кеңістік пен уақыттағы перцептивті қорытынды арқылы қалай құрылатынына жарық түсіреді.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"khatysushylar\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#khatysushylar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қатысушылар&lt;/span&gt;&lt;/a&gt;Қатысушылар&lt;/h4&gt;\n&lt;p&gt;Қалыпты көру және есту қабілеті бар екі жынысты жетпіс бес ерікті жазбаша түрде хабардар етілген келісім беріп, зерттеуге қатысты. Мінез-құлық скринингінен кейін қатысушылар бақылау сынақтарында 85%-дан аз дұрыс жауап берсе немесе индукцияланған иллюзияға сезімталдығы 40%-дан аз болса, зерттеуден шығарылды. Жиырма төрт қатысушы нейровизуализация сессиясы кезінде сканерленді. Нейровизуализациядан кейін қатысушылар, егер олар функционалдық көлемдер арасында 1 мм немесе одан да көп болатын 10-нан аспайтын бас қозғалысының қатаң критерийлеріне сәйкес келмесе, зерттеуден шығарылды. Егер қатысушыларда белгілі бір иллюзия үшін сканерлеу барысында оннан астам сәтті иллюзия болмаса, қатысушы сол иллюзияны талдаудан шығарылды. Жиырма үш қатысушы (төртеуі ер адам, орташа жасы 23,6 ± 4,0 жас) осы критерийлерді қолдана отырып «Иллюзиялық жарқыл» (Illusory Flash) иллюзиясын талдауға қосылды, бұл ретте біреуі бас қозғалысына байланысты шығарылды. Жиырма екі қатысушы «Басылған жарқыл» (Suppressed Flash) иллюзиясын талдауға қосылды, өйткені тағы бір қатысушы сканерде осы иллюзия үшін иллюзиялық сезімталдық шегіне жетпеді. Қатысушылар өз уақыты үшін сағатына 12 фунт стерлинг мөлшерінде ақшалай өтемақы алды. Зерттеу UCL Зерттеу этикасы комитетімен мақұлданды.&lt;/p&gt;\n&lt;h4 id=\"stimuldar\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#stimuldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Стимулдар&lt;/span&gt;&lt;/a&gt;Стимулдар&lt;/h4&gt;\n&lt;p&gt;Стимулдар MATLAB 2019a (MathWorks, Natick, MA, USA) және Psychophysics Toolbox Version 3 көмегімен жасалды.&lt;/p&gt;\n&lt;p&gt;Мінез-құлық скринингі кезінде қатысушылар компьютер алдында отырды, онда стимулдар Dell Optiplex 3070 мониторында көрсетілді. Операциялық жүйе: Windows 10 64-бит. Монитор: 1920 × 1200 рұқсаты және 60 Гц жаңарту жиілігі бар Dell UltraSharp U2415. Дыбыс компьютердің екі жағындағы екі динамик арқылы берілді.&lt;/p&gt;\n&lt;p&gt;МРТ сканерінде визуалды стимулдар Epson EB-L1100U проекторы (1920 × 1200 рұқсаты, 355 x 220 мм, 60 Гц жаңарту жиілігі) көмегімен сұр фонда артқы проекция экранында көрсетілді. Қатысушылар визуалды дисплейді бас катушкасына орнатылған айна арқылы 113 см қашықтықтан бақылады, нәтижесінде көру өрісі көлденеңінен 17,9° және тігінен 11,1° болды. Etymotic Ear-Tone ER3A жүйелері МРТ ортасында есту стимулдарын ұсыну үшін бейімделді. Біз есту стимулдарының дыбыс деңгейін қатысушылар сканер шуының фонында оларды анық ести алатындай және қатты дыбыстан ыңғайсыздық сезбейтіндей етіп реттедік. Біз аудиовизуалды стимулдарды көрсету уақытын осциллограф көмегімен тексердік.&lt;/p&gt;\n&lt;p&gt;Стимулдар [5]-тен бейімделді. Визуалды стимулдар қою сұр фондағы ақ тіктөртбұрыштар (немесе «жарқылдар») болды, олар нысана пішіндес фиксация нүктесінен 4,3° төмен көрсетілді. Жарқылдардың әрқайсысының бұрыштық өлшемі 0,28° × 1,2° (ені × ұзындығы) болды. Жарқыл орталықтары арасындағы көлденең қашықтық 2,13° құрады және жарқылдар солдан оңға қарай 16,6 мс ұзақтықта, арасында 52 мс үзіліспен кезектесіп көрсетілді. Есту стимулдары шаршы толқынмен модуляцияланған, әрқайсысы 10 мс болатын 800 Гц жиіліктегі тондар болды. Есту тондары МРТ сканерінде қолданылатын проектордың көрсету кідірісін ескере отырып, визуалды жарқылдармен синхронды түрде ұсынылды. Стимулды көрсету алдында 100 мс терезе фиксация нысанасының орталық нүктесін ашық сұрдан қою сұрға өзгертіп, қатысушыны ескертті. Стимулды көрсеткеннен кейін қатысушылар әр сынақта екі немесе үш жарқыл көргенін және жауаптарына қаншалықты сенімді екенін (4: өте сенімді, 3: айтарлықтай сенімді, 2: онша сенімді емес, 1: мүлдем сенімді емес) хабарлау үшін 2000 мс уақытқа ие болды. Жауап беру үшін визуалды нұсқаулар берілмеді, оның орнына олар алдын ала оқытылды және осылай жауап беруге нұсқау алды. Егер жауаптардың бірі болмаса, нысананың орталық нүктесі қысқа уақытқа қызыл түспен жыпылықтады. Соңында, орталық нүкте сынақтың аяқталғанын көрсету үшін ашық сұр түске айналды. Келесі сынақ алдында 1600 мс, 3100 мс немесе 4600 мс (сәйкесінше 50%, 30% және 20% ықтималдық) болатын джиттерлі сынақаралық интервал (ITI) болды.&lt;/p&gt;\n&lt;h4 id=\"eksperimentaldy-dizajn\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#eksperimentaldy-dizajn\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименталды дизайн&lt;/span&gt;&lt;/a&gt;Эксперименталды дизайн&lt;/h4&gt;\n&lt;p&gt;Біз жарқылдарды дыбыстармен біріктіру арқылы екі өзара толықтырушы аудиовизуалды иллюзияны тудыру үшін «Аудиовизуалды қоян» (Audiovisual Rabbit) парадигмасын [5] қолдандық (1-сурет). Иллюзиялардың ортақ белгісі — сәтті орындалған кезде екінші дыбыс сигналының болуы немесе болмауы нені көріп тұрғанын анықтайды. [5] жұмысында осы иллюзиялардың постдиктивті табиғаты көрсетілген; мысалы, иллюзия тек үшінші дыбыс сигналы ұсынылғанда ғана пайда болады, ал иллюзиялық жарқыл екінші дыбыс сигналымен бір уақытта қабылданады, ал үшінші жарқылдың орналасуы иллюзиялық екінші жарқылдың орналасуын анықтайды. Бұл иллюзиялар иллюзия тудырған нейрондық белсенділікті кез келген ретиналды ақпараттан, әсіресе ешқандай сәйкес ретиналды кіріссіз қабылданған иллюзиялық жарқылдан бөліп алуға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Постдикция — бұл оқиғаны қабылдау кейінгі стимулдың әсерінен өзгеретін құбылыс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз 2x2 дизайнында сенсорлық кіріс пен қабылдауды ортогоналдау үшін екі бақылау шартын қостық (SN-сурет). Бір шартта ортаңғы жарқыл мен ортаңғы тон алынып тасталды, тек екі жарқыл-дыбыс жұбы («Жарқыл жоқ» / No Flash) ұсынылды, ал басқа бақылау шартында үш жарқыл-дыбыс жұбы («Нақты жарқыл» / Real Flash) ұсынылды.&lt;/p&gt;\n&lt;h4 id=\"procedura\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#procedura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процедура&lt;/span&gt;&lt;/a&gt;Процедура&lt;/h4&gt;\n&lt;p&gt;Қатысушылар бірінші күні мінез-құлық тәжірибесі мен скрининг сессиясын аяқтады. Мұнда қатысушылар компьютер экранындағы нұсқауларды оқыды, олар иллюзияларды ашпастан эксперименттің мақсатын түсіндірді: экран ортасына қарап, жарқылдарға назар аудару. Барлық төрт шарт бірдей жиілікте, псевдокездейсоқ тәртіпте араластырылып ұсынылды. Қатысушылар 32 тәжірибелік сынақтан тұратын екі блокты аяқтады, олар жиі жауап бермеген немесе тым кеш жауап берген сирек жағдайларда әр блоктан кейін ауызша кері байланыс алды. Содан кейін олар әр шарт үшін барлығы 26-дан болатын 52 сынақтан тұратын төрт кезеңді аяқтады. Иллюзияға бейім адамдар («Қатысушылар» бөліміндегі критерийлерді қараңыз) нейровизуализация сессиясына шақырылды.&lt;/p&gt;\n&lt;p&gt;fMRI сессиясы кезінде сол эксперимент әрқайсысы 104 сынақтан тұратын төрт жүріс түрінде ұсынылды. Сонымен қатар, біз pRF карталаудың төрт жүрісін өткіздік. Бұл ретте қатысушылар орталық фиксация нүктесіне қарады, ал қара-ақ шахмат тақтасының стимулдары фиксациядан 5,5 градус радиуста экран бойымен қозғалды. Атап айтқанда, біз MrVista-да «8 жолақ» стимулдар жиынтығын қолдандық, олар әрқайсысы 5,5 минуттық төрт жүрісте ұсынылды.&lt;/p&gt;\n&lt;h4 id=\"minez-khulykhty-taldau\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#minez-khulykhty-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлықты талдау&lt;/span&gt;&lt;/a&gt;Мінез-құлықты талдау&lt;/h4&gt;\n&lt;p&gt;Біз визуалды иллюзиялардың сәттілігін оларды бірдей ретиналды стимуляциясы бар, бірақ дыбысы бойынша ерекшеленетін және қабылдауда айырмашылық тудыратын жағдаймен салыстыру арқылы тексердік. «Иллюзорлық жарқыл» шарты үшін біз «Жарқылсыз» шартына қарағанда көбірек жарқылдар тіркелгенін салыстырдық, ал «Басылған жарқыл» иллюзиясы үшін біз «Нақты жарқыл» шартына қарағанда азырақ жарқылдар тіркелгенін бағаладық. Екі талдау да қалыпты таралмаған деректер үшін екі жақты Уилкоксон рангілік сомалар тестімен жүзеге асырылды. Біз сондай-ақ қатысушылардың нақты және иллюзорлық қабылдауларына деген сенім деңгейін сандық түрде бағаладық.&lt;/p&gt;\n&lt;h4 id=\"skaner-hattamasy-zhaene-tizbekter\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#skaner-hattamasy-zhaene-tizbekter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сканер хаттамасы және тізбектер&lt;/span&gt;&lt;/a&gt;Сканер хаттамасы және тізбектер&lt;/h4&gt;\n&lt;p&gt;MRI кескіндері 7T MAGNETOM Terra (Siemens Healthcare, Эрланген, Германия) сканерінде (8 тарату және 32 қабылдау арнасымен жабдықталған бас катушкасы (Nova Medical, Уилмингтон, АҚШ), Функционалды бейнелеу зертханасында (Лондон Университеттік колледжі)) алынды. Мидың ішінара функционалды кескіндері 3D EPI хаттамасымен жиналды (T2* салмақты, Көлемді алу уақыты = 3,264 секунд, TR = 68,00 мс, TE = 26,08, Кеңістіктік ажыратымдылық: 0,8 мм изотропты. Көру аймағы: визуалды қыртысты, самай бөлігін және гиппокампты қамтуды оңтайландыру үшін бұрыш астында. Бұрыш әр қатысушы үшін жеке бапталды). Сынақаралық джиттер (~190-210 көлем) салдарынан өзгеретін көлемдері бар төрт EPI жүрісі және pRF карталау үшін әр жүріс үшін көлемдер жиналды. Жүріс басында қарама-қарсы PE бағыты бар төрт жалған көлем алынды, олар алдын ала өңдеу құбырына енгізілмеді.&lt;/p&gt;\n&lt;p&gt;Біз құрылымдық деректерді 68 мс TR және 2,54 мс TE бар, үлкенірек бастарды есепке алу үшін 240 орнына 288 кесіндіден тұратын өзгертілген плита өлшемімен - 15,0 градус бұрыш астында MP2RAGE арқылы жинадық. Артефактілердің алдын алу үшін майды басу қолданылды.&lt;/p&gt;\n&lt;h4 id=\"nejrovizualizaciyany-aldyn-ala-oengdeu\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#nejrovizualizaciyany-aldyn-ala-oengdeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нейровизуализацияны алдын ала өңдеу&lt;/span&gt;&lt;/a&gt;Нейровизуализацияны алдын ала өңдеу&lt;/h4&gt;\n&lt;p&gt;MP2RAGE құрылымдық ми сканерлері FreeSurfer 7.3.2 нұсқасымен алдын ала өңделді. Ми кескіні бас сүйегінен тазартылды және қатты ми қабығы терең оқытуға негізделген «synth strip» алгоритмі көмегімен автоматты түрде алынып тасталды. Қалған қатты қабықты алып тастау процесті жеңілдету үшін пиалды және ақ зат қабаттарын жақындату алдында қолмен жүзеге асырылды. Freesurfer ұсынған автоматты парцелляцияны пайдаланып, біз талдауымыз үшін воксельдерді бөліп алу үшін қолданылған бастапқы визуалды қыртыс, гиппокамп және жоғарғы самай қыртысы үшін анатомиялық белгілерді бөліп алдық.&lt;/p&gt;\n&lt;h4 id=\"khyrtystykh-khabat-anykhtamasy\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#khyrtystykh-khabat-anykhtamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қыртыстық қабат анықтамасы&lt;/span&gt;&lt;/a&gt;Қыртыстық қабат анықтамасы&lt;/h4&gt;\n&lt;p&gt;Біз қыртысты үш тең көлемді қабатқа деңгейлі жиын әдісі арқылы бөлдік, бұл қыртыстық қабаттар барлық иірімдер мен сайлар бойымен көлемді сақтайды деген идеяға негізделеді. Қыртыстық көлем ақ зат пен пиалды беттер арасындағы қашықтықты жергілікті қисықтықты ескере отырып есептеу үшін пайдаланылды. Әр воксель үшін біз оның бес бөлімнің (терең, орта және беткей сұр зат қабаттары, ақ зат және ми-жұлын сұйықтығы) әрқайсысында қаншалықты орналасқанын есептедік. Егер воксель көлемінің &amp;gt;50% бөлігі сол қабат ішінде болса, әр воксель үш сұр зат қабатының біріне тағайындалды.&lt;/p&gt;\n&lt;p&gt;fMRI-ді алдын ала өңдеу&lt;/p&gt;\n&lt;p&gt;3D EPI деректері Statistical Parametric Mapping 12 (SPM12) нұсқасы көмегімен алдын ала өңделді. NORDIC термиялық шуды алып тастау және SnR-ді жақсарту үшін қолданылды. Қайта тегістеу қозғалысты бағалау және түзету үшін жүзеге асырылды. Біз жоғары кеңістіктік ажыратымдылықты сақтау үшін ешқандай кеңістіктік тегістеуді қолданбадық. Құрылымдық деректер екі кезеңді процесс көмегімен орташа EPI көлеміне корегистрацияланды. Біріншіден, SPM12-де көлемге негізделген корегистрация қолданылды және кейіннен фазалық кодтау бағытындағы бұрмалауларды түзету үшін рекурсивті шекараға негізделген тіркеу (RBR) пайдаланылды. RBR бірінші кезекте аффинді шекараға негізделген тіркеуді (BBR) қыртыстың барған сайын кішірек бөліктеріне жеті еркіндік дәрежесімен, үш өлшемде айналу және трансляциямен рекурсивті түрде қолданады, тек бұрмалауларды түзетуге мүмкіндік беру үшін фазалық кодтау бағыты бойымен масштабтайды. Алты рекурсияның әрқайсысында таңдалған қыртыстық тор екіге бөлінді және оңтайлы тіркеу екі бөлікке де қолданылды, әр бөлік қайтадан екіге бөлініп, қайта тіркелді; бұл әр кезеңде (магнит өрісінің біркелкі еместігі салдарынан бұзылған) құрылымдық және функционалды көлем арасындағы ерекшелік пен сәйкестікті арттырды. Бөлінулер әр бөлік үшін тең мөлшердегі төбелерді алу үшін негізгі осьтер бойымен жүзеге асырылды.&lt;/p&gt;\n&lt;p&gt;pRF fMRI деректерінен біз әр воксель үшін орталық (x және y координатасы) және стандартты ауытқу (сигма) бар екі өлшемді Гаусс таралуы түріндегі популяциялық рецептивті аймақты бағалау үшін mrVista-ны қолдандық. Біз pRF тапсырмасы кезінде төмен түсіндірілген дисперсияға (r2 &amp;lt; 10%) ие, сәйкессіз кішкентай рецептивті аймаққа (сигма &amp;lt; 0,2 визуалды градус бұрышы) немесе талдауымыз талап ететін кеңістіктік ерекшелікке ие болу үшін тым үлкен рецептивті аймаққа (сигма ≥ 1,3 визуалды градус бұрышы) ие болған воксельдерді алып тастадық.&lt;/p&gt;\n&lt;p&gt;pRF бағалауынан кейін, біз x-координаталары, y-координаталары және рецептивті аймақ өлшемдері карталарын тексеру арқылы бағаланған карталар визуалды қыртыстың күтілетін ретинотопиялық ұйымына сәйкес келетінін визуалды түрде тексердік. pRF бағалары визуалды аймақтағы белгілі бір орындарға бапталған воксельдерді таңдау үшін пайдаланылды.&lt;/p&gt;\n&lt;h4 id=\"retinotopiyalykh-oryndar-zhaene-roi-tangdau\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#retinotopiyalykh-oryndar-zhaene-roi-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ретинотопиялық орындар және ROI таңдау&lt;/span&gt;&lt;/a&gt;Ретинотопиялық орындар және ROI таңдау&lt;/h4&gt;\n&lt;p&gt;Біз V1 воксельдерін таңдадық, олардың рецептивті өрістері көру аймағындағы нақты қызығушылық аймақтарына (ROI) түсті (S2-сурет). Негізгі ретинотопиялық қызығушылық аймағы ортаңғы жарқылдың орны, яғни иллюзиялық жарқыл қабылданған орын (Illusory Flash сынақтарында) болды. Бақылау орны ретінде біз y-осі бойынша шағылысқан айналық кескінді қолдандық, осылайша әрбір орын үшін таңдалған воксельдер фиксация нүктесінен бірдей қашықтықта болғандықтан ұқсас нейрондық қасиеттерге ие болды. Әрбір орын үшін біз рецептивті өріс ортасы (x,y) жарқыл орнынан сигма шеңбері ішінде болатын воксельдерді таңдадық. fMRI сессиясынан кейінгі сауалнама (атап айтқанда, «екінші жарқылды дәл ортада көрдіңіз бе?» деген сұраққа жауап) иллюзиялық жарқылдың хабарланған орнында жеке вариативтілікті анықтады. Атап айтқанда, қатысқан 23 қатысушының үшеуі ортаңғы жарқылды әрқашан дәл ортада көргендерін айтты, ал қалған жиырма қатысушы оны кейде орталықтың сол және/немесе оң жағында да көргендерін хабарлады. Сондықтан «flash 2» қызығушылық аймағы көлденеңінен төрт есе кеңейтілді, бұл иллюзиялық қабылдауды қамтитын рецептивті өрістері бар мүмкіндігінше көп воксельдерді қосу үшін, сонымен бірге басқа екі жарқылмен кез келген қиылысудан аулақ болды. Соңында, бұл ретинотопиялық ROI үш кортикальды қабатқа — терең, ортаңғы, беткей (жоғарыны қараңыз) — бөлінді, олардың сәйкес воксельдер саны (орташа ± SEM) 89,30 ± 14,25, 77,61 ± 12,70, 87,22 ± 17,65 болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ROI (Region of Interest) — бұл мидың алдын ала белгіленген аймағы, оның белсенділігі бөлек талданады, ал ретинотопия — торқабықтағы нүктелер мен көру қыртысының бөліктері арасындағы сәйкестік.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"birinshi-denggejli-taldau\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#birinshi-denggejli-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бірінші деңгейлі талдау&lt;/span&gt;&lt;/a&gt;Бірінші деңгейлі талдау&lt;/h4&gt;\n&lt;p&gt;Task fMRI деректері үшін біз әрбір жүгіріс (run) үшін шартқа тән BOLD жауаптарын модельдеу үшін SPM12 көмегімен Жалпы сызықтық модельді (GLM) қолдандық. Бұл GLM-де біз тек қатысушылар дұрыс жауап берген бақылау сынақтарын («No Flash» және «Real Flash») және қатысушылар иллюзияны бастан кешірген иллюзия сынақтарын («Illusory Flash» және «Suppressed Flash») енгіздік. Қате және өткізіп алынған жауаптар бөлек регрессормен модельденді, олардың параметрлік бағалары талданбады. Бас қозғалысының параметрлері, олардың туындылары және туындылардың квадраты шулы регрессорлар ретінде енгізілді. Кейіннен деректер мен дизайн матрицасы төмен жиілікті сигнал ауытқуларын жою үшін жоғары жиілікті сүзгімен (кесу = 128 с) өңделді. Әрбір қатысушы және әрбір шарт үшін алынған воксельге арналған болжамды бета параметрлері жүгірістер бойынша орташаланды, бұл әрбір адам үшін төрт параметрлік баға жиынтығын берді. Жоғарыда сипатталған ретинотопиялық ROI әрбір шарт және әрбір ROI үшін воксель белсенділігі үлгілерін алу үшін пайдаланылды, олар үш кортикальды қабатқа бөлінді.&lt;/p&gt;\n&lt;h4 id=\"koepoelshemdi-taldau\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#koepoelshemdi-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көпөлшемді талдау&lt;/span&gt;&lt;/a&gt;Көпөлшемді талдау&lt;/h4&gt;\n&lt;p&gt;Иллюзиялардың бастапқы көру қыртысындағы нейрондық белсенділікті өзгерткенін талдау үшін біз көпөлшемді және бірөлшемді талдауды жүзеге асырдық. Көпөлшемді талдауда біз «қабылдау үлгісінің ұқсастығы» метрикасын есептедік: иллюзиялық сынақтар кезіндегі белсенділік пен қабылдау эквиваленті бар бақылау шарты арасындағы үлгі ұқсастығы, ретиналды эквивалентпен ұқсастықтан алынып тасталды (S1-сурет).&lt;/p&gt;\n&lt;p&gt;Бұл ортаңғы жарқыл орнына бапталған V1 воксельдері үшін әртүрлі шарттарға арналған болжамды BOLD белсенділік үлгілері арасындағы Пирсон корреляциясын есептеуді қамтиды — яғни иллюзиялар кейде орын алатын жер. Біз қалыпты үлестірілген корреляциялық баллдарды жасау үшін Фишердің z-трансформациясын қолдандық. Мысалы, «Illusory Flash» иллюзиясы үшін біз әрбір қатысушы үшін иллюзияны қабылдау кезіндегі ми белсенділігі үлгісі нақты жарқылды көру кезіндегіге қарағанда, жарқыл болмаған жағдайға қарағанда ұқсасырақ екенін есептедік. Яғни, біз «Illusory Flash» және «No Flash» арасындағы корреляцияны «Illusory Flash» және «Real Flash» арасындағы корреляциядан алып тастадық. Постдиктивті қабылдаудың V1 қабаттарына (дифференциалды) әсерін талдау үшін біз екі факторлы қайталанатын өлшемдер ANOVA (дисперсиялық талдау) өткіздік, мұнда «Қабат» (деңгейлері: терең, ортаңғы, беткей) және «Иллюзия түрі» (деңгейлері: «Illusory Flash», «Suppressed Flash») субъектішілік факторлар ретінде пайдаланылды. Біз иллюзиялар бойынша орташаланған қабылдау ақпаратының қабаттар арасында қалай ерекшеленетінін талдау үшін екі жақты t-тесттерді өткіздік. Соңында, біз терең қабаттар осы постдиктивті қабылдау ақпаратын кодтайды деген гипотезамызды бағаладық, ол үшін бір жақты Стьюдент t-тестін қолданып, оның нөлден айтарлықтай жоғары екенін тексердік. Біз валидация үшін дәл осы талдауды ретинотопиялық бақылау орнына қолдандық және әрбір иллюзия үшін жеке-жеке сол гипотезаны бағаладық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Постдиктивті қабылдау — бұл мидың сенсорлық стимулды стимулдың өзінен &lt;em&gt;кейін&lt;/em&gt; алынған ақпарат негізінде түсіндіру процесі, ал Фишердің z-трансформациясы статистикалық тесттер үшін корреляция коэффициенттерін қалыпқа келтіру үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"biroelshemdi-taldau\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#biroelshemdi-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бірөлшемді талдау&lt;/span&gt;&lt;/a&gt;Бірөлшемді талдау&lt;/h4&gt;\n&lt;p&gt;Бірөлшемді талдауда біз ортаңғы жарқыл орнына бапталған воксельдердің BOLD жауаптарының амплитудасын «Illusory Flash» және «No Flash» шарттары бойынша салыстырдық, оларды қатысушы бойынша орташалап, қатысушылар бойынша бір жақты Стьюдент t-тестін қолдандық. Валидация үшін біз ортаңғы жарқыл орнын «Real Flash» шарты кезінде фиксация үстіндегі айналық кескінімен салыстырдық.&lt;/p&gt;\n&lt;h4 id=\"akhparattykh-bajlanystylykh\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#akhparattykh-bajlanystylykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ақпараттық байланыстылық&lt;/span&gt;&lt;/a&gt;Ақпараттық байланыстылық&lt;/h4&gt;\n&lt;p&gt;Иллюзорлы сигналдардың көзін зерттеу үшін біз екі аймақ арасындағы өрнек ұқсастығының сынақтан сынаққа ковариациясын («Нақты жарқыл» корреляциясы минус «Жарқыл жоқ» корреляциясы) бағалау үшін ақпараттық байланыстылық талдауын енгіздік. Талдаудың сенімділігін оңтайландыру үшін біз қызығушылық тудыратын ретинотопиялық орналасуды барлық үш жарқылды қамтитындай етіп кеңейттік және осылайша сигнал-шу қатынасын арттырып, қабат бойынша воксель санын (орташа ± орташаның стандартты қатесі) көбейттік: терең — 179.04 ± 20.22; орташа — 160.22 ± 19.49; беткейлік — 192.00 ± 26.31.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ақпараттық байланыстылық — бұл ми аймақтары арасындағы ақпарат пен белсенділік өрнектерінің сынақтан сынаққа қалай берілетінін және келісіл түрде өзгеретінін бағалауға мүмкіндік беретін фМРТ талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әрбір сынақ үшін перцептивті ақпарат метрикасын алу үшін біз «Жарқыл жоқ» және «Нақты жарқыл» бақылау шарттары үшін орташа өрнекті әр қатысушы үшін жеке есептедік, ал перцептивті ақпаратты өлшеу үшін иллюстрациялық шарттар кезіндегі нейрондық жауаптардың бір бақылау шартына басқасына қарағанда қаншалықты ұқсас екенін әрбір сынақ негізінде есептеп шығардық. Біз бұл өрнекті әрбір қызығушылық аймағы (ROI) үшін бөліп алып, ROI жұптары арасындағы сынақаралық өрнектерді корреляцияладық. Нәтижесінде Фишердің z-трансформациясы арқылы нормаланған әрбір қатысушы үшін ми аймақтары арасындағы байланыстылық көрсеткіштері алынды.&lt;/p&gt;\n&lt;p&gt;Қай аймақ бастапқы көру қыртысына перцептивті ақпаратты кері қайтаруы мүмкін екенін талдау үшін біз V1-дің әрбір қабаты үшін ақпараттық байланыстылықты талдадық. Біз кандидаттық аймақтардың әрқайсысы — жоғарғы уақытша қыртыс (воксельдер: 28,787 ± 645.60) және гиппокамп (воксельдер: 12,638 ± 179.86) — мен әрбір V1 қабаты арасында бөлісілген перцептивті ақпаратты бір жақты Стьюденттің t-тесттері көмегімен салыстырдық. Валидация үшін біз ретинотопиялық бақылау нүктесі — үш жарқылдың айналық бейнесі үшін де осындай талдау жасадық.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f1.jpg\" alt=\"1-сурет. Эксперименталды парадигма және мінез-құлық нәтижелері. A) Жоғарыда: арасында қосымша дыбысы бар екі аудиовизуал\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Эксперименталды парадигма және мінез-құлық нәтижелері. A) Жоғарыда: арасында қосымша дыбысы бар екі аудиовизуалды стимулдар жұбын көрсету қосымша визуалды стимулды қабылдауға әкеледі; төменде: арасында қосымша жарқылы бар екі аудиовизуалды стимулдар жұбын көрсету осы қосымша жарқылдың басылуына әкеледі (Stiles et al. (5) негізінде бейімделген). B) Қатысушылар екі емес, үш жарқыл көргенін хабарлаған сынақтардың үлесі, әртүрлі жағдайлар үшін бөлек. Жағдайлардың визуалды бейнесін S1 суретінен қараңыз. Қара жолақтар орташа мәннің стандартты қателігін (SEM) білдіреді. *** p &amp;lt; 0.001.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f2.jpg\" alt=\"2-сурет. Екі постдиктивті иллюзия бойынша орташаланған V1 қабаттары бөлінісінде ортаңғы жарқыл (A) және бақылау (B) орна\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Екі постдиктивті иллюзия бойынша орташаланған V1 қабаттары бөлінісінде ортаңғы жарқыл (A) және бақылау (B) орналасқан жеріне бағытталған воксельдер үшін BOLD белсенділік үлгілеріндегі перцептивті үлгі ұқсастығы. Оң мәндер иллюзиялар тудырған белсенділік үлгілері бірдей перцепт тудыратын стимулдар тудырған белсенділік үлгілеріне көбірек ұқсас болғанын көрсетеді (мысалы, Иллюзорлы жарқыл × Шынайы жарқыл), ал теріс мәндер тор қабығының стимулы ұқсас, бірақ перцепттері басқа жағдайлармен үлкен ұқсастықты көрсетеді (мысалы, Иллюзорлы жарқыл × Жарқыл жоқ). Қателік жолақтары қатысушылар арасындағы орташа мәннің стандартты қателігін (SEM) көрсетеді. * p &amp;lt; 0.05.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f3.jpg\" alt=\"3-сурет. «Иллюзорлы жарқыл» иллюзиясы үшін V1 қабаттары бөлінісінде екінші жарқыл және бақылау орналасқан жеріне бағытта\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. «Иллюзорлы жарқыл» иллюзиясы үшін V1 қабаттары бөлінісінде екінші жарқыл және бақылау орналасқан жеріне бағытталған воксельдер үшін BOLD белсенділік үлгілеріндегі перцептивті үлгі ұқсастығы. A) Иллюзорлы жарқылдың орналасқан жеріне бағытталған воксельдердің перцептивті үлгі ұқсастығы. Оң мәндер белсенділік үлгілері бірдей перцепт тудыратын стимулдар (Шынайы жарқыл) тудырған белсенділік үлгілеріне көбірек ұқсас болғанын, ал теріс мәндер тор қабығының стимулы ұқсас, бірақ перцепттері басқа жағдайларға («Жарқыл жоқ») көбірек ұқсастықты көрсететінін білдіреді. B) Бақылау ретинотоpикалық орналасқан жеріне бағытталған воксельдер үшін ұқсас талдау. Қателік жолақтары қатысушылар арасындағы орташа мәннің стандартты қателігін (SEM) көрсетеді. * p &amp;lt; 0.05; ** p &amp;lt; 0.01.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f4.jpg\" alt=\"4-сурет. «Басылған жарқыл» иллюзиясы үшін V1 қабаттары бөлінісінде екінші жарқыл және бақылау орналасқан жеріне бағыттал\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. «Басылған жарқыл» иллюзиясы үшін V1 қабаттары бөлінісінде екінші жарқыл және бақылау орналасқан жеріне бағытталған воксельдер үшін BOLD белсенділік үлгілеріндегі перцептивті үлгі ұқсастығы (сол жақта); ROI қабылданатын стимулдарға қатысты экранда көрсетілген (оң жақта). A) Иллюзорлы жарқылдың орналасқан жеріне бағытталған воксельдердің перцептивті үлгі ұқсастығы. Оң мәндер белсенділік үлгілері бірдей перцепт тудыратын стимулдарға («Жарқыл жоқ») көбірек ұқсас болғанын, ал теріс мәндер тор қабығының стимулы ұқсас, бірақ перцепттері басқа жағдайларға («Шынайы жарқыл») көбірек ұқсастықты көрсететінін білдіреді. B) Бақылау ретинотоpикалық орналасқан жеріне бағытталған воксельдер үшін ұқсас талдау. Қателік жолақтары қатысушылар арасындағы орташа мәннің стандартты қателігін (SEM) көрсетеді. * p &amp;lt; 0.05.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi-f5.jpg\" alt=\"5-сурет. «Иллюзорлы жарқыл» иллюзиясы үшін STC және V1 қабаттары арасындағы ақпараттық байланыс (IC). A) Сол жақта жарқы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. «Иллюзорлы жарқыл» иллюзиясы үшін STC және V1 қабаттары арасындағы ақпараттық байланыс (IC). A) Сол жақта жарқылдар тізбегіне (сол, ортаңғы және оң жақ жарқыл орындарының бірігуі) бағытталған STC және V1 воксельдері арасындағы IC. Жоғарырақ мәндер сынақтар бойынша бөлісілетін перцептивті үлгі ұқсастығының көбірек екенін білдіреді. Қателік жолақтары қатысушылар арасындағы орташа мәннің стандартты қателігін (SEM) көрсетеді. * p &amp;lt; 0.05. B) Бақылау орналасқан жеріне бағытталған воксельдер үшін ұқсас талдау. C) V1 алдымен ұсынылған визуалды стимулдарды қалай өңдейтінін, бірақ кейін STC-дан жаңартылған перцептті ала алатынын көрсететін схемалық сурет.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-09-23/the-post-hoc-montage-of-perception-deep-layers-of-primary-vi.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мидағы&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;постдикция&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;механизмдері&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;7Т МРТ және&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аудиовизуалды&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;иллюзиялар&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;V1 терең&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қабаттарының&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белсенділігі&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қабылдауды&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ретроспективті&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;түзету&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;
